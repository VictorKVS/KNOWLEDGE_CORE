schema_version: "1.0"
id: learning-site-model
name: Engineering Knowledge Learning Portal Model

principle: one_knowledge_graph_many_views

primary_navigation:
  - learn
  - problems
  - programming_practice
  - languages
  - evidence
  - benchmarks
  - security

filters:
  level: [junior, middle, senior]
  language: [python, go, cpp]
  domain:
    - search
    - sorting
    - data_structures
    - graphs
    - patterns
    - concurrency
    - databases
    - networking
    - reliability
    - security
    - performance
  view: [explanation, elegant, production, tests, evidence]
  evidence_state: [hypothesis, documented, measured, verified, reusable]

learning_object_page:
  header:
    - title
    - level
    - domains
    - languages
    - evidence_state
  default_view:
    - problem
    - intuition
    - core_idea
    - recommended_path
  progressive_tabs:
    - junior
    - middle
    - senior
    - elegant
    - production
    - python
    - go
    - cpp
    - tests
    - security
    - evidence
  side_panel:
    - prerequisites
    - alternatives
    - related_objects
    - decision_memory

progressive_disclosure:
  beginner_default:
    hide:
      - raw_claim_graph
      - full_source_metadata
      - benchmark_environment_details
    reveal_on_demand: true
  expert_default:
    show:
      - tradeoffs
      - evidence_state
      - benchmark_links
      - security_notes

agent_interface:
  consume:
    - stable_ids
    - yaml_metadata
    - relationship_graph
    - evidence_state
    - applicability_constraints
  never_infer_from_ui_only: true

future_generation:
  static_site_ready: true
  api_ready: true
  search_index_ready: true
  graph_view_ready: true
