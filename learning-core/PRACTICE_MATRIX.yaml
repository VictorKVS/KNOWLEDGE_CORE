schema_version: "1.0"
id: programming-practice-matrix
name: Modern Programming Practice Matrix

principle: >-
  Build depth from concrete programming practice. Algorithmic research belongs to Analyst/Research;
  Programming Agent consumes validated briefs and focuses on implementation quality, patterns,
  strategies, security, reliability and elegant production code.

tracks:
  foundations:
    topics:
      - values_types_and_representation
      - control_flow
      - functions_and_composition
      - collections
      - errors_and_contracts
      - input_output
      - modules_and_packages
    junior: implement_correctly
    middle: choose_representation_and_boundaries
    senior: minimize_semantic_and_operational_complexity

  data_and_state:
    topics:
      - mutable_vs_immutable_state
      - ownership_and_lifetime
      - copying_and_aliasing
      - indexing_and_caching
      - serialization
      - persistence_boundaries
    junior: make_state_explicit
    middle: choose_state_strategy
    senior: control_state_across_system_boundaries

  patterns_and_composition:
    topics:
      - direct_solution
      - strategy
      - adapter
      - facade
      - decorator
      - iterator
      - repository
      - dependency_injection
      - pipeline
      - state_machine
      - event_driven_composition
    rule: named_pattern_requires_demonstrated_pressure

  defensive_programming:
    topics:
      - validation
      - fail_fast_invariants
      - safe_defaults
      - resource_limits
      - timeouts
      - cancellation
      - idempotency
      - retry_policy
      - partial_failure
      - graceful_degradation

  testing:
    topics:
      - unit_tests
      - integration_tests
      - contract_tests
      - property_tests
      - fuzzing
      - regression_tests
      - failure_tests
      - performance_tests

  concurrency:
    topics:
      - sequential_first
      - task_parallelism
      - data_parallelism
      - async_io
      - threads
      - processes
      - goroutines
      - channels
      - synchronization
      - bounded_queues
      - backpressure
      - structured_concurrency

  api_and_integration:
    topics:
      - function_api_design
      - http_api_design
      - versioning
      - compatibility
      - serialization_contracts
      - database_boundaries
      - messaging
      - external_service_adapters

  performance:
    topics:
      - measurement_first
      - profiling
      - algorithmic_cost_from_analyst_brief
      - allocation_and_copy_cost
      - locality
      - batching
      - caching
      - indexing
      - benchmark_interpretation

  security:
    topics:
      - trust_boundaries
      - untrusted_input
      - secrets
      - authentication_integration
      - authorization_checks
      - dependency_risk
      - injection_prevention
      - unsafe_memory_operations
      - logging_safety
      - abuse_cases

  production:
    topics:
      - configuration
      - logging
      - metrics
      - tracing
      - health_checks
      - startup_shutdown
      - deployment_contract
      - migrations
      - rollback
      - dependency_pinning
      - reproducible_builds

  elegance:
    topics:
      - invariant_first
      - representation_transform
      - remove_accidental_state
      - reduce_moving_parts
      - olympiad_core
      - production_hardening
      - proof_sketch
      - readable_compactness

languages:
  python:
    emphasize: [idiomatic_collections, iterators, context_managers, exceptions, typing, async_io]
  go:
    emphasize: [explicit_errors, interfaces, goroutines, channels, context, simple_composition]
  cpp:
    emphasize: [value_semantics, RAII, ownership, lifetime, templates_when_justified, memory_safety]

required_views_for_mature_topic:
  - junior
  - middle
  - senior
  - elegant
  - production
  - tests
  - security
  - alternatives
  - evidence_links

maturity_states:
  - planned
  - drafted
  - tested
  - evidence_linked
  - production_reviewed
  - reusable
