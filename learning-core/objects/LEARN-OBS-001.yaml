schema_version: "1.0"
id: LEARN-OBS-001
title: Observability for Decisions
kind: learning-object
status: drafted
domains: [observability, reliability, production]
levels:
  junior:
    goal: emit useful structured logs without secrets
  middle:
    goal: choose logs metrics and traces according to diagnostic questions
  senior:
    goal: design observability around failure detection, diagnosis, capacity and operational decisions
core_idea: Telemetry is useful only when it answers an operational question.
elegant_view: Instrument boundaries and state transitions rather than logging everything.
production_view:
  requires: [event_taxonomy, correlation, cardinality_control, retention_awareness, sensitive_data_policy]
anti_patterns: [log_everything, metrics_without_question, high_cardinality_by_default, secrets_in_logs]
reusable_lessons:
  - observability_should_reduce_time_to_decision_not_increase_data_volume
