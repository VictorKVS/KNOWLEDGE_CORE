schema_version: "1.0"
id: LEARN-TEST-001
title: Testing Strategy by Risk
kind: learning-object
status: drafted
domains: [testing, reliability]
levels:
  junior:
    goal: cover normal, boundary and error cases
  middle:
    goal: choose unit, integration, contract, property and fuzz tests by failure risk
  senior:
    goal: design a verification strategy around confidence gaps, system boundaries and costly failures
core_idea: Test depth should follow risk and uncertainty, not a fixed pyramid ritual.
elegant_view: Use the smallest set of tests that gives strong confidence in the important invariants.
production_view:
  requires: [deterministic_core_tests, boundary_tests, regression_cases, failure_cases, environment_scope]
anti_patterns: [test_count_as_quality_metric, mock_everything, only_happy_path, flaky_tests_as_normal]
analyst_handoff:
  required_when: [statistical_confidence_or_experimental_methodology_is_nontrivial]
reusable_lessons:
  - tests_are_evidence_about_specific_behavior_under_specific_conditions
