id: LEARN-SECRETS-001
title: Secrets and Configuration Boundaries
kind: learning-object
maturity: drafted
levels: [junior, middle, senior]
domains: [security, configuration, production]
languages: [python, go, cpp]

problem:
  summary: Separate ordinary configuration from secret material and keep both explicit, validated and operationally manageable.

junior:
  focus:
    - never hardcode secrets
    - read configuration through established project mechanisms
    - validate required settings at startup
    - avoid printing secrets in errors or logs

middle:
  focus:
    - separate secret and non-secret configuration lifecycles
    - centralize configuration parsing and validation
    - support safe defaults only where absence is non-dangerous
    - make rotation possible without code edits

senior:
  focus:
    - define secret ownership, scope and rotation boundaries
    - minimize secret distribution
    - distinguish bootstrap secrets from runtime credentials
    - design for revocation, incident response and environment isolation

core_principles:
  - configuration_is_input_to_the_program
  - secrets_are_high_risk_configuration_with_stricter_controls
  - validate_early
  - expose_minimum_secret_scope
  - never_rely_on_obscurity

anti_patterns:
  - secrets_in_source_control
  - secrets_in_cli_history
  - secrets_in_logs
  - one_shared_secret_for_many_components
  - configuration_scattered_across_code

production_view:
  requirements:
    - typed_or_structured_configuration
    - startup_validation
    - secret_redaction
    - documented_rotation_path
    - environment_separation

security_review:
  required: true

reusable_lessons:
  - make_configuration_explicit_and_secrets_narrow
