schema_version: "1.0"
id: engineering-knowledge
name: Engineering Knowledge
type: evidence-driven-knowledge-base
status: active

purpose:
  human: Explain engineering choices clearly with references, alternatives and examples.
  agent: Retrieve validated decision rules, evidence and implementations without inventing unsupported preferences.

domains:
  languages:
    - python
    - go
    - cpp
  engineering:
    - algorithms
    - data-structures
    - architecture
    - databases
    - networking
    - concurrency
    - testing
    - performance
    - reliability
    - devsecops
    - application-security

selection_policy:
  objective: smallest-reliable-solution-that-satisfies-constraints
  required_steps:
    - identify-problem
    - identify-context
    - identify-constraints
    - retrieve-alternatives
    - retrieve-evidence
    - compare-tradeoffs
    - select-decision
    - implement
    - test
    - security-review
    - measure-when-relevant

preferred_evidence:
  - primary-specification
  - official-documentation
  - peer-reviewed-research
  - academic-publication
  - authoritative-book
  - official-conference-material
  - vendor-engineering-documentation
  - reproducible-benchmark
  - independent-engineering-report
  - community-source

evidence_states:
  - measured
  - documented
  - derived
  - expert-estimate
  - unknown

quality_dimensions:
  - correctness
  - reliability
  - security
  - performance
  - memory
  - maintainability
  - complexity
  - portability
  - testability
  - observability
  - operational-cost
  - dependency-risk

relationships:
  parent: https://github.com/VictorKVS/VictorKVS
  used_by:
    - mindforge
    - programming-agent
    - architect-agent
    - security-agent
  related:
    - security-knowledge
    - product-knowledge
    - ai-neural-networks
