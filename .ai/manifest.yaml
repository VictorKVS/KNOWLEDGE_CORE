schema_version: "1.1"
id: engineering-knowledge
name: Engineering Knowledge
type: evidence-driven-knowledge-base
status: active

purpose:
  human: Explain engineering choices clearly with references, alternatives and examples.
  agent: Retrieve validated claims, decision rules, evidence and implementations without inventing unsupported preferences.

domains:
  languages:
    - python
    - go
    - cpp
  engineering:
    - algorithms
    - data-structures
    - architecture
    - databases
    - networking
    - concurrency
    - testing
    - performance
    - reliability
    - devsecops
    - application-security

knowledge_objects:
  - SRC: source-and-provenance
  - CLM: evidence-claim
  - ALG: algorithm-selection
  - DS: data-structure-selection
  - PROB: problem-record
  - ADR: engineering-decision
  - BENCH: benchmark
  - EXP: experiment
  - DM: verified-decision-memory

selection_policy:
  objective: smallest-reliable-solution-that-satisfies-constraints
  required_steps:
    - identify-problem
    - identify-context
    - identify-constraints
    - retrieve-similar-decisions
    - retrieve-relevant-claims
    - inspect-supporting-and-conflicting-evidence
    - retrieve-alternatives
    - compare-tradeoffs
    - select-decision
    - implement
    - test
    - security-review
    - measure-when-relevant
    - capture-reusable-learning

retrieval_order:
  fast_path:
    - decision-memory
    - reviewed-claims
    - linked-evidence-on-demand
  adapt_path:
    - multiple-similar-decisions
    - reviewed-claims
    - sources-and-measurements
  research_path:
    - primary-sources
    - authoritative-sources
    - conflicting-evidence
    - experiments-and-benchmarks

preferred_evidence:
  - primary-specification
  - official-documentation
  - peer-reviewed-research
  - academic-publication
  - authoritative-book
  - official-conference-material
  - vendor-engineering-documentation
  - reproducible-benchmark
  - independent-engineering-report
  - community-source

evidence_states:
  - measured
  - documented
  - derived
  - expert-estimate
  - unknown

policies:
  retrieval: .ai/retrieval-policy.yaml
  evidence: .ai/evidence-policy.yaml

quality_dimensions:
  - correctness
  - reliability
  - security
  - performance
  - memory
  - maintainability
  - complexity
  - portability
  - testability
  - observability
  - operational-cost
  - dependency-risk

relationships:
  parent: https://github.com/VictorKVS/VictorKVS
  used_by:
    - mindforge
    - programming-agent
    - architect-agent
    - security-agent
  related:
    - security-knowledge
    - product-knowledge
    - ai-neural-networks
