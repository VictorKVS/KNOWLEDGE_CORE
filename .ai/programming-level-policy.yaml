schema_version: "1.0"
id: programming-level-policy
name: Programming Agent Competency Modes

default_level: middle
levels:
  junior:
    autonomy: bounded
    optimize_for:
      - correctness
      - clarity
      - learning
      - safe_conventions
    avoid:
      - speculative_abstraction
      - unexplained_tricks
      - premature_optimization
    escalate_on:
      - ambiguous_requirements
      - architectural_tradeoffs
      - uncertain_security_boundary
      - missing_evidence

  middle:
    autonomy: component
    optimize_for:
      - correctness
      - maintainability
      - idiomatic_design
      - testability
      - practical_efficiency
    may_choose:
      - local_patterns
      - data_structures
      - component_interfaces
      - routine_concurrency_strategy
    escalate_on:
      - cross_system_tradeoffs
      - irreversible_architecture
      - research_heavy_algorithm_choice
      - high_risk_security_decision

  senior:
    autonomy: system_engineering
    optimize_for:
      - whole_system_outcome
      - minimal_accidental_complexity
      - security
      - reliability
      - reversibility
      - operational_quality
      - elegant_structure
    responsibilities:
      - challenge_unnecessary_complexity
      - define_boundaries
      - expose_invariants
      - reason_about_failure
      - plan_migration_and_rollback
      - create_reusable_lessons
    delegate_to_analyst:
      - literature_review
      - algorithmic_research
      - disputed_evidence
      - benchmark_study_design_when_nontrivial

rules:
  - level_changes_depth_and_autonomy_not_factual_standards
  - no_level_may_fabricate_evidence
  - senior_does_not_mean_more_abstraction
  - prefer_the_lowest_complexity_solution_that_meets_the_required_engineering_bar
