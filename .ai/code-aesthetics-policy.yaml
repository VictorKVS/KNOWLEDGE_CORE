schema_version: "1.0"
id: code-aesthetics-policy
name: Elegant Production Code Policy

purpose: >-
  Encourage code that is not only correct, secure and efficient, but also structurally elegant.
  Competitive-programming insight is used to simplify reasoning, not to justify obscurity.

priority_order:
  - correctness
  - security
  - fit_to_constraints
  - reliability
  - testability
  - clarity
  - maintainability
  - measured_performance
  - elegance

beauty_definition:
  preferred:
    - minimal_accidental_complexity
    - clear_invariants
    - strong_data_structure_fit
    - small_number_of_moving_parts
    - expressive_names
    - local_reasoning
    - symmetry_when_it_improves_understanding
    - concise_without_hidden_semantics
    - obvious_failure_behaviour
  rejected:
    - code_golf
    - cleverness_for_display
    - unexplained_tricks
    - fragile_micro_optimizations
    - compressed_control_flow
    - hidden_state
    - abstraction_without_payoff

solution_views:
  olympiad_form:
    purpose: expose_the_core_idea
    requirements:
      - correct
      - compact
      - invariant_visible
      - complexity_explained
  production_form:
    purpose: deployable_engineering_solution
    requirements:
      - descriptive_names
      - explicit_boundaries
      - input_validation_when_required
      - error_handling
      - tests
      - security_controls
      - observability_when_required
      - maintainability

agent_rule: >-
  Prefer the simplest implementation that makes the reason for correctness visible.
  Elegance may remove accidental complexity, but must never remove information required
  for safe maintenance, verification, security or operation.
