cross_case_guardrails:
  - id: PRACTICE-2026-GUARD-001
    rule: >
      A recognized legal database reproduction may support AUTHORITATIVE_SECONDARY_ONLY claims but
      MUST NOT be upgraded to PRIMARY_OFFICIAL or IMMUTABLE_PRIMARY without the official act.
  - id: PRACTICE-2026-GUARD-002
    rule: >
      A court press-page reference to a case is evidence that the case is being referenced by an
      official court source; it is not a substitute for the operative judicial act or its reasoning.
  - id: PRACTICE-2026-GUARD-003
    rule: >
      Discovery of a direct kad.arbitr.ru document URL without successful retrieval MUST preserve
      status PENDING and MUST NOT create a hash, byte-size claim or immutable evidence record.
  - id: PRACTICE-2026-GUARD-004
    rule: >
      Part 13/14 leak cases MUST NOT be represented as turnover-fine cases under parts 15/18 unless
      repeat-offense and turnover-base statutory conditions are separately proven.
  - id: PRACTICE-2026-GUARD-005
    rule: >
      Different outcomes in early cases must trigger comparison of entity status, event facts,
      sanction rules, procedural stage and mitigation evidence rather than a claim of inconsistency.

