scope_statement: >-
  Complete normalized coverage of section 4.13 measures AVZ.1-AVZ.4 for
  antimalware protection of devices, email, network traffic and suspicious
  objects: twenty-seven implementation atoms, six documentation items, nine
  enhancements and all twenty-four appendix-2 cells. Product configurations,
  scan schedules and near-real-time thresholds remain separate operator or
  product-profile decisions where the source states no universal value.

