measures:
  - code: "ЗИВ.1"
    title: "Идентификация и аутентификация"
    purpose: PREVENT_ACCESS_BY_UNIDENTIFIED_OR_UNAUTHENTICATED_IOT_DEVICES
    implementation:
      - IDENTIFY_IOT_DEVICES_IN_ACCORDANCE_WITH_IAF_2
      - IDENTIFY_BY_LOGICAL_NAME_LOGICAL_ADDRESS_PHYSICAL_ADDRESS_OR_COMBINATION
      - AUTHENTICATE_IOT_DEVICES_USING_AUTHENTICATION_PROTOCOLS
      - PROHIBIT_IOT_AUTHENTICATION_WITH_DEFAULT_PASSWORDS
    documentation: []
    enhancements:
      - {number: 1, rule: IDENTIFY_IOT_DEVICES_WITH_PRIVATE_PSEUDONYMOUS_IDENTIFIERS_NOT_REVEALING_REAL_NAME_OR_PURPOSE}
      - {number: 2, rule: AUTHENTICATE_IOT_DEVICES_USING_SECURITY_CERTIFICATES}
      - {number: 3, rule: MUTUALLY_AUTHENTICATE_IOT_DEVICE_AND_INTERACTING_DEVICE_BEFORE_INFORMATION_EXCHANGE}
      - {number: 4, rule: AUTHENTICATE_IOT_DEVICES_USING_UNIQUE_EMBEDDED_AUTHENTICATION_MEANS}
    matrix:
      base: {K3: PLUS, K2: PLUS, K1: PLUS}
      enhancements: {K3: [], K2: [], K1: []}

  - code: "ЗИВ.2"
    title: "Управление доступом"
    purpose: PREVENT_UNAUTHORIZED_ACCESS_TO_IOT_DEVICES
    implementation:
      - DEFINE_IOT_ACCESS_CONTROL_METHODS_IN_ACCORDANCE_WITH_UPD_1_TO_UPD_9
      - DEFINE_IOT_DEVICE_TYPES_PERMITTED_IN_INFORMATION_SYSTEM
      - DEFINE_PERMITTED_WIRELESS_WIRED_SWITCHED_AND_OTHER_ACCESS_TYPES
      - DEFINE_IOT_INTERACTION_PROTOCOLS_PERMITTED_IN_INFORMATION_SYSTEM
      - APPLY_LEAST_PRIVILEGE_WHEN_GRANTING_IOT_DEVICE_ACCESS
    documentation: []
    enhancements:
      - {number: 1, rule: CENTRALLY_MANAGE_IOT_DEVICE_ACCESS}
      - {number: 2, rule: MONITOR_AND_CONTROL_IOT_ACCESS_TO_DETECT_UNAUTHORIZED_CONNECTIONS_TO_INFORMATION_SYSTEM}
      - {number: 3, rule: CONTROL_UNAUTHORIZED_CHANGES_TO_IOT_DEVICE_SETTINGS}
      - {number: 4, rule: DETERMINE_IOT_DEVICE_LOCATION}
      - {number: 5, rule: BLOCK_INFORMATION_SYSTEM_ACCESS_FROM_UNAUTHORIZED_IOT_DEVICE}
      - {number: 6, rule: FILTER_SENSOR_ACTUATOR_AND_OTHER_IOT_MESSAGES_AND_COMMANDS_TO_ALLOW_ONLY_PERMITTED_MESSAGES_AND_COMMANDS}
      - {number: 7, rule: PROTECT_IOT_NETWORK_DATA_USING_CRYPTOGRAPHIC_METHODS_IN_ACCORDANCE_WITH_RUSSIAN_LAW}
      - {number: 8, rule: PROHIBIT_WIRELESS_CHANNELS_FOR_IOT_DEVICE_INFORMATION_TRANSMISSION}
      - {number: 9, rule: ISOLATE_IOT_DEVICES_AND_IOT_NETWORK_FROM_INTERNET_AND_OR_OTHER_PUBLIC_COMMUNICATION_NETWORKS}
    matrix:
      base: {K3: PLUS, K2: PLUS, K1: PLUS}
      enhancements: {K3: [], K2: [], K1: []}

  - code: "ЗИВ.3"
    title: "Защита данных"
    purpose: PREVENT_IOT_DATA_LEAKAGE_UNAUTHORIZED_MODIFICATION_OR_ACCESS_RESTRICTION
    implementation:
      - INVENTORY_IOT_DEVICES_TO_DETECT_UNUSED_AND_UNAPPROVED_DEVICES
      - ALLOW_CONNECTION_ONLY_TO_PERMITTED_IOT_DEVICES_FOR_ESTABLISHED_FUNCTIONS
      - RESTRICT_FORMAT_OF_DATA_AND_COMMANDS_INPUT_TO_IOT_DEVICES
      - DISABLE_UNUSED_IOT_CONNECTION_AND_COMMUNICATION_PROTOCOLS
      - SEGMENT_IOT_DEVICE_NETWORKS_SEPARATELY_WITHIN_INFORMATION_SYSTEM
      - PROTECT_IOT_DATA_FROM_DISCLOSURE_MODIFICATION_AND_FALSE_DATA_INJECTION_BEYOND_CONTROLLED_ZONE
      - DISABLE_UNUSED_IOT_DEVICE_FUNCTIONAL_CAPABILITIES
    documentation: []
    enhancements:
      - {number: 1, rule: PREVENT_DATA_OR_COMMAND_INPUT_TO_IOT_DEVICES_THROUGH_RESTRICTIVE_INPUT_INTERFACES}
      - {number: 2, rule: ANALYZE_IOT_NETWORK_TRAFFIC_TO_DETECT_COMPUTER_ATTACK_SIGNS}
    matrix:
      base: {K3: PLUS, K2: PLUS, K1: PLUS}
      enhancements: {K3: [], K2: [1], K1: [1]}

  - code: "ЗИВ.4"
    title: "Контроль целостности"
    purpose: ENSURE_IOT_DEVICE_INTEGRITY
    implementation:
      - CONTROL_IOT_HARDWARE_COMPONENT_INTEGRITY_AND_DETECT_UNAUTHORIZED_NEW_DEVICES
      - CONTROL_IOT_SOFTWARE_COMPOSITION_AND_DETECT_UNAUTHORIZED_NEW_SOFTWARE
      - CONTROL_INTEGRITY_OF_IOT_NETWORK_SOFTWARE_UPDATES
      - CONTROL_INTEGRITY_OF_IOT_SOFTWARE_CONFIGURATION_FILES
      - ANALYZE_IOT_DEVICE_FIRMWARE_VULNERABILITIES
      - WHEN_VULNERABILITIES_ARE_FOUND_UPDATE_TO_AVAILABLE_FIRMWARE_VERSION_WITHOUT_KNOWN_VULNERABILITIES
    documentation: []
    enhancements:
      - {number: 1, rule: CONTROL_IOT_FIRMWARE_INTEGRITY_BY_VERIFYING_SECURITY_CERTIFICATE_AND_OR_CHECKSUMS}
      - {number: 2, rule: CONTROL_ABSENCE_OF_UNAUTHORIZED_IOT_CONFIGURATION_CHANGES_WEEKLY_OR_AT_SHORTER_SYSTEM_DEFINED_INTERVAL}
      - {number: 3, rule: DETECT_AND_BLOCK_EXECUTION_OF_IOT_SOFTWARE_WITH_BROKEN_INTEGRITY}
    matrix:
      base: {K3: PLUS, K2: PLUS, K1: PLUS}
      enhancements: {K3: [], K2: [], K1: []}

  - code: "ЗИВ.5"
    title: "Регистрация, анализ и реагирование на события безопасности"
    purpose: DEFINE_REGISTER_ANALYZE_AND_RESPOND_TO_IOT_SECURITY_EVENTS
    implementation:
      - REGISTER_IOT_DEVICE_SECURITY_EVENTS_IN_ACCORDANCE_WITH_RSB_1_TO_RSB_5
      - ANALYZE_REGISTERED_EVENTS_AND_RESPOND_TO_IDENTIFIED_COMPUTER_INCIDENTS
    documentation: []
    enhancements:
      - {number: 1, rule: NOTIFY_INFORMATION_SYSTEM_SECURITY_ADMINISTRATOR_OF_IDENTIFIED_COMPUTER_INCIDENT_SIGNS}
      - {number: 2, rule: BLOCK_AND_OR_ISOLATE_IOT_DEVICES_WITH_IDENTIFIED_COMPUTER_INCIDENTS}
    matrix:
      base: {K3: PLUS, K2: PLUS, K1: PLUS}
      enhancements: {K3: [], K2: [1], K1: [1]}

