  immutable_official_bytes: PENDING

applicability:
  trigger: ENDPOINT_DEVICE_IS_WITHIN_INFORMATION_SYSTEM_OR_OPERATOR_INFRASTRUCTURE
  rule: APPLY_MEASURE_WHEN_CLASS_MATRIX_AND_SELECTION_PIPELINE_SELECTS_IT_AND_ENDPOINT_TRIGGER_IS_MET
  guard: DO_NOT_TREAT_ZKU_AS_UNIVERSAL_WHEN_NO_ENDPOINT_DEVICE_IS_IN_SCOPE

measures:
  - code: "ЗКУ.1"
    title: "Управление доступом к конечным устройствам"
    purpose: PREVENT_UNAUTHORIZED_ACCESS_TO_ENDPOINT_DEVICES
    implementation:
      - IDENTIFY_AND_AUTHENTICATE_ENDPOINT_USERS_IN_ACCORDANCE_WITH_IAF_1_AND_IAF_3
      - CONTROL_ENDPOINT_USER_ACCESS_IN_ACCORDANCE_WITH_UPD_1_TO_UPD_9
      - APPLY_LEAST_PRIVILEGE_WHEN_GRANTING_ENDPOINT_ACCESS
      - CONTROL_USER_ACCESS_TO_ENDPOINT_INPUT_OUTPUT_INTERFACES
      - IMPLEMENT_WITH_OPERATING_SYSTEM_SECURITY_MECHANISMS_AND_OR_IDENTIFICATION_AUTHENTICATION_MEANS
    documentation: []
    enhancements:
      - {number: 1, rule: USE_TRUSTED_NETWORK_INTERACTION_MEANS_INCLUDING_TRUSTED_HARDWARE_NETWORK_INTERFACES}
      - {number: 2, rule: USE_HARDWARE_TO_GUARANTEE_DISABLING_UNUSED_MICROPHONE_OR_CAMERA_COMPONENTS_WHEN_PRESENT}
      - {number: 3, rule: FILTER_COMMANDS_TO_INPUT_OUTPUT_DEVICES_SO_ONLY_ALLOWED_COMMANDS_REACH_MFD_AND_PRINTERS_OR_OTHER_DEVICES}
      - {number: 4, rule: FOR_ENDPOINT_CONNECTING_TO_MULTIPLE_OPERATOR_SYSTEMS_USE_COMPONENTS_GUARANTEEING_PHYSICAL_SEPARATION_AND_NO_PERSISTENT_STORAGE_OF_CREATED_DATA}
      - {number: 5, rule: IDENTIFY_USER_ENDPOINT_DEVICES}
    matrix:
      base: {K3: PLUS, K2: PLUS, K1: PLUS}
      enhancements: {K3: [], K2: [], K1: []}

  - code: "ЗКУ.2"
    title: "Обеспечение целостности программного обеспечения конечного устройства"
    purpose: PREVENT_UNAUTHORIZED_ENDPOINT_SOFTWARE_MODIFICATION
    implementation:
      - ENSURE_ENDPOINT_OPERATING_SYSTEM_INTEGRITY
      - ENSURE_ENDPOINT_SECURITY_SOFTWARE_INTEGRITY
      - ENSURE_INTEGRITY_OF_OTHER_OPERATOR_DEFINED_ENDPOINT_SOFTWARE
      - PROHIBIT_INSTALLATION_AND_EXECUTION_OF_UNAUTHORIZED_SOFTWARE
      - IMPLEMENT_WITH_OPERATING_SYSTEM_SECURITY_MECHANISMS_AND_OTHER_SECURITY_MEANS
    documentation: []
    enhancements:
      - {number: 1, rule: TRUSTED_BOOT_FOR_USER_WORKSTATION_OPERATING_SYSTEMS_PROCESSING_RESTRICTED_INFORMATION_OR_SIGNIFICANT_FUNCTIONS}
      - {number: 2, rule: TRUSTED_BOOT_FOR_SERVER_OPERATING_SYSTEMS_PROCESSING_RESTRICTED_INFORMATION_OR_SIGNIFICANT_FUNCTIONS}
      - {number: 3, rule: TRUSTED_BOOT_FOR_NETWORK_SECURITY_MEANS}
      - {number: 4, rule: TRUSTED_BOOT_FOR_TELECOMMUNICATION_EQUIPMENT_SOFTWARE}
      - {number: 5, rule: BLOCK_SOFTWARE_EXECUTION_AND_OR_ENDPOINT_WHEN_INTEGRITY_VIOLATION_IS_DETECTED}
      - {number: 6, rule: CONTROL_ENDPOINT_BASIC_INPUT_OUTPUT_SYSTEM_INTEGRITY}
      - {number: 7, rule: CONTROL_ENDPOINT_FIRMWARE_AND_HARDWARE_COMPONENT_INTEGRITY}
      - {number: 8, rule: PROHIBIT_DEVELOPMENT_AND_DEBUG_FUNCTIONS_OR_RUN_SOFTWARE_INTEGRITY_CONTROL_AFTER_EACH_NECESSARY_DEVELOPMENT_OR_DEBUG_PROCESS}
    matrix:
      base: {K3: PLUS, K2: PLUS, K1: PLUS}
      enhancements: {K3: [], K2: [], K1: []}

  - code: "ЗКУ.3"
    title: "Антивирусная защита и обнаружение и предотвращение вторжений на конечных устройствах"
    purpose: DETECT_AND_NEUTRALIZE_INTRUSIONS_ATTACKS_AND_MALWARE_ON_ENDPOINTS
    implementation:
      - PROVIDE_ENDPOINT_ANTIVIRUS_PROTECTION_IN_ACCORDANCE_WITH_AVZ_1
      - WHEN_ANTIVIRUS_IS_TECHNICALLY_IMPOSSIBLE_APPLY_MEASURES_PREVENTING_MALWARE_RELATED_THREATS
    documentation: []
    enhancements:
      - {number: 1, rule: FOR_ENDPOINTS_IN_SYSTEM_WITH_INTERNET_ACCESS_DETECT_AND_RESPOND_TO_INTRUSIONS_USING_HOST_IDS_AND_OR_ENDPOINT_DETECTION_AND_RESPONSE}
      - {number: 2, rule: PERIODICALLY_RETROSPECTIVELY_ANALYZE_ENDPOINT_DETECTION_AND_RESPONSE_SECURITY_EVENTS_FOR_INTRUSION_SIGNS}
      - {number: 3, rule: INTERACT_WITH_THREAT_REPUTATION_DATABASE_TO_ENRICH_INTRUSION_INDICATORS}
      - {number: 4, rule: USE_THREAT_REPUTATION_DATABASE_TO_CHECK_FILE_NETWORK_AND_APPLICATION_ARTIFACTS_AT_NEAR_REAL_TIME_SCALE}
      - {number: 5, rule: AUTOMATICALLY_SEND_EXECUTABLES_AND_ARCHIVES_FROM_ENDPOINT_DETECTION_AND_RESPONSE_TO_CLOSED_SANDBOX_FOR_DYNAMIC_ANALYSIS}
    matrix:
      base: {K3: PLUS, K2: PLUS, K1: PLUS}
      enhancements: {K3: [], K2: [1], K1: [1]}

  - code: "ЗКУ.4"
    title: "Мониторинг процессов и состояния устройства"
    purpose: DETECT_UNAUTHORIZED_USER_ACTIONS_AND_PROCESSES_ON_USER_AND_SERVER_ENDPOINTS
    implementation:
      - {rule: MONITOR_ENDPOINT_PROCESSES_AND_STATE_IN_ACCORDANCE_WITH_RSB_1_TO_RSB_5, strength: REQUIRED}
      - {rule: TRACK_START_AND_END_OF_PROGRAMS_PROCESSES_JOBS_OR_TASKS_PROCESSING_PROTECTED_INFORMATION, strength: RECOMMENDED}
      - {rule: TRACK_HIGH_PRIVILEGE_HIDDEN_PROCESSES_AND_SYSTEM_SERVICES, strength: RECOMMENDED}
      - {rule: TRACK_PROCESSES_INITIATED_BY_ENDPOINT_SECURITY_MEANS, strength: RECOMMENDED}
      - {rule: TRACK_COMMAND_LINE_INTERPRETER_COMMANDS, strength: RECOMMENDED}
      - {rule: TRACK_ATTEMPTS_TO_ACCESS_PROTECTED_TECHNICAL_NETWORK_CHANNEL_DEVICE_PROGRAM_VOLUME_DIRECTORY_FILE_RECORD_FIELD_AND_OTHER_OBJECTS, strength: RECOMMENDED}
      - {rule: TRACK_ENDPOINT_USER_IDENTIFICATION_AND_AUTHENTICATION_ATTEMPTS, strength: RECOMMENDED}
      - {rule: TRACK_REMOTE_ACCESS_ATTEMPTS, strength: RECOMMENDED}
      - {rule: TRACK_EXTERNAL_DEVICE_CONNECTIONS_VIA_INPUT_OUTPUT_INTERFACES, strength: RECOMMENDED}
      - {rule: TRACK_WIRELESS_ACCESS_ATTEMPTS, strength: RECOMMENDED}
      - {rule: TRACK_ENDPOINT_SOFTWARE_CONFIGURATION_CHANGES, strength: RECOMMENDED}
      - {rule: IMPLEMENT_WITH_OPERATING_SYSTEM_SECURITY_MECHANISMS_HOST_DETECTION_AND_RESPONSE_AND_OR_OTHER_SECURITY_MEANS, strength: REQUIRED}
    documentation: []
    enhancements:
      - {number: 1, rule: DETECT_ANOMALIES_IN_USER_ACTIONS_AND_ENDPOINT_PROCESS_EXECUTION}
      - {number: 2, rule: INTEGRATE_AND_CORRELATE_MONITORING_RESULTS_FROM_DIFFERENT_PROCESSES_TO_DETECT_AND_RESPOND_TO_SECURITY_INCIDENTS}
    matrix:
      base: {K3: PLUS, K2: PLUS, K1: PLUS}
      enhancements: {K3: [], K2: [], K1: []}

  - code: "ЗКУ.5"
    title: "Контроль и фильтрация трафика на конечном устройстве"
    purpose: SECURE_ENDPOINT_NETWORK_INTERACTION
    implementation:
      - CONTROL_ENDPOINT_ACCESS_TO_EXTERNAL_INFORMATION_SYSTEM_RESOURCES
      - CONTROL_ENDPOINT_ACCESS_TO_INTERNAL_INFORMATION_SYSTEM_RESOURCES
      - FILTER_ENDPOINT_NETWORK_TRAFFIC_USING_DEFINED_IP_PORT_PROTOCOL_CONTENT_AND_OTHER_FIREWALL_RULES
      - IMPLEMENT_WITH_OPERATING_SYSTEM_SECURITY_MECHANISMS_HOST_DETECTION_AND_RESPONSE_AND_OR_OTHER_SECURITY_MEANS
    documentation: []
    enhancements:
      - {number: 1, rule: CONTROL_ENDPOINT_NETWORK_TRAFFIC_BY_TIME_OF_ACCESS_TO_DEFINED_RESOURCES}
      - {number: 2, rule: ANALYZE_ENDPOINT_TRAFFIC_FLOWS_SENDERS_RECIPIENTS_PROTOCOLS_PORTS_AND_CONNECTION_STATUS}
      - {number: 3, rule: USE_HARDWARE_NETWORK_INTERACTION_MEANS_FILTERING_INBOUND_AND_OR_OUTBOUND_TRAFFIC_BY_IP_AND_OR_MAC_ADDRESS}
      - {number: 4, rule: USE_HARDWARE_TO_GUARANTEE_BLOCKING_DATA_EXCHANGE_LINES_BY_COMMAND_AND_OR_SCHEDULE}
    matrix:
      base: {K3: BLANK, K2: BLANK, K1: BLANK}
      enhancements: {K3: [], K2: [], K1: []}

  - code: "ЗКУ.6"
    title: "Анализ и реагирование на события безопасности"
    purpose: PREVENT_UNAUTHORIZED_ENDPOINT_ACCESS_THROUGH_SECURITY_EVENT_ANALYSIS_AND_RESPONSE
    implementation:
      - ANALYZE_REGISTERED_SECURITY_EVENTS_AND_RESPOND_TO_IDENTIFIED_COMPUTER_INCIDENTS
    documentation: []
    enhancements:
      - {number: 1, rule: NOTIFY_INFORMATION_SYSTEM_SECURITY_ADMINISTRATOR_OF_IDENTIFIED_COMPUTER_INCIDENT_SIGNS}
      - {number: 2, rule: ANALYZE_ENDPOINT_SECURITY_EVENTS_WITH_SECURITY_INFORMATION_EVENT_MANAGEMENT_SYSTEM}
      - {number: 3, rule: RESPOND_WITH_INFORMATION_SECURITY_INCIDENT_MANAGEMENT_WHEN_HOST_DETECTION_AND_RESPONSE_UNDER_ZKU_3_AND_SECURITY_EVENT_MANAGEMENT_SYSTEM_ARE_PRESENT}
      - {number: 4, rule: BLOCK_AND_OR_ISOLATE_ENDPOINT_WITH_IDENTIFIED_COMPUTER_INCIDENT}
    matrix:
      base: {K3: PLUS, K2: PLUS, K1: PLUS}
      enhancements: {K3: [], K2: [1], K1: [1]}

