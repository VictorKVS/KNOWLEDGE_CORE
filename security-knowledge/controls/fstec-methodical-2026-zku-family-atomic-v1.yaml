scope_statement: >-
  Complete normalized coverage of section 4.9 measures ZKU.1-ZKU.6 for endpoint
  protection, including implementation, normative strength, all twenty-eight
  enhancements and all thirty-six appendix-2 cells. ZKU.5 has six blank class
  cells and is not baseline for K3, K2 or K1; it remains available through
  adaptation and threat verification. Other families remain pending.

