measures:
  - code: "МСЭ.1"
    title: "Сегментация сети"
    purpose: ISOLATE_INFORMATION_SYSTEM_SEGMENTS_FROM_EACH_OTHER
    implementation:
      - IMPLEMENT_INFORMATION_SYSTEM_SEGMENTATION
      - IDENTIFY_NETWORK_SEGMENTS
      - IDENTIFY_FUNCTIONAL_SEGMENTS
      - IDENTIFY_SEGMENTS_BY_INFORMATION_SIGNIFICANCE_LEVEL
      - IDENTIFY_SEGMENTS_BY_PROTECTION_CLASS
      - IDENTIFY_SEGMENTS_BY_DEVICE_TYPE
      - IDENTIFY_VIRTUAL_ENVIRONMENT_SEGMENTS
      - IDENTIFY_CONTAINER_ENVIRONMENT_SEGMENTS
      - CONTROL_AND_FILTER_NETWORK_TRAFFIC_AT_SEGMENT_BOUNDARIES
      - VERIFY_SEGMENTATION_CORRECTNESS_ACCORDING_TO_OPERATING_DOCUMENTATION_AT_LEAST_ANNUALLY
      - APPLY_LEAST_PRIVILEGE_TO_INTERSEGMENT_INTERACTION_AND_SEGMENT_ACCESS
      - IMPLEMENT_USING_FIREWALLS_ONE_WAY_TRANSFER_AND_IF_NEEDED_OPERATOR_DEFINED_PHYSICAL_ISOLATION
    documentation:
      - DEFINE_INFORMATION_SYSTEM_SEGMENTATION_PROCEDURE
    enhancements:
      - {number: 1, rule: IMPLEMENT_MICROSEGMENTATION_INTO_ISOLATED_SEGMENTS}
      - {number: 2, rule: ALLOW_EXTERNAL_USER_ACCESS_TO_APPLICATIONS_WITHOUT_ACCESS_TO_OTHER_SEGMENTS}
      - {number: 3, rule: AUTOMATE_FILTER_RULE_MANAGEMENT_FOR_CROSS_FIREWALL_CONSISTENCY}
      - {number: 4, rule: CENTRALLY_REGISTER_BLOCKED_FIREWALL_BYPASS_ATTEMPTS_USING_SECURITY_MONITORING}
    matrix:
      base: {K3: PLUS, K2: PLUS, K1: PLUS}
      enhancements: {K3: [], K2: [], K1: [1]}

  - code: "МСЭ.2"
    title: "Организация демилитаризованной зоны"
    purpose: CREATE_CONTROLLED_BUFFER_SEGMENT_FOR_SAFE_EXTERNAL_INTERACTION
    implementation:
      - CREATE_DMZ_FOR_COMPONENTS_INTERACTING_WITH_EXTERNAL_SYSTEMS_AND_NETWORKS
      - ISOLATE_DMZ_FROM_INTERNAL_RESTRICTED_INFORMATION_SEGMENTS_USING_FIREWALLS_OR_ONE_WAY_TRANSFER
      - ROUTE_ALL_DMZ_EXTERNAL_AND_INTERNAL_NETWORK_CONNECTIONS_THROUGH_FIREWALLS
    documentation:
      - DEFINE_DMZ_ORGANIZATION_PROCEDURE
    enhancements:
      - {number: 1, rule: PROTECT_DMZ_COMPONENTS_USING_WEB_SERVER_LEVEL_FIREWALLS}
      - {number: 2, rule: USE_REVERSE_PROXIES_FOR_ACCESS_TO_DMZ_COMPONENTS}
      - {number: 3, rule: LIMIT_NETWORK_INTERFACE_MEMORY_ACCESS_TO_ALLOWED_ADDRESS_RANGE_AND_EXCLUDE_OTHER_READ_WRITE_ACCESS}
    matrix:
      base: {K3: PLUS, K2: PLUS, K1: PLUS}
      enhancements: {K3: [], K2: [], K1: []}

  - code: "МСЭ.3"
    title: "Контроль сетевого доступа и фильтрация трафика"
    purpose: SECURE_INTERSEGMENT_AND_EXTERNAL_NETWORK_INTERACTION
    implementation:
      - CONTROL_NETWORK_ACCESS_AND_FILTER_ALL_TRAFFIC_AT_INTERSEGMENT_AND_EXTERNAL_BOUNDARIES
      - USE_THREAT_INFORMED_FILTER_RULES_AND_OR_ONE_WAY_TRANSFER
      - DEFINE_NETWORK_TRAFFIC_CONTROL_AND_FILTER_RULES
      - FILTER_INBOUND_NETWORK_CONNECTIONS
      - FILTER_OUTBOUND_NETWORK_CONNECTIONS
      - REGISTER_SECURITY_EVENTS_FOR_OPERATOR_DEFINED_NETWORK_INTERACTION_RULE_VIOLATIONS
      - BACK_UP_FIREWALL_RULE_LIST
      - IMPLEMENT_USING_FIREWALLS_ONE_WAY_TRANSFER_AND_IF_NEEDED_OPERATOR_DEFINED_PHYSICAL_ISOLATION
    documentation:
      - DEFINE_NETWORK_TRAFFIC_CONTROL_AND_FILTERING_PROCEDURE
    enhancements:
      - {number: 1, rule: IMPLEMENT_HARDWARE_PACKET_FILTERING_BY_PHYSICAL_AND_OR_NETWORK_SENDER_AND_OR_RECIPIENT_ADDRESSES}
    matrix:
      base: {K3: PLUS, K2: PLUS, K1: PLUS}
      enhancements: {K3: [], K2: [], K1: []}

  - code: "МСЭ.4"
    title: "Маскирование системы"
    purpose: IMPEDE_EXTERNAL_ANALYSIS_OF_SYSTEM_CONFIGURATION_AND_OPERATION
    implementation:
      - IDENTIFY_EXTERNAL_BOUNDARY_COMPONENTS_REQUIRING_MASKING
      - PREVENT_UNAUTHORIZED_DISCOVERY_OF_NETWORK_ADDRESSES_NODE_NAMES_AND_SOFTWARE_TYPES_AND_VERSIONS
      - ENSURE_NETWORK_RESPONSES_DO_NOT_DISCLOSE_INFORMATION_SYSTEM_DETAILS
      - ENSURE_MASKING_DOES_NOT_DISRUPT_NORMAL_INFORMATION_SYSTEM_OPERATION
    documentation: []
    enhancements:
      - {number: 1, rule: HIDE_SERVICE_NETWORK_ADDRESSES_FOR_ADMINISTRATIVE_SERVICE_ACCESS_CONTROL}
      - {number: 2, rule: USE_NETWORK_SCAN_SLOWDOWN_SYSTEMS}
      - {number: 3, rule: IGNORE_REQUESTS_FROM_EXTERNAL_SOURCES}
      - {number: 4, rule: MASK_NETWORK_TRAFFIC_ATTRIBUTES_TO_IMPEDE_ANALYSIS}
    matrix:
      base: {K3: BLANK, K2: BLANK, K1: BLANK}
      enhancements: {K3: [], K2: [], K1: []}

  - code: "МСЭ.5"
    title: "Создание ложных систем"
    purpose: DETECT_UNAUTHORIZED_ACCESS_ATTEMPTS_USING_EMULATED_DECOY_SYSTEMS_OR_COMPONENTS
    implementation:
      - USE_DECOY_INFORMATION_SYSTEMS_OR_COMPONENTS_TO_DETECT_REGISTER_AND_ANALYZE_ATTACKER_ACTIONS
      - IMITATE_REAL_INFORMATION_SYSTEM_OR_COMPONENT_OPERATION
      - DETECT_AND_REGISTER_ATTACKER_COMPUTER_ATTACK_ACTIONS
      - SEND_COLLECTED_INFORMATION_TO_SECURITY_MONITORING_SYSTEMS
      - ISOLATE_DECOY_SYSTEMS_FROM_INFORMATION_SYSTEM
      - GIVE_DECOY_SYSTEMS_SIGNS_OF_FUNCTIONING_SERVICES
      - EXCLUDE_RESTRICTED_INFORMATION_FROM_DECOY_SYSTEMS
    documentation: []
    enhancements:
      - number: 1
        rule: CREATE_DECOY_DATA_ON_INFORMATION_SYSTEM_COMPONENTS
        non_exhaustive_examples: [TEXT_AND_TABLE_FILES, OPERATING_SYSTEM_COMPONENT_DATA, APPLICATION_SOFTWARE_DATA]
      - {number: 2, rule: MAKE_DECOY_SYSTEM_IDENTIFIABLE_AS_EXISTING_SYSTEM_WITHOUT_REVEALING_IT_AS_INFORMATION_SYSTEM_COMPONENT}
    matrix:
      base: {K3: BLANK, K2: BLANK, K1: BLANK}
      enhancements: {K3: [], K2: [], K1: []}

