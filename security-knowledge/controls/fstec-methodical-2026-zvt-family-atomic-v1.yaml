      - REGISTER_WEB_USER_ACCOUNT_MANAGEMENT_EVENTS_WHEN_APPLICATION_SUPPORTS_SUCH_CHANGES
      - REGISTER_ACCESS_SUBJECT_AND_OBJECT_TYPE_CHANGE_EVENTS_WHEN_APPLICATION_SUPPORTS_SUCH_CHANGES
