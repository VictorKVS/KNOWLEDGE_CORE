      - WEB_APPLICATION_USER_TYPE_LIST
    enhancements:
      - {number: 1, rule: PREVENT_BROWSER_CACHING_OF_OPERATOR_DEFINED_USER_DATA}
      - {number: 2, rule: DISABLE_FORM_AUTOFILL_FOR_FIELDS_RECEIVING_OPERATOR_DEFINED_USER_DATA}
      - {number: 3, rule: PROTECT_USER_DATA_FROM_XSS_COMPROMISE_USING_HTTP_SECURITY_HEADERS}
      - {number: 4, rule: PROTECT_USER_DATA_FROM_UI_REDRESSING_BY_CONTROLLING_DISPLAY_CONTEXT_NESTING}
