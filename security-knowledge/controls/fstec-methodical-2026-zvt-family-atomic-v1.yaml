    implementation:
      - PROTECT_API_MEDIATED_NETWORK_INTERACTION_DATA_IN_ACCORDANCE_WITH_ZPI_1
      - CONTROL_ACCESS_TO_WEB_APPLICATION_USER_DATA_AND_FUNCTIONS_IN_ACCORDANCE_WITH_UPD_2
      - PROTECT_NETWORK_INTERACTION_WITH_LITERAL_SOURCE_REFERENCE_ZKS_1_TO_ZKS_5
    documentation:
