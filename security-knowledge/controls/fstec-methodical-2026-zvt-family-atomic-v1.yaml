      base: {K3: PLUS, K2: PLUS, K1: PLUS}
      enhancements: {K3: [], K2: [], K1: []}

  - code: "ЗВТ.5"
    title: "Проверка файлов, передаваемых веб-приложениями, на вредоносное программное обеспечение"
    purpose: DETECT_AND_RESPOND_TO_MALWARE_IN_FILES_TRANSFERRED_BY_WEB_APPLICATIONS
    implementation:
