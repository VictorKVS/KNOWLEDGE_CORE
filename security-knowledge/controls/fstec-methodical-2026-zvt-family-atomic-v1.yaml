      - REGISTER_PARALLEL_WEB_SESSION_LIMIT_EVENTS
      - REGISTER_INACTIVITY_SESSION_TERMINATION_EVENTS
      - REGISTER_WEB_APPLICATION_SETTING_CHANGE_EVENTS
      - REGISTER_WEB_TRAFFIC_FILTERING_EVENTS_AT_FIREWALL_LEVEL
      - REGISTER_MALICIOUS_IMPACT_INDICATOR_EVENTS_AT_FIREWALL_LEVEL
      - TRANSMIT_REGISTERED_SECURITY_EVENTS_TO_SYSTEM_SECURITY_EVENT_MANAGEMENT_SYSTEM
      - AUTOMATICALLY_BLOCK_WEB_NETWORK_SESSION_FOR_OPERATOR_DEFINED_SECURITY_EVENTS_AFTER_EVENT_ANALYSIS
