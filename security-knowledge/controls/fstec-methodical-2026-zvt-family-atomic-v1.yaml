      - APPLY_UPD_1_TO_UPD_6_TO_WEB_APPLICATION_AND_CONTENT_MANAGEMENT_FUNCTIONS_AND_DATA
      - LIMIT_PARALLEL_WEB_APPLICATION_SESSIONS_IN_ACCORDANCE_WITH_UPD_7
