scope_statement: >-
  Complete normalized coverage of section 4.7 measures ZVT.1-ZVT.5 for web
  technologies, including implementation, documentation, all numbered
  enhancements and all thirty appendix-2 base/enhancement class cells. The
  literal ZKS.1-ZKS.5 reference is preserved as a source anomaly because the
  appendix-2 catalog contains ZKS.1-ZKS.4 only. Other measure families remain
  pending at content level.

