measures:
  - code: "ЗОО.1"
    title: "Защита от компьютерных атак, направленных на отказ в обслуживании, при доступе внешних пользователей к прикладным сервисам"
    purpose: MAINTAIN_AVAILABILITY_DURING_DENIAL_OF_SERVICE_ATTACKS
    implementation:
      - PLACE_EXTERNAL_USER_APPLICATION_SERVICE_SERVERS_IN_DMZ_CONFORMING_TO_MSE_2
      - FILTER_AND_CLEAN_EXTERNAL_TRAFFIC_AT_OR_BEFORE_DMZ_USING_OPERATOR_PROVIDER_CARRIER_AND_OR_SPECIALIZED_DDOS_FILTERING_SERVICE
    documentation: []
    enhancements: []
    matrix:
      base: {K3: PLUS, K2: PLUS, K1: PLUS}
      enhancements: {K3: [], K2: [], K1: []}

  - code: "ЗОО.2"
    title: "Контроль и фильтрация входящего трафика"
    purpose: EXCLUDE_ILLEGITIMATE_INBOUND_SERVICE_TRAFFIC_FLOWS
    implementation:
      - APPLY_INBOUND_FILTER_RULES_AFTER_DENIAL_OF_SERVICE_ATTACK_DETECTION
      - APPLY_INBOUND_FILTER_RULES_AT_NETWORK_AND_TRANSPORT_LAYERS
      - APPLY_AND_MAINTAIN_CURRENT_TRANSPORT_LAYER_INTERNET_COMMUNICATION_MATRIX_RULES
      - DEFINE_REQUIRED_PEER_NETWORK_ADDRESSES_AND_APPLY_ALLOWLISTS
      - CONDITIONALLY_EXCLUDE_NON_RUSSIAN_IP_TRAFFIC_BY_GEOIP_DURING_ATTACK_WHEN_COMMUNICATION_MATRIX_FILTERING_CANNOT_MAINTAIN_AVAILABILITY
      - USE_APPLICATION_LAYER_SPECIALIZED_MEANS_AND_OR_PROVIDER_CARRIER_OR_FILTERING_SERVICE
    documentation:
      - DEFINE_ALWAYS_INTERNET_AVAILABLE_INTERFACES_AND_SERVICES_REQUIRING_DDOS_PROTECTION
      - DEFINE_PARTICIPATING_UNITS_WORKERS_FUNCTIONS_AUTHORITIES_AND_INTERACTION_PROCEDURE
      - RETAIN_DDOS_ATTACK_FACT_INFORMATION_AND_REQUIRED_FIELDS_FOR_THREE_YEARS
    enhancements:
      - {number: 1, rule: APPLY_INBOUND_TRAFFIC_FILTER_RULES_CONTINUOUSLY}
      - {number: 2, rule: ENABLE_TLS_TRAFFIC_ANALYSIS_BY_DECRYPTION_OR_ACCESS_EVENT_LOG_INFORMATION}
    matrix:
      base: {K3: PLUS, K2: PLUS, K1: PLUS}
      enhancements: {K3: [], K2: [], K1: [1]}

  - code: "ЗОО.3"
    title: "Мониторинг состояния сервисов и интерфейсов"
    purpose: CONTINUOUSLY_MONITOR_AVAILABILITY_AND_PERFORMANCE_OF_SERVICES_AND_DDOS_PROTECTION_MEANS
    implementation:
      - MONITOR_CPU_MEMORY_AND_NETWORK_INTERFACE_LOAD_FOR_SERVERS_VMS_NETWORK_EQUIPMENT_AND_PERIMETER_PROTECTION_MEANS
      - MONITOR_CONCURRENT_CONNECTION_COUNT_FOR_STATEFUL_NETWORK_FUNCTION_MEANS
      - MONITOR_APPLICATION_LAYER_REQUEST_COUNT
      - MONITOR_COUNT_AND_TYPES_OF_APPLICATION_AND_SERVICE_RESPONSE_ERRORS
      - CONTINUOUSLY_REGISTER_SERVICE_AND_INTERFACE_UNAVAILABILITY_EVENTS
    documentation:
      - DEFINE_KEY_PERFORMANCE_INDICATORS_FOR_MONITORED_SERVICES_AND_MEANS
      - DEFINE_RESPONSE_PROCEDURE_FOR_SERVICE_AND_INTERFACE_UNAVAILABILITY_EVENTS
    enhancements:
      - {number: 1, rule: MONITOR_PROVIDER_CARRIER_OR_FILTERING_SERVICE_CORE_METRICS_AND_EFFECTIVENESS_WHEN_USED}
      - {number: 2, rule: MONITOR_APPLICATION_LAYER_AVAILABILITY_USING_TOOLS_LOCATED_ON_THE_INTERNET}
    matrix:
      base: {K3: PLUS, K2: PLUS, K1: PLUS}
      enhancements: {K3: [], K2: [], K1: []}

  - code: "ЗОО.4"
    title: "Балансировка нагрузки"
    purpose: IMPROVE_SERVICE_RESILIENCE_DURING_DENIAL_OF_SERVICE_ATTACKS
    implementation:
      - CONNECT_BY_INDEPENDENT_PHYSICAL_CHANNELS_TO_MULTIPLE_INTERNET_PROVIDERS_AND_RECEIVE_TRAFFIC_SIMULTANEOUSLY
      - WHEN_EXTERNAL_SERVICES_ARE_USED_SELECT_PROVIDER_SATISFYING_MULTI_PROVIDER_INDEPENDENT_CHANNEL_REQUIREMENT
      - ENABLE_VERTICAL_SCALING_OF_APPLICATION_SERVICES_DURING_DENIAL_OF_SERVICE_ATTACKS
    documentation: []
    enhancements:
      - {number: 1, rule: ENABLE_HORIZONTAL_SCALING_AND_LOAD_DISTRIBUTION_BETWEEN_NODES_DURING_ATTACKS}
      - {number: 2, rule: CONDITIONALLY_DISTRIBUTE_LOAD_SIMULTANEOUSLY_ACROSS_TWO_GEOGRAPHIC_SITES_WHEN_ARCHITECTURE_SUPPORTS_IT}
    matrix:
      base: {K3: BLANK, K2: BLANK, K1: BLANK}
      enhancements: {K3: [], K2: [], K1: []}

  - code: "ЗОО.5"
    title: "Ограничение нагрузки"
    purpose: LIMIT_RESOURCE_EXHAUSTION_CONDITIONS
    implementation:
      - LIMIT_MAXIMUM_CONCURRENT_TCP_CONNECTIONS_PER_IP_USING_OPERATOR_METHOD_AND_SOURCE_DATA
      - LIMIT_DNS_SERVER_RESPONSE_RATE
      - LIMIT_MAXIMUM_CONCURRENT_APPLICATION_REQUESTS_PER_SECOND_PER_IP_USING_OPERATOR_METHOD_AND_SOURCE_DATA
      - MONITOR_TRAFFIC_AND_DETECT_ANOMALOUS_BEHAVIOR_WHILE_RATE_LIMITING
    documentation: []
    enhancements: []
    matrix:
      base: {K3: PLUS, K2: PLUS, K1: PLUS}
      enhancements: {K3: [], K2: [], K1: []}

  - code: "ЗОО.6"
    title: "Поддержка резерва достаточной пропускной способности и расширение ресурсов при сбоях"
    purpose: MAINTAIN_CAPACITY_RESERVE_FOR_ATTACK_TRAFFIC_PROCESSING
    implementation:
      - PROVIDE_AT_LEAST_TWOFOLD_INTERNET_PROVIDER_CHANNEL_BANDWIDTH_RESERVE_USING_OPERATOR_METHOD_AND_SOURCE_DATA
      - PROVIDE_AT_LEAST_TWOFOLD_TRAFFIC_PROCESSING_RESERVE_ON_OPERATOR_DEFINED_SYSTEM_ELEMENTS
    documentation: []
    enhancements:
      - {number: 1, rule: PROVIDE_TWOFOLD_INTERNAL_PATH_BANDWIDTH_RESERVE_FROM_INTERNET_INTERCONNECTION_TO_APPLICATION_SERVICE_BASED_ON_PEAK_LEGITIMATE_ATTACK_TRAFFIC}
      - number: 2
        rule: USE_TRUSTED_HIGH_PERFORMANCE_NETWORK_HARDWARE_THAT_BYPASSES_STANDARD_KERNEL_NETWORK_STACK_LIMITS
        non_exhaustive_examples: [DPDK, XDP, PF_RING, OTHER]
    matrix:
      base: {K3: BLANK, K2: PLUS, K1: PLUS}
      enhancements: {K3: [], K2: [], K1: []}

