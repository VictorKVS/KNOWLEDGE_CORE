  - DO_NOT_REPLACE_IAF_OR_UPD_REFERENCED_MEASURES_WITH_ZPI_2
  - DO_NOT_DROP_EVERY_REQUEST_CHECK_OR_PUBLIC_RESOURCE_EXCEPTION_FROM_ZPI_2
  - DO_NOT_INVENT_API_REQUEST_FREQUENCY_VOLUME_OR_BRUTE_FORCE_NUMERIC_VALUES
  - DO_NOT_REPLACE_ANNUAL_OR_API_CHANGE_BASE_REVIEW_WITH_ONE_ROUTE_ONLY
  - DO_NOT_GENERALIZE_ZPI_3_ENHANCEMENT_1_APPLICATION_CHANGE_TRIGGER_TO_K2_OR_K3_FROM_CLASS_MATRIX_ALONE
  - DO_NOT_TREAT_ZPI_3_ENHANCEMENT_2_AS_CLASS_LISTED
  - DO_NOT_TREAT_BLANK_CLASS_CELL_AS_PROHIBITION
  - DO_NOT_GENERALIZE_ZPI_CONTENT_TO_WEB_OR_OTHER_MEASURE_FAMILIES

