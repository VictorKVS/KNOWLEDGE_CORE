scope_statement: >-
  This model enumerates the complete 96-code appendix-2 catalog, its seventeen
  families and appendix-3 selection semantics. The IAF family has a separate
  complete four-measure model, the complete UPD family has three bounded
  models, the complete RSB family has one bounded model, and the complete ZSV
  family has one bounded virtualization/cloud-computing model, and the complete
  ZKO family has one bounded containerization/orchestration model of implementation,
  documentation, enhancements and class cells. The other sixty-one
  measures remain pending at content level.

