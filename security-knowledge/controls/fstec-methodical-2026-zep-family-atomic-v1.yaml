measures:
  - code: "ЗЭП.1"
    title: "Защита ящиков и сообщений электронной почты"
    purpose: PREVENT_UNAUTHORIZED_ACCESS_TO_MAILBOXES_AND_EMAIL_MESSAGES
    implementation:
      - PERIODICALLY_AUDIT_MAILBOXES_TO_IDENTIFY_MAILBOXES_SUBJECT_TO_DELETION
      - REGISTER_EMAIL_USER_ACTION_SECURITY_EVENTS_IN_ACCORDANCE_WITH_RSB_1_TO_RSB_5
    documentation: []
    enhancements:
      - {number: 1, rule: AUTOMATICALLY_BLOCK_MAILBOX_ACCESS_AFTER_OPERATOR_SET_INACTIVITY_TIME}
      - {number: 2, rule: PERIODICALLY_BACK_UP_MAILBOX_CONTENT}
    matrix:
      base: {K3: PLUS, K2: PLUS, K1: PLUS}
      enhancements: {K3: [], K2: [], K1: []}

  - code: "ЗЭП.2"
    title: "Управление доступом пользователей"
    purpose: PREVENT_UNAUTHORIZED_ACCESS_TO_MAILBOXES_AND_EMAIL_MESSAGES
    implementation:
      - REQUIRE_IDENTIFICATION_AND_AUTHENTICATION_BEFORE_USER_MAILBOX_ACCESS
      - APPLY_IAF_1_AND_IAF_3_TO_IDENTIFICATION_AND_AUTHENTICATION_FOR_MAILBOX_ACCESS
      - REQUIRE_OWNER_APPROVAL_FOR_ACCESS_TO_SHARED_MAILBOXES_AND_DISTRIBUTION_GROUPS
    documentation: []
    enhancements: []
    matrix:
      base: {K3: PLUS, K2: PLUS, K1: PLUS}
      enhancements: {K3: [], K2: [], K1: []}

  - code: "ЗЭП.3"
    title: "Защита от вредоносных вложений"
    purpose: DETECT_AND_RESPOND_TO_MALWARE_IN_EMAIL_OBJECTS
    implementation:
      - PROVIDE_EMAIL_ANTIVIRUS_PROTECTION_IN_ACCORDANCE_WITH_AVZ_2
      - CONTROL_EMAIL_ATTACHMENTS_AND_LINKS_USING_INDICATORS_OF_COMPROMISE
      - BLOCK_MESSAGES_WITH_ATTACHMENTS_IN_FORMATS_NOT_ALLOWED_BY_OPERATOR_POLICY
      - SUPPORT_RETROSPECTIVE_MALWARE_ANALYSIS_OF_ATTACHMENTS_AND_LINKS_IN_PREVIOUSLY_RECEIVED_MESSAGES
    documentation: []
    enhancements:
      - {number: 1, rule: CHECK_INCOMING_ATTACHMENTS_IN_A_CLOSED_PRE_EXECUTION_SANDBOX}
      - {number: 2, rule: BLOCK_USE_OF_PASSWORD_PROTECTED_ARCHIVES_UNTIL_ANTIVIRUS_CHECK_COMPLETES}
    matrix:
      base: {K3: PLUS, K2: PLUS, K1: PLUS}
      enhancements: {K3: [], K2: [], K1: []}

  - code: "ЗЭП.4"
    title: "Защита от фишинга"
    purpose: DETECT_AND_BLOCK_MESSAGES_WITH_FORGED_DATA_OR_PHISHING_ELEMENTS
    implementation:
      - CONTROL_MESSAGE_CONTENT_AND_EXTERNAL_LINKS_FOR_MALICIOUS_AND_PHISHING_ELEMENTS
      - FILTER_MESSAGES_BY_SENDER_INFORMATION_INCLUDING_IP_ADDRESSES_DOMAINS_AND_ALLOW_OR_DENY_LISTS
      - FILTER_MESSAGE_CONTENT_USING_PHISHING_CLASSIFICATION_CRITERIA
      - SUPPORT_RETROSPECTIVE_ANALYSIS_FOR_FORGED_DATA_AND_PHISHING_ELEMENTS
    documentation: []
    enhancements:
      - {number: 1, rule: BLOCK_OR_QUARANTINE_MESSAGES_WITH_FORGED_DATA_OR_PHISHING_ELEMENTS}
      - {number: 2, rule: FILTER_MESSAGES_USING_SENDER_REPUTATION_INFORMATION}
      - {number: 3, rule: CHECK_MESSAGES_FOR_PHISHING_ELEMENTS_IN_A_CLOSED_PRE_EXECUTION_SANDBOX}
      - {number: 4, rule: VERIFY_SENDER_EMAIL_ADDRESSES_AND_DETECT_FORGED_MESSAGES_FROM_LEGITIMATE_SENDERS}
    matrix:
      base: {K3: PLUS, K2: PLUS, K1: PLUS}
      enhancements: {K3: [], K2: [1], K1: [1]}

  - code: "ЗЭП.5"
    title: "Защита от спама"
    purpose: PREVENT_UNSOLICITED_EMAIL_MESSAGES_FROM_REACHING_SYSTEM_USERS
    implementation:
      - CONTROL_INCOMING_MESSAGES_TO_DETECT_UNSOLICITED_EMAIL
      - FILTER_MESSAGES_BY_SENDER_INFORMATION_INCLUDING_IP_ADDRESSES_DOMAINS_AND_ALLOW_OR_DENY_LISTS
      - FILTER_MESSAGE_CONTENT_USING_SPAM_CLASSIFICATION_CRITERIA
    documentation: []
    enhancements:
      - {number: 1, rule: FILTER_MESSAGES_USING_SENDER_REPUTATION_INFORMATION}
      - {number: 2, rule: BLOCK_FURTHER_MESSAGES_WHEN_OPERATOR_SET_SENDER_COUNT_LIMIT_WITHIN_OPERATOR_SET_PERIOD_IS_EXCEEDED}
      - {number: 3, rule: USE_TECHNOLOGIES_THAT_UNAMBIGUOUSLY_VERIFY_EMAIL_ADDRESSES_ON_WHOSE_BEHALF_MESSAGES_WERE_SENT}
    matrix:
      base: {K3: PLUS, K2: PLUS, K1: PLUS}
      enhancements: {K3: [], K2: [], K1: []}

  - code: "ЗЭП.6"
    title: "Защита метаданных и иной технической информации сервисов электронной почты"
    purpose: PREVENT_UNAUTHORIZED_USE_OF_EMAIL_SERVICE_METADATA_AND_TECHNICAL_INFORMATION
    implementation:
      - USE_TECHNOLOGIES_AND_NETWORK_PROTOCOLS_THAT_HIDE_EMAIL_SERVICE_METADATA_AND_TECHNICAL_INFORMATION
      - HIDE_HEADERS_DISCLOSING_SYSTEM_INFRASTRUCTURE_OR_SENDING_SOFTWARE_INCLUDING_X_MAILER_AND_USER_AGENT
      - HIDE_HEADERS_DISCLOSING_MESSAGE_ROUTE_INFORMATION_INCLUDING_X_ORIGINATING_IP_AND_MESSAGE_ID
      - USE_AT_LEAST_ONE_SOURCE_LISTED_HEADER_HIDING_METHOD
      - PREVENT_ENUMERATION_OF_EXISTING_MAILBOXES
    implementation_alternatives:
      header_hiding_one_of:
        - CONFIGURE_MAIL_SERVER_TO_OMIT_INFORMATION_FROM_OUTGOING_SERVICE_HEADERS
        - USE_SMTP_GATEWAY_OR_PROXY_TO_REPLACE_OR_DELETE_SERVICE_HEADER_INFORMATION
      mailbox_enumeration_prevention:
        - PROHIBIT_VRFY_AND_EXPN_COMMANDS_ON_MAIL_SERVER
        - USE_SECURITY_MEANS_TO_BLOCK_REQUESTS_FOR_EXISTING_MAILBOX_INFORMATION
    documentation: []
    enhancements:
      - {number: 1, rule: INTERNET_ACCESSIBLE_MAIL_SERVER_MUST_NOT_RELAY_MAIL_TRAFFIC_FOR_OTHER_SYSTEMS_OR_DOMAINS}
    matrix:
      base: {K3: PLUS, K2: PLUS, K1: PLUS}
      enhancements: {K3: [], K2: [], K1: []}

