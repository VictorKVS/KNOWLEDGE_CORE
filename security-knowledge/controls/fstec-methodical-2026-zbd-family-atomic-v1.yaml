measures:
  - code: "ЗБД.1"
    title: "Идентификация и аутентификация"
    purpose: PREVENT_ACCESS_BY_UNIDENTIFIED_OR_UNAUTHENTICATED_WIRELESS_SUBJECTS_AND_OBJECTS
    implementation:
      - IDENTIFY_AND_AUTHENTICATE_INTERNAL_PRIVILEGED_AND_ADMINISTRATIVE_USERS_UNDER_IAF_1_AND_IAF_3
      - IDENTIFY_DEVICES_REQUESTING_WIRELESS_NETWORK_ACCESS_UNDER_IAF_2
      - IDENTIFY_WIRELESS_ACCESS_POINTS
      - IDENTIFY_ACCESS_POINTS_BY_LOGICAL_NAME_LOGICAL_ADDRESS_PHYSICAL_ADDRESS_OR_COMBINATION
      - IDENTIFY_CONNECTING_DEVICES_BY_LOGICAL_NAME_LOGICAL_ADDRESS_PHYSICAL_ADDRESS_OR_COMBINATION
      - PROHIBIT_ACCESS_POINT_AUTHENTICATION_WITH_DEFAULT_PASSWORDS
      - IMPLEMENT_WITH_IDENTIFICATION_AUTHENTICATION_MEANS_IN_ACCESS_POINTS_NETWORK_EQUIPMENT_AND_OR_USER_DEVICES
    documentation: []
    enhancements:
      - {number: 1, rule: HIDE_NETWORK_NAME_SSID_FROM_AVAILABLE_NETWORK_LIST}
      - {number: 2, rule: USE_ACCOUNT_MANAGEMENT_SYSTEMS_FOR_WIRELESS_SUBJECT_ACCOUNTS_AND_CREDENTIALS}
      - {number: 3, rule: DO_NOT_BROADCAST_ACCESS_POINT_SYMBOLIC_NAME_OR_SHOW_IT_IN_VISIBLE_ACCESS_POINT_LISTS}
      - {number: 4, rule: AUTHENTICATE_CONNECTING_DEVICES_USING_AUTHENTICATION_PROTOCOLS}
    matrix:
      base: {K3: PLUS, K2: PLUS, K1: PLUS}
      enhancements: {K3: [], K2: [], K1: [1]}

  - code: "ЗБД.2"
    title: "Управление доступом"
    purpose: PREVENT_UNAUTHORIZED_ACCESS_TO_WIRELESS_ACCESS_POINTS
    implementation:
      - CONTROL_SUBJECT_ACCESS_TO_WIRELESS_ACCESS_POINTS_UNDER_UPD_1_TO_UPD_9
      - FILTER_USER_DEVICES_FOR_WIRELESS_NETWORK_ACCESS_CONTROL
      - ALLOW_ACCESS_POINT_CONFIGURATION_CHANGES_ONLY_TO_INFORMATION_SYSTEM_ADMINISTRATORS
      - ALLOW_WIRELESS_NETWORK_ACCESS_TO_POINTS_INFORMATION_SERVICES_AND_APPLICATIONS_ONLY_AFTER_USER_IDENTIFICATION_AND_AUTHENTICATION
      - IMPLEMENT_WITH_ACCESS_CONTROL_MEANS_IN_ACCESS_POINTS_NETWORK_EQUIPMENT_AND_OR_USER_DEVICES
      - APPLY_LEAST_PRIVILEGE_WHEN_GRANTING_WIRELESS_ACCESS_POINT_ACCESS
    documentation: []
    enhancements:
      - {number: 1, rule: PREVENT_UNAUTHORIZED_ACCESS_POINT_CONFIGURATION_CHANGES}
      - {number: 2, rule: LIMIT_USER_ACCESS_SESSION_TIME_AND_AUTOMATICALLY_TERMINATE_CONNECTION_AT_LIMIT}
      - {number: 3, rule: USE_WIRELESS_NETWORK_MANAGEMENT_SYSTEMS}
      - {number: 4, rule: USE_DEVICE_ACCESS_CONTROL_MANAGEMENT_SYSTEMS_FOR_WIRELESS_CONNECTIONS}
    matrix:
      base: {K3: PLUS, K2: PLUS, K1: PLUS}
      enhancements: {K3: [], K2: [], K1: []}

  - code: "ЗБД.3"
    title: "Защита пользовательских данных"
    purpose: PREVENT_USER_DATA_LEAKAGE_INTERCEPTION_AND_MODIFICATION_DURING_WIRELESS_ACCESS
    implementation:
      - SEGMENT_WIRELESS_LOCAL_NETWORKS_SEPARATELY_WITHIN_INFORMATION_SYSTEM
      - INVENTORY_WIRELESS_ACCESS_POINTS
      - CONNECT_ONLY_TO_PERMITTED_WIRELESS_ACCESS_POINTS_FOR_ESTABLISHED_DUTIES
      - ALLOW_CONNECTIONS_ONLY_THROUGH_CONTROLLED_ACCESS_POINT_AND_USER_DEVICE_INTERFACES
      - CONTROL_USER_DEVICE_CONNECTION_TO_WIRELESS_ACCESS_POINT_BEFORE_INFORMATION_EXCHANGE_WITH_SYSTEM
      - DISABLE_OR_BLOCK_UNUSED_ACCESS_POINT_FUNCTIONAL_CAPABILITIES
      - ANALYZE_ACCESS_POINT_FIRMWARE_AND_SOFTWARE_VULNERABILITIES
      - WHEN_VULNERABILITIES_ARE_FOUND_UPDATE_TO_AVAILABLE_FIRMWARE_AND_SOFTWARE_WITHOUT_KNOWN_VULNERABILITIES
    documentation: []
    enhancements:
      - {number: 1, rule: ANALYZE_WIRELESS_ACCESS_NETWORK_TRAFFIC_TO_DETECT_COMPUTER_ATTACK_SIGNS}
      - {number: 2, rule: INVENTORY_ACCESS_POINTS_TO_DETECT_UNUSED_AND_UNAPPROVED_DEVICES}
      - {number: 3, rule: DISABLE_AUTOMATIC_USER_DEVICE_CONNECTION_TO_WIRELESS_ACCESS_POINTS}
      - {number: 4, rule: ANALYZE_WIRELESS_LOCAL_NETWORK_TRAFFIC_TO_DETECT_UNAUTHORIZED_CONNECTIONS}
      - {number: 5, rule: FILTER_OR_RESTRICT_ACCESS_POINT_CONNECTIONS_BY_PHYSICAL_AND_OR_LOGICAL_ADDRESSES}
    matrix:
      base: {K3: PLUS, K2: PLUS, K1: PLUS}
      enhancements: {K3: [], K2: [], K1: []}

  - code: "ЗБД.4"
    title: "Контроль целостности"
    purpose: ENSURE_WIRELESS_ACCESS_POINT_INTEGRITY
    implementation:
      - CONTROL_ACCESS_POINT_SOFTWARE_INTEGRITY_INCLUDING_FIRMWARE_VERSIONS
      - CONTROL_ACCESS_POINT_HARDWARE_COMPONENT_COMPOSITION
      - DISABLE_UNUSED_ACCESS_POINT_INTERFACES
      - PLACE_WIRELESS_ACCESS_POINTS_WITHIN_CONTROLLED_ZONE
      - INSTALL_CURRENT_ACCESS_POINT_UPDATES_AND_REMEDIATE_WIRELESS_CONNECTION_SECURITY_VULNERABILITIES
    documentation: []
    enhancements:
      - {number: 1, rule: CONTROL_ABSENCE_OF_UNAUTHORIZED_ACCESS_POINT_SETTING_CHANGES_WEEKLY_OR_AT_SHORTER_SYSTEM_DEFINED_INTERVAL}
      - {number: 2, rule: CONTROL_ACCESS_POINT_FIRMWARE_INTEGRITY_BY_VERIFYING_DIGITAL_SIGNATURE_OR_CHECKSUMS}
      - {number: 3, rule: PREVENT_CONNECTED_DEVICE_USER_FROM_CHANGING_ACCESS_POINT_SETTINGS}
      - {number: 4, rule: CONTROL_ACCESS_POINT_CONFIGURATION_AND_SETTING_INTEGRITY}
    matrix:
      base: {K3: PLUS, K2: PLUS, K1: PLUS}
      enhancements: {K3: [], K2: [], K1: []}

  - code: "ЗБД.5"
    title: "Ограничение уровней сигналов"
    purpose: PREVENT_OR_HINDER_WIRELESS_ACCESS_FROM_OUTSIDE_CONTROLLED_ZONE
    implementation:
      - USE_WIRELESS_ACCESS_POINTS_WITH_CONFIGURABLE_SIGNAL_POWER
      - LIMIT_SIGNAL_LEVELS_USING_PHYSICAL_SYSTEM_BOUNDARIES_TO_MINIMIZE_SIGNAL_AT_BOUNDARIES
    documentation: []
    enhancements:
      - {number: 1, rule: MONITOR_WIRELESS_ACCESS_POINT_SIGNAL_LEVELS}
      - {number: 2, rule: CREATE_SIGNAL_COVERAGE_MAP_AND_SET_ACCESS_POINT_PLACEMENT_AND_POWER_USING_MAP}
      - {number: 3, rule: FILTER_ACCESS_POINT_DATA_TRANSMISSION_FREQUENCY_RANGE_TO_PREVENT_UNAUTHORIZED_WIRELESS_DATA_ACCESS}
    matrix:
      base: {K3: PLUS, K2: PLUS, K1: PLUS}
      enhancements: {K3: [], K2: [], K1: []}

  - code: "ЗБД.6"
    title: "Регистрация, анализ и реагирование на события безопасности"
    purpose: DEFINE_REGISTER_ANALYZE_AND_RESPOND_TO_WIRELESS_NETWORK_SECURITY_EVENTS
    implementation:
      - REGISTER_WIRELESS_ACCESS_NETWORK_SECURITY_EVENTS_IN_ACCORDANCE_WITH_RSB_1_TO_RSB_5
      - ANALYZE_REGISTERED_EVENTS_AND_RESPOND_TO_IDENTIFIED_COMPUTER_INCIDENTS
    documentation: []
    enhancements:
      - {number: 1, rule: NOTIFY_INFORMATION_SYSTEM_SECURITY_ADMINISTRATOR_OF_IDENTIFIED_COMPUTER_INCIDENT_SIGNS}
      - {number: 2, rule: BLOCK_AND_OR_ISOLATE_WIRELESS_ACCESS_POINTS_WITH_IDENTIFIED_COMPUTER_INCIDENTS}
    matrix:
      base: {K3: PLUS, K2: PLUS, K1: PLUS}
      enhancements: {K3: [], K2: [1], K1: [1]}

