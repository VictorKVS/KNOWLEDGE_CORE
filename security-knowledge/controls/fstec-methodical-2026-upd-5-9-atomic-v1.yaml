measures:
  - code: "УПД.5"
    title: "Предупреждение пользователя при его доступе к информационной системе"
    purpose: INFORM_USERS_OF_SECURITY_MEASURES_AND_MANDATORY_INFORMATION_HANDLING_RULES
    implementation:
      - DISPLAY_PRE_AUTHENTICATION_WARNING_THAT_SECURITY_MEASURES_ARE_IMPLEMENTED_AND_RULES_AND_RESTRICTIONS_MUST_BE_OBSERVED
      - ALLOW_ACCESS_ONLY_AFTER_USER_CONFIRMS_READING_WARNING
    documentation: []
    enhancements: []
    matrix:
      base: {K3: BLANK, K2: BLANK, K1: BLANK}
      enhancements: {K3: [], K2: [], K1: []}

  - code: "УПД.6"
    title: "Оповещение пользователя о предыдущем входе в информационную систему"
    purpose: NOTIFY_USER_OF_PRIOR_LOGIN_ATTEMPTS_FROM_THEIR_ACCOUNT
    implementation:
      - AFTER_SUCCESSFUL_LOGIN_NOTIFY_USER_OF_LAST_PRIOR_SUCCESSFUL_LOGIN_FROM_ACCOUNT
      - COORDINATE_SUCCESSFUL_LOGIN_WITH_IAF_1_TO_IAF_4
      - INCLUDE_AT_LEAST_DATE_OF_PREVIOUS_LOGIN
      - INCLUDE_AT_LEAST_TIME_OF_PREVIOUS_LOGIN
      - INCLUDE_OTHER_INFORMATION_DEFINED_FOR_INFORMATION_SYSTEM
      - USER_MUST_IMMEDIATELY_INFORM_PRIVILEGED_SECURITY_ADMINISTRATOR_WHEN_NOTIFICATION_REVEALS_UNAUTHORIZED_ACCESS
    documentation:
      - PREVIOUS_LOGIN_FACT_INFORMATION_SCOPE
      - PRIMARY_AND_ALTERNATIVE_NOTIFICATION_CHANNELS_AND_ADDRESSES
      - USER_CONTACT_DATA_CONFIGURATION_AND_CONFIRMATION_PROCEDURE
      - UNAUTHORIZED_ACCOUNT_ACCESS_SECURITY_ADMINISTRATOR_NOTIFICATION_PROCEDURE
    enhancements:
      - {number: 1, rule: NOTIFY_COUNT_OF_FAILED_LOGIN_ATTEMPTS_SINCE_LAST_SUCCESSFUL_LOGIN}
      - {number: 2, rule: NOTIFY_COUNT_OF_ALL_LOGIN_ATTEMPTS_IN_NONREGULATED_TIME}
      - {number: 3, rule: NOTIFY_COUNT_OF_ALL_LOGIN_ATTEMPTS_DURING_PERIOD_NOT_LESS_THAN_SEVEN_DAYS}
      - {number: 4, rule: NOTIFY_ACCOUNT_INFORMATION_CHANGES_SINCE_AT_LEAST_PREVIOUS_SUCCESSFUL_LOGIN}
      - {number: 5, rule: INCLUDE_SOURCE_LOCATION_AND_DEVICE_OR_APPLICATION_INFORMATION_FOR_LOGIN_ATTEMPTS}
      - {number: 6, rule: SEND_CRITICAL_EVENT_NOTIFICATIONS_OVER_ALTERNATIVE_CHANNELS}
    matrix:
      base: {K3: BLANK, K2: BLANK, K1: BLANK}
      enhancements: {K3: [], K2: [], K1: []}

  - code: "УПД.7"
    title: "Ограничение числа параллельных сеансов доступа"
    purpose: LIMIT_CONCURRENT_SESSIONS_FROM_ONE_ACCOUNT
    implementation:
      - ALLOW_CONCURRENT_SESSION_LIMITS_BASED_ON_ACCOUNT_IDENTIFIERS
      - AUTOMATICALLY_ACCOUNT_FOR_ACTIVE_SESSIONS_PER_USER_DEVICE_AND_APPLICATION_ACCOUNT
      - AUTOMATICALLY_LIMIT_CONCURRENT_SESSIONS_PER_USER_DEVICE_AND_APPLICATION_ACCOUNT
      - NOTIFY_USER_WHEN_CONCURRENT_SESSION_LIMIT_IS_EXCEEDED_FOR_OWN_ADMINISTERED_OR_CONTROLLED_ACCOUNTS
      - AFTER_SUCCESSFUL_AUTHENTICATION_AT_LIMIT_DISPLAY_EXCEEDANCE_MESSAGE
      - INCLUDE_LOCATIONS_OF_PRIOR_LOGINS_WITH_ACTIVE_SESSIONS_IN_MESSAGE
      - OFFER_TO_DISCONNECT_PRIOR_ACTIVE_SESSIONS
      - ALLOW_LIMIT_SCOPE_FOR_SYSTEM_SEGMENTS_GROUPS_INDIVIDUALS_OR_COMBINATIONS
    documentation:
      - MAXIMUM_CONCURRENT_SESSION_VALUES_BY_ACCOUNT_TYPE
      - ACTIVE_SESSION_ACCOUNTING_AND_REGISTRATION_PROCEDURE
      - AUTOMATIC_ACTIVE_SESSION_ACCOUNTING_AND_LIMIT_ENFORCEMENT_PROCEDURE
      - USER_NOTIFICATION_PROCEDURE_ON_CONCURRENT_SESSION_LIMIT_EXCEEDANCE
      - ADMINISTRATOR_NOTIFICATION_PROCEDURE_ON_ACTIVE_SESSION_LIMIT_EXCEEDANCE
      - NOTIFICATION_MESSAGE_INFORMATION_SCOPE
    enhancements:
      - number: 1
        rule: LIMIT_PRIVILEGED_USER_CONCURRENT_SESSIONS
        variants:
          - {selector: "1а", rule: PRIVILEGED_CONCURRENT_SESSIONS_NOT_MORE_THAN_TWO, maximum: 2}
          - {selector: "1б", rule: PRIVILEGED_CONCURRENT_SESSIONS_NOT_MORE_THAN_ONE, maximum: 1}
    matrix:
      base: {K3: BLANK, K2: PLUS, K1: PLUS}
      enhancements: {K3: [], K2: [], K1: ["1а"]}

  - code: "УПД.8"
    title: "Блокирование сеанса доступа пользователя при неактивности"
    purpose: PROTECT_UNATTENDED_ACTIVE_SESSIONS_FROM_UNAUTHORIZED_ACCESS
    implementation:
      - AUTOMATICALLY_BLOCK_SESSION_AFTER_INFORMATION_SYSTEM_DEFINED_INACTIVITY_TIME
      - BLOCK_SESSION_ON_ACCESS_SUBJECT_REQUEST
      - BLOCK_SESSION_ON_OPERATOR_REQUEST
      - WHILE_BLOCKED_DENY_ALL_INFORMATION_OR_DISPLAY_DEVICE_ACCESS_ACTIONS_EXCEPT_UNLOCK
      - REQUIRE_REPEAT_AUTHENTICATION_UNDER_IAF_3_TO_UNLOCK
      - DO_NOT_DISPLAY_ACCESS_SUBJECT_SESSION_INFORMATION_AFTER_BLOCKING
    documentation:
      - ALLOWED_INACTIVITY_TIME_VALUES_BY_USER_CATEGORY
      - AUTOMATIC_SESSION_BLOCKING_PROCEDURE
      - ACCESS_SUBJECT_WORK_RECOVERY_PROCEDURE_AFTER_SESSION_BLOCK
      - FAILED_UNLOCK_ATTEMPT_LIMIT_EXCEEDANCE_EVENT_REGISTRATION_PROCEDURE
    enhancements:
      - {id: U1, rule: TERMINATE_SESSION_AFTER_OPERATOR_DEFINED_INACTIVITY_TIME}
      - {id: U2, rule: TERMINATE_SESSION_AFTER_OPERATOR_DEFINED_FAILED_UNLOCK_ATTEMPT_COUNT}
    matrix:
      base: {K3: PLUS, K2: PLUS, K1: PLUS}
      enhancements: {K3: [], K2: [], K1: []}

  - code: "УПД.9"
    title: "Контроль действий субъектов доступа до идентификации и аутентификации"
    purpose: CONTROL_AND_LIMIT_PRE_AUTHENTICATION_ACTIONS
    implementation:
      - ALLOW_ONLY_ENUMERATED_PRE_AUTHENTICATION_ACTIONS_AND_PROHIBIT_ALL_OTHER_ACTIONS
      - DEFINE_PRIVILEGED_PRE_AUTHENTICATION_BYPASS_ACTIONS_NEEDED_TO_RESTORE_SYSTEM_FUNCTIONING
      - LOG_ALL_PRE_AUTHENTICATION_ACTIONS_EXCEPT_ACCESS_TO_PUBLIC_INFORMATION_REQUIRED_TO_BE_PUBLISHED
      - REVIEW_PERMITTED_PRE_AUTHENTICATION_ACTIONS_AT_LEAST_ANNUALLY_AND_AFTER_ACCESS_MODEL_CHANGES
    documentation:
      - RESOURCES_AND_COMPONENTS_ACCESSIBLE_BEFORE_IDENTIFICATION_AND_AUTHENTICATION
      - USER_ACTIONS_PERMITTED_BEFORE_IDENTIFICATION_AND_AUTHENTICATION
      - PRE_AUTHENTICATION_ACTION_REGISTRATION_PROCEDURE
    enhancements: []
    matrix:
      base: {K3: PLUS, K2: PLUS, K1: PLUS}
      enhancements: {K3: [], K2: [], K1: []}

