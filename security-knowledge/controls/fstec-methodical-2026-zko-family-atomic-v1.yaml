      - {number: 7, rule: BLOCK_START_OF_BROKEN_CONTAINER_IMAGE_AND_BROKEN_HOST_OR_CONTAINERIZATION_COMPONENTS}
    matrix:
      base: {K3: PLUS, K2: PLUS, K1: PLUS}
      enhancements: {K3: [], K2: [1, 2], K1: [1, 2, 3, 4, 5, 6]}

