    purpose: DEFINE_AND_REGISTER_CONTAINER_SECURITY_EVENTS
    implementation:
      - REGISTER_CONTAINER_EVENTS_IN_ACCORDANCE_WITH_RSB_1_TO_RSB_5
      - REGISTER_UNAUTHORIZED_ACCESS_ATTEMPTS_TO_CONTAINERIZATION_MEANS
      - REGISTER_CONTAINERIZATION_USER_AUTHENTICATION_ATTEMPTS
