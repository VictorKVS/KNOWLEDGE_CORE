scope_statement: >-
  Complete normalized coverage of section 4.5 measures ZKO.1-ZKO.8 for
  container environments and orchestration, including implementation,
  documentation, all numbered enhancements and all forty-eight appendix-2
  base/enhancement class cells. Applicability is conditional on container
  technology use where the source so states. Other measure families remain
  pending at content level.

