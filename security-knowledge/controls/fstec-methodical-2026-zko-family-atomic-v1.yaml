      - AT_LEAST_WEEKLY_CHECK_CONTAINER_EXECUTABLE_FILES_FOR_UNAUTHORIZED_CHANGES
      - USE_BUILT_IN_CONTAINERIZATION_AND_HOST_OS_SECURITY_MECHANISMS
    documentation: []
    enhancements:
      - {number: 1, rule: AT_LEAST_WEEKLY_CHECK_HOST_OS_AND_CONTAINERIZATION_EXECUTABLES_FOR_UNAUTHORIZED_CHANGES}
      - {number: 2, rule: AT_LEAST_WEEKLY_CHECK_HOST_OS_AND_CONTAINERIZATION_SETTINGS_FOR_UNAUTHORIZED_CHANGES}
      - {number: 3, rule: DETECT_START_OF_HOST_OS_OR_CONTAINERIZATION_COMPONENTS_WITH_BROKEN_INTEGRITY}
