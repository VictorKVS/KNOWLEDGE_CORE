      - STORE_CONTAINER_IMAGES
      - RETRIEVE_CONTAINER_IMAGES
      - DELETE_CONTAINER_IMAGES
      - INVENTORY_CONTAINERS
      - INVENTORY_CONTAINER_IMAGES
      - MANAGE_CONTAINER_IMAGE_FILE_PLACEMENT_AND_MOVEMENT_BETWEEN_MEDIA_OR_STORAGE_SYSTEMS
