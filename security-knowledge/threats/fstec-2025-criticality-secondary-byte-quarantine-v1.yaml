  "applicability":[
    {"clause":2,"rule":"The method assesses vulnerabilities in software and software-hardware used by information systems, networks and automated control systems, including systems operating on data-centre infrastructure."},
    {"clause":3,"rule":"Application is tied to the listed FSTEC protection regimes and other applicable acts or FSTEC methods; it is not asserted as universal for every private system."},
    {"clause":4,"rule":"For certified security products, vulnerabilities are assigned critical level V greater than 8.0 and remediated within the method's periods together with product documentation and developer recommendations."},
    {"clause":6,"rule":"The FSTEC criticality method approved on 2022-10-28 is not used for this assessment route after approval of the 2025 method."}
  ],
  "calculation":{
    "clause_12_formula":"V = Icvss * Iinfr * (Iat + Iimp)",
    "clause_14_infrastructure_formula":"Iinfr = k*K + l*L + p*P",
    "clause_16_attack_formula":"Iat = e*E",
    "clause_17_impact_formula":"Iimp = h*H",
    "inputs":[
      {"symbol":"Icvss","meaning":"base vulnerability-danger score"},
      {"symbol":"Iinfr","meaning":"effect on functioning of the concrete information system"},
      {"symbol":"Iat","meaning":"possibility of exploitation in the concrete information system"},
      {"symbol":"Iimp","meaning":"consequences of exploitation in the concrete information system"},
      {"symbol":"K","meaning":"type of affected system component"},
      {"symbol":"L","meaning":"share or count route for affected components"},
      {"symbol":"P","meaning":"effect on protection of the system or segment perimeter"},
      {"symbol":"E","meaning":"real-attack or exploit-availability evidence"},
      {"symbol":"H","meaning":"possible exploitation consequences"}
    ],
    "aggregation_rules":[
      "When multiple affected component types apply, select the greatest K value.",
      "When multiple E states apply, select the greatest E value.",
      "When multiple consequences apply, select the greatest H value.",
      "Recalculate when BDU exploitation information or impact conditions change."
    ],
    "cvss_route":"Use the vendor's CVSS 3.1 base score where present in BDU or another known vulnerability database; if absent, the specialist determines the CVSS version used for assessment.",
    "rounding_boundary":"No universal rounding mode is asserted beyond the worked examples until official bytes are compared."
  },
  "thresholds":[
    {"level":"CRITICAL","condition":"V > 8.0"},
    {"level":"HIGH","condition":"5.0 <= V <= 8.0"},
    {"level":"MEDIUM","condition":"2.0 <= V < 5.0"},
    {"level":"LOW","condition":"V < 2.0"}
  ],
  "reassessment":{"clause":19,"rule":"Recalculate continuously, where possible automatically, when new vulnerability information appears, including a remediation update or public exploit."},
  "recommended_remediation_clocks":[
    {"level":"CRITICAL","recommendation":"within several hours, up to 24 hours","trigger":"time of the assessment"},
    {"level":"HIGH","recommendation":"within several days, up to 7 days","trigger":"time of the assessment"},
    {"level":"MEDIUM","recommendation":"within several weeks, up to 4 weeks","trigger":"time of the assessment"},
    {"level":"LOW","recommendation":"within several months, up to 4 months","trigger":"time of the assessment"}
  ],
  "clock_boundary":"Clause 21 uses recommendations. These clocks are not converted into universal statutory limitation periods, incident-notification clocks, certificate lifecycle periods or automatic contractual deadlines.",
  "treatment_routes":[
    {"clause":22,"route":"install an update or apply compensating organisational and technical measures"},
    {"clause":23,"route":"for foreign or open-source products, decide on installation using results of update testing under the FSTEC method approved 2022-10-28"},
    {"clause":24,"route":"when obtaining, installing or testing an update is impossible, apply compensating measures"},
    {"clause":25,"route":"select compensating measures from system characteristics and feasible exploitation paths; the listed measures are examples, not an automatic exhaustive control set"}
  ],
  "decision_gates":[
    {"id":"G1","test":"Record source state and never label mirror bytes official."},
    {"id":"G2","test":"Resolve applicability before calculation."},
    {"id":"G3","test":"Bind each score to the concrete system and observation time."},
    {"id":"G4","test":"Require all four top-level indicators and their evidence."},
    {"id":"G5","test":"Apply boundary operators exactly, especially V equals 8.0, 5.0 and 2.0."},
    {"id":"G6","test":"Treat clause 21 clocks as recommendations from assessment time."},
    {"id":"G7","test":"Recalculate on exploit, BDU, impact or update change."},
    {"id":"G8","test":"Keep treatment separate from post-treatment verification."}
  ],
