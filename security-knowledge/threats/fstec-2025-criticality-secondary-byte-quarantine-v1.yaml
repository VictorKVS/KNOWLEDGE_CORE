  "source_gate":{
    "accepted":"Clause text may be used as a labelled secondary cross-check where the mirror is internally coherent and agrees with indexed official identity and independent summaries.",
    "rejected":"The mirror SHA-256 is not the official PDF SHA-256 and cannot prove byte equality, signature, publication time or official archival provenance.",
