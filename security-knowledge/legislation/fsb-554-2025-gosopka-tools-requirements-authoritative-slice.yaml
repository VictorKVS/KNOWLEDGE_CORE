requirements:
  - id: FSB554-004
    locator: "Приложение, раздел II, п.4"
    status: AUTHORITATIVE_VERIFIED
    rule: >-
      Means of GosSOPKA must be produced, supported, technically maintained and modernized
      exclusively by Russian legal entities not under direct or indirect control of foreign persons/entities.
  - id: FSB554-005
    locator: "Приложение, раздел II, п.5"
    status: AUTHORITATIVE_VERIFIED
    rule: >-
      Remote administration by persons outside the permitted personnel/engaged accredited GosSOPKA center
      or licensed information-protection organization must be excluded.
  - id: FSB554-006
    locator: "Приложение, раздел II, п.6"
    status: AUTHORITATIVE_VERIFIED
    rule: >-
      Unauthorized transfer of processed information to persons outside the permitted personnel/engaged
      accredited or licensed organizations must be excluded; manufacturer-provided user-activity monitoring
      must be capable of forced disabling by the user.
  - id: FSB554-007
    locator: "Приложение, раздел II, п.7"
    status: AUTHORITATIVE_VERIFIED
    rule: "GosSOPKA tools must implement the security functions established by section IX."

  - id: FSB554-011-RETENTION
    locator: "Приложение, раздел III, п.11"
    status: AUTHORITATIVE_VERIFIED
    rule: "Detection tools must support storage of aggregated information-security events for at least 6 months."
    deadline_or_period: "not_less_than_6_months"
  - id: FSB554-012-CERT
    locator: "Приложение, раздел III, п.12"
    status: AUTHORITATIVE_VERIFIED
    rule: "Detection tools must hold an FSB conformity certificate for computer-attack detection tools."
  - id: FSB554-017-FRESHNESS
    locator: "Приложение, раздел IV, п.17"
    status: AUTHORITATIVE_VERIFIED
    rule: >-
      Warning/prevention tools must check for updates in their information sources at least once every 24 hours
      and load available updates; they must also support structured cyber-intelligence exchange and API-based integration.
    deadline_or_period: "at_least_once_per_24_hours"

  - id: FSB554-018
    locator: "Приложение, раздел V, п.18"
    status: AUTHORITATIVE_VERIFIED
    rule: >-
      Consequence-mitigation tools must support incident accounting/processing, response-process management,
      interaction with NКЦКИ technical infrastructure and information-analytical support.
  - id: FSB554-021
    locator: "Приложение, раздел V, п.21"
    status: AUTHORITATIVE_VERIFIED
    rule: >-
      Consequence-mitigation tools must support automated exchange of attack/incident information with NКЦКИ,
      automated receipt of threat information and incident-card accounting using NКЦКИ identification.

  - id: FSB554-023-RETENTION
    locator: "Приложение, раздел VI, п.23"
    status: AUTHORITATIVE_VERIFIED
    rule: >-
      Telecom-network attack-indicator search tools must retain copies of traffic containing attack indicators
      and/or telecom-equipment management indicators for at least 6 months.
    deadline_or_period: "not_less_than_6_months"
  - id: FSB554-025-RETENTION
    locator: "Приложение, раздел VII, п.25"
    status: AUTHORITATIVE_VERIFIED
    rule: "Attack-indicator search tools must retain copies of traffic containing detected attack indicators for at least 7 calendar days."
    deadline_or_period: "not_less_than_7_calendar_days"
  - id: FSB554-026-CERT
    locator: "Приложение, раздел VII, п.26"
    status: AUTHORITATIVE_VERIFIED
    rule: "Attack-indicator search tools must hold an FSB conformity certificate for computer-attack detection tools."

  - id: FSB554-027
    locator: "Приложение, раздел VIII, п.27"
    status: AUTHORITATIVE_VERIFIED
    rule: "Information-exchange tools must support transmission, reception and integrity protection during exchange."
  - id: FSB554-028
    locator: "Приложение, раздел VIII, п.28"
    status: AUTHORITATIVE_VERIFIED
    rule: "Cryptographic protection means used for this GosSOPKA information exchange must be certified by the FSB of Russia."

  - id: FSB554-029
    locator: "Приложение, раздел IX, п.29"
    status: AUTHORITATIVE_VERIFIED
    rule: >-
      GosSOPKA tools must implement identification/authentication, access control, event logging,
      software/service-database update, backup/recovery, time synchronization and software-integrity control.
  - id: FSB554-030-PASSWORDS
    locator: "Приложение, раздел IX, п.30"
    status: AUTHORITATIVE_VERIFIED
    rule: >-
      Authentication capabilities must support passwords and/or hardware authentication, encrypted or hashed
      password storage, and automatic notification of the need to change passwords.
  - id: FSB554-031-ACCESS
    locator: "Приложение, раздел IX, п.31"
    status: AUTHORITATIVE_VERIFIED
    rule: >-
      Access-control capabilities must support role lifecycle and rights configuration, inactivity session blocking,
      account blocking/reactivation, notification of failed management-access attempts and logging of all user actions after authorization.
  - id: FSB554-032-LOGGING
    locator: "Приложение, раздел IX, п.32"
    status: AUTHORITATIVE_VERIFIED
    rule: >-
      Security-event registration must support configurable registered events and retention periods and record
      user identifiers, authorization times, security-process start/stop, management commands, failed authentication
      and failures; specified telecom-network tools additionally require protected technical-state journals.
  - id: FSB554-033-UPDATE
    locator: "Приложение, раздел IX, п.33"
    status: AUTHORITATIVE_VERIFIED
    rule: >-
      Updates must preserve required operational/incident/event information, be executable only by responsible administrators,
      and support recovery from update failure including backup and restoration.
  - id: FSB554-034-BACKUP
    locator: "Приложение, раздел IX, п.34"
    status: AUTHORITATIVE_VERIFIED
    rule: >-
      GosSOPKA tools must support backup of configuration data and software to external media; telecom-network attack-indicator
      tools additionally require self-recovery capability for critical operational errors.
  - id: FSB554-035-INTEGRITY
    locator: "Приложение, раздел IX, п.35"
    status: AUTHORITATIVE_VERIFIED
    rule: >-
      Software-integrity control must support integrity checks at load time, during operation and on administrator command,
      normal self-testing, and logging of integrity-control results.

applicability_guardrails:
  - "These are requirements to categories of GosSOPKA technical/software means; they are not automatically a universal checklist for every information system component."
  - "Certification requirements in paragraphs 12, 26 and 28 apply to the specifically named tool categories; do not extrapolate them to unrelated security products."
  - "The retention periods in paragraphs 11, 23 and 25 are minimum requirements for the stated tool functions and must not be substituted for unrelated organizational log-retention periods."
  - "Order 554 replaces order 196; requirements from the superseded order must not be mixed into the current baseline without explicit historical/version analysis."
  - "No claim of full compliance may be made from this slice alone: installation/operation duties are governed separately, including by order 553 and other current GosSOPKA acts."

