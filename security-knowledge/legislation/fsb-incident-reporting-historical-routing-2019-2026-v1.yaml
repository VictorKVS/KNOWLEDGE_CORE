  - id: HIST-FSB-002
    if: significant_CII_incident_date_between_2022-08-16_and_2026-01-29
    route: FSB-282-2019_as_amended_by_FSB-348-2022
  - id: HIST-FSB-003
    if: applicable_current_incident_date_on_or_after_2026-01-30
    route: FSB-547-2025
  - id: HIST-FSB-004
    if: PD_operator_incident_date_on_or_after_2023-03-01_and_FSB77_applicable
    route_additionally: FSB-77-2023
  - id: HIST-FSB-005
    if: event_before_effective_date_of_candidate_rule
    result: NEEDS_PREDECESSOR_REVIEW

fail_closed_guardrails:
  - FSB-547-2025 MUST NOT be backcast to events before 2026-01-30.
  - FSB-348-2022 is an amendment, not an independent full incident-reporting regime.
  - Repeal of FSB-282/348 by FSB-547 does NOT prove repeal of FSB-77-2023.
  - FSB-77-2023 MUST NOT be treated as a general replacement for CII reporting rules; its applicability is tied to personal-data operator incidents within its scope.
  - The 24-hour FSB-77 deadline MUST NOT overwrite a stricter applicable CII deadline from another binding route.
  - Publication metadata and authoritative reproductions do not qualify as IMMUTABLE_PRIMARY without exact bytes + retrieved_at + SHA-256.

source_quality_notes:
  - FSB-282, FSB-348, FSB-547 and FSB-77 publication identities are supported by official publication sources.
  - Exact effective dates for the historical FSB-282/348 versions are recorded from authoritative legal-system lifecycle metadata and remain non-immutable until exact artifacts are acquired.
  - FSB-77 current status is supported by authoritative legal-system status metadata observed 2026-08-16; absence of an explicit repeal edge is not promoted beyond that evidence.
