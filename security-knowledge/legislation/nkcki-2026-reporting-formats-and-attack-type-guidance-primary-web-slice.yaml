schema_version: "1.0"
id: nkcki-2026-reporting-formats-and-attack-type-guidance-primary-web-slice
checked_at: "2026-08-19"
status: PRIMARY_WEB_VERIFIED_EXACT_DOWNLOAD_TARGETS_RESOLVED
purpose: >-
  Register the July 2026 NKTsKI operational layer that sits below the current FSB GosSOPKA orders:
  reporting formats/technical parameters and methodological guidance for determining computer-attack type.
  This file deliberately separates binding/order metadata from methodological recommendations.

