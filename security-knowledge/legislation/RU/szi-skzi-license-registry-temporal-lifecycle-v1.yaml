      "purchase date",
      "production evidence",
      "acceptance date",
      "technical support",
      "actual role and works"
    ],
    "result_states": [
      "VERIFIED_APPLICABLE",
      "VERIFIED_NOT_APPLICABLE",
      "EVIDENCE_PENDING",
      "CONFLICT_REVIEW"
    ],
    "boundary": "Registry presence is necessary evidence only where the governing requirement makes that certificate or licence relevant; it is not a universal deployment-approval verdict."
  },
  "snapshot_protocol": {
    "required": [
      "retrieval UTC time",
      "source URL",
      "HTTP status and validators",
      "raw bytes",
      "SHA-256",
      "native update time",
      "parser version",
      "record count",
      "schema and field map"
    ],
    "history": "append-only observations linked by record identity and supersedes edges",
    "transport_failure": "PENDING_TRANSPORT_NOT_NEGATIVE_FACT"
  },
  "stages": [
    "identify the governing regime, authority, registry and event date",
    "capture immutable registry bytes, metadata, hash, schema and native update time",
    "resolve the certificate, licence, product, licensee and organisational identities",
    "reconstruct native lifecycle events and normalized valid-time intervals",
    "match product version, scheme, requirements, production or batch and technical support",
    "match licence activity, works or services, places, contract role and exceptions",
    "join registry evidence to the deployed instance, supplier, acceptance and use context",
    "preserve PENDING and conflicts, run red-team checks and issue an as-of applicability result"
  ],
  "red_team_attacks": [
    {
      "id": "RT01",
      "attack": "treat an FSTEC SZI certificate as a licence to perform protection work",
      "blocked_by": "certificate, licence, activity and actor are separate evidence routes",
      "blocked": true
    },
    {
      "id": "RT02",
      "attack": "treat a TЗКИ or cryptographic-activity licence as certification of every product used by the licensee",
      "blocked_by": "product conformity and licensed activity are checked independently",
      "blocked": true
    },
    {
      "id": "RT03",
      "attack": "apply the current registry status retroactively to an earlier procurement, deployment or incident date",
      "blocked_by": "valid-from, valid-to, decision date, registry observation and event date are preserved separately",
      "blocked": true
    },
    {
      "id": "RT04",
      "attack": "treat expiry of a serial-production certificate as automatic invalidity or mandatory removal of every earlier-produced instance",
      "blocked_by": "Order 55 production-period, conformity and technical-support conditions are tested for the supplied instance",
      "blocked": true
    },
    {
      "id": "RT05",
      "attack": "treat absence of an expiry date for a unit or batch certificate as certification of all future versions or copies",
      "blocked_by": "unit or batch identity and certified configuration remain closed scope",
      "blocked": true
    },
    {
      "id": "RT06",
      "attack": "match a certificate by product family or trade name while ignoring version, edition, platform or configuration",
      "blocked_by": "exact identity and configuration matching is required",
      "blocked": true
    },
    {
      "id": "RT07",
      "attack": "treat any licence suspension as covering all works and all locations",
      "blocked_by": "Article 20 permits work-specific and place-specific suspension; native scope is preserved",
      "blocked": true
    },
    {
      "id": "RT08",
      "attack": "treat existence of a licence record as authorisation for every work, service, branch and contract role",
      "blocked_by": "exact licensed works, locations and actual activities must intersect",
      "blocked": true
    },
    {
      "id": "RT09",
      "attack": "use a scanned paper licence or certificate without reconciling it to the authoritative registry record and later decisions",
      "blocked_by": "current and historical registry evidence plus hashes and decision records are required",
      "blocked": true
    },
    {
      "id": "RT10",
      "attack": "apply the PP 313 own-needs maintenance exception to services performed for customers or third parties",
      "blocked_by": "actual beneficiary, contract role, works and exception conditions are documented",
      "blocked": true
    },
    {
      "id": "RT11",
      "attack": "infer SKZI certification or FSB approval from an FSTEC register entry or from a cryptographic licence",
      "blocked_by": "FSTEC and FSB regimes are not substituted for one another",
      "blocked": true
    },
    {
      "id": "RT12",
      "attack": "treat a timeout, missing public field or absent search result as proof that a certificate or licence is absent, active or terminated",
      "blocked_by": "transport and evidence gaps remain PENDING and trigger an authoritative extract request",
      "blocked": true
    }
  ],
  "evidence_artifacts": [
    "source URL, retrieval time, HTTP metadata, immutable bytes and content hash for every registry snapshot",
    "registry owner, dataset identity, publication or update timestamp and native schema version",
    "certificate number, native status, issue date, expiry or no-term scheme and registry entry history",
