  "scope_boundary": "Модель нормализует нормативные состояния и evidence-гейты. Она не утверждает статус конкретного сертификата, продукта, СКЗИ, лицензиата или поставки без воспроизводимого снимка реестра и идентификации записи.",
  "register_separation": {
    "fstec_szi_certificate": "conformity of a defined product or unit, batch or serial-production scope",
    "fstec_tzki_licence": "right of a legal entity or individual entrepreneur to perform the specified technical-protection works or services",
    "fstec_development_production_licence": "right to perform specified development or production activities for confidential-information protection means",
    "fsb_crypto_activity_licence": "right to perform the PP 313 cryptographic activities within the listed works and exceptions",
    "boundary": "No record substitutes for another authority, product, activity, place, version or time interval."
  },
  "certificate_lifecycle": {
    "serial_max_years": 5,
    "serial_rule": "the application determines the term within the five-year maximum; a serial product is considered certified only if produced during that term, conforming and technically supported by the manufacturer and/or applicant",
    "unit_or_batch_term": "NO_TERM_SET_BUT_IDENTITY_AND_SCOPE_REMAIN_FINITE",
    "extension": "application and certification procedure required; no automatic extension",
    "suspension": {
      "maximum_calendar_days": 90,
      "notification_working_days": 5,
      "production_and_sale": "STOP_BY_APPLICANT",
      "registry_update": true
    },
    "termination": {
      "grounds": [
        "failure to submit correction evidence in time",
        "technical support not resumed in time",
        "applicant request"
      ],
      "notification_working_days": 5,
      "production_and_sale": "STOP_BY_APPLICANT",
      "registry_update": true
    },
    "normalized_states": [
      "EVIDENCE_PENDING",
      "ACTIVE_SERIAL",
      "ACTIVE_UNIT_OR_BATCH_NO_TERM",
      "SUSPENDED",
      "RESUMED",
      "EXPIRED_SERIAL",
      "TERMINATED"
    ],
    "boundary": "These are normalized evidence states; the source-native wording and decision must be retained."
  },
  "licence_lifecycle": {
    "grant": "the licence is deemed granted when the authorised official enters the grant record in the licence register",
    "exercise_start": "the licensed activity may be carried out from the day following grant, subject to the applicable regime",
    "general_term": "INDEFINITE_UNDER_99_FZ_ARTICLE_9_UNLESS_A_FEDERAL_LAW_PROVIDES_OTHERWISE",
    "suspension_scope": [
      "all works or services",
      "selected works or services",
      "one place",
      "several places"
    ],
    "registry_events": [
      "grant",
      "change",
      "periodic confirmation",
      "prescription",
      "suspension",
      "resumption",
      "termination",
      "court annulment"
    ],
    "voluntary_cessation_notice_calendar_days": 15,
    "termination_decision_working_days": 10,
    "normalized_states": [
      "EVIDENCE_PENDING",
      "ACTIVE",
      "SUSPENDED_PARTIAL",
      "SUSPENDED_ALL",
      "RESUMED",
      "TERMINATED",
      "ANNULLED"
    ],
    "boundary": "A native register entry, scope, effective date and underlying decision control; a document scan alone is not treated as current status."
  },
  "applicability_join": {
    "product_keys": [
      "certificate number",
      "product name",
      "version",
