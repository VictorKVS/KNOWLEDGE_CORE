  "stages": [
    "establish ISPDn scope, operator, processing and protection level",
    "verify the threat model and actual threat types",
    "discover actual cryptographic use and document the necessity decision",
    "select and verify the SKZI class from threat type and attacker-capability assumptions",
    "match exact certified product, version, configuration, platform and valid-time",
    "classify actual PP 313 works, performers, beneficiaries, places and exceptions",
    "match any required FSB licence scope and historical interval",
    "verify Order 378 operational measures and issue VERIFIED, NOT_APPLICABLE, PENDING or CONFLICT with reasons"
  ],
  "red_team_attacks": [
    {
      "id": "RT01",
      "attack": "declare encryption or SKZI mandatory for every ISPDn",
      "blocked_by": "Order 378 applicability requires actual SKZI use; PP 1119 ties evaluated protection means to documented threat-neutralization necessity",
      "blocked": true
    },
    {
      "id": "RT02",
      "attack": "declare Order 378 irrelevant merely because no formal crypto policy was found",
      "blocked_by": "actual architecture, traffic, storage, keys and product inventory must be checked",
      "blocked": true
    },
    {
      "id": "RT03",
      "attack": "select a SKZI class from protection level alone",
      "blocked_by": "actual threat type and approved attack-capability assumptions are required",
      "blocked": true
    },
    {
      "id": "RT04",
      "attack": "treat KS1, KV or KA as interchangeable product marketing labels",
      "blocked_by": "authority-native class and certificate scope must be verified",
      "blocked": true
    },
    {
      "id": "RT05",
      "attack": "treat any FSB-certified product as suitable for any version, platform and threat model",
      "blocked_by": "exact product identity, configuration, class and certificate valid-time must match",
      "blocked": true
    },
    {
      "id": "RT06",
      "attack": "treat possession or routine use of SKZI as proof that the operator needs every PP 313 licensed work",
      "blocked_by": "actual activity, performer, beneficiary and exceptions are analyzed separately",
      "blocked": true
    },
    {
      "id": "RT07",
      "attack": "treat a contractor's FSB licence as covering installation, maintenance, transfer and keys automatically",
      "blocked_by": "exact PP 313 work identifiers and licence scope must intersect the contract",
      "blocked": true
    },
    {
      "id": "RT08",
      "attack": "apply the own-needs maintenance exception to a contractor serving customers",
      "blocked_by": "beneficiary and contractual facts must satisfy the exception",
      "blocked": true
    },
    {
      "id": "RT09",
      "attack": "treat an encrypted removable medium as exempt from accounting",
      "blocked_by": "Order 378 still requires item-by-item media accounting",
      "blocked": true
    },
    {
      "id": "RT10",
      "attack": "convert the six-month or monthly control interval into a universal control frequency for all measures",
      "blocked_by": "each frequency remains attached to its specified journal-control measure and level",
      "blocked": true
    },
    {
      "id": "RT11",
      "attack": "treat a certificate and licence as evidence that keys, access lists and journals are properly operated",
      "blocked_by": "deployment and operational evidence remain independent",
      "blocked": true
    },
    {
      "id": "RT12",
      "attack": "declare compliance when threat, product, licence or historical evidence is missing",
      "blocked_by": "missing evidence stays EVIDENCE_PENDING and cannot become NOT_APPLICABLE",
      "blocked": true
    }
  ],
