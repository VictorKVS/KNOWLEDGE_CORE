  "scope_boundary": "The model determines evidence gates when SKZI is selected or found in an ISPDn. It does not impose encryption on every ISPDn, approve a concrete product, or conclude that a licence is required or not required without the actual activity and actor.",
  "regime_separation": {
    "operator_obligation": "152-FZ, PP 1119 and applicable FSTEC/FSB measures",
    "skzi_measures": "Order 378 when SKZI is used to protect PDn in an ISPDn",
    "product_conformity": "exact FSB product-certification or conformity evidence",
    "licensed_activity": "PP 313 exact works performed by an identified actor",
    "operational_compliance": "keys, media, premises, access, journals, checks and product documentation",
    "boundary": "Each route requires its own evidence."
  },
  "applicability_gates": [
    {
      "id": "AG01",
      "question": "Is the system an ISPDn and are the relevant personal-data processing operations in scope?",
      "fail_state": "NOT_THIS_MODEL_OR_SCOPE_REVIEW"
    },
    {
      "id": "AG02",
      "question": "What protection level and actual threat types are supported by the current system and threat-model evidence?",
      "fail_state": "EVIDENCE_PENDING"
    },
    {
      "id": "AG03",
      "question": "Is cryptographic protection selected and actually used to protect PDn in this system?",
      "fail_state": "NO_ORDER_378_APPLICABILITY_ASSERTED"
    },
    {
      "id": "AG04",
      "question": "Is the selected protection means necessary for neutralizing documented actual threats or required by another applicable rule?",
      "fail_state": "DESIGN_JUSTIFICATION_PENDING"
    },
    {
      "id": "AG05",
      "question": "Does the exact SKZI product, version, configuration and certificate scope match the deployment?",
      "fail_state": "PRODUCT_EVIDENCE_PENDING"
    },
    {
      "id": "AG06",
      "question": "Which person performs each installation, maintenance, transfer, key or cryptographic service and for whose benefit?",
      "fail_state": "ACTIVITY_AND_ACTOR_PENDING"
    },
    {
      "id": "AG07",
      "question": "Where a PP 313 licensed work is performed, does the actor's FSB licence contain the exact work and relevant scope?",
      "fail_state": "LICENCE_SCOPE_PENDING"
    },
    {
      "id": "AG08",
      "question": "Are Order 378 measures, operational documents, keys, media, access, journals and control evidence implemented?",
      "fail_state": "IMPLEMENTATION_EVIDENCE_PENDING"
    }
  ],
