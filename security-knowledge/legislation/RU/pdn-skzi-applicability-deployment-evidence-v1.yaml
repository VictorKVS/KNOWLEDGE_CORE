  "order_378_level_measures": {
    "UZ4": [
      "controlled access to premises containing SKZI or key, authentication and password information",
      "removable-media storage rule and item-by-item media accounting",
      "approved and current list of persons whose PDn access is needed for duties",
      "attack-capability assumptions approved by the operator head",
      "SKZI operation under product documentation and applicable rules"
    ],
    "UZ3": [
      "all applicable UZ4 measures",
      "appoint a sufficiently skilled official responsible for PDn security in the information system"
    ],
    "UZ2": [
      "all applicable UZ3 measures",
      "approve and maintain list of persons admitted to electronic message-journal content",
      "automatically register PDn requests and provision events",
      "exclude journal access by other persons",
      "check journal-control mechanisms at least once every six months"
    ],
    "UZ1": [
      "all applicable UZ2 measures",
      "automatically register changes to employee PDn-access powers in the security journal",
      "ensure journal powers correspond to job duties",
      "control security-journal maintenance at least once every month",
      "analyse whether a separate responsible unit is appropriate and create one or assign its functions",
      "additional physical-protection measures for specified room windows and doors"
    ]
  },
