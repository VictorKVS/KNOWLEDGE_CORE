  "extract_content": {
    "minimum_register_fields": "ARTICLE_21_PART_2_ITEMS_1_TO_8",
    "formation_date_required": true,
    "two_dimensional_barcode_required": true,
    "barcode_target": "internet page containing the relevant register record",
    "restricted_information": "provided only to a person authorised to access it",
    "personal_data": "included where the extract is requested by the licensee",
    "boundary": "An extract is an observation formed on a date; it is not proof of future status or every historical interval."
  },
  "verification_states": [
    {
      "state": "PUBLIC_REGISTER_DISCOVERY",
      "gate": "official CLSZ register route identified"
    },
    {
      "state": "PUBLIC_RECORD_CAPTURED",
      "gate": "record bytes, retrieval metadata and hash retained"
    },
    {
      "state": "EXTRACT_REQUEST_PREPARED",
      "gate": "form 20 identifiers and delivery address complete"
    },
    {
      "state": "SIGNED_EXTRACT_RECEIVED",
      "gate": "qualified electronic signature and formation date verified"
    },
    {
      "state": "QR_TARGET_RECONCILED",
      "gate": "barcode target captured and compared with extract"
    },
    {
      "state": "WORK_SCOPE_MATCHED",
      "gate": "actual contract work intersects exact PP 313 work identifiers"
    },
    {
      "state": "HISTORICAL_INTERVAL_RECONSTRUCTED",
      "gate": "grant, change, suspension, resumption, termination and annulment events preserved"
    },
    {
      "state": "EVIDENCE_PENDING",
      "gate": "transport, identity, scope, signature, restricted data or event history incomplete"
    }
  ],
  "stages": [
    "separate the FSB product-certification list from the cryptographic-activity licence register",
    "identify the licensing authority, registration number, licence date and licensee",
    "capture the public record when available without treating failure as a negative fact",
    "prepare and submit the current form 20 request for a specific licence",
    "retain the signed extract or negative certificate, signature evidence and formation date",
    "capture and reconcile the two-dimensional barcode target with the extract",
    "match exact PP 313 work identifiers, places, contract role and own-needs boundary",
    "reconstruct the as-of lifecycle interval and preserve conflicts or gaps as EVIDENCE_PENDING"
  ],
  "red_team_attacks": [
    {
      "id": "RT01",
      "attack": "treat the FSB-certified product list as a licence register",
      "blocked_by": "certification and licensed-activity routes remain separate",
      "blocked": true
    },
    {
      "id": "RT02",
      "attack": "treat an FSB cryptographic-activity licence as certification of every product",
      "blocked_by": "product certification requires its own list entry and exact product identity",
      "blocked": true
    },
    {
      "id": "RT03",
      "attack": "approve a contractor merely because its name appears in a public register",
      "blocked_by": "exact registration number, identity, works, places, status and event date must match",
      "blocked": true
    },
    {
      "id": "RT04",
      "attack": "infer every one of the 28 PP 313 works from the existence of a licence",
      "blocked_by": "the extract must contain the exact licensed works or services",
      "blocked": true
    },
    {
      "id": "RT05",
      "attack": "treat a scan or notification as the current authoritative record",
      "blocked_by": "registry record and signed dated extract are reconciled with later events",
      "blocked": true
    },
    {
      "id": "RT06",
      "attack": "apply a current public status retroactively to a procurement or incident",
      "blocked_by": "historical lifecycle intervals require dated events",
      "blocked": true
    },
    {
      "id": "RT07",
      "attack": "interpret a missing public record as proof that no licence exists",
      "blocked_by": "identity ambiguity, restricted data and transport failures remain EVIDENCE_PENDING",
      "blocked": true
    },
    {
      "id": "RT08",
      "attack": "submit an invented generic portal or API query as the mandatory FSB route",
      "blocked_by": "Article 21 security-authority exception and FSB form 20 route are preserved",
      "blocked": true
    },
    {
      "id": "RT09",
      "attack": "accept an unsigned PDF as the electronic extract required by Article 21",
      "blocked_by": "qualified electronic signature, formation date and provenance are verified",
      "blocked": true
    },
    {
      "id": "RT10",
      "attack": "treat the QR target as proof without capturing the target record and time",
      "blocked_by": "extract, barcode target, retrieval bytes and observed-at are retained separately",
      "blocked": true
    },
    {
      "id": "RT11",
      "attack": "treat the own-needs maintenance exception as covering customer services",
      "blocked_by": "beneficiary, contract role, actual work and PP 313 conditions require evidence",
      "blocked": true
    },
    {
      "id": "RT12",
      "attack": "use a licence number alone despite conflicting licensee or licensing-authority data",
      "blocked_by": "all stable identifiers and conflicts are reconciled before VERIFIED",
      "blocked": true
    }
  ],
