schema_version: "1.0"
id: RU-MINKOMSVYAZ-645-2016-APPENDICES3-TO9-PROTOCOL-CORE-ATOMIC-V1
title: "Приказ Минкомсвязи № 645: протокольное ядро приложений № 3–9"
checked_at: "2026-08-27"
status: VERIFIED_CURRENT_PROTOCOL_HEADERS_CODE_REGISTRIES_AND_SEQUENCE_DEEP_TABLES_PENDING
scope: >-
  Точные общие заголовки команд, сообщений КПД1 и сообщений КПД2,
  реестры кодов семнадцати команд, двенадцати сообщений КПД1 и девяти
  сообщений КПД2, а также правила последовательности приложения № 5.
  Детальные поля содержания каждой команды и сообщения, таблицы сочетаний
  бит и специальные значения вложенных полей остаются отдельной границей
  до проверки неизменяемого официального файла по страницам.

