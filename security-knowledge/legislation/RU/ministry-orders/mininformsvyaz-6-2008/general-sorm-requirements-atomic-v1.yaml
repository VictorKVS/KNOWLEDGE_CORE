id: RU-MININFORMSVYAZ-6-2008-GENERAL-SORM-ATOMIC-V1
title: "Приказ Мининформсвязи России от 16.01.2008 № 6: общие требования к сетям электросвязи для ОРМ"
checked_at: "2026-08-27"
status: VERIFIED_CURRENT_ORIGINAL_EDITION_TEXT
scope: >-
  Открытая нормативная модель 12 пунктов Части I и четырех пунктов приложения
  о технологическом помещении. Она задает общий слой для применимых сетей
  электросвязи и не заменяет специальные части по видам сетей, законное
  основание конкретного ОРМ либо закрытые организационные и технические методы.

