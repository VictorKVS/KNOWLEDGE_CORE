scope: >-
  Открытая нормативная модель 13 пунктов требований и пяти пунктов приложения
  о помещениях. Применяется только к сетям и средствам оператора почтовой
  связи. Не переносит по аналогии правила электросвязи, не создает
  самостоятельного основания конкретного ОРМ и не раскрывает закрытые приемы.

