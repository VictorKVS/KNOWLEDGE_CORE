byte_orientation:
  multi_byte_order: LOWER_BYTE_FIRST_IN_FIGURES
  bit_order: D7_LEFT_D0_RIGHT
  nibble_order: HIGH_D7_D4_LEFT_LOW_D3_D0_RIGHT

command_header:
  bytes: 10
  fields:
    - {byte: 1, field: PREAMBLE, exact: CCH}
    - {byte: 2, field: TECHNICAL_MEANS_ORM_NUMBER}
    - {byte: 3, field: COMMAND_CODE}
    - {byte: 4, field: COMMAND_CONTENT_LENGTH_BYTES}
    - {bytes: "5-10", field: PASSWORD, length_bytes: 6}

command_codes:
  - {number: 1, code: 01H, name: START_TECHNICAL_MEANS_ORM}
  - {number: 2, code: 02H, name: STOP_TECHNICAL_MEANS_ORM}
  - {number: 3, code: 03H, name: SET_PASSWORD}
  - {number: 4, code: 04H, name: ASSIGN_KSL_TO_GROUP}
  - {number: 5, code: 05H, name: PLACE_OBJECT_UNDER_CONTROL}
  - {number: 6, code: 06H, name: REMOVE_OBJECT_FROM_CONTROL}
  - {number: 7, code: 07H, name: CONNECT_TO_SPEECH_PATH}
  - {number: 8, code: 08H, name: RELEASE_CONTROL_CONNECTION_LINE}
  - {number: 9, code: 09H, name: EXCLUDE_CONTROL_CONNECTION_LINE_FROM_GROUP}
  - {number: 10, code: 0AH, name: REQUEST_CONTROL_OBJECT_DATA}
  - {number: 11, code: 0BH, name: REQUEST_KSL_GROUP_MAPPING}
  - {number: 12, code: 0CH, name: REQUEST_COMMUNICATION_SERVICES_LIST}
  - {number: 13, code: 0DH, name: INTERRUPT_TABLE_CONTENT_OUTPUT}
  - {number: 14, code: 0EH, name: TEST_DATA_CHANNELS}
  - {number: 15, code: 0FH, name: CHANGE_CONTROL_OBJECT_PARAMETERS}
  - {number: 16, code: 10H, name: REQUEST_TRUNK_NAME_TO_CONDITIONAL_NUMBER_MAPPING}
  - {number: 17, code: 11H, name: REQUEST_NODE_SOFTWARE_VERSION}

sequence_rules:
  ordinary_serial_commands:
    excluded_priority_commands: [2, 7, 8, 13, 14]
    next_command_gate: MESSAGE7_REJECTED_OR_MESSAGE8_ANY_RESULT_FOR_PREVIOUS_COMMAND
  priority_commands:
    numbers: [2, 7, 8, 13, 14]
    accepted_any_time: true
  before_start: {accepted: false, response: MESSAGE7_COMMAND_REJECTED}
  malformed_format_or_parameters: {accepted: false, response: MESSAGE7_COMMAND_REJECTED}
  wrong_password_or_technical_means_number:
    accepted_for_execution: true
    executed: false
    responses: [MESSAGE7_ACCEPTED, MESSAGE8_NON_EXECUTION_REASON, MESSAGE6_UNAUTHORIZED_ACCESS]
  inactivity:
    threshold_minutes: 10
    qualifying_input: ANY_COMMAND_EXCEPT_COMMAND1_WITH_VALID_PASSWORD_AND_TECHNICAL_MEANS_NUMBER_ON_ANY_KPD1
    effects: [STOP_ALL_KPD1_AND_KPD2_DATA, DESTROY_UNSENT_KPD1_AND_KPD2_DATA]
    controlled_connection_content_blocked: false
  resume:
    alternatives:
      - COMMAND1_WITH_ANY_TECHNICAL_MEANS_NUMBER_AND_VALID_PASSWORD
      - ANY_OTHER_COMMAND_WITH_NUMBER_SET_BY_COMMAND1_AND_VALID_PASSWORD

kpd1_header:
  bytes: 10
  fields:
    - {byte: 1, field: PREAMBLE, exact: CCH}
    - {byte: 2, field: TECHNICAL_MEANS_ORM_NUMBER}
    - {byte: 3, field: MESSAGE_CODE}
    - {byte: 4, field: CONTENT_LENGTH_BYTES, range: "1-245"}
    - {bytes: "5-6", field: TOTAL_MESSAGES, range: "1-65535"}
    - {bytes: "7-8", field: CURRENT_MESSAGE_NUMBER, range: "1-65535"}
    - {byte: 9, field: REGISTER_TYPE_OR_MESSAGE12_COUNTER}
    - {byte: 10, field: TECHNICAL_REQUIREMENTS_VERSION, exact: 02H}
  content_max_bytes: 245
  message12_counter: {range: 00H-FFH, after_ff: 00H}

kpd1_message_codes:
  - {number: 1, code: 21H, name: ALARM}
  - {number: 2, code: 22H, name: NODE_SOFTWARE_RESTART}
  - {number: 3, code: 23H, name: CONTROL_OBJECT_DATA}
  - {number: 4, code: 24H, name: KSL_GROUP_MAPPING}
  - {number: 5, code: 25H, name: COMMUNICATION_SERVICES_LIST}
  - {number: 6, code: 26H, name: UNAUTHORIZED_SOFTWARE_ACCESS}
  - {number: 7, code: 27H, name: COMMAND_RECEIPT_CONFIRMATION}
  - {number: 8, code: 28H, name: COMMAND_EXECUTION_CONFIRMATION}
  - {number: 9, code: 29H, name: TEST_RESPONSE}
  - {number: 10, code: 2AH, name: TRUNK_NAME_TO_CONDITIONAL_NUMBER_MAPPING}
  - {number: 11, code: 2BH, name: NODE_SOFTWARE_VERSION}
  - {number: 12, code: 2CH, name: TELECOMMUNICATION_MESSAGE_TRANSFER}

kpd1_exact_controls:
  message7_max_latency_ms: 400
  message8_status_codes:
    00H: COMMAND_EXECUTED
    01H: COMMAND_NOT_EXECUTED
    03H: WRONG_PASSWORD
    05H: WRONG_TECHNICAL_MEANS_NUMBER
    07H: NOT_EXECUTED_TECHNICAL_MEANS_ALREADY_STARTED
  message9_max_latency_ms: 200
  message9_trigger: COMMAND14

kpd2_header:
  bytes: 12
  fields:
    - {byte: 1, field: PREAMBLE, exact: CCH}
    - {byte: 2, field: TECHNICAL_MEANS_ORM_NUMBER}
    - {byte: 3, field: MESSAGE_CODE}
    - {byte: 4, field: CONTENT_LENGTH_BYTES}
    - {bytes: "5-6", field: CALL_NUMBER, rollover: FFFEH_TO_0000H}
    - {byte: 7, field: CONTROL_OBJECT_TYPE}
    - {bytes: "8-9", field: CONDITIONAL_CONTROL_OBJECT_NUMBER}
    - {byte: 10, field: CONTROL_OBJECT_SELECTION_FLAG}
    - {byte: 11, field: CONNECTION_PARAMETERS}
    - {byte: 12, field: SERVICE_PHASE_CODE}

kpd2_message_codes:
  - {number: "1.1", code: 41H, name: RECEIVE_FULL_CALLED_PARTY_NUMBER}
  - {number: "1.2", code: 42H, name: CALLED_PARTY_ANSWER}
  - {number: "1.3", code: 43H, name: DISCONNECTION}
  - {number: "1.4", code: 44H, name: COMMUNICATION_SERVICE_USE}
  - {number: "2.1", code: 51H, name: CONNECT_CONTROL_CONNECTION_LINE}
  - {number: "2.2", code: 52H, name: RELEASE_CONTROL_CONNECTION_LINE}
  - {number: "2.3", code: 53H, name: TEST_RESPONSE}

