scope: >-
  Общие заголовки команд, сообщений КПД1 и сообщений КПД2, реестры кодов
  семнадцати команд, двенадцати сообщений КПД1 и семи сообщений КПД2,
  а также правила последовательности приложения № 7. Детальные поля каждой
  команды и сообщения и таблицы сочетаний бит остаются отдельной границей до
  проверки неизменяемого официального PDF по страницам.

