id: RU-MINKOMSVYAZ-73-2010-DATA-NETWORK-SORM-ATOMIC-V1
title: "Приказ Минкомсвязи России от 27.05.2010 № 73: требования к сетям передачи данных, текущая редакция"
checked_at: "2026-08-27"
status: VERIFIED_CURRENT_CONSOLIDATED_TEXT
scope: >-
  Открытая нормативная модель пунктов 1–3, приложения № 1 и структуры
  приложения № 2. Применяется только к сетям, предназначенным для оказания
  телематических услуг связи и услуг передачи данных, кроме передачи данных
  для целей голосовой информации. Модель не раскрывает закрытые приемы ОРМ,
  не заменяет общую часть приказа № 6 и не распространяется на иные виды сетей.

