    is_bd_orm_connects_as_additional_control_point: true
    control_points_max: 100
    territory_and_control_point_isolation_required: true
  continuous_remote_access_from: [CONTROL_POINT, IS_BD_ORM]
  point5_7_current_status: REPEALED_FROM_2023_09_01
  connection_metadata:
    fields: [START_DATE, START_TIME, DURATION]
    precision_seconds: true
    failed_connection_duration_seconds: 0
    clock: UTC_SYNCHRONIZED
  content_access_max_seconds_after_connection_end: 10
  simultaneous_processing_required: true
  self_monitoring_and_state_reporting_required: true
  control_interface:
    redundant_physical_ethernet_per_control_point: 1
    network_and_transport_channels_separate: true
  query_content_types: [STATISTICS, TEXT, VOICE_AND_VIDEO]
  statistics_always_unloaded_except_exact_connection_id_query: true
  multiple_filters_allowed: true
  filter_logic: LOGICAL_AND
  wildcards: {star: ANY_SEQUENCE_INCLUDING_EMPTY, question_mark: EXACTLY_ONE_CHARACTER}
  encodings:
    voice: [A_LAW_STEREO, ORIGINAL_WITH_CODING_METHOD]
    hd_voice: [PCM_16_BIT_STEREO_16_KHZ, ORIGINAL_WITH_CODING_METHOD]
    video: [H223_H245_G723_1_OR_AMR_H264, ORIGINAL_WITH_CODING_METHOD]
  telephone_number_format: E164
  locked_enclosures_required: true
  working_interfaces_only: [PASSIVE_NETWORK_INTERFACES, CONTROL_POINT_INTERFACES]
  l2tp_ipsec_vpn: RECOMMENDED_NOT_ABSOLUTE_MANDATE
  retention_clock_starts_at: CONNECTION_END_OR_MESSAGE_TRANSFER_END
  retention_duration: EXTERNAL_PP445_NOT_DEFINED_HERE
  query_transfer_total_rate_max_percent_of_control_channel: 70

