title: "Приказ Минкомсвязи № 86: ТС накопления голосовой информации, текущая редакция"
checked_at: "2026-08-28"
status: VERIFIED_CURRENT_OPEN_CORE_ORDER47_AND_ORDER1196_DELTAS_APPLIED_DEEP_PROTOCOL_TABLES_PENDING
scope: >-
  Действующее публичное ядро требований к оборудованию систем коммутации,
  программному обеспечению и техническим средствам накопления голосовой
  информации. Дельты приказов № 47 и № 1196 применены по датам; удаленные
  пункт 5.7 и подпункт 2.9 не выдаются за текущие требования. Глубокие поля,
  коды, диаграммы и битовые таблицы приложения № 3 остаются отдельной
  fail-closed границей до проверки неизменяемых страниц.

