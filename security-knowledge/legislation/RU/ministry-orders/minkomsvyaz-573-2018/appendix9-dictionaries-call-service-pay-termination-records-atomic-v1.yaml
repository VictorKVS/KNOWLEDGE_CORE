  Ограниченный глубокий срез Dictionaries.asn действующей замены приложения
  № 9: четыре оболочки отчетов и CallsTypesRecord,
  SupplementServicesRecord, PayTypesRecord, TerminationCausesRecord с точными
  полями, обязательностью, диапазонами и размерами. Дефект закрывающего
  разделителя OID причины завершения оставлен fail-closed до первичного PDF.

