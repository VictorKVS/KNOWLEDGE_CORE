  - {name: supplementServicesRecords, oid: sorm-report-dictionary-supplement-services, item_type: SupplementServicesRecord, count_constraint: NOT_SPECIFIED}
  - {name: payTypesRecords, oid: sorm-report-dictionary-pay-types, item_type: PayTypesRecord, count_constraint: NOT_SPECIFIED}
  - name: terminationCausesRecords
    oid: sorm-report-dictionary-termination-causes
    item_type: TerminationCausesRecord
    count_constraint: NOT_SPECIFIED
    rendered_oid: "OID { sorm-report-dictionary-termination-causes)"
    oid_delimiter_status: PENDING_PRIMARY_PDF_CLOSING_DELIMITER

records:
  CallsTypesRecord:
    literal_name_status: PRESERVE_SOURCE_PLURAL_CALLS
    kind: SEQUENCE
    fields:
      - {name: telco-id, type: TelcoID, optional: false}
      - {name: call-type-id, type: INTEGER, minimum: 0, maximum: 4294967295, optional: false}
      - {name: begin-time, type: DateAndTime, optional: false}
      - {name: end-time, type: DateAndTime, optional: true}
      - {name: description, type: UTF8String, size_min: 1, size_max: 256, optional: false}
  SupplementServicesRecord:
    kind: SEQUENCE
    fields:
      - {name: telco-id, type: TelcoID, optional: false}
      - {name: service-id, type: INTEGER, minimum: 0, maximum: 4294967295, optional: false}
      - {name: mnemonic, type: UTF8String, size_min: 1, size_max: 64, optional: true}
      - {name: begin-time, type: DateAndTime, optional: false}
      - {name: end-time, type: DateAndTime, optional: true}
      - {name: description, type: UTF8String, size_min: 1, size_max: 256, optional: false}
  PayTypesRecord:
    kind: SEQUENCE
    fields:
      - {name: telco-id, type: TelcoID, optional: false}
      - {name: pay-type-id, type: INTEGER, minimum: 0, maximum: 4294967295, optional: false}
      - {name: begin-time, type: DateAndTime, optional: false}
      - {name: end-time, type: DateAndTime, optional: true}
      - {name: description, type: UTF8String, size_min: 1, size_max: 256, optional: false}
  TerminationCausesRecord:
    kind: SEQUENCE
    fields:
      - {name: telco-id, type: TelcoID, optional: false}
      - {name: termination-cause-id, type: INTEGER, minimum: 0, maximum: 16384, optional: false}
      - {name: begin-time, type: DateAndTime, optional: false}
      - {name: end-time, type: DateAndTime, optional: true}
      - {name: description, type: UTF8String, size_min: 1, size_max: 256, optional: false}
      - {name: network-type, type: NetworkType, optional: false}

