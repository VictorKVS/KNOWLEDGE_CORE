  validity_until_exclusive: "2030-03-01"
  status: CURRENT_AS_OF_2026_08_28

report_wrappers:
  - {name: docTypesRecords, oid: sorm-report-dictionary-doc-types, item_type: DocTypesRecord, count_constraint: NOT_SPECIFIED}
  - {name: ipDataPointsRecords, oid: sorm-report-dictionary-ip-data-points, item_type: IpDataPointRecord, count_constraint: NOT_SPECIFIED}
  - {name: specialNumbersRecords, oid: sorm-report-dictionary-special-numbers, item_type: SpecialNumberRecord, count_constraint: NOT_SPECIFIED}

records:
  DocTypesRecord:
    kind: SEQUENCE
    fields:
      - {name: telco-id, type: TelcoID, optional: false}
      - {name: doc-type-id, type: INTEGER, minimum: 0, maximum: 65535, optional: false}
      - {name: begin-time, type: DateAndTime, optional: false}
      - {name: end-time, type: DateAndTime, optional: true}
      - {name: description, type: UTF8String, size_min: 1, size_max: 256, optional: false}
  IpDataPointRecord:
    kind: SEQUENCE
    fields:
      - {name: telco-id, type: TelcoID, optional: false}
      - {name: point-id, type: INTEGER, minimum: 0, maximum: 1000, optional: false}
      - {name: description, type: UTF8String, size_min: 1, size_max: 256, optional: false}
      - {name: begin-time, type: DateAndTime, optional: false}
      - {name: end-time, type: DateAndTime, optional: true}
  SpecialNumberRecord:
    kind: SEQUENCE
    fields:
      - {name: telco-id, type: TelcoID, optional: false}
      - {name: directory-number, type: UTF8String, size_min: 1, size_max: 32, optional: false}
      - {name: description, type: UTF8String, size_min: 1, size_max: 256, optional: false}
      - {name: begin-time, type: DateAndTime, optional: false}
      - {name: end-time, type: DateAndTime, optional: true}
      - {name: network-address, type: IPAddress, optional: true}

dependencies:
  TelcoID: appendix9-dictionaries-core-asn-atomic-v1.yaml
  DateAndTime: Sorm.asn_PENDING_SEPARATE_MODEL
  IPAddress: NetworkIdentifiers.asn_PENDING_SEPARATE_MODEL

