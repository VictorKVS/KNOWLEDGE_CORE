  Ограниченный глубокий срез Dictionaries.asn действующей замены приложения
  № 9: три оболочки отчетов и DocTypesRecord, IpDataPointRecord,
  SpecialNumberRecord с точными полями, обязательностью, диапазонами, типами
  и размерами. Неприведенные бизнес-правила и ограничения не выводятся.

sources:
  act: "Приказ Минкомсвязи России от 29.10.2018 № 573"
  current_revision_date: "2025-12-18"
