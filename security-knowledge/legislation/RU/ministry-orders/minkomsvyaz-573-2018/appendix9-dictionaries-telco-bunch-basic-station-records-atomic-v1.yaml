  - {id: MK573DBS-R001, rule: APPLY_ORDER630_RECORDS_ONLY_FROM_2024_03_01}
  - {id: MK573DBS-R002, rule: STOP_CURRENT_ROUTE_AT_2030_03_01}
  - {id: MK573DBS-R003, rule: PRESERVE_THREE_REPORT_WRAPPER_OID_TYPE_MAPPINGS}
  - {id: MK573DBS-R004, rule: DO_NOT_INVENT_REPORT_WRAPPER_COUNT_LIMITS}
  - {id: MK573DBS-R005, rule: PRESERVE_SIX_TELCOS_RECORD_FIELDS}
  - {id: MK573DBS-R006, rule: REQUIRE_FOUR_TELCOS_RECORD_FIELDS}
  - {id: MK573DBS-R007, rule: KEEP_TELCOS_END_TIME_OPTIONAL}
  - {id: MK573DBS-R008, rule: APPLY_TELCOS_MCC_MNC_TAGS_AND_EXACT_LENGTH_3}
  - {id: MK573DBS-R009, rule: APPLY_TELCOS_DESCRIPTION_SIZE_1_TO_256}
  - {id: MK573DBS-R010, rule: PRESERVE_SEVEN_BUNCH_RECORD_FIELDS}
  - {id: MK573DBS-R011, rule: REQUIRE_SIX_BUNCH_RECORD_FIELDS}
  - {id: MK573DBS-R012, rule: PRESERVE_BUNCH_TYPE_VALUES_0_1_3}
  - {id: MK573DBS-R013, rule: BLOCK_INFERRED_BUNCH_TYPE_VALUE_2}
  - {id: MK573DBS-R014, rule: KEEP_BUNCH_END_TIME_OPTIONAL}
  - {id: MK573DBS-R015, rule: APPLY_BUNCH_SWITCH_AND_DESCRIPTION_SIZES}
  - {id: MK573DBS-R016, rule: PRESERVE_NINE_BASIC_STATION_RECORD_FIELDS}
  - {id: MK573DBS-R017, rule: REQUIRE_SEVEN_BASIC_STATION_RECORD_FIELDS_INCLUDING_END_TIME}
  - {id: MK573DBS-R018, rule: APPLY_BASIC_STATION_ADDRESS_SIZE_1_TO_256}
  - {id: MK573DBS-R019, rule: PRESERVE_STRUCTURED_ADDRESS_AND_LOCATION_TAGS_0_1}
  - {id: MK573DBS-R020, rule: PRESERVE_TWO_BASIC_STATION_IDENTIFIER_CHOICES}
  - {id: MK573DBS-R021, rule: PRESERVE_THREE_TELEPHONE_IDENTIFIER_FIELDS}
  - {id: MK573DBS-R022, rule: APPLY_LAC_RANGE_0_TO_65535}
  - {id: MK573DBS-R023, rule: APPLY_TELEPHONE_CELL_RANGE_0_TO_100000000000}
  - {id: MK573DBS-R024, rule: APPLY_CELL_SIGN_SIZE_1_TO_18}
  - {id: MK573DBS-R025, rule: PRESERVE_THREE_WIRELESS_IDENTIFIER_FIELDS}
  - {id: MK573DBS-R026, rule: REQUIRE_WIRELESS_CELL_AND_KEEP_IP_LIST_MAC_OPTIONAL}
  - {id: MK573DBS-R027, rule: APPLY_WIRELESS_CELL_SIZE_1_TO_64_AND_MAC_SIZE_6}
  - {id: MK573DBS-R028, rule: DO_NOT_INVENT_IP_LIST_COUNT_LIMIT}
  - {id: MK573DBS-R029, rule: PRESERVE_THREE_ANTENNA_CHOICES_AND_TAGS_0_TO_2}
  - {id: MK573DBS-R030, rule: DO_NOT_INVENT_CDMA_OR_WIRELESS_ANTENNA_COUNT_LIMITS}
  - {id: MK573DBS-R031, rule: REQUIRE_THREE_GSM_ANTENNA_GEOMETRY_FIELDS}
  - {id: MK573DBS-R032, rule: PRESERVE_FOURTEEN_GSM_OPTIONAL_FIELDS_TAGS_0_TO_13}
  - {id: MK573DBS-R033, rule: APPLY_ALL_GSM_NUMERIC_BOUNDARIES}
  - {id: MK573DBS-R034, rule: APPLY_ALL_GSM_STRING_SIZE_BOUNDARIES}
  - {id: MK573DBS-R035, rule: PRESERVE_BS_CELL_TYPE_VALUES_0_TO_3}
  - {id: MK573DBS-R036, rule: PRESERVE_BS_GENERATION_VALUES_0_TO_3}
  - {id: MK573DBS-R037, rule: PRESERVE_BS_SETTING_RENDERED_VALUES_0_TO_2}
  - {id: MK573DBS-R038, rule: KEEP_BS_SETTING_DECLARATION_SYNTAX_PENDING_PRIMARY_PDF}
  - {id: MK573DBS-R039, rule: MAP_CDMA_AND_WIRELESS_ANTENNAS_TO_BROADBAND_PARAMETERS}
  - {id: MK573DBS-R040, rule: REQUIRE_THREE_BROADBAND_GEOMETRY_FIELDS}
  - {id: MK573DBS-R041, rule: PRESERVE_SEVEN_BROADBAND_OPTIONAL_FIELDS_TAGS_0_TO_6}
  - {id: MK573DBS-R042, rule: APPLY_ALL_BROADBAND_NUMERIC_BOUNDARIES}
  - {id: MK573DBS-R043, rule: PRESERVE_BASIC_STATION_TYPE_VALUES_0_TO_4}
  - {id: MK573DBS-R044, rule: KEEP_RENDERED_JOINED_TOKENS_PENDING_PRIMARY_PDF}
  - {id: MK573DBS-R045, rule: KEEP_AZIMUTH_SPECIAL_VALUE_COMMENT_PENDING_PRIMARY_PDF}
