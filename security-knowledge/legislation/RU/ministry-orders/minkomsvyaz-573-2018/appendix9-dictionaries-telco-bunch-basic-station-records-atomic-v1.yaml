schema_version: "1.0"
id: RU-MINKOMSVYAZ-573-2018-APPENDIX9-DICTIONARIES-TELCO-BUNCH-BASIC-STATION-RECORDS-ATOMIC-V1
title: "Приказ Минкомсвязи № 573: TelcosRecord, BunchRecord и BasicStationSectorRecord"
checked_at: "2026-08-28"
status: VERIFIED_CURRENT_CONSOLIDATED_PUBLIC_TEXT_DEEP_RECORD_FIELDS_WITH_RENDERED_SYNTAX_ANOMALIES_FAIL_CLOSED
scope: >-
  Ограниченный глубокий срез Dictionaries.asn действующей замены приложения
  № 9: три оболочки отчетов, TelcosRecord, BunchRecord,
  BasicStationSectorRecord, идентификаторы сектора, антенная конфигурация и
  связанные перечисления. Компилируемость искаженных HTML-токенов и
  бизнес-смысл неоговоренных значений не заявлены.

sources:
  act: "Приказ Минкомсвязи России от 29.10.2018 № 573"
  current_revision_date: "2025-12-18"
  current_consolidated_open_text: "https://legalacts.ru/doc/prikaz-minkomsvjazi-rossii-ot-29102018-n-573-ob-utverzhdenii/"
  order630_official_publication: "https://publication.pravo.gov.ru/document/0001202309050014"
  order630_exact_delta: "https://www.garant.ru/products/ipo/prime/doc/407511660/"

temporal_model:
  replaced_by: "Приказ Минцифры России от 12.07.2023 № 630, пункт 21 изменений"
  effective_from: "2024-03-01"
  validity_until_exclusive: "2030-03-01"
  status: CURRENT_AS_OF_2026_08_28

report_wrappers:
  - {name: telcosRecords, oid: sorm-report-dictionary-telcos, item_type: TelcosRecord, count_constraint: NOT_SPECIFIED}
  - {name: bunchesRecords, oid: sorm-report-dictionary-bunches, item_type: BunchRecord, count_constraint: NOT_SPECIFIED}
  - {name: basicStationsSectorRecords, oid: sorm-report-dictionary-basic-stations, item_type: BasicStationSectorRecord, count_constraint: NOT_SPECIFIED}

records:
  TelcosRecord:
    kind: SEQUENCE
    fields:
      - {name: telco-id, type: TelcoID, optional: false}
      - {name: begin-time, type: DateAndTime, optional: false}
      - {name: end-time, type: DateAndTime, optional: true}
      - {name: description, type: UTF8String, size_min: 1, size_max: 256, optional: false}
      - {name: mcc, tag: 0, type: NumericString, size_exact: 3, optional: true}
      - {name: mnc, tag: 1, type: NumericString, size_exact: 3, optional: true}
  BunchRecord:
    kind: SEQUENCE
    fields:
      - {name: telco-id, type: TelcoID, optional: false}
      - {name: bunch-id, type: Bunch, optional: false}
      - {name: switch-id, type: UTF8String, size_min: 1, size_max: 128, optional: false}
      - {name: bunch-type, type: ENUMERATED, optional: false}
      - {name: begin-time, type: DateAndTime, optional: false}
      - {name: end-time, type: DateAndTime, optional: true}
      - {name: description, type: UTF8String, size_min: 1, size_max: 256, optional: false}
    bunch_type:
      values:
        - {name: inbound, value: 0}
        - {name: outbound, value: 1}
        - {name: bidirectional, value: 3}
      value_2_status: UNASSIGNED_IN_PUBLISHED_ENUM_DO_NOT_INVENT
  BasicStationSectorRecord:
    kind: SEQUENCE
    fields:
      - {name: telco-id, type: TelcoID, optional: false}
      - {name: begin-time, type: DateAndTime, optional: false}
      - {name: end-time, type: DateAndTime, optional: false}
      - {name: address, type: UTF8String, size_min: 1, size_max: 256, optional: false}
      - {name: sector-identifiers, type: BasicStationIdentifiers, optional: false}
      - {name: antenna-configuration, type: BasicStationAntenna, optional: false}
      - {name: station-type, type: BasicStationType, optional: false}
      - {name: structured-address, tag: 0, type: ReportedAddress, optional: true}
      - {name: location, tag: 1, type: GeoLocation, optional: true, rendered_token: GeoLocationOPTIONAL}

basic_station_identifiers:
  kind: CHOICE
  alternatives:
    - {name: telephone, tag: 0, type: TelephoneIdentifiers}
    - {name: wireless, tag: 1, type: "SEQUENCE OF WirelessIdentifiers", count_constraint: NOT_SPECIFIED, rendered_token: SEQUENCEOFWirelessIdentifiers}

telephone_identifiers:
  kind: SEQUENCE
  fields:
    - {name: lac, type: INTEGER, minimum: 0, maximum: 65535, optional: false}
    - {name: cell, type: INTEGER, minimum: 0, maximum: 100000000000, optional: false}
    - {name: cell-sign, type: UTF8String, size_min: 1, size_max: 18, optional: true}

wireless_identifiers:
  kind: SEQUENCE
  fields:
    - {name: cell, type: UTF8String, size_min: 1, size_max: 64, optional: false}
    - {name: ip-list, type: IPList, optional: true, rendered_token: IPListOPTIONAL}
    - {name: mac, type: OCTET_STRING, size_exact: 6, optional: true, rendered_token: OCTETSTRING}

ip_list:
  kind: SEQUENCE_OF
  item_type: NetworkPeerInfo
  count_constraint: NOT_SPECIFIED

basic_station_antenna:
  kind: CHOICE
  alternatives:
    - {name: gsm-antenna, tag: 0, type: GsmAntenna}
    - {name: cdma-antenna, tag: 1, type: "SEQUENCE OF CdmaAntenna", count_constraint: NOT_SPECIFIED}
    - {name: wireless-antenna, tag: 2, type: "SEQUENCE OF WirelessAntenna", count_constraint: NOT_SPECIFIED}

gsm_antenna:
  kind: SEQUENCE
  required_fields:
    - {name: azimuth, type: INTEGER, minimum: -1, maximum: 359, rendered_token: azimuthINTEGER}
    - {name: width, type: INTEGER, minimum: 0, maximum: 359, rendered_token: widthINTEGER}
    - {name: horizon-angle, type: INTEGER, minimum: 0, maximum: 359, rendered_token: horizon-angleINTEGER}
  optional_fields:
    - {name: power, tag: 0, type: INTEGER, minimum: 0, maximum: 25000}
    - {name: frequency, tag: 1, type: INTEGER, minimum: 0, maximum: 100000000000}
    - {name: vertical-lift, tag: 2, type: INTEGER, minimum: 0, maximum: 100}
    - {name: gain-factor, tag: 3, type: INTEGER, minimum: -100, maximum: 100}
    - {name: polarization, tag: 4, type: INTEGER, minimum: -45, maximum: 45}
    - {name: setting, tag: 5, type: BsSetting}
    - {name: thickness, tag: 6, type: INTEGER, minimum: 0, maximum: 359}
    - {name: generation, tag: 7, type: BsGeneration}
    - {name: controller-num, tag: 8, type: UTF8String, size_min: 1, size_max: 128}
    - {name: bcc-ncc, tag: 9, type: UTF8String, size_min: 1, size_max: 128}
    - {name: cell-type, tag: 10, type: BsCellType, rendered_token: BsCellTypeOPTIONAL}
    - {name: radiation-class, tag: 11, type: UTF8String, size_min: 1, size_max: 32}
    - {name: name, tag: 12, type: UTF8String, size_min: 1, size_max: 32}
    - {name: channel, tag: 13, type: UTF8String, size_min: 1, size_max: 32}
  azimuth_special_value_comment:
    range_contains: -1
    rendered_comment_mentions: 1
    status: PENDING_PRIMARY_PDF_DO_NOT_NORMALIZE_OR_ASSIGN_SEMANTICS

enumerations:
  BsCellType:
    - {name: macro, value: 0}
    - {name: micro, value: 1}
    - {name: pico, value: 2}
    - {name: femto, value: 3}
  BsGeneration:
    - {name: g2, value: 0}
    - {name: g3, value: 1}
    - {name: g4, value: 2}
    - {name: g5, value: 3}
  BsSetting:
    rendered_declaration: "BsSetting ENUMERATED {"
    declaration_status: PENDING_PRIMARY_PDF_MISSING_ASSIGNMENT_TOKEN
    values:
      - {name: indoor, value: 0}
      - {name: outdoor, value: 1}
      - {name: underground, value: 2}
  BasicStationType:
    - {name: gsm, value: 0}
    - {name: cdma, value: 1}
    - {name: umts, value: 2}
    - {name: wifi, value: 3}
    - {name: wimax, value: 4}

antenna_aliases:
  CdmaAntenna: BroadbandWirelessParameters
  WirelessAntenna: BroadbandWirelessParameters

broadband_wireless_parameters:
  kind: SEQUENCE
  required_fields:
    - {name: azimuth, type: INTEGER, minimum: -1, maximum: 359}
    - {name: width, type: INTEGER, minimum: 0, maximum: 359}
    - {name: horizon-angle, type: INTEGER, minimum: 0, maximum: 359}
  optional_fields:
    - {name: power, tag: 0, type: INTEGER, minimum: 0, maximum: 25000}
    - {name: frequency-start, tag: 1, type: INTEGER, minimum: 0, maximum: 10000000000}
    - {name: frequency-stop, tag: 2, type: INTEGER, minimum: 0, maximum: 10000000000}
    - {name: leaf-level, tag: 3, type: INTEGER, minimum: -45, maximum: 45}
    - {name: vertical-lift, tag: 4, type: INTEGER, minimum: 0, maximum: 100}
    - {name: gain-factor, tag: 5, type: INTEGER, minimum: -100, maximum: 100}
    - {name: polarization, tag: 6, type: INTEGER, minimum: -45, maximum: 45}

semantic_guards:
  - BASIC_STATION_END_TIME_IS_REQUIRED_WHILE_TELCO_AND_BUNCH_END_TIME_ARE_OPTIONAL
  - BUNCH_TYPE_VALUE_2_IS_NOT_ASSIGNED_AND_MUST_NOT_BE_INFERRED
  - IDENTIFIER_AND_ANTENNA_CHOICES_REQUIRE_EXACTLY_ONE_ALTERNATIVE
  - SEQUENCE_OF_WRAPPERS_AND_ANTENNA_LISTS_HAVE_NO_PUBLISHED_COUNT_CONSTRAINT
  - IP_LIST_HAS_NO_PUBLISHED_COUNT_CONSTRAINT
  - RENDERED_JOINED_TOKENS_ARE_NOT_SILENTLY_NORMALIZED_AS_PRIMARY_BYTES
  - BS_SETTING_MISSING_ASSIGNMENT_TOKEN_REMAINS_PENDING_PRIMARY_PDF
  - GSM_AZIMUTH_RANGE_AND_RENDERED_SPECIAL_VALUE_COMMENT_DISAGREEMENT_REMAINS_PENDING
  - NO_ASN1_COMPILABILITY_CLAIM_FROM_CONSOLIDATED_HTML

