  - {id: E573DBS-09, proves: [MK573DBS-R029, MK573DBS-R030], artifacts: [ANTENNA_CHOICE_TESTS]}
  - {id: E573DBS-10, proves: [MK573DBS-R031, MK573DBS-R032, MK573DBS-R033, MK573DBS-R034], artifacts: [GSM_ANTENNA_FIELD_BOUNDARY_TESTS]}
  - {id: E573DBS-11, proves: [MK573DBS-R035, MK573DBS-R036, MK573DBS-R037, MK573DBS-R038], artifacts: [BS_ENUM_AND_SYNTAX_TESTS]}
  - {id: E573DBS-12, proves: [MK573DBS-R039, MK573DBS-R040, MK573DBS-R041, MK573DBS-R042], artifacts: [BROADBAND_ANTENNA_TESTS]}
