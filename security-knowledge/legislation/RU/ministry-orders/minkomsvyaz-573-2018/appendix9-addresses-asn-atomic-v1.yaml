verification_boundary:
  verified:
    - CURRENT_ADDRESSES_ASN_COMPLETE_MODULE_IN_CONSOLIDATED_PUBLIC_TEXT
    - FOUR_EXPORTS_AND_NO_IMPORTS
    - FIVE_ADDRESS_TYPE_ENUM_VALUES
    - REPORTED_ADDRESS_REQUIRED_FIELDS_AND_CHOICE_TAGS
    - ALL_EIGHTEEN_STRUCTURED_FIELD_DEFINITIONS_TAGS_OPTIONALITY_AND_SIZES
  pending:
    - CURRENT_CONSOLIDATED_OFFICIAL_IMMUTABLE_BYTES
    - CROSS_MODULE_USAGE_SEMANTICS
