  - {id: E573A-01, proves: [MK573A-R001, MK573A-R033], artifacts: [ORDER630_POINT21_DELTA]}
  - {id: E573A-02, proves: [MK573A-R002, MK573A-R003, MK573A-R004], artifacts: [MODULE_HEADER_EXPORTS_AND_NO_IMPORTS]}
  - {id: E573A-03, proves: [MK573A-R005, MK573A-R006, MK573A-R007, MK573A-R008, MK573A-R009], artifacts: [ADDRESS_TYPE_ENUM_TESTS]}
