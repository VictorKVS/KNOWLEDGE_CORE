schema_version: "1.0"
id: RU-MINKOMSVYAZ-573-2018-APPENDIX9-ADDRESSES-ASN-ATOMIC-V1
title: "Приказ Минкомсвязи № 573: Addresses.asn приложения № 9"
checked_at: "2026-08-28"
status: VERIFIED_CURRENT_CONSOLIDATED_PUBLIC_TEXT_ADDRESSES_ASN_EXACT_FIELDS_TAGS_OPTIONALITY_AND_SIZE_CONSTRAINTS
scope: >-
  Полный ограниченный модуль Addresses.asn из действующей замены приложения
  № 9 приказом № 630: четыре экспортируемых типа, пять значений AddressType,
  обе ветви AddressInfoReport и два девятиполевых структурированных адреса.
  ASN.1-допустимость пустой SEQUENCE не превращена в бизнес-правило.

sources:
  act: "Приказ Минкомсвязи России от 29.10.2018 № 573"
  current_revision_date: "2025-12-18"
  current_consolidated_open_text: "https://legalacts.ru/doc/prikaz-minkomsvjazi-rossii-ot-29102018-n-573-ob-utverzhdenii/"
  order630_official_publication: "https://publication.pravo.gov.ru/document/0001202309050014"
  order630_exact_delta: "https://www.garant.ru/products/ipo/prime/doc/407511660/"

temporal_model:
  replaced_by: "Приказ Минцифры России от 12.07.2023 № 630, пункт 21 изменений"
  effective_from: "2024-03-01"
  validity_until_exclusive: "2030-03-01"
  status: CURRENT_AS_OF_2026_08_28

module:
  declaration: "Addresses DEFINITIONS IMPLICIT TAGS ::= BEGIN"
  name: Addresses
  tagging: IMPLICIT_TAGS
  imports: []
  exports: [AddressType, ReportedAddresses, ReportedAddress, RequestedAddress]
  internal_types: [AddressInfoReport, AddressStructInfoReport]

address_type:
  kind: ENUMERATED
  values:
    - {name: registered, value: 0}
    - {name: postal, value: 1}
    - {name: invoice, value: 2}
    - {name: device-location, value: 3}
    - {name: reserved, value: 4}

reported_addresses:
  kind: SEQUENCE_OF
  item_type: ReportedAddress
  size_constraint: NOT_SPECIFIED

reported_address:
  kind: SEQUENCE
  fields:
    - {name: title, type: AddressType, optional: false, tag: UNTAGGED}
    - {name: address-info, type: AddressInfoReport, optional: false, tag: UNTAGGED}

address_info_report:
  kind: CHOICE
  alternatives:
    - {name: struct-info, tag: 1, type: AddressStructInfoReport}
    - {name: unstruct-info, tag: 2, type: UTF8String, size_min: 1, size_max: 1024}

reported_struct_fields:
  - {name: zip, tag: 0, type: UTF8String, size_min: 1, size_max: 32, optional: true}
  - {name: country, tag: 1, type: UTF8String, size_min: 1, size_max: 128, optional: true}
  - {name: region, tag: 2, type: UTF8String, size_min: 1, size_max: 128, optional: true}
  - {name: zone, tag: 3, type: UTF8String, size_min: 1, size_max: 128, optional: true}
  - {name: city, tag: 4, type: UTF8String, size_min: 1, size_max: 128, optional: true}
  - {name: street, tag: 5, type: UTF8String, size_min: 1, size_max: 128, optional: true}
  - {name: building, tag: 6, type: UTF8String, size_min: 1, size_max: 128, optional: true}
  - {name: build-sect, tag: 7, type: UTF8String, size_min: 1, size_max: 128, optional: true}
  - {name: apartment, tag: 8, type: UTF8String, size_min: 1, size_max: 128, optional: true}

requested_address:
  kind: SEQUENCE
  fields:
    - {name: zip, tag: 0, type: UTF8String, size_min: 1, size_max: 32, optional: true}
    - {name: country, tag: 1, type: UTF8String, size_min: 1, size_max: 128, optional: true}
    - {name: region, tag: 2, type: UTF8String, size_min: 1, size_max: 128, optional: true}
    - {name: zone, tag: 3, type: UTF8String, size_min: 1, size_max: 128, optional: true}
    - {name: city, tag: 4, type: UTF8String, size_min: 1, size_max: 128, optional: true}
    - {name: street, tag: 5, type: UTF8String, size_min: 1, size_max: 128, optional: true}
    - {name: building, tag: 6, type: UTF8String, size_min: 1, size_max: 128, optional: true}
    - {name: build-sect, tag: 7, type: UTF8String, size_min: 1, size_max: 128, optional: true}
    - {name: apartment, tag: 8, type: UTF8String, size_min: 1, size_max: 128, optional: true}

semantic_guards:
  - EMPTY_REPORTED_STRUCT_IS_ASN1_ENCODABLE_BUT_BUSINESS_MEANING_NOT_SPECIFIED
  - EMPTY_REQUESTED_ADDRESS_IS_ASN1_ENCODABLE_BUT_QUERY_SEMANTICS_NOT_SPECIFIED
  - REPORTED_ADDRESS_REQUIRES_BOTH_TITLE_AND_ADDRESS_INFO
  - ADDRESS_INFO_REPORT_REQUIRES_EXACTLY_ONE_CHOICE_ALTERNATIVE
  - STRUCT_INFO_TAG_IS_1_NOT_0
  - UNSTRUCT_INFO_TAG_IS_2_NOT_1
  - REPORTED_ADDRESSES_HAS_NO_PUBLISHED_SIZE_CONSTRAINT
  - REQUESTED_ADDRESS_HAS_NO_TITLE_OR_UNSTRUCTURED_ALTERNATIVE
  - INTERNAL_TYPES_ARE_NOT_EXPORTED

atomic_rules:
  - {id: MK573A-R001, rule: APPLY_ORDER630_ADDRESSES_MODULE_ONLY_FROM_2024_03_01}
  - {id: MK573A-R002, rule: REQUIRE_ADDRESSES_MODULE_WITH_IMPLICIT_TAGS}
  - {id: MK573A-R003, rule: REQUIRE_EXACTLY_FOUR_EXPORTS}
  - {id: MK573A-R004, rule: REQUIRE_NO_IMPORTS}
  - {id: MK573A-R005, rule: PRESERVE_ADDRESS_TYPE_REGISTERED_0}
  - {id: MK573A-R006, rule: PRESERVE_ADDRESS_TYPE_POSTAL_1}
  - {id: MK573A-R007, rule: PRESERVE_ADDRESS_TYPE_INVOICE_2}
  - {id: MK573A-R008, rule: PRESERVE_ADDRESS_TYPE_DEVICE_LOCATION_3}
  - {id: MK573A-R009, rule: PRESERVE_ADDRESS_TYPE_RESERVED_4}
  - {id: MK573A-R010, rule: PRESERVE_REPORTED_ADDRESSES_AS_UNBOUNDED_SEQUENCE_OF}
  - {id: MK573A-R011, rule: REQUIRE_REPORTED_ADDRESS_TITLE}
  - {id: MK573A-R012, rule: REQUIRE_REPORTED_ADDRESS_ADDRESS_INFO}
  - {id: MK573A-R013, rule: REQUIRE_EXACTLY_ONE_ADDRESS_INFO_CHOICE}
  - {id: MK573A-R014, rule: PRESERVE_STRUCT_INFO_TAG_1}
  - {id: MK573A-R015, rule: PRESERVE_UNSTRUCT_INFO_TAG_2}
  - {id: MK573A-R016, rule: APPLY_UNSTRUCTURED_SIZE_1_TO_1024}
  - {id: MK573A-R017, rule: PRESERVE_NINE_REPORTED_STRUCT_FIELDS}
  - {id: MK573A-R018, rule: PRESERVE_REPORTED_STRUCT_TAGS_0_TO_8}
  - {id: MK573A-R019, rule: REQUIRE_ALL_REPORTED_STRUCT_FIELDS_OPTIONAL}
  - {id: MK573A-R020, rule: APPLY_REPORTED_ZIP_SIZE_1_TO_32}
  - {id: MK573A-R021, rule: APPLY_REPORTED_OTHER_FIELD_SIZES_1_TO_128}
  - {id: MK573A-R022, rule: PRESERVE_NINE_REQUESTED_FIELDS}
  - {id: MK573A-R023, rule: PRESERVE_REQUESTED_TAGS_0_TO_8}
  - {id: MK573A-R024, rule: REQUIRE_ALL_REQUESTED_FIELDS_OPTIONAL}
  - {id: MK573A-R025, rule: APPLY_REQUESTED_ZIP_SIZE_1_TO_32}
  - {id: MK573A-R026, rule: APPLY_REQUESTED_OTHER_FIELD_SIZES_1_TO_128}
  - {id: MK573A-R027, rule: DO_NOT_ADD_TITLE_TO_REQUESTED_ADDRESS}
  - {id: MK573A-R028, rule: DO_NOT_ADD_UNSTRUCTURED_CHOICE_TO_REQUESTED_ADDRESS}
  - {id: MK573A-R029, rule: KEEP_EMPTY_STRUCT_AS_ASN1_ONLY_WITHOUT_BUSINESS_INFERENCE}
  - {id: MK573A-R030, rule: DO_NOT_INVENT_SEQUENCE_OF_MINIMUM_OR_MAXIMUM}
  - {id: MK573A-R031, rule: KEEP_ADDRESS_INFO_REPORT_INTERNAL}
  - {id: MK573A-R032, rule: KEEP_ADDRESS_STRUCT_INFO_REPORT_INTERNAL}
  - {id: MK573A-R033, rule: REQUIRE_ORDER630_DELTA_FOR_REPLACEMENT_CLAIM}
  - {id: MK573A-R034, rule: KEEP_PRIMARY_IMMUTABLE_BYTES_PENDING}

