  - {id: E573A-06, proves: [MK573A-R013, MK573A-R014, MK573A-R015, MK573A-R016], artifacts: [ADDRESS_INFO_CHOICE_TESTS]}
  - {id: E573A-07, proves: [MK573A-R017, MK573A-R018, MK573A-R019], artifacts: [REPORTED_FIELD_MATRIX]}
  - {id: E573A-08, proves: [MK573A-R020, MK573A-R021], artifacts: [REPORTED_SIZE_BOUNDARY_TESTS]}
