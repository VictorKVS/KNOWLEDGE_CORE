schema_version: "1.0"
id: RU-MINKOMSVYAZ-573-2018-APPENDIX9-DICTIONARIES-IP-TELEPHONE-NUMBERING-RECORDS-ATOMIC-V1
title: "Приказ Минкомсвязи № 573: планы IP- и телефонной нумерации"
checked_at: "2026-08-28"
status: VERIFIED_CURRENT_CONSOLIDATED_PUBLIC_TEXT_IP_AND_TELEPHONE_NUMBERING_FIELDS_WITH_RENDERED_CONSTRAINT_ANOMALIES_PENDING_PRIMARY_PDF
scope: >-
  Ограниченный глубокий срез Dictionaries.asn действующей замены приложения
  № 9: две оболочки отчетов, IpNumberingPlanRecord и
  TelephoneNumberingPlanRecord с точными полями, обязательностью, тегами,
  диапазонами и размерами. Два дефекта отображения ограничений оставлены
  fail-closed до сверки первичного PDF.

sources:
  act: "Приказ Минкомсвязи России от 29.10.2018 № 573"
  current_revision_date: "2025-12-18"
  current_consolidated_open_text: "https://legalacts.ru/doc/prikaz-minkomsvjazi-rossii-ot-29102018-n-573-ob-utverzhdenii/"
  order630_official_publication: "https://publication.pravo.gov.ru/document/0001202309050014"
  order630_exact_delta: "https://www.garant.ru/products/ipo/prime/doc/407511660/"

temporal_model:
  replaced_by: "Приказ Минцифры России от 12.07.2023 № 630, пункт 21 изменений"
  effective_from: "2024-03-01"
  validity_until_exclusive: "2030-03-01"
  status: CURRENT_AS_OF_2026_08_28

report_wrappers:
  - {name: ipNumberingPlanRecords, oid: sorm-report-dictionary-ip-numbering-plan, item_type: IpNumberingPlanRecord, count_constraint: NOT_SPECIFIED}
  - {name: telephoneNumberingPlanRecords, oid: sorm-report-dictionary-phone-numbering-plan, item_type: TelephoneNumberingPlanRecord, count_constraint: NOT_SPECIFIED}

records:
  IpNumberingPlanRecord:
    kind: SEQUENCE
    fields:
      - {name: telco-id, type: TelcoID, optional: false}
      - {name: description, type: UTF8String, size_min: 1, size_max: 256, optional: false}
      - {name: network-address, type: IPAddress, optional: false}
      - {name: network-mask, type: IPMask, optional: false}
      - {name: begin-time, type: DateAndTime, optional: false}
      - {name: end-time, type: DateAndTime, optional: true}
  TelephoneNumberingPlanRecord:
    kind: SEQUENCE
    fields:
      - {name: telco-id, type: TelcoID, optional: false}
      - {name: iso-3166-alpha-2, type: UTF8String, size_exact: 2, optional: false}
      - {name: iso-3166-alpha-3, type: UTF8String, size_exact: 3, optional: false}
      - {name: country-code, type: UTF8String, size_exact: 3, optional: false}
      - {name: national-significant-number, type: UTF8String, size_exact: 14, optional: false}
      - {name: area-code-length, type: INTEGER, minimum: 0, maximum: 6, optional: false}
      - {name: min-subscr-nr-length, type: INTEGER, minimum: 1, maximum: 15, optional: false}
      - {name: max-subscr-nr-length, type: INTEGER, minimum: 1, maximum: 15, optional: false}
      - {name: utc-min, type: INTEGER, minimum: -12, maximum: 12, optional: false}
      - {name: utc-max, type: INTEGER, minimum: -12, maximum: 12, optional: false}
      - {name: destination, type: UTF8String, size_min: 2, size_max: 256, optional: false}
      - {name: operator-type-id, type: NetworkType, optional: false}
      - {name: capacity-from, type: NumericString, size_min: 1, size_max: 15, optional: false}
      - {name: capacity-to, type: NumericString, size_min: 1, size_max: 15, optional: false}
      - {name: capacity-size, type: INTEGER, minimum: 1, maximum: 10000000, optional: false}
      - {name: location, type: UTF8String, size_min: 0, size_max: 256, optional: false}
      - {name: registrar, type: UTF8String, size_min: 0, size_max: 256, optional: false}
      - {name: range-activation, type: DateAndTime, optional: false}
      - {name: mobile-country-code, type: NumericString, size_exact: 3, optional: false}
      - {name: mobile-network-code, type: NumericString, size_exact: 3, optional: false}
      - name: range-deactivation
        tag: 0
        type: DateAndTime
        optional: true
        rendered_token: DateAndTimeOPTIONAL
        syntax_status: PENDING_PRIMARY_PDF_MISSING_TOKEN_SEPARATOR
      - name: range-status
        tag: 1
        type: UTF8String
        size_min: 1
        size_max: 128
        optional: true
        rendered_constraint: "SIZE 1 .. 128))"
        constraint_status: PENDING_PRIMARY_PDF_PARENTHESES
      - {name: description, tag: 2, type: UTF8String, size_min: 1, size_max: 256, optional: true}
      - {name: operating-company-number, tag: 3, type: UTF8String, size_min: 0, size_max: 4, optional: true}

