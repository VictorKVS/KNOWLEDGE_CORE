schema_version: "1.0"
id: RU-MINKOMSVYAZ-573-2018-APPENDIX9-DICTIONARIES-CORE-ASN-ATOMIC-V1
title: "Приказ Минкомсвязи № 573: ядро Dictionaries.asn приложения № 9"
checked_at: "2026-08-28"
status: VERIFIED_CURRENT_CONSOLIDATED_PUBLIC_TEXT_DICTIONARIES_CORE_WITH_RENDERED_SYNTAX_ANOMALIES_FAIL_CLOSED
scope: >-
  Ограниченное ядро действующего Dictionaries.asn: заголовок модуля,
  экспорты и импорты, TelcoID, TelcoList, DictionaryTask, DictionaryReport,
  одиночный вариант запроса и восемнадцать вариантов отчетов. Первый глубокий
  срез записей вынесен в связанную модель; оставшиеся записи и компилируемость
  искаженных HTML-токенов не заявлены.

