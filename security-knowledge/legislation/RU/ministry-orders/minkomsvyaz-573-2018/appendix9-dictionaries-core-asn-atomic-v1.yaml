module:
  declaration: "Dictionaries DEFINITIONS IMPLICIT TAGS ::= BEGIN"
  name: Dictionaries
  tagging: IMPLICIT_TAGS
  exports: [TelcoID, TelcoList, DictionaryTask, DictionaryReport, PhoneAbonentType]
  import_groups:
    Sorm: [DateAndTime]
    Classification:
      - TAGGED
      - sorm-request-dictionaries
      - sorm-report-dictionary-telcos
      - sorm-report-dictionary-bunches
      - sorm-report-dictionary-basic-stations
      - sorm-report-dictionary-roaming-partners
      - sorm-report-dictionary-switches
      - sorm-report-dictionary-gates
      - sorm-report-dictionary-call-types
      - sorm-report-dictionary-supplement-services
      - sorm-report-dictionary-pay-types
      - sorm-report-dictionary-termination-causes
      - sorm-report-dictionary-ip-numbering-plan
      - sorm-report-dictionary-phone-numbering-plan
      - sorm-report-dictionary-doc-types
      - sorm-report-dictionary-ip-data-points
      - sorm-report-dictionary-special-numbers
      - sorm-report-dictionary-bunches-map
      - sorm-report-dictionary-mobile-subscriber-identity-plan
      - sorm-report-dictionary-signal-point-codes
    Addresses: [ReportedAddress]
    NetworkIdentifiers: [Bunch, DataNetworkEquipment, IPAddress, IPPort, IPMask, NetworkPeerInfo, NetworkType]
    Locations: [GeoLocation]

telco_id:
  kind: INTEGER
  minimum: 0
  maximum: 65535

telco_list:
  kind: SEQUENCE_OF
  item_type: TelcoID
  size_constraint: NOT_SPECIFIED

dictionary_task:
  kind: SEQUENCE
  fields:
    - {name: id, type: "TAGGED.&id", constraint: DictionaryTaskVariants, optional: false}
    - {name: data, type: "TAGGED.&Data", constraint: "DictionaryTaskVariants{@id}", optional: false}
  variants:
    declaration: "DictionaryTaskVariants TAGGED ::= { dictionaryTask }"
    members: [dictionaryTask]
  dictionaryTask:
    oid: sorm-request-dictionaries
    data_type: ObjectDescriptor
    meaning: REQUESTED_DICTIONARY_REPORT_IDENTIFIER
  allowed_object_descriptors:
    - sorm-report-dictionary-telcos
    - sorm-report-dictionary-bunches
    - sorm-report-dictionary-basic-stations
    - sorm-report-dictionary-roaming-partners
    - sorm-report-dictionary-switches
    - sorm-report-dictionary-gates
    - sorm-report-dictionary-call-types
    - sorm-report-dictionary-supplement-services
    - sorm-report-dictionary-pay-types
    - sorm-report-dictionary-termination-causes
    - sorm-report-dictionary-ip-numbering-plan
    - sorm-report-dictionary-phone-numbering-plan
    - sorm-report-dictionary-doc-types
    - sorm-report-dictionary-ip-data-points
    - sorm-report-dictionary-special-numbers
    - sorm-report-dictionary-bunches-map
    - sorm-report-dictionary-mobile-subscriber-identity-plan
    - sorm-report-dictionary-signal-point-codes

dictionary_report:
  kind: SEQUENCE
  fields:
    - {name: id, type: "TAGGED.&id", constraint: DictionaryRecordsVariants, optional: false}
    - {name: data, type: "TAGGED.&Data", constraint: "DictionaryRecordsVariants{@id}", optional: false}
  rendered_declaration: "Dictionary Records VariantsTAGGED ::= {"
  intended_reference_token_in_fields: DictionaryRecordsVariants
  declaration_token_status: PENDING_PRIMARY_PDF_RENDERING_CORRECTION
  variants:
    - {name: telcosRecords, oid: sorm-report-dictionary-telcos, data: "SEQUENCE OF TelcosRecord"}
    - {name: bunchesRecords, oid: sorm-report-dictionary-bunches, data: "SEQUENCE OF BunchRecord"}
    - {name: basicStationsSectorRecords, oid: sorm-report-dictionary-basic-stations, data: "SEQUENCE OF BasicStationSectorRecord"}
    - {name: roamingPartnersRecords, oid: sorm-report-dictionary-roaming-partners, data: "SEQUENCE OF RoamingPartnerRecord"}
    - {name: switchesRecords, oid: sorm-report-dictionary-switches, data: "SEQUENCE OF SwitchesRecord"}
    - {name: gatesRecords, oid: sorm-report-dictionary-gates, data: "SEQUENCE OF GatesRecord"}
    - {name: callTypesRecords, oid: sorm-report-dictionary-call-types, data: "SEQUENCE OF CallsTypesRecord"}
    - {name: supplementServicesRecords, oid: sorm-report-dictionary-supplement-services, data: "SEQUENCE OF SupplementServicesRecord"}
    - {name: payTypesRecords, oid: sorm-report-dictionary-pay-types, data: "SEQUENCE OF PayTypesRecord"}
    - {name: terminationCausesRecords, oid: sorm-report-dictionary-termination-causes, data: "SEQUENCE OF TerminationCausesRecord", oid_render_status: PENDING_PRIMARY_PDF_CLOSING_DELIMITER}
    - {name: ipNumberingPlanRecords, oid: sorm-report-dictionary-ip-numbering-plan, data: "SEQUENCE OF IpNumberingPlanRecord"}
    - {name: telephoneNumberingPlanRecords, oid: sorm-report-dictionary-phone-numbering-plan, data: "SEQUENCE OF TelephoneNumberingPlanRecord"}
    - {name: docTypesRecords, oid: sorm-report-dictionary-doc-types, data: "SEQUENCE OF DocTypesRecord"}
    - {name: ipDataPointsRecords, oid: sorm-report-dictionary-ip-data-points, data: "SEQUENCE OF IpDataPointRecord"}
    - {name: specialNumbersRecords, oid: sorm-report-dictionary-special-numbers, data: "SEQUENCE OF SpecialNumberRecord"}
    - {name: bunchesMapRecords, oid: sorm-report-dictionary-bunches-map, data: "SEQUENCE OF BunchesMapRecord"}
    - {name: mobileSubscriberIdenityPlanRecords, oid: sorm-report-dictionary-mobile-subscriber-identity-plan, data: "SEQUENCE OF MobileSubscriberIdenityPlanRecord"}
    - {name: signalPointCodes, oid: sorm-report-dictionary-signal-point-codes, data: "SEQUENCE OF SignalPointCodesRecord"}

phone_abonent_type:
  kind: ENUMERATED
  values:
    - {name: local, value: 0}
    - {name: network, value: 1}
    - {name: roamer, value: 2}
    - {name: undefined, value: 3}

