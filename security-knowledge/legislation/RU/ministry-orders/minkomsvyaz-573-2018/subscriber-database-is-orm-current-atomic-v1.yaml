scope: >-
  Действующее публичное ядро требований к ИС ОРМ, содержащим базы данных
  абонентов, пользователей и оказанных услуг. Приказ № 630 применяется с
  01.03.2024, приказ № 1196 — с 15.03.2026. Утратившие силу подпункт 13
  пункта 5 и строка 13 приложения № 10 заблокированы. Глубокие ASN.1,
  поля, коды и таблицы приложений остаются отдельной fail-closed границей.

