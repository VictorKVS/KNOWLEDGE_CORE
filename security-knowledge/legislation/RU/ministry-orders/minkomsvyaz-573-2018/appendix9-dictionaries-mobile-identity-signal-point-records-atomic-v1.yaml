  - {name: signalPointCodes, oid: sorm-report-dictionary-signal-point-codes, item_type: SignalPointCodesRecord, count_constraint: NOT_SPECIFIED}

records:
  MobileSubscriberIdenityPlanRecord:
    kind: SEQUENCE
    fields:
      - {name: telco-id, type: TelcoID, optional: false}
      - {name: mcc, type: NumericString, size_exact: 3, optional: false}
      - {name: mnc, type: NumericString, size_exact: 3, optional: false}
      - {name: area-code, type: NumericString, size_min: 3, size_max: 10, optional: false}
      - {name: capacity-from, type: NumericString, size_min: 0, size_max: 7, optional: false}
      - {name: capacity-to, type: NumericString, size_min: 0, size_max: 7, optional: false}
      - {name: capacity-size, type: INTEGER, minimum: 1, maximum: 10000000, optional: false}
      - {name: description, type: UTF8String, size_min: 2, size_max: 255, optional: false}
      - {name: region, type: UTF8String, size_min: 1, size_max: 128, optional: false}
      - {name: city, type: UTF8String, size_min: 1, size_max: 128, optional: false}
      - name: range-activation
        type: DateAndTime
        optional: false
        rendered_token: "DateAnd Time"
        syntax_status: PENDING_PRIMARY_PDF_SPLIT_TOKEN
      - name: range-deactivation
        tag: 0
        type: DateAndTime
        optional: true
        rendered_token: DateAndTimeOPTIONAL
        syntax_status: PENDING_PRIMARY_PDF_MISSING_TOKEN_SEPARATOR
      - {name: range-status, tag: 1, type: UTF8String, size_min: 2, size_max: 128, optional: true}
  SignalPointCodesRecord:
    kind: SEQUENCE
    fields:
      - {name: ss7-point-code, type: UTF8String, size_min: 1, size_max: 32, optional: false}
      - name: switch-id
        type: UTF8String
        size_min: 1
        size_max: 128
        optional: false
        rendered_token: switch-idUTF8String
        syntax_status: PENDING_PRIMARY_PDF_MISSING_TOKEN_SEPARATOR
      - name: begin-time
        type: DateAndTime
        optional: false
        rendered_token: begin-timeDateAndTime
        syntax_status: PENDING_PRIMARY_PDF_MISSING_TOKEN_SEPARATOR
      - {name: end-time, type: DateAndTime, optional: true}
      - {name: description, type: UTF8String, size_min: 1, size_max: 256, optional: false}

dependencies:
