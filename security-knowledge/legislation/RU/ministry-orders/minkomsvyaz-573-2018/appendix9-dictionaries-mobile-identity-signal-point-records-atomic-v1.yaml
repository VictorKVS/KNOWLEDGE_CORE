scope: >-
  Ограниченный глубокий срез Dictionaries.asn действующей замены приложения
  № 9: две оболочки отчетов, MobileSubscriberIdenityPlanRecord и
  SignalPointCodesRecord с точными буквальными именами, полями,
  обязательностью, тегами, диапазонами и размерами. Дефекты отображения
  токенов и неприведенные бизнес-правила оставлены fail-closed.

