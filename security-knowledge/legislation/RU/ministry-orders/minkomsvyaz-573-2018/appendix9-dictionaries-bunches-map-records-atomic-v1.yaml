status: VERIFIED_CURRENT_CONSOLIDATED_PUBLIC_TEXT_BUNCHES_MAP_FIELDS_REQUIREDNESS_AND_SWITCH_ID_SIZE_FAIL_CLOSED
scope: >-
  Ограниченный глубокий срез Dictionaries.asn действующей замены приложения
  № 9: оболочка bunchesMapRecords, BunchesMapRecord и BunchMapPoint с точными
  полями, обязательностью и размером switch-id. Направление связи, уникальность,
  различие концов, ссылочная целостность и иные неприведенные бизнес-правила
  не выводятся.

sources:
  act: "Приказ Минкомсвязи России от 29.10.2018 № 573"
  current_revision_date: "2025-12-18"
  current_consolidated_open_text: "https://legalacts.ru/doc/prikaz-minkomsvjazi-rossii-ot-29102018-n-573-ob-utverzhdenii/"
  order630_official_publication: "https://publication.pravo.gov.ru/document/0001202309050014"
