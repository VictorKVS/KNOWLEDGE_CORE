  - {id: MK573RSG-R001, rule: APPLY_ORDER630_RECORDS_ONLY_FROM_2024_03_01}
  - {id: MK573RSG-R002, rule: STOP_CURRENT_ROUTE_AT_2030_03_01}
  - {id: MK573RSG-R003, rule: PRESERVE_THREE_REPORT_WRAPPER_OID_TYPE_MAPPINGS}
  - {id: MK573RSG-R004, rule: DO_NOT_INVENT_REPORT_WRAPPER_COUNT_LIMITS}
  - {id: MK573RSG-R005, rule: PRESERVE_FIVE_ROAMING_PARTNER_FIELDS}
  - {id: MK573RSG-R006, rule: REQUIRE_FOUR_ROAMING_PARTNER_FIELDS}
  - {id: MK573RSG-R007, rule: KEEP_ROAMING_END_TIME_OPTIONAL}
