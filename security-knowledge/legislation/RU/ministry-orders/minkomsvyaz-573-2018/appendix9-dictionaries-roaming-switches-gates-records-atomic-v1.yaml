schema_version: "1.0"
id: RU-MINKOMSVYAZ-573-2018-APPENDIX9-DICTIONARIES-ROAMING-SWITCHES-GATES-RECORDS-ATOMIC-V1
title: "Приказ Минкомсвязи № 573: RoamingPartnerRecord, SwitchesRecord и GatesRecord"
checked_at: "2026-08-28"
status: VERIFIED_CURRENT_CONSOLIDATED_PUBLIC_TEXT_ROAMING_SWITCHES_GATES_FIELDS_ENUMS_AND_BOUNDARIES_FAIL_CLOSED
scope: >-
  Ограниченный глубокий срез Dictionaries.asn действующей замены приложения
  № 9: три оболочки отчетов, RoamingPartnerRecord, SwitchesRecord и
  GatesRecord с точными полями, обязательностью, диапазонами, размерами и
  перечислениями. Неоговоренные ограничения количества и бизнес-семантика
  пустых списков не выводятся по аналогии.

sources:
  act: "Приказ Минкомсвязи России от 29.10.2018 № 573"
  current_revision_date: "2025-12-18"
  current_consolidated_open_text: "https://legalacts.ru/doc/prikaz-minkomsvjazi-rossii-ot-29102018-n-573-ob-utverzhdenii/"
  order630_official_publication: "https://publication.pravo.gov.ru/document/0001202309050014"
  order630_exact_delta: "https://www.garant.ru/products/ipo/prime/doc/407511660/"

temporal_model:
  replaced_by: "Приказ Минцифры России от 12.07.2023 № 630, пункт 21 изменений"
  effective_from: "2024-03-01"
  validity_until_exclusive: "2030-03-01"
  status: CURRENT_AS_OF_2026_08_28

report_wrappers:
  - {name: roamingPartnersRecords, oid: sorm-report-dictionary-roaming-partners, item_type: RoamingPartnerRecord, count_constraint: NOT_SPECIFIED}
  - {name: switchesRecords, oid: sorm-report-dictionary-switches, item_type: SwitchesRecord, count_constraint: NOT_SPECIFIED}
  - {name: gatesRecords, oid: sorm-report-dictionary-gates, item_type: GatesRecord, count_constraint: NOT_SPECIFIED}

records:
  RoamingPartnerRecord:
    kind: SEQUENCE
    fields:
      - {name: telco-id, type: TelcoID, optional: false}
      - {name: roaming-id, type: INTEGER, minimum: 0, maximum: 4294967295, optional: false}
      - {name: begin-time, type: DateAndTime, optional: false}
      - {name: end-time, type: DateAndTime, optional: true}
      - {name: description, type: UTF8String, size_min: 1, size_max: 256, optional: false}
  SwitchesRecord:
    kind: SEQUENCE
    fields:
      - {name: telco-id, type: TelcoID, optional: false}
      - {name: switch-id, type: UTF8String, size_min: 1, size_max: 128, optional: false}
      - {name: begin-time, type: DateAndTime, optional: false}
      - {name: end-time, type: DateAndTime, optional: true}
      - {name: description, type: UTF8String, size_min: 1, size_max: 256, optional: false}
      - {name: network-type, type: NetworkType, optional: false}
      - {name: address, type: ReportedAddress, optional: false}
      - {name: switch-sign, type: NumericString, size_min: 1, size_max: 18, optional: true}
      - {name: switch-type, type: ENUMERATED, optional: false}
    switch_type:
      values:
        - {name: internal, value: 0}
        - {name: border, value: 1}
  GatesRecord:
    kind: SEQUENCE
    fields:
      - {name: telco-id, type: TelcoID, optional: false}
      - {name: gate-id, type: INTEGER, minimum: 0, maximum: 4294967295, optional: false}
      - {name: ip-list, type: IPList, optional: false}
      - {name: begin-time, type: DateAndTime, optional: false}
      - {name: end-time, type: DateAndTime, optional: true}
      - {name: description, type: UTF8String, size_min: 1, size_max: 256, optional: false}
      - {name: address, type: ReportedAddress, optional: false}
      - {name: gate-type, type: ENUMERATED, optional: false}
    gate_type:
      values:
        - {name: sgsn, value: 0}
        - {name: ggsn, value: 1}
        - {name: smsc, value: 2}
        - {name: gmsc, value: 3}
        - {name: hss, value: 4}
        - {name: pstn, value: 5}
        - {name: voip-gw, value: 6}
        - {name: aaa, value: 7}
        - {name: nat, value: 8}

dependencies:
  TelcoID: appendix9-dictionaries-core-asn-atomic-v1.yaml
  IPList: appendix9-dictionaries-telco-bunch-basic-station-records-atomic-v1.yaml
  ReportedAddress: appendix9-addresses-asn-atomic-v1.yaml
  DateAndTime: Sorm.asn_PENDING_SEPARATE_MODEL
  NetworkType: NetworkIdentifiers.asn_PENDING_SEPARATE_MODEL

sequence_semantics:
  gate_ip_list:
    kind: SEQUENCE_OF
    item_type: NetworkPeerInfo
    count_constraint: NOT_SPECIFIED
    empty_sequence_asn1_status: SYNTACTICALLY_ALLOWED_WITHOUT_SIZE_CONSTRAINT
    empty_sequence_business_status: NOT_SPECIFIED_DO_NOT_INFER_USABLE_GATE

semantic_guards:
  - ALL_THREE_END_TIME_FIELDS_ARE_OPTIONAL
  - SWITCH_SIGN_IS_OPTIONAL_BUT_SWITCH_TYPE_IS_REQUIRED
  - GATE_IP_LIST_IS_REQUIRED_WHILE_ITS_ELEMENT_COUNT_HAS_NO_PUBLISHED_LIMIT
  - EMPTY_GATE_IP_LIST_HAS_NO_INFERRED_OPERATIONAL_MEANING
  - SWITCH_TYPE_HAS_EXACTLY_INTERNAL_0_AND_BORDER_1
  - GATE_TYPE_HAS_EXACTLY_NINE_VALUES_0_TO_8
  - ENUMERATIONS_ARE_CLOSED_FOR_THIS_EXECUTABLE_SLICE
  - NO_RETENTION_REFRESH_OR_DEACTIVATION_GRACE_PERIOD_IS_INFERRED
  - NO_ASN1_COMPILABILITY_CLAIM_BEYOND_THIS_FIELD_SLICE

