  - {id: MK573RSG-R018, rule: PRESERVE_SWITCH_TYPE_BORDER_1}
  - {id: MK573RSG-R019, rule: BLOCK_UNKNOWN_SWITCH_TYPE_VALUE}
  - {id: MK573RSG-R020, rule: PRESERVE_EIGHT_GATE_FIELDS}
  - {id: MK573RSG-R021, rule: REQUIRE_SEVEN_GATE_FIELDS}
  - {id: MK573RSG-R022, rule: KEEP_GATE_END_TIME_OPTIONAL}
