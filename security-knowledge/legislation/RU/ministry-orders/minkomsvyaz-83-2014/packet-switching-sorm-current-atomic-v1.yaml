    - DATA_TRANSMISSION_EXCEPT_FOR_VOICE
  equipment: PACKET_INFORMATION_SWITCHING_AND_ROUTING_EQUIPMENT_WITH_SORM_SOFTWARE

current_point4:
  network_connection:
    min_interfaces_from_appendix1: 1
  control_points:
    count: 16
    interface: ETHERNET_IEEE_802_3_TX
    head_control_points: 1
    other_management_interfaces_allowed: false
  is_bd_orm_connection_required: true
  protocols:
    control_point: APPENDIX2
    is_bd_orm: APPENDIX2_1
  control_parameters:
    count: 20
    original_a_to_n:
      - FIXED_IPV4_OR_IPV6_ADDRESS
      - MASKED_IP_ADDRESS
      - USER_ACCOUNT_WITH_STAR_AND_QUESTION_WILDCARDS
      - UNENCRYPTED_SMTP_POP3_IMAP4_EMAIL_ADDRESS
      - UNENCRYPTED_WEBMAIL_ADDRESS
      - CALLING_OR_CALLED_PHONE_NUMBER
      - SUBSCRIBER_LINE_IDENTIFIER
      - CALLING_OR_CALLED_VOICE_DATA_USER_IDENTIFIER
      - IMSI
      - IMEI
      - MAC_ADDRESS
      - MESSAGING_SERVICE_IDENTIFIER
      - MIN
    added_by_order139_o_to_f:
      - URI
      - SERVER_DOMAIN_NAME
      - APPLICATION_PROTOCOL_CODE
      - APPLICATION_PROTOCOL_TYPE
      - APPLICATION_PROTOCOL_CONTENT_TYPE
      - APPLICATION_PROTOCOL_FIELD
      - TRAFFIC_SELECTION_AND_FILTER_RULE_SYNTAX
  max_control_parameter_values_minimum: 2000
  failure_route:
    events: [TECHNICAL_FAILURE, POWER_LOSS, CONTROL_POINT_RESTART]
    action: DELETE_ALL_CONTROL_PARAMETERS_AND_SELECTED_INFORMATION
  authentication_and_connection_processing_includes_location_when_present: true
  volatile_selected_information_buffer_min_gib: 2
  volatile_buffer_purpose: CONTROL_POINT_CHANNEL_LOAD_LEVELING
  current_processing: PROCESS_ALL_NETWORK_INPUT_ACCORDING_TO_CLASS
  is_bd_orm_statistics: ALL_SUBSCRIBER_CONNECTIONS
  is_bd_orm_content:
    default_without_head_control_point_filters: FULL_VOLUME
    excluded_when: MATCHES_HEAD_CONTROL_POINT_MESSAGE_FILTER
    max_filter_criteria: 2000
    filter_types:
      - IP_ADDRESS
      - VLAN_OR_MPLS_IDENTIFIER
      - PORT_RANGE
      - URI
      - SERVER_DOMAIN_NAME
      - APPLICATION_PROTOCOL_CODE
      - APPLICATION_PROTOCOL_TYPE
      - APPLICATION_PROTOCOL_CONTENT_TYPE
      - APPLICATION_PROTOCOL_FIELD
      - TRAFFIC_SELECTION_AND_FILTER_RULE_SYNTAX

class_table:
