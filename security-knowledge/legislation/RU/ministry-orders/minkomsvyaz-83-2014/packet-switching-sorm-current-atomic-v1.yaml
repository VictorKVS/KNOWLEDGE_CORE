scope: >-
  Действующее публичное ядро требований к оборудованию коммутации и
  маршрутизации пакетов информации в сетях передачи данных. Изменения
  приказа № 139 применяются с 14.07.2019; удаленные положения о
  двенадцатичасовом кольцевом буфере не выдаются за текущие требования.
  Детальные таблицы команд, ответов, извещений, элементов данных и правил
  фильтрации приложений № 2, 2.1 и 2.2 остаются отдельной границей проверки.

