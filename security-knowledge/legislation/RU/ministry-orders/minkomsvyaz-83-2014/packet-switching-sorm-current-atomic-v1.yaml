    ident_bytes: 2
    length_bytes: 4
    total_service_bytes: 7
    data_length_formula: LENGTH_MINUS_7
  deep_command_response_notice_item_and_filter_tables: PENDING_IMMUTABLE_PAGE_REVIEW

