  "stages": [
    "discover the official dataset and record route",
    "retrieve and retain bytes plus transport metadata",
    "hash exact bytes before parsing",
    "parse with a versioned authority-native field map",
    "validate identifiers, types, counts and duplicates",
    "separate publication time, observation time and legal effective time",
    "publish an append-only immutable observation and supersedes edges",
    "preserve transport, schema and evidence gaps as explicit pending states"
  ],
  "red_team_attacks": [
    {
      "id": "RT01",
      "attack": "treat an indexed search snippet as a complete authoritative register record",
      "blocked_by": "snippet evidence remains a separate low-granularity observation",
      "blocked": true
    },
    {
      "id": "RT02",
      "attack": "use the native GUID as the licence registration number",
      "blocked_by": "GUID and registration number are separate keys",
      "blocked": true
    },
    {
      "id": "RT03",
      "attack": "claim immutable official bytes from an index extract",
      "blocked_by": "FETCHED_BYTES and HASHED gates require retained response bytes",
      "blocked": true
    },
    {
      "id": "RT04",
      "attack": "infer the full schema from one example card",
      "blocked_by": "field groups are a capture contract, not a claim that every field is exposed",
      "blocked": true
    },
    {
      "id": "RT05",
      "attack": "apply a currently indexed status to an earlier date",
      "blocked_by": "observed-at and valid-time lifecycle events remain separate",
      "blocked": true
    },
    {
      "id": "RT06",
      "attack": "treat an indefinite term as immunity from suspension, termination or annulment",
      "blocked_by": "term and lifecycle events are independent",
      "blocked": true
    },
    {
      "id": "RT07",
      "attack": "convert a missing field into false or absent",
      "blocked_by": "missing public data remains UNKNOWN or EVIDENCE_PENDING",
      "blocked": true
    },
    {
      "id": "RT08",
      "attack": "merge records because names or GUID fragments look similar",
      "blocked_by": "registry family and native identifiers must match exactly",
      "blocked": true
    },
    {
      "id": "RT09",
      "attack": "conflate regview1 and regview2 licence families",
      "blocked_by": "each route retains its authority-native family",
      "blocked": true
    },
    {
      "id": "RT10",
      "attack": "use a licence card as proof that a product is FSTEC-certified",
      "blocked_by": "licence and product-certificate evidence are independent",
      "blocked": true
    },
    {
      "id": "RT11",
      "attack": "use the publication update date as the effective date of every record",
      "blocked_by": "dataset update time is not a per-record legal event",
      "blocked": true
    },
    {
      "id": "RT12",
      "attack": "treat a timeout or empty response as an empty register",
      "blocked_by": "transport failure maps to TRANSPORT_PENDING",
      "blocked": true
    }
  ],
