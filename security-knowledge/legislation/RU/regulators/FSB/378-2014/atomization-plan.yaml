schema_version: 1
source_id: FSB-378-2014
purpose: Controlled extraction plan for cryptographic personal-data protection requirements. No requirement is VERIFIED until exact source text and locator are ingested.
status: SOURCE_REVIEW_IN_PROGRESS
context_links:
  - PP-RF-1119-2012
  - FZ-152
  - FSB-CRYPTOGRAPHY
extraction_dimensions:
  - applicability_to_ISPDn
  - use_of_cryptographic_means
  - protection_level_UZ1
  - protection_level_UZ2
  - protection_level_UZ3
  - protection_level_UZ4
  - threat_and_violator_assumptions
  - crypto_tool_requirements
  - key_management
  - access_and_personnel
  - premises_and_physical_conditions
  - media_and_storage
  - operation_and_administration
  - documentation
  - evidence_and_verification
atomic_requirement_schema:
  required: [id, source_locator, normative_text_ref, actor, action, object, condition, applicability, evidence, verification, status]
  status_values: [PENDING_SOURCE, EXTRACTED, VERIFIED, SUPERSEDED]
expert_checks:
  - Confirm current legal status and amendments from authoritative source.
  - Preserve exact relationship to PP RF 1119 rather than treating UZ as an isolated FSB classification.
  - Distinguish requirement to use cryptography from requirements that apply once cryptography is selected/required.
  - Separate organizational, technical, cryptographic and physical measures.
  - Record evidence artifacts for every testable obligation.
  - Map requirements to unified controls only after source verification.
outputs:
  - requirements/by-level.yaml
  - applicability/rules.yaml
  - checklists/organization.yaml
  - checklists/specialist.yaml
  - evidence/catalog.yaml
  - cross-links/pp1119.yaml
