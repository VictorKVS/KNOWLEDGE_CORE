rules:
  - REPEALED acts remain searchable for historical as-of-date analysis.
  - Replacement does not delete old atomic requirements; each receives effective_to and supersession links.
  - CURRENT_REFERENCE_FOUND is not equivalent to VERIFIED_ACTIVE until final primary-source lifecycle verification is complete.
