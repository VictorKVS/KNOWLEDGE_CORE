  - {id: FSB117-R008, locator: "Требования, п. 1", rule: TRIGGER_FOR_STORAGE_MEDIA_WHERE_THIRD_PARTY_ACCESS_CANNOT_BE_EXCLUDED_NONCRYPTOGRAPHICALLY}
  - {id: FSB117-R009, locator: "Требования, п. 2", rule: JUSTIFY_SKZI_NECESSITY_IN_THREAT_MODEL}
