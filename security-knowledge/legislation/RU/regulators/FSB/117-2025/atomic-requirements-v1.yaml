  - {id: FSB117-R013, locator: "Требования, п. 3", rule: USE_SKZI_CERTIFIED_BY_FSB_RUSSIA}
  - {id: FSB117-R014, locator: "Требования, п. 4", rule: DETERMINE_SKZI_CLASS_UNDER_CLAUSES_7_TO_18}
