schema_version: "1.0"
id: RU-FSB117-2025-GOVERNMENT-IS-CRYPTO-ATOMIC-V1
title: FSB Order 117/2025 cryptographic applicability and SKZI class router
checked_at: "2026-08-20"
status: VERIFIED_FULL_PUBLIC_TEXT_REGRESSION_PROTECTED
scope: >-
  All eighteen requirement clauses and the 3x3 minimum-SKZI-class appendix of FSB Order
  No. 117 of 18 March 2025. This model is the public-sector-system cryptographic layer;
  it is not FSTEC Order 117 and it does not repeal or globally replace FSB Order 378.

source:
  authority: "ФСБ России"
  act: "Приказ ФСБ России от 18.03.2025 № 117"
  minjust_registration: "26.03.2025 № 81647"
  official_publication_number: "0001202503260008"
  official_publication_date: "2025-03-26"
  official_publication_url: "https://publication.pravo.gov.ru/document/0001202503260008"
  authoritative_card_url: "https://www.consultant.ru/document/cons_doc_LAW_501788/"
  public_text_cross_check_url: "https://rulaws.ru/acts/Prikaz-FSB-Rossii-ot-18.03.2025-N-117/"
  effective_from: "2025-04-06"
  effective_date_basis: GENERAL_TEN_DAY_RULE_AFTER_OFFICIAL_PUBLICATION_ORDER_HAS_NO_SPECIAL_DATE
  current_edition: "2025-03-18"
  supersedes: FSB_ORDER_524_2022

class_order_weak_to_strong: [KS1, KS2, KS3, KV, KA]

minimum_class_matrix:
  HIGH:
    FEDERAL_OR_MULTI_REGION: KV
    ONE_REGION: KS3
    OBJECT: KS2
  MEDIUM:
    FEDERAL_OR_MULTI_REGION: KS3
    ONE_REGION: KS3
    OBJECT: KS1
  LOW:
    FEDERAL_OR_MULTI_REGION: KS2
    ONE_REGION: KS1
    OBJECT: KS1

atomic_rules:
  - {id: FSB117-R001, locator: "приказ", rule: CURRENT_FROM_2025_04_06}
  - {id: FSB117-R002, locator: "приказ, п. 3", rule: REPEALS_FSB_ORDER_524_2022_ONLY}
  - {id: FSB117-R003, locator: "приказ, п. 2", rule: EXCLUDES_LISTED_TOP_STATE_BODIES_FSB_AND_STATE_SECRET_SYSTEMS}
  - {id: FSB117-R004, locator: "Требования, п. 1", rule: APPLIES_TO_GIS_AND_OTHER_LISTED_PUBLIC_SECTOR_INFORMATION_SYSTEMS_WHEN_A_CRYPTO_TRIGGER_EXISTS}
  - {id: FSB117-R005, locator: "Требования, п. 1", rule: TRIGGER_WHEN_LAW_OR_OTHER_NPA_REQUIRES_SKZI}
