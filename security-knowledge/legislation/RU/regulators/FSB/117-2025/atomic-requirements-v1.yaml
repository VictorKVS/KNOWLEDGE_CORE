  - {id: FSB117-R016, locator: "Требования, п. 5", rule: PERFORM_OPERATING_ENVIRONMENT_INFLUENCE_ASSESSMENT_WHEN_SKZI_DOCUMENTATION_REQUIRES_IT}
  - {id: FSB117-R017, locator: "Требования, п. 5", rule: USE_ORGANIZATION_AUTHORIZED_FOR_CRYPTOGRAPHIC_ENGINEERING_CRYPTOGRAPHIC_AND_SPECIAL_SKZI_RESEARCH}
  - {id: FSB117-R018, locator: "Требования, п. 5", rule: SUBMIT_ASSESSMENT_RESULTS_AND_PLANNED_SKZI_AND_TECHNICAL_SAMPLES_FOR_FSB_EXPERT_EXAMINATION}
  - {id: FSB117-R019, locator: "Требования, п. 5", rule: PROCESS_PROTECTED_INFORMATION_WITH_SKZI_AND_OTHER_TECHNICAL_MEANS_ONLY_WITH_POSITIVE_FSB_CONCLUSION_WHEN_ASSESSMENT_ROUTE_APPLIES}
  - {id: FSB117-R020, locator: "Требования, п. 6", rule: PREVENT_UNCONTROLLED_ENTRY_OR_PRESENCE_IN_SKZI_AND_KEY_AUTH_PASSWORD_MEDIA_ROOMS}
  - {id: FSB117-R021, locator: "Требования, п. 6", rule: APPROVE_ROOM_ACCESS_RULES_FOR_WORKING_NONWORKING_AND_ABNORMAL_CONDITIONS}
  - {id: FSB117-R022, locator: "Требования, п. 6", rule: APPROVE_LIST_OF_PERSONS_ENTITLED_TO_ROOM_ACCESS}
