red_team_guardrails:
  - DO_NOT_TREAT_SYSTEM_STATUS_ALONE_AS_A_CRYPTO_TRIGGER_WITHOUT_ONE_OF_CLAUSE_1_FACTS
  - DO_NOT_CONFLATE_FSB117_WITH_FSTEC117_DESPITE_IDENTICAL_NUMBER_AND_YEAR
  - DO_NOT_CLAIM_FSB117_REPEALED_FSB378_IT_ONLY_REPEALED_FSB524
  - DO_NOT_REPLACE_THE_3X3_MATRIX_WITH_A_GIS_PROTECTION_CLASS_OR_PP1119_LEVEL
  - DO_NOT_SKIP_THREAT_CAPABILITY_ESCALATION_AFTER_MATRIX_LOOKUP
  - DO_NOT_APPLY_KS2_KS3_OR_KV_ESCALATIONS_OUTSIDE_THEIR_EXPRESS_BASE_CLASS_CONDITIONS
  - DO_NOT_INVENT_A_NUMERIC_REASSESSMENT_CERTIFICATE_KEY_LIFETIME_OR_LOG_RETENTION_PERIOD
  - DO_NOT_INFER_CURRENT_PRODUCT_SUITABILITY_FROM_CLASS_LABEL_ALONE
  - DO_NOT_INFER_PP313_LICENSE_REQUIREMENT_FROM_MERE_INTERNAL_SKZI_USE
  - PRESERVE_CLAUSE_11_WORDING_AND_REQUIRE_EXPERT_REVIEW_IF_ARCHITECTURAL_INTERPRETATION_IS_CONTESTED

