  - {id: EVIDENCE_FSB117_FSB_AGREEMENT, proves: [FSB117-R012]}
  - {id: EVIDENCE_FSB117_CURRENT_SKZI_CERTIFICATE_VERSION_SCOPE, proves: [FSB117-R013]}
  - {id: EVIDENCE_FSB117_ENVIRONMENT_ASSESSMENT_APPLICABILITY, proves: [FSB117-R016]}
  - {id: EVIDENCE_FSB117_AUTHORIZED_RESEARCH_ORGANIZATION, proves: [FSB117-R017]}
  - {id: EVIDENCE_FSB117_FSB_EXPERT_CONCLUSION, proves: [FSB117-R018, FSB117-R019]}
  - {id: EVIDENCE_FSB117_ROOM_ACCESS_RULES, proves: [FSB117-R020, FSB117-R021]}
  - {id: EVIDENCE_FSB117_ROOM_ACCESS_LIST, proves: [FSB117-R022]}
  - {id: EVIDENCE_FSB117_SPECIAL_ROOM_INSPECTION, proves: [FSB117-R023, FSB117-R024, FSB117-R025]}
