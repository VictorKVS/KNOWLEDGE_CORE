  - {id: FSB117-R024, locator: "Требования, п. 6", rule: PROTECT_VULNERABLE_WINDOWS_WITH_GRILLES_SHUTTERS_ALARM_OR_EQUIVALENT}
  - {id: FSB117-R025, locator: "Требования, п. 6", rule: PROTECT_SERVER_ROOM_WINDOWS_AND_DOORS_WITH_GRILLES_ALARM_OR_EQUIVALENT}
  - {id: FSB117-R026, locator: "Требования, п. 7", rule: DETERMINE_SKZI_CLASS_FOR_EACH_TERRITORIAL_OR_OBJECT_SEGMENT}
  - {id: FSB117-R027, locator: "Требования, п. 7", rule: DETERMINE_SKZI_CLASS_FOR_WHOLE_SYSTEM_IF_NO_SEGMENTS_EXIST}
  - {id: FSB117-R028, locator: "Требования, п. 8", rule: USE_SIGNIFICANCE_SCALE_MATRIX_AND_CLAUSES_10_TO_18}
  - {id: FSB117-R029, locator: "Требования, п. 8", rule: INFORMATION_OWNER_CUSTOMER_AND_OR_OPERATOR_DETERMINES_SIGNIFICANCE}
  - {id: FSB117-R030, locator: "Требования, п. 8", rule: ASSESS_CONFIDENTIALITY_INTEGRITY_AND_AVAILABILITY_CONSEQUENCES}
  - {id: FSB117-R031, locator: "Требования, п. 8", rule: HIGH_IF_ANY_PROPERTY_BREACH_PREVENTS_SYSTEM_OPERATOR_OR_OWNER_FROM_PERFORMING_ASSIGNED_FUNCTIONS}
  - {id: FSB117-R032, locator: "Требования, п. 8", rule: MEDIUM_IF_ANY_PROPERTY_BREACH_PREVENTS_AT_LEAST_ONE_ASSIGNED_FUNCTION}
  - {id: FSB117-R033, locator: "Требования, п. 8", rule: LOW_IF_FUNCTIONS_REQUIRE_ADDITIONAL_FORCES_AND_RESOURCES}
  - {id: FSB117-R034, locator: "Требования, п. 9", rule: DETERMINE_SIGNIFICANCE_AND_SCALE_SEPARATELY_FOR_EACH_SEGMENT}
  - {id: FSB117-R035, locator: "Требования, п. 10", rule: INTERSYSTEM_INTERACTION_USES_THE_HIGHER_CLASS_USED_BY_INTERACTING_SYSTEMS_OR_SEGMENTS}
  - {id: FSB117-R036, locator: "Требования, п. 11", rule: INTRASYSTEM_SEGMENT_INTERACTION_CLASS_NOT_LOWER_THAN_THE_LEAST_CLASS_USED_IN_THOSE_SEGMENTS_PRESERVE_SOURCE_WORDING}
  - {id: FSB117-R037, locator: "Требования, п. 12", rule: OUTSIDE_CONTROLLED_ZONE_ATTACK_CREATION_PREPARATION_AND_CONDUCT_REQUIRES_KS1}
  - {id: FSB117-R038, locator: "Требования, п. 13", rule: INSIDE_CONTROLLED_ZONE_WITHOUT_PHYSICAL_ACCESS_ESCALATES_MATRIX_KS1_TO_KS2}
  - {id: FSB117-R039, locator: "Требования, п. 14", rule: INSIDE_CONTROLLED_ZONE_WITH_PHYSICAL_ACCESS_ESCALATES_MATRIX_KS1_OR_KS2_TO_KS3}
  - {id: FSB117-R040, locator: "Требования, п. 15", rule: SPECIALISTS_IN_SKZI_SIGNAL_OR_UNDOCUMENTED_APPLICATION_ANALYSIS_ESCALATE_MATRIX_KS1_KS2_OR_KS3_TO_KV}
  - {id: FSB117-R041, locator: "Требования, п. 16", rule: SPECIALISTS_EXPLOITING_UNDOCUMENTED_HARDWARE_OR_SOFTWARE_ENVIRONMENT_CAPABILITIES_REQUIRE_KA}
  - {id: FSB117-R042, locator: "Требования, п. 17", rule: CITIZEN_INTERACTION_SKZI_CLASS_IS_THREAT_BASED_AND_MAY_BE_LOWER_THAN_SYSTEM_CLASS}
  - {id: FSB117-R043, locator: "Требования, п. 18", rule: USE_HIGHER_CLASS_REQUIRED_BY_OTHER_APPLICABLE_CRYPTOGRAPHIC_NPA}
  - {id: FSB117-R044, locator: "Приложение", rule: APPLY_ALL_NINE_MINIMUM_CLASS_MATRIX_ROUTES}

interaction_router:
  - id: FSTEC117_PARALLEL_LAYER
    if: SYSTEM_WITHIN_BOTH_FSTEC117_AND_FSB117_SCOPE_AND_ANY_FSB117_CRYPTO_TRIGGER
    apply: [FSTEC_ORDER_117_NONCRYPTO, FSB_ORDER_117_CRYPTO]
  - id: ISPDN_ADDITIONAL_LAYER
    if: SYSTEM_IS_ISPDN_AND_SKZI_IS_USED
    apply: [PP1119, FSTEC_ORDER_21, FSB_ORDER_378]
    note: >-
      FSB Order 117 clause 18 preserves a higher class required by another applicable
      cryptographic NPA. It does not state that Order 378 is repealed or displaced.
  - id: CLASS_COMBINATION
    rule: CHOOSE_STRONGEST_MINIMUM_CLASS_ACROSS_EACH_APPLICABLE_PROVEN_ROUTE
    class_order: [KS1, KS2, KS3, KV, KA]
  - id: LICENSE_BOUNDARY
    rule: SKZI_USE_OR_FSB_CERTIFICATION_REQUIREMENT_DOES_NOT_ALONE_PROVE_A_PP313_CRYPTOGRAPHIC_ACTIVITY_LICENSE_TRIGGER

