expert_questions:
  - Which incident class has occurred?
  - Which legal regime applies to the affected asset and data?
  - Which notification obligations are triggered?
  - Which deadlines and channels are source-verified?
  - Which evidence must be preserved for regulator, investigation and retest?
  - Which controls failed or were absent?
  - Does the incident alter threat relevance, residual risk or architecture priorities?
rules:
  - Never infer a notification deadline from a related act; deadline must be source-verified.
  - A single incident may trigger multiple regimes; preserve each obligation separately.
  - Reusable evidence may support multiple obligations, but legal obligations are not deduplicated away.
