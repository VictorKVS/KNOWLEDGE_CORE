id: FSTEK-21-2013
authority: FSTEK_RUSSIA
type: order
number: 21
date: 2013-02-18
title: "Об утверждении Состава и содержания организационных и технических мер по обеспечению безопасности персональных данных при их обработке в информационных системах персональных данных"
registration:
  ministry_of_justice: true
jurisdiction: RU
domains:
  - personal_data
  - ISPDn
  - information_security
source_status: INGESTED
processing_status: STRUCTURED
normative_basis:
  - RU-FZ-152:article-19-part-4
  - RU-PP-1119
scope_notes:
  - "Устанавливает состав и содержание мер для уровней защищенности ПДн."
  - "Не охватывает государственную тайну и применение криптографических средств."
control_families:
  - IAF
  - UPD
  - OPS
  - ZNI
  - RSB
  - AVZ
  - SOV
  - ANZ
  - OCL
  - ODT
  - ZSV
  - ZTS
  - ZIS
  - incident_response
  - configuration_management
key_rules:
  - "Базовый набор мер выбирается по уровню защищенности, затем адаптируется, уточняется по актуальным угрозам и дополняется иными обязательными мерами."
  - "Допускаются компенсирующие меры при обосновании невозможности/нецелесообразности отдельных мер."
  - "Оценка эффективности проводится не реже одного раза в 3 года."
relationships:
  - type: IMPLEMENTS
    target: RU-FZ-152
  - type: DETAILS
    target: RU-PP-1119
review:
  current_text_verified: pending
  amendment_lineage_verified: pending
