document: FSTEK-31-2014
checks:
  - id: FSTEK31-CHECK-TM-01
    requirement_ids: [FSTEK31-13.3-01, FSTEK31-13.3-07]
    question: "Does the threat model identify external and internal threat sources and describe intruder capabilities?"
    expected_evidence: [approved_threat_model, intruder_model]
  - id: FSTEK31-CHECK-TM-02
    requirement_ids: [FSTEK31-13.3-02]
    question: "Has vulnerability analysis been performed for the ICS and its software and hardware-software components?"
    expected_evidence: [vulnerability_analysis, scan_or_assessment_results, threat_model]
  - id: FSTEK31-CHECK-TM-03
    requirement_ids: [FSTEK31-13.3-03, FSTEK31-13.3-04]
    question: "Are threat realization scenarios and their consequences for confidentiality, integrity, availability and normal operation documented?"
    expected_evidence: [threat_scenarios, impact_assessment]
  - id: FSTEK31-CHECK-TM-04
    requirement_ids: [FSTEK31-13.3-05]
    question: "Is the FSTEK threat database used as an input to threat identification, with other relevant vulnerability/threat sources where appropriate?"
    expected_evidence: [source_register, threat_model]
  - id: FSTEK31-CHECK-TM-05
    requirement_ids: [FSTEK31-13.3-06]
    question: "Does threat analysis account for levels/segments, system composition, interconnections, external systems/networks and operating modes?"
    expected_evidence: [architecture, network_diagram, data_flow_diagram, threat_model]
  - id: FSTEK31-CHECK-TZ-01
    requirement_ids: [FSTEK31-13.4-01, FSTEK31-13.4-02]
    question: "Are security-system requirements derived from the protection class and threat model and included in the technical specification?"
    expected_evidence: [classification_act, threat_model, technical_specification]
  - id: FSTEK31-CHECK-TZ-02
    requirement_ids: [FSTEK31-13.4-03, FSTEK31-13.4-04, FSTEK31-13.4-05, FSTEK31-13.4-06, FSTEK31-13.4-07, FSTEK31-13.4-08, FSTEK31-13.4-09, FSTEK31-13.4-10, FSTEK31-13.4-11]
    question: "Does the technical specification contain the required security goals/tasks, class, normative basis, protected objects, measures/tools, interconnection requirements, supply requirements, responsibilities and creation stages?"
    expected_evidence: [technical_specification]
