document: FSTEK-31-2014
checks:
  - id: FSTEK31-CHECK-001
    requirement_id: FSTEK31-REQ-001
    question: "Назначено ли структурное подразделение или должностное лицо, ответственное за защиту информации в АСУ ТП?"
    expected_evidence: [appointment_order, job_description, org_structure]
  - id: FSTEK31-CHECK-002
    requirement_id: FSTEK31-REQ-004
    question: "Сформированы ли требования к защите информации, включая решение о защите, классификацию, модель угроз и требования к системе защиты?"
    expected_evidence: [security_decision, classification_act, threat_model, technical_specification]
  - id: FSTEK31-CHECK-003
    requirement_id: FSTEK31-REQ-005
    question: "Оформлен ли акт классификации АСУ ТП и отражён ли класс защищённости в техническом задании?"
    expected_evidence: [classification_act, technical_specification]
  - id: FSTEK31-CHECK-004
    requirement_id: FSTEK31-REQ-006
    question: "Содержит ли модель угроз источники угроз, потенциал нарушителя, уязвимости, сценарии реализации и последствия?"
    expected_evidence: [threat_model, vulnerability_analysis, attack_scenarios]
  - id: FSTEK31-CHECK-005
    requirement_id: FSTEK31-REQ-007
    question: "Определены ли субъекты и объекты доступа, методы управления доступом, меры защиты, параметры безопасной настройки, состав и размещение СЗИ?"
    expected_evidence: [technical_design, access_matrix, security_architecture, secure_configuration_baseline]
  - id: FSTEK31-CHECK-006
    requirement_id: FSTEK31-REQ-009
    question: "Проведён ли до промышленной эксплуатации анализ уязвимостей технических средств, ПО и СЗИ с устранением выявленных недостатков?"
    expected_evidence: [vulnerability_assessment_report, remediation_records, retest_results]
  - id: FSTEK31-CHECK-007
    requirement_id: FSTEK31-REQ-010
    question: "Определён ли процесс выявления и реагирования на инциденты с ответственными, анализом причин, восстановлением и мерами против повторения?"
    expected_evidence: [incident_response_plan, incident_register, RCA_reports, recovery_records]
  - id: FSTEK31-CHECK-008
    requirement_id: FSTEK31-REQ-011
    question: "Ведётся ли базовая конфигурация АСУ ТП и контролируются ли изменения с оценкой влияния на безопасность?"
    expected_evidence: [baseline_configuration, change_log, approvals, impact_assessments]
  - id: FSTEK31-CHECK-009
    requirement_id: FSTEK31-REQ-012
    question: "Выполняется ли мониторинг событий безопасности, действий персонала и эффективности системы защиты с документированием результатов?"
    expected_evidence: [monitoring_reports, event_logs, review_reports, corrective_actions]
  - id: FSTEK31-CHECK-010
    requirement_id: FSTEK31-REQ-013
    question: "Регламентированы ли архивирование, безопасное стирание и уничтожение носителей при выводе АСУ ТП из эксплуатации?"
    expected_evidence: [decommissioning_procedure, destruction_acts, erasure_records, archive_records]
