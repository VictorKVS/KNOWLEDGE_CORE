schema_version: "1.0"
id: RU-PP719-SECTION-IX-STORAGE-SYSTEMS-REQUIREMENTS-ATOMIC-V1
title: "ПП РФ № 719, раздел IX: системы хранения данных — обязательные требования, операции, формулы и пороги"
checked_at: "2026-08-27"
status: VERIFIED_CURRENT_REQUIREMENTS_POINTS_FORMULAS_AND_THRESHOLD_LIVE_RECORD_PENDING
scope: >-
  Позиция раздела IX приложения к ПП РФ № 719 с кодом ОКПД2 26.20.2,
  за исключением 26.20.21 и 26.20.22, только в отношении систем хранения
  данных. Модель определяет требования к продукции, но не подтверждает
  наличие действующей записи конкретной модели изделия в реестре ГИСП.

sources:
