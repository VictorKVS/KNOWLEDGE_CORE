    current_index: "https://www.consultant.ru/document/cons_doc_LAW_183175/"
  pp1599:
    act: "Постановление Правительства РФ от 13.09.2022 № 1599"
    official_publication_date: "2022-09-15"
    official_publication: "https://publication.pravo.gov.ru/Document/View/0001202209150028"
    authoritative_full_text: "https://normativ.kontur.ru/document?documentId=473977&moduleId=1"
    effective_from: "2022-10-15"
    effective_rule: "истечение 30 дней со дня официального опубликования"
  formula_images:
    electronic_modules:
      url: "https://normativ.kontur.ru/image?imageId=155146&moduleId=1"
      sha256: "13b38502a837fecbaf91b1077ac5ad8b1c011252c8ede3273239bdc1f9ec020a"
      bytes: 2332
      glyph_preserved: "B = Σ_(i = 1, 2 … K) (B_i / K_i)"
    proportional_operations:
      url: "https://normativ.kontur.ru/image?imageId=155145&moduleId=1"
      sha256: "c57d0e0ccd287eaf32a8c56792cf5b94d660d4bc57b01e6c8b071516b62a7612"
      bytes: 1395
      glyph_preserved: "B = B_top × K"

product_key:
  okpd2: "26.20.2"
  exclusions: ["26.20.21", "26.20.22"]
  description: "Устройства запоминающие и прочие устройства хранения данных (только в отношении систем хранения данных)"
  exact_product_and_code_match_required: true

temporal_thresholds:
  - {id: THRESHOLD-2022, through: "2022-12-31", minimum_points: 110, status: HISTORICAL}
  - {id: THRESHOLD-2023, from: "2023-01-01", through: "2023-12-31", minimum_points: 120, status: HISTORICAL}
  - {id: THRESHOLD-2024-PLUS, from: "2024-01-01", minimum_points: 150, status: CURRENT}

formula_model:
  electronic_modules:
    exact_glyph: "B = Σ_(i = 1, 2 … K) (B_i / K_i)"
    B: "суммарное количество баллов за применение электронных модулей"
    K: "количество неповторяющихся электронных модулей по спецификации изделия"
    K_i: "общее количество неповторяющихся электронных модулей i-го вида по спецификации"
    B_i: "баллы i-го неповторяющегося электронного модуля"
    zero_denominator: BLOCK_UNREGULATED
    special_k_equals_one_multiplier: NOT_PRESENT_FOR_THIS_STORAGE_SYSTEM_ROW
  proportional_operations:
    exact_glyph: "B = B_top × K"
    B_top: "верхняя величина баллов конкретной операции"
    K: "доля российских элементов соответствующего вида, определенная текстом строки"
    denominator_zero: BLOCK_OPERATION_NOT_COMPUTABLE
    clamp_outside_zero_one: BLOCK_SOURCE_DATA_INVALID

mandatory_requirements_20_points:
  all_required: true
  requirements:
    - RUSSIAN_TAX_RESIDENT_ENTITY_NOT_UNDER_ENUMERATED_FOREIGN_CONTROL
    - RIGHTS_TO_DESIGN_AND_TECHNOLOGICAL_DOCUMENTATION_SUFFICIENT_FOR_DESIGN_PRODUCTION_MODERNIZATION_AND_DEVELOPMENT_IN_RUSSIA
    - TECHNICAL_CONDITIONS
    - FINISHED_PRODUCT_SPECIFICATION_WITH_ASSEMBLIES_AND_PARTS
    - OPERATION_MANUAL_OR_INSTRUCTION
    - PRODUCT_DIVISION_SCHEME
    - FUNCTIONAL_ELECTRICAL_DIAGRAM
    - TECHNOLOGICAL_INSTRUCTION
    - RIGHTS_TO_USE_MODIFY_MODERNIZE_AND_CHANGE_EMBEDDED_BIOS_FIRMWARE
    - FIRMWARE_SOURCE_TEXTS_AND_BINARY_MICROCODE_FILES
    - FIRMWARE_COMPILATION_AND_BUILD_MANUAL
    - TRADEMARK_EXCLUSIVE_OR_USE_RIGHTS_WITH_QUALIFYING_RUSSIAN_RIGHTHOLDER_IF_MARK_EXISTS
    - RUSSIAN_SERVICE_CENTER_FOR_REPAIR_WARRANTY_AND_POST_WARRANTY_SERVICE
    - OWN_OR_CONTRACT_RUSSIAN_RESEARCH_AND_PRODUCTION_BASE
  awarded_points_if_complete: 20

operations:
  - id: OP-CPU
    condition: IF_APPLICABLE_AND_FOOTNOTE_28_CONDITION_MET
    requirement: RUSSIAN_FIRST_OR_SECOND_LEVEL_CENTRAL_PROCESSOR
    points: 50
  - id: OP-ELECTRONIC-MODULES
    condition: FOOTNOTE_34_REQUIRES_RUSSIAN_SYSTEM_MAIN_BOARD_WITH_AT_LEAST_50_POINTS
    requirement: RUSSIAN_ELECTRONIC_MODULES
    formula: "B = Σ_(i = 1, 2 … K) (B_i / K_i)"
  - id: OP-CABLE-ASSEMBLIES
    okpd2: "27.3"
    B_top: 5
    K: RUSSIAN_CABLE_ASSEMBLY_COUNT_DIVIDED_BY_TOTAL_CABLE_ASSEMBLY_COUNT
    formula: "B = B_top × K"
  - id: OP-CHASSIS
    okpd2: "26.20.4"
    B_top: 20
    K: RUSSIAN_CHASSIS_COUNT_DIVIDED_BY_TOTAL_CHASSIS_COUNT
    formula: "B = B_top × K"
  - id: OP-POWER-SUPPLIES
    okpd2: "26.20.40.110"
    B_top: 10
    K: RUSSIAN_POWER_SUPPLY_COUNT_DIVIDED_BY_TOTAL_POWER_SUPPLY_COUNT
    formula: "B = B_top × K"
  - id: OP-BATTERIES
    okpd2: "27.2"
    B_top: 10
    K: RUSSIAN_BATTERY_COUNT_DIVIDED_BY_TOTAL_BATTERY_COUNT
    formula: "B = B_top × K"
  - id: OP-FIRMWARE-WRITE
    requirement: WRITE_FIRMWARE_TO_NONVOLATILE_MEMORY_IN_RUSSIA
    points: 5
    mandatory: true
    no_double_count_rule_footnote_32: true
  - id: OP-ASSEMBLY-TEST-ACCEPTANCE
    requirement: ASSEMBLY_INSTALLATION_FUNCTIONAL_TEST_AND_TECHNICAL_CONTROL_AGAINST_TECHNICAL_CONDITIONS_IN_RUSSIA
    points: 10
    mandatory: true
  - id: OP-MICROCONTROLLER-OR-NPU
    requirement: RUSSIAN_FIRST_OR_SECOND_LEVEL_CENTRAL_MICROCONTROLLER_EXCLUDING_CHIPSET_OR_COMMUNICATION_PROCESSOR
    B_top: 30
    K: QUALIFYING_UNIT_COUNT_DIVIDED_BY_TOTAL_CENTRAL_MICROCONTROLLER_AND_COMMUNICATION_PROCESSOR_COUNT_PER_SPECIFICATION
    formula: "B = B_top × K"
    no_double_count_rule_footnote_32: true
  - id: OP-OTHER-ECB
    requirement: OTHER_RUSSIAN_ELECTRONIC_COMPONENT_BASE
    B_top: 20
    K: RUSSIAN_COMPONENT_TYPENOMINAL_COUNT_DIVIDED_BY_TOTAL_TYPENOMINAL_COUNT_PER_SPECIFICATION
    formula: "B = B_top × K"
    no_double_count_rule_footnote_32: true

module_score_routes:
  - id: MODULE-WITH-CONFIRMATION
    B_i: SCORE_IN_MODULE_PRODUCTION_CONFIRMATION
  - id: MODULE-WITHOUT-CONFIRMATION
    B_i: ACTUAL_OPERATION_SCORE
    condition: MODULE_SCORE_MUST_MEET_ITS_OWN_MINIMUM_RECOGNITION_THRESHOLD
  - id: LEGACY-MODULE-CONFIRMATION-WITHOUT-SCORING
    B_i: 50

