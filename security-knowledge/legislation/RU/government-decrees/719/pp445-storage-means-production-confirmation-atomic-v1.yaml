schema_version: "1.0"
id: RU-PP719-PP445-STORAGE-MEANS-PRODUCTION-CONFIRMATION-ATOMIC-V1
title: "ПП РФ № 719: реестровое подтверждение производства средств хранения для ПП № 445"
checked_at: "2026-08-27"
status: VERIFIED_CURRENT_REGISTRY_AND_LINKED_STORAGE_SYSTEM_PRODUCT_REQUIREMENTS_LIVE_RECORD_PENDING
scope: >-
  Действующий общий маршрут подтверждения производства российской промышленной
  продукции и ведения реестра по ПП РФ № 719 применительно только к проверке
  пункта 4(1) Правил ПП РФ № 445. Точные требования раздела IX для систем
  хранения вынесены в связанную модель; настоящая модель не подтверждает
  конкретное изделие и не заменяет проверку живой реестровой записи на дату
  установки.

