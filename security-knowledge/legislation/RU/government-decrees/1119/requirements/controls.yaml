document: DOC-RU-PP-1119
status: PROPOSED
requirements:
  - id: SEC-REQ-RU-PP1119-P2
    source: 'p.2'
    subject: operator
    obligation: 'Обеспечить безопасность ПДн системой защиты, нейтрализующей актуальные угрозы.'
    domains: [threat_management, security_controls]
  - id: SEC-REQ-RU-PP1119-P3
    source: 'p.3'
    subject: [operator, authorized_processor]
    obligation: 'Обеспечить безопасность ПДн при обработке в ИСПДн; договор с уполномоченным лицом должен закреплять соответствующую обязанность.'
    domains: [third_party_security, contracts]
  - id: SEC-REQ-RU-PP1119-P4
    source: 'p.4'
    subject: operator
    obligation: 'Выбирать СЗИ в соответствии с НПА ФСБ и ФСТЭК, принятыми во исполнение ч.4 ст.19 152-ФЗ.'
    domains: [approved_security_tools, fstec, fsb]
  - id: SEC-REQ-RU-PP1119-P7
    source: 'p.7'
    subject: operator
    obligation: 'Определять тип актуальных угроз с учетом оценки возможного вреда и применимых НПА.'
    domains: [threat_modeling, risk_assessment]
  - id: SEC-REQ-RU-PP1119-P13-A
    source: 'p.13(a)'
    applies_to: [UZ4, UZ3, UZ2, UZ1]
    obligation: 'Организовать режим безопасности помещений ИСПДн, исключающий неконтролируемое проникновение или пребывание лиц без права доступа.'
    domains: [physical_security, access_control]
  - id: SEC-REQ-RU-PP1119-P13-B
    source: 'p.13(b)'
    applies_to: [UZ4, UZ3, UZ2, UZ1]
    obligation: 'Обеспечить сохранность носителей персональных данных.'
    domains: [media_security]
  - id: SEC-REQ-RU-PP1119-P13-C
    source: 'p.13(c)'
    applies_to: [UZ4, UZ3, UZ2, UZ1]
    obligation: 'Утвердить руководителем перечень лиц, которым доступ к ПДн необходим для выполнения служебных обязанностей.'
    domains: [access_governance, documentation]
  - id: SEC-REQ-RU-PP1119-P13-D
    source: 'p.13(d)'
    applies_to: [UZ4, UZ3, UZ2, UZ1]
    obligation: 'Использовать СЗИ, прошедшие оценку соответствия, когда это необходимо для нейтрализации актуальных угроз.'
    domains: [approved_security_tools, certification]
  - id: SEC-REQ-RU-PP1119-P14
    source: 'p.14'
    applies_to: [UZ3, UZ2, UZ1]
    obligation: 'Назначить должностное лицо, ответственное за обеспечение безопасности ПДн в ИСПДн.'
    domains: [governance, roles]
  - id: SEC-REQ-RU-PP1119-P15
    source: 'p.15'
    applies_to: [UZ2, UZ1]
    obligation: 'Ограничить доступ к содержанию электронного журнала сообщений только работниками, которым эти сведения необходимы для служебных обязанностей.'
    domains: [logging, access_control]
  - id: SEC-REQ-RU-PP1119-P16-A
    source: 'p.16(a)'
    applies_to: [UZ1]
    obligation: 'Автоматически регистрировать в журнале безопасности изменения полномочий сотрудников по доступу к ПДн.'
    domains: [logging, iam, audit]
  - id: SEC-REQ-RU-PP1119-P16-B
    source: 'p.16(b)'
    applies_to: [UZ1]
    obligation: 'Создать структурное подразделение, ответственное за безопасность ПДн, либо возложить эти функции на существующее подразделение.'
    domains: [governance, organization]
  - id: SEC-REQ-RU-PP1119-P17
    source: 'p.17'
    subject: [operator, authorized_processor]
    obligation: 'Организовывать контроль выполнения требований самостоятельно и/или с привлечением лицензированных лиц; проводить контроль не реже одного раза в 3 года.'
    domains: [audit, compliance, licensing]
