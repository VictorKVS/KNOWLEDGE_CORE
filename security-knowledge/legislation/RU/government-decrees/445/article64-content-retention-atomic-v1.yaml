  - id: PP445-R011
    locator: "Правила, пункт 6, абзац 1"
    actors: [COMMUNICATIONS_OPERATOR]
    rule: FROM_2018_10_01_POINT6_SERVICES_STORE_FULL_VOLUME_WITH_INITIAL_CAPACITY_EQUAL_TO_PRECEDING_30_DAYS_MESSAGE_VOLUME
  - id: PP445-R012
    locator: "Правила, пункт 6, абзац 2"
    actors: [COMMUNICATIONS_OPERATOR]
    rule: INCREASE_STORAGE_CAPACITY_ANNUALLY_BY_15_PERCENT_FOR_FIVE_YEARS_FROM_COMMISSIONING
