  - id: PP445-R015
    locator: "Правила, пункт 8"
    actors: [COMMUNICATIONS_OPERATOR]
    rule: DELETE_MESSAGES_AUTOMATICALLY_UNDER_SOFTWARE_ALGORITHMS_AND_TECHNICAL_REQUIREMENTS_USING_SIX_MONTH_MAXIMUM_FROM_END_OF_RELEVANT_ACTION
  - id: PP445-R016
    locator: "ПП № 1066, изменения, пункт 1(a)"
    from: "2026-09-01"
    rule: POINT5_DATA_TRANSMISSION_SCOPE_NO_LONGER_LIMITED_TO_VOICE_PURPOSE
  - id: PP445-R017
