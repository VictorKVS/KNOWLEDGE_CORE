temporal_model:
  - id: PP445_CURRENT_SCOPE
    as_of: "2026-08-27"
    through: "2026-08-31"
    status: CURRENT_AS_OF_2026_08_27
    note: >-
      Дата редакции 28.03.2022 не превращена в неподтвержденную дату ее
      вступления в силу; более ранние редакции не атомизированы этой моделью.
  - id: PP1066_FUTURE_SCOPE
    from: "2026-09-01"
    status: REGISTERED_NOT_YET_EFFECTIVE
    changes:
      - PP445_POINT5_REMOVE_FOR_VOICE_PURPOSE_LIMITATION
      - PP445_POINT6_REMOVE_DATA_TRANSMISSION_FOR_VOICE_EXCEPTION
    note: >-
      После удаления слов оба пункта охватывают услуги передачи данных.
      Источник не задает правило устранения этого перекрытия, поэтому модель
      сохраняет оба маршрута и не выбирает один из них по догадке.
  - id: PP445_HISTORICAL_P6_ZERO_VOLUME
    from: "2018-07-01"
    through: "2018-09-30"
    applies_to: PP445_POINT6_SERVICE_SCOPE_AT_RELEVANT_DATE
    volume: ZERO
  - id: PP445_P6_CAPACITY_ROUTE
    from: "2018-10-01"
    applies_to: PP445_POINT6_SERVICE_SCOPE_AT_RELEVANT_DATE
    initial_capacity_reference: PRECEDING_30_DAYS_MESSAGE_VOLUME
    annual_capacity_increase_percent: 15
    annual_increase_duration_years: 5
    increase_start: COMMISSIONING_DATE
    note: >-
      Пять лет — длительность наращивания емкости конкретного введенного в
      эксплуатацию средства, а не срок хранения сообщения и не единая
      календарная дата завершения для всех операторов.

