schema_version: "1.0"
document_ref: SEC-SRC-RU-FZ-98
status: PROPOSED_EXTRACTION
requirements:
  - id: SEC-REQ-RU-98FZ-A10-P1-I1
    source_anchor: "статья 10, часть 1, пункт 1"
    type: obligation
    subject: [commercial_secret_holder]
    action: "определить перечень информации, составляющей коммерческую тайну"
    domains: [information_classification, commercial_secret]
    verification_state: PROPOSED

  - id: SEC-REQ-RU-98FZ-A10-P1-I2
    source_anchor: "статья 10, часть 1, пункт 2"
    type: obligation
    subject: [commercial_secret_holder]
    action: "ограничить доступ к коммерческой тайне путем установления порядка обращения с информацией и контроля соблюдения порядка"
    domains: [access_control, information_governance]
    verification_state: PROPOSED

  - id: SEC-REQ-RU-98FZ-A10-P1-I3
    source_anchor: "статья 10, часть 1, пункт 3"
    type: obligation
    subject: [commercial_secret_holder]
    action: "вести учет лиц, получивших доступ к информации, составляющей коммерческую тайну, и/или лиц, которым она была предоставлена или передана"
    domains: [access_accountability, logging, commercial_secret]
    verification_state: PROPOSED

  - id: SEC-REQ-RU-98FZ-A10-P1-I4
    source_anchor: "статья 10, часть 1, пункт 4"
    type: obligation
    subject: [commercial_secret_holder]
    action: "регулировать использование коммерческой тайны работниками и контрагентами договорными средствами"
    domains: [personnel_security, vendor_security, contracts]
    verification_state: PROPOSED

  - id: SEC-REQ-RU-98FZ-A10-P1-I5
    source_anchor: "статья 10, часть 1, пункт 5"
    type: obligation
    subject: [commercial_secret_holder]
    action: "маркировать материальные носители или реквизиты документов грифом 'Коммерческая тайна' с указанием обладателя"
    domains: [information_marking, document_control]
    verification_state: PROPOSED

  - id: SEC-REQ-RU-98FZ-A11-P1
    source_anchor: "статья 11, часть 1"
    type: obligation_group
    subject: [employer]
    action: "обеспечить установленный законом организационный режим охраны коммерческой тайны в трудовых отношениях, включая ознакомление работника и создание условий соблюдения режима"
    domains: [personnel_security, awareness, commercial_secret]
    verification_state: PROPOSED

notes:
  - "Article 10 is a high-value control source because the law enumerates minimum measures for establishing the commercial-secret regime."
  - "Technical protection is permitted as an additional measure under article 10 part 4; it is not a substitute for the mandatory organizational measures listed in part 1."
