schema_version: "1.0"
id: SEC-MAP-RU-KOAP-INFOSEC
kind: legal-liability-map
status: PROPOSED
source_ref: SEC-SRC-RU-CODE-KOAP
purpose: "Security-focused map of administrative liability linked to substantive security requirements."

nodes:
  - id: SEC-LIAB-RU-KOAP-13-11
    article: "13.11"
    topic: violations_of_personal_data_legislation
    relation_targets:
      - SEC-SRC-RU-FZ-152
      - personal_data
      - privacy
      - incident_notification
      - localization
    source_supported_points:
      - "Часть 1 охватывает обработку персональных данных вне предусмотренных законом случаев либо несовместимую с целями сбора, если отсутствует уголовно наказуемое деяние."
      - "Часть 8 предусматривает ответственность за невыполнение требования о локализации операций с персональными данными граждан РФ в базах данных на территории РФ."
      - "Часть 10 предусматривает ответственность за невыполнение или несвоевременное уведомление уполномоченного органа о намерении осуществлять обработку персональных данных."
      - "Часть 11 предусматривает ответственность за невыполнение или несвоевременное уведомление уполномоченного органа об инциденте неправомерной или случайной передачи/доступа к персональным данным, повлекшем нарушение прав субъектов."
    extraction_state: seed_extracted

review_queue:
  - "Atomize all parts and notes of article 13.11, including subject-specific definitions and repeated-offence branches."
  - "Search and atomize other Chapter 13 provisions relevant to information protection, restricted information and communications."
  - "Map every liability node to the substantive SEC-REQ that creates the underlying duty."

rules:
  - "Administrative sanctions are consequences, not preventive controls."
  - "Penalty amounts and applicability conditions must retain effective-date/version context."
  - "A liability mapping does not prove that the referenced substantive requirement applies to a specific organization."
