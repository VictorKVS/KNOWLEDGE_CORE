applicability_guardrails:
  - >-
    Source registration must not be interpreted as proof that every listed order applies to every CII subject;
    scope must be resolved against 187-FZ, object significance, organization role and the order text.
  - >-
    Do not copy deadlines from superseded FSB orders into the 2025 source stack. Exact deadlines require
    clause-level extraction from the current act and explicit transition/supersession analysis.
  - >-
    Publication/registration metadata is not sufficient to claim an operative deadline, response SLA,
    technical configuration or reporting format.

