red_team_notes:
  - The consolidated source is authoritative but not the official publication portal; promotion to highest evidence tier remains pending primary-source/version-chain capture.
  - Article 22 part 2 exceptions must be evaluated before treating notification duty as unconditional.
  - Article 21 destruction deadlines contain statutory exceptions; implementations must preserve exception logic.
  - KoAP sanction mapping is intentionally not asserted in this file until exact current offence parts are separately verified.
