schema_version: 1
document: RU_FZ_152_2006
source_title: Federal Law No. 152-FZ On Personal Data
edition:
  revision_date: 2026-07-26
  effective_from: 2026-07-26
  status: CURRENT_AS_CHECKED_2026-08-13
source:
  authority_class: AUTHORITATIVE_CONSOLIDATED_LEGAL_TEXT
  provider: Kontur.Normativ
  url: https://normativ.kontur.ru/document?documentId=507366&moduleId=1
  checked_at: 2026-08-13
scope: core operator duties from Articles 18.1, 19, 21, 22 and 22.1
requirements:
  - id: RU-FZ152-A18_1-C1-R01
    verification: VERIFIED
    source_locator: Article 18.1 part 1
    source_quote: "Оператор обязан принимать меры, необходимые и достаточные для обеспечения выполнения обязанностей"
    actor: PERSONAL_DATA_OPERATOR
    obligation: establish measures necessary and sufficient to fulfill statutory personal-data duties
    evidence:
      - approved compliance measure register
      - applicability assessment
      - implementation evidence
  - id: RU-FZ152-A18_1-C1-P1-R01
    verification: VERIFIED
    source_locator: Article 18.1 part 1 item 1
    source_quote: "назначение оператором, являющимся юридическим лицом, ответственного за организацию обработки персональных данных"
    actor: PERSONAL_DATA_OPERATOR_LEGAL_ENTITY
    obligation: appoint a person responsible for organization of personal-data processing
    evidence:
      - appointment order
      - job description
      - acknowledgement record
  - id: RU-FZ152-A18_1-C1-P2-R01
    verification: VERIFIED
    source_locator: Article 18.1 part 1 item 2
    source_quote: "издание оператором, являющимся юридическим лицом, документов, определяющих политику оператора"
    actor: PERSONAL_DATA_OPERATOR_LEGAL_ENTITY
    obligation: issue personal-data policy and local acts covering processing purposes, data and subject categories, methods, retention and destruction
    evidence:
      - personal-data policy
      - local processing regulations
      - retention and destruction rules
  - id: RU-FZ152-A18_1-C1-P4-R01
    verification: VERIFIED
    source_locator: Article 18.1 part 1 item 4
    source_quote: "осуществление внутреннего контроля и (или) аудита соответствия обработки персональных данных"
    actor: PERSONAL_DATA_OPERATOR
    obligation: perform internal control and/or audit of personal-data processing compliance
    evidence:
      - audit plan
      - audit report
      - remediation register
  - id: RU-FZ152-A18_1-C1-P5-R01
    verification: VERIFIED
    source_locator: Article 18.1 part 1 item 5
    source_quote: "оценка вреда в соответствии с требованиями, установленными уполномоченным органом"
    actor: PERSONAL_DATA_OPERATOR
    obligation: assess potential harm to data subjects and correlate it with adopted compliance measures
    evidence:
      - harm assessment
      - risk-to-measures rationale
  - id: RU-FZ152-A18_1-C2-R01
    verification: VERIFIED
    source_locator: Article 18.1 part 2
    source_quote: "Оператор обязан опубликовать или иным образом обеспечить неограниченный доступ к документу"
    actor: PERSONAL_DATA_OPERATOR
    obligation: provide unrestricted access to the personal-data processing policy and information on implemented protection requirements; publish online where data is collected online
    evidence:
      - public policy URL
      - website publication snapshot
      - publication change log
  - id: RU-FZ152-A19-C1-R01
    verification: VERIFIED
    source_locator: Article 19 part 1
    source_quote: "обязан принимать необходимые правовые, организационные и технические меры"
    actor: PERSONAL_DATA_OPERATOR
    obligation: take or ensure legal, organizational and technical measures protecting personal data against unlawful or accidental actions
    evidence:
      - security measures matrix
      - implemented controls evidence
      - effectiveness assessment
  - id: RU-FZ152-A19-C2-P1-R01
    verification: VERIFIED
    source_locator: Article 19 part 2 item 1
    source_quote: "определением угроз безопасности персональных данных при их обработке в информационных системах"
    actor: PERSONAL_DATA_OPERATOR
    obligation: determine personal-data security threats for processing in personal-data information systems
    evidence:
      - threat model
      - threat applicability rationale
      - approval record
  - id: RU-FZ152-A19-C2-P4-R01
    verification: VERIFIED
    source_locator: Article 19 part 2 item 4
    source_quote: "оценкой эффективности принимаемых мер по обеспечению безопасности персональных данных до ввода"
    actor: PERSONAL_DATA_OPERATOR
    obligation: assess effectiveness of security measures before commissioning a personal-data information system
    trigger: BEFORE_ISPDN_COMMISSIONING
    evidence:
      - security effectiveness assessment report
      - commissioning package
  - id: RU-FZ152-A21-C3-R01
    verification: VERIFIED
    source_locator: Article 21 part 3
    source_quote: "в срок, не превышающий трех рабочих дней с даты этого выявления"
    actor: PERSONAL_DATA_OPERATOR
    trigger: UNLAWFUL_PERSONAL_DATA_PROCESSING_IDENTIFIED
    obligation: stop or ensure cessation of unlawful processing
    deadline:
      value: 3
      unit: WORKING_DAYS
      starts_from: date_of_detection
    evidence:
      - detection timestamp
      - processing-block record
      - remediation evidence
  - id: RU-FZ152-A21-C3-R02
    verification: VERIFIED
    source_locator: Article 21 part 3
    source_quote: "в срок, не превышающий десяти рабочих дней с даты выявления неправомерной обработки"
    actor: PERSONAL_DATA_OPERATOR
    trigger: LAWFULNESS_CANNOT_BE_RESTORED
    obligation: destroy or ensure destruction of unlawfully processed personal data
    deadline:
      value: 10
      unit: WORKING_DAYS
      starts_from: date_of_detection
    evidence:
      - destruction act
      - destruction confirmation
      - incident/remediation record
  - id: RU-FZ152-A21-C3_1-P1-R01
    verification: VERIFIED
    source_locator: Article 21 part 3.1 item 1
    source_quote: "в течение двадцати четырех часов о произошедшем инциденте"
    actor: PERSONAL_DATA_OPERATOR
    trigger: PERSONAL_DATA_INCIDENT_ESTABLISHED
    obligation: notify the authorized personal-data authority of the incident and prescribed initial information
    deadline:
      value: 24
      unit: HOURS
      starts_from: moment_of_incident_detection
    evidence:
      - detection timestamp
      - initial notification
      - submission receipt
      - appointed liaison details
  - id: RU-FZ152-A21-C3_1-P2-R01
    verification: VERIFIED
    source_locator: Article 21 part 3.1 item 2
    source_quote: "в течение семидесяти двух часов о результатах внутреннего расследования"
    actor: PERSONAL_DATA_OPERATOR
    trigger: PERSONAL_DATA_INCIDENT_ESTABLISHED
    obligation: notify the authorized personal-data authority of internal investigation results and responsible persons where known
    deadline:
      value: 72
      unit: HOURS
      starts_from: moment_of_incident_detection
    evidence:
      - investigation report
      - follow-up notification
      - submission receipt
  - id: RU-FZ152-A21-C4-R01
    verification: VERIFIED
    source_locator: Article 21 part 4
    source_quote: "в срок, не превышающий тридцати дней с даты достижения цели обработки"
    actor: PERSONAL_DATA_OPERATOR
    trigger: PROCESSING_PURPOSE_ACHIEVED
    obligation: cease processing and destroy personal data unless a statutory or contractual exception applies
    deadline:
      value: 30
      unit: CALENDAR_DAYS
      starts_from: date_processing_purpose_achieved
    evidence:
      - purpose-closure record
      - destruction act or exception rationale
  - id: RU-FZ152-A21-C6-R01
    verification: VERIFIED
    source_locator: Article 21 part 6
    source_quote: "обеспечивает уничтожение персональных данных в срок не более чем шесть месяцев"
    actor: PERSONAL_DATA_OPERATOR
    trigger: DESTRUCTION_NOT_POSSIBLE_WITHIN_PRIMARY_DEADLINE
    obligation: block the data and ensure destruction within the fallback period unless another federal-law term applies
    deadline:
      value: 6
      unit: MONTHS
      starts_from: primary_destruction_deadline_context
    evidence:
      - blocking record
      - destruction plan
      - final destruction confirmation
  - id: RU-FZ152-A22-C1-R01
    verification: VERIFIED
    source_locator: Article 22 part 1
    source_quote: "Оператор до начала обработки персональных данных обязан уведомить уполномоченный орган"
    actor: PERSONAL_DATA_OPERATOR
    trigger: BEFORE_PERSONAL_DATA_PROCESSING_STARTS
    obligation: notify the authorized authority of intended personal-data processing unless a part 2 exception applies
    deadline:
      relation: BEFORE_TRIGGER_COMPLETES
    evidence:
      - notification
      - submission receipt
      - exception rationale if notification not required
  - id: RU-FZ152-A22-C7-R01
    verification: VERIFIED
    source_locator: Article 22 part 7 sentence 1
    source_quote: "не позднее 15-го числа месяца, следующего за месяцем, в котором возникли такие изменения"
    actor: PERSONAL_DATA_OPERATOR
    trigger: REGISTERED_OPERATOR_INFORMATION_CHANGED
    obligation: notify the authorized authority of all changes to information specified in Article 22 part 3
    deadline:
      rule: BY_DAY_15_OF_FOLLOWING_MONTH
    evidence:
      - change register
      - change notification
      - submission receipt
  - id: RU-FZ152-A22-C7-R02
    verification: VERIFIED
    source_locator: Article 22 part 7 sentence 2
    source_quote: "в течение десяти рабочих дней с даты прекращения обработки персональных данных"
    actor: PERSONAL_DATA_OPERATOR
    trigger: PERSONAL_DATA_PROCESSING_TERMINATED
    obligation: notify the authorized authority of termination of processing
    deadline:
      value: 10
      unit: WORKING_DAYS
      starts_from: processing_termination_date
    evidence:
      - termination decision
      - termination notification
      - submission receipt
  - id: RU-FZ152-A22_1-C1-R01
    verification: VERIFIED
    source_locator: Article 22.1 part 1
    source_quote: "Оператор, являющийся юридическим лицом, назначает лицо, ответственное за организацию обработки"
    actor: PERSONAL_DATA_OPERATOR_LEGAL_ENTITY
    obligation: appoint the person responsible for organization of personal-data processing
    evidence:
      - appointment order
      - responsibility matrix
