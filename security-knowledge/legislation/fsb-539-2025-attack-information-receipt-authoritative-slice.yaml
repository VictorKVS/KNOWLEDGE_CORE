schema_version: "1.0"
id: fsb-539-2025-attack-information-receipt-authoritative-slice
checked_at: "2026-08-14"
status: AUTHORITATIVE_VERIFIED_PRIMARY_SNAPSHOT_PENDING
source:
  act: "Приказ ФСБ России от 23.12.2025 № 539"
  registration_number: "84782"
  official_publication_number: "0001202512260014"
  official_publication_date: "2025-12-26"
  effective_date: "2026-01-30"
  official_url: "https://publication.pravo.gov.ru/document/0001202512260014"
  fsb_nkcki_registry_url: "https://cert.gov.ru/materialy/pravovye-osnovaniya/"
  authoritative_text_url: "https://base.garant.ru/413368128/"
  provenance_level: AUTHORITATIVE_TEXT_VERIFIED
  primary_snapshot_status: PENDING_IMMUTABLE_HASH_PINNED_COPY

scope:
  applies_to: "субъекты критической информационной инфраструктуры Российской Федерации"
  subject_matter: >-
    Получение информации о средствах и способах проведения компьютерных атак
    и о методах их предупреждения и обнаружения.

rules:
  - id: FSB539-R01
    locator: "Порядок, п. 1"
    status: AUTHORITATIVE_VERIFIED
    actor: CII_SUBJECT
    obligation: MUST_RECEIVE_ATTACK_INFORMATION
    normalized_rule: >-
      Субъект КИИ обязан получать информацию о средствах и способах проведения
      компьютерных атак и о методах их предупреждения и обнаружения предусмотренными
      Порядком каналами.
    evidence: "authoritative consolidated text, p.1"

  - id: FSB539-R02
    locator: "Порядок, пп. 1.1"
    status: AUTHORITATIVE_VERIFIED
    actor: CII_SUBJECT
    action: USE_CERT_GOV_RU
    normalized_rule: >-
      Одним из предусмотренных способов получения информации является обращение
      к официальному сайту cert.gov.ru.

  - id: FSB539-R03
    locator: "Порядок, пп. 1.2"
    status: AUTHORITATIVE_VERIFIED
    actor: CII_SUBJECT
    action: SEND_REQUEST_TO_NKCKI
    primary_channel: NKCKI_TECHNICAL_INFRASTRUCTURE
    fallback_condition: NO_CONNECTION_TO_NKCKI_TECHNICAL_INFRASTRUCTURE
    fallback_channels:
      - POSTAL_MAIL
      - EMAIL
    normalized_rule: >-
      Запрос в НКЦКИ направляется через техническую инфраструктуру НКЦКИ; при отсутствии
      подключения допускается почтовая или электронная связь по адресам НКЦКИ,
      указанным на cert.gov.ru.

  - id: FSB539-R04
    locator: "Порядок, пп. 1.3"
    status: AUTHORITATIVE_VERIFIED
    actor: CII_SUBJECT
    action: RECEIVE_PROACTIVE_NKCKI_INFORMATION
    normalized_rule: >-
      Порядок прямо предусматривает получение субъектом КИИ соответствующей информации
      от НКЦКИ как отдельный способ получения сведений.

  - id: FSB539-R05
    locator: "Порядок, п. 2"
    status: AUTHORITATIVE_VERIFIED
    actor: NKCKI
    trigger: REQUEST_UNDER_1_2_RECEIVED
    deadline:
      value: 30
      unit: WORKING_DAYS
      starts_from: REQUEST_RECEIPT_DATE
    delivery_when_connected: NKCKI_TECHNICAL_INFRASTRUCTURE
    delivery_when_not_connected:
      - POSTAL_MAIL
      - EMAIL
    normalized_rule: >-
      Ответ на запрос по пп.1.2 предоставляется в срок до 30 рабочих дней со дня
      получения запроса; канал ответа зависит от наличия подключения к технической
      инфраструктуре НКЦКИ.

  - id: FSB539-R06
    locator: "Порядок, п. 3"
    status: AUTHORITATIVE_VERIFIED
    actor: NKCKI
    action: TARGET_INFORMATION_BY_OBJECT_CHARACTERISTICS
    normalized_rule: >-
      НКЦКИ направляет субъектам КИИ информацию с учетом особенностей функционирования
      принадлежащих им на законном основании объектов КИИ.

transition:
  predecessor: "Приказ ФСБ России от 24.07.2018 № 368, приложение № 2"
  predecessor_status: REPEALED
  replacement_effective_date: "2026-01-30"
  verified_change_points:
    - >-
      Старый порядок по приказу №368 предусматривал для запроса в НКЦКИ пятидневный срок ответа;
      действующий приказ №539 устанавливает до 30 рабочих дней. Старый пятидневный срок нельзя
      использовать для событий после 30.01.2026.
    - >-
      Действующий №539 не воспроизводит старый отдельный канал обращений в ФСБ России и запросов
      другим субъектам/иностранным организациям в том же перечне способов; автоматическое
      наследование старого перечня запрещено.

red_team_guardrails:
  - >-
    Срок 30 рабочих дней является сроком предоставления ответа НКЦКИ, а не универсальным
    сроком действия субъекта КИИ и не SLA уведомления об инциденте.
  - >-
    Приказ №539 регулирует получение информации об атаках и методах защиты; он не заменяет
    приказы №547 и №548 о сообщении об инцидентах и непрерывном взаимодействии.
  - >-
    Наличие доступа к cert.gov.ru само по себе не доказывает выполнение иных обязанностей
    субъекта КИИ по 187-ФЗ или ГосСОПКА.
  - >-
    Для событий до 30.01.2026 применяется исторически действовавший стек; №539 не ретроактивен.
  - >-
    Clause-level evidence остается AUTHORITATIVE_VERIFIED, а не PRIMARY_VERIFIED,
    пока в репозитории не сохранена immutable/hash-pinned первичная копия опубликованного акта.

source_notes:
  - "Официальный портал правовой информации подтверждает опубликование №0001202512260014 от 26.12.2025."
  - "НКЦКИ/ФСБ публикует приказ №539 в разделе правовых оснований."
  - "ГАРАНТ и КонсультантПлюс дают согласованный действующий текст приказа и Порядка."
