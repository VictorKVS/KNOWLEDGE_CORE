verification_policy:
  minimum_concordance: 2
  primary_promotion_blocker: "No authenticated primary FSTEC-hosted complete text preserved in corpus."
  interpretation_rule: "Separate mandatory wording (должны/проводится/определяются) from recommendations (рекомендуется/может)."

records:
  - id: FSTEC-MU-2021-3.1
    locator: "3.1"
    status: AUTHORITATIVE_VERIFIED
    rule: "Threat assessment must determine negative consequences that may result from realization or occurrence of information-security threats."
  - id: FSTEC-MU-2021-3.2
    locator: "3.2"
    status: AUTHORITATIVE_VERIFIED
    rule: "Negative-consequence analysis uses threat-bank/models, applicable legal acts, system/network documentation, critical business/process documentation and owner/operator risk-damage assessment results as inputs."
  - id: FSTEC-MU-2021-3.3
    locator: "3.3"
    status: AUTHORITATIVE_VERIFIED
    rule: "Negative consequences are identified as events or groups of events tied to disruption of critical processes and/or information-security violations and resulting harm or risks."
    guardrail: "Do not treat a generic CIA-impact label as sufficient consequence analysis without linking it to affected processes, persons, organization or other protected interests."
  - id: FSTEC-MU-2021-3.4
    locator: "3.4"
    status: AUTHORITATIVE_VERIFIED
    rule: "If owner/operator risk-damage assessment results are absent, possible negative consequences may be determined by expert assessment and/or information from relevant business/profile units or specialists."
    guardrail: "This fallback does not authorize inventing a normative monetary risk formula."

  - id: FSTEC-MU-2021-4.1
    locator: "4.1"
    status: AUTHORITATIVE_VERIFIED
    rule: "Assessment must identify information resources and system/network components whose unauthorized access or impact could cause negative consequences; the set of objects and interfaces defines the assessment/model boundary."
  - id: FSTEC-MU-2021-4.2
    locator: "4.2"
    status: AUTHORITATIVE_VERIFIED
    rule: "Object-identification inputs include threat-bank/models, attack-vector sources, system/network documentation, inventory information and previously determined negative consequences."
  - id: FSTEC-MU-2021-4.3
    locator: "4.3"
    status: AUTHORITATIVE_VERIFIED
    rule: "Potential objects of impact are derived from source analysis and inventory and include information/data plus hardware/software and other relevant system/network components."
  - id: FSTEC-MU-2021-4.4
    locator: "4.4"
    status: AUTHORITATIVE_VERIFIED
    rule: "At creation stage objects are based on intended architecture/conditions; during operation they are based on real architecture/conditions and inventory. Operational inventory is performed using automated tools able to identify components and external/internal interfaces."
  - id: FSTEC-MU-2021-4.5
    locator: "4.5"
    status: AUTHORITATIVE_VERIFIED
    rule: "For identified resources/components, assessment must determine impact types capable of causing negative consequences, including confidentiality leakage/interception, unauthorized access, denial of service and unauthorized modification/substitution/distortion."

  - id: FSTEC-MU-2021-5.1.1
    locator: "5.1.1"
    status: AUTHORITATIVE_VERIFIED
    rule: "Assessment must identify possible anthropogenic threat sources: persons/groups capable of unauthorized access and/or impact on information resources/components; these form candidate actual adversaries."
  - id: FSTEC-MU-2021-5.1.3
    locator: "5.1.3"
    status: AUTHORITATIVE_VERIFIED
    rule: "Actual adversary types are determined from source data and possible attacker goals; multiple adversary types may be relevant for one system/network and sector-specific types may be added."
  - id: FSTEC-MU-2021-5.1.4
    locator: "5.1.4"
    status: AUTHORITATIVE_VERIFIED
    rule: "An adversary is relevant when its possible goals can lead to the determined negative consequences and corresponding risks/damage."
  - id: FSTEC-MU-2021-5.1.5
    locator: "5.1.5"
    status: AUTHORITATIVE_VERIFIED
    rule: "Adversary capability is evaluated from competence, resources/equipment and motivation, with levels N1 basic, N2 enhanced-basic, N3 medium and N4 high; several capability levels may be relevant in one system."
  - id: FSTEC-MU-2021-5.1.6
    locator: "5.1.6"
    status: AUTHORITATIVE_VERIFIED
    rule: "Relevant adversaries must be categorized as external or internal based on rights and conditions of access to protected zones, information resources and components, considering privileges and architecture/operating conditions."
  - id: FSTEC-MU-2021-5.1.7
    locator: "5.1.7"
    status: AUTHORITATIVE_VERIFIED
    rule: "External adversaries realize intentional threats; internal adversaries may realize intentional or unintentional threats, subject to the methodology's conditions."
  - id: FSTEC-MU-2021-5.1.8
    locator: "5.1.8"
    status: AUTHORITATIVE_VERIFIED
    rule: "Where system/network reliability and resilience requirements apply, technogenic sources may additionally be designated as relevant; inclusion of associated threats in the threat model is by owner/operator decision."
    guardrail: "Do not universally force technogenic sources into every threat model."
  - id: FSTEC-MU-2021-5.1.9
    locator: "5.1.9"
    status: AUTHORITATIVE_VERIFIED
    rule: "Source assessment output must identify relevant adversary types/goals/capabilities and adversary categories; deliberate adversaries are assessed assuming elevated motivation, and collusion can aggregate capabilities."

  - id: FSTEC-MU-2021-5.2.1
    locator: "5.2.1"
    status: AUTHORITATIVE_VERIFIED
    rule: "Assessment must identify possible methods by which relevant adversaries can realize threats in the target systems/networks."
  - id: FSTEC-MU-2021-5.2.3
    locator: "5.2.3"
    status: AUTHORITATIVE_VERIFIED
    rule: "A realization method is relevant when adversary capability permits its use and conditions exist or can be created against the identified object of impact; one threat may have multiple realization methods."
    guardrail: "A catalogued technique is not relevant merely because it exists in ATT&CK/CAPEC/BDU."
  - id: FSTEC-MU-2021-5.2.4
    locator: "5.2.4"
    status: AUTHORITATIVE_VERIFIED
    rule: "Use of a realization method depends on the adversary's ability to access applicable object interfaces; interfaces are considered across hardware, system, application and telecommunications levels as relevant."
  - id: FSTEC-MU-2021-5.2.5
    locator: "5.2.5"
    status: AUTHORITATIVE_VERIFIED
    rule: "Creation-stage interface assessment uses intended architecture/conditions; operational assessment additionally uses system/network inventory results."
  - id: FSTEC-MU-2021-5.2.6
    locator: "5.2.6"
    status: AUTHORITATIVE_VERIFIED
    rule: "Method assessment output must identify adversary types/categories able to use relevant methods, the relevant methods themselves and interface types through which they may be realized."

  - id: FSTEC-MU-2021-5.3.3
    locator: "5.3.3"
    status: AUTHORITATIVE_VERIFIED
    rule: "A possible threat is represented by the conjunction of threat source/adversary, object of impact, realization method and negative consequences; absence of a supported element blocks that specific threat construction."
    guardrail: "Do not infer actual relevance from threat name alone."
  - id: FSTEC-MU-2021-5.3.4
    locator: "5.3.4"
    status: AUTHORITATIVE_VERIFIED
    rule: "Threat relevance is determined by existence of realization scenarios linking applicable methods, objects/impacts, adversary capability and accessible interfaces through possible sequences of tactics and techniques."
  - id: FSTEC-MU-2021-5.3.5
    locator: "5.3.5"
    status: AUTHORITATIVE_VERIFIED
    rule: "At creation stage at least one scenario must be determined for each method of each possible threat, for each relevant adversary and capability level; a threat with at least one scenario is treated as relevant and included in the threat model for control/tool selection justification."
  - id: FSTEC-MU-2021-5.3.6
    locator: "5.3.6"
    status: AUTHORITATIVE_VERIFIED
    rule: "During operation, scenario determination uses actual documentation/model/protection measures, inventory, object/interface identification and other operational evidence rather than relying solely on design assumptions."

appendix_mapping:
  - appendix: 3
    status: AUTHORITATIVE_VERIFIED_STRUCTURE
    rule: "Recommended threat-model structure includes general provisions, system/network description, negative consequences, objects/interfaces, threat sources, realization methods and actual threats/scenarios."
  - appendix: 4
    status: AUTHORITATIVE_VERIFIED_REFERENCE
    rule: "Provides risk/damage types and typical negative consequences; examples are reference material, not automatic applicability findings."
  - appendix: 10
    status: AUTHORITATIVE_VERIFIED_REFERENCE
    rule: "Provides examples mapping realization methods to adversary types/capabilities; examples do not replace system-specific assessment."
  - appendix: 11
    status: AUTHORITATIVE_VERIFIED_REFERENCE
    rule: "Provides principal tactics and typical techniques for scenario construction; listed techniques remain inputs to scenario analysis rather than automatic relevance findings."

machine_decision_model:
  threat_candidate_tuple:
    required_elements:
      - source_or_adversary
      - object_of_impact
      - realization_method
      - negative_consequence
  relevance_gate:
    required:
      - supported_candidate_tuple
      - at_least_one_realization_scenario
      - adversary_capability_supports_method
      - required_interface_access_is_possible
    result_if_all_supported: RELEVANT
    result_if_any_material_element_missing: NOT_PROVEN_RELEVANT
  evidence_expectations:
    - architecture_or_inventory_snapshot
    - object_and_interface_inventory
    - negative_consequence_or_risk_basis
    - adversary_type_and_capability_rationale
    - realization_method_mapping
    - scenario_or_attack_path
    - BDU_or_other_source_snapshot_identity_where_used

red_team_guardrails:
  - "Catalog presence does not equal system-specific relevance."
  - "Example appendices are not universal mandatory mappings."
  - "Technogenic-source inclusion under 5.1.8 is conditional and may depend on owner/operator decision."
  - "Creation-stage assumptions must be replaced/rechecked against real architecture and inventory in operation."
  - "Do not claim PRIMARY_VERIFIED until authenticated primary full text is preserved."

open_gaps:
  - "Authenticated primary FSTEC-hosted or otherwise authenticated official complete text."
  - "Full atomization of remaining subclauses and appendix tables, especially detailed capability/interface/tactic matrices."
  - "Immutable BDU snapshot implementation and machine-verifiable source hashes."
  - "Regression cases proving RELEVANT vs NOT_PROVEN_RELEVANT decisions against representative architectures."

promotion_decision:
  family_promotion: false
  reason: "Decision logic is materially more complete but primary provenance, complete matrices and reproducible regression evidence are still missing."
