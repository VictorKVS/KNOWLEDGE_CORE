red_team_blocks:
  - Primary authenticated full text of the FSTEK threat methodology remains required for PRIMARY_VERIFIED promotion.
  - BDU and BDU ASU TP are dynamic; every consumed record needs observed_at and stable identifier.
  - Catalog presence does not prove threat relevance to a specific system.
  - Observation-only snapshot ids are adequate for bounded regression traceability but do not substitute for raw immutable byte snapshots/digests.
