verification_policy:
  rule: "Records below require concordance across at least two authoritative consolidated texts."
  promotion_blocker: "Primary FSTEC-hosted full text or independently authenticated official copy remains unresolved."

records:
  - id: FSTEC-MU-2021-1.2
    locator: "1.2"
    status: AUTHORITATIVE_VERIFIED
    rule: "The methodology defines the order and content of work for identifying information-security threats and developing threat models for systems and networks."
    evidence: "Consultant + Garant concordance"
  - id: FSTEC-MU-2021-1.3
    locator: "1.3"
    status: AUTHORITATIVE_VERIFIED
    rule: "The methodology applies to state/municipal information systems, personal-data information systems, significant CII objects and listed industrial/control-system classes; other systems may apply it by operator/owner decision."
    guardrail: "Do not infer mandatory applicability outside the classes expressly covered by the methodology or another binding rule."
    evidence: "Consultant + Garant concordance"
  - id: FSTEC-MU-2021-1.3-SECTOR
    locator: "1.3 paragraph 3"
    status: AUTHORITATIVE_VERIFIED
    rule: "Sectoral, departmental and corporate threat-assessment methodologies must not contradict this methodology."
    evidence: "Consultant + Garant concordance"
  - id: FSTEC-MU-2021-1.8
    locator: "1.8"
    status: AUTHORITATIVE_VERIFIED
    rule: "The methodology applies both to newly created/modernized systems and to systems already in operation."
    evidence: "Consultant + Garant concordance"
  - id: FSTEC-MU-2021-1.8-LEGACY
    locator: "1.8 paragraphs 2-3"
    status: AUTHORITATIVE_VERIFIED
    rule: "Threat models approved before 2021 continue to operate, but must be changed under the 2021 methodology when the corresponding system/network is developed or modernized; the older FSTEC 2008 PD threat method and 2007 key-system method are not used for new threat assessment under this methodology."
    evidence: "Consultant + Garant concordance"
  - id: FSTEC-MU-2021-2.1
    locator: "2.1"
    status: AUTHORITATIVE_VERIFIED
    rule: "Threat assessment aims to determine threats possible for the actual or planned architecture and operating conditions of the system/network."
    evidence: "Consultant + Garant concordance"
  - id: FSTEC-MU-2021-2.2
    locator: "2.2"
    status: AUTHORITATIVE_VERIFIED
    rule: "The assessment must cover negative consequences, asset/object inventory, threat sources and adversary capabilities, implementation methods, likelihood/possibility and relevance, and threat scenarios."
    evidence: "Consultant + Garant concordance"
  - id: FSTEC-MU-2021-2.3
    locator: "2.3"
    status: AUTHORITATIVE_VERIFIED
    rule: "Required input data include the FSTEC threat bank and FSTEC/sector models, attack-pattern sources, system documentation, cloud/DC agreements where applicable, applicable Russian legal acts, business/process documentation and risk/damage assessment results."
    guardrail: "BDU presence is input evidence, not automatic proof that a threat is relevant to a specific system."
    evidence: "Consultant + Garant concordance"
  - id: FSTEC-MU-2021-2.4
    locator: "2.4"
    status: AUTHORITATIVE_VERIFIED
    rule: "Threat assessment is systematic and must be performed during system creation and throughout operation, including development/modernization."
    evidence: "Consultant + Garant concordance"
  - id: FSTEC-MU-2021-2.5
    locator: "2.5"
    status: AUTHORITATIVE_VERIFIED
    rule: "At creation stage assessment uses the intended architecture and operating conditions; during operation it uses the real architecture/conditions and may rely on inventory, vulnerability analysis, penetration testing and other security-assessment methods."
    guardrail: "Penetration testing is one possible source of operational evidence, not a universal mandatory test in every system."
    evidence: "Consultant + Garant concordance"
  - id: FSTEC-MU-2021-2.6
    locator: "2.6"
    status: AUTHORITATIVE_VERIFIED
    rule: "Assessment results must identify relevant threats; at creation stage they support selection of organizational/technical controls and security-tool capabilities, while in operation they support effectiveness assessment of implemented measures."
    evidence: "Consultant + Garant concordance"
  - id: FSTEC-MU-2021-2.7
    locator: "2.7"
    status: AUTHORITATIVE_VERIFIED
    rule: "Threat assessment is performed by the information-security function or designated security specialists with participation of operational/IT and relevant business units; external specialists may be engaged where legally permitted."
    evidence: "Consultant + Garant concordance"
  - id: FSTEC-MU-2021-2.8
    locator: "2.8"
    status: AUTHORITATIVE_VERIFIED
    rule: "The methodology uses an expert method and recommends an expert group to reduce subjective factors."
    guardrail: "Expert-group formation is a recommendation, not an absolute mandatory requirement in every case."
    evidence: "Consultant + Garant concordance"
  - id: FSTEC-MU-2021-5.3.1
    locator: "5.3.1"
    status: AUTHORITATIVE_VERIFIED
    rule: "Assessment must determine possible threats and evaluate their relevance for the specific systems and networks."
    evidence: "Kontur + Consultant concordance"

red_team_guardrails:
  - "Do not treat a BDU record as automatically relevant without system-specific applicability analysis."
  - "Do not convert recommendations (for example, expert-group formation) into mandatory obligations."
  - "Do not claim PRIMARY_VERIFIED until an authenticated primary full-text copy is preserved."
  - "Do not reuse the superseded 2008/2007 methodologies as the current general assessment method where the 2021 methodology governs."

open_gaps:
  - "Primary FSTEC-hosted or otherwise authenticated official full-text copy."
  - "Clause-level atomization of sections 3, 4 and 5.1-5.3 plus appendices."
  - "Formal mapping of methodology steps to BDU immutable snapshots and threat-model evidence artifacts."

promotion_decision:
  family_promotion: false
  reason: "A bounded authoritative clause slice is now verified, but primary-copy provenance and the complete methodology decision logic remain open."
