document:
  title: "Методический документ. Методика оценки угроз безопасности информации"
  authority: "ФСТЭК России"
  approved_date: "2021-02-05"
  effective_date: "2021-02-05"
  primary_publication_status: "No official primary full-text copy was confirmed in this verification run; do not label these records PRIMARY_VERIFIED."

source_hierarchy:
  - id: consultant
    class: AUTHORITATIVE_CONSOLIDATED_LEGAL_TEXT
    url: "https://www.consultant.ru/document/cons_doc_LAW_378330/"
    verified_at: "2026-08-13"
  - id: garant
    class: AUTHORITATIVE_CONSOLIDATED_LEGAL_TEXT
    url: "https://base.garant.ru/400425044/"
    verified_at: "2026-08-13"
  - id: kontur
    class: AUTHORITATIVE_CONSOLIDATED_LEGAL_TEXT
