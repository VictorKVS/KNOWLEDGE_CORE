red_team_blocks:
  - Do not invent a universal numeric risk formula where a source does not prescribe one.
  - Risk acceptance criteria must be separated from risk-estimation methodology and traced to organizational authority.
  - GOST status metadata does not substitute for clause-level evidence.
  - NIST/ISO comparison material must never be presented as a mandatory Russian requirement without an incorporation basis.
