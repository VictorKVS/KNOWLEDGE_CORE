koap_13_11_parts_1_9:
  - part: '1'
    trigger: обработка ПДн без предусмотренного законом основания либо несовместимо с целями сбора
    criminal_gate: true
    sanctions:
      citizen_rub: [10000, 15000]
      official_rub: [50000, 100000]
      legal_entity_rub: [150000, 300000]
  - part: '1.1'
    trigger: повторное нарушение части 1
    sanctions:
      citizen_rub: [15000, 30000]
      official_rub: [100000, 200000]
      legal_entity_rub: [300000, 500000]
  - part: '2'
    trigger: отсутствие обязательного письменного согласия либо нарушение требований к его содержанию
    criminal_gate: true
    sanctions:
      citizen_rub: [10000, 15000]
      official_rub: [100000, 300000]
      legal_entity_rub: [300000, 700000]
  - part: '2.1'
    trigger: повторное нарушение части 2
    sanctions:
      citizen_rub: [15000, 30000]
      official_rub: [300000, 500000]
      individual_entrepreneur_rub: [500000, 1000000]
      legal_entity_rub: [1000000, 1500000]
  - part: '3'
    trigger: не опубликована/не обеспечена доступность политики оператора по обработке ПДн или сведений о защите
    sanctions:
      citizen_rub: [1500, 3000]
      official_rub: [6000, 12000]
      individual_entrepreneur_rub: [10000, 20000]
      legal_entity_rub: [30000, 60000]
  - part: '4'
    trigger: не предоставлена субъекту информация об обработке его ПДн
    sanctions:
      citizen_rub: [2000, 4000]
      official_rub: [8000, 12000]
      individual_entrepreneur_rub: [20000, 30000]
      legal_entity_rub: [40000, 80000]
  - part: '5'
    trigger: не выполнено в установленный срок требование об уточнении, блокировании или уничтожении ПДн
    sanctions:
      citizen_rub: [2000, 4000]
      official_rub: [8000, 20000]
      individual_entrepreneur_rub: [20000, 40000]
      legal_entity_rub: [50000, 90000]
  - part: '5.1'
    trigger: повторное нарушение части 5
    sanctions:
      citizen_rub: [20000, 30000]
      official_rub: [30000, 50000]
      individual_entrepreneur_rub: [50000, 100000]
      legal_entity_rub: [300000, 500000]
  - part: '6'
    trigger: при неавтоматизированной обработке не обеспечена сохранность носителей/исключение НСД и наступили указанные последствия
    criminal_gate: true
    sanctions:
      citizen_rub: [1500, 4000]
      official_rub: [8000, 20000]
      individual_entrepreneur_rub: [20000, 40000]
      legal_entity_rub: [50000, 100000]
  - part: '7'
    trigger: гос/муниципальный орган не выполнил обязанность по обезличиванию либо нарушил требования/методы обезличивания
    sanctions:
      official_rub: [6000, 12000]
  - part: '8'
    trigger: локализация баз данных граждан РФ при сборе ПДн не обеспечена
    sanctions:
      citizen_rub: [30000, 50000]
      official_rub: [100000, 200000]
      legal_entity_rub: [1000000, 6000000]
  - part: '9'
    trigger: повторное нарушение части 8
    sanctions:
      citizen_rub: [50000, 100000]
      official_rub: [500000, 800000]
      legal_entity_rub: [6000000, 18000000]

koap_13_11_3:
  - part: '1'
    trigger: нарушение требований при размещении/обновлении биометрических ПДн в ЕБС
    sanctions:
      official_rub: [100000, 300000]
      legal_entity_rub: [500000, 1000000]
  - part: '2'
    trigger: нарушение порядка обработки биометрии/векторов ЕБС либо требований к ИТ и техсредствам для идентификации/аутентификации
    sanctions:
      official_rub: [100000, 300000]
      legal_entity_rub: [500000, 1000000]
  - part: '3'
    trigger: непринятие организационных и технических мер безопасности биометрических ПДн в ЕБС или иных системах аутентификации
    sanctions:
      official_rub: [300000, 500000]
      legal_entity_rub: [1000000, 1500000]
  - part: '4'
    trigger: обработка биометрии/векторов ЕБС для аутентификации без требуемой аккредитации либо при ее приостановлении/прекращении
    sanctions:
      official_rub: [500000, 1000000]
      legal_entity_rub: [1000000, 2000000]

uk_272_1:
  - part: '1'
    trigger: незаконные использование/передача/сбор/хранение компьютерной информации с ПДн, полученной через неправомерный доступ/вмешательство либо иным незаконным путем
    max_imprisonment_years: 4
  - part: '2'
    trigger: то же в отношении ПДн несовершеннолетних, специальных категорий и/или биометрических ПДн
    max_imprisonment_years: 5
  - part: '3'
    qualifiers:
      - корыстная заинтересованность
      - крупный ущерб
      - группа лиц по предварительному сговору
      - использование служебного положения
    max_imprisonment_years: 6
  - part: '4'
    qualifier: трансграничная передача компьютерной информации с ПДн и/или трансграничное перемещение носителей с ПДн
    max_imprisonment_years: 8
  - part: '5'
    qualifiers:
      - тяжкие последствия
      - организованная группа
    max_imprisonment_years: 10
  - part: '6'
    trigger: создание/обеспечение функционирования ресурса, заведомо предназначенного для незаконных хранения/передачи ПДн, полученных незаконным путем
    max_imprisonment_years: 5
  - note: личные и семейные нужды физлица исключены из действия статьи по примечанию 1

guardrails:
  - id: LEG-PDN-GR-001
    rule: части 1, 2 и 6 статьи 13.11 содержат уголовный gate; окончательная административная квалификация невозможна до проверки признаков уголовно наказуемого деяния
  - id: LEG-PDN-GR-002
    rule: факт утечки или большой объем субъектов сам по себе не доказывает состав статьи 272.1 УК РФ
  - id: LEG-PDN-GR-003
    rule: статья 13.11.3 применяется к специальному контуру ЕБС/биометрической аутентификации и не должна заменять общую статью 13.11 без проверки applicability
  - id: LEG-PDN-GR-004
    rule: редакцию кодекса выбирают по дате события; текущий срез нельзя автоматически применять к историческим событиям
  - id: LEG-PDN-GR-005
    rule: штрафные диапазоны и квалифицирующие признаки хранятся отдельно; вычисление санкции не является выводом о виновности

