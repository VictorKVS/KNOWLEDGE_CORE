guards:
  - id: K10-18-G1
    rule: Parts 12-14 explicitly require absence of criminally punishable conduct before administrative finalization.
  - id: K10-18-G2
    rule: Part 11 breach-notification liability is distinct from parts 12-18 liability for the underlying unlawful transfer/access event; both may require separate review.
  - id: K10-18-G3
    rule: Subject-count and identifier-count thresholds are alternative threshold dimensions and must not be merged into one guessed metric.
  - id: K10-18-G4
    rule: Special-category and biometric branches must not be reduced to ordinary volume brackets solely because affected counts are known.
  - id: K10-18-G5
    rule: Turnover sanctions require proof of repeat-offense predicates; a previous security incident alone is not sufficient.
  - id: K10-18-G6
    rule: Article 13.11.3 EBS/biometric-specific violations remain a separate applicability branch from part 17.
  - id: K10-18-G7
    rule: Sanction ranges are candidate legal consequences, not findings of guilt or final sanction calculations.
