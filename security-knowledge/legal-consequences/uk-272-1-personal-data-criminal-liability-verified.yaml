schema_version: 1
document: RU_UK_63_FZ
article: 272.1
title: Illegal use/transfer/collection/storage of computer information containing personal data and illegal data-resource operations
edition:
  revision_checked_at: 2026-08-13
  consolidated_revision_date: 2026-06-10
sources:
  consolidated:
    authority_class: AUTHORITATIVE_CONSOLIDATED_LEGAL_TEXT
    provider: ConsultantPlus
    url: https://www.consultant.ru/document/cons_doc_LAW_10699/deefead19003ba8266e85fbf42fc31f60ed3c698/
  primary_amendment:
    authority_class: OFFICIAL_PUBLICATION
