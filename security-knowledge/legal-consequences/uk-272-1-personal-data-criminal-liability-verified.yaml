scope_notes:
  - Article 272.1 was introduced by Federal Law 421-FZ.
  - This file describes statutory criminal-liability routing only; it does not assert guilt, qualification of a real incident, or expected sentence.
  - Parts must be evaluated against the factual elements of the offense and alongside exclusions/competing qualifications.
liability_records:
  - id: RU-UK-272.1-C1
    verification: VERIFIED
    source_locator: Article 272.1 part 1
    source_quote: "полученной путем неправомерного доступа"
    conduct_summary: illegal use/transfer/collection/storage of computer information containing personal data obtained through unlawful access/interference or otherwise illegally
    maximum_exposure:
      fine_rub: 300000
      compulsory_work_years: 4
      imprisonment_years: 4
  - id: RU-UK-272.1-C2
