exclusions:
  - id: RU-UK-272.1-NOTE1
    verification: VERIFIED
    source_locator: Article 272.1 note 1
    source_quote: "исключительно для личных и семейных нужд"
    rule: article does not apply to personal-data processing by individuals exclusively for personal and family needs
cross_routing:
  - relation: administrative_to_criminal_gate
    source: RU-KOAP-13.11-C12..C14
    rule: KoAP parts 12-14 expressly exclude conduct containing elements of a criminal offense; criminal qualification must be checked before final administrative routing.
  - relation: neighboring_article
    article: 272
    rule: Article 272 part 1 now excludes cases covered by Article 272.1.
  - relation: neighboring_article
    article: 137
    rule: Article 137 part 1 was amended by Federal Law 421-FZ to carve out Article 272.1 cases.
risk_model_guardrails:
  - statutory maximum is legal exposure, not probability-weighted expected loss
  - do not map an incident to a criminal part without factual-element review
  - do not treat cross-border processing itself as criminal; part 4 presupposes conduct covered by earlier parts
  - employee role or access right alone does not establish use_of_official_position or illegality
