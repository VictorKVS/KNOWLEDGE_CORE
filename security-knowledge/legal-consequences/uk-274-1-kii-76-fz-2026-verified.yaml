changes:
  - id: RU-UK-274.1-C2-2026
    verification: VERIFIED
    source_locator: Article 274.1 part 2 as amended by 76-FZ
    normalized_meaning: >
      Unlawful access to protected computer information contained in Russian critical information
      infrastructure is routed under part 2 when the statutory act causes destruction, blocking,
      modification or copying of computer information contained in the CII. The provision also covers
      the use of computer programs or other computer information knowingly intended for unlawful impact
      on CII, or other malicious computer programs, within the statutory wording.
    consequence_type: CRIMINAL_LIABILITY_TRIGGER
    effective_from: 2026-04-20
  - id: RU-UK-274.1-C3-2026
    verification: VERIFIED
    source_locator: Article 274.1 part 3 as amended by 76-FZ
    normalized_meaning: >
      Violation of statutory operating or access rules for protected computer information, systems,
      telecommunications networks, automated control systems or telecommunications networks belonging
      to Russian CII is routed under part 3 when it causes destruction, blocking, modification or copying
      of computer information contained in the CII.
    consequence_type: CRIMINAL_LIABILITY_TRIGGER
    effective_from: 2026-04-20
  - id: RU-UK-274.1-NOTE-2026
    verification: VERIFIED
    source_locator: Note to Article 274.1 added by 76-FZ
    normalized_meaning: >
      A person who committed the offense under part 3 is released from criminal liability if the person
      actively assisted disclosure and/or investigation of the offense, including taking necessary
      measures to preserve traces of unlawful impact on Russian CII, and the person's conduct contains
      no other corpus delicti.
    consequence_type: STATUTORY_RELEASE_FROM_CRIMINAL_LIABILITY
    effective_from: 2026-04-20
operational_implications:
  - id: RU-UK-274.1-EVIDENCE-PRESERVATION-LINK
    classification: LEGAL_CONSEQUENCE_CONTEXT
    statement: >
      Incident-response and evidence-preservation workflows should expose whether traces of unlawful CII
      impact were preserved because the statutory note expressly names preservation of such traces as an
      example of active assistance. This is an operational linkage, not a claim that Article 274.1 itself
      creates a universal standalone evidence-retention control for every CII subject.
  - id: RU-UK-274.1-ROUTING-GUARD
    classification: DECISION_ROUTING_GUARD
    statement: >
      Consequence routing must distinguish administrative/organizational noncompliance from facts that
      satisfy criminal-law elements; the KB must not infer criminal liability merely from a security
      control failure or incident without the statutory elements and competent legal assessment.
notes:
  - "76-FZ changed the consequence wording in parts 2 and 3 from the former generalized harm formulation to enumerated outcomes: destruction, blocking, modification or copying of CII computer information."
  - "The amendment did not justify inferring guilt, causation or criminal responsibility from an audit finding alone."
