routing_guardrails:
  - Article 272.1 is not a generic personal-data penalty; factual acquisition/use/transfer/storage elements must be established.
  - Article 137 concerns private-life information and expressly excludes Article 272.1 cases in part 1.
  - Article 272 requires unlawful access plus specified computer-information consequences and expressly excludes Article 272.1 cases in part 1.
  - Article 273 is malware-purpose driven; ordinary vulnerable software or an accidental defect is not automatically Article 273.
  - Article 274 requires violation of operation/access rules plus statutory consequences; a policy breach alone is not enough.
  - Article 274.1 requires a CII nexus. Do not route ordinary IT incidents to Article 274.1 merely because the organization is a CII subject.
  - Criminal qualification is fact-specific and should not be automated from a compliance-control failure alone.
