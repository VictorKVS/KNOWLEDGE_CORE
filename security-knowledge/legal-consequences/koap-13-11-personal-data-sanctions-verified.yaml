notes:
  - For parts 10-18, KoAP notes use special definitions of official and legal entity; do not apply generic subject mapping blindly.
  - Parts 12-14 expressly exclude conduct containing elements of a criminal offense; criminal-law routing must be evaluated before final consequence classification.
  - Maximum statutory fine is exposure, not expected loss; economic-risk models must keep these separate.
