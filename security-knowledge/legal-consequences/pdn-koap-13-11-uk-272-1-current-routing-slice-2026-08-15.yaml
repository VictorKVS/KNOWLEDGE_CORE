  - operator_status
  - event_time
  - conduct_type
  - acquisition_origin
  - personal_data_present
  - minors_data_present
  - special_category_present
  - biometric_present
  - affected_subject_count
  - affected_identifier_count
  - rights_violation_from_incident
  - notification_required
  - notification_sent_at
  - prior_administrative_punishment_relevant
  - criminal_signs_review_status
  - resource_created_for_illegal_storage_or_distribution

decision_states:
