civil_liability:
  - id: GK-PDN-001
    authority: '152-ФЗ ст. 24 ч. 1'
    rule: лица, виновные в нарушении требований 152-ФЗ, несут предусмотренную законодательством РФ ответственность
    implication: 152-ФЗ не заменяет отраслевые составы ответственности; требуется маршрутизация в соответствующий правовой контур
  - id: GK-PDN-002
    authority: '152-ФЗ ст. 24 ч. 2'
    rule: моральный вред субъекту ПДн вследствие нарушения его прав, правил обработки или требований к защите подлежит возмещению; компенсация независима от имущественного вреда и убытков
    route: CIVIL_MORAL_HARM_REVIEW
  - id: GK-PDN-003
    authority: 'ГК РФ ст. 151'
    rule: при причинении гражданину морального вреда действиями, нарушающими личные неимущественные права или нематериальные блага, суд может возложить денежную компенсацию
    route: CIVIL_MORAL_HARM_REVIEW
  - id: GK-PDN-004
    authority: 'ГК РФ ст. 1064 п. 1'
    rule: вред личности или имуществу гражданина и имуществу юридического лица по общему правилу возмещается в полном объеме лицом, причинившим вред
    route: CIVIL_DAMAGE_REVIEW
  - id: GK-PDN-005
    authority: 'ГК РФ ст. 1064 п. 2'
    rule: причинитель вреда освобождается от возмещения, если докажет отсутствие вины, кроме случаев ответственности без вины, предусмотренных законом
    route: CIVIL_FAULT_REVIEW
  - id: GK-PDN-006
    authority: 'ГК РФ ст. 1068 п. 1'
    rule: юридическое лицо либо гражданин возмещает вред, причиненный его работником при исполнении трудовых, служебных или должностных обязанностей
    route: EMPLOYER_CIVIL_LIABILITY_REVIEW

labor_discipline:
  - id: TK-PDN-DISC-001
    authority: 'ТК РФ ст. 192'
    rule: дисциплинарный проступок требует виновного неисполнения или ненадлежащего исполнения возложенных трудовых обязанностей
    allowed_sanctions:
      - замечание
      - выговор
      - увольнение по предусмотренным законом основаниям
    guard: нарушение ИБ само по себе не доказывает дисциплинарный проступок без установленной обязанности, факта нарушения и вины
  - id: TK-PDN-DISC-002
    authority: 'ТК РФ ст. 193'
    rule: до применения дисциплинарного взыскания работодатель должен затребовать у работника письменное объяснение
    route: NEEDS_DISCIPLINARY_PROCEDURE
  - id: TK-PDN-DISC-003
    authority: 'ТК РФ ст. 193'
    rule: дисциплинарное взыскание применяется не позднее одного месяца со дня обнаружения проступка с установленными законом исключениями из исчисления срока
    clock_start: detection_of_misconduct
  - id: TK-PDN-DISC-004
    authority: 'ТК РФ ст. 193'
    rule: по общему правилу взыскание не применяется позднее шести месяцев со дня совершения проступка; по результатам ревизии, проверки финансово-хозяйственной деятельности или аудиторской проверки — позднее двух лет; специальные коррупционные сроки учитываются отдельно
    clock_start: misconduct_date

labor_material_liability:
  - id: TK-PDN-MAT-001
    authority: 'ТК РФ ст. 238'
    rule: работник возмещает работодателю прямой действительный ущерб; неполученные доходы работодателя с работника не взыскиваются
    route: DIRECT_ACTUAL_DAMAGE_REVIEW
  - id: TK-PDN-MAT-002
    authority: 'ТК РФ ст. 241'
    rule: по общему правилу материальная ответственность работника ограничена средним месячным заработком, если иное не предусмотрено ТК РФ или федеральными законами
    route: LIMITED_MATERIAL_LIABILITY
  - id: TK-PDN-MAT-003
    authority: 'ТК РФ ст. 242'
    rule: полная материальная ответственность допускается только в случаях, предусмотренных ТК РФ или иными федеральными законами
    route: FULL_LIABILITY_GATE
  - id: TK-PDN-MAT-004
    authority: 'ТК РФ ст. 243'
    full_liability_triggers:
      - предусмотренная законом полная материальная ответственность
      - недостача вверенных ценностей при предусмотренном основании
      - умышленное причинение ущерба
      - причинение ущерба в состоянии опьянения
      - преступные действия, установленные приговором суда
      - административное правонарушение, установленное соответствующим государственным органом
      - разглашение охраняемой законом тайны в предусмотренных законом случаях
      - причинение ущерба не при исполнении трудовых обязанностей
    guard: наличие инцидента ИБ, штрафа организации или утечки ПДн само по себе не доказывает основание полной материальной ответственности конкретного работника

guardrails:
  - id: LEG-GK-TK-GR-001
    rule: административный штраф организации не равен автоматически прямому действительному ущербу, подлежащему взысканию с работника; требуется отдельная правовая и фактическая оценка
  - id: LEG-GK-TK-GR-002
    rule: гражданско-правовая ответственность организации перед субъектом ПДн и внутренняя материальная ответственность работника являются разными правоотношениями
  - id: LEG-GK-TK-GR-003
    rule: работодатель может отвечать перед потерпевшим за вред работника при исполнении обязанностей по ст. 1068 ГК РФ, но это не создает автоматически регресс или полную материальную ответственность работника без отдельного основания
  - id: LEG-GK-TK-GR-004
    rule: дисциплинарное взыскание требует процедуры ТК РФ и не может выводиться автоматически из события SIEM/DLP, заключения аудитора или факта инцидента
  - id: LEG-GK-TK-GR-005
    rule: срок дисциплинарного взыскания и сроки уведомления регуляторов — независимые часы; один не приостанавливает другой без специального основания
  - id: LEG-GK-TK-GR-006
    rule: размер морального вреда не вычисляется Security Knowledge Base автоматически; это отдельная судебная оценка
  - id: LEG-GK-TK-GR-007
    rule: редакцию нормы выбирают по дате юридически значимого события; текущий срез не заменяет историческую версию

