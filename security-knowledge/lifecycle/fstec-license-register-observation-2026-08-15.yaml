schema_version: "1.0"
id: FSTEC-LICENSE-REGISTER-OBSERVATION-2026-08-15
observed_at: "2026-08-15"
domain: szi_skzi_license_lifecycle
scope: >-
  Time-bounded metadata observations of two state open-data license registers owned by FSTEC Russia.
  This file deliberately does not assert that any named company currently holds a valid license.
  Register metadata freshness and an individual license state are separate facts.

