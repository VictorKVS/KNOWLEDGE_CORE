map_id: FSB-GOSSOPKA-PACKAGE-LIFECYCLE-2025-V1
status: VERIFIED_PRIMARY_WITH_DERIVED_EFFECTIVE_DATES_MARKED
as_of: "2026-08-18"
source_manifest: "security-knowledge/evidence/primary-artifacts-fsb-gossopka-package-2025.json"

orders:
  FSB-539-2025:
    purpose: "Procedure for KII subjects to receive information about attack means/methods and prevention/detection methods."
    effective_date: "2026-01-30"
    effective_date_basis: EXPLICIT_ORDER_CLAUSE_2
    lifecycle_note: "Separates the information-receipt function previously included in FSB Order 368/2018."
  FSB-546-2025:
    purpose: "Exchange of attack/incident information among KII subjects and with foreign or international response organizations."
    effective_date: "2026-01-30"
    effective_date_basis: EXPLICIT_ORDER_CLAUSE_3
    repeals:
      - "FSB Order 368/2018"
    lifecycle_note: "Order 368 covered both exchange and information receipt; replacement scope is split between Orders 539 and 546."
  FSB-547-2025:
    purpose: "Informing FSB about attacks/incidents, response, and consequence elimination for significant KII objects and covered organizations."
    effective_date: "2026-01-30"
    effective_date_basis: EXPLICIT_ORDER_CLAUSE_3
    repeals:
      - "FSB Order 282/2019"
      - "FSB Order 348/2022 amending Order 282/2019"
  FSB-548-2025:
    purpose: "Continuous interaction of owners/other lawful possessors of significant KII objects and covered organizations with GosSOPKA."
    effective_date: "2026-01-30"
    effective_date_basis: EXPLICIT_ORDER_CLAUSE_2
  FSB-553-2025:
    purpose: "Installation/operation procedure and technical conditions for GosSOPKA tools and attack-indicator search tools, with the stated telecom-network exception."
    effective_date: "2026-01-10"
    effective_date_basis: DERIVED_DECREE_763_CLAUSE_12
    order_contains_special_effective_date: false
    repeals:
      - "FSB Order 281/2019"
  FSB-554-2025:
    purpose: "Requirements for GosSOPKA technical, software, software-hardware and other tools, including attack-indicator search tools."
    effective_date: "2026-01-10"
    effective_date_basis: DERIVED_DECREE_763_CLAUSE_12
    order_contains_special_effective_date: false
    repeals:
      - "FSB Order 196/2019"

guards:
  - "Do not state that all six orders entered into force on one date."
  - "Do not label 2026-01-10 for Orders 553/554 as an explicit clause; it is a calculation under the general ten-day rule."
  - "Do not keep Orders 368/2018, 282/2019, 348/2022, 281/2019 or 196/2019 active after their replacement dates."
  - "Do not reduce Order 546 to domestic exchange; its title expressly includes foreign and international response organizations."
  - "Do not treat this lifecycle map as a substitute for clause-level deadline extraction from the six preserved PDFs."
