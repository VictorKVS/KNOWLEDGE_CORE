source_fidelity_notes:
  - >-
    The official publication index confirms act identity, registration and publication metadata.
    Exact current clause text has not been hash-pinned in this repository in this pass.
  - >-
    An authoritative legal-system page for Orders No. 163/164 may still display their original
    2025-12-31 limit. Current routing must overlay the later official amendment No. 487 rather than
    treat an un-consolidated derivative page as the current lifecycle state.
  - >-
    License-control procedure applicability is not the same thing as certificate validity,
    license validity, product certificate lifecycle, or SKZI approval lifecycle. These entities
    must remain separate in the graph.

fail_closed_rules:
  - id: LIC-GUARD-001
    if: "query_date >= 2025-12-31 AND order in [163,164] AND amendment_487_state is UNKNOWN"
    then: NEEDS_AMENDMENT_REVIEW
    rationale: "Cannot decide expiration from the original sunset date without evaluating Order No. 487."
  - id: LIC-GUARD-002
    if: "query_date between 2025-07-13 and 2028-12-31 inclusive AND amendment_487_state is VERIFIED"
    then: CURRENT_AS_AMENDED
  - id: LIC-GUARD-003
    if: "query asks whether a specific company holds a valid license"
    then: REQUIRE_CURRENT_LICENSE_REGISTER_LOOKUP
    rationale: "These procedural orders do not prove an individual licensee's current license status."
  - id: LIC-GUARD-004
    if: "query asks whether a specific SZI certificate is valid"
    then: REQUIRE_CURRENT_CERTIFICATION_REGISTER_LOOKUP
    rationale: "License-control procedural acts do not establish product-certificate validity."

