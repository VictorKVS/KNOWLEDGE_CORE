  "decision_gates": [
    {
      "id": "GATE-01",
      "gate": "Resolve the fixed-scope route identifier and exact designation."
    },
    {
      "id": "GATE-02",
      "gate": "Resolve jurisdiction before applying national status or conformity."
    },
    {
      "id": "GATE-03",
      "gate": "Verify active national status independently of the international source lifecycle."
    },
    {
      "id": "GATE-04",
      "gate": "Preserve printed IDT or NEQ; never infer clause equivalence for NEQ."
    },
    {
      "id": "GATE-05",
      "gate": "Compare the adopted source edition with the current international edition and amendments."
    },
    {
      "id": "GATE-06",
      "gate": "Resolve an independent legal, contractual or certification basis before treating a standard as binding."
    },
    {
      "id": "GATE-07",
      "gate": "Require immutable normative bytes for full textual verification; catalog metadata alone is insufficient."
    },
    {
      "id": "GATE-08",
      "gate": "Fail closed on missing edition, amendment, adoption, scope, decision date or evidence."
    }
  ],
  "scenarios": [
    {
      "id": "SCN-01",
      "facts": "Russian IDT route with matching current ISO base",
      "expected": "ALLOW_METADATA_ROUTE_PENDING_IMMUTABLE_BYTES"
    },
    {
      "id": "SCN-02",
      "facts": "Russian IDT route whose ISO source was replaced",
      "expected": "KEEP_NATIONAL_ROUTE_ACTIVE_AND_FLAG_EDITION_DRIFT"
    },
    {
      "id": "SCN-03",
      "facts": "Russian NEQ route",
      "expected": "BLOCK_CLAUSE_LEVEL_EQUIVALENCE"
    },
    {
      "id": "SCN-04",
      "facts": "International-only route with no confirmed Russian adoption",
      "expected": "PENDING_RU_ADOPTION_AUTHORITATIVE_EVIDENCE"
    },
    {
      "id": "SCN-05",
      "facts": "Active GOST cited without legal or contractual basis",
      "expected": "BLOCK_UNIVERSAL_MANDATORY_CLAIM"
    },
    {
      "id": "SCN-06",
      "facts": "ISO amendment published after national adoption",
      "expected": "DO_NOT_IMPORT_AMENDMENT_WITHOUT_EVIDENCE"
    },
    {
      "id": "SCN-07",
      "facts": "Withdrawn ISO source behind an active GOST",
      "expected": "DO_NOT_CANCEL_NATIONAL_STANDARD_AUTOMATICALLY"
    },
    {
      "id": "SCN-08",
      "facts": "Catalog page available but normative PDF bytes absent",
      "expected": "PARTIAL_METADATA_ONLY"
    }
  ],
  "invariants": [
    "Every designation appears exactly once in the fixed reconciliation scope.",
    "Russian and international lifecycle states remain independent.",
    "IDT and NEQ are never normalized into one equivalence class.",
    "A newer ISO edition does not silently rewrite a national standard.",
    "An active standard is not universally mandatory without an independent basis.",
    "PENDING means the claim is withheld, not that adoption or a document does not exist."
  ],
