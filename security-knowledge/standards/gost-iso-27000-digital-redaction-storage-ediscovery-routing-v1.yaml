  "decision_gates": [
    {
      "order": 1,
      "gate": "Identify jurisdiction, exact designation, requested outcome and evidence date."
    },
    {
      "order": 2,
      "gate": "Resolve whether a Russian national adoption exists; do not infer one from an ISO reference."
    },
    {
      "order": 3,
      "gate": "Resolve Russian order, effective date, source edition and conformity degree when a national adoption exists."
    },
    {
      "order": 4,
      "gate": "Resolve the current international edition and lifecycle independently."
    },
    {
      "order": 5,
      "gate": "Separate redaction, storage security, overview, governance and code-of-practice scopes."
    },
    {
      "order": 6,
      "gate": "Map the applicable Russian procedural, confidentiality, retention and disclosure law independently."
    },
    {
      "order": 7,
      "gate": "Require activity-level evidence for identification, preservation, collection, processing, review, analysis and production."
    },
    {
      "order": 8,
      "gate": "Fail closed when adoption, edition, legal basis, evidence or immutable normative bytes are missing."
    }
  ],
