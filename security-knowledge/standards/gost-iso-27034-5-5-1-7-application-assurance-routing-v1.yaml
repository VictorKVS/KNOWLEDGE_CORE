  "decision_gates": [
    {
      "order": 1,
      "gate": "Resolve exact national or international designation, publication type, edition, lifecycle and evidence date."
    },
    {
      "order": 2,
      "gate": "Verify Russian order, effective date, source edition and IDT relationship independently for parts 5 and 7."
    },
    {
      "order": 3,
      "gate": "Keep ISO/IEC TS 27034-5-1 separate from ISO/IEC 27034-5 and from any unconfirmed Russian adoption."
    },
    {
      "order": 4,
      "gate": "Route part 5 to ASC information structures and ASLCRM activities/roles without inventing technical control values."
    },
    {
      "order": 5,
      "gate": "Route part 5-1 to XML schema implementation and validate syntax, semantics, version and provenance separately."
    },
    {
      "order": 6,
      "gate": "Apply part 7 prediction only to a subsequent version of the same application with a defined ANF and evidenced original actual level of trust."
    },
    {
      "order": 7,
      "gate": "Require PASR risk analysis, assumptions, owner approval, substantial-change gate, auditability and residual verification."
    },
    {
      "order": 8,
      "gate": "Fail closed when edition, adoption, schema semantics, baseline evidence, risk analysis, approval, scope or immutable bytes are missing."
    }
  ],
