stage_model:
  detection_and_registration:
    steps:
      - REGISTER_POSSIBLE_INCIDENT_INDICATORS
      - CONFIRM_COMPUTER_INCIDENTS
  incident_response:
    sequential_steps:
      - IDENTIFY_INVOLVED_INFRASTRUCTURE_ELEMENTS
      - LOCALIZE_INCIDENT
      - IDENTIFY_INCIDENT_CONSEQUENCES
      - ELIMINATE_INCIDENT_CONSEQUENCES
      - CLOSE_INCIDENT
    separate_steps:
      - FIX_INCIDENT_RELATED_MATERIALS
      - ESTABLISH_INCIDENT_CAUSES_AND_CONDITIONS
    separate_steps_may_run:
      - IN_PARALLEL_WITH_OTHER_RESPONSE_STEPS
      - AFTER_INCIDENT_CLOSURE
    separate_steps_do_not_block_closure: true
  results_analysis:
    steps:
      - ACQUIRE_AND_ACCUMULATE_INCIDENT_MANAGEMENT_EXPERIENCE
      - DEVELOP_RECOMMENDATIONS_TO_REMOVE_INCIDENT_CAUSES_AND_CONDITIONS
      - EVALUATE_RESPONSE_RESULTS_AND_EFFECTIVENESS

analysis_methods:
  SIGNATURE:
    basis: MATCH_SPECIFIC_INDICATORS_AND_RELATIONSHIP_CONDITIONS
    rule_creation_and_configuration_actor: INCIDENT_MANAGEMENT_UNIT_SPECIALIST
  SIGNATURELESS:
    basis: DETECT_STATISTICAL_OR_OTHER_DEPENDENCIES_AND_BUILD_RESOURCE_OPERATION_PROFILES
    implementation_actor: SECURITY_EVENT_MANAGEMENT_TOOL_DEVELOPER
    specialist_modification_available: false

