  "applicability_routes": [
    {
      "id": "A1",
      "trigger": "standard merely appears relevant or is used as guidance",
      "result": "VOLUNTARY_REFERENCE",
      "required_evidence": "approved voluntary adoption decision and selected scope",
      "boundary": "relevance alone does not create a statutory duty"
    },
    {
      "id": "A2",
      "trigger": "legislation or another binding act is alleged to require the standard",
      "result": "BINDING_REFERENCE_REVIEW",
      "required_evidence": "exact current provision, addressee, object, date and incorporated edition",
      "boundary": "no obligation is inferred without the exact binding reference"
    },
    {
      "id": "A3",
      "trigger": "contract, procurement or corporate mandate names the standard",
      "result": "CONTRACTUAL_OR_INTERNAL_REQUIREMENT",
      "required_evidence": "signed term, exact designation or controlled equivalence rule, scope and date",
      "boundary": "contractual force is not mislabeled as force of federal law"
    },
    {
      "id": "A4",
      "trigger": "organization claims conformity with ГОСТ Р ИСО/МЭК 27001-2021",
      "result": "FULL_CLAUSES_4_TO_10_GATE",
      "required_evidence": "declared scope and evidence for every clause group 4-10",
      "boundary": "no clause 4-10 may be excluded under the official scope statement"
    },
    {
      "id": "A5",
      "trigger": "certificate is offered as proof",
      "result": "CERTIFICATE_SCOPE_AND_LIFECYCLE_GATE",
      "required_evidence": "issuer, accreditation route if claimed, certificate number, standard edition, certified scope, sites, issue/expiry/suspension history and verification date",
      "boundary": "a certificate proves no more than its exact scope and valid-time evidence"
    },
    {
      "id": "A6",
      "trigger": "Annex A control list is treated as an automatic universal checklist",
      "result": "RISK_TREATMENT_AND_APPLICABILITY_GATE",
      "required_evidence": "risk-treatment decisions and a controlled statement of applicability or equivalent applicability record",
      "boundary": "the KB does not infer that every control applies identically to every organization"
    }
  ],
