fstec_current_context:
  - id: FSTEC-117-2025
    designation: "Приказ ФСТЭК России от 11.04.2025 №117"
    publication_id: "0001202506170011"
    minjust_registration: "82619"
    effective_from: "2026-03-01"
    replaces_regulatory_act: "Приказ ФСТЭК России от 11.02.2013 №17"
    source: "https://publication.pravo.gov.ru/document/0001202506170011"
  - id: FSTEC-117-INTERIM-METHOD-GUIDANCE-2026
    authority_level: AUTHORITATIVE_SECONDARY_PENDING_PRIMARY_WEB_CAPTURE
    claim: >
      An FSTEC information message dated 12.03.2026 No. 240/22/1492 states that, until approval
      of the new methodological document on the composition/content of protection activities and
      measures, implementation of measures under Order 117 should use the FSTEC methodological
      document "Меры защиты информации в государственных информационных системах" dated 11.02.2014.
    guardrail: >
      This interim methodological linkage is not evidence that any ISO/IEC 27002 control is
      legally or technically equivalent to a particular FSTEC measure.

crosswalk_semantics:
  allowed_relation_types:
    - THEMATIC_OVERLAP
    - SUPPORTS_OBJECTIVE
    - POSSIBLE_IMPLEMENTATION_EVIDENCE
    - REQUIRES_EXPERT_MAPPING
    - BINDING_EDGE_SEPARATE
  forbidden_relation_types_without_clause_evidence:
    - LEGALLY_EQUIVALENT
    - TECHNICALLY_EQUIVALENT
    - SATISFIES_AUTOMATICALLY
    - REPLACES_FSTEC_MEASURE
    - REPLACES_ISO_CONTROL

mapping_policy:
  - id: MAP-ISMS-FSTEC-001
    rule: >
      An ISMS standard being current does not create a mandatory FSTEC requirement and a FSTEC
      requirement does not make the whole ISMS standard mandatory.
  - id: MAP-ISMS-FSTEC-002
    rule: >
      Similar names such as access control, logging, incident management, vulnerability management,
      continuity or configuration management establish at most THEMATIC_OVERLAP until source clauses,
      scope, implementation conditions and evidence requirements are compared.
  - id: MAP-ISMS-FSTEC-003
    rule: >
      A control implemented for ISO/GOST conformity may be reused as POSSIBLE_IMPLEMENTATION_EVIDENCE
      for a FSTEC measure only after an assessor confirms the required properties and applicability.
  - id: MAP-ISMS-FSTEC-004
    rule: >
      BDU references to FSTEC measure codes demonstrate catalog relations between threats/vulnerabilities
      and recommended measures, not equivalence to ISO/IEC controls and not automatic legal applicability.
  - id: MAP-ISMS-FSTEC-005
    rule: >
      Historical audits route the standard edition by the audit/event date. A replaced standard is
      preserved as historical evidence and must not be silently rewritten to the current edition.
  - id: MAP-ISMS-FSTEC-006
    rule: >
      If a mapping lacks clause-level evidence on either side, the decision state is REQUIRES_EXPERT_MAPPING.

example_safe_family_relations:
  - theme: ACCESS_CONTROL
    gost_iso_role: "27002 control guidance"
    fstec_observed_family_codes: ["УПД", "ИАФ"]
    relation: THEMATIC_OVERLAP
    equivalence: NOT_PROVEN
  - theme: SECURITY_EVENT_LOGGING
    gost_iso_role: "ISMS control guidance / ГОСТ Р 59548 event-registration guidance"
    fstec_observed_family_codes: ["АУД"]
    relation: THEMATIC_OVERLAP
    equivalence: NOT_PROVEN
  - theme: INCIDENT_MANAGEMENT
    gost_iso_role: "ГОСТ Р 59709-59712 / ISMS guidance"
    fstec_context: "regulatory and methodological incident/security measures depend on applicable FSTEC source"
    relation: SUPPORTS_OBJECTIVE
    equivalence: NOT_PROVEN
  - theme: LEAST_PRIVILEGE
    gost_iso_role: "access-control guidance"
    fstec_observed_evidence: "BDU ASU TP BDA:C006 links excessive privileges to УПД.5 and related measures"
    relation: THEMATIC_OVERLAP
    equivalence: NOT_PROVEN

fail_closed_states:
  - UNKNOWN_STANDARD_EDITION
  - NEEDS_BINDING_EDGE
  - REQUIRES_EXPERT_MAPPING
  - CLAUSE_EVIDENCE_MISSING
  - FSTEC_APPLICABILITY_UNKNOWN
  - HISTORICAL_DATE_MISSING

