status: AUTHORITATIVE_VERIFIED_PLUS_INTERNAL_EXECUTABLE_POLICY
purpose: >
  Provide deterministic lifecycle routing for replaced Russian ISMS standards and a fail-closed
  crosswalk policy between ISMS guidance/controls and FSTEC regulatory measures. This crosswalk
  must never assert one-to-one legal or technical equivalence without clause-level evidence.

