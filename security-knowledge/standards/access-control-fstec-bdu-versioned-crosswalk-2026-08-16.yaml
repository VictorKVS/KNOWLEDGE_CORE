      scope_claim: "Contains recommendations for selecting, implementing and applying information-security controls based on organizational risks."
      source: "https://protect.gost.ru/gost/details/be00167c-6e26-4042-ac31-36be8a9d6b2e"
      evidence_level: AUTHORITATIVE_PRIMARY_METADATA
    - id: GOST-59383-2021
      designation: "ГОСТ Р 59383-2021"
      status: "Действует"
      effective_from: "2021-11-30"
      scope_claim: "Defines a framework and concepts for secure access management to information and ICT resources."
      source: "https://protect.gost.ru/gost/details/89a3da3d-068d-4ea1-8130-f5d912f6ecdb"
      evidence_level: AUTHORITATIVE_PRIMARY_METADATA
    - id: GOST-59453-1-2021
      designation: "ГОСТ Р 59453.1-2021"
      status: "Действует"
      effective_from: "2021-06-01"
