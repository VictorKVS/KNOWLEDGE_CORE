critical_semantic_finding:
  id: FIND-ACCESS-CODE-COLLISION-001
  severity_if_unmitigated: HIGH
  status: FIXED_IN_THIS_SLICE
  finding: >
    The code УПД.5 is version-dependent. In the FSTEC 2014 measure catalog it denotes assignment of
    minimally necessary rights and privileges; in the FSTEC methodology dated 12.04.2026, УПД.5 denotes
    a user warning before access, while least-privilege semantics are included in current УПД.2.
    Therefore BDU catalog references to УПД.5 must not be interpreted as current-2026 УПД.5 without an
    explicit measure-catalog version or a verified migration relation.
  consequence: >
    A naive join on measure_code alone can map an excessive-privilege vulnerability to the wrong current
    control and create false evidence of compliance.

versioned_measure_identity:
  identity_rule: "measure identity = authority + catalog/version + code; code alone is never a stable semantic identifier"
  examples:
    - immutable_semantic_id: FSTEC-M2014-UPD-5
      source_family: FSTEC_METHOD_2014
      code: "УПД.5"
      meaning: "Назначение минимально необходимых прав и привилегий"
      lifecycle: HISTORICAL_OR_LEGACY_REFERENCE
    - immutable_semantic_id: FSTEC-M2026-UPD-2
      source_family: FSTEC_METHOD_2026
      code: "УПД.2"
      meaning: "Разграничение и контроль прав доступа; includes least-privilege semantics"
      lifecycle: CURRENT_METHOD_CONTEXT
    - immutable_semantic_id: FSTEC-M2026-UPD-5
      source_family: FSTEC_METHOD_2026
      code: "УПД.5"
      meaning: "Предупреждение пользователя при его доступе к информационной системе"
      lifecycle: CURRENT_METHOD_CONTEXT

safe_many_to_many_crosswalk:
  - theme: ACCESS_CONTROL_MODEL
    gost_sources: [GOST-59383-2021, GOST-59453-1-2021, GOST-27002-2021]
    fstec_targets: [FSTEC-M2026-UPD-1]
    relation: SUPPORTS_OBJECTIVE
    equivalence: NOT_PROVEN
    evidence_note: "Rosstandart scope proves access-management/model relevance; exact ISO control-clause equivalence is not asserted."
  - theme: LEAST_PRIVILEGE
    gost_sources: [GOST-27002-2021, GOST-59383-2021]
    fstec_targets: [FSTEC-M2026-UPD-2]
    bdu_sources: [BDU-ASUTP-BDA-C006-2026-08-16]
    relation: THEMATIC_OVERLAP_PLUS_THREAT_EVIDENCE
    equivalence: NOT_PROVEN
    evidence_note: >
      Current FSTEC methodology explicitly places minimization/separation of rights in УПД.2. BDU C006
      evidences the risk relevance of excessive privileges, but its legacy code references require version resolution.
  - theme: ACCOUNT_MANAGEMENT
    gost_sources: [GOST-27002-2021, GOST-59383-2021]
    fstec_targets: [FSTEC-M2026-UPD-3]
    relation: THEMATIC_OVERLAP
    equivalence: NOT_PROVEN
  - theme: PRIVILEGED_ACCESS_SEPARATION
    gost_sources: [GOST-27002-2021, GOST-59383-2021]
    fstec_targets: [FSTEC-M2026-UPD-2]
    bdu_sources: [BDU-ASUTP-BDA-C006-2026-08-16]
    relation: SUPPORTS_OBJECTIVE
    equivalence: NOT_PROVEN

mapping_rules:
  - id: ACCESS-MAP-001
    rule: "Never join FSTEC measure records by code alone; require source_family/catalog_version."
  - id: ACCESS-MAP-002
    rule: "A BDU recommended-measure code is threat/vulnerability evidence, not proof of current regulatory applicability."
  - id: ACCESS-MAP-003
    rule: "A current FSTEC measure and a GOST/ISO access-control theme are NOT_EQUIVALENT_BY_DEFAULT."
  - id: ACCESS-MAP-004
    rule: "Current least-privilege routing for the 12.04.2026 FSTEC methodology targets УПД.2, not current УПД.5."
  - id: ACCESS-MAP-005
    rule: "Historical evidence that names УПД.5 must retain its original catalog/version and must not be silently migrated."
  - id: ACCESS-MAP-006
    rule: "An ISO/GOST implementation artifact may be POSSIBLE_IMPLEMENTATION_EVIDENCE only after exact FSTEC properties and applicability are verified."

fail_closed_states:
  - FSTEC_MEASURE_VERSION_UNKNOWN
  - BDU_MEASURE_VERSION_UNRESOLVED
  - GOST_CLAUSE_EVIDENCE_MISSING
  - FSTEC_APPLICABILITY_UNKNOWN
  - REQUIRES_EXPERT_MAPPING
  - CODE_COLLISION_DETECTED

