      evidence_level: AUTHORITATIVE_PRIMARY_METADATA

  fstec_method_2026:
    designation: "Методический документ ФСТЭК России от 12.04.2026 «Состав и содержание мероприятий и мер по защите информации, содержащейся в информационных системах»"
    evidence_level: AUTHORITATIVE_SECONDARY_TEXT_PENDING_PRIMARY_CAPTURE
    sources:
      - "https://www.garant.ru/products/ipo/prime/doc/413970697/"
      - "https://www.consultant.ru/document/cons_doc_LAW_531896/0c38ad7dd911afc861bcdac604db9ed1ed8f8fe1/"
    verified_current_measures:
      - code: "УПД.1"
        title: "Реализация модели управления доступом"
        verified_properties:
          - "Access-control model formalizes subjects, objects, access types and access rules."
          - "Model is reviewed annually or when relevant access-model inputs change."
      - code: "УПД.2"
        title: "Разграничение и контроль прав доступа"
        verified_properties:
          - "Purpose explicitly includes minimization and separation of access rights."
          - "Requires separation of privileged and non-privileged access rights."
          - "Requires minimization of access rights of subjects to objects."
          - "Documentation includes duties/roles and the minimally necessary access rights for those duties/roles."
      - code: "УПД.3"
        title: "Управление учетными записями"
        verified_properties:
          - "Current access-control family contains a dedicated account-management measure."
      - code: "УПД.5"
        title: "Предупреждение пользователя при его доступе к информационной системе"
        verified_properties:
          - "Current 2026 code УПД.5 is a user-warning measure, not the historical least-privilege measure."

