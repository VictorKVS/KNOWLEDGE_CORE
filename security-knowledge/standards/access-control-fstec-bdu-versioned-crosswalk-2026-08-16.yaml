slice_id: ACCESS-FSTEC-BDU-VERSIONED-CROSSWALK-2026-08-16
as_of: "2026-08-16"
status: AUTHORITATIVE_VERIFIED_PLUS_EXECUTABLE_POLICY
purpose: >
  Build a narrow evidence-backed many-to-many crosswalk for access control, identity and least privilege
  across current Russian ISMS standards, the FSTEC 2026 protection methodology and the dynamic BDU ASU TP
  catalog while preventing code-collision and false equivalence.

