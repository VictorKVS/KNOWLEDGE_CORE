evidence_policy:
  artifact_semantics: >-
    Artifact locators identify documents, reports, files, logs, tool outputs or other preserved
    information capable of proving implementation. Their exact content must be checked at the
    listed clause; a document title alone is not proof of substantive implementation.
  no_universal_periods: >-
    Periodicity, support times, build-log retention, secret lifetime and other values that the
    standard tells the developer to define are not universal numeric deadlines supplied by it.

