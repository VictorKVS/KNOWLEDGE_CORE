relations:
  - "27000 -> common terminology for the ISMS family"
  - "27001 -> requirements baseline for an organization claiming conformity"
  - "27002 -> control guidance supporting risk treatment and control selection"
  - "27003 -> implementation guidance for 27001"
  - "27004 -> monitoring and effectiveness measurement supporting 27001 clause 9.1"
  - "27014 -> governance layer above and around ISMS management"
  - "27017 -> cloud-specific control guidance; does not replace general applicability analysis"
  - "27021 -> competence evidence for ISMS specialist roles"
  - "56045 -> control assessment guidance; assessment result is separate from legal compliance conclusion"

guardrails:
  - id: STD-ISMS-001
    rule: "CURRENT_STANDARD != MANDATORY_LEGAL_REQUIREMENT. A binding edge must be proven separately."
  - id: STD-ISMS-002
    rule: "A recommendation in 27002/27003/27004/27014/27017/56045 must not be represented as a statutory obligation without an external binding source."
  - id: STD-ISMS-003
    rule: "For an organization explicitly claiming conformity to ГОСТ Р ИСО/МЭК 27001-2021, exclusion of requirements in clauses 4-10 is not allowed according to the Rosstandart scope statement."
  - id: STD-ISMS-004
    rule: "Replacement lifecycle is explicit: 27001-2021 replaces 27001-2006; 27002-2021 replaces 27002-2012; 27003-2021 replaces 27003-2012. Historical audits must route by event/audit date."
  - id: STD-ISMS-005
    rule: "Control assessment, certification/conformity assessment and regulator compliance are distinct decision types and require separate evidence and authority."

pending:
  - "clause-level extraction where legally/licensing/contractually binding applicability exists"
  - "crosswalk to FSTEC control families without assuming equivalence"
  - "executable lifecycle regression for replacement boundaries"
  - "immutable/hash-pinned standard artifact snapshots where redistribution/access permits"
