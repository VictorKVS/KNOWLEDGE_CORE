scope: Current-status and applicability metadata for Russian national standards relevant to computer-incident management and security-event logging.
authority:
  organization: Rosstandart
  service: Federal information fund for standards / protect.gost.ru
status_policy: >
  A standard being current does not by itself prove that a specific organization is legally obliged to comply with it.
  Mandatory applicability requires a separate binding edge from legislation, regulation, contract, accreditation/certification scope,
  procurement terms, or an adopted internal policy.
