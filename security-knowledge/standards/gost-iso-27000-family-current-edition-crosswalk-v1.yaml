  "key_findings": [
    "ГОСТ Р ИСО/МЭК 27000-2012 and 27002-2012 are replaced by their 2021 national editions",
    "ГОСТ Р ИСО/МЭК 27005-2010 remains active but is IDT to ISO/IEC 27005:2008",
    "The Russian year suffix is not the source ISO edition year",
    "A newer international ISO edition does not automatically amend a Russian GOST",
    "27001 requirements, 27002 controls, 27004 measurement, 27005 risk guidance and 27017 cloud guidance retain distinct roles"
  ],
