red_team_rules:
  - "The seven-act Roskomnadzor list is the supervisory core, not proof that only seven documents matter to an operator."
  - "Sector-specific acts must not be applied without proving sector/process applicability."
  - "Guidance, letters and examples are never promoted to mandatory requirements without a binding edge."
  - "A source count is not a requirement count; a code or law may contain hundreds of atomic rules."
  - "Historical amendment laws are tracked in version chains but are not double-counted as current standalone operator obligations unless they create a live independent regime."

