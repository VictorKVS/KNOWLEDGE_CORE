important_provenance_finding:
  id: PROV-AGGREGATE-ADJACENCY-RISK
  statement: >-
    Aggregate official-publication search output can render metadata from neighboring records in a way that is unsafe for
    automatic act-to-metadata binding. In this pass an aggregate result placed publication 0001202512300066 / 415 KB / 8 pages
    adjacent to Order 553, while the direct official document page identifies Order 553 as publication 0001202512300059.
  resolution: >-
    Direct official document identity now outranks aggregate search association for act identity. Conflicting aggregate fields
    are quarantined for provenance review and cannot overwrite a pinned direct publication ID.
  legal_interpretation: >-
    This is treated as a parser/adjacency provenance risk, not evidence that the legal act itself is inconsistent.

