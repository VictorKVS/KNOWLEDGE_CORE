    correction: No.77 remains a separate applicability branch until a repeal/supersession edge is proven.
  - id: RT-HIST-077-004
    severity_if_unfixed: MEDIUM
    description: The 24-hour No.77 deadline could overwrite a stricter applicable CII deadline.
    correction: Parallel deadline routing selects the stricter binding deadline and preserves both legal bases.
