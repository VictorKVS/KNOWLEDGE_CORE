proof_floor_notes:
  - Official publication metadata confirms FSB Order No.282 dated 2019-06-19, publication 0001201907170025, MinJust registration 55284.
  - Official publication metadata confirms FSB Order No.348 dated 2022-07-07, publication 0001202208050004, MinJust registration 69513; it amends No.282 rather than forming a standalone complete regime.
  - FSB Order No.547 expressly repeals No.282 and No.348 and enters into force on 2026-01-30.
  - Authoritative lifecycle metadata places the original No.282 routing from 2019-07-28 and the No.348-amended version from 2022-08-16 through 2026-01-29.
  - Official publication metadata confirms FSB Order No.77 dated 2023-02-13, publication 0001202302200021, MinJust registration 72404; authoritative current-status metadata observed 2026-08-16 marks it active from 2023-03-01.
  - FSB No.77 uses NKTsKI-determined formats and a 24-hour clock from detection for the covered PD-operator incident route.
  - No evidence found that FSB No.547 repealed FSB No.77; therefore the PD route is modeled as potentially parallel where both applicability conditions are met.
