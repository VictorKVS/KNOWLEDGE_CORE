proof_floor_notes:
  - Official publication portal identifies FSB Order No.540 dated 2025-12-24 as publication 0001202512250025, published 2025-12-25 and registered by Ministry of Justice No.84777.
  - Authoritative GosSOPKA reproduction states FSB Order No.540 enters into force on 2026-01-30.
  - The amended NKTsKI Regulation function 4.10 authorizes NKTsKI to determine the composition of technical parameters of computer attacks/incidents indicated when information is submitted to GosSOPKA.
  - Authoritative GosSOPKA materials for FSB Order No.546 state information exchange follows formats and technical-parameter composition determined by NKTsKI.
  - Official NKTsKI/GosSOPKA pages confirm NKTsKI Order No.2 dated 2026-07-14 defines GosSOPKA reporting formats and technical parameters.
  - Exact NKTsKI Order No.2 artifact bytes are still not preserved; exact field schema remains blocked.
  - The 2026-07-08 Initial Data document remains methodological guidance; example thresholds are not universal mandatory thresholds.
