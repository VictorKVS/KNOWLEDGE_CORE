    severity_if_unfixed: MEDIUM
    description: Current 2026 authority chain could be backcast to historical events before its effective date.
    correction: Events before 2026-01-30 route to predecessor-law review.
  - id: RT-AUTH-076-004
    severity_if_unfixed: MEDIUM
    description: Methodological thresholds could become mandatory by association with the binding reporting framework.
    correction: Methodology requires an independent binding edge for mandatory routing.
