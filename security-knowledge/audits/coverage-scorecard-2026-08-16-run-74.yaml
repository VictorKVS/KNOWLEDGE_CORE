red_team_findings_fixed_this_run:
  - id: RT-EVD-074-001
    severity_if_unfixed: HIGH
    description: Internal incident detection/registration could be misrepresented as regulator notification.
    correction: Detection and submission are different evidence node types; detection alone cannot prove regulator notification.
  - id: RT-EVD-074-002
    severity_if_unfixed: HIGH
    description: An outgoing submission could be misrepresented as delivered to NKTsKI without delivery evidence.
    correction: SUBMITTED_WITHOUT_CONFIRMED_DELIVERY is a first-class state.
  - id: RT-EVD-074-003
    severity_if_unfixed: HIGH
    description: Partial package could be blocked until all materials become available, increasing deadline risk.
    correction: SEND_AVAILABLE_MATERIALS is mandatory model behavior when some materials exist and some are missing, within the scope proven by the official NKTsKI publication.
  - id: RT-EVD-074-004
    severity_if_unfixed: HIGH
    description: Delivery evidence could be confused with field-level completeness.
    correction: Delivery may be confirmed while completeness remains unknown; exact completeness claims are blocked until immutable schema evidence exists.
  - id: RT-EVD-074-005
    severity_if_unfixed: MEDIUM
    description: Later supplementation could rewrite the original submission timestamp and hide deadline evidence.
    correction: Original and supplementary transmissions are separate immutable timeline events.
