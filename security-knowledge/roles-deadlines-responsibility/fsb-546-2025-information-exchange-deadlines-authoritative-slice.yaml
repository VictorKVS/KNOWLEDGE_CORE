routing_guardrails:
  - "The 12-hour rule in paragraph 21 is not a universal incident-notification deadline; it applies to receipt of information concerning another KII subject's object."
  - "The 24-hour rule in paragraph 20 is not a universal incident-notification deadline; it applies to unsolicited information received from a foreign/international organization."
  - "The 24-hour and 48-hour deadlines in paragraphs 15, 16 and 18 are NKCKI procedural deadlines, not deadlines imposed on the KII subject for initial incident notification."
  - "Paragraph 3 uses a qualitative operational timing standard for subject-to-subject exchange; it must not be converted into an invented numeric deadline."
  - "Formats referenced by this Order are delegated to NKCKI-defined GosSOPKA formats/technical parameters and must be version-linked to the current NKCKI artifact set."

