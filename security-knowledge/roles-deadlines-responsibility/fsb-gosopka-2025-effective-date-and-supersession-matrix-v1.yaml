temporal_guardrails:
  - id: FSB-LC-GR-001
    rule: >-
      Never choose the applicable regulatory version using the audit date alone. Determine
      the event/configuration time first and resolve the act effective at that time.
  - id: FSB-LC-GR-002
    rule: >-
      Orders 553 and 554 became effective on 2026-01-10, while Orders 539, 546, 547 and 548
      in this slice became effective on 2026-01-30. Do not collapse the 20-day transition
      interval into one GosSOPKA release date.
  - id: FSB-LC-GR-003
    rule: >-
      A superseded predecessor remains relevant to historical evidence, incidents,
      configuration decisions and audits for periods when it was effective.
  - id: FSB-LC-GR-004
    rule: >-
      Null predecessor means "not asserted from verified evidence in this slice", not
      "no predecessor existed".

