  "scope":"Clause-level paraphrase of two techniques useful for information-security risk elicitation and control analysis. The package does not create mandatory questionnaires, barrier taxonomies, probabilities or diagram cardinalities.",
  "source":{"designation":"ГОСТ Р 58771-2019","status":"Действует","order_number":"1405-ст","order_date":"2019-12-17","effective_from":"2020-03-01","official_registry":"https://protect.gost.ru/gost/details/f35f83b7-a9fd-453b-b1bd-e05035a5009c","public_text":"https://meganorm.ru/Data2/1/4293724/4293724640.htm","interview_lines":"1021-1060","bow_tie_lines":"1579-1633"},
  "techniques":[
    {
      "id":"STRUCTURED_OR_SEMI_STRUCTURED_INTERVIEW","locator":"Б.1.5","name":"Структурированные или полуструктурированные интервью",
      "variants":[{"id":"STRUCTURED","distinction":"prepared questions are asked to each interviewee"},{"id":"SEMI_STRUCTURED","distinction":"prepared structure permits freer discussion and exploration of emerging or interviewee-raised areas"}],
      "question_design_constraints":["prefer open questions where possible","use simple language appropriate to the interviewee","cover one topic per question","prepare follow-up questions for clarification","pilot questions with people similar to intended interviewees","check ambiguity, understanding and intended interpretation","avoid leading the interviewee"],
      "uses":["obtain in-depth information and individual opinions","allow confidentiality when necessary","reduce influence from other group members' opinions","work when people cannot readily meet together","work when free group discussion is unsuitable","obtain more detail than a survey or workshop","operate at any organizational level"],
      "inputs":["clear understanding of required information","prepared question set tested in a pilot group","designers and interviewers with skills to obtain credible answers without coloring them with interviewer bias"],
      "outputs":["detailed information"],
      "strengths":["gives people time to consider the issue","one-to-one communication can examine issues more deeply than a group approach","structured interviews can involve more stakeholders than one group session"],
      "limitations":["development, conduct and analysis are time-consuming","design and conduct require expertise and an unbiased interviewer","respondent bias remains and is not moderated through group discussion","the method does not stimulate imagination in the way group methods can","semi-structured interviews can produce substantial unstructured verbal information"],
      "guardrails":["confidentiality is optional and context-dependent, not automatically guaranteed","detailed information is not automatically verified fact","pilot testing does not eliminate all interviewer or respondent bias","no fixed questionnaire, sample size, duration or recording method is supplied"]
    },
    {
      "id":"BOW_TIE_ANALYSIS","locator":"Б.4.2","name":"Метод «галстук-бабочка»",
      "purpose":"Schematically describe and analyze development of an event from causes to consequences, emphasizing controls before and after the event.",
      "diagram_components":["central event","risk sources, hazards or threats on the left","cause-to-event mechanisms","preventive barriers or controls across cause paths","potential consequences on the right","reactive barriers or controls that modify consequences","escalation factors that can cause control failure","controls for escalation factors","management functions supporting controls"],
      "quantification_preconditions":["paths are independent","probability of a consequence or outcome is known","probability of control ineffectiveness can be estimated"],
      "uses":["display and communicate risks with multiple possible causes and consequences","expand events recorded simply in a risk register","check that each cause-event-consequence path has effective control","identify factors that can cause controls or management systems to fail","analyze potential events proactively","model events retrospectively","represent situations between a simple causal chain and full fault/event-tree complexity"],
      "inputs":["information about causes of a predefined event","information about consequences of the predefined event","controls that can modify the event path or consequences"],
      "outputs":["diagram of principal risk paths","controls in place","control-failure or escalation factors","potential consequences and post-event measures"],
      "strengths":["simple to understand and visually clear","focuses on controls that should exist and their effectiveness","can represent desirable and undesirable consequences","does not require a high level of expertise for use"],
      "limitations":["cannot represent dependent cause-to-event paths such as fault-tree AND logic","can oversimplify complex situations"],
      "guardrails":["do not quantify unless all stated preconditions are supportable","procedural controls with uncertain effectiveness remain uncertain","brainstorming origin does not make a barrier effective","diagram presence is not evidence that a control is implemented or operating","cascade links require explicit modeling and are not inferred automatically"]
    }
