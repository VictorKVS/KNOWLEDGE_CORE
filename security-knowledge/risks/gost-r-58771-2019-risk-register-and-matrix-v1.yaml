  "title":"ГОСТ Р 58771-2019 — реестры рисков и матрица последствий/вероятности",
  "scope":"Clause-level paraphrase of two reporting and documentation techniques. It records what the visible clauses state and does not prescribe an organization-wide matrix, score, threshold or acceptance rule.",
  "source":{"designation":"ГОСТ Р 58771-2019","status":"Действует","order_number":"1405-ст","order_date":"2019-12-17","effective_from":"2020-03-01","official_registry":"https://protect.gost.ru/gost/details/f35f83b7-a9fd-453b-b1bd-e05035a5009c","public_text":"https://meganorm.ru/Data2/1/4293724/4293724640.htm","section":"Б.9","risk_register_lines":"3176-3222","matrix_lines":"3223-3304"},
  "techniques":[
    {
      "id":"RISK_REGISTER","locator":"Б.9.2","name":"Реестры рисков","purpose":"Consolidate risk information for exposed persons and those responsible for management; document and track individual risks and their management.",
      "usual_core_contents":["short risk description including consequence/event sequence","statement of consequence likelihood","risk sources or causes","current risk controls"],
      "permitted_contextual_contents":["risk category","interdependencies","warning indicators","significance rating","acceptability/tolerability or need for further treatment with reasons","risk and action owners","actions and implementation summaries","budgets and deadlines"],
      "uses":["communicate risk information to stakeholders","highlight important risks","operate at corporate, unit, project or operational level","consolidate information for senior management","track implementation of risk treatment"],
      "inputs":["outputs of risk assessment techniques in Б.1-Б.4","failure reports"],
      "outputs":["record of risk information"],
      "strengths":["consolidates information so required actions can be identified and tracked","places different risks in a comparable accessible format for prioritization","creation can involve many people and raise risk-management awareness"],
      "limitations":["event-based records can poorly describe some risk forms","apparent simplicity can cause overconfidence and confusion between risk, source and control weakness","priority depends on description and aggregation level","significant effort is needed to keep the register current","separate records can impede consolidation into an overall treatment programme"],
      "guardrails":["do not assign a control weakness its own risk level as if it were a separate risk","distinguish risk, risk source and ineffective control","recording interdependencies does not model them automatically","positive consequences and opportunities are not silently collapsed into adverse-event records"]
    },
    {
      "id":"CONSEQUENCE_LIKELIHOOD_MATRIX","locator":"Б.9.3","name":"Матрица последствий/вероятности","aliases":["матрица рисков","тепловая карта"],"purpose":"Display risks by consequence and likelihood and combine the pair to show a relative significance rating.",
      "design_constraints":["define separate consequence and likelihood scales","scale point count is organization-specific; 3, 4 and 5 are common examples only","scales may be qualitative, semi-quantitative or quantitative","numeric level descriptions must fit available data and have stated meanings","consequence scale must connect to organizational objectives and cover the relevant plausible range","matrix design may weight consequence, likelihood or be symmetric depending on use","one matrix position requires one consequence-likelihood pair"],
      "uses":["assess and communicate relative risk magnitude","screen and rank many risks","escalate selected risks to higher management","support an organization-specific acceptability decision","use when data, time or effort are insufficient for more detailed analysis","support criticality or prioritization after other techniques"],
      "inputs":["defined scope of application","data sufficient to define realistic scales","tested matrix design aligned with the organization's attitude to risk","knowledgeable people, ideally a group, supported by available data"],
      "outputs":["display of relative likelihood, consequence and level across risks, with a significance rating for each risk"],
      "strengths":["relatively simple to use","rapidly ranks risks by significance level","clearly visualizes relative significance by consequence, likelihood or level","can compare risks with different consequence types"],
      "limitations":["sound design requires experience","common scales across different circumstances are difficult to define","unambiguous scales and consistent use are difficult","validity depends on scale design and calibration","one indicative consequence can hide a range of consequences","very low likelihood levels can be hard to understand","judgement is subjective and assessors can differ widely","risk ratings cannot be aggregated","different consequence categories are difficult to combine or compare","ranking depends on consistent scenario wording and level of detail"],
      "guardrails":["event likelihood is not automatically the likelihood of each possible consequence","high-consequence low-likelihood and frequent low-impact risks may need different treatment","risks not representable by one consequence-likelihood pair require another representation","a cell does not create a universal decision rule"]
    }
  ],
