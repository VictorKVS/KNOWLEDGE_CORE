  "temporal_rules": [
    "A current source row cannot rewrite the source snapshot used in a historical assessment",
    "A changed source or context is a reassessment trigger, not retroactive invalidation by itself",
    "A formal acceptance record remains evidence of the decision made at its date even when later review is required",
    "Staleness blocks continued reliance when material assumptions changed but does not erase prior evidence",
    "No universal review interval or acceptance expiry is inferred from these sources",
    "Scheduled review and event-triggered review are separately recorded when applicable",
    "Retrieval time, document effective date and data-validity time are distinct",
    "A BDU update is an input change and not an automatic risk-level or treatment decision"
  ],
  "decision_authority_rules": [
    "The organization documents who may approve criteria, treatment and residual-risk acceptance",
    "Technique selection does not confer acceptance authority",
    "Treatment ownership does not automatically confer residual-risk acceptance authority",
    "A system-generated matrix result is not an approval",
    "Delegation must be evidenced and scoped",
    "Acceptance must identify the exact residual-risk state and assumptions",
    "Missing authority evidence blocks the formal acceptance route",
    "A separate binding basis is required before guidance is represented as a mandatory legal duty"
  ],
