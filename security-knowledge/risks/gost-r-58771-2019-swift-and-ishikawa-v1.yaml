  "title":"ГОСТ Р 58771-2019 — SWIFT и метод Исикавы",
  "scope":"Clause-level paraphrase of two qualitative techniques for risk identification and cause analysis. Prompt lists and example cause categories are not treated as exhaustive or mandatory.",
  "source":{"designation":"ГОСТ Р 58771-2019","status":"Действует","order_number":"1405-ст","order_date":"2019-12-17","effective_from":"2020-03-01","official_registry":"https://protect.gost.ru/gost/details/f35f83b7-a9fd-453b-b1bd-e05035a5009c","public_text":"https://meganorm.ru/Data2/1/4293724/4293724640.htm","swift_lines":"1378-1429","ishikawa_lines":"1513-1566"},
  "techniques":[
    {
      "id":"SWIFT","locator":"Б.2.6","name":"Структурированный метод «Что, если?»","purpose":"High-level risk identification used independently or in a staged approach to improve efficiency of bottom-up techniques such as HAZOP or FMEA.",
      "workflow":["trained facilitator prepares a summary list for broad review","workshop establishes scope, scale, purpose and success criteria","predefined guide words are combined with participant prompts","facilitator monitors coverage and introduces additional issues and scenarios","group discusses control adequacy and potential risk-reduction methods","specific risks may be recorded with description, causes, consequences and controls","broader sources, factors, governance or systemic issues may also be identified","qualitative or semi-quantitative ranking may be used for actions"],
      "prompt_topic_classes":["known risks","risk sources and factors","previous experience, successes and incidents","known and existing controls","regulatory requirements and constraints"],
      "uses":["apply to systems, processes, procedures or an organization","study consequences of change and changed or newly created risk","consider positive and negative outcomes","identify systems or processes warranting more detailed HAZOP or FMEA"],
      "inputs":["clear understanding of the system, procedure, installation item or change","understanding of internal and external context","interviews and review of documents, plans and diagrams","facilitator trained in SWIFT"],
      "outputs":["risk register with risk assessments or tasks","basis for a risk-reduction plan"],
      "strengths":["broadly applicable across installations, systems, situations, organizations and activities","requires minimal team preparation","relatively quick and surfaces major risks and sources during the workshop","system-oriented rather than limited to component failure","can identify process and system improvement opportunities","involvement of control and action owners strengthens responsibility","creates a register and reduction plan with less effort"],
      "limitations":["insufficient team experience or incomplete prompts can miss risks and hazards","high-level application may miss complex, detailed or correlated causes","recommendations are often general and need further analysis for robust detailed controls"],
      "guardrails":["summary and prompt lists are coverage aids, not proof of completeness","workshop agreement is not evidence that a control is adequate or effective","qualitative or semi-quantitative ranking requires an explicit organization-specific basis","rendered prompt phrases are preserved as pending primary-byte confirmation"]
    },
    {
      "id":"ISHIKAWA","locator":"Б.3.3","name":"Метод Исикавы («рыбья кость»)","purpose":"Team-based identification and structured graphic display of possible causes of a desirable or undesirable effect, event or problem.",
      "workflow":["define the effect and place it at the diagram head","agree broad cause categories suited to the circumstances","iteratively ask why and how the effect could occur, adding causes and influencing factors","review branches for consistency, completeness and relevance to the principal effect","identify the most important factors using team opinion and available data"],
      "example_category_sets":[["methods","mechanisms","management","materials","workforce"],["materials","methods and processes","environment","equipment","people","measurement"]],
      "uses":["display significant cause-effect relationships","support root-cause analysis of events that occurred","identify factors that could contribute to outcomes not yet observed","apply at any organizational level and time horizon"],
      "quantification_boundary":"Although probabilities may sometimes be considered according to confidence in causes, interacting, indirect and unidentified factors often make quantification irrelevant.",
      "inputs":["participant knowledge","participant experience","understanding of the situation examined"],
      "outputs":["identified possible causes of the analyzed effect","Ishikawa or tree diagram with categories, branches and sub-branches"],
      "strengths":["encourages participation and uses group knowledge","supports creative brainstorming","applies to a wide range of situations","provides structured cause analysis with readable graphic output","offers a neutral setting for reporting problems","can identify contributing factors for adverse effects and use a positive focus to broaden participation"],
      "limitations":["early division into categories can inadequately represent interactions between categories","causes outside the selected categories may remain unidentified"],
      "guardrails":["example categories are optional and context-specific","team opinion does not prove causation or relative importance","consistency review does not prove completeness","correlation is not silently converted to cause","rendered phrase 'основному офису' remains pending primary-byte confirmation rather than corrected"]
    }
  ],
