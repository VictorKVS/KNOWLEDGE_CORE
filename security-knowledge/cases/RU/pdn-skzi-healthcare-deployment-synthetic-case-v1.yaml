  "scope_boundary": "This is an anonymized synthetic regression case. Names, system, level, threat type, products, contracts and licence facts are not observations about a real healthcare organisation.",
  "case_profile": {
    "case_kind": "SYNTHETIC_ANONYMIZED_REGRESSION_FIXTURE_NOT_A_REAL_ORGANIZATION",
    "sector": "healthcare",
    "operator": "OPERATOR_HOSPITAL_GROUP_SYNTHETIC",
    "system": "ISPDN_MEDICAL_EXCHANGE_SYNTHETIC",
    "processing": "medical records exchanged between operator sites and a regional service",
    "provided_protection_level": 2,
    "provided_actual_threat_type": 2,
    "crypto_use": "protected remote communication channels implemented with SKZI",
    "required_minimum_class_from_fixture_inputs": "KV_OR_HIGHER",
    "candidate_pp_313_works": [
      12,
      13,
      27
    ],
    "boundary": "Protection level, threat type, topology and works are fixture inputs. The model does not infer them for a real healthcare system."
  },
  "decision_checkpoints": [
    {
      "id": "CP01",
      "check": "ISPDn scope and operator identity",
      "positive_evidence": "approved system boundary and processing inventory",
      "negative_or_missing": "SCOPE_PENDING"
    },
    {
      "id": "CP02",
      "check": "protection level and source facts",
      "positive_evidence": "approved PP 1119 determination",
      "negative_or_missing": "LEVEL_EVIDENCE_PENDING"
    },
    {
      "id": "CP03",
      "check": "actual threat type and threat model",
      "positive_evidence": "current approved model with source evidence",
      "negative_or_missing": "THREAT_EVIDENCE_PENDING"
    },
    {
      "id": "CP04",
      "check": "actual cryptographic use and role",
      "positive_evidence": "architecture, configuration and crypto inventory",
      "negative_or_missing": "CRYPTO_DISCOVERY_PENDING"
    },
    {
      "id": "CP05",
      "check": "class and exact certified product scope",
      "positive_evidence": "KV-or-higher native class and exact version/configuration certificate evidence",
      "negative_or_missing": "PRODUCT_OR_CLASS_PENDING"
    },
    {
      "id": "CP06",
      "check": "actual PP 313 work and performer",
      "positive_evidence": "work evidence separating installation, protected-system installation and channel service",
      "negative_or_missing": "ACTIVITY_CLASSIFICATION_PENDING"
    },
    {
      "id": "CP07",
      "check": "performer licence at the relevant date",
      "positive_evidence": "signed extract or immutable record with exact work, identity, place and interval",
      "negative_or_missing": "LICENCE_SCOPE_OR_TIME_PENDING"
    },
    {
      "id": "CP08",
      "check": "Order 378 operation",
      "positive_evidence": "keys, media, access, premises, journals and periodic controls",
      "negative_or_missing": "OPERATIONAL_EVIDENCE_PENDING"
    }
  ],
  "scenario_fixtures": [
    {
      "id": "HC-S01",
      "facts": {
        "crypto_policy": false,
        "crypto_inventory": "UNKNOWN",
        "network_observation": "UNKNOWN"
      },
      "expect": "CRYPTO_DISCOVERY_PENDING",
      "reason": "absence of a policy is not evidence that SKZI is absent"
    },
    {
      "id": "HC-S02",
      "facts": {
        "skzi_detected": true,
        "order_378_documents": false
      },
      "expect": "IMPLEMENTATION_EVIDENCE_PENDING",
      "reason": "actual SKZI use activates the Order 378 evidence route regardless of policy completeness"
    },
    {
      "id": "HC-S03",
      "facts": {
        "protection_level": 2,
        "actual_threat_type": 2,
        "skzi_class": "KS1"
      },
      "expect": "CLASS_INSUFFICIENT_FOR_FIXTURE",
      "reason": "the fixture requires KV or higher for UZ2 and threat type 2"
    },
    {
      "id": "HC-S04",
      "facts": {
        "protection_level": 2,
        "actual_threat_type": 2,
        "skzi_class": "KV",
        "product_scope": "EXACT",
        "contractor_licence": "ACTIVE_BUT_WORKS_UNKNOWN"
      },
      "expect": "LICENCE_SCOPE_PENDING",
      "reason": "active status without exact PP 313 work does not prove the contractor's authority"
    },
    {
      "id": "HC-S05",
      "facts": {
        "protection_level": 2,
        "actual_threat_type": 2,
        "skzi_class": "KV",
        "product_scope": "EXACT_VALID",
        "actual_work": 13,
        "contractor_licence_work": 13,
        "licence_interval": "COVERS_EVENT",
        "order_378_evidence": "COMPLETE_SYNTHETIC"
      },
      "expect": "VERIFIED_SYNTHETIC_FIXTURE_ONLY",
      "reason": "all modeled gates are complete; no real-world assertion follows"
    },
    {
      "id": "HC-S06",
      "facts": {
        "current_product_status": "ACTIVE",
        "current_licence_status": "ACTIVE",
        "incident_date": "EARLIER_DATE",
        "historical_events": "MISSING"
      },
      "expect": "HISTORICAL_EVIDENCE_PENDING",
      "reason": "current status cannot be projected backwards"
    },
    {
      "id": "HC-S07",
      "facts": {
        "encrypted_media": true,
        "media_register": false
      },
      "expect": "MEDIA_ACCOUNTING_NONCONFORMITY_SYNTHETIC",
      "reason": "encryption does not remove item-by-item accounting"
    },
    {
      "id": "HC-S08",
      "facts": {
        "contractor_work": 20,
        "beneficiary": "CUSTOMER",
        "own_needs_exception": true
      },
      "expect": "EXCEPTION_REJECTED_SYNTHETIC",
      "reason": "customer service cannot inherit the contractor's own-needs maintenance exception without qualifying facts"
    }
  ],
  "allowed_outputs": [
    "VERIFIED_SYNTHETIC_FIXTURE_ONLY",
    "NOT_APPLICABLE_WITH_EVIDENCE",
    "CLASS_INSUFFICIENT_FOR_FIXTURE",
    "SCOPE_OR_ACTIVITY_NONCONFORMITY_SYNTHETIC",
    "EVIDENCE_PENDING",
    "CONFLICT_REVIEW"
  ],
  "stages": [
    "load the explicitly synthetic system and processing profile",
    "validate protection-level evidence rather than sector inference",
    "validate threat type and attacker-capability assumptions",
    "discover actual SKZI use and choose the Order 378 route",
    "match minimum class and exact certified product scope",
    "classify actual PP 313 work, performer, beneficiary and exception",
    "match licence work, place and historical interval",
    "verify operational evidence and issue a fixture-only result with reasons"
  ],
  "red_team_attacks": [
    {
      "id": "RT01",
      "attack": "treat the healthcare sector as automatic proof of UZ2",
      "blocked_by": "the level is a fixture input and real systems require PP 1119 source facts",
      "blocked": true
    },
    {
      "id": "RT02",
      "attack": "infer threat type 2 from the use of remote channels",
      "blocked_by": "the threat type requires an approved threat model",
      "blocked": true
    },
    {
      "id": "RT03",
      "attack": "assume that a VPN product name proves SKZI use and certificate scope",
      "blocked_by": "exact product, version, configuration, class and evidence are required",
      "blocked": true
    },
    {
      "id": "RT04",
      "attack": "accept KS1 for the UZ2/type-2 fixture because it is certified",
      "blocked_by": "Order 378 mapping requires KV or higher for these supplied inputs",
      "blocked": true
    },
    {
      "id": "RT05",
      "attack": "infer PP 313 work 12, 13 or 27 solely from a procurement title",
      "blocked_by": "actual performed actions and contract evidence control classification",
      "blocked": true
    },
    {
      "id": "RT06",
      "attack": "accept an active contractor licence without exact works",
      "blocked_by": "the licence scope must contain the work actually performed",
      "blocked": true
    },
    {
      "id": "RT07",
      "attack": "treat the product certificate as proof of contractor licensing",
      "blocked_by": "product and actor evidence routes remain separate",
      "blocked": true
    },
    {
      "id": "RT08",
      "attack": "treat the contractor licence as proof of product certification",
      "blocked_by": "actor and product evidence routes remain separate",
      "blocked": true
    },
    {
      "id": "RT09",
      "attack": "project current certificate and licence states to the incident date",
      "blocked_by": "historical events and valid-time intervals are required",
      "blocked": true
    },
    {
      "id": "RT10",
      "attack": "skip removable-media accounting because media is encrypted",
      "blocked_by": "Order 378 item-by-item accounting remains required",
      "blocked": true
    },
    {
      "id": "RT11",
      "attack": "apply the own-needs exception to third-party customer service",
      "blocked_by": "performer, beneficiary and actual work must satisfy the exception",
      "blocked": true
    },
    {
      "id": "RT12",
      "attack": "publish the synthetic VERIFIED result as a conclusion about a real hospital",
      "blocked_by": "fixture identity and synthetic-only result prevent real-world attribution",
      "blocked": true
    }
  ],
