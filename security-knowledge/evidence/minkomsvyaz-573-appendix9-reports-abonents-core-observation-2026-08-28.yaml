  "observations":[
    "Модуль экспортирует только AbonentsReport; обязательные id/data связаны через два варианта TAGGED.",
    "reportAbonent и reportService точно связывают свои OID с SEQUENCE OF AbonentsRecord и AbonentService.",
    "AbonentsRecord содержит 16 полей: восемь обязательных и восемь опциональных.",
    "Опциональные теги AbonentsRecord равны 0, 1, 3, 4, 5, 6, 8, 9; поля для пропусков 2 и 7 не придуманы.",
    "ActiveStatus содержит только active(0) и not-active(1); ActiveServices не публикует ограничения количества.",
    "LineData содержит пять опциональных UTF8String 1..128 с тегами 0..4; пустая SEQUENCE имеет только синтаксический статус.",
    "Standard является alias NetworkType.",
    "AbonentService содержит семь полей: пять обязательных, два опциональных; service-id ограничен 0..4294967295.",
    "Порядок временных границ, уникальность service-id и зависимость статуса от дат или услуг не опубликованы.",
    "Слитые NetworkPeerInfoOPTIONAL/DateAndTimeOPTIONAL и регистр Networkidentifiers не исправлены предположением."
