subject: "Current implementing act for PP 538/2005 point 8"
observations:
  - Official publication identifier 0001202208020018 resolves to the joint order dated 28.03.2022 numbered 245/127.
  - The act was registered by the Ministry of Justice on 02.08.2022 as number 69480.
  - The current text interface records entry into force on 13.08.2022 and current status as of the check date.
  - Order 245/127 expressly repealed joint Order 391/437; the predecessor is not used after 12.08.2022.
  - The attached requirements contain six numbered points, thirteen point-2 content groups and five point-3 attachment groups.
  - The order requires plan-specific deadline fields but states no universal numeric number of days or months for them.
  - The connecting-operator route is conditional and requires agreement plus the point-6 facts; it is not a general outsourcing permission.
  - This act implements PP 538 point 8 only and does not close the separate point-4 and point-6 technical-requirement family.
