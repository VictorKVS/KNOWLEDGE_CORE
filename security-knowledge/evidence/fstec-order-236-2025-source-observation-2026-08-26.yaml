observations:
  - "FSTEC Order No. 236 is the competent-authority form referenced by current PP RF No. 127 paragraph 17."
  - "The current form is the 11 July 2025 edition created by Order No. 247 and effective from 1 September 2025."
  - "The current form contains nine sections and 34 numbered fields; fields 1.7 and 1.8 were added in 2025."
  - "Order No. 59 has required paper submission with electronic copies in ODS spreadsheet format since 30 April 2019."
  - "The form contains the recipient, conditional classification mark, signature, conditional seal and date, but it does not itself establish the PP RF No. 127 submission deadline."
  - "Section 9 is expressly scoped to organizational and technical measures for a significant KII object."
  - "Current field 5.4 preserves alternatives: conformity-document details, information that assessment was not conducted, or absence of security tools."
