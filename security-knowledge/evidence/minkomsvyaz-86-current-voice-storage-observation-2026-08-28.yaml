checked_at: "2026-08-28"
subject: "Current voice-information storage SORM equipment requirements under Order 86 as amended by Orders 47 and 1196"
observations:
  - Order 86 was registered on 28.03.2018 as number 50536, officially published on 29.03.2018 and took effect on 09.04.2018.
  - Order 47 took effect on 01.09.2023, repealed point 5.7, changed deep appendix-3 protocol provisions and limited Order 86 through 31.08.2029.
  - Order 1196 took effect on 15.03.2026 and repealed only subpoint 2.9 of Order 86 concerning data transmission for voice as an enumerated license service.
  - Point 4 and appendix-2 row 9 still contain voice-data-network text; that text is preserved as a fail-closed tension and is not used to restore repealed subpoint 2.9.
  - The current license scope contains eight service families and the technical means may sit on terminal, transit and terminal-transit nodes within the act's enumerated routes.
  - Passive collection, four accumulated-content families, one head control point and at most one hundred control points are preserved.
  - Connection start, end and duration are second-precise; a failed connection has duration zero and the technical-means clock is synchronized to UTC.
  - Access to stored content begins no later than ten seconds after connection end.
  - Order 86 starts the retention clock at connection end or message-transfer end but does not itself define the retention duration; the duration and capacity route remain in PP 445.
  - Mobile channel minima are 4, 10, 100, 300 and 500 Mbit/s across five subscriber bands; fixed minima are 4, 10 and 100 Mbit/s across three textual bands.
  - The exact 100-thousand boundary in the fixed table is left fail-closed because the displayed ranges touch; no invented exclusive/inclusive interpretation is applied.
  - Total query-result transfer rate is capped at seventy percent of the control channel.
  - For one to one hundred simultaneous statistical queries, identifier times are three, five and fifteen seconds for one day, one month and six months; DPC/OPC or base-station routes use seven minutes.
  - Result transfer starts within two seconds per requested day and matching stored-content transfer within ten seconds.
  - Fixed-network point 17.2 states storage of text, voice and video; mobile point 18.2 states text and voice, so mobile video storage is not invented from a receipt rule.
  - PP 1656 expressly preserves Order 86 in the current mandatory communications-requirements contour.
  - Deep appendix-3 fields, codes, bits, diagrams and state tables and current consolidated immutable bytes remain pending.
