subject: "Order 573 appendix 9 Dictionaries.asn telco, bunch and basic-station records"
observations:
  - Order 630 point 21 replaced appendix 9 in full with effect from 1 March 2024.
  - TelcosRecord has exactly six fields; telco-id, begin-time and description are required, end-time, mcc and mnc are optional.
  - TelcosRecord mcc and mnc use tags 0 and 1 and exact NumericString length three; description is UTF8String length 1 through 256.
  - BunchRecord has exactly seven fields and its end-time is optional.
  - BunchRecord bunch-type contains inbound(0), outbound(1) and bidirectional(3); value 2 is not assigned and no meaning was inferred.
  - BasicStationSectorRecord has exactly nine fields and, unlike the other two records, its end-time is required.
  - BasicStationSectorRecord structured-address and location are optional with tags 0 and 1.
  - BasicStationIdentifiers has telephone tag 0 and wireless tag 1 alternatives.
  - TelephoneIdentifiers constrains lac to 0..65535, cell to 0..100000000000 and optional cell-sign to length 1..18.
  - WirelessIdentifiers requires cell length 1..64 and makes IPList and a six-octet mac optional.
  - BasicStationAntenna has GSM tag 0, CDMA tag 1 and wireless tag 2 alternatives; no count limits were added to SEQUENCE OF branches.
  - GsmAntenna has three required geometry fields and fourteen optional fields tagged consecutively 0 through 13.
  - CdmaAntenna and WirelessAntenna both alias BroadbandWirelessParameters, which has three required and seven optional fields.
  - BsCellType, BsGeneration, BsSetting values and BasicStationType were preserved literally from the consolidated text.
  - Consolidated HTML omits an assignment token in the rendered BsSetting declaration and joins several type/OPTIONAL tokens.
  - The GsmAntenna azimuth range includes -1 while the rendered explanatory comment mentions 1; no special-value semantics were normalized.
