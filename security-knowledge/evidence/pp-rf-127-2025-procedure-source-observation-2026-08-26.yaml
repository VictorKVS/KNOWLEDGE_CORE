observations:
  - "The active procedural layer contains 30 structural units from paragraphs 1-22, including numbered insertions 6(1), 11(1)-11(3), 14(1)-14(2), and 19(1)-19(3)."
  - "Eight repealed atomic items across six route groups are retained only as blocked historical paths."
  - "Categorization is performed by a permanent commission created by the KII subject head; mandatory, conditional, optional, branch and dissolution routes are modeled separately."
  - "The commission must determine each applicable indicator value or justify non-applicability and must model worst-case targeted attacks with maximum possible damage."
  - "The act is retained until object decommissioning or category change; one act may cover multiple objects of the same subject."
  - "The ordinary and both newly-created-object submissions use 10 working days; changed information uses 20 working days."
  - "Paragraph 19(2) says 30 days without a working/calendar qualifier; the model therefore uses DAYS_UNQUALIFIED and does not claim calendar days."
  - "The review period is at least once every five years unless sectoral categorization features establish another period."
  - "A newly created unlisted object with consequence scale matching the criteria is categorized and also triggers a proposal to supplement the typical sector list."
