checked_at: "2026-08-28"
subject: "Current packet-switching and routing SORM equipment requirements under Order 83/2014 as amended by Order 139/2019"
observations:
  - The current index identifies Order 83 in the 15.04.2019 revision made by Order 139.
  - The base act took effect on 29.07.2014; the one-time operator transition deadline of 31.03.2015 is historical and not recurring.
  - Order 139 was registered on 02.07.2019 as number 55102, officially published on 03.07.2019 and took effect on 14.07.2019.
  - The current scope covers packet-switching and routing equipment in public and dedicated communications networks used for telematic, voice-data and non-voice-data services.
  - The current open core contains sixteen control points, one head control point, twenty control-parameter types, a minimum capacity of 2000 control-parameter values and up to 2000 message-filter criteria.
  - Order 139 added the IS BD ORM connection and protocol route, seven control-parameter types, all-connection statistics and message-content transfer routes, and ten filter-type families.
  - Without head-control-point filters, user message content is transferred to IS BD ORM in full volume; with filters, matching messages are excluded under the act's route.
  - The old point 4.10 twelve-hour ring-buffer recording and old point 4.11 reprocessing route were deleted by Order 139 and are not current requirements.
  - The remaining two-gibibyte volatile selected-information memory is a load-leveling capacity and is not treated as a retention period.
  - The seven equipment classes retain exact input thresholds and three distinct output-capacity rules.
  - PP 1656 expressly preserves Order 83 in the current mandatory communications-requirements contour.
  - Deep command, response, notice, item and filter tables and current immutable consolidated bytes remain pending.
