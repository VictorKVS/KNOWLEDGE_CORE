subject: "Current mobile-radiotelephone terminal-transit-node SORM requirements under Order 645/2016"
observations:
  - The current index identifies Order 645 as acting in its original 12.12.2016 edition.
  - The act was registered on 13.01.2017 as number 45201 and officially published on 16.01.2017.
  - The act states that it takes effect after 180 days following official publication; the effective date is 16.07.2017.
  - Order 174/2011 is the predecessor and is not applicable from the Order 645 effective date.
  - PP 1656 of 09.10.2023 expressly lists Order 645 in the current preserved mandatory communications-control contour.
  - The Rules contain twenty-one body points and thirteen appendices.
  - Body point 5 contains thirteen functional groups; appendix 1 contains functions 1.1 through 1.16.
  - MSISDN, IMSI, IMEI and full or incomplete phone-number routes are distinct and are not collapsed.
  - The verified open core includes 200 milliseconds, two interface variants, three TCP ports, multi-control-point and multi-operator isolation.
  - Exact command, message, byte, bit and code tables in appendices 3 to 9 are not claimed verified without immutable page review.
