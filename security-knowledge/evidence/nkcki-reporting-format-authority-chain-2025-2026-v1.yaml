slice_id: NKTSKI-REPORTING-FORMAT-AUTHORITY-CHAIN-2025-2026-V1
observed_at: 2026-08-19T07:02:53+03:00
scope: >
  Authority and binding chain for NKTsKI-defined GosSOPKA reporting formats and technical parameters.
  Exact printed field labels, requiredness and reference values are hash-bound in the companion
  payload-schema record. Automated protocol serialization remains separately pending.

sources:
  - id: FSB-540-2025
    type: NPA_RF
    title: Приказ ФСБ России от 24.12.2025 № 540
    registration: Минюст России 25.12.2025 № 84777
    publication_id: '0001202512250025'
    publication_date: 2025-12-25
    effective_from: 2026-01-30
    evidence_level: AUTHORITATIVE_VERIFIED
    authority_effect:
      - amended NKTsKI Regulation paragraph 4.10 so NKTsKI determines the composition of technical parameters of a computer attack and computer incident indicated when information is submitted to GosSOPKA and communicates it to covered actors
      - added authority to develop interaction regulations needed for NKTsKI functions
  - id: FSB-546-2025
    type: NPA_RF
    title: Приказ ФСБ России от 25.12.2025 № 546
    effective_from: 2026-01-30
    evidence_level: AUTHORITATIVE_VERIFIED
    binding_effect:
      - information exchange is performed in accordance with GosSOPKA attack/incident reporting formats and composition of technical parameters determined by NKTsKI
  - id: NKTSKI-ORDER-2-2026
    type: REGULATOR_ACT
    title: Приказ НКЦКИ от 14.07.2026 № 2
    observed_on_official_index: true
    evidence_level: IMMUTABLE_PRIMARY
