model_id: SEC-EVID-CREDENTIAL-LIFECYCLE-0001
version: "1.0"
status: INTERNAL_ENGINEERING_CONTROL
scope: >
  Audit/evidence model for credential, token, key, certificate and session lifecycle states.
  This model is not itself a legal obligation and must be bound to authoritative domain-specific
  requirements before being presented as mandatory compliance.

object_types:
  - PASSWORD
  - API_TOKEN
  - SSH_KEY
  - CERTIFICATE
  - SESSION
  - SERVICE_CREDENTIAL
  - MFA_FACTOR

minimum_observed_facts:
  - issued
  - activated
  - revoked
  - expired
  - session_active
  - owner_current
  - evidence_fresh

states:
  NOT_ISSUED:
    meaning: "Credential was not issued and no activation/session evidence exists."
  ISSUED_NOT_ACTIVE:
    meaning: "Issued but not activated; no active session is proven."
  ACTIVE_VALID:
    meaning: "Issued, activated, not revoked/expired, owner current, and lifecycle evidence fresh."
  REVOKED_CLOSED:
    meaning: "Revocation is evidenced and no residual active session remains."
  EXPIRED_CLOSED:
    meaning: "Expiry is evidenced and no residual active session remains."
  RESIDUAL_SESSION_RISK:
    meaning: "Credential is revoked while an authenticated session remains active."
  EXPIRED_ACTIVE_RISK:
    meaning: "Credential is expired while an authenticated session remains active."
  ORPHANED_CREDENTIAL_RISK:
    meaning: "Credential remains usable while its owner/role relationship is no longer current."
  NOT_PROVEN:
    meaning: "Evidence is stale, incomplete or insufficient for a safe lifecycle conclusion."
  STATE_CONFLICT:
    meaning: "Observed lifecycle facts are logically incompatible and require investigation."

fail_closed_rules:
  - "stale lifecycle evidence => NOT_PROVEN"
  - "revoked + active session => RESIDUAL_SESSION_RISK"
  - "expired + active session => EXPIRED_ACTIVE_RISK"
  - "active session without activation evidence => STATE_CONFLICT"
  - "revocation/expiry alone does not prove session termination"
  - "owner departure/role removal must not be treated as credential closure without technical evidence"

required_evidence_examples:
  issuance:
    - identity_or_service_owner
    - credential_identifier_or_fingerprint
    - issuing_system
    - issued_at
  activation:
    - activated_at
    - activation_event_or_state_snapshot
  revocation:
    - revoked_at
    - revocation_event_or_authoritative_state
  expiry:
    - expires_at
    - observed_at
  session_closure:
    - session_identifier
    - termination_event_or_post_revocation_session_query
  ownership:
    - current_identity_or_service_binding
    - role_or_employment_state_snapshot
  freshness:
    - observed_at
    - source_system
    - evidence_hash_or_locator

integration_points:
  - access_entitlement_evidence_chain
  - segregation_of_duties_conflict_model
  - source_reconciliation
  - temporal_routing
  - evidence_audit

promotion_rule: >
  Bind any lifecycle state to a Russian regulatory obligation only when the applicable primary or
  authoritative source, exact scope, effective dates and evidence locator are proven. Internal
  risk states remain engineering findings otherwise.
