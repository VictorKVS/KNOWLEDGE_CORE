checked_at: "2026-08-28"
subject: "Order 573 appendix 9 Dictionaries.asn roaming, switches and gates records"
observations:
  - Order 630 point 21 replaced appendix 9 in full with effect from 1 March 2024.
  - RoamingPartnerRecord has five fields; telco-id, roaming-id, begin-time and description are required while end-time is optional.
  - RoamingPartnerRecord constrains roaming-id to 0..4294967295 and description to UTF8String length 1..256.
  - SwitchesRecord has nine fields; only end-time and switch-sign are optional.
  - SwitchesRecord constrains switch-id to length 1..128, description to 1..256 and optional NumericString switch-sign to 1..18.
  - SwitchesRecord requires NetworkType, ReportedAddress and switch-type.
  - Switch type contains exactly internal(0) and border(1).
  - GatesRecord has eight fields; only end-time is optional.
  - GatesRecord constrains gate-id to 0..4294967295 and description to length 1..256.
  - GatesRecord requires IPList and ReportedAddress.
  - Gate type contains exactly sgsn(0), ggsn(1), smsc(2), gmsc(3), hss(4), pstn(5), voip-gw(6), aaa(7) and nat(8).
  - IPList is SEQUENCE OF NetworkPeerInfo without a published element-count constraint.
  - An empty IPList is syntactically possible under that ASN.1 shape, but no operational meaning or usable-gate conclusion was inferred.
  - No retention, refresh, deactivation grace period or unknown enum extension was added.
