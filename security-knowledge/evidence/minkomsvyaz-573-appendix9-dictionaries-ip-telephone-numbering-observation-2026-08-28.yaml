subject: "Order 573 appendix 9 Dictionaries.asn IP and telephone numbering records"
observations:
  - Order 630 point 21 replaced appendix 9 in full with effect from 1 March 2024.
  - IpNumberingPlanRecord has six fields; only end-time is optional.
  - Its description is UTF8String length 1..256 and both IPAddress and IPMask fields are required.
  - TelephoneNumberingPlanRecord has 24 fields; 20 are required and four are optional.
  - The four optional fields have explicit tags 0, 1, 2 and 3 in source order.
  - Country code is UTF8String of exact length 3, not NumericString.
  - National significant number is UTF8String of exact length 14.
  - Area-code length is 0..6; subscriber-number minimum and maximum fields are each independently 1..15.
  - UTC minimum and maximum fields are each independently -12..12.
  - Capacity boundaries are NumericString length 1..15 and capacity-size is 1..10000000.
  - Location and registrar allow UTF8String length 0..256 syntactically; no business meaning was assigned to an empty value.
  - MCC and MNC are required NumericString fields of exact length 3.
  - The rendered range-deactivation token joins DateAndTime and OPTIONAL; exact syntax is pending primary-PDF confirmation.
  - The rendered range-status size expression has mismatched parentheses; exact syntax is pending primary-PDF confirmation.
  - No ISO registry membership, uppercase rule, min/max ordering or capacity-cardinality equation was inferred.
