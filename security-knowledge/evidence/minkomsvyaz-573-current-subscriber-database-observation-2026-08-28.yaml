checked_at: "2026-08-28"
subject: "Current subscriber-database IS ORM requirements under Order 573 as amended by Orders 630 and 1196"
observations:
  - Order 573 was registered on 18.12.2018 as number 53028, officially published on 19.12.2018 and took effect on 30.12.2018.
  - Order 630 took effect on 01.03.2024 and limits Order 573 through 29.02.2030; it changed certification, service references, data-network and telephone routes, interfaces, buffers and ASN.1.
  - Order 1196 took effect on 15.03.2026 and repealed exactly subpoint 13 of point 5 and row 13 of appendix 10.
  - The repealed voice-data service and appendix row are not restored by analogy or nearby remaining text.
  - Current point 5 contains thirteen active service routes and the IS ORM placement route remains operator communication nodes in Russia.
  - Interaction with the control point uses exactly five channels: control, data, monitoring, unformatted data and user-message delivery.
  - Message content is stored up to six months from the end of receipt, transmission, delivery or processing and is deleted automatically under PP 445 point 8.
  - Subscriber, user, identifier and service information is stored three years; data-network actions and telephone/location information use separate three-year routes.
  - Order 573 does not define the PP 445 storage-capacity route and does not turn “up to six months” into an exact universal six-month period.
  - Order 630 added current DNS, STUN, hosting-account, VoWiFi, location and five-minute data-flow aggregation routes.
  - Mutual authentication uses TLS 1.2; no later protocol version is invented from modern practice.
  - Preliminary-processing limits are 5 seconds, 30 seconds, 5 minutes or 10 minutes according to the seven exact point-34 routes.
  - Four point-35 direct-search routes use 1, 1, 3 and 1 seconds; at least one hundred simultaneous search tasks are required.
  - The cyclic buffer retains mobile connection/disconnection/location information at least three days and data-network connection information at least one day; location events become available over kpd4 within five minutes.
  - Deep ASN.1, fields, codes and appendix tables and the consolidated current official immutable bytes remain pending.
