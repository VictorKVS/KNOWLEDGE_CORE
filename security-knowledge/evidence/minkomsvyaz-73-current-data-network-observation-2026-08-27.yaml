checked_at: "2026-08-27"
subject: "Current data-network technical requirement layer under PP 538 points 4, 6 and 11"
observations:
  - Current Order 73 edition is dated 18.12.2025 and applies from 15.03.2026.
  - Amending Order 1196 was registered as 85531, officially published on 04.03.2026 and applies from 15.03.2026.
  - Item 4 of the amendment replaced only the first paragraph of point 1 of Order 73 requirements.
  - Current scope covers telematic services and data transmission services but excludes data transmission for voice information.
  - Order 73 specifies and supplements, rather than replaces, Part I under Order 6.
  - The body contains three numbered points; Appendix 1 contains five interface families and 25 entries.
  - Appendix 2 contains three protocol routes and eleven tables for allocation and termination messages.
  - No retention, notification, remediation or testing interval is stated in Order 73.
