subject: "Order 573 appendix 9 Dictionaries.asn call, service, pay and termination records"
observations:
  - Order 630 point 21 replaced appendix 9 in full with effect from 1 March 2024.
  - CallsTypesRecord is the literal source identifier; it has five fields and only end-time is optional.
  - CallTypesRecord is not introduced as a normalized alias.
  - Call type, service and pay identifiers each have the exact range 0..4294967295.
  - SupplementServicesRecord has six fields; mnemonic and end-time are optional.
  - The optional service mnemonic is UTF8String length 1..64.
  - PayTypesRecord has five fields and only end-time is optional.
  - TerminationCausesRecord has six fields and only end-time is optional.
  - The termination cause identifier has the narrower exact range 0..16384.
  - NetworkType is required in TerminationCausesRecord.
  - Each description is required UTF8String length 1..256.
  - The four report values are SEQUENCE OF their respective record types without a published element-count constraint.
  - The consolidated HTML renders the termination-causes OID with a closing parenthesis instead of a closing brace; the delimiter is pending primary-PDF confirmation.
  - No retention, refresh, identifier-reuse period or ASN.1 compilability claim was inferred.
