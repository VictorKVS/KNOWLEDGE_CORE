subject: "Current general SORM network requirements under Order 6/2008"
observations:
  - The current index identifies the original 16.01.2008 edition as effective and unchanged.
  - The act was registered by the Ministry of Justice on 31.01.2008 as number 11057.
  - It is included in the PP 2467 list exempt from regulatory-guillotine cancellation from 01.01.2021.
  - The body contains twelve numbered points and the technological-room appendix contains four numbered points.
  - Scope includes public-network telecommunications networks and dedicated networks, with express telegraph, Telex and licence-condition exclusions.
  - Channel-provision networks are excluded from point 2 and use the separate request route in point 4.
  - No retention, response, notification, remediation or testing period is stated in the act.
  - The Ministry PDF endpoint was located, but immutable bytes were not retrieved in this run.
