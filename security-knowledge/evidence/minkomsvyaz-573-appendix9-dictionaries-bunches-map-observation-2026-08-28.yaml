subject: "Order 573 appendix 9 Dictionaries.asn bunches map records"
observations:
  - Order 630 point 21 replaced appendix 9 in full with effect from 1 March 2024.
  - bunchesMapRecords maps sorm-report-dictionary-bunches-map to SEQUENCE OF BunchesMapRecord.
  - BunchesMapRecord has four fields; a-bunch, b-bunch and begin-time are required, while end-time is optional.
  - Both endpoint fields have type BunchMapPoint.
  - BunchMapPoint has three required fields: telco-id, switch-id and bunch-id.
  - switch-id is UTF8String length 1..128.
  - telco-id has imported type TelcoID and bunch-id has imported type Bunch.
  - No directionality was inferred from the endpoint names a-bunch and b-bunch.
  - No endpoint-distinctness, cross-telco, symmetric deduplication or global uniqueness rule was inferred.
  - No switch or bunch referential-integrity rule was inferred from the imported types alone.
  - The report value is SEQUENCE OF BunchesMapRecord without a published element-count constraint.
  - No retention, refresh, reconciliation or identifier-reuse period was added.
