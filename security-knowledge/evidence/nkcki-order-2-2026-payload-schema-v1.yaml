cross_field_rules:
  - id: INDICATOR-OVERFLOW-001
    applies_to: [malicious_ipv4, malicious_ipv6, malicious_domain, malicious_uri, malicious_email]
    rule: >-
      At most 30 indicators may be placed in each named field. If there are more than 30,
      provide them in indicators.txt, one indicator per line without separators.
  - id: PDN-CONDITIONAL-001
    if: pdn_leak == true
    require:
      - pdn_operator_address
      - pdn_notification_email
      - pdn_presumed_causes
      - pdn_characteristics
      - pdn_presumed_harm
  - id: REFERENCE-VALUE-CLOSED-001
    rule: "Where the table says strictly reference value, unlisted values are not allowed."

workflow_bindings:
  fsb_order_547:
    role: DEADLINES_AND_RESPONSE_PROCEDURE
    binding: >-
      Use the appropriate attack or incident schema for the information sent under clause 3;
      the payload schema does not modify the 3-hour/24-hour clocks in Order No. 547.
    payload_schema_does_not_modify_deadlines: true
  fsb_order_548:
    role: CONTINUOUS_INTERACTION_CHANNEL_AND_DELIVERY_CONFIRMATION
    binding: >-
      Clause 3 routes the NKTsKI-defined format through the registered personal account;
      the reserve postal/email route retains the same format. Clause 6 identifier evidence
      confirms transfer but does not prove field completeness.
    reserve_channel_retains_schema: true
    identifier_is_not_completeness_proof: true

red_team:
  verdict: PASS_TABLE_SCHEMA_EXTRACTION_PROTOCOL_SERIALIZATION_PENDING
  blocked_overclaims:
    - "No machine transport key is inferred from a printed Russian field label."
    - "No effective date absent from the order is invented."
    - "Applicant is not silently downgraded from the printed mandatory status."
    - "Delivery confirmation is not equated with field-level completeness."
    - "Order No. 2 does not alter Order No. 547 deadlines."
  pending:
    - "Acquire and version the separate automated-interaction rules/protocol description referenced in Order No. 2 clause 3."
    - "Resolve exact historical applicability start only from authoritative version evidence."
  protocol_publication_status: security-knowledge/evidence/nkcki-automated-interaction-protocol-publication-status-2026-08-19.yaml
