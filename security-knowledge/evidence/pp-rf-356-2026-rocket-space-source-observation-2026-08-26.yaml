  - "Paragraph 9 defines five scoped indicator-applicability routes and preserves two Roscosmos exceptions."
  - "Paragraph 10 requires four per-object assessments; indicator applicability is not itself category assignment."
  - "Paragraphs 12 and 13 contain four full formula images and two image-only variable glyphs. Variable meanings and periods are modeled, but numeric execution is fail-closed."
