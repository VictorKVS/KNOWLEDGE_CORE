subject: "Order 573 appendix 9 Classification.asn OID registry and source anomalies"
observations:
  - Order 630 point 21 replaced appendix 9 in full; the replacement applies from 1 March 2024.
  - The current public consolidated text declares module Classification with IMPLICIT TAGS.
  - TAGGED contains a unique ObjectDescriptor field &id and an open field &Data, with syntax OID &id DATA &Data.
  - OID is an alias of ObjectDescriptor in this module; it is not treated as ASN.1 OBJECT IDENTIFIER.
  - The bounded registry contains 101 declared symbols across message, identifier, connection, abonent, location, payment, dictionary, presense and raw-content families.
  - Exactly 100 values are safe to execute from the cross-checked public text.
  - The current HTML rendering exposes the token for sorm-request-identifier-pstn as 141 with an unmatched trailing quote; sequence inference is not accepted as primary-byte evidence.
  - Connection-request values jump from 162 to 164. No meaning is invented for 163.
  - The source identifier is literally spelled presense. A corrected presence alias is not accepted as an ASN.1 symbol.
  - A second line-by-line pass corrected 28 previously normalized symbol names: all seven sorm-message-* names, four sorm-report-abonent-* names, sixteen payment names and sorm-report-data-content-raw. Numeric values and the 101/100 counts were unchanged.
  - Both the official publication PDF URL and the Ministry card returned 502 Connection refused in a controlled-browser check on 28 August 2026; no incomplete response was stored as an immutable artifact.
