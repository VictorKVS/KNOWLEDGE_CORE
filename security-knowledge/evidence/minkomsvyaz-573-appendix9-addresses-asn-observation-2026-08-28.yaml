subject: "Order 573 appendix 9 Addresses.asn exact module"
observations:
  - Order 630 point 21 replaced appendix 9 in full with effect from 1 March 2024.
  - Addresses uses IMPLICIT TAGS, has no imports and exports exactly AddressType, ReportedAddresses, ReportedAddress and RequestedAddress.
  - AddressType has five exact values registered(0), postal(1), invoice(2), device-location(3) and reserved(4).
  - ReportedAddresses is SEQUENCE OF ReportedAddress without a published SIZE constraint.
  - ReportedAddress requires both title and address-info.
  - AddressInfoReport is a CHOICE between struct-info tag 1 and unstruct-info tag 2; the latter is UTF8String of 1 through 1024 characters.
  - AddressStructInfoReport and RequestedAddress each contain nine OPTIONAL UTF8String fields tagged 0 through 8.
  - zip is limited to 1 through 32 characters; the other eight structured fields are limited to 1 through 128 characters.
  - All-OPTIONAL structure permits an empty ASN.1 SEQUENCE, but the act does not define useful business or query semantics for it.
  - RequestedAddress has neither an AddressType field nor an unstructured-address alternative.
