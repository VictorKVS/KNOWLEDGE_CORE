  "observations":[
    "Модуль экспортирует только ReportedIdentifier и связывает обязательные id/data через шесть вариантов TAGGED.",
    "Шесть вариантов точно связывают OID pager, pstn, gsm, cdma, data-network и voip с шестью типами данных.",
    "Pager — NumericString 2..18; PSTN содержит обязательный directory-number и опциональный intemal-number.",
    "GSM содержит четыре поля: два обязательных и два опциональных с тегами 0..1.",
    "CDMA содержит пять полей: два обязательных и три опциональных с тегами 0..2.",
    "Data-network содержит девять опциональных полей с тегами 0..8; VoIP — три опциональных поля с тегами 0..2.",
    "Для полностью опциональных структур пустая SEQUENCE возможна синтаксически, но её бизнес-смысл не установлен.",
    "Токены reportedPstnIdentifierTAGGED и intemal-numberNumericString не исправлены предположением."
  ],
