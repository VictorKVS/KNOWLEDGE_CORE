subject: "Current fixed-telephone switching-equipment SORM requirements under Order 268/2012"
observations:
  - The current index and public text identify Order 268 as acting in its original 19.11.2012 edition.
  - The act was registered on 29.12.2012 as number 26431 and officially published in BNA FOIV number 9 on 04.03.2013.
  - The effective date is recorded as 15.03.2013 under the ordinary ten-day official-publication rule; no special effective date was found in the act.
  - PP 1656 of 09.10.2023 expressly lists Order 268 with the communications-control acts preserved from cancellation.
  - The body contains nineteen numbered points and routes requirements to twelve appendices.
  - Body point 4 contains fourteen function groups; points 5 to 7 contain the 200 ms route and two nondisclosure or non-detection controls.
  - Appendix 1 contains six numbered points, two KPD organization variants, X.25 and Ethernet TCP/IP routes and a 15-second control-list change limit for the stated node and protocol combinations.
  - Detailed byte, command, message and bit tables in appendices 5 to 11 are not claimed verified without immutable post-page review.
