verified_claims:
  - claim_id: SEC-CLM-ASUTP-SESSION-THREAT-001
    statement: >
      In the official FSTEC BDU ASU TP threat model, session hijacking and weaknesses in session-termination
      mechanisms are listed as possible methods for realization of multiple ASU TP threats, including information
      leakage, unauthorized modification and unauthorized collection of ASU TP information.
    evidence:
      - FSTEC-BDU-ASUTP-UTP01
      - FSTEC-BDU-ASUTP-UTP05
      - FSTEC-BDU-ASUTP-UTP10
  - claim_id: SEC-CLM-ASUTP-SESSION-THREAT-002
    statement: >
      Therefore, an active or reusable session whose continued validity is not proven to be intended and controlled
      may be routed as threat-relevant evidence in ASU TP analysis when the relevant system/component and attack path
      are applicable; this is a derived analytical routing rule, not a declaration of automatic legal non-compliance.
    evidence:
      - FSTEC-BDU-ASUTP-UTP01
      - FSTEC-BDU-ASUTP-UTP05
      - FSTEC-BDU-ASUTP-UTP10
    inference_type: DERIVED_ANALYTICAL_BINDING

routing_guards:
  - "Do not infer statutory violation solely from existence of an active session."
  - "Do not infer applicability outside ASU TP without separate authoritative evidence."
  - "Do not equate source count with independent evidence; these are three threat records in the same authoritative resource family."
  - "If session purpose, ownership, termination semantics or component applicability are unknown, retain NOT_PROVEN/PENDING."
  - "Credential revocation -> session invalidation remains a separate requirement question unless an applicable primary requirement is independently proven."

integration_targets:
  - credential_token_session_lifecycle
  - threat_model
  - evidence_audit
  - practical_cases

provenance_note: >
  These are live official FSTEC BDU ASU TP web records verified on 2026-08-17. They are not represented as
  PRIMARY_IMMUTABLE artifacts because exact preserved source bytes and SHA-256 were not acquired in this pass.
