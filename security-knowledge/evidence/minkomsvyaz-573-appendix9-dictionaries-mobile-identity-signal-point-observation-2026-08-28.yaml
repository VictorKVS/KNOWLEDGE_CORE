subject: "Order 573 appendix 9 Dictionaries.asn mobile identity plan and signal point records"
observations:
  - Order 630 point 21 replaced appendix 9 in full with effect from 1 March 2024.
  - The source literally spells mobileSubscriberIdenityPlanRecords and MobileSubscriberIdenityPlanRecord without the second letter t in Identity.
  - MobileSubscriberIdenityPlanRecord has thirteen fields, eleven required and two optional.
  - range-deactivation is optional with tag 0; range-status is optional with tag 1.
  - MCC and MNC are NumericString of exact length 3; area-code is NumericString length 3..10.
  - capacity-from and capacity-to are NumericString length 0..7, so zero length is syntactically admitted without assigning it a business meaning.
  - capacity-size is INTEGER 1..10000000; description is UTF8String 2..255; region and city are UTF8String 1..128.
  - The rendered range-activation token contains a split DateAnd Time and range-deactivation joins DateAndTimeOPTIONAL; both remain pending primary PDF.
  - The signal report wrapper is literally signalPointCodes without a Records suffix.
  - SignalPointCodesRecord has five fields, four required and optional end-time; it has no telco-id field.
  - ss7-point-code is UTF8String length 1..32, switch-id is UTF8String 1..128 and description is UTF8String 1..256.
  - The rendered signal switch-id and begin-time tokens are joined and remain pending primary PDF.
  - No interval ordering, capacity equation, MCC/MNC registry validation, OPC/DPC direction enum or global uniqueness was inferred.
