subject: "Current postal-network and postal-means SORM requirements under Order 65/2009"
observations:
  - The current index identifies the original 19.05.2009 edition as effective from 21.07.2009 and unchanged.
  - The act was registered on 06.07.2009 as number 14209 and published in Rossiyskaya Gazeta number 126 on 10.07.2009.
  - PP 1656 of 09.10.2023 expressly lists Order 65 with the communications-control acts preserved from cancellation.
  - The body contains thirteen numbered points; the room appendix contains five numbered points.
  - The implementation plan requires five field groups, three attachment groups and three copies, but no universal numeric completion deadline.
  - The act states no universal retention, response, remediation or testing period.
