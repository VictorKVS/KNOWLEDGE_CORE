observations:
  - "PP RF No. 246 is an adopted and current science-sector overlay, not a draft; it took effect on 15 March 2026."
  - "Its actor scope is limited to state bodies and state institutions that hold science systems, networks or ICS on a lawful basis, plus state bodies and institutions ensuring their interaction."
  - "The overlay binds only to science and to current typical-object rows 13-21; it is not transferred to healthcare or another sector."
  - "Five current PP RF No. 127 indicator positions are conditionally routed: 1, 7, 9, 11 and 13(1)."
  - "The model preserves the minimum technology-readiness level 7 route without equating that level to an automatic significance category."
  - "The act provides calculation inputs and consequence semantics but no new category thresholds, categorization deadline or submission deadline."
  - "Inapplicable indicators are not calculated; applicable values remain evaluated against the current PP RF No. 127 threshold model."
semantic_guards:
  - DO_NOT_TRANSFER_SCIENCE_RULES_TO_HEALTHCARE_OR_OTHER_SECTORS
  - DO_NOT_GENERALIZE_ACTOR_SCOPE_TO_ALL_PRIVATE_SCIENCE_ENTITIES
  - DO_NOT_INVENT_SCIENCE_SPECIFIC_CATEGORY_THRESHOLDS
