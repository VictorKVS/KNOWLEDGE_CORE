subject: "Order 573 appendix 9 Dictionaries.asn bounded core"
observations:
  - Order 630 point 21 replaced appendix 9 in full with effect from 1 March 2024.
  - Dictionaries uses IMPLICIT TAGS and exports exactly TelcoID, TelcoList, DictionaryTask, DictionaryReport and PhoneAbonentType.
  - The module imports thirty identifiers in five source-module groups.
  - TelcoID is INTEGER 0 through 65535; TelcoList is SEQUENCE OF TelcoID without a published SIZE constraint.
  - DictionaryTask has required dependent id/data fields and one TAGGED variant with sorm-request-dictionaries and ObjectDescriptor data.
  - The permitted ObjectDescriptor comment lists exactly eighteen report OIDs.
  - DictionaryReport has required dependent id/data fields and its report registry contains exactly eighteen variants.
  - The eighteen report wrapper OIDs equal the task descriptor set and each wrapper carries a SEQUENCE OF record data type.
  - The literal source identifier mobileSubscriberIdenityPlanRecords retains the Identy spelling; signalPointCodes has no Records suffix.
  - PhoneAbonentType contains local(0), network(1), roamer(2) and undefined(3).
  - Consolidated HTML renders the registry declaration as Dictionary Records VariantsTAGGED while the fields reference DictionaryRecordsVariants.
  - Consolidated HTML renders the termination-causes OID with a closing parenthesis instead of a closing brace.
  - Those two rendered syntax anomalies are recorded fail-closed and are not silently repaired or presented as compile-ready ASN.1.
