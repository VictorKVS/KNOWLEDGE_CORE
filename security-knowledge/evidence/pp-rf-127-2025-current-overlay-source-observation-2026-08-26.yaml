  - "Sector-specific categorization features remain mandatory and are not supplied by this generic overlay."
  - "Ten- and twenty-day duties expressly use working days; the 30-day monitoring notice contains no working/calendar qualifier and is encoded as DAYS_UNQUALIFIED."
