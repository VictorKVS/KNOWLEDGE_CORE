findings:
  - "Paragraph 9 sets four maximum review intervals: one year for no-category decisions, two years for category III, three years for category II and five years for category I, in addition to current PP RF No. 127 event triggers."
  - "Paragraph 8 routes a dependent object to the highest significance result between its own calculation and the result of the object on which it depends, including cross-subject dependencies."
  - "Paragraphs 19, 22 and 27 expose three exact text formulas; the other twelve formulas, one variable glyph and one stop-condition expression remain image-only."
  - "Paragraphs 34-40 provide the current defense-industry route used by PP RF No. 356 paragraph 15 for positions 13 and 13(1), but image-dependent calculations remain fail-closed."
  - "Positions 3 and 4 remain external transport and communication dependencies; positions 10-10(7) are linked to the separate current financial-sector model."
