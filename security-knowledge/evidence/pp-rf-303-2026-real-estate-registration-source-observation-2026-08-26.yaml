observations:
  - "PP RF No. 303 is an adopted current sector overlay effective from 1 April 2026, not a draft."
  - "Its actor scope is limited to Rosreestr and the public-law company Roskadastr and its object scope to the EGRN federal state information system plus means ensuring its operation."
  - "Four routes map to current PP RF No. 127 positions 5(a), 5(b), 6 and 9; no other PP RF No. 127 position is turned into a PP RF No. 303-specific rule."
  - "The public text exposes the descriptions of variables for paragraph 11 and paragraph 14, but three formula expressions are image-only."
  - "The model therefore records the variables and units while blocking numeric execution; operators, constants, parentheses and denominators are not reconstructed."
  - "Paragraph 12 assigns category II only when disruption causes nonperformance or improper performance of a function legally assigned to the matched actor."
  - "The act adds no sector-specific category thresholds and no categorization or submission deadline."
