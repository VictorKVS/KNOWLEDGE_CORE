subject: "Order 573 appendix 9 Dictionaries.asn document, IP data point and special number records"
observations:
  - Order 630 point 21 replaced appendix 9 in full with effect from 1 March 2024.
  - DocTypesRecord has five fields; only end-time is optional.
  - Document type identifier is INTEGER 0..65535 and description is UTF8String length 1..256.
  - IpDataPointRecord has five fields; only end-time is optional.
  - IP data point identifier is INTEGER 0..1000 and description is UTF8String length 1..256.
  - SpecialNumberRecord has six fields; end-time and network-address are optional.
  - Directory number is UTF8String length 1..32, not NumericString.
  - Special-number description is UTF8String length 1..256.
  - Optional network-address has type IPAddress.
  - No digit-only directory format, special-number type enumeration, global identifier uniqueness or external document-type registry semantics was inferred.
  - The three report values are SEQUENCE OF their respective record types without a published element-count constraint.
  - No retention, refresh or identifier-reuse period was added.
