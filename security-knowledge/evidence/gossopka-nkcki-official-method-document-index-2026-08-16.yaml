model_rules:
  - id: MR-METHOD-INDEX-001
    rule: OFFICIAL_INDEX_ENTRY_DOES_NOT_EQUAL_EXACT_ARTIFACT
    effect: Do not create clause-level claims, fields, deadlines, hash bindings or exact schemas until the referenced downloadable artifact is acquired or separately verified from a stronger source.
  - id: MR-METHOD-INDEX-002
    rule: METHODICAL_DOCUMENT_DOES_NOT_AUTOMATICALLY_CREATE_LEGAL_OBLIGATION
    effect: A separate binding/applicability edge is required before a methodological recommendation is treated as mandatory for a specific organization.
  - id: MR-METHOD-INDEX-003
    rule: NOTIFICATION_FORMATION_INSTRUCTION_DOES_NOT_PROVE_DELIVERY
    effect: Email/message formatting evidence is distinct from submission and delivery-confirmation evidence.
  - id: MR-METHOD-INDEX-004
    rule: RESPONSE_PLAN_GUIDANCE_DOES_NOT_OVERRIDE_FSB547_DEADLINES
    effect: Regulatory timelines remain sourced from applicable NPA; methodological guidance cannot silently extend them.
  - id: MR-METHOD-INDEX-005
    rule: PROTECTEDNESS_ASSESSMENT_GUIDANCE_DOES_NOT_EQUAL_ATTESTATION_OR_CERTIFICATION
    effect: Keep protectedness assessment, penetration testing, conformity assessment, attestation and certification as separate graph concepts unless an authoritative source links them.
  - id: MR-METHOD-INDEX-006
    rule: DOCUMENT_VIEWER_RENDER_DOES_NOT_EQUAL_OFFICIAL_ORIGIN_BYTES
    effect: A viewer-rendered PDF may confirm content identity for acquisition triage, but cannot close immutable-primary provenance without byte-fidelity proof.

red_team_findings:
  - id: RT-METHOD-075-001
    severity_if_unfixed: HIGH
    finding: Search/index text could be mistaken for the exact downloadable document.
    correction: Every record carries exact_artifact_acquired=false and a restricted allowed_claim_level.
  - id: RT-METHOD-075-002
    severity_if_unfixed: HIGH
    finding: Methodological recommendations could be routed as universally mandatory law.
    correction: Mandatory status requires a separate binding/applicability edge.
  - id: RT-METHOD-075-003
    severity_if_unfixed: MEDIUM
    finding: Notification formatting could be treated as proof that the regulator received the notification.
    correction: Formatting, submission and delivery remain separate evidence nodes.
  - id: RT-METHOD-075-004
    severity_if_unfixed: MEDIUM
    finding: A response-plan methodology could overwrite externally fixed statutory or regulatory deadlines.
    correction: FSB/NPA deadline source has precedence.

