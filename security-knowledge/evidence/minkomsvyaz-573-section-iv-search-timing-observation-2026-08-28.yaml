checked_at: "2026-08-28"
subject: "Current Order 573 section IV search timing, sparse Table 1 and Order 630 Table 2"
observations:
  - Points 34 and 35 use inclusive maximums expressed as “not exceeding”; their seven preprocessing and four direct-search clocks remain distinct from Tables 1 and 2.
  - Table 1 contains five period columns: up to one day, one month, six months, one year and three years.
  - Table 1 row 1 uses strict limits of 3, 5, 15, 25 and 50 seconds.
  - Table 1 row 2 uses strict limits of 1, 10 and 15 minutes, 1 hour and 1.5 hours; these normalize to 60, 600, 900, 3600 and 5400 seconds without changing the strict comparator.
  - Table 1 row 3 specifies only less than 7 minutes for the up-to-one-day column; its four longer-period cells are blank.
  - Table 1 row 4 specifies only less than 10 seconds for the up-to-one-day column; its four longer-period cells are blank.
  - Blank cells are preserved as not specified and are not treated as zero, unlimited, waived or inherited from the one-day column.
  - Point 37 requires at least 100 simultaneous search tasks and preserves Table 1 timing for each of the first 100; it does not state a timing guarantee for tasks above 100.
  - Points 38–40 require combined queries with AND, OR, grouping and conditionally admissible NOT.
  - Point 41 makes AND strict below the sum of individual times, while OR may equal that sum and NOT may equal the analogous query without NOT.
  - Order 630 point 15 added point 42 and Table 2 from 1 March 2024.
  - Table 2 has ten inclusive record-count bands through 1,000,000 records and strict delivery limits increasing from less than 3 to less than 30 minutes in three-minute steps.
  - A result exactly at a stated Table 1 or Table 2 limit fails the strict “less than” test.
  - A Table 2 result above 1,000,000 records is outside the published table and remains fail-closed; no extrapolated 33-minute band is invented.
  - Order 1196, effective 15 March 2026, did not change section IV.
