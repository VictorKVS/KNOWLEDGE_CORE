model_rules:
  - id: RISK-STD-RULE-001
    rule: "For a current terminology decision on or after 2025-03-01, route to ГОСТ Р ИСО 31073-2024, not ГОСТ Р 51897-2021."
  - id: RISK-STD-RULE-002
    rule: "For historical evidence before 2025-03-01, do not rewrite the contemporaneous terminology reference to 31073-2024; preserve event-time context."
  - id: RISK-STD-RULE-003
    rule: "ГОСТ Р 58771-2019 is a current risk-assessment-techniques source, but its existence alone does not make a particular technique mandatory for an organization."
  - id: RISK-STD-RULE-004
    rule: "ГОСТ Р ИСО 31022-2025 may inform legal-risk management from 2026-03-01, but legal obligation requires a separate binding applicability edge."
  - id: RISK-STD-RULE-005
    rule: "Never convert CURRENT standard status into MANDATORY_FOR_ORG without an incorporated-by-law, contract, internal-policy or other binding edge."
  - id: RISK-STD-RULE-006
    rule: "ГОСТ Р 72254-2025 is implementation guidance for applying 31000 in management systems; it must not be represented as a standalone statutory security-risk calculation formula."

red_team_guardrails:
  - "Do not use replaced ГОСТ Р 51897-2021 as the default current terminology source after 2025-03-01."
  - "Do not use publication/current status of a national standard as proof of statutory obligation."
  - "Do not collapse general risk-management guidance, assessment-technique guidance and legal-risk guidance into one obligation type."
  - "Do not infer a universal numeric risk formula from ГОСТ Р ИСО 31000-2019, ГОСТ Р 58771-2019 or ГОСТ Р 72254-2025."
  - "Historical audit must select the standard state by event/configuration date, not audit date."
