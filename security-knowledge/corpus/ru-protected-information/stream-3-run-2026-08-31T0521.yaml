normative_findings:
  - "Article 16 explicitly places personal data for voters, referendum participants, candidates, trusted/authorized representatives and commission members inside GAS Vybory information resources; specific field lists are controlled by federal laws."
  - "Article 17(2) makes PDN-containing GAS resources federal information resources and requires confidential formation, storage and use."
  - "Article 18 restricts PDN-resource access by role/need, gives citizens access to their own personal data and requires federal-law authority for public officials."
  - "Article 20 allows non-election use only through federal laws/CEC normative acts and preserves accuracy, integrity and election-function priority."
  - "Article 21 creates an explicit security-control layer including certification, anti-unauthorized-access controls, authenticity/integrity, transmission protection, readiness checks, approved operations documentation, asset/workability preservation and trained personnel."
  - "Article 22 permits regulated use of public/departmental/other communications networks without converting every data element into telecom secrecy."
  - "Article 24 establishes liability for violations of protection, processing and use, including personal-data resources."

