key_findings:
  - "Пункт 4: оператор обязан обеспечивать тайну телефонных переговоров; ограничение допускается только в предусмотренных федеральным законом случаях."
  - "Пункт 4: сведения об абоненте-физлице ограничены по передаче/использованию, а отдельное согласие на обработку ПДн не требуется только для прямо перечисленных отраслевых целей."
  - "Пункт 18: физлицо может идентифицироваться документом, через ЕСИА либо в предусмотренном сценарии через ЕСИА+ЕБС по статье 9 572-ФЗ."
  - "Пункты 22, 24, 26: subscriber dataset включает ФИО, место жительства, дату рождения и реквизиты удостоверяющего документа; установлены отдельные 3-дневные verification notices и 60-дневный update deadline."
  - "Пункт 28: электронно фиксируемые subscriber actions имеют специальный retention не менее 3 лет по установленным точкам отсчета."
  - "1137/2025, пункты 222-226: добавлен workflow отказа/возврата массовых и автоматических вызовов; рекламная классификация по 38-ФЗ автоматически не выводится."

