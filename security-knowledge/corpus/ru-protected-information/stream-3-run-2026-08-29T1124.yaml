key_findings:
  - "125-ФЗ ст.25(3): 75 лет — срок ограничения доступа к определенным архивным документам с личной/семейной тайной, частной жизнью или угрозой безопасности; это не общий срок хранения ПДн."
  - "125-ФЗ ст.22.1: personnel-document retention разделен на 75 лет (до 01.01.2003) и 50 лет (после 01.01.2003), с guard по специальным перечням."
  - "152-ФЗ ст.1(2)(2): определенные отношения по организации хранения, комплектования, учета и использования архивных документов с ПДн прямо исключены из сферы 152-ФЗ."
  - "Приказ Росархива №77 п.134: для информации и ПДн в СХЭД действует прямое архивное security-требование с нормативными ссылками на ст.7 152-ФЗ и ст.16 149-ФЗ."
  - "Связка 125-ФЗ/152-ФЗ/Приказ №77 сохранена как scope-boundary problem, а не объявлена юридическим конфликтом."

