normative_findings:
  - "Order 38/2025 is a special archival DLU access-classification procedure. It defines the relevant information as non-secret and requires a Rosarchive commission/decision workflow; sensitive appearance of a document alone is not proof of DLU status."
  - "The restricted List referenced by Order 38 is itself DLU. It is not reconstructed from taxonomy or unofficial material."
  - "Under Order 38, access restriction/removal becomes effective through Rosarchive decision plus change in archive accounting records; this is access lifecycle, not retention."
  - "Order 77/2023 point 31 requires nonrecoverable destruction for documents containing PDN, marked DLU or containing restricted-access information only after the lawful disposal procedure."
  - "Order 77 point 33 prohibits shortening normatively established document retention periods."
  - "125-FZ remains the cross-sector archival framework and the 152-FZ archival boundary is activity/legal-regime specific, not a blanket exemption for old data."
  - "38-FZ current consolidation is 04.08.2026; 283-FZ is effective from 01.09.2026 at source level, while Article 18.1(13)'s at-least-three-year regulator retention remains current in the selected advertising-data scope."

