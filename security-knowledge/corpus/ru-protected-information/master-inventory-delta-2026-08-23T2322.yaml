proof_floor:
  - "Статья 8 44-ФЗ от 16.04.2001 формирует самостоятельный режим конфиденциальности государственного банка данных о детях; CHILD_DATABANK_CONFIDENTIALITY != PERSONAL_DATA."
  - "Статья 8 часть 1 относит анкеты детей и перечисленных категорий граждан к конфиденциальной информации; порядок доступа вынесен в статью 11."
  - "Статья 8 часть 2 разрешает специальное использование производной информации, но требует исключить идентификацию ребенка, родителей и иных родственников; коммерческое использование производной информации запрещено."
  - "Сведения о здоровье и фотографии в производной информации создают сильный PDN/sensitive-data overlap, но не доказывают применимость конкретного требования 152-ФЗ."
  - "Exact current authoritative bytes не получены; MIME, byte length, SHA-256 и retrieved_at не придуманы."

