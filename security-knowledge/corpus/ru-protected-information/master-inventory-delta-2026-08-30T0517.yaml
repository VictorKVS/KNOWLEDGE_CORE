key_findings:
  - source_id: SEC-SRC-RU-FZ-168-2020
    locator: "статья 8 часть 11"
    finding: "Записи федерального регистра и иные содержащиеся в нем по закону сведения подлежат постоянному хранению; это специальный register-retention rule."
    guard: "PERMANENT_EFIR_RECORD_RETENTION != GENERAL_PDN_RETENTION"
  - source_id: SEC-SRC-RU-FZ-168-2020
    locator: "статьи 3, 8, 9, 11"
    finding: "Закон устанавливает прямой PDN/information-security layer, ограниченный режим доступа и защиту downstream recipients; ссылки на государственную и иную охраняемую законом тайну не классифицируют весь регистр как тайну."
    guard: "REGISTER_CONTENT != STATE_OR_OTHER_SECRET_AUTOMATICALLY"
  - source_id: SEC-SRC-RU-FZ-120-1999
    locator: "статья 9 пункты 2-3"
    finding: "Специальные межведомственные информационные сообщения по несовершеннолетним должны храниться и использоваться с обеспечением конфиденциальности."
    guard: "MANDATORY_INTERAGENCY_FLOW != UNLIMITED_SECONDARY_USE"
  - source_id: SEC-SRC-RU-FZ-120-1999
    locator: "статья 25.2 часть 2"
    finding: "Федеральная GIS профилактики строится на конфиденциальности ПДн, их защите и соблюдении законодательства о личной, семейной, коммерческой и иной охраняемой законом тайне."
    guard: "PROTECTED_SECRET_REFERENCE != AUTOMATIC_MULTI_CLASSIFICATION_OF_EVERY_RECORD"
  - source_id: SEC-SRC-RU-FZ-120-1999
    locator: "статья 25.2 части 3-4"
    finding: "GIS содержит детальные идентификационные и социально-чувствительные сведения о несовершеннолетних и законных представителях."
    guard: "HIGH_SENSITIVITY_CHILD_RECORD != SPECIAL_CATEGORY_PDN_OR_MEDICAL_SECRET_AUTOMATICALLY"
  - source_id: SEC-SRC-RU-FZ-120-1999
    locator: "статья 7"
    finding: "Срок индивидуальной профилактической работы является operational/workflow duration, а не сроком хранения ПДн или документов."
    guard: "PREVENTIVE_WORK_DURATION != PDN_RETENTION_PERIOD"

