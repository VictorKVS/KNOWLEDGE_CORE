purpose: >-
  Authoritative discovery and reconciliation inventory for Russian sector-specific
  confidentiality/protected-information regimes intersecting with the PDN corpus.
  Inclusion is a research lead, not proof of applicability to any organization.

proof_floor:
  - A taxonomy or secondary source may create a discovery lead only.
  - Legal force, scope and applicability require a primary authoritative act.
  - No SOURCE_PENDING entry may feed executable rules.
  - Cross-document applicability edges require an anchored provision and review.
  - Existing source IDs and artifacts must be reused instead of duplicated.
  - Exact source bytes are required before SOURCE_ACQUIRED or IMMUTABLE promotion.
  - Portal-displayed PDF size/page count is discovery metadata, not an immutable fingerprint.
  - Repealed provisions are conflict/version evidence and must never be reused as current anchors.
  - Retention periods and access-restriction periods are separate concepts even when their numeric duration is identical.

