normative_findings:
  - "Article 16(5) defines an electoral-registration PDN dataset including identity, citizenship, address and identity-document fields supplied by designated public authorities."
  - "Article 16(6)-(10) establishes controlled update routes from civil-status death data, military accounting, penitentiary status and incapacity/capacity decisions, with voter accounting using GAS Vybory."
  - "Article 16(12) gives the voter direct access/correction and usage/provision traceability rights for documented personal data about them."
  - "Article 17(11) defines voter-list person-level fields and passport/document series-number capture at ballot issuance."
  - "Article 17(15.2),(16),(19) separates electronic-list lifecycle, correction/exclusion records and post-election register-clarification use."
  - "Article 70(10)-(11) creates an election-document retention floor and delegates exact archive/storage/destruction rules to election commissions with archive authorities."

