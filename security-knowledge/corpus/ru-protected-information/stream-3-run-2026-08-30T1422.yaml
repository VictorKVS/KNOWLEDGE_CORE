normative_findings:
  - "PP 825 implements the federal education credentials/training register and directly requires confidentiality/security of personal data plus compliance with information and personal-data legislation."
  - "Appendix 1 contains person-level identity and education data including name, date of birth, sex, SNILS for Russian citizens where available, citizenship and additional education/lifecycle attributes; some certificate scenarios include identity-document details."
  - "PP 1423/2025 added school-language-testing results for foreign citizens/stateless persons, including child/legal-representative identity fields, and established a special three-year retention period for those results."
  - "Point 12 separates system retention: 50 years for the main body of FIS records, 5 years for specified language/history/law certificates, and 3 years for school-language-testing results; expiry causes removal from the FIS. None is a general PDN or education-document retention rule."
  - "PP 960/2026, effective 2026-08-11, added joint Russian-foreign education organizations and introduced protected packet transport, electronic-signature/authority verification, unchanged packet delivery and integrity requirements."

