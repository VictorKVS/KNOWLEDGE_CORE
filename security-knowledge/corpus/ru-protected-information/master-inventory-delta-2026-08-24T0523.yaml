proof_floor:
  - "211-ФЗ от 20.07.2020 задает самостоятельный отраслевой режим обращения информации о финансовых сделках и защиты информации на финансовой платформе; FINANCIAL_PLATFORM_INFORMATION != PERSONAL_DATA."
  - "Статья 7 регулирует передачу, доступ и ответственность за неправомерное раскрытие информации о финансовых сделках; статья 8 часть 7 и статья 7 часть 6 содержат идентификационные/контактные сведения физических лиц."
  - "Статья 12 задает специальный security/operational-reliability layer Банка России; статья 17 часть 4 — конфиденциальность документов и информации у Банка России, а не универсальная «тайна клиента»."
  - "Применимость 152-ФЗ не повышается автоматически: требуется проверка данных, операции, цели, роли и основания. OVERLAP != APPLICABILITY."
  - "Exact current authoritative bytes не получены; MIME, byte length, SHA-256 и retrieved_at не придуманы."

