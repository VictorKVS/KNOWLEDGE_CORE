normative_anchors:
  - locator: "п. 4"
    anchor: TELEPHONE_CONVERSATION_SECRECY
    rule: "оператор обеспечивает тайну телефонных переговоров; ограничение только в федерально-законных случаях"
  - locator: "п. 4"
    anchor: SUBSCRIBER_INFO_CONSENT_AND_PURPOSE_BOUND_PDN_BASES
    rule: "передача/информационное использование subscriber information ограничены; для конкретно перечисленных целей обработки ПДн отдельное согласие не требуется"
    guard: "NO_CONSENT_FOR_LISTED_PURPOSE != UNLIMITED_PROCESSING"
  - locator: "п. 18"
    anchor: IDENTITY_DOCUMENT_ESIA_EBS_IDENTIFICATION
    rule: "идентификация физлица возможна документом, ЕСИА либо ЕСИА+ЕБС по статье 9 572-ФЗ в нормативно предусмотренном сценарии"
  - locator: "пп. 22, 24, 26"
    anchor: PERSON_LEVEL_SUBSCRIBER_DATA_AND_VERIFICATION
    fields: ["ФИО", "место жительства", "дата рождения", "реквизиты документа, удостоверяющего личность"]
    deadlines: ["3 календарных дня на запрос подтверждения после регуляторного/ОРД запроса", "повторное уведомление не позднее чем за 3 календарных дня до прекращения услуг", "до 60 календарных дней на сообщение абонентом об изменении ряда сведений"]
    guard: "TELECOM_WORKFLOW_DEADLINES != 152FZ_INCIDENT_OR_DATA_SUBJECT_DEADLINES"
  - locator: "п. 28"
    anchor: SUBSCRIBER_ACTION_AUDIT_RETENTION
    rule: "не менее 3 лет для предусмотренных action records: от расторжения договора для изменений условий договора и от совершения действия для остальных действий"
    guard: "ACTION_LOG_RETENTION != GENERAL_SUBSCRIBER_PDN_RETENTION"
  - locator: "1137/2025, пп. 222-226"
    anchor: MASS_AUTOMATED_CALL_OPT_OUT
    rule: "отказ абонента от массовых/автоматических вызовов и восстановление после отмены отказа"
    guard: "MASS_OR_AUTOMATED_CALL != ADVERTISING_BY_DEFINITION"

