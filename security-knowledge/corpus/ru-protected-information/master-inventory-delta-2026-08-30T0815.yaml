key_findings:
  - source_id: SEC-SRC-RU-PP-411-2025
    locator: "пункты 5, 6, 9"
    finding: "Положение прямо закрепляет обязанности по соблюдению законодательства о ПДн и защите информации; информация системы защищается также по режимам государственной, коммерческой и иной охраняемой законом тайны, включая тайну усыновления и врачебную тайну."
    guard: "PROTECTED_SECRET_REFERENCE != AUTOMATIC_MULTI_CLASSIFICATION_OF_EVERY_RECORD"
  - source_id: SEC-SRC-RU-PP-411-2025
    locator: "пункты 11-12 и приложение"
    finding: "В системе обрабатывается детализированный person-level набор сведений о несовершеннолетних/представителях, включая идентификаторы, документы, адрес, СНИЛС, телефон, e-mail и номер записи федерального регистра сведений о населении."
    guard: "CHILD_PERSON_LEVEL_DATASET != SPECIAL_CATEGORY_PDN_OR_MEDICAL_SECRET_AUTOMATICALLY"
  - source_id: SEC-SRC-RU-PP-411-2025
    locator: "пункт 25"
    finding: "Для основной массы сведений системы установлен специальный минимум хранения 5 лет со дня представления поставщиком с предусмотренными нормативными оговорками."
    guard: "FIVE_YEAR_GIS_RETENTION != GENERAL_PDN_OR_DOCUMENT_RETENTION"
  - source_id: SEC-SRC-RU-PP-411-2025
    locator: "пункт 26"
    finding: "Система требует ежедневного копирования на резервный материальный носитель и хранения резервной информации не менее 10 лет, если закон не требует более длительного срока."
    guard: "TEN_YEAR_BACKUP_RETENTION != GENERAL_LIVE_DATA_OR_PDN_RETENTION"
  - source_id: SEC-SRC-RU-PP-411-2025
    locator: "пункты 28-30, 37, 40-54"
    finding: "Установлены идентификация/аутентификация/авторизация, ролевое назначение уполномоченных лиц, сертифицированные средства доступа, защита от НСД, регистрация, перерегистрация и блокирование доступа."
    guard: "SYSTEM_USER_OR_SUPPLIER_STATUS != UNLIMITED_ACCESS"
  - source_id: SEC-SRC-RU-PP-411-2025
    locator: "пункты 32-36"
    finding: "Система взаимодействует с иными ГИС через СМЭВ и может запрашивать ЕФИР населения для проверки достоверности, полноты и актуальности данных."
    guard: "SMEV_AND_EFIR_FLOW != UNLIMITED_SECONDARY_USE"

