normative_findings:
  - "Order 408 is based on part 1 article 23 of 125-FZ and approves the healthcare-sector document retention List for Minzdrav Russia and subordinate organizations."
  - "Within the proven mandatory scope, the List's retention rules also cover documents containing restricted-access/restricted-distribution information."
  - "Mandatory application to regional/private medical organizations is not promoted from this source."
  - "Temporary retention generally starts on 1 January following completion of records management, subject to special medical-record start rules."
  - "For an ambulatory medical card, before archival transfer there is a five-year holding rule following the year of the patient's last visit reflected in the card; archival term calculation then follows the List's transfer-to-archive rule."
  - "Patient medical-document classes marked by the List can have a 25-year paper / 50-year MIS distinction; this is not universal for all medical documentation."
  - "Current title-matched 025/u is 25 years on paper and 50 years in MIS where the List note applies."
  - "Current title-matched 025-1/u is 1 year; form-code-only matching is prohibited because historical 025-1/u also denotes another document class in the List."
  - "Current title-matched 070/u, 072/u, 076/u and 079/u map to 3-year object-specific terms in the current rendered List."

