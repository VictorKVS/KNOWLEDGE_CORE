normative_findings:
  - "PP 411 implements the juvenile-prevention federal GIS created by 120-ФЗ Chapter II.1 and makes PDN/information-security obligations explicit for the operator and suppliers."
  - "Point 9 directly invokes state, commercial and other legally protected secrets, including adoption secrecy and medical secrecy; this is a regime reference, not automatic classification of every record."
  - "The appendix contains detailed child/legal-representative identity and contact data, including document details, address, SNILS, phone/e-mail and the federal population-register record number, together with prevention/social/education context."
  - "Point 25 establishes a GIS-specific minimum five-year retention rule for most system information subject to its exceptions and longer statutory periods; it is not a general PDN retention rule."
  - "Point 26 requires daily backup to a reserve material medium and at least ten-year backup retention unless law requires longer; backup retention is not the same as live-system or general PDN retention."
  - "Points 28-30 and 37-54 establish identity/access-management lifecycle requirements; their operational deadlines are not PDN data-subject response SLAs."
  - "The GIS may query the federal population register through the statutory intersystem route to verify accuracy, completeness and currentness; this does not authorize unlimited secondary use."

