  - locator: "статья 441"
    finding: "Согласие на обработку ПДн: 3 года после истечения срока действия или отзыва, если иное не предусмотрено федеральным законом или договором."
    guard: "3_YEAR_CONSENT_RECORD_RETENTION != GENERAL_PDN_RETENTION"
  - locator: "статьи 438-439"
    finding: "Документы кандидатов/конкурсного отбора и кадрового резерва имеют разные сроки 3 года, 1 год и 5 лет по конкретному документному классу."
    guard: "NO_SINGLE_CANDIDATE_PDN_RETENTION_PERIOD"
  - locator: "статьи 444-445"
    finding: "Личные карточки и личные дела работников: 50/75 лет ЭПК по правилам Перечня и архивного законодательства."
    guard: "50_75_YEAR_PERSONNEL_DOCUMENT_RETENTION != ALL_EMPLOYEE_PDN_RETENTION"
  - locator: "статья 166"
    finding: "Соглашения о неразглашении информации ограниченного доступа: 3 года после истечения установленного соглашением срока неразглашения."
    guard: "NDA_RECORD_RETENTION != SECRET_REGIME_DURATION"
  - locator: "статья 167"
    finding: "Обязательства о неразглашении информации ограниченного доступа: 3 года после прекращения трудовых отношений."
    guard: "UNDERTAKING_RECORD_RETENTION != UNIVERSAL_RESTRICTED_INFORMATION_RETENTION"
  - locator: "статья 183 подпункт ж"
    finding: "Учет экземпляров/копий документов и носителей с информацией ограниченного доступа: 5 лет."
