protected_information_anchors:
  - locator: "статья 1 часть 1; статья 3 пункт 2"
    concept: borrower_natural_person_scope
    rule: "Закон регулирует потребительский кредит (заем) физическому лицу для целей, не связанных с предпринимательской деятельностью; заемщик определен как физическое лицо."
    evidence_role: PRIMARY_ORIGINAL_PLUS_CURRENT_CONSOLIDATION_CROSSCHECK
    guard: "NATURAL_PERSON_SCOPE != AUTOMATIC_APPLICABILITY_OF_EVERY_152FZ_REQUIREMENT_TO_EVERY_CREDITOR_OPERATION"
  - locator: "статья 12 часть 2"
    concept: assignment_personal_data_transfer
    rule: "При уступке прав по договору потребительского кредита кредитор вправе передавать персональные данные заемщика и лиц, предоставивших обеспечение, в соответствии с законодательством Российской Федерации о персональных данных."
    evidence_role: PRIMARY_ORIGINAL_AND_CURRENT_CONSOLIDATION_CROSSCHECK
    guard: "STATUTORY_ASSIGNMENT_TRANSFER != UNRESTRICTED_REUSE_OR_DISCLOSURE"
  - locator: "статья 12 часть 3"
    concept: assignee_confidentiality_and_security
    rule: "Новый кредитор обязан хранить банковскую и иную охраняемую законом тайну, персональные данные, обеспечивать их конфиденциальность и безопасность и несет ответственность за разглашение."
    evidence_role: PRIMARY_ORIGINAL_AND_CURRENT_CONSOLIDATION_CROSSCHECK
    guard: "BANK_SECRECY_APPLIES_ONLY_WHEN_THE_TRANSFERRED_INFORMATION_FALLS_WITHIN_THAT_SPECIAL_REGIME"
  - locator: "статья 12 части 4-5"
    concept: debt_burden_indicator_transfer_on_assignment
    rule: "При уступке кредитной или микрофинансовой организации передается последнее рассчитанное значение показателя долговой нагрузки заемщика; норма введена 601-ФЗ и действует с 01.01.2024."
    evidence_role: PRIMARY_AMENDMENT_TEXT_VERIFIED_CURRENT_CONSOLIDATION_CROSSCHECK
    guard: "DEBT_BURDEN_INDICATOR_FLOW != CREDIT_HISTORY_OR_BANK_SECRECY_BY_DEFINITION"
  - locator: "статья 10"
    concept: borrower_debt_and_payment_information_flow
    rule: "После заключения договора кредитор направляет заемщику либо обеспечивает доступ к сведениям о текущей задолженности, произведенных и предстоящих платежах и иных предусмотренных договором сведениях."
    evidence_role: CURRENT_CONSOLIDATION_CROSSCHECK
    guard: "BORROWER_INFORMATION_DUTY != PUBLIC_DISCLOSURE"
  - locator: "статья 7; 31-ФЗ/2024 и 9-ФЗ/2025"
    concept: credit_history_self_ban_query_and_contract_decision_flow
    rule: "Действующий кредитный процесс включает проверку сведений о запрете на заключение договоров потребительского кредита через специальный режим кредитных историй; соответствующий data-flow действует с 01.03.2025."
    evidence_role: PRIMARY_AMENDMENT_METADATA_PLUS_EFFECT_CROSSCHECK
    guard: "CREDIT_HISTORY_SELF_BAN_FLOW != GENERAL_PERMISSION_TO_PROCESS_CREDIT_HISTORY_DATA_FOR_UNRELATED_PURPOSES"
  - locator: "статья 7, будущие части 9.6-9.11 по 332-ФЗ/2026"
    concept: future_egov_credit_contract_notification_flow
    rule: "С 01.10.2027 предусмотрен будущий поток уведомлений через квалифицированное бюро кредитных историй в личный кабинет физического лица на ЕПГУ о подписании индивидуальных условий договора и параметрах кредита/контактах кредитора."
    evidence_role: FUTURE_AMENDMENT_TEXT_CROSSCHECK
    guard: "FUTURE_NOT_CURRENT; DO_NOT_PROMOTE_BEFORE_2027_10_01"

