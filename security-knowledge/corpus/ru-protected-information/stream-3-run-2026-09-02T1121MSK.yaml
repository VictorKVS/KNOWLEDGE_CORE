normative_findings:
  - "PP RF 1233 remains current in revision dated 04.03.2026; PP RF 226/2026 took effect 13.03.2026."
  - "DLU under this regime is non-secret restricted information; state-secret documents are outside this Pоложение."
  - "The 2024 amendment added an archival DLU layer for specified non-secret Archive Fund information, which is why Rosarchive Order 38/2025 directly depends on PP 1233."
  - "The 2026 amendment explicitly covers electronic DLU documents and requires secure electronic processing/storage/exchange using systems meeting applicable information-security requirements and Article 16(5) of 149-FZ."
  - "PP 226 modernized marking, copying, forwarding, destruction and demarking rules and added a recommendation that a broader set of public/publicly significant organizations follow the Pоложение."
  - "The recommendation is not promoted to an unconditional mandatory rule for each legal entity."
  - "Point 2.6 requires lawful disposal workflow before secure destruction and then requires destruction that prevents content recovery; it does not establish a numeric retention period."
  - "DLU status, PDN status, state-secret status, archive access restriction and retention period are modeled as separate legal dimensions."

