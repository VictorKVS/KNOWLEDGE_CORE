key_findings:
  - source_id: SEC-SRC-RU-PP-825-2021
    locator: "пункты 2, 7, 9"
    finding: "ФИС ФРДО прямо регулируется с требованиями конфиденциальности/безопасности ПДн; оператор обеспечивает безопасное хранение/использование, а обработка, доступ и защита выполняются с соблюдением законодательства об информации и ПДн."
    guard: "SYSTEM_PDN_SECURITY_DUTY != NEW_SECRET_CATEGORY_OR_GENERAL_EDUCATION_PROCESSING_BASIS"
  - source_id: SEC-SRC-RU-PP-825-2021
    locator: "приложение № 1"
    finding: "Person-level dataset включает ФИО, дату рождения, пол, СНИЛС для граждан РФ при наличии, гражданство, отдельные реквизиты удостоверяющих документов, образовательную программу/квалификацию и иные сведения образовательного lifecycle."
    guard: "EDUCATION_RECORD_DATASET != SPECIAL_CATEGORY_PDN_OR_CHILD_DATA_AUTOMATICALLY"
  - source_id: SEC-SRC-RU-PP-825-2021
    locator: "приложение № 2 / ПП РФ № 1423/2025"
    finding: "Для школьного тестирования иностранных граждан и лиц без гражданства реестр содержит результаты/баллы и идентификационные данные ребенка и законного представителя."
    guard: "CHILD_MIGRATION_CONTEXT != SPECIAL_CATEGORY_OR_PROTECTED_SECRET_AUTOMATICALLY"
  - source_id: SEC-SRC-RU-PP-825-2021
    locator: "пункт 12"
    finding: "Специальные сроки ФИС: 50 лет для основной массы сведений, 5 лет для определенных языковых сертификатов, 3 года для результатов школьного языкового тестирования; по истечении срока сведения исключаются из системы."
    guard: "50_5_3_YEAR_FIS_RETENTION != GENERAL_PDN_OR_EDUCATION_DOCUMENT_RETENTION"
  - source_id: SEC-SRC-RU-PP-825-2021
    locator: "пункты 8, 10 и изменения № 960/2026"
    finding: "Доступ/предоставление ограничены установленными ролями и целями; внесение защищается электронной подписью, а новый совместный образовательный канал требует проверки полномочий, неизменности и целостности пакетов."
    guard: "REGISTER_ACCESS_AND_E_SIGNATURE_CONTROLS != PDN_CONSENT_OR_UNLIMITED_SECONDARY_USE"

