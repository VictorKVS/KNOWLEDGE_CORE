protected_information_anchors:
  - locator: "исходная редакция, статья 9 часть 2"
    concept: borrower_transaction_secrecy_baseline
    rule: "Исходная официальная редакция устанавливала обязанность работников микрофинансовой организации соблюдать тайну об операциях заемщиков и иных сведениях, кроме установленных федеральными законами случаев."
    evidence_role: PRIMARY_ORIGINAL
    guard: "ORIGINAL_TRANSACTION_SECRECY_BASELINE != PROOF_OF_UNCHANGED_CURRENT_WORDING"
  - locator: "статья 14 часть 4 пункт 5.7"
    concept: public_disclosure_pdn_guard
    rule: "Банк России устанавливает перечень информации, подлежащей раскрытию МФО на официальном сайте и в местах обслуживания, с учетом требований законодательства Российской Федерации в области персональных данных."
    evidence_role: CURRENT_CONSOLIDATION_CROSSCHECK
    guard: "DISCLOSURE_REQUIREMENT != PUBLIC_AVAILABILITY_OF_ALL_PERSONAL_DATA"
  - locator: "статья 9.1 часть 17"
    concept: applicant_pdn_and_protected_secrets_confidentiality
    rule: "МФО и ее должностные лица не вправе использовать вне предусмотренных законом целей и разглашать полученные при рассмотрении обращения персональные данные заявителя, а также коммерческую, служебную, банковскую тайну, тайну страхования и иную охраняемую законом тайну, кроме предусмотренных законом случаев."
    evidence_role: CURRENT_CONSOLIDATION_CROSSCHECK
    guard: "APPEAL_CONFIDENTIALITY_RULE != UNIVERSAL_MFO_DATA_PROCESSING_RULE"
  - locator: "статья 9 часть 14"
    concept: biometric_identification_for_electronic_consumer_microloan
    rule: "Для заключения договора потребительского займа в электронной форме предусмотрена идентификация или аутентификация заемщика с использованием ЕСИА с биометрическими персональными данными в соответствии со статьями 9 и 10 572-ФЗ."
    evidence_role: PRIMARY_AMENDMENT_TEXT_PLUS_CURRENT_CONSOLIDATION_CROSSCHECK
    guard: "BIOMETRIC_IDENTIFICATION_SCENARIO != UNIVERSAL_BIOMETRIC_PROCESSING_REQUIREMENT_FOR_ALL_MFO_OPERATIONS"
    staged_application: "Общее вступление части 14 — 01.03.2026; для микрофинансовых организаций, определенных пунктом 2.2 части 1 статьи 2 151-ФЗ, применение отложено до 01.03.2027."
  - locator: "статья 9 части 12-13"
    concept: consumer_loan_attempt_and_fraud_prevention_data_exchange
    rule: "Текущая редакция предусматривает запрос Банком России информации о договоре потребительского займа и попытках его заключения, а также получение МФО информации из базы случаев и попыток переводов без добровольного согласия клиента."
    evidence_role: CURRENT_CONSOLIDATION_CROSSCHECK
    guard: "FRAUD_PREVENTION_DATA_FLOW != AUTOMATIC_LEGAL_BASIS_FOR_UNRELATED_PROCESSING"

