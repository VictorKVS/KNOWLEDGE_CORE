protected_information_anchors:
  - locator: "пункт 1.3"
    concept: protected_information_processing_lifecycle
    includes:
      - identification_authentication_authorization
      - electronic_message_creation_transfer_receipt
      - customer_funds_disposition_authority
      - funds_transfer_processing
      - transfer_result_accounting
      - electronic_message_and_transfer_information_storage
    security_properties:
      - confidentiality
      - integrity
      - availability
      - authenticity
  - locator: "пункты 1.4, 1.4.1, 1.4.2"
    concept: access_and_action_audit_logging
    includes:
      - action_timestamp
      - employee_or_customer_identifier
      - technology_segment_code
      - action_result
      - device_identification_information
    guard: "AUDIT_IDENTIFIER_OR_DEVICE_DATA != AUTOMATIC_PDN_CLASSIFICATION_WITHOUT_RECORD_CONTEXT"
  - locator: "пункт 1.6"
    concept: direct_pdn_security_overlay
    rule: "Если защищаемая информация содержит персональные данные, применяются меры безопасности персональных данных при обработке в соответствии со статьей 19 152-ФЗ."
    implementation_references:
      - "Приказ ФСТЭК России № 21 от 18.02.2013"
      - "Постановление Правительства РФ № 1119 от 01.11.2012"
      - "Приказ ФСБ России № 378 от 10.07.2014 при использовании СКЗИ"
    guard: "DIRECT_PDN_SECURITY_REFERENCE != UNIVERSAL_CLASSIFICATION_OF_ALL_PAYMENT_INFORMATION_AS_PDN"
  - locator: "пункт 1.1"
    concept: conformity_assessment_report_retention
    retention: "не менее 5 лет с даты выдачи отчета проверяющей организацией"
    guard: "SECURITY_ASSESSMENT_REPORT_RETENTION != GENERAL_PDN_RETENTION"
  - locator: "пункт 1.5"
    concept: information_security_incident_reporting_context
    note: "Инциденты защиты информации связаны с перечнем типов инцидентов, согласуемым в контексте законодательства о КИИ; сроки/форма сообщения определяются отдельным согласованным порядком."
    guard: "CBR_PAYMENT_SECURITY_INCIDENT_CONTEXT != GENERIC_152FZ_BREACH_RULE"
  - locator: "пункт 9.1"
    concept: conditional_kii_overlay
    rule: "Требования законодательства о КИИ накладываются дополнительно только на объекты информационной инфраструктуры, которые являются объектами КИИ."
    guard: "PAYMENT_INFORMATION_INFRASTRUCTURE != AUTOMATIC_KII_OBJECT"
  - locator: "Приложение 2"
    concept: payment_message_and_cryptographic_information
    examples:
      - "электронные сообщения физических и юридических лиц"
      - "реестры электронных сообщений"
      - "ключевая информация СКЗИ"
      - "информация для идентификации/аутентификации и совершения платежных операций"

