normative_findings:
  - "PP 1241 establishes FGIS Moya Shkola and a direct PDN/information-security layer for educational information-system processing and intersystem exchange."
  - "PP 962/2026 introduced explicit PDN lists by education level. As of 2026-08-30, Appendix 2 (general education) and Appendix 3 (secondary vocational education) are effective; Appendix 1 (preschool) and Appendix 4 (additional education) remain FUTURE_NOT_CURRENT until 2026-09-01."
  - "The active general-education list includes ESIA/regional-system identifiers, SNILS/hash identifiers, name, birth date, sex, contacts, education/assessment/attendance/homework/achievement data and defined data on legal representatives and staff."
  - "Route-specific ESIA consent mechanisms exist, including parent/legal-representative consent for registration of an educational-service user under 14; these are not treated as blanket consent for all education PDN processing."
  - "No source-specific general Moya Shkola retention period was established in this sweep; PP 825 FIS FRDO retention periods are not transferred to PP 1241."
  - "A later 2026-08-10 draft was located but remains DRAFT_NOT_OPERATIVE and is not promoted into the current legal layer."

