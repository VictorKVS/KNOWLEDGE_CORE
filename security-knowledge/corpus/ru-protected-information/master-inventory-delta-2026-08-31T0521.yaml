key_findings:
  - source_id: SEC-SRC-RU-FZ-20-2003
    locator: "статья 16"
    finding: "Информационные ресурсы ГАС «Выборы» прямо включают персональные данные избирателей, участников референдума, кандидатов, доверенных лиц, уполномоченных представителей и членов комиссий; перечни конкретных данных задаются федеральными законами."
    guard: "PERSON_CATEGORIES_DO_NOT_DEFINE_UNLIMITED_FIELD_SET"
  - source_id: SEC-SRC-RU-FZ-20-2003
    locator: "статья 17 пункт 2"
    finding: "Ресурсы, содержащие ПДн, являются федеральными информационными ресурсами и формируются, хранятся и используются в условиях конфиденциальности."
    guard: "CONFIDENTIALITY_REQUIREMENT_NOT_NEW_SECRET_CATEGORY"
  - source_id: SEC-SRC-RU-FZ-20-2003
    locator: "статья 18"
    finding: "Доступ к ресурсам с ПДн ограничен законодательно определенными ролями, необходимостью исполнения обязанностей, доступом гражданина к собственным ПДн и прямо предусмотренным федеральным законом доступом должностных лиц."
    guard: "AUTHORIZED_ACCESS_NOT_UNLIMITED_SECONDARY_USE"
  - source_id: SEC-SRC-RU-FZ-20-2003
    locator: "статья 20"
    finding: "Использование ГАС «Выборы» вне выборов и референдумов допускается только по федеральным законам и НПА ЦИК с сохранением достоверности информации, целостности системы и приоритетности избирательных функций."
    guard: "NON_ELECTION_USE_REQUIRES_SEPARATE_LEGAL_ROUTE"
  - source_id: SEC-SRC-RU-FZ-20-2003
    locator: "статья 21"
    finding: "Закон задает самостоятельный security baseline: сертификация, защита от НСД, подлинность/целостность, защита при передаче, проверки готовности, эксплуатационная документация, сохранность и работоспособность, подготовка работников и ответственность."
    guard: "GAS_SECURITY_BASELINE_NOT_GENERALIZED_TO_ALL_GIS"
  - source_id: SEC-SRC-RU-FZ-20-2003
    locator: "статьи 22 и 24"
    finding: "Передача может идти по сетям связи общего пользования, ведомственным и иным сетям; за нарушения защиты, обработки и использования ресурсов, включая ПДн, установлена ответственность по федеральным законам."
    guard: "NETWORK_USE_NOT_AUTOMATIC_TELECOM_SECRET_CLASSIFICATION"

