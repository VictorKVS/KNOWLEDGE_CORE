key_findings:
  - source_id: SEC-SRC-RU-FZ-67-2002
    locator: "статья 16 пункт 5"
    finding: "Для регистрации избирателей предусмотрена передача определенного законом набора ПДн: ФИО, дата/место рождения, пол, гражданство, адрес, реквизиты документа, удостоверяющего личность, и сведения о его выдаче."
    guard: "ELECTORAL_REGISTER_DATASET_NOT_GENERAL_INTERAGENCY_DATASET"
  - source_id: SEC-SRC-RU-FZ-67-2002
    locator: "статья 16 пункты 6-10"
    finding: "Регистр избирателей обновляется по установленным маршрутам из ЕГР ЗАГС, воинского учета, УИС и судебных решений; учет и численность формируются с использованием ГАС «Выборы»."
    guard: "STATUTORY_SOURCE_ROUTE_REQUIRED_NO_UNLIMITED_SECONDARY_USE"
  - source_id: SEC-SRC-RU-FZ-67-2002
    locator: "статья 16 пункт 12"
    finding: "Избиратель имеет право доступа и уточнения документированной информации (персональных данных) о себе и право знать, кто, кем, кому и для каких целей ее использовал или предоставлял."
    guard: "SECTOR_ACCESS_RIGHTS_DO_NOT_REPLACE_ALL_152_FZ_SUBJECT_RIGHTS"
  - source_id: SEC-SRC-RU-FZ-67-2002
    locator: "статья 17 пункт 11"
    finding: "Список избирателей содержит ФИО, сведения о рождении, адрес места жительства и поля для серии/номера паспорта или заменяющего его документа при выдаче бюллетеня."
    guard: "VOTER_LIST_NOT_PUBLIC_DIRECTORY_OR_GENERIC_IDENTITY_DATASET"
  - source_id: SEC-SRC-RU-FZ-67-2002
    locator: "статья 17 пункты 15.2, 16, 19"
    finding: "Электронный список имеет специальный lifecycle; исправления и исключения отражаются также в ГАС «Выборы», а после публикации результатов данные списка могут использоваться для уточнения регистра избирателей."
    guard: "POST_ELECTION_REUSE_STATUTORILY_SCOPED_NOT_OPEN_SECONDARY_USE"
  - source_id: SEC-SRC-RU-FZ-67-2002
    locator: "статья 70 пункты 10-11"
    finding: "Для списков избирателей, бюллетеней и подписных листов установлен минимальный срок хранения не менее одного года после публикации итогов/результатов; конкретные сроки могут быть больше, а при судебных/уголовных производствах продлеваются."
    guard: "ONE_YEAR_MINIMUM_ELECTORAL_DOCUMENT_RETENTION_NOT_GENERAL_PDN_RETENTION"

