        - ADDRESS_DATA_CONFIDENTIALITY
        - POSTAL_ITEM_INFORMATION_CONFIDENTIALITY
        - POSTAL_MONEY_TRANSFER_INFORMATION_CONFIDENTIALITY
      finding: >-
        Article 15 protects correspondence and postal/telegraph/other communications, requires postal operators to
        preserve communications secrecy, and treats address data plus information about postal items, postal money
        transfers and other communications as communications secrecy.
    pdn_overlap:
      state: CANDIDATE_PENDING_FIELD_AND_SCENARIO_REVIEW
      finding: >-
        Address and user-linked postal information may contain personal data, but postal communications secrecy is a
        separate statutory protected-information regime and is not equivalent to 152-ФЗ applicability.
