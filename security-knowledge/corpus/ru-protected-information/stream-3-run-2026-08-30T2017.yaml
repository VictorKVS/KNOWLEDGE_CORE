normative_findings:
  - "PP 2386 is the current regulatory node for the unified centralized digital platform in the social sphere; PP 1342/2021 and the older PP 181/2017 are predecessor regimes and are not kept as parallel current nodes."
  - "The platform has a direct PDN/information-security layer and supports social protection, pension, medical-social examination, disability/child-disability, rehabilitation and personified-accounting workflows."
  - "The source contains broad person-level identity, social, child, disability, medical/health, educational and payment/account information, but no protected-secret or special-category classification is inferred solely from context or field sensitivity."
  - "Access outside the normal user population requires normative authority/function/obligation justification, a required data set and the prescribed information-interaction route; this is modeled as purpose/authority/data-minimization boundary, not blanket secondary use."
  - "The security layer includes organizational and technical protection measures, unauthorized-access/impact prevention and detection, restoration and security-level control."
  - "Banking-law references and payment/account data create a guarded financial overlap but do not classify every platform record as bank secrecy."
  - "No single global numeric retention period for all platform data was established in this sweep; specific social-contract electronic case files have an archival-law storage route under PP 2191/2025 and must be resolved by record series/lifecycle."

