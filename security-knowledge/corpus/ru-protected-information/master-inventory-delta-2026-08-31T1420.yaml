regime_findings:
  - "The Register is expressly a database containing a body of personal data of voters and referendum participants."
  - "The system collects, systematizes and uses voter/referendum-participant information under electoral law; non-election use requires a separate federal-law basis."
  - "Inputs and refresh routes include МВД/passport-registration sources, ERN and EGR ZAGS, with SMEV-mediated exchanges."
  - "The regulatory lifecycle includes events such as passport issuance, residence changes, military service, imprisonment, death and incapacity/capacity restoration without promoting those contexts into new secret or special-category regimes."
  - "Technical protection against unauthorized access and destructive/distorting/blocking effects is explicit; state-secret information is prohibited in the GAS Vybory database."
  - "The citizen has a self-access right to documented personal data about themselves; this is not public access to the register."

