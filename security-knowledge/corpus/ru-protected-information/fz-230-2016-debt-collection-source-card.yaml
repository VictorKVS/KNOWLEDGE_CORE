    concept: debtor_information_third_party_disclosure_restriction
    rule: "Если иное не предусмотрено федеральным законом, кредитор или представитель кредитора не вправе без согласия должника передавать третьим лицам либо делать доступными сведения о должнике, просроченной задолженности и ее взыскании и любые другие персональные данные должника."
    guard: "SPECIAL_DISCLOSURE_RESTRICTION != COMPLETE_LEGAL_BASIS_ANALYSIS_UNDER_152FZ"
