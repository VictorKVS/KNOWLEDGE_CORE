    guard: "CONSENT_REQUIRED_BY_230FZ_FOR_THIS_OPERATION != UNIVERSAL_CONSENT_REQUIREMENT_FOR_EVERY_PROCESSING_OPERATION"
  - locator: "статья 6 части 6-7"
    concept: confidentiality_and_withdrawal
    rule: "Получатели конфиденциальных сведений в предусмотренных законом переговорах обязаны сохранять конфиденциальность; отзыв согласия прекращает соответствующее раскрытие, если иное не предусмотрено федеральным законом."
    guard: "WITHDRAWAL_EFFECT_IS_OPERATION_AND_CONTEXT_SPECIFIC"
  - locator: "статья 6 часть 8"
    concept: public_disclosure_prohibition
    rule: "Раскрытие сведений о должнике, задолженности, взыскании и иных персональных данных неограниченному кругу лиц, включая Интернет и сообщение по месту работы или учебы, не допускается независимо от наличия согласия из части 3."
    guard: "PUBLIC_DISCLOSURE_PROHIBITION_DOES_NOT_DEFINE_ALL_152FZ_PUBLIC_AVAILABILITY_CASES"
