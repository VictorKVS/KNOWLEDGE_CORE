protected_information_anchors:
  - locator: "ст. 33.10 п. 5(3), п. 6"
    concept: confidentiality_and_pdn_processing
    rule: "Оператор обеспечивает защиту/конфиденциальность информации и обрабатывает в том числе ПДн с соблюдением законодательства о ПДн."
  - locator: "ст. 33.10 п. 7(1)"
    concept: sector_retention
    rule: "Информация в АИС страхования хранится 10 лет со дня прекращения действия договора, если страховым законодательством не установлен более длительный срок."
    guard: "TEN_YEAR_AIS_RETENTION != GENERAL_PDN_RETENTION"
  - locator: "ст. 33.10 п. 7(3)-(6)"
    concept: infrastructure_and_security
    rule: "Основной и резервный комплексы ПАС находятся в РФ; обеспечиваются сохранность, резервирование, защита информации и защита ПДн от угроз."
  - locator: "ст. 33.10 п. 7(11)"
    concept: access_audit
    rule: "Оператор ведет учет запросов на предоставление информации."
  - locator: "ст. 33.10 п. 9"
    concept: biometric_identification
    rule: "В предусмотренном сценарии идентификация физлица возможна с использованием ЕСИА и государственной биометрической системы."
    guard: "BIOMETRIC_OPTION != UNIVERSAL_BIOMETRIC_APPLICABILITY"
  - locator: "ст. 33.11 п. 1, 4"
    concept: person_level_insurance_dataset_quality
    rule: "АИС содержит сведения о страхователях/застрахованных/выгодоприобретателях и страховых отношениях; страховщик отвечает за достоверность, полноту и актуальность."
  - locator: "ст. 33.11 п. 6"
    concept: secret_transfer_boundary
    rule: "Предусмотренное законом представление информации в АИС не является нарушением тайны страхования, служебной, налоговой или коммерческой тайны."
    guard: "AUTHORIZED_AIS_TRANSFER != ABOLITION_OF_SECRET_REGIMES"
  - locator: "ст. 33.12 п. 3"
    concept: narrow_no_separate_consent_rule
    rule: "Отдельное согласие на обработку ПДн не требуется только в прямо описанных договорных сценариях получения/использования страховщиком информации."
    guard: "NARROW_STATUTORY_RULE != BLANKET_NO_CONSENT"
  - locator: "ст. 33.12 п. 4-6"
    concept: subject_access_and_non_pdn_analytics
    rule: "Субъект получает относящуюся к нему информацию и сведения о доступах; отдельная аналитическая выдача по страховой сумме/премии не должна содержать ПДн физлиц."

