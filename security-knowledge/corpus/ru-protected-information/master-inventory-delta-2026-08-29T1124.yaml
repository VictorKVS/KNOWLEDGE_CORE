key_findings:
  - locator: "125-ФЗ ст. 25 ч. 3"
    finding: "75-летний срок — ограничение доступа к конкретным архивным документам с личной/семейной тайной, сведениями о частной жизни или угрозе безопасности, а не общий срок хранения ПДн."
    guard: "75_YEAR_ACCESS_RESTRICTION != GENERAL_PDN_RETENTION"
  - locator: "125-ФЗ ст. 22.1"
    finding: "Документы по личному составу: 75 лет для завершенных до 01.01.2003 и 50 лет для завершенных после 01.01.2003, если специальный перечень не устанавливает иной срок."
    guard: "PERSONNEL_DOCUMENT_RETENTION != ALL_EMPLOYEE_PDN_RETENTION"
  - locator: "152-ФЗ ст. 1 ч. 2 п. 2"
    finding: "Организация хранения, комплектования, учета и использования содержащих ПДн архивных документов по архивному законодательству прямо исключена из сферы 152-ФЗ."
    guard: "ARCHIVAL_SCOPE_EXCLUSION_IS_ACTIVITY_AND_REGIME_BOUND"
  - locator: "Приказ Росархива № 77, п. 134"
    finding: "Для ПДн в СХЭД Правила прямо требуют защиты по законодательству РФ и ссылаются на ст. 7 152-ФЗ и ст. 16 149-ФЗ."
    guard: "DIRECT_RULE77_PDN_PROTECTION_REFERENCE != AUTOMATIC_APPLICATION_OF_ALL_152FZ_TO_ARCHIVAL_RELATIONS"
  - locator: "Приказ Росархива № 77, пп. 135-137"
    finding: "СХЭД должна поддерживать прием, хранение, учет, резервное копирование, восстановление, контроль состояния, миграцию/конвертацию и нормативное удаление электронных архивных документов."
    guard: "SYSTEM_CONTROL_REQUIREMENT != INDEPENDENT_RETENTION_PERIOD"

