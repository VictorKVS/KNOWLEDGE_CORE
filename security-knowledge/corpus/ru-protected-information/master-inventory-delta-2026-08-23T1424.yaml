proof_floor:
  - "Статья 41 Закона РФ № 2124-I формирует самостоятельные режимы конфиденциальности источника СМИ, сведений гражданина и защиты идентифицирующей информации несовершеннолетних; MEDIA_CONFIDENTIALITY != PERSONAL_DATA."
  - "Части 1-2 статьи 41 запрещают редакции разглашать сведения, переданные гражданином с условием тайны, и раскрывать источник, кроме узкого требования суда по находящемуся у него делу."
  - "Части 3-5 статьи 41 содержат специальные ограничения и исключения для сведений, позволяющих прямо или косвенно идентифицировать несовершеннолетнего."
  - "Последнее выявленное locator-specific изменение статьи 41 — 50-ФЗ от 05.04.2013, официальная публикация 0001201304080008."
  - "Текущие source-level события 215-ФЗ от 23.07.2025 и 304-ФЗ от 31.07.2025 статью 41 не меняют; 215-ФЗ от 26.06.2026 вступает в силу 01.09.2026 и также не меняет статью 41."
  - "Exact current authoritative bytes не получены; MIME, byte length, SHA-256 и retrieved_at не придуманы."

