legal_anchors:
  - locator: "пункт 2 Порядка"
    concept: AUTHORIZED_PERSON_SCOPE_FOR_MEDICAL_DOCUMENT_ACCESS
    verified_proposition: >-
      Порядок регулирует непосредственное ознакомление с медицинской документацией пациента, законного представителя и иных лиц, допускаемых в предусмотренных законом сценариях; допуск связан с режимом врачебной тайны и волей пациента/законного представителя.
    evidence_state: OFFICIAL_MINZDRAV_OPERATIONAL_CROSSCHECK
  - locator: "пункты 4-5 Порядка / официальный шаблон Минздрава"
    concept: ACCESS_REQUEST_PERSON_LEVEL_DATASET
    verified_proposition: >-
      В запросе используются ФИО пациента и уполномоченного лица, место жительства/пребывания, реквизиты документа, удостоверяющего личность, реквизиты документа о полномочиях, период оказания помощи, почтовый или электронный адрес и при наличии телефон.
    evidence_state: OFFICIAL_MINZDRAV_OPERATIONAL_CROSSCHECK
  - locator: "пункт 7 Порядка / официальный шаблон Минздрава"
    concept: MEDICAL_DOCUMENT_ACCESS_WORKFLOW_DEADLINES
    verified_proposition: >-
      В течение двух рабочих дней заявителя информируют о дате, начиная с которой в течение пяти рабочих дней возможно ознакомление; эти сроки описывают workflow доступа, а не срок хранения персональных данных.
    evidence_state: OFFICIAL_MINZDRAV_OPERATIONAL_CROSSCHECK
  - locator: "пункт 10 Порядка"
    concept: ACCESS_AUDIT_RECORD_IN_MEDICAL_DOCUMENTATION
    verified_proposition: >-
      В медицинскую документацию вносятся сведения о факте ознакомления, включая даты запроса/ознакомления, ФИО ознакомившегося лица и данные работника, зафиксировавшего ознакомление.
    evidence_state: CURRENT_TEXT_CROSSCHECK_VERSION_CHAIN_REVIEW_REQUIRED

