protected_information_anchors:
  - locator: "пункт 1, абзацы 2-5"
    concept: protected_information_scope
    includes:
      - "информация, в том числе составляющая банковскую тайну, в электронных документах банковских операций"
      - "информация для авторизации клиентов и удостоверения права распоряжаться денежными средствами"
      - "информация об осуществленных банковских операциях"
      - "информация по распоряжениям пользователя платформы цифрового рубля"
      - "ключевая информация СКЗИ и электронной подписи"
  - locator: "пункт 1, последний абзац"
    concept: direct_pdn_security_overlay
    rule: "Если защищаемая информация содержит персональные данные, применяются меры безопасности персональных данных при обработке в соответствии со статьей 19 152-ФЗ."
  - locator: "пункт 5.2"
    concept: protected_information_processing_lifecycle
    includes:
      - identification_authentication_authorization
      - message_creation_transfer_receipt
      - customer_disposition_authority
      - banking_operation_and_accounting
      - storage_of_messages_and_operation_information
  - locator: "пункт 5.2.1"
    concept: customer_device_and_mobile_identifier_security
    note: "Включает идентификацию устройств клиента, проверку использования абонентского номера и контроль изменения идентификационного модуля устройства в предусмотренных сценариях."
  - locator: "пункт 13.2"
    concept: conformity_assessment_report_retention
    retention: "не менее 5 лет с даты выдачи отчета проверяющей организацией"
    guard: "SECTOR_SECURITY_ASSESSMENT_RETENTION != GENERAL_PDN_RETENTION"
  - locator: "пункт 13.4"
    concept: security_conformity_assessment_frequency
    frequency: "не реже одного раза в 2 года"
  - locator: "Приложение 1"
    concept: unauthorized_transfer_case_person_level_dataset
    examples:
      - "ФИО заявителя/плательщика"
      - "дата рождения"
      - "реквизиты документа, удостоверяющего личность"
      - "идентификаторы операции, платежной карты/счета/электронного средства платежа"
      - "в предусмотренных сценариях абонентский номер подвижной радиотелефонной связи"
      - "сумма, валюта, дата и время операции"
  - locator: "Приложение 2"
    concept: incident_reporting_deadlines
    deadlines:
      information_security_incident_or_illegal_disclosure: "в течение 3 часов с момента выявления"
      investigation_result: "в течение 30 дней после направления первичного сообщения"
      kii_significant_object_related_computer_incident: "в течение 3 часов"
      other_computer_incident: "в течение 24 часов"
    guard: "CBR_851P_INCIDENT_DEADLINES != GENERIC_152FZ_BREACH_DEADLINES"
  - locator: "пункт 14"
    concept: kii_conditional_overlay
    rule: "Для объектов информационной инфраструктуры, являющихся объектами КИИ, применяются также требования законодательства о КИИ."
    guard: "BANK_SYSTEM != AUTOMATIC_KII_OBJECT"

