normative_findings:
  - "The ACBPDP passenger/crew databases are part of EGIS OTB and are fed by defined transport-sector and public-authority participants rather than by an unconstrained transport data pool."
  - "Point 13 sets a 7-year retention period for personal data in ACBPDP from receipt by the EGIS OTB operator; this was kept strictly scoped to that operator/system lifecycle."
  - "Points 42/46/50/56 add, when actually captured by the supplier system, telephone, e-mail, account login/password-hash data, IP/port and payment-provider/account-tail metadata across air, road, rail, sea/inland-water modes."
  - "Telecom and bank-secrecy edges remain conditional: the presence of a phone/e-mail/IP or payment/account-tail field does not itself prove the statutory secret regime."
  - "Point 18 contains the direct PDN security route to article 19 of 152-FZ and protected information exchange using cryptographic means or SMEV."
  - "Operational transfer deadlines were separated from PDN subject-response and incident-notification deadlines."

