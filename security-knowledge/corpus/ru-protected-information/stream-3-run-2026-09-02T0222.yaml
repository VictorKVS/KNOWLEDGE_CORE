normative_findings:
  - "№ 209н is current from 01.09.2026; the previous № 947н is repealed from that date."
  - "№ 209н covers formation, signing, storage, EGISZ registration and lawful access to electronic medical documents across the defined actor set."
  - "№ 209н point 21 requires EMD storage for not less than the retention term of the corresponding paper medical document."
  - "№ 209н point 22 requires all corrected versions and their signatures to be stored throughout the EMD retention term."
  - "№ 274н is current and governs ambulatory forms 025/у, 025-1/у, 070/у, 072/у, 076/у and 079/у."
  - "Forms 076/у and 079/у create a scoped child-health-data overlap; 079/у contains person-level child identifiers and health-status context."
  - "№ 274н replaces the relevant 834н form regime from 01.09.2025; electronic application of the new forms is separately staged from 01.09.2027."

