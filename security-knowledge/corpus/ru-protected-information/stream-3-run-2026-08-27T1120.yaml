legal_modeling:
  anchors_added: 7
  overlap_relations_added: 4
  important_boundaries:
    - "Point 63 directly places EGISZ information protection in the context of Russian personal-data law."
    - "Point 30 defines a dedicated information-security subsystem with access control, security-event logging, antimalware, intrusion detection/prevention, security analysis, technical/virtualization protection and cryptography, protecting confidentiality/integrity/availability."
    - "Points 64-65 place organizational/technical security obligations on the EGISZ operator, including certified FSB/FSTEC tools, attestation and protection in transit."
    - "Appendix 1 contains explicit person-level medical-worker fields and patient/medical-document flows."
    - "PP 2164/2025 adds EGISZ interaction with the unified federal population register; this is a data-flow relation, not proof that all EGISZ data is exchanged."
    - "PP 211/2026 is future law until 01.09.2026 and must not be represented as current on 27.08.2026."
  guards:
    - "EGISZ_SYSTEM_SCOPE != AUTOMATIC_152_FZ_APPLICABILITY_TO_EVERY_HEALTHCARE_PROCESS"
    - "DIRECT_PDN_REFERENCE != AUTOMATIC_LEGAL_BASIS_FOR_EVERY_OPERATION"
    - "MEDICAL_DOCUMENT != AUTOMATIC_MEDICAL_SECRECY_CLASSIFICATION_FOR_EVERY_FIELD"
    - "CERTIFIED_FSB_FSTEC_CONTROLS != AUTOMATIC_KII_187_FZ_APPLICABILITY"
    - "No applicability without actor/system/record/operation/purpose/legal-basis proof."

