key_findings:
  - "Ст.440: документы об обработке ПДн — постоянно по месту утверждения либо 3 года после замены новыми в других организациях; это срок документа, а не массива ПДн."
  - "Ст.441: согласие на обработку ПДн — 3 года после истечения срока действия или отзыва, если федеральный закон или договор не устанавливает иное; это не общий срок хранения ПДн."
  - "Ст.438-439: recruitment/candidate records имеют 3 года, 1 год или 5 лет в зависимости от конкретного класса документа; единый срок для ПДн кандидатов не выводится."
  - "Ст.444-445: личные карточки и личные дела — 50/75 лет ЭПК; срок документно-архивный, а не универсальный для любых employee PDN."
  - "Ст.166-167: NDA/обязательства по информации ограниченного доступа — 3 года по специальным точкам отсчета; срок записи не равен продолжительности режима тайны."
  - "Ст.183(ж): учет экземпляров/копий документов и носителей с информацией ограниченного доступа — 5 лет; это не срок хранения самого защищаемого содержимого."

