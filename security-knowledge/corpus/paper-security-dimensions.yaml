schema_version: 1
purpose: Define the complete multidimensional corpus required before any meaningful organization-wide compliance/security dry run. A partial regulator-only run is not considered representative.
dimensions:
  LEGAL_AND_REGULATORY:
    includes:
      - federal_laws_and_codes
      - presidential_decrees
      - government_decrees
      - FSTEK_orders_and_methods
      - FSB_orders_and_crypto/GosSOPKA_rules
      - Roskomnadzor_orders_and_checklists
      - sector_and_functional_regulators
      - licensing_and_certification_rules
  STANDARDS_AND_GOST:
    includes:
      - GOST_R_ISO_IEC_27001
      - GOST_R_ISO_IEC_27002
      - GOST_R_ISO_IEC_27005
      - GOST_15408_family
      - GOST_R_57580_1_and_57580_2
      - risk_management_standards
      - incident_management_standards
      - business_continuity_standards
      - secure_development_standards
      - conformity_assessment_and_testing_standards
      - cryptography_and_information_protection_standards
      - audit_and_quality_management_standards_where_relevant
  THREAT_MODELING:
    includes:
      - FSTEK_threat_modeling_methodology
      - FSTEK_BDU
      - threat_sources
      - violator_models
      - attack_scenarios
      - assets_and_security_properties
      - vulnerabilities_and_preconditions
      - consequences
      - relevance_decision_rules
      - review_triggers
  RISK_MANAGEMENT:
    includes:
      - qualitative_methods
      - semi_quantitative_methods
      - quantitative_methods_where_data_supports
      - likelihood
      - impact
      - inherent_risk
      - control_effectiveness
      - residual_risk
      - risk_acceptance
      - treatment_options
      - risk_owner
      - review_horizon
      - uncertainty_and_confidence
  CLASSIFICATION_AND_CATEGORIZATION:
    includes:
      - ISPDn_protection_levels
      - GIS_classes
      - CII_categories
      - ASU_TP_classes
      - information_categories
      - asset_criticality
      - data_categories
      - system_boundaries
      - scope_rules
  GOVERNANCE_AND_ROLES:
    includes:
      - CISO_and_security_roles
      - PDn_responsible_persons
      - CII_responsible_roles
      - system_owner
      - data_owner
      - administrators
      - users
      - contractors
      - segregation_of_duties
      - appointment_and_authority_documents
  DOCUMENTATION_SYSTEM:
    includes:
      - security_policy
      - personal_data_policy
      - threat_models
      - technical_specifications
      - access_control_regulations
      - incident_response_documents
      - backup_and_recovery_documents
      - change_management
      - vulnerability_management
      - asset_management
      - supplier_security
      - continuity_plans
      - training_and_awareness
      - logs_journals_registers
      - acts_protocols_reports
      - local_normative_acts
      - document_lifecycle_and_review
  SECURITY_CONTROLS:
    includes:
      - identity_and_authentication
      - access_control
      - logging_and_monitoring
      - malware_protection
      - intrusion_detection
      - vulnerability_management
      - configuration_management
      - network_security
      - segmentation
      - cryptography
      - endpoint_security
      - backup_and_recovery
      - physical_security
      - removable_media
      - secure_development
      - incident_response
      - supplier_security
      - continuity
  EVIDENCE_AND_AUDIT:
    includes:
      - evidence_catalog
      - evidence_strength
      - source_traceability
      - audit_questions
      - sampling
      - technical_validation
      - document_validation
      - configuration_validation
      - interviews
      - testing
      - findings
      - remediation
      - retest
      - evidence_freshness
  INCIDENT_AND_NOTIFICATION:
    includes:
      - event_classification
      - incident_classification
      - CII_reporting
      - PDn_incident_reporting
      - GosSOPKA_interaction
      - regulator_notifications
      - deadlines
      - notification_content
      - evidence_preservation
      - post_incident_review
  PRODUCTS_CERTIFICATION_AND_LIFECYCLE:
    includes:
      - FSTEK_certificates
      - FSB_certificates_and_crypto_suitability
      - licenses_and_permissions
      - certificate_scope
      - certified_versions
      - expiration
      - suspension_restoration_revocation
      - renewal_risk
      - vendor_support_lifecycle
      - replacement_and_migration_risk
  ASSET_CONFIGURATION_AND_ARCHITECTURE_FACTS:
    includes:
      - asset_inventory
      - software_inventory
      - versions
      - network_zones
      - data_flows
      - trust_boundaries
      - external_connections
      - remote_access
      - cloud_use
      - virtualization
      - databases
      - endpoints
      - mobile_devices
      - OT_and_specialized_equipment
  PERSONNEL_AND_COMPETENCE:
    includes:
      - competency_requirements
      - training
      - awareness
      - privileged_personnel
      - admission_and_termination
      - contractors
      - role_review
  THIRD_PARTIES_AND_CONTRACTS:
    includes:
      - processors_and_contractors
      - SLA
      - NDA
      - security_clauses
      - data_processing_agreements
      - subcontractors
      - supplier_risk
      - incident_obligations
      - audit_rights
      - exit_and_data_return_destruction
  CONTINUITY_AND_RESILIENCE:
    includes:
      - BIA
      - RTO
      - RPO
      - redundancy
      - backup
      - recovery_testing
      - disaster_recovery
      - crisis_management
      - dependency_analysis
  CHANGE_AND_LIFECYCLE:
    includes:
      - system_creation
      - commissioning
      - operation
      - modernization
      - configuration_change
      - reclassification_reassessment
      - decommissioning
      - data_destruction_or_archival
      - certificate_and_license_changes
      - regulatory_change
  METRICS_AND_EXPERT_JUDGEMENT:
    includes:
      - legal_authority
      - applicability_confidence
      - source_quality
      - traceability
      - evidence_strength
      - control_coverage
      - technical_effectiveness
      - maturity
      - residual_risk
      - freshness
      - uncertainty
      - expert_confidence
      - alternative_interpretations
  CROSS_REGIME_INTERSECTIONS:
    includes:
      - same_organization
      - same_system
      - same_asset
      - same_data_flow
      - same_incident
      - overlapping_requirements
      - shared_controls
      - shared_evidence
      - distinct_notifications
      - stricter_combined_implementation
completion_gate_before_full_org_run:
  - all_P0_legal_corpora_registered_and_versioned
  - core_GOST_and_risk_methodologies_ingested
  - threat_modeling_methodology_and_threat_catalog_connected
  - classification_and_categorization_rules_connected
  - evidence_and_audit_model_connected
  - product_certification_lifecycle_connected
  - cross_regime_intersection_engine_available
  - unified_control_mapping_available
  - expert_metrics_available
  - no_full_org_run_if_major_dimension_is_missing
output_of_first_real_full_org_run:
  - applicable_regimes
  - applicable_sources
  - atomic_requirements
  - classifications_and_categories
  - threat_model_inputs_and_gaps
  - risk_register_inputs
  - mandatory_documents
  - roles_and_appointments
  - unified_controls
  - evidence_matrix
  - audit_plan
  - incident_notification_matrix
  - certified_product_constraints
  - gaps
  - conflicts
  - remediation_plan
  - expert_confidence_and_uncertainty
