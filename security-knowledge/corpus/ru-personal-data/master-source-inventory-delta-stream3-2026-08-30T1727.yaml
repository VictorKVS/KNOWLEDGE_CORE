source_title: "Постановление Правительства РФ от 13.07.2022 № 1241 — ФГИС «Моя школа»"
parent_source_id: SEC-SRC-RU-FZ-273-2012

pdn_overlap:
  status: DIRECT_TEXTUAL_AND_OPERATIONAL_OVERLAP
  direct_anchors:
    - "Положение о ФГИС: разграничение доступа, конфиденциальность, целостность, доступность и требования защиты информации"
    - "пункт 5(4) после ПП № 1545/2023: при взаимодействии с информационно-коммуникационной образовательной платформой защита информации и ПДн обеспечивается по законодательству РФ"
    - "ПП № 962/2026: установлены отдельные перечни персональных данных участников образовательных отношений по уровням образования"
    - "ПП № 962/2026: предусмотрены ЕСИА-маршруты идентификации/получения установленных сведений и согласие законного представителя для регистрации пользователя младше 14 лет в ЕСИА"
  lawful_basis_statement: "ПП № 1241 регулирует конкретную ФГИС и установленные информационные потоки; оно не является универсальным основанием для любой обработки ПДн образовательной организацией вне доказанного сценария, роли и цели."

active_person_level_examples_as_of_2026_08_30:
  general_education_appendix_2:
    effective_from: "2026-08-17"
    examples:
      - "идентификатор учетной записи ЕСИА и идентификатор региональной ГИС"
      - "СНИЛС при наличии и хэш-идентификаторы, полученные из предусмотренных государственных систем"
      - "ФИО, дата рождения, пол"
      - "адрес электронной почты и мобильный номер при наличии"
      - "сведения об образовательной организации, программе, уровне/периоде/форме обучения, классе/группе"
      - "сведения о текущем контроле, отметках, промежуточной/итоговой аттестации, достижениях, посещаемости и домашних заданиях"
      - "отдельные сведения о статусах/участии в предусмотренных образовательных и детско-молодежных процессах"
      - "данные родителей/законных представителей, включая идентификаторы, ФИО, дату рождения, контакты и подтверждение полномочий"
      - "данные работников, включая предусмотренные идентификационные, кадровые и квалификационные сведения"
  secondary_vocational_appendix_3:
    effective_from: "2026-08-17"
    status: ACTIVE_SEPARATE_PDN_LIST
    guard: "ROLE_AND_RECORD_TYPE_MATCH_REQUIRED"

