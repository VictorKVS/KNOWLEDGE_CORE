children_boundary:
  status: DIRECT_CONTEXT_WITH_CLASSIFICATION_GUARDS
  evidence: "Система прямо обрабатывает сведения обучающихся, в том числе детей, и законных представителей; отдельный маршрут ЕСИА предусматривает согласие законного представителя для регистрации пользователя образовательного сервиса младше 14 лет."
  classification_guards:
    - "CHILD_CONTEXT_NOT_SPECIAL_CATEGORY_PDN_AUTOMATICALLY"
    - "PRIVILEGED_CATEGORY_STATUS_NOT_SPECIAL_CATEGORY_PDN_AUTOMATICALLY"
    - "CHILD_YOUTH_MOVEMENT_PARTICIPATION_NOT_POLITICAL_OR_IDEOLOGICAL_AFFILIATION_BY_DEFINITION"

identity_and_access:
  - finding: "Используются ЕСИА, региональные ГИС, хэш-идентификаторы и предусмотренные межсистемные маршруты для идентификации и обмена."
    guard: "IDENTITY_ROUTE_NOT_UNLIMITED_SECONDARY_USE"
  - finding: "Получение через ЕСИА отдельных идентификационных и контактных сведений в предусмотренном информационно-коммуникационном контуре связано с согласием пользователя."
    guard: "ESIA_ROUTE_CONSENT_NOT_BLANKET_PDN_CONSENT"
  - finding: "Для пользователя младше 14 лет предусмотрен маршрут согласия родителя/законного представителя на регистрацию в ЕСИА."
    guard: "ESIA_REGISTRATION_CONSENT_NOT_GENERAL_EDUCATION_PROCESSING_BASIS"

information_security_overlap:
  - finding: "ФГИС должна обеспечивать разграничение прав, конфиденциальность, целостность и доступность информации."
    guard: "SECURITY_CONTROL_DUTY_NOT_NEW_SECRET_REGIME"
  - finding: "Изменения № 962 добавляют защитные и аттестационные функции для региональных ГИС образования в установленном контуре."
    guard: "CONTROL_OVERLAY_REQUIRES_SYSTEM_SCOPE_AND_AGREEMENT_MATCH"

retention_nodes:
