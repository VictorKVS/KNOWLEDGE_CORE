    official_portal_summary_verified:
      - {act: "315-ФЗ от 02.07.2021", effect: "посмертное раскрытие врачебной тайны в предусмотренном законом порядке", exact_binary: PENDING}
  applicability_guard: >-
    Не выводить применимость конкретного требования 152-ФЗ только из статуса медицинской организации, наличия медицинской документации, сведений о здоровье или врачебной тайны. Для каждого требования доказать actor/role, субъекта данных, конкретные поля, операцию обработки, цель, основание, канал передачи и действующий locator. Исключение из запрета разглашения по статье 13 часть 4 не является автоматически правовым основанием для любой обработки или передачи персональных данных.

