  statutory_pdn_anchor: "323-ФЗ статья 13 часть 4 пункт 8"
  current_text_finding: >-
    Режим врачебной тайны охватывает факт обращения за медицинской помощью, состояние здоровья, диагноз и иные сведения обследования/лечения и устанавливает отдельную обязанность неразглашения. Часть 4 содержит сценарные исключения, а пункт 8 прямо связывает обмен информацией между медицинскими организациями для оказания медицинской помощи с требованиями законодательства Российской Федерации о персональных данных. Это сильная прямая нормативная связь с PDN-режимом, но не доказательство универсальной применимости каждого требования 152-ФЗ к любому медицинскому процессу.
