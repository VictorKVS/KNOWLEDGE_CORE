  primary_locator: "статья 3 Федерального закона от 19.07.2007 № 196-ФЗ «О ломбардах»"
  current_text_finding: >-
    Статья 3 устанавливает специальный режим профессиональной тайны для сведений, полученных ломбардом от заемщика или поклажедателя в связи
    с договором займа или хранения, и возлагает на ломбард и работников обязанность конфиденциальности. Банк России прямо подтверждает эту обязанность.
  evidence_quality:
    official_current_locator: "https://pravo.gov.ru/proxy/ips/?docbody=&nd=102115923"
    official_regulator_current_context: "https://www.cbr.ru/microfinance/explan/lombard/"
    regulator_finding: "Банк России подтверждает обязанность по статье 3 и ссылается на состав тайны по части 1 статьи 3."
    current_consolidated_crosscheck: "редакция 196-ФЗ от 28.12.2024"
    latest_amendment_official_publication: "522-ФЗ, publication id 0001202412280035"
    exact_current_authoritative_binary: PENDING
  applicability_guard: >-
    Не выводить применимость 152-ФЗ только из факта заключения договора с ломбардом или существования профессиональной тайны. Для конкретного
    требования определить идентифицируемое физическое лицо, состав данных, операцию, цель, роль ломбарда/работника/получателя, правовое основание,
    срок и канал раскрытия. PAWNSHOP_SECRET != PERSONAL_DATA; OVERLAP != APPLICABILITY.

