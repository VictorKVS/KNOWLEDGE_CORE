source_id: SEC-SRC-RU-MINTRANS-ORDER-162-2024
source_title: "Приказ Минтранса России от 02.05.2024 № 162 — АЦБПДП пассажиров и экипажей"
source_action: REUSED_EXISTING_CANONICAL_NODE

pdn_overlap:
  status: DIRECT_TEXTUAL_AND_OPERATIONAL_OVERLAP
  direct_anchors:
    - "АЦБПДП входят в ЕГИС ОТБ и формируются из person-level сведений пассажиров и персонала (экипажа)."
    - "Пункт 13 устанавливает 7-летнее хранение ПДн оператором ЕГИС ОТБ в АЦБПДП со дня получения."
    - "Пункт 15 прямо увязывает отдельный международный маршрут передачи с 152-ФЗ и 16-ФЗ."
    - "Пункт 18 связывает защищенную передачу с мерами безопасности по статье 19 152-ФЗ/СКЗИ либо СМЭВ."
  lawful_basis_statement: "Приказ № 162 регулирует конкретный контур транспортной безопасности и роли участников АЦБПДП; он не является универсальным основанием для любой обработки ПДн транспортной организацией."

person_level_layers:
  base_identity_and_trip:
    examples:
      - "ФИО, дата рождения, вид и номер удостоверяющего документа"
      - "пункт отправления/назначения, вид маршрута, дата поездки"
      - "пол, гражданство; для экипажа — должность/категория"
    guard: "TRANSPORT_ROLE_AND_OPERATION_MATCH_REQUIRED"
  digital_transaction_metadata:
    locators: "пункты 42, 46, 50, 56"
    examples:
      - "номер телефона и e-mail"
      - "логин и хеш пароля при фактической фиксации"
      - "IP-адрес и порт"
      - "наименование банка/финансовой организации/поставщика банковских услуг и последние четыре цифры счета/вклада"
    guards:
      - "PHONE_EMAIL_IP_NOT_TELECOM_SECRECY_AUTOMATICALLY"
      - "PAYMENT_METADATA_NOT_BANK_SECRECY_AUTOMATICALLY"
      - "PASSWORD_HASH_FIELD_NOT_NEW_STATUTORY_SECRET_CATEGORY"

retention_nodes:
  - locator: "Порядок, пункт 13"
    rule: "7 лет со дня получения оператором ЕГИС ОТБ персональных данных в АЦБПДП"
    guard: "ACBPDP_OPERATOR_RETENTION_NOT_CARRIER_SOURCE_SYSTEM_OR_GENERAL_PDN_RETENTION"
  - locator: "исходные системы поставщиков"
    rule: "срок хранения исходной билетной/CRM/перевозочной системы этим правилом автоматически не установлен"
    guard: "SEPARATE_PURPOSE_RECORD_SERIES_AND_LAWFUL_BASIS_REVIEW_REQUIRED"

purpose_access_and_security:
  - finding: "Получатели/потребители сведений определены нормативным контуром ЕГИС ОТБ; наличие ведомства в перечне не означает неограниченное вторичное использование."
    guard: "RECIPIENT_PURPOSE_AUTHORITY_AND_DATASET_MATCH_REQUIRED"
  - finding: "Для передачи предусмотрены защищенные каналы, СКЗИ и меры безопасности по угрозам, определяемым в соответствии со статьей 19 152-ФЗ, либо СМЭВ."
    guard: "SECURITY_REQUIREMENT_NOT_NEW_CLASSIFICATION"
  - finding: "Технологические сроки передачи 15/30 минут и 24 часа для экипажа относятся к информационному обмену."
    guard: "TRANSFER_SLA_NOT_DATA_SUBJECT_OR_INCIDENT_NOTIFICATION_SLA"

cross_regime_edges:
