applicability:
  trigger: INDIVIDUALIZED_REQUIREMENT_UNDER_152FZ_ARTICLE_13_1
  excluded_data:
    - ANONYMIZED_DATA_OF_FOREIGN_CITIZENS_OR_STATELESS_PERSONS_COLLECTED_OUTSIDE_RUSSIA
  fail_closed_rule: >-
    Do not apply the transmission workflow merely because an operator processes or
    anonymizes personal data; receipt of the article 13.1 requirement must be established.

interaction_rules:
  - id: PP966-RULE-1
    locator: rules.clause_1
    rule: Define Ministry-operator interaction and information-system interaction for the article 13.1 route.
  - id: PP966-RULE-2A
    locator: rules.clause_2.paragraphs_1_2
    actor: Ministry_and_operator
    rule: >-
      Use the operator cabinet in the Ministry system, the Gosuslugi cabinet when technically
      available, postal communication, or direct removable-media delivery where applicable;
      system interaction uses direct connection or SMEV, including the unified data-access service.
  - id: PP966-RULE-2B
    locator: rules.clause_2.paragraph_3
    actor: Ministry_of_Digital_Development
    condition: SMEV_INTERACTION
    rule: Provide typical reusable software free of charge and assist the operator with configuration and adaptation.
  - id: PP966-RULE-2C
    locator: rules.clause_2.paragraph_4
    actor: Operator
    condition: CABINET_INTERACTION
    rule: >-
      Use FSB-certified cryptographic protection in accordance with applicable Russian
      national-standard rules and principles for cryptographic protection.
  - id: PP966-RULE-2D
    locator: rules.clause_2.paragraphs_5_6
    actors: [Ministry_of_Digital_Development, Operator]
    rule: >-
      The Ministry sends the article 13.1 requirement within the stated scope; after receipt,
      the operator connects using suitable FSB-certified cryptographic protection or interacts through SMEV.
  - id: PP966-RULE-2E
    locator: rules.clause_2.paragraph_7
    actors: [Ministry_of_Digital_Development, Operator]
    rule: >-
      Protect information in interacting systems and channels against unlawful destruction,
      blocking, modification or copying through organizational and technical measures and
      operational control under applicable FSB and FSTEC requirements.
  - id: PP966-RULE-3A
    locator: rules.clause_3.paragraphs_1_3
    actors: [Ministry_of_Digital_Development, Operator]
    rule: >-
      The operator reviews the requirement within the period stated in it. The Ministry sets
      that period considering requested volume and the applicable case under Decree No. 538,
      subject to the minimum periods modeled below.
  - id: PP966-RULE-3B
    locator: rules.clause_3.paragraphs_4_5
    actor: Ministry_of_Digital_Development
    rule: Limit the frequency of requirements according to the Decree No. 538 case group.
  - id: PP966-RULE-4
    locator: rules.clause_4.subclauses_a_b
    actor: Operator
    rule: >-
      Sign the anonymized data with an enhanced qualified electronic signature and provide
      them through the operator cabinet or SMEV; if neither connection route is technically
      available, deliver them directly on removable media with organizational and technical protection.
  - id: PP966-RULE-5
    locator: rules.clause_5
    actor: Operator
    rule: >-
      If all requested data are absent, send a reasoned refusal; if only part is absent, refuse
      that part and provide the available remainder under clause 4. Use a signed paper document
      by post or an enhanced-qualified-signature electronic document through the permitted cabinet route.
  - id: PP966-RULE-6
    locator: rules.clause_6
    actor: Ministry_of_Digital_Development
    rule: >-
      On finding unreliable or incomplete data or noncompliance with Government requirements,
      methods or procedure, send a repeat requirement identifying the discrepancies.
  - id: PP966-RULE-7
    locator: rules.clause_7
    actor: Operator
    rule: Provide corrected or supplemented data after a repeat requirement using the clause 4 procedure.

