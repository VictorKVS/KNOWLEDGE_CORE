non_requirements:
  - The 15-working-day clock belongs to the Ministry's repeat requirement, not to operator correction.
  - Clause 7 states no universal operator deadline for corrected or supplemented data.
  - The 30- and 5-working-day values are minimum periods for the individualized requirement, not universal maximums.
  - A removable-media route is conditional on lack of technical ability to use both connection routes.
  - The decree does not authorize transmission of unrequested data.
  - The decree does not replace the anonymization requirements and methods in Decree No. 1154.
  - No fixed retention period is stated by this decree.

