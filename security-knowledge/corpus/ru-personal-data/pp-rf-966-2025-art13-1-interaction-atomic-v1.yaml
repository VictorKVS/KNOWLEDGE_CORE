title: Clause-level operator and Ministry interaction rules under Government Decree No. 966 of 26 June 2025
scope: >-
  Interaction between the Ministry of Digital Development and an operator, and between
  their information systems, after an individualized requirement under Federal Law
  No. 152-FZ article 13.1. This model does not create a general anonymization duty.

