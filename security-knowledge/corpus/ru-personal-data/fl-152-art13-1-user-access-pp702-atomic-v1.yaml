schema_version: "1.0"
id: RU-FL152-ART13-1-USER-ACCESS-PP702-ATOMIC-V1
title: Article 13.1 user eligibility, temporal access, use restrictions and Decree No. 702 verification workflow
scope: >-
  Federal Law No. 152-FZ article 13.1 parts 7 through 12 and Government Decree
  No. 702 of 22 May 2025. The model connects statutory user classes and access/use
  restrictions to the class-2 applicant verification and reverification procedure.

