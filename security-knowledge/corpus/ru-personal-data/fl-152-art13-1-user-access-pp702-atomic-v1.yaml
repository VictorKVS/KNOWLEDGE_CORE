statutory_user_classes:
  - id: ARTICLE13_1_PART7_ITEM1_PUBLIC_USER
    members:
      - STATE_BODY
      - ORGANIZATION_SUBORDINATE_TO_STATE_BODY
      - MUNICIPAL_BODY
      - ORGANIZATION_SUBORDINATE_TO_MUNICIPAL_BODY
      - STATE_EXTRA_BUDGETARY_FUND_BODY
    pp702_check_required: false
  - id: ARTICLE13_1_PART7_ITEM2_PRIVATE_USER
    members: [RUSSIAN_CITIZEN, RUSSIAN_LEGAL_ENTITY]
    pp702_check_required: true
    all_applicable_criteria_required: true

private_user_eligibility_criteria:
  - id: ART13_1_7_2_A_OPERATOR_REGISTER
    applies_to: [RUSSIAN_CITIZEN, RUSSIAN_LEGAL_ENTITY]
    rule: Applicant information is present in the article 22 operator register.
  - id: ART13_1_7_2_B_RUSSIAN_CONTROL
    applies_to: [RUSSIAN_LEGAL_ENTITY]
    rule: >-
      Unless a Russian treaty provides otherwise, the entity is controlled by the Russian
      Federation, a Russian region, a municipality, a Russian citizen without another
      citizenship, or persons controlled by them jointly or separately.
    control_definition:
      voting_rights: MORE_THAN_50_PERCENT
      direct_or_indirect: true
      consequence_of_exactly_50_percent: NOT_SUFFICIENT_BY_THIS_DEFINITION
  - id: ART13_1_7_2_V_EGRUL_RELIABILITY
    applies_to: [RUSSIAN_LEGAL_ENTITY]
    rule: EGRUL contains no record that information about the legal entity is unreliable.
  - id: ART13_1_7_2_G_LIST_SCREENING
    applies_to: [RUSSIAN_CITIZEN, RUSSIAN_LEGAL_ENTITY_AND_GOVERNANCE]
    rule: >-
      The citizen or entity, its sole executive body and collegial executive-body members
      are absent from the listed terrorism, extremism and proliferation-related lists.
  - id: ART13_1_7_2_D_FOREIGN_CITIZENSHIP
    applies_to: [RUSSIAN_CITIZEN, SOLE_EXECUTIVE_BODY_OF_LEGAL_ENTITY]
    rule: The relevant citizen has no citizenship of a foreign state.
  - id: ART13_1_7_2_E_CONVICTION
    applies_to: [RUSSIAN_CITIZEN, SOLE_EXECUTIVE_BODY_OF_LEGAL_ENTITY]
    rule: The relevant citizen has no unexpunged or outstanding conviction for a crime.
  - id: ART13_1_7_2_ZH_FIVE_YEAR_PROSECUTION
    applies_to: [RUSSIAN_CITIZEN, SOLE_EXECUTIVE_BODY_OF_LEGAL_ENTITY]
    rule: >-
      During the five years preceding the access date, the relevant citizen was not brought
      to criminal liability under Criminal Code articles 183, 272, 273, 274.1, 283 or 283.1.
    exact_date_calculation_required: true
    not_equivalent_to: UNEXPUNGED_CONVICTION_TEST

article_13_1_access_and_use_rules:
  - id: ART13_1_PART8
    locator: article_13_1.part_8
    rule: Government rules coordinated with the security authority govern checking part-7 eligibility.
    implementation: RU_GOV_PP_702_2025
  - id: ART13_1_PART9_RECENT_PRIVATE_SOURCE
    locator: article_13_1.part_9
    trigger_all:
      - SOURCE_OPERATOR_IS_NOT_PUBLIC_CLASS_OPERATOR
      - SOURCE_DATA_WERE_COLLECTED_OR_UPDATED_WITHIN_3_YEARS_BEFORE_GIS_PROVISION
    rules:
      public_user: NO_PART9_ONE_YEAR_EMBARGO_SUBJECT_TO_OTHER_GATES
      private_user_before_anniversary: BLOCK_UNTIL_ONE_YEAR_AFTER_SOURCE_DATA_PROVISION_TO_GIS
      private_user_after_anniversary: CONTINUE_OTHER_ACCESS_GATES
    clocks:
      data_recency_lookback: {value: 3, unit: YEARS, anchor: SOURCE_DATA_PROVISION_TO_GIS}
      private_user_embargo: {value: 1, unit: YEAR, anchor: SOURCE_DATA_PROVISION_TO_GIS}
  - id: ART13_1_PART10_IN_SYSTEM_ONLY
    locator: article_13_1.part_10
    rule: >-
      Process datasets only in the designated state system; do not record, extract or transfer
      them from the system, including dissemination, provision or access outside it.
  - id: ART13_1_PART11_PROTECTED_HARM
    locator: article_13_1.part_11
    rule: >-
      Block processing and obtaining results where use of datasets or results may cause harm
      to life or health, offend morality, violate rights or lawful interests, or harm the
      environment, defense, state security, cultural heritage or other protected values.
    security_authority_branch: >-
      Where use of results may harm defense or state security, the security authority may
      decide to prohibit provision of those results.
  - id: ART13_1_PART12_FOREIGN_RESULTS
    locator: article_13_1.part_12
    rule: >-
      Do not provide processing results to foreign legal entities, foreign non-legal entities,
      foreign citizens or stateless persons unless a Russian treaty, federal law or Presidential
      decision defines an exception.

pp702_request_schema:
  channels: [DIRECT_PAPER, POSTAL_PAPER, EPGU_PERSONAL_ACCOUNT_IF_TECHNICALLY_AVAILABLE]
  electronic_signature_routes:
    - ENHANCED_QUALIFIED_SIGNATURE
    - QUALIFYING_GOV_INFRASTRUCTURE_ENHANCED_UNQUALIFIED_SIGNATURE
  citizen_required_fields:
    - FULL_NAME
    - DATE_AND_PLACE_OF_BIRTH
    - SNILS
    - INN
    - RUSSIAN_PASSPORT_SERIES_NUMBER_AND_ISSUE_DATE
    - EMAIL_OR_POSTAL_ADDRESS
  legal_entity_required_fields:
    - FULL_NAME_AND_REGISTERED_LOCATION_ADDRESS
    - INN
    - OGRN
    - GOVERNANCE_PERSON_DETAILS
    - EMAIL_OR_POSTAL_ADDRESS
  governance_person_details: [FULL_NAME, SNILS, POSITION, DATE_AND_PLACE_OF_BIRTH, RUSSIAN_PASSPORT_SERIES_AND_NUMBER]
  legal_entity_attachments:
    - RUSSIAN_CONTROL_EVIDENCE
    - REPRESENTATIVE_AUTHORITY_EVIDENCE_IF_APPLICABLE
    - OPTIONAL_OTHER_ELIGIBILITY_EVIDENCE

pp702_workflow_rules:
  - {id: PP702-01, locator: rules.clause_1, rule: "Apply the procedure only to Russian citizens and Russian legal entities in the part-7 item-2 class."}
  - {id: PP702-02, locator: rules.clause_2, actor: Ministry_of_Digital_Development, rule: "Conduct the eligibility check."}
  - {id: PP702-03, locator: rules.clause_3, rule: "Accept a signed request through a modeled paper route or, if available, EPGU electronic route."}
  - {id: PP702-04, locator: rules.clause_4, rule: "Require the modeled citizen request fields."}
  - {id: PP702-05, locator: rules.clause_5, rule: "Require the modeled legal-entity request fields and governance-person details."}
  - {id: PP702-06, locator: rules.clause_6, rule: "Require control and representative-authority evidence; allow other voluntary eligibility evidence."}
  - {id: PP702-07, locator: rules.clause_7, rule: "Review the request and check eligibility within 15 working days after receipt."}
  - id: PP702-08
    locator: rules.clause_8
    rule: >-
      For incomplete or unreliable information, send a reasoned clarification request, suspend
      the check for 15 working days and refuse confirmation if the response is not provided in time.
  - {id: PP702-09, locator: rules.clause_9, rule: "Send a signed reasoned refusal when the applicant does not meet the requirements."}
  - {id: PP702-10, locator: rules.clause_10, rule: "Send a signed conformity notice when the applicant meets the requirements."}
  - id: PP702-11
    locator: rules.clause_11
    rule: >-
      Require a fresh request no later than one year after the conformity notice; suspend system
      access if it is not filed before the anniversary.
  - id: PP702-12
    locator: rules.clause_12
    rule: >-
      Require notice of changed request information within five working days after awareness
      and recheck the changed information under clauses 7 through 10.
  - id: PP702-13
    locator: rules.clause_13
    rule: >-
      If the change notice shows nonconformity, send a signed reasoned refusal to confirm
      conformity within three working days after receipt.
  - {id: PP702-14, locator: rules.clause_14, rule: "Obtain operator-register, EGRUL, identity, criminal-history and citizenship data from competent bodies, including via SMEV."}
  - {id: PP702-15, locator: rules.clause_15, rule: "Competent federal bodies provide requested clause-14 information within five working days unless law provides otherwise."}
  - {id: PP702-16, locator: rules.clause_16, rule: "Obtain statutory terrorism, extremism and proliferation list information from the competent AML/CFT authority via SMEV."}

