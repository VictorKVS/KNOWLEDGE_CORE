non_requirements:
  - Public-class users are not subject to the Decree No. 702 class-2 applicant procedure, but other access and use gates still apply.
  - A class-2 applicant must pass every criterion applicable to its type; Russian status alone is insufficient.
  - Exactly 50 percent of voting rights is not more than 50 percent.
  - The conviction test and the five-year specified-article criminal-liability test are separate.
  - Part 9 does not impose a one-year embargo unless both the non-public-source and three-year-recency conditions hold.
  - Part 9 clocks are anchored to source-data provision to the state system, not dataset formation or access-request dates.
  - Expiry of a part-9 embargo only continues other access gates; it does not automatically grant access.
  - The 15-working-day Decree No. 702 check is not the five-working-day Decree No. 961 access-request review.
  - The one-year Decree No. 702 reverification cycle is not the one-year part-9 private-user embargo.
  - No general permission to export datasets or results follows from a conformity notice.
  - No retention period or automatic reinstatement period is stated in this slice.

