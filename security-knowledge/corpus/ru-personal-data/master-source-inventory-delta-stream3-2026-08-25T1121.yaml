relationships:
  - target: "152-ФЗ"
    type: ADVERTISING_RETENTION_VS_PDN_RETENTION_BOUNDARY
    locators:
      - "38-ФЗ статья 12"
      - "38-ФЗ статья 18.1 часть 13"
    state: CANDIDATE_SCOPE_BOUNDARY_REVIEW_REQUIRED
    applicability_promoted: false
    proof_floor: >-
      Статья 12 устанавливает годичный срок хранения рекламных материалов/копий/изменений и договоров, а статья 18.1 часть 13 — минимум три года хранения у уполномоченного федерального органа информации об интернет-рекламе, полученной по специальному отчетному режиму. Ни один из этих сроков не является автоматически сроком хранения или удаления ПДн по 152-ФЗ.
  - target: "152-ФЗ"
    type: INTERNET_AD_DATA_FLOW_PDN_OVERLAP
    locators:
      - "38-ФЗ статья 18.1 часть 1"
      - "38-ФЗ статья 18.1 части 3,5,8"
      - "38-ФЗ статья 18.1 часть 11"
      - "38-ФЗ статья 18.1 часть 13"
      - "38-ФЗ статья 18.1 части 14-15"
      - "38-ФЗ статья 18.1 часть 17"
    state: CANDIDATE_APPLICABILITY_REVIEW_REQUIRED
    applicability_promoted: false
    proof_floor: >-
      Законный массив интернет-рекламных данных включает сведения о рекламодателях, рекламораспространителях и других участниках и передается через ОРД в уполномоченный орган. Для применения 152-ФЗ к конкретному элементу этого массива отдельно доказать, что он относится к определенному или определяемому физическому лицу, а также установить операцию, цель, роль и правовое основание.

