  primary_locators:
    - "статья 6 часть 3 пункт 3 Федерального закона от 28.12.2013 № 442-ФЗ"
    - "статья 12 часть 1 пункт 5 Федерального закона от 28.12.2013 № 442-ФЗ"
    - "статья 26 части 1-3 Федерального закона от 28.12.2013 № 442-ФЗ"
  current_text_finding: >-
    Статья 6 регулирует конфиденциальность информации о получателе социальных услуг и прямо выделяет обработку персональных данных при межведомственном информационном взаимодействии/портальной регистрации как один из специальных сценариев предоставления информации без отдельного согласия в рамках закона. Статья 12 часть 1 пункт 5 прямо обязывает поставщика использовать информацию о получателях в соответствии с установленными законодательством о персональных данных требованиями о защите персональных данных. Статья 26 перечисляет значительный состав идентификационных, контактных, документных, страховых и сервисных полей регистра получателей. Это прямой statutory PDN context, но не доказательство универсальной применимости каждого требования 152-ФЗ ко всем операциям.
  evidence_quality:
    official_initial_publication_id: "0001201312300060"
    official_initial_publication_url: "https://publication.pravo.gov.ru/Document/View/0001201312300060"
    immutable_initial_publication_manifest: "security-corpora/RU/protected-information/manifests/SEC-SRC-RU-FZ-442-2013.json"
