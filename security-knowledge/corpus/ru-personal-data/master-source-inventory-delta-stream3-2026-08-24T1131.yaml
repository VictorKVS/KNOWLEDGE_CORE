  applicability_guard: >-
    Не выводить применимость конкретного требования 152-ФЗ только из статуса поставщика/получателя социальной услуги, наличия конфиденциальной информации, наличия регистра или прямого упоминания законодательства о персональных данных. Для каждого требования установить оператора и иных участников, субъекта данных, конкретные поля, операцию обработки, цель, основание, канал передачи и применимый locator. Отдельно учитывать, что статья 6 регулирует отраслевую конфиденциальность и случаи раскрытия, а статья 12(1)(5) содержит прямой PDN-protection context для поставщика.

