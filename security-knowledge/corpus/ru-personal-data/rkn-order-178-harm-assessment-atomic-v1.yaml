schema_version: "1.0"
id: RU-RKN178-HARM-ASSESSMENT-ATOMIC-V1
title: Roskomnadzor Order No. 178 personal-data harm assessment requirements
scope: >-
  Requirements approved by Roskomnadzor Order No. 178 of 27 October 2022 for
  assessing harm that may be caused to a personal-data subject if Federal Law
  No. 152-FZ is violated. The model covers the current unchanged text effective
  from 1 March 2023 through 28 February 2029.

