atomic_rules:
  - {id: RKN178-R001, locator: order.preamble_and_requirements.clause_1, class: SCOPE, rule: "Assess potential harm to personal-data subjects for the operator duty established by item 5 of part 1 of article 18.1 of Federal Law No. 152-FZ."}
  - {id: RKN178-R002, locator: requirements.clause_1, class: ASSESSOR_ROLE, rule: "Have the assessment performed by the person responsible for organizing personal-data processing or by a commission formed by the operator."}
  - {id: RKN178-R003, locator: requirements.clause_2.chapeau, class: FINAL_DEGREE, rule: "Determine one final degree of potential harm: high, medium or low."}
  - {id: RKN178-R004, locator: requirements.clause_2_1.paragraph_2, class: HIGH_HARM, rule: "Assign high harm for biometric identification processing, except where a federal law establishes its purposes, procedure and conditions."}
  - {id: RKN178-R005, locator: requirements.clause_2_1.paragraph_3, class: HIGH_HARM, rule: "Assign high harm for processing special-category data, except where a federal law establishes its purposes, procedure and conditions."}
  - {id: RKN178-R006, locator: requirements.clause_2_1.paragraph_4, class: HIGH_HARM, rule: "Assign high harm for the specified minor-related contract processing when the case is not provided for by Russian law."}
  - {id: RKN178-R007, locator: requirements.clause_2_1.paragraph_5, class: HIGH_HARM, rule: "Assign high harm for anonymization, including scoring, consumer-behaviour forecasting or other research, when it is not research covered by item 9 of part 1 of article 6 of Federal Law No. 152-FZ."}
  - {id: RKN178-R008, locator: requirements.clause_2_1.paragraph_6, class: HIGH_HARM, rule: "Assign high harm when processing personal data of Russian citizens is entrusted to a foreign person or foreign persons."}
  - {id: RKN178-R009, locator: requirements.clause_2_1.paragraph_7, class: HIGH_HARM, rule: "Assign high harm when personal data are collected using databases located outside the Russian Federation."}
  - {id: RKN178-R010, locator: requirements.clause_2_2.paragraph_2, class: MEDIUM_HARM, rule: "Assign medium harm for dissemination on the operator's official website or provision to an unlimited circle, except where federal law establishes the purposes, procedure and conditions."}
  - {id: RKN178-R011, locator: requirements.clause_2_2.paragraph_3, class: MEDIUM_HARM, rule: "Assign medium harm for processing for additional purposes different from the original collection purpose."}
  - {id: RKN178-R012, locator: requirements.clause_2_2.paragraph_4, class: MEDIUM_HARM, rule: "Assign medium harm for direct marketing contacts using a personal-data database owned by another operator."}
  - {id: RKN178-R013, locator: requirements.clause_2_2.paragraph_5, class: MEDIUM_HARM, rule: "Assign medium harm when consent is obtained through website functionality that does not provide subsequent identification and/or authentication of the subject."}
  - {id: RKN178-R014, locator: requirements.clause_2_2.paragraph_6, class: MEDIUM_HARM, rule: "Assign medium harm where consent grants processing rights to a defined and/or undefined circle of persons for mutually incompatible purposes."}
  - {id: RKN178-R015, locator: requirements.clause_2_3.paragraph_2, class: LOW_HARM, rule: "Assign low harm for maintaining publicly available personal-data sources formed under article 8 of Federal Law No. 152-FZ."}
  - {id: RKN178-R016, locator: requirements.clause_2_3.paragraph_3, class: LOW_HARM, rule: "Assign low harm for appointing as responsible for personal-data processing a person who is not a staff employee of the operator."}
  - {id: RKN178-R017, locator: requirements.clause_3, class: ASSESSMENT_ACT, rule: "Document the assessment result in a harm-assessment act."}
  - {id: RKN178-R018, locator: requirements.clause_4.a, class: ACT_FIELD, rule: "Record the operator's name or the operator individual's full name, when applicable, and address in the act."}
  - {id: RKN178-R019, locator: requirements.clause_4.b, class: ACT_FIELD, rule: "Record the act issuance date."}
  - {id: RKN178-R020, locator: requirements.clause_4.v, class: ACT_FIELD, rule: "Record the assessment date separately from the act issuance date."}
  - {id: RKN178-R021, locator: requirements.clause_4.g, class: ACT_FIELD, rule: "Record the assessors' names, positions when applicable, and signatures."}
  - {id: RKN178-R022, locator: requirements.clause_4.d, class: ACT_FIELD, rule: "Record the degree of potential harm determined under clauses 2.1 through 2.3."}
  - {id: RKN178-R023, locator: requirements.clause_5, class: ELECTRONIC_ACT, rule: "Treat an electronic act signed in accordance with Federal Law No. 63-FZ as equivalent to a paper act bearing a handwritten signature."}
  - {id: RKN178-R024, locator: requirements.clause_6, class: DEGREE_PRECEDENCE, rule: "Where different degrees may apply within the processing activity, apply the higher degree."}

