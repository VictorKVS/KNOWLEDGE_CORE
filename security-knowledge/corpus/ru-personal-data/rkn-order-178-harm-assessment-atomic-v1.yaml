conflict_and_definition_checks:
  - id: RKN178-C001
    type: VIOLATION_SCENARIO_NOT_PERMISSION
    resolution: >-
      A listed scenario is a harm degree for a possible violation; it is not permission
      to perform that processing. In particular, the non-staff responsible-person scenario
      does not override the employee requirement in article 22.1 of Federal Law No. 152-FZ.
  - id: RKN178-C002
    type: QUALITATIVE_SCALE_NOT_RISK_FORMULA
    resolution: >-
      High, medium and low are rule-based degrees. The order states no points, probability,
      loss amount, weighted formula, threshold or universal risk-acceptance criterion.
  - id: RKN178-C003
    type: POTENTIAL_HARM_NOT_INCIDENT_SEVERITY
    resolution: >-
      The assessment concerns potential harm if 152-FZ is violated; it is not an actual
      breach-severity classification, damages calculation or sanction determination.
  - id: RKN178-C004
    type: EXCEPTION_BOUND_TRIGGER
    resolution: >-
      Biometric, special-category, minor-contract, anonymization/research and dissemination
      triggers retain the statutory exceptions written into their respective clauses.
  - id: RKN178-C005
    type: ROLE_ALTERNATIVE_NOT_MANDATORY_COMMISSION
    resolution: >-
      The responsible person or an operator-formed commission may assess. The order does
      not mandate a commission for every operator and does not authorize an unaffiliated
      consultant acting alone outside either route.
  - id: RKN178-C006
    type: TEMPORAL_SCOPE
    resolution: >-
      The requirements apply from 1 March 2023 and are valid only until 1 March 2029;
      post-sunset use requires a successor or extension check.

red_team_boundaries:
  - "Do not convert the three degrees into an invented numeric scoring formula."
  - "Do not treat a high-harm trigger as proof that the underlying processing is always prohibited or always lawful."
  - "Do not classify all biometric, special-category, minor or dissemination processing without testing the stated exception."
  - "Do not average multiple applicable degrees; select the higher degree."
  - "Do not merge the act issuance date and the assessment date into one field."
  - "Do not accept an unsigned electronic act as equivalent merely because it is stored electronically."
  - "Do not reuse this order after 1 March 2029 without a current-status check."

