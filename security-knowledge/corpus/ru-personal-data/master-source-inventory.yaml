quality_gates:
  acquisition_gate:
    pass_when:
      - exact_primary_artifact_present
      - source_url_present
      - retrieved_at_present
      - mime_present
      - byte_length_present
      - sha256_present
  document_compiler_gate:
    pass_when:
      - legal_structure_present
      - chunks_have_stable_locators
      - concepts_and_definitions_extracted
      - atomic_requirements_trace_to_chunks
      - typed_relations_have_provenance
      - conflict_check_completed
  publication_gate:
    pass_when:
      - applicability_proved
      - version_chain_checked
      - regression_tests_pass
      - red_team_pass

