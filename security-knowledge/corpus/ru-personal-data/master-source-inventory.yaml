policy:
  - "A source is not SOURCE_ACQUIRED or IMMUTABLE until exact bytes are captured with MIME, byte length and SHA-256."
  - "Existing nodes and source cards must be reused before new analysis is started."
  - "A source may have a verified identity/status while its immutable artifact is still pending."
  - "Technical, cryptographic, GosSOPKA/CII/GIS and sector overlays require explicit applicability edges before their requirements enter PDn decision logic."
  - "Every later document-compilation pass must preserve traceability source -> structure -> chunk -> concept/definition -> atomic requirement -> typed relation -> conflict -> decision rule -> test."
  - "A repealed provision is conflict/version evidence only; it cannot be reused as a current semantic or applicability anchor."

