  primary_locator: "статья 41 Закона Российской Федерации от 27.12.1991 № 2124-I «О средствах массовой информации»"
  current_text_finding: >-
    Статья 41 отдельно запрещает редакции разглашать сведения, предоставленные гражданином с условием сохранения их в тайне, требует хранить в тайне
    источник информации и вводит специальные ограничения на распространение сведений, прямо или косвенно идентифицирующих несовершеннолетнего.
    Части 4-5 связаны с частью 6 статьи 4 и содержат узкие условия/цели допустимого распространения информации о несовершеннолетнем потерпевшем.
  evidence_quality:
    official_current_locator: "https://pravo.gov.ru/proxy/ips/?docbody=&nd=102013812"
    current_consolidated_revision_basis: "304-ФЗ от 31.07.2025; изменения Закона о СМИ действуют с 01.03.2026"
    last_article41_specific_amendment: "50-ФЗ от 05.04.2013; official publication id 0001201304080008"
    current_source_level_publications:
      - "215-ФЗ от 23.07.2025; official publication id 0001202507230005; Article 41 effect NONE"
      - "304-ФЗ от 31.07.2025; official publication id 0001202507310080; Article 41 effect NONE_IDENTIFIED"
    future_source_level_event: "215-ФЗ от 26.06.2026; publication locator 0001202606260075; effective 01.09.2026; Article 41 effect NONE_IDENTIFIED"
    exact_current_authoritative_binary: PENDING
  applicability_guard: >-
    Не выводить применимость 152-ФЗ только из факта публикации материала, статуса редакции/журналиста или наличия режима конфиденциальности источника.
    Для конкретного требования определить идентифицируемое физическое лицо, состав данных, публикационную/редакционную операцию, цель, роли, правовое
    основание, условие о тайне, требуемые согласия, судебное требование и точный locator Закона о СМИ. MEDIA_CONFIDENTIALITY != PERSONAL_DATA;
    OVERLAP != APPLICABILITY.

