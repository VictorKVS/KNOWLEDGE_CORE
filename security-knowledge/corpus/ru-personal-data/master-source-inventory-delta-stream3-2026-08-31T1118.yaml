pdn_findings:
  - "The act directly governs a GAS Vybory participant register and expressly operates with 152-FZ, 67-FZ, 20-FZ, 168-FZ and CEC 49/463-4."
  - "Sources include МВД passport/registration events, ERN population-register data and EGR ZAGS death data in defined interagency routes."
  - "Local-administration transfers may use paper or machine-readable media and must record source, media type, period, subject count and transfer date."
  - "Operational routes include events concerning death, incapacity/restored capacity, military service, imprisonment and passport changes; these contexts are not automatically promoted to special-category PDN."
  - "The register supports PDN verification for candidates, representatives, voters, signature collectors and donors; election/donation context is not automatically treated as political-belief special-category PDN."
  - "Weekly duplicate-record control is a data-quality mechanism, not an independent lawful basis or new processing purpose."

