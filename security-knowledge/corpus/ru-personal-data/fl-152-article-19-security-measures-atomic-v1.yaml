conflict_and_definition_checks:
  - {id: FL152-A19-C001, type: NECESSARY_MEASURES_NOT_FIXED_CHECKLIST, resolution: "Part 2 is introduced by 'in particular'; its listed measures are not an exhaustive substitute for the part 1 outcome duty."}
  - {id: FL152-A19-C002, type: TAKE_OR_ENSURE, resolution: "Delegation does not remove the operator duty to take or ensure the measures."}
  - {id: FL152-A19-C003, type: ARTICLE19_NO_NUMERIC_PERIODS, resolution: "Article 19 states no numeric deadline for assessment, control, incident notice, recovery or other listed measures."}
  - {id: FL152-A19-C004, type: THREATS_LIMITED_TO_ISPDN_LOCATOR, resolution: "The express part 2 point 1 threat-determination route concerns processing in ISPDN; broader processing duties are not inferred from this locator alone."}
  - {id: FL152-A19-C005, type: PP1119_DELEGATION_NOT_REPRODUCTION, resolution: "Article 19 delegates levels and requirements; it does not itself assign level 1-4 or reproduce PP 1119 decision criteria."}
  - {id: FL152-A19-C006, type: FSTEC_FSB_MEASURES_NOT_REPRODUCED, resolution: "Part 4 does not itself enumerate FSTEC Order 21 or FSB Order 378 controls."}
  - {id: FL152-A19-C007, type: CONFORMITY_NOT_UNIVERSAL_CERTIFICATION_CLAIM, resolution: "Do not translate conformity assessment into a claim that every security product must hold one named certificate without applicability analysis."}
  - {id: FL152-A19-C008, type: DESTRUCTION_TOOL_TWO_CONDITIONS, resolution: "Point 3.1 requires both established conformity assessment and an implemented information-destruction function."}
  - {id: FL152-A19-C009, type: PRE_COMMISSIONING_RELATION_NOT_DAY_COUNT, resolution: "The effectiveness assessment must precede commissioning; no number of days is stated."}
  - {id: FL152-A19-C010, type: ALL_ACTIONS_LOGGING, resolution: "Point 8 says all actions with personal data in the ISPDN, not only authentication or administrator actions."}
  - {id: FL152-A19-C011, type: MEASURE_AND_LEVEL_CONTROL_DISTINCT, resolution: "Control of adopted measures and control of the ISPDN protection level are separate branches."}
  - {id: FL152-A19-C012, type: SECTOR_ACT_ACTOR_SCOPE, resolution: "Only actors listed in part 5 and acting within their powers receive that threat-act route."}
  - {id: FL152-A19-C013, type: ASSOCIATION_THREATS_OPTIONAL_ADDITIONAL, resolution: "Part 6 is a right to define additional threats, not a universal mandatory operator-association act."}
  - {id: FL152-A19-C014, type: ASSOCIATION_MEMBER_SCOPE, resolution: "An association decision is scoped to relevant member activities and does not automatically bind non-members."}
  - {id: FL152-A19-C015, type: TWO_COORDINATION_ROUTES, resolution: "Part 5 acts and part 6 decisions have distinct coordination routes; the latter follows the Government procedure."}
  - {id: FL152-A19-C016, type: MOTIVATED_REFUSAL_SCOPE, resolution: "The express motivated-refusal sentence concerns refusals to coordinate part 6 draft decisions."}
  - {id: FL152-A19-C017, type: STATE_SYSTEM_SUPERVISION_ACTOR_SPLIT, resolution: "FSB and FSTEC act within their respective powers; Article 19 does not make either the sole universal supervisor."}
  - {id: FL152-A19-C018, type: FSTEC_NO_DATA_ACCESS, resolution: "Part 8 and part 9 deny FSTEC a right to inspect personal data; this guard is not silently generalized to every authority."}
  - {id: FL152-A19-C019, type: NON_STATE_SUPERVISION_REQUIRES_GOVERNMENT_DECISION, resolution: "Part 9 authority is conditional on a Government decision and selected activities; it is not automatic for all non-state ISPDN."}
  - {id: FL152-A19-C020, type: BIOMETRIC_OUTSIDE_ISPDN_ONLY, resolution: "Part 10 governs use and storage outside ISPDN and does not replace the separate inside-ISPDN regime."}
  - {id: FL152-A19-C021, type: THREAT_NOT_INCIDENT, resolution: "The statutory threat definition concerns dangerous conditions and factors; it is not proof that an incident occurred."}
  - {id: FL152-A19-C022, type: PROTECTION_LEVEL_NOT_RISK_SCORE, resolution: "The statutory protection level is a composite requirements indicator, not a numeric risk score invented by the model."}
  - {id: FL152-A19-C023, type: GOSSOPKA_PROCEDURE_DELEGATED, resolution: "Article 19 requires interaction under the FSB-established procedure; it does not provide the procedure's format or numeric clock."}
  - {id: FL152-A19-C024, type: INCIDENT_SCOPE_UNLAWFUL_TRANSFER_SET, resolution: "The express notice route covers incidents causing unlawful transfer, provision, dissemination or access; do not expand it without another source."}
  - {id: FL152-A19-C025, type: ARTICLE21_AND_GOSSOPKA_NOTIFICATIONS_DISTINCT, resolution: "Article 19 GosSOPKA interaction is not the same route as Article 21 notices to the personal-data authority."}
  - {id: FL152-A19-C026, type: STATE_SECRET_EXCEPTION_TO_FORWARDING, resolution: "The state-secret exception in part 13 limits FSB-to-authorized-body transfer, not the operator's entire incident-response duty."}
  - {id: FL152-A19-C027, type: PART15_CLOSED_CATEGORY_ROUTING, resolution: "Use only the categories and corresponding laws expressly listed in part 15; do not add groups by analogy."}
  - {id: FL152-A19-C028, type: CURRENT_OR_FORMER_CONFIDENTIAL_ASSISTANTS, resolution: "Where stated, the protected route covers persons currently or formerly assisting on a confidential basis."}
  - {id: FL152-A19-C029, type: FAMILY_SCOPE_ONLY_WHERE_STATED, resolution: "Part 15 expressly mentions family members for objects of state protection; do not generalize family coverage to every listed category from Article 19 alone."}
  - {id: FL152-A19-C030, type: SIX_SPECIAL_LAWS_NOT_ATOMIZED_HERE, resolution: "Part 15 is a routing obligation; the six special laws require separate clause-level applicability models before implementation claims."}

