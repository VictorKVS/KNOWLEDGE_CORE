schema_version: "1.0"
id: RU-FL152-ARTICLE19-SECURITY-MEASURES-ATOMIC-V1
title: Federal Law No. 152-FZ Article 19 personal-data security measures
scope: >-
  Current Article 19 duties, enabling rules, definitions and supervisory boundaries:
  operator safeguards; the illustrative security-measure set; Government, FSB and FSTEC
  dependencies; sector and association threat acts; state and selected non-state supervision;
  biometric media outside ISPDN; GosSOPKA interaction; and the protected-person processing
  rule in part 15. PP 1119, FSTEC Order 21, FSB Order 378 and GosSOPKA procedures remain
  separate sources and are not silently reproduced or promoted by this model.

