atomic_rules:
  - {id: FL152-A19-R001, locator: article_19.part_1, class: OPERATOR_SECURITY_DUTY, rule: "Take or ensure necessary legal, organizational and technical measures when processing personal data."}
  - {id: FL152-A19-R002, locator: article_19.part_1, class: PROTECTED_EVENT_SET, rule: "Protect personal data against unlawful or accidental access, destruction, alteration, blocking, copying, provision, dissemination and other unlawful actions."}
  - {id: FL152-A19-R003, locator: article_19.part_2.chapeau, class: ILLUSTRATIVE_MEASURE_SET, rule: "Treat the part 2 measures as illustrative means of achieving security, not as a closed exhaustive checklist."}
  - {id: FL152-A19-R004, locator: article_19.part_2.point_1, class: THREAT_DETERMINATION, rule: "Determine personal-data security threats arising during processing in an ISPDN."}
  - {id: FL152-A19-R005, locator: article_19.part_2.point_2, class: ORGANIZATIONAL_TECHNICAL_MEASURES, rule: "Apply organizational and technical measures needed to fulfil applicable personal-data protection requirements."}
  - {id: FL152-A19-R006, locator: article_19.part_2.point_2, class: PROTECTION_LEVEL_OUTCOME, rule: "Ensure that fulfilment of the applicable requirements achieves the personal-data protection levels established by the Government."}
  - {id: FL152-A19-R007, locator: article_19.part_2.point_3, class: CONFORMITY_ASSESSED_SECURITY_TOOLS, rule: "Use information-security tools that have passed the established conformity-assessment procedure where such tools are applied."}
  - {id: FL152-A19-R008, locator: article_19.part_2.point_3_1, class: DESTRUCTION_TOOL_CONFORMITY, rule: "For personal-data destruction, use conformity-assessed security tools containing an implemented information-destruction function."}
  - {id: FL152-A19-R009, locator: article_19.part_2.point_4, class: PRE_COMMISSIONING_EFFECTIVENESS, rule: "Assess effectiveness of adopted personal-data security measures before commissioning the ISPDN."}
  - {id: FL152-A19-R010, locator: article_19.part_2.point_5, class: MACHINE_MEDIA_ACCOUNTING, rule: "Account for machine-readable personal-data media."}
  - {id: FL152-A19-R011, locator: article_19.part_2.point_6.branch_1, class: UNAUTHORIZED_ACCESS_DETECTION, rule: "Detect unauthorized access to personal data and take responsive measures."}
  - {id: FL152-A19-R012, locator: article_19.part_2.point_6.branch_2, class: COMPUTER_ATTACK_DETECTION, rule: "Detect computer attacks against ISPDN."}
  - {id: FL152-A19-R013, locator: article_19.part_2.point_6.branch_3, class: COMPUTER_ATTACK_PREVENTION, rule: "Prevent computer attacks against ISPDN."}
  - {id: FL152-A19-R014, locator: article_19.part_2.point_6.branch_4, class: ATTACK_CONSEQUENCE_ELIMINATION, rule: "Eliminate consequences of computer attacks against ISPDN."}
  - {id: FL152-A19-R015, locator: article_19.part_2.point_6.branch_5, class: COMPUTER_INCIDENT_RESPONSE, rule: "Respond to computer incidents in ISPDN."}
  - {id: FL152-A19-R016, locator: article_19.part_2.point_7, class: PERSONAL_DATA_RECOVERY, rule: "Restore personal data altered or destroyed because of unauthorized access."}
  - {id: FL152-A19-R017, locator: article_19.part_2.point_8.branch_1, class: ACCESS_RULES, rule: "Establish access rules for personal data processed in the ISPDN."}
  - {id: FL152-A19-R018, locator: article_19.part_2.point_8.branch_2, class: ACTION_REGISTRATION_ACCOUNTING, rule: "Register and account for all actions performed with personal data in the ISPDN."}
  - {id: FL152-A19-R019, locator: article_19.part_2.point_9.branch_1, class: SECURITY_MEASURE_CONTROL, rule: "Control the personal-data security measures adopted by the operator."}
  - {id: FL152-A19-R020, locator: article_19.part_2.point_9.branch_2, class: PROTECTION_LEVEL_CONTROL, rule: "Control the protection level of the ISPDN."}
  - {id: FL152-A19-R021, locator: article_19.part_3.factors, class: GOVERNMENT_FACTOR_SET, rule: "When setting the delegated regime, the Government considers possible subject harm, data volume and content, the processing activity and threat relevance."}
  - {id: FL152-A19-R022, locator: article_19.part_3.point_1, class: GOVERNMENT_PROTECTION_LEVELS, rule: "The Government establishes ISPDN personal-data protection levels depending on security threats."}
  - {id: FL152-A19-R023, locator: article_19.part_3.point_2, class: GOVERNMENT_PROTECTION_REQUIREMENTS, rule: "The Government establishes ISPDN protection requirements whose fulfilment achieves the established levels."}
  - {id: FL152-A19-R024, locator: article_19.part_3.point_3, class: BIOMETRIC_MEDIA_REQUIREMENTS, rule: "The Government establishes requirements for biometric-data material media and storage technologies outside ISPDN."}
  - {id: FL152-A19-R025, locator: article_19.part_4, class: FSB_FSTEC_CONTROL_COMPOSITION, rule: "FSB and FSTEC establish, within their respective powers, the composition and content of organizational and technical measures needed for each Government protection level."}
  - {id: FL152-A19-R026, locator: article_19.part_5.actors, class: SECTOR_THREAT_ACT_ACTORS, rule: "The listed sector policy/regulatory bodies, regional authorities, Bank of Russia, state extra-budgetary funds and other state bodies may adopt threat acts within their powers."}
  - {id: FL152-A19-R027, locator: article_19.part_5.object, class: SECTOR_THREAT_ACT_CONTENT, rule: "A part 5 act defines threats relevant to personal-data processing in ISPDN used for the corresponding activity."}
  - {id: FL152-A19-R028, locator: article_19.part_5.factors, class: SECTOR_THREAT_FACTOR_SET, rule: "A part 5 threat act considers personal-data content and the nature and methods of processing."}
  - {id: FL152-A19-R029, locator: article_19.part_6.permission, class: ASSOCIATION_ADDITIONAL_THREATS_OPTION, rule: "Associations, unions and other operator groupings may define additional relevant threats beyond part 5 acts."}
  - {id: FL152-A19-R030, locator: article_19.part_6.scope, class: ASSOCIATION_MEMBER_ACTIVITY_SCOPE, rule: "Limit an association threat decision to ISPDN used for the specified activities of its members."}
  - {id: FL152-A19-R031, locator: article_19.part_6.factors, class: ASSOCIATION_THREAT_FACTOR_SET, rule: "An association threat decision considers personal-data content and the nature and methods of processing."}
  - {id: FL152-A19-R032, locator: article_19.part_7.sentence_1, class: SECTOR_ACT_COORDINATION, rule: "Coordinate draft part 5 normative acts with FSB and FSTEC."}
  - {id: FL152-A19-R033, locator: article_19.part_7.sentence_2, class: ASSOCIATION_DECISION_COORDINATION, rule: "Coordinate draft part 6 decisions with FSB and FSTEC under the Government-established procedure."}
  - {id: FL152-A19-R034, locator: article_19.part_7.sentence_3, class: MOTIVATED_REFUSAL, rule: "A refusal by FSB or FSTEC to coordinate a part 6 draft decision must be reasoned."}
  - {id: FL152-A19-R035, locator: article_19.part_8.sentence_1, class: FSB_STATE_SYSTEM_SUPERVISION, rule: "FSB supervises, within its powers, Article 19 organizational and technical measures in state ISPDN and other ISPDN operated in federal state bodies."}
  - {id: FL152-A19-R036, locator: article_19.part_8.sentence_2, class: FSTEC_STATE_SYSTEM_SUPERVISION, rule: "FSTEC also performs that supervision within its powers."}
  - {id: FL152-A19-R037, locator: article_19.part_8.sentence_2.guard, class: FSTEC_NO_PERSONAL_DATA_ACCESS, rule: "FSTEC performs part 8 supervision without a right to inspect the personal data processed in the systems."}
  - {id: FL152-A19-R038, locator: article_19.part_9.sentence_1, class: FSB_NON_STATE_EMPOWERMENT, rule: "The Government may empower FSB to supervise Article 19 measures in selected non-state ISPDN activities, considering data significance and content."}
  - {id: FL152-A19-R039, locator: article_19.part_9.sentence_2, class: FSTEC_NON_STATE_EMPOWERMENT, rule: "The Government may likewise empower FSTEC for selected non-state ISPDN activities."}
  - {id: FL152-A19-R040, locator: article_19.part_9.sentence_2.guard, class: FSTEC_NON_STATE_NO_PERSONAL_DATA_ACCESS, rule: "FSTEC exercises any part 9 power without a right to inspect processed personal data."}
  - {id: FL152-A19-R041, locator: article_19.part_10, class: BIOMETRIC_OUTSIDE_ISPDN_RESTRICTION, rule: "Use and store biometric personal data outside ISPDN only on material media and with storage technology that protect against the listed unlawful or accidental actions."}
  - {id: FL152-A19-R042, locator: article_19.part_11.sentence_1, class: SECURITY_THREAT_DEFINITION, rule: "Treat a personal-data security threat as conditions and factors creating danger of unauthorized, including accidental, access capable of producing the listed harmful processing actions."}
  - {id: FL152-A19-R043, locator: article_19.part_11.sentence_2, class: PROTECTION_LEVEL_DEFINITION, rule: "Treat a personal-data protection level as the composite indicator of requirements whose fulfilment neutralizes specified ISPDN threats."}
  - {id: FL152-A19-R044, locator: article_19.part_12.chapeau, class: GOSSOPKA_INTERACTION, rule: "Interact with GosSOPKA under the procedure established by the federal security authority."}
  - {id: FL152-A19-R045, locator: article_19.part_12.incident, class: GOSSOPKA_INCIDENT_REPORTING, rule: "As part of that interaction, inform GosSOPKA of computer incidents causing unlawful transfer, provision, dissemination or access to personal data."}
  - {id: FL152-A19-R046, locator: article_19.part_13, class: FSB_TO_RKN_INFORMATION_TRANSFER, rule: "FSB transfers part 12 information, except state-secret information, to the authorized personal-data authority."}
  - {id: FL152-A19-R047, locator: article_19.part_14, class: JOINT_TRANSFER_PROCEDURE, rule: "FSB and the authorized personal-data authority jointly establish the part 13 transfer procedure."}
  - {id: FL152-A19-R048, locator: article_19.part_15.chapeau, class: PROTECTED_PERSON_PROCESSING_DUTY, rule: "Process personal data of the expressly listed protected-person categories subject to the corresponding special federal-law requirements."}
  - {id: FL152-A19-R049, locator: article_19.part_15.branch_1, class: FSB_PROTECTED_PERSONS, rule: "Route FSB employees and current or former confidential assistants to 40-FZ requirements."}
  - {id: FL152-A19-R050, locator: article_19.part_15.branch_2, class: PROTECTED_JUDICIARY_LAW_ENFORCEMENT_OFFICIALS, rule: "Route protected judges and officials of law-enforcement and control bodies to 45-FZ requirements."}
  - {id: FL152-A19-R051, locator: article_19.part_15.branch_3, class: FOREIGN_INTELLIGENCE_PROTECTED_PERSONS, rule: "Route foreign-intelligence employees and current or former confidential assistants to 5-FZ requirements."}
  - {id: FL152-A19-R052, locator: article_19.part_15.branch_4, class: STATE_GUARD_PROTECTED_PERSONS, rule: "Route state-protection objects and family members, state-protection employees and current or former confidential assistants to 57-FZ requirements."}
  - {id: FL152-A19-R053, locator: article_19.part_15.branch_5, class: CRIMINAL_PROCEEDING_PROTECTED_PERSONS, rule: "Route protected victims, witnesses and other criminal-proceeding participants to 119-FZ requirements."}
  - {id: FL152-A19-R054, locator: article_19.part_15.branch_6, class: INTERNAL_AFFAIRS_PROTECTED_PERSONS, rule: "Route internal-affairs employees and current or former confidential assistants to 3-FZ requirements."}

