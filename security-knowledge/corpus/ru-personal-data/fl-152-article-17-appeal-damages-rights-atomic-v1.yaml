atomic_rules:
  - {id: FL152-A17-R001, locator: article_17.part_1.trigger_1, class: STATUTORY_VIOLATION_BELIEF_TRIGGER, rule: "Recognize the appeal right where the subject considers that the operator processes their personal data in violation of 152-FZ."}
  - {id: FL152-A17-R002, locator: article_17.part_1.trigger_2, class: RIGHTS_FREEDOMS_VIOLATION_BELIEF_TRIGGER, rule: "Recognize the appeal right where the subject considers that the operator otherwise violates their rights and freedoms."}
  - {id: FL152-A17-R003, locator: article_17.part_1.object_1, class: OPERATOR_ACTION_APPEAL, rule: "Permit challenge of an operator action through an Article 17 route."}
  - {id: FL152-A17-R004, locator: article_17.part_1.object_2, class: OPERATOR_OMISSION_APPEAL, rule: "Permit challenge of an operator omission through an Article 17 route."}
  - {id: FL152-A17-R005, locator: article_17.part_1.route_1, class: AUTHORIZED_BODY_APPEAL, rule: "Permit appeal to the authorized body for protection of personal-data subjects' rights."}
  - {id: FL152-A17-R006, locator: article_17.part_1.route_2, class: JUDICIAL_APPEAL, rule: "Permit appeal in judicial proceedings."}
  - {id: FL152-A17-R007, locator: article_17.part_2.chapeau, class: JUDICIAL_RIGHTS_PROTECTION, rule: "Recognize the subject's right to judicial protection of rights and legitimate interests."}
  - {id: FL152-A17-R008, locator: article_17.part_2.remedy_1, class: LOSSES_REMEDY, rule: "Recognize compensation of losses as an included judicial-protection remedy."}
  - {id: FL152-A17-R009, locator: article_17.part_2.remedy_2, class: MORAL_HARM_REMEDY, rule: "Recognize compensation for moral harm as an included judicial-protection remedy, available alone or together with a losses claim as indicated by and/or."}

