schema_version: "1.0"
id: RU-FL152-ARTICLE17-APPEAL-DAMAGES-RIGHTS-ATOMIC-V1
title: Federal Law No. 152-FZ Article 17 operator appeal and judicial-remedy rights
scope: >-
  Current Article 17 rights to challenge an operator's action or omission before the
  authorized personal-data authority or in court and to seek judicial protection,
  including losses and moral-harm compensation. Procedural periods, proof standards,
  award amounts and other-liability regimes remain separate legal dependencies.

