conflict_and_definition_checks:
  - {id: FL152-A17-C001, type: SUBJECT_BELIEF_TRIGGERS_ROUTE, resolution: "A prior final finding of violation is not stated as a prerequisite to invoke the appeal right; the subject's asserted belief opens the route."}
  - {id: FL152-A17-C002, type: TWO_TRIGGER_LIMBS, resolution: "A claimed 152-FZ processing violation and another claimed violation of rights or freedoms are alternative trigger limbs."}
  - {id: FL152-A17-C003, type: ACTION_AND_OMISSION, resolution: "Both operator action and inaction are appealable; do not require an affirmative decision document."}
  - {id: FL152-A17-C004, type: AUTHORITY_OR_COURT, resolution: "Part 1 supplies an authorized-body route or a judicial route and does not state mandatory administrative exhaustion before court."}
  - {id: FL152-A17-C005, type: ROUTES_NOT_DECLARED_MUTUALLY_EXCLUSIVE, resolution: "The word or identifies available routes; Article 17 does not itself bar sequential or otherwise procedurally permitted use of both."}
  - {id: FL152-A17-C006, type: INTERNAL_COMPLAINT_NOT_PREREQUISITE, resolution: "Article 17 does not require a prior internal complaint to the operator before the authority or court route."}
  - {id: FL152-A17-C007, type: DAMAGES_ROUTE_IS_JUDICIAL, resolution: "Part 2 places losses and moral-harm remedies in judicial proceedings; do not encode the authorized body as awarding compensation under Article 17."}
  - {id: FL152-A17-C008, type: AND_OR_REMEDIES, resolution: "Losses and moral-harm compensation may be pleaded separately or together; neither is silently collapsed into the other."}
  - {id: FL152-A17-C009, type: NO_AUTOMATIC_AWARD, resolution: "The right to seek a remedy is not a guarantee that a court will award it."}
  - {id: FL152-A17-C010, type: NO_AMOUNT_OR_FORMULA, resolution: "Article 17 states no compensation amount, tariff or calculation formula."}
  - {id: FL152-A17-C011, type: NO_ARTICLE17_PROCEDURAL_PERIOD, resolution: "Article 17 states no complaint, limitation, authority-response or court-processing period; applicable procedural law must supply any such period."}
  - {id: FL152-A17-C012, type: NO_SANCTION_CREATION, resolution: "Article 17 does not itself create an administrative or criminal sanction or determine operator liability under other provisions."}

