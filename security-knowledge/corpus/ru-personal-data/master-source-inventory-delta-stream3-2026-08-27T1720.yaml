    type: ELECTRONIC_MEDICAL_RECORD_PERSON_LEVEL_DATA_PROCESSING_OVERLAP
    status: CANDIDATE_APPLICABILITY_REVIEW_REQUIRED
    rationale: "Электронная медицинская документация относится к конкретным пациентам и обрабатывается в информационных системах; конкретная применимость требований 152-ФЗ должна доказываться по субъекту, записи, операции, цели, роли и правовому основанию."
  - relationship_id: PDN-REL-MZ947-323FZ-001
    from: SEC-SRC-RU-MINZDRAV-ORDER-947N-2020
    to: SEC-SRC-RU-FZ-323:article_13
    type: ELECTRONIC_MEDICAL_DOCUMENT_POSSIBLE_MEDICAL_SECRECY_DUAL_REGIME
    status: CANDIDATE_APPLICABILITY_REVIEW_REQUIRED
    rationale: "Медицинский документ может содержать сведения, охватываемые врачебной тайной, но квалификация зависит от содержания и сценария; режим статьи 13 не присваивается каждому техническому полю автоматически."
  - relationship_id: PDN-REL-MZ947-PP140-001
    from: SEC-SRC-RU-MINZDRAV-ORDER-947N-2020
    to: SEC-SRC-RU-PP-140-2022
    type: ELECTRONIC_MEDICAL_DOCUMENT_EGISZ_REGISTRATION_CONTEXT
    status: VERIFIED_CONTEXT_APPLICABILITY_NOT_PROMOTED
    rationale: "Официальное разъяснение Минздрава подтверждает обмен/передачу электронных медицинских документов в ЕГИСЗ; это не означает передачу всех медицинских данных в каждый контур ЕГИСЗ."
  - relationship_id: PDN-REL-MZ209-152FZ-001
    from: SEC-SRC-RU-MINZDRAV-ORDER-209N-2026:procedure_point_29
    to: RU-152-FZ
    type: FUTURE_PERSON_LEVEL_MEDICAL_DOCUMENT_DATASET_OVERLAP
    status: FUTURE_CANDIDATE_APPLICABILITY_REVIEW_REQUIRED
    rationale: "Будущий Порядок содержит person-level поля получателя медицинской услуги, но до 01.09.2026 он не является текущим требованием."
