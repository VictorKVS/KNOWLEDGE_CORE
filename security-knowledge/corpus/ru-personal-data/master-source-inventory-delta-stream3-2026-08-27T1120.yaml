  title: "Постановление Правительства Российской Федерации от 09.02.2022 № 140 «О единой государственной информационной системе в сфере здравоохранения»"
  sector: healthcare_information_systems
  pdn_source_status: EXTERNAL_HEALTHCARE_INFORMATION_SYSTEM_REGIME_WITH_DIRECT_PDN_SECURITY_REFERENCE

relationship_candidates:
  - relationship_id: PDN-REL-PP140-152FZ-001
    from: SEC-SRC-RU-PP-140-2022:regulation_point_63
    to: RU-152-FZ
    type: DIRECT_STATUTORY_PDN_SECURITY_CONTEXT_IN_EGISZ
    status: CANDIDATE_APPLICABILITY_REVIEW_REQUIRED
    rationale: "Пункт 63 Положения прямо требует защищать информацию ЕГИСЗ в соответствии в том числе с законодательством Российской Федерации о персональных данных. Это доказывает PDN-контекст внутри ЕГИСЗ, но не доказывает автоматическую применимость каждого требования 152-ФЗ к любому внешнему медицинскому процессу, системе или участнику."
  - relationship_id: PDN-REL-PP140-323FZ-001
    from: SEC-SRC-RU-PP-140-2022
    to: SEC-SRC-RU-FZ-323:articles_91_91_1
    type: DIRECT_HEALTH_INFORMATION_SYSTEM_STATUTORY_BASIS
    status: VERIFIED_RELATION_APPLICABILITY_NOT_PROMOTED
    rationale: "ПП РФ № 140 принято во исполнение части 2 статьи 91.1 323-ФЗ; статья 91 323-ФЗ отдельно задает PDN/врачебно-тайный контекст информационных систем здравоохранения."
  - relationship_id: PDN-REL-PP140-323FZ-MEDSECRET-001
    from: SEC-SRC-RU-PP-140-2022:electronic_medical_document_and_patient_registry_flows
    to: SEC-SRC-RU-FZ-323:article_13
    type: MEDICAL_DOCUMENT_AND_PATIENT_DATA_POSSIBLE_DUAL_REGIME
    status: CANDIDATE_APPLICABILITY_REVIEW_REQUIRED
    rationale: "ЕГИСЗ содержит медицинские документы и специализированные регистры пациентов. Применимость врачебной тайны определяется содержанием и сценарием по 323-ФЗ; не вся информация ЕГИСЗ автоматически является врачебной тайной."
  - relationship_id: PDN-REL-PP140-168FZ-001
    from: SEC-SRC-RU-PP-140-2022:regulation_point_56
    to: SEC-SRC-RU-FZ-168-2020
    type: INTERSYSTEM_EXCHANGE_WITH_FEDERAL_POPULATION_REGISTER
    status: CANDIDATE_RELATION_CURRENT_TEXT_VERIFIED
    rationale: "Редакция после ПП РФ № 2164/2025 предусматривает взаимодействие ЕГИСЗ с единым федеральным информационным регистром населения; фактический состав передаваемых записей и основания передачи требуют отдельного сценарного доказательства."

