schema_version: "1.0"
id: RU-FL152-ARTICLE18-1-GOVERNANCE-ACCOUNTABILITY-ATOMIC-V1
title: Federal Law No. 152-FZ Article 18.1 governance and accountability measures
scope: >-
  Current Article 18.1 accountability duties covering necessary and sufficient measures,
  responsible-person appointment, policy and local acts, Article 19 security crosswalk,
  internal control or audit, harm assessment, worker awareness or training, unrestricted
  policy access, network-publication duties, the public-sector measures dependency and
  proof on request of the authorized body. Article 19 control content, Government Decree
  No. 211 details and regulator response procedure remain separate dependencies.

