atomic_rules:
  - {id: FL152-A18-1-R001, locator: article_18_1.part_1.sentence_1, class: NECESSARY_SUFFICIENT_MEASURES, rule: "Take measures necessary and sufficient to fulfil duties under 152-FZ and normative acts adopted under it."}
  - {id: FL152-A18-1-R002, locator: article_18_1.part_1.sentence_2, class: OPERATOR_MEASURE_SELECTION, rule: "Let the operator determine the composition and list of necessary and sufficient measures unless 152-FZ or another federal law provides otherwise."}
  - {id: FL152-A18-1-R003, locator: article_18_1.part_1.point_1, class: LEGAL_ENTITY_RESPONSIBLE_PERSON, rule: "An operator that is a legal entity appoints a person responsible for organizing personal-data processing."}
  - {id: FL152-A18-1-R004, locator: article_18_1.part_1.point_2.policy, class: LEGAL_ENTITY_POLICY_DOCUMENT, rule: "An operator that is a legal entity issues a document defining its personal-data processing policy."}
  - {id: FL152-A18-1-R005, locator: article_18_1.part_1.point_2.local_acts_by_purpose, class: LOCAL_ACTS_BY_PURPOSE, rule: "Issue local acts that structure the required processing information separately for each processing purpose."}
  - {id: FL152-A18-1-R006, locator: article_18_1.part_1.point_2.data_categories_and_list, class: LOCAL_ACT_DATA_CATEGORIES_AND_LIST, rule: "For each purpose, define the categories and list of personal data processed."}
  - {id: FL152-A18-1-R007, locator: article_18_1.part_1.point_2.subject_categories, class: LOCAL_ACT_SUBJECT_CATEGORIES, rule: "For each purpose, define the categories of data subjects."}
  - {id: FL152-A18-1-R008, locator: article_18_1.part_1.point_2.methods, class: LOCAL_ACT_PROCESSING_METHODS, rule: "For each purpose, define the processing methods."}
  - {id: FL152-A18-1-R009, locator: article_18_1.part_1.point_2.processing_terms, class: LOCAL_ACT_PROCESSING_TERMS, rule: "For each purpose, define the processing terms."}
  - {id: FL152-A18-1-R010, locator: article_18_1.part_1.point_2.storage_terms, class: LOCAL_ACT_STORAGE_TERMS, rule: "For each purpose, define the storage terms."}
  - {id: FL152-A18-1-R011, locator: article_18_1.part_1.point_2.destruction_procedure, class: LOCAL_ACT_DESTRUCTION_PROCEDURE, rule: "Define the destruction procedure for purpose achievement and other lawful grounds."}
  - {id: FL152-A18-1-R012, locator: article_18_1.part_1.point_2.violation_prevention_detection, class: LOCAL_ACT_VIOLATION_CONTROLS, rule: "Issue local procedures aimed at preventing and detecting violations of Russian law."}
  - {id: FL152-A18-1-R013, locator: article_18_1.part_1.point_2.violation_consequences, class: LOCAL_ACT_REMEDIATION_PROCEDURES, rule: "Issue local procedures for eliminating consequences of detected violations."}
  - {id: FL152-A18-1-R014, locator: article_18_1.part_1.point_2.guard_1, class: NO_SUBJECT_RIGHTS_RESTRICTION, rule: "Do not include provisions restricting personal-data subject rights in these documents or local acts."}
  - {id: FL152-A18-1-R015, locator: article_18_1.part_1.point_2.guard_2, class: NO_UNSUPPORTED_OPERATOR_POWERS_DUTIES, rule: "Do not confer on operators powers or duties not provided by Russian legislation."}
  - {id: FL152-A18-1-R016, locator: article_18_1.part_1.point_3, class: ARTICLE19_SECURITY_CROSSWALK, rule: "Apply legal, organizational and technical security measures in accordance with Article 19."}
  - {id: FL152-A18-1-R017, locator: article_18_1.part_1.point_4.chapeau, class: INTERNAL_CONTROL_OR_AUDIT, rule: "Perform internal control and/or audit of personal-data processing compliance."}
  - {id: FL152-A18-1-R018, locator: article_18_1.part_1.point_4.target_1, class: CONTROL_152FZ_AND_SUBORDINATE_ACTS, rule: "Cover 152-FZ and normative acts adopted under it in internal control or audit."}
  - {id: FL152-A18-1-R019, locator: article_18_1.part_1.point_4.target_2, class: CONTROL_PROTECTION_REQUIREMENTS, rule: "Cover applicable personal-data protection requirements."}
  - {id: FL152-A18-1-R020, locator: article_18_1.part_1.point_4.target_3, class: CONTROL_OPERATOR_POLICY, rule: "Cover the operator's personal-data processing policy."}
  - {id: FL152-A18-1-R021, locator: article_18_1.part_1.point_4.target_4, class: CONTROL_OPERATOR_LOCAL_ACTS, rule: "Cover the operator's local acts."}
  - {id: FL152-A18-1-R022, locator: article_18_1.part_1.point_5.branch_1, class: RKN_HARM_ASSESSMENT, rule: "Assess potential harm to subjects in accordance with requirements set by the authorized body."}
  - {id: FL152-A18-1-R023, locator: article_18_1.part_1.point_5.branch_2, class: HARM_MEASURE_PROPORTIONALITY, rule: "Assess the relationship between that harm and measures adopted to fulfil statutory duties."}
  - {id: FL152-A18-1-R024, locator: article_18_1.part_1.point_6.scope, class: DIRECT_PROCESSOR_WORKER_SCOPE, rule: "Apply the worker awareness/training measure to operator employees directly processing personal data."}
  - {id: FL152-A18-1-R025, locator: article_18_1.part_1.point_6.legislation, class: WORKER_LEGAL_AWARENESS, rule: "Familiarize covered workers with Russian personal-data legislation, including protection requirements."}
  - {id: FL152-A18-1-R026, locator: article_18_1.part_1.point_6.policy, class: WORKER_POLICY_AWARENESS, rule: "Familiarize covered workers with documents defining the operator's policy."}
  - {id: FL152-A18-1-R027, locator: article_18_1.part_1.point_6.local_acts, class: WORKER_LOCAL_ACT_AWARENESS, rule: "Familiarize covered workers with applicable personal-data local acts."}
  - {id: FL152-A18-1-R028, locator: article_18_1.part_1.point_6.training, class: WORKER_TRAINING, rule: "Provide familiarization and/or training to the covered workers."}
  - {id: FL152-A18-1-R029, locator: article_18_1.part_2.sentence_1.policy, class: UNRESTRICTED_POLICY_ACCESS, rule: "Publish or otherwise ensure unrestricted access to the personal-data processing policy document."}
  - {id: FL152-A18-1-R030, locator: article_18_1.part_2.sentence_1.protection_information, class: UNRESTRICTED_PROTECTION_REQUIREMENTS_INFORMATION, rule: "Publish or otherwise ensure unrestricted access to information about implemented personal-data protection requirements."}
  - {id: FL152-A18-1-R031, locator: article_18_1.part_2.sentence_2.trigger, class: NETWORK_COLLECTION_PUBLICATION_TRIGGER, rule: "Where the operator collects personal data using an information and telecommunications network, publish the policy and protection information in that network."}
  - {id: FL152-A18-1-R032, locator: article_18_1.part_2.sentence_2.site_pages, class: COLLECTION_PAGE_PUBLICATION, rule: "For Internet collection, publish the material on the operator-owned site pages used to collect the personal data."}
  - {id: FL152-A18-1-R033, locator: article_18_1.part_2.sentence_2.access, class: NETWORK_ACCESS_CAPABILITY, rule: "Ensure that the policy document can be accessed using the relevant network's means."}
  - {id: FL152-A18-1-R034, locator: article_18_1.part_3, class: STATE_MUNICIPAL_GOVERNMENT_LIST, rule: "For state and municipal body operators, route the concrete measures list to the Government-established list."}
  - {id: FL152-A18-1-R035, locator: article_18_1.part_4.branch_1, class: REGULATOR_REQUEST_DOCUMENT_PRODUCTION, rule: "On request of the authorized body, provide the documents and local acts referenced by part 1."}
  - {id: FL152-A18-1-R036, locator: article_18_1.part_4.branch_2, class: REGULATOR_REQUEST_OTHER_CONFIRMATION, rule: "On request of the authorized body, otherwise confirm the measures adopted under part 1, alone or together with document production."}

