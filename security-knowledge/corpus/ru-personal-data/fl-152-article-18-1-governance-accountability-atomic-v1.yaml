conflict_and_definition_checks:
  - {id: FL152-A18-1-C001, type: NECESSARY_AND_SUFFICIENT_NOT_CHECKLIST_ONLY, resolution: "The listed measures are introduced as examples in particular; completing only those items does not automatically prove every necessary and sufficient measure."}
  - {id: FL152-A18-1-C002, type: SELF_SELECTION_LIMITED_BY_FEDERAL_LAW, resolution: "Operator discretion yields where 152-FZ or another federal law provides otherwise."}
  - {id: FL152-A18-1-C003, type: LEGAL_ENTITY_SCOPE_FOR_POINTS1_2, resolution: "The express legal-entity qualifier applies to responsible-person appointment and the point 2 document set; do not silently impose that role form on a non-legal-entity operator through these points."}
  - {id: FL152-A18-1-C004, type: POLICY_NOT_COMPLETE_LOCAL_ACT_SET, resolution: "A public policy document does not replace the purpose-specific and violation-control local acts."}
  - {id: FL152-A18-1-C005, type: PURPOSE_BASED_GRANULARITY, resolution: "Categories, lists, subject categories, methods and terms must be determined for each processing purpose rather than only globally."}
  - {id: FL152-A18-1-C006, type: PROCESSING_AND_STORAGE_TERMS_DISTINCT, resolution: "Processing terms and storage terms are separate required elements."}
  - {id: FL152-A18-1-C007, type: DESTRUCTION_TRIGGERS_NOT_EXHAUSTIVE, resolution: "The destruction procedure covers purpose achievement and other lawful grounds; do not limit it to purpose achievement alone."}
  - {id: FL152-A18-1-C008, type: LOCAL_ACT_RIGHTS_GUARD, resolution: "Local acts cannot reduce rights granted to subjects by law."}
  - {id: FL152-A18-1-C009, type: NO_SELF_CREATED_POWERS_DUTIES, resolution: "A local act cannot create operator powers or duties absent from Russian legislation."}
  - {id: FL152-A18-1-C010, type: ARTICLE19_CROSSWALK_NOT_REPLACEMENT, resolution: "Article 18.1 point 3 invokes Article 19 and does not itself enumerate or replace its security controls."}
  - {id: FL152-A18-1-C011, type: CONTROL_OR_AUDIT, resolution: "The text permits internal control and/or audit; it does not mandate one named audit certification or external auditor."}
  - {id: FL152-A18-1-C012, type: CONTROL_TARGETS_COMPLETE, resolution: "The control scope covers law and subordinate acts, protection requirements, policy and local acts."}
  - {id: FL152-A18-1-C013, type: NO_CONTROL_FREQUENCY_INVENTION, resolution: "Article 18.1 states no monthly, quarterly, annual or other numeric control interval."}
  - {id: FL152-A18-1-C014, type: HARM_METHOD_DELEGATED, resolution: "Harm assessment follows authorized-body requirements; do not invent a numeric formula or replace RKN Order No. 178."}
  - {id: FL152-A18-1-C015, type: HARM_AND_MEASURES_RELATIONSHIP, resolution: "The law requires a relationship assessment but does not prescribe a numerical ratio."}
  - {id: FL152-A18-1-C016, type: DIRECT_PROCESSOR_WORKER_SCOPE, resolution: "The express awareness/training measure targets workers directly processing personal data; role evidence is required."}
  - {id: FL152-A18-1-C017, type: FAMILIARIZATION_AND_OR_TRAINING, resolution: "Familiarization and training are alternative or combinable routes; neither an exact curriculum nor a numeric refresher period is stated."}
  - {id: FL152-A18-1-C018, type: UNRESTRICTED_ACCESS_TWO_OBJECTS, resolution: "Unrestricted access covers both the policy document and information on implemented protection requirements."}
  - {id: FL152-A18-1-C019, type: NETWORK_COLLECTION_PAGE_SCOPE, resolution: "For network collection, publication must cover the relevant collection network and operator-owned collection pages; an unrelated corporate page is insufficient."}
  - {id: FL152-A18-1-C020, type: PUBLIC_OPERATOR_SPECIALIZATION, resolution: "Part 3 delegates the state/municipal body list to the Government; PP 211 details and its ten-day clock are not universalized to private operators."}
  - {id: FL152-A18-1-C021, type: REGULATOR_EVIDENCE_AND_OR, resolution: "On request, documents/local acts and other confirmation are alternative or combinable evidence routes."}
  - {id: FL152-A18-1-C022, type: NO_PART4_NUMERIC_PERIOD, resolution: "Article 18.1 part 4 states no numeric response period; do not import a period without the applicable request procedure."}

