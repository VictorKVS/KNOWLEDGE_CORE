conflict_and_definition_checks:
  - {id: FL152-A18-C001, type: ARTICLE14_PART7_IMPORT, resolution: "Part 1 imports the current Article 14 part 7 information set; do not replace it with a shorter local list."}
  - {id: FL152-A18-C002, type: NO_SEPARATE_PART1_NUMERIC_PERIOD, resolution: "Article 18 part 1 says on request but states no separate numeric response period; route procedure to Articles 14 and 20."}
  - {id: FL152-A18-C003, type: FEDERAL_LAW_TRIGGER_ONLY, resolution: "Part 2 requires a federal-law mandate; a contract, policy or form design alone does not create the trigger."}
  - {id: FL152-A18-C004, type: DATA_AND_OR_CONSENT_LIMBS, resolution: "Mandatory data provision and mandatory consent are independent and combinable trigger limbs."}
  - {id: FL152-A18-C005, type: EXPLANATION_NOT_COERCION, resolution: "The duty is to explain legal consequences; Article 18 does not itself compel provision or consent without the qualifying federal law."}
  - {id: FL152-A18-C006, type: INDIRECT_COLLECTION_SCOPE, resolution: "Part 3 applies when data were obtained from someone other than the subject, not merely because an external service processed directly supplied data."}
  - {id: FL152-A18-C007, type: BEFORE_PROCESSING_EVENT, resolution: "The notice is due before processing begins; no numeric grace period is stated."}
  - {id: FL152-A18-C008, type: SIX_REQUIRED_NOTICE_ELEMENTS, resolution: "Treat point 2.1 as an independent required element and preserve all six listed information elements."}
  - {id: FL152-A18-C009, type: PART4_EXCEPTIONS_EXACT, resolution: "Do not infer a general convenience, burden or internal-policy exception."}
  - {id: FL152-A18-C010, type: QUALIFYING_CONTRACT_ROLES, resolution: "The contract branch requires the subject to be party, beneficiary or guarantor; a contract involving unrelated parties is insufficient."}
  - {id: FL152-A18-C011, type: ARTICLE10_1_CONDITIONAL_EXCEPTION, resolution: "Data permitted for dissemination qualify only while Article 10.1 prohibitions and conditions are observed."}
  - {id: FL152-A18-C012, type: RESEARCH_CREATIVE_RIGHTS_CONDITION, resolution: "The research/journalism/creative exception fails where subject rights or legitimate interests are violated."}
  - {id: FL152-A18-C013, type: THIRD_PARTY_RIGHTS_NOT_OPERATOR_CONVENIENCE, resolution: "Point 5 protects third-party rights and legitimate interests, not the operator's convenience."}
  - {id: FL152-A18-C014, type: CURRENT_PART5_EFFECTIVE_DATE, resolution: "Apply the current foreign-database prohibition from 1 July 2025; do not backdate it over the previous wording."}
  - {id: FL152-A18-C015, type: RF_CITIZEN_SCOPE, resolution: "Part 5 expressly covers personal data of citizens of the Russian Federation; do not infer citizenship from language, residence or IP address alone."}
  - {id: FL152-A18-C016, type: COLLECTION_CONTEXT, resolution: "Part 5 is framed at collection, including collection through the Internet; later operations require a fact-specific relationship to that collection and other applicable law."}
  - {id: FL152-A18-C017, type: FOREIGN_DATABASE_LOCATION, resolution: "The prohibition turns on a database being outside Russia, not merely on foreign ownership of a database located in Russia."}
  - {id: FL152-A18-C018, type: ENUMERATED_OPERATIONS_ONLY, resolution: "The listed operations are recording, systematization, accumulation, storage, clarification and extraction; do not silently add use, transfer, blocking, deletion or destruction to Article 18 part 5."}
  - {id: FL152-A18-C019, type: FOUR_EXCEPTIONS_ONLY, resolution: "The express cross-reference is limited to Article 6 part 1 points 2, 3, 4 and 8; another Article 6 basis is not automatically a part 5 exception."}
  - {id: FL152-A18-C020, type: LOCALIZATION_NOT_CROSS_BORDER_TRANSFER, resolution: "A compliant initial collection does not itself resolve or prohibit a later cross-border transfer; assess that separately under Article 12."}

