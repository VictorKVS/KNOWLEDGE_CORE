schema_version: "1.0"
id: RU-FL152-ARTICLE18-COLLECTION-NOTICE-LOCALIZATION-ATOMIC-V1
title: Federal Law No. 152-FZ Article 18 collection notice and database-localization duties
scope: >-
  Current Article 18 duties to answer a subject's collection-stage information request,
  explain consequences where a federal law makes data provision or consent mandatory,
  notify a subject before processing indirectly collected data unless a stated exception
  applies, and avoid the enumerated operations in foreign databases while collecting data
  of Russian citizens unless an exact Article 6 exception applies. Article 12
  cross-border-transfer rules, Article 14 response procedure and sanctions remain separate.

