atomic_rules:
  - {id: FL152-A18-R001, locator: article_18.part_1, class: COLLECTION_REQUEST_INFORMATION, rule: "When collecting personal data, provide the subject on request with the information specified by Article 14 part 7."}
  - {id: FL152-A18-R002, locator: article_18.part_2.trigger_1, class: FEDERAL_LAW_MANDATORY_DATA_PROVISION, rule: "Recognize the part 2 trigger where a federal law makes provision of personal data mandatory."}
  - {id: FL152-A18-R003, locator: article_18.part_2.trigger_2, class: FEDERAL_LAW_MANDATORY_CONSENT, rule: "Recognize the independent part 2 trigger where a federal law makes obtaining consent mandatory."}
  - {id: FL152-A18-R004, locator: article_18.part_2.duty, class: REFUSAL_CONSEQUENCES_EXPLANATION, rule: "Explain the legal consequences of refusing to provide the data and/or consent covered by a qualifying federal-law trigger."}
  - {id: FL152-A18-R005, locator: article_18.part_3.chapeau, class: INDIRECT_COLLECTION_PRE_PROCESSING_NOTICE, rule: "Where data were obtained from someone other than the subject and no part 4 exception applies, give the required information before processing begins."}
  - {id: FL152-A18-R006, locator: article_18.part_3.point_1, class: NOTICE_OPERATOR_IDENTITY_ADDRESS, rule: "Include the operator or representative name, or surname/name/patronymic, and address in the indirect-collection notice."}
  - {id: FL152-A18-R007, locator: article_18.part_3.point_2, class: NOTICE_PURPOSE_AND_LEGAL_BASIS, rule: "Include both the processing purpose and its legal basis."}
  - {id: FL152-A18-R008, locator: article_18.part_3.point_2_1, class: NOTICE_PERSONAL_DATA_LIST, rule: "Include the list of personal data."}
  - {id: FL152-A18-R009, locator: article_18.part_3.point_3, class: NOTICE_INTENDED_USERS, rule: "Include the intended users of the personal data."}
  - {id: FL152-A18-R010, locator: article_18.part_3.point_4, class: NOTICE_SUBJECT_RIGHTS, rule: "Include the subject rights established by 152-FZ."}
  - {id: FL152-A18-R011, locator: article_18.part_3.point_5, class: NOTICE_SOURCE, rule: "Include the source from which the personal data were obtained."}
  - {id: FL152-A18-R012, locator: article_18.part_4.point_1, class: EXCEPTION_SUBJECT_ALREADY_NOTIFIED, rule: "Do not repeat the part 3 notice where the subject is already notified of the operator's processing."}
  - {id: FL152-A18-R013, locator: article_18.part_4.point_2.branch_1, class: EXCEPTION_DATA_FROM_FEDERAL_LAW, rule: "Apply the part 3 notice exception where the operator obtained the data on the basis of a federal law."}
  - {id: FL152-A18-R014, locator: article_18.part_4.point_2.branch_2, class: EXCEPTION_QUALIFYING_CONTRACT, rule: "Apply the part 3 notice exception where data were obtained in connection with performance of a contract to which the subject is a party, beneficiary or guarantor."}
  - {id: FL152-A18-R015, locator: article_18.part_4.point_3, class: EXCEPTION_DISSEMINATION_DATA, rule: "Apply the part 3 notice exception only when processing of data permitted for dissemination observes Article 10.1 prohibitions and conditions."}
  - {id: FL152-A18-R016, locator: article_18.part_4.point_4, class: EXCEPTION_RESEARCH_JOURNALISM_CREATIVE, rule: "Apply the stated statistical, research, journalism, scientific, literary or other creative exception only if subject rights and legitimate interests are not violated."}
  - {id: FL152-A18-R017, locator: article_18.part_4.point_5, class: EXCEPTION_THIRD_PARTY_RIGHTS, rule: "Apply the part 3 notice exception where providing the information would violate third-party rights and legitimate interests."}
  - {id: FL152-A18-R018, locator: article_18.part_5.chapeau, class: RF_CITIZEN_COLLECTION_FOREIGN_DATABASE_SCOPE, rule: "During collection, including online collection, apply part 5 to personal data of Russian citizens where a database located outside Russia would be used."}
  - {id: FL152-A18-R019, locator: article_18.part_5.operation_1, class: FOREIGN_DATABASE_RECORDING_PROHIBITION, rule: "Do not record covered data using a database located outside Russia unless an exact stated exception applies."}
  - {id: FL152-A18-R020, locator: article_18.part_5.operation_2, class: FOREIGN_DATABASE_SYSTEMATIZATION_PROHIBITION, rule: "Do not systematize covered data using a database located outside Russia unless an exact stated exception applies."}
  - {id: FL152-A18-R021, locator: article_18.part_5.operation_3, class: FOREIGN_DATABASE_ACCUMULATION_PROHIBITION, rule: "Do not accumulate covered data using a database located outside Russia unless an exact stated exception applies."}
  - {id: FL152-A18-R022, locator: article_18.part_5.operation_4, class: FOREIGN_DATABASE_STORAGE_PROHIBITION, rule: "Do not store covered data using a database located outside Russia unless an exact stated exception applies."}
  - {id: FL152-A18-R023, locator: article_18.part_5.operation_5, class: FOREIGN_DATABASE_CLARIFICATION_PROHIBITION, rule: "Do not clarify, update or change covered data using a database located outside Russia unless an exact stated exception applies."}
  - {id: FL152-A18-R024, locator: article_18.part_5.operation_6, class: FOREIGN_DATABASE_EXTRACTION_PROHIBITION, rule: "Do not extract covered data using a database located outside Russia unless an exact stated exception applies."}
  - {id: FL152-A18-R025, locator: article_18.part_5.exception.article_6_part_1_point_2, class: LOCALIZATION_EXCEPTION_A6P1P2, rule: "Route only a substantiated Article 6 part 1 point 2 basis through this exception."}
  - {id: FL152-A18-R026, locator: article_18.part_5.exception.article_6_part_1_point_3, class: LOCALIZATION_EXCEPTION_A6P1P3, rule: "Route only a substantiated Article 6 part 1 point 3 basis through this exception."}
  - {id: FL152-A18-R027, locator: article_18.part_5.exception.article_6_part_1_point_4, class: LOCALIZATION_EXCEPTION_A6P1P4, rule: "Route only a substantiated Article 6 part 1 point 4 basis through this exception."}
  - {id: FL152-A18-R028, locator: article_18.part_5.exception.article_6_part_1_point_8, class: LOCALIZATION_EXCEPTION_A6P1P8, rule: "Route only a substantiated Article 6 part 1 point 8 basis through this exception."}

