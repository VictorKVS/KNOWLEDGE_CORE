decree_rules:
  - id: PP740-DECREE-01
    locator: decree.clause_1
    rule: >-
      Designate the federal state information system EIP NSUD as the state information
      system of the federal executive authority referred to in article 13.1 of Federal Law No. 152-FZ.
    effective_from: "2025-09-01"
  - id: PP740-DECREE-02
    locator: decree.clause_2
    rule: Approve the ten modeled amendments to the Decree No. 733 regulation.
    effective_from: "2025-09-01"
  - id: PP740-DECREE-03
    locator: decree.clause_3
    actor: Ministry_of_Digital_Development
    rule: >-
      Ensure creation and operation of the Unified Trusted Platform for Data Exchange
      and Analysis component within EIP NSUD.
    effective_from: "2025-05-28"
  - id: PP740-DECREE-04
    locator: decree.clause_4
    rule: Apply the split effective-date rule; clause 3 starts on signature and the rest on 1 September 2025.

amendment_crosswalk:
  - id: PP740-AMEND-01
    source_locator: changes.item_1
    target_locator: pp733.regulation.clause_2
    effect: REPLACE_DATASET_DEFINITION_AND_ADD_TWO_DEFINITIONS
    introduced:
      - DATASET_DEFINITION
      - DATA_COMPOSITION_DEFINITION
      - ANONYMIZED_DATA_DEFINITION
    current_state_after_pp2052: REENACTED_IN_FULL_CLAUSE_REPLACEMENT
    current_semantics:
      data_composition: >-
        Grouped personal-data compositions obtained through anonymization, whose later
        processing cannot determine attribution to a specific data subject.
      anonymized_data: Personal data obtained through anonymization under article 13.1 of Federal Law No. 152-FZ.
  - id: PP740-AMEND-02
    source_locator: changes.item_2
    target_locator: pp733.regulation.clause_3
    effect: ADD_ARTICLE_13_1_PURPOSE
    rule: >-
      Add processing of anonymized data, formation of data compositions and access to
      them under article 13.1 to the platform purposes.
    current_state_after_pp2052: RETAINED_INSIDE_FURTHER_AMENDED_CLAUSE
  - id: PP740-AMEND-03
    source_locator: changes.item_3
    target_locator: pp733.regulation.clause_4
    effect: ADD_TWO_PLATFORM_TASKS
    tasks:
      - PROCESS_ANONYMIZED_DATA
      - FORM_DATA_COMPOSITIONS_AND_PROVIDE_ACCESS_UNDER_ARTICLE_13_1
    current_state_after_pp2052: RETAINED_WITH_ADDITIONAL_LATER_TASKS
  - id: PP740-AMEND-04
    source_locator: changes.item_4
    target_locator: pp733.regulation.clause_5
    effect: ADD_SUBSYSTEM_AND_COMPONENT
    additions:
      - ANONYMIZED_DATA_PROCESSING_SUBSYSTEM
      - UNIFIED_TRUSTED_DATA_EXCHANGE_AND_ANALYSIS_PLATFORM_COMPONENT
    current_state_after_pp2052: RETAINED
  - id: PP740-AMEND-05
    source_locator: changes.item_5
    target_locator: pp733.regulation.clause_5_1
    effect: ADD_COMPONENT_PURPOSE
    component_bases:
      - INFORMATION_ANALYTICAL_SUPPORT_SUBSYSTEM
      - ANONYMIZED_DATA_PROCESSING_SUBSYSTEM
    rule: The component is intended, among other things, for dataset processing and access provision.
    current_state_after_pp2052: RETAINED
  - id: PP740-AMEND-06
    source_locator: changes.item_6
    target_locator: pp733.regulation.clause_6
    effect: REPLACE_PARTICIPANT_ROLE_TAXONOMY
    article_13_1_roles:
      provider: PERSONAL_DATA_OPERATOR_THAT_RECEIVED_ARTICLE_13_1_PART_2_REQUIREMENT
      public_users: ARTICLE_13_1_PART_7_ITEM_1_CLASS
      private_users: RUSSIAN_CITIZENS_AND_LEGAL_ENTITIES_MEETING_ARTICLE_13_1_PART_7
    current_state_after_pp2052: ARTICLE_13_1_ROLES_RETAINED
  - id: PP740-AMEND-07
    source_locator: changes.item_7
    target_locator: pp733.regulation.clause_6_1
    effect: ADD_CONDITIONAL_PUBLIC_BODY_REPRESENTATION
    rule: >-
      An executive body with ICT and federal-interaction powers may act for specified
      regional, territorial fund or local bodies only where the relevant regional law
      or municipal legal act provides for it.
    current_state_after_pp2052: RETAINED
  - id: PP740-AMEND-08
    source_locator: changes.item_8
    target_locator: pp733.regulation.clauses_8_1_and_8_2
    effect: ADD_PROVIDER_AND_USER_OPERATIONS
    provider_rule: Provide anonymized data to the subsystem under the individualized article 13.1 part-2 requirement.
    user_rule: >-
      Only users that obtained access under article 13.1 process data compositions and
      obtain results from compositions placed in the anonymized-data subsystem.
    current_state_after_pp2052: RETAINED
  - id: PP740-AMEND-09
    source_locator: changes.item_9
    target_locator: pp733.regulation.clause_9
    effect: ADD_OPERATOR_OBLIGATIONS
    operator_rules:
      - PROCESS_ANONYMIZED_DATA_IN_THE_ANONYMIZED_DATA_SUBSYSTEM_UNDER_ARTICLE_13_1
      - FORM_DATA_COMPOSITIONS_AND_PROVIDE_ACCESS_UNDER_ARTICLE_13_1
    current_state_after_pp2052: RETAINED_WITH_ADDITIONAL_LATER_OPERATOR_FUNCTIONS
  - id: PP740-AMEND-10
    source_locator: changes.item_10
    target_locator: pp733.regulation.clause_12
    effect: REPLACE_ORGANIZATIONAL_MEASURE
    rule: >-
      Participants must take organizational measures that designate authorized persons
      responsible for platform work and performance of duties under the regulation.
    current_state_after_pp2052: RETAINED

