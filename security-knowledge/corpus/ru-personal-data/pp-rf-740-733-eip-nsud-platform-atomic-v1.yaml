non_requirements:
  - Decree No. 740 designates the platform and amends its regulation; it does not itself grant a user access to a data composition.
  - The component-creation duty in clause 3 started on 28 May 2025; the designation and ten amendments started on 1 September 2025.
  - A personal-data operator becomes a platform provider through receipt of the individualized article 13.1 part-2 requirement, not merely because it is an operator.
  - A private Russian citizen or legal entity is not an eligible platform user merely by nationality or incorporation; article 13.1 part-7 criteria and the access procedure still apply.
  - A regional or municipal ICT body does not receive universal representation authority; a regional law or municipal legal act is required for the modeled branch.
  - Decree No. 2052 AI and general dataset provisions do not displace the specific article 13.1 access regime.
  - No numeric access, retention or response deadline is stated in Decree No. 740 or the modeled Decree No. 733 platform clauses.
  - State-secret information is prohibited in EIP NSUD; the platform designation is not permission to process it.

