conflict_and_definition_checks:
  - {id: FL152-A21-C001, type: UNLAWFUL_VS_INACCURATE, resolution: "Unlawful processing and inaccurate data are separate part 1 triggers; only the inaccurate-data block carries the express rights-and-legitimate-interests guard."}
  - {id: FL152-A21-C002, type: TWO_CLOCKS_FROM_ONE_DETECTION, resolution: "The three-working-day cessation clock and ten-working-day destruction clock both originate at detection of unlawful processing; the latter does not restart after the former."}
  - {id: FL152-A21-C003, type: DESTRUCTION_CONDITIONAL_ON_LAWFULNESS, resolution: "Part 3 destruction follows only when lawful processing cannot be ensured; detected unlawfulness does not automatically erase every affected record before remediation analysis."}
  - {id: FL152-A21-C004, type: INCIDENT_TRIGGER_REQUIRES_RIGHTS_VIOLATION, resolution: "Transfer, provision, dissemination or access alone is insufficient for part 3.1 unless the event caused violation of subjects' rights."}
  - {id: FL152-A21-C005, type: DISTINCT_30_DAY_ROUTES, resolution: "Purpose achievement and consent withdrawal have separate origins and exception analyses; withdrawal destruction is additionally conditioned on retention no longer being required for processing purposes."}
  - {id: FL152-A21-C006, type: CESSATION_DEMAND_NOT_CONSENT_WITHDRAWAL, resolution: "Part 5.1 is a subject demand with enumerated statutory exceptions and a possible reasoned 5-working-day extension; it is not the part 5 consent-withdrawal route."}
  - {id: FL152-A21-C007, type: SIX_MONTH_FALLBACK_NOT_DEFAULT, resolution: "Six months applies only when destruction is impossible within the applicable parts 3-5.1 period, requires interim blocking and yields to another period established by federal law."}
  - {id: FL152-A21-C008, type: RESULT_NOTICE_DEADLINE_NOT_NUMERIC, resolution: "Part 3 requires notification of remediation or destruction but states no separate numeric notification period; none is invented."}
  - {id: FL152-A21-C009, type: DESTRUCTION_PROOF_DELEGATED, resolution: "Part 7 delegates confirmation requirements to the regulator and is implemented by RKN Order No. 179; Article 21 does not itself enumerate act or log fields."}

