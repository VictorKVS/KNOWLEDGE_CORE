schema_version: "1.0"
id: RU-FL152-ARTICLE21-REMEDIATION-DESTRUCTION-ATOMIC-V1
title: Federal Law No. 152-FZ Article 21 remediation, blocking and destruction duties
scope: >-
  Complete current Article 21 routing for inaccurate and unlawfully processed personal
  data, incident notification, purpose completion, consent withdrawal, a subject's demand
  to stop processing, destruction impossibility and destruction confirmation. The model
  preserves operator/processor responsibility and does not convert exceptions or deadlines
  into broader permissions.

