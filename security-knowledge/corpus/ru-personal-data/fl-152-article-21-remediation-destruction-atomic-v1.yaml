atomic_rules:
  - {id: FL152-A21-R001, locator: article_21.part_1.sentence_1, class: UNLAWFUL_PROCESSING_BLOCK, rule: "On an identified unlawful-processing case arising from a subject or representative appeal/request or a regulator request, block the affected subject's unlawfully processed data from receipt and for the verification period, or ensure blocking by the instructed processor."}
  - {id: FL152-A21-R002, locator: article_21.part_1.sentence_2, class: INACCURATE_DATA_BLOCK, rule: "On identified inaccurate data arising from a subject or representative appeal/request or a regulator request, block the affected subject's data from receipt and for the verification period, or ensure processor blocking, provided blocking does not violate the rights and legitimate interests of the subject or third parties."}
  - {id: FL152-A21-R003, locator: article_21.part_2, class: DATA_CLARIFICATION, rule: "When inaccuracy is confirmed, clarify the data or ensure processor clarification on the supplied information or other necessary documents within seven working days from submission of that information."}
  - {id: FL152-A21-R004, locator: article_21.part_2, class: UNBLOCK_AFTER_CLARIFICATION, rule: "Lift the personal-data block after the confirmed inaccuracy has been corrected."}
  - {id: FL152-A21-R005, locator: article_21.part_3.sentence_1, class: UNLAWFUL_PROCESSING_STOP, rule: "Stop unlawful processing or ensure processor cessation within no more than three working days from detection."}
  - {id: FL152-A21-R006, locator: article_21.part_3.sentence_2, class: UNLAWFUL_PROCESSING_DESTRUCTION, rule: "If lawful processing cannot be ensured, destroy the affected personal data or ensure processor destruction within no more than ten working days from detection of unlawful processing."}
  - {id: FL152-A21-R007, locator: article_21.part_3.sentence_3, class: REMEDIATION_NOTIFICATION, rule: "Notify the subject or representative of remediation or destruction."}
  - {id: FL152-A21-R008, locator: article_21.part_3.sentence_3, class: REGULATOR_NOTIFICATION_CONDITIONAL, rule: "Also notify the regulator when it forwarded the subject/representative appeal or request, or when the regulator request initiated the route."}
  - {id: FL152-A21-R009, locator: article_21.part_3_1.chapeau, class: INCIDENT_TRIGGER, rule: "Apply the incident route when unlawful or accidental transfer, provision, dissemination or access has caused a violation of personal-data subjects' rights."}
  - {id: FL152-A21-R010, locator: article_21.part_3_1.chapeau, class: INCIDENT_CLOCK_ORIGIN, rule: "Measure incident duties from detection by the operator, regulator or another interested person."}
  - {id: FL152-A21-R011, locator: article_21.part_3_1.item_1, class: INCIDENT_INITIAL_NOTICE, rule: "Within 24 hours notify the regulator of the incident, presumed causes, presumed harm, mitigation measures and the operator-authorized regulator contact."}
  - {id: FL152-A21-R012, locator: article_21.part_3_1.item_2, class: INCIDENT_FOLLOWUP_NOTICE, rule: "Within 72 hours notify the regulator of the internal-investigation results and, if available, persons whose actions caused the incident."}
  - {id: FL152-A21-R013, locator: article_21.part_4, class: PURPOSE_ACHIEVED, rule: "On achievement of the processing purpose, cease processing and destroy the data, or ensure processor cessation and destruction, within no more than 30 days from purpose achievement."}
  - {id: FL152-A21-R014, locator: article_21.part_4.exceptions, class: PURPOSE_ROUTE_EXCEPTION, rule: "Do not force the part 4 route where otherwise provided by a contract involving the subject, another operator-subject agreement, or a statutory basis allowing processing without consent."}
  - {id: FL152-A21-R015, locator: article_21.part_5, class: CONSENT_WITHDRAWAL, rule: "On consent withdrawal, cease processing and, when retaining the data is no longer required for processing purposes, destroy the data or ensure processor cessation and destruction within no more than 30 days from receipt of the withdrawal."}
  - {id: FL152-A21-R016, locator: article_21.part_5.exceptions, class: WITHDRAWAL_ROUTE_EXCEPTION, rule: "Do not force the part 5 route where otherwise provided by a contract involving the subject, another operator-subject agreement, or a statutory basis allowing processing without consent."}
  - {id: FL152-A21-R017, locator: article_21.part_5_1.sentence_1, class: SUBJECT_CESSATION_DEMAND, rule: "On a subject's demand to cease processing, cease or ensure cessation within no more than ten working days from receipt."}
  - {id: FL152-A21-R018, locator: article_21.part_5_1.sentence_1.exceptions, class: CESSATION_DEMAND_EXCEPTION, rule: "The demand route does not override processing covered by Article 6 part 1 items 2-11, Article 10 part 2 or Article 11 part 2."}
  - {id: FL152-A21-R019, locator: article_21.part_5_1.sentence_2, class: CESSATION_DEMAND_EXTENSION, rule: "Extend the ten-working-day period by no more than five working days only after sending the subject a reasoned notice stating the reasons for extension."}
  - {id: FL152-A21-R020, locator: article_21.part_6, class: DESTRUCTION_IMPOSSIBILITY_BLOCK, rule: "If destruction cannot be completed within the period applicable under parts 3 through 5.1, block the data or ensure processor blocking."}
  - {id: FL152-A21-R021, locator: article_21.part_6, class: DESTRUCTION_FALLBACK_DEADLINE, rule: "After the impossibility route, ensure destruction within no more than six months unless a federal law establishes another period."}
  - {id: FL152-A21-R022, locator: article_21.part_7, class: DESTRUCTION_CONFIRMATION, rule: "Confirm destruction in accordance with requirements established by the personal-data-subject-rights regulator."}

