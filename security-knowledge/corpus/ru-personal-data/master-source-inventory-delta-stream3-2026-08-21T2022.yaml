  target: "152-ФЗ generic personal-data regime"
  relation: OVERLAP_CANDIDATE_SPECIAL_CONFIDENTIALITY_REGIME
  state: RELATIONSHIP_LEVEL_APPLICABILITY_REVIEW_REQUIRED
  finding: >-
    Article 26 protects banking information and regulates statutory disclosure channels. The protected information can
    concern natural persons as well as legal entities. Any 152-ФЗ relationship must therefore be evaluated for the
    concrete actor, data subject, data field, purpose, operation, recipient and statutory basis.
  guard: >-
    Do not infer a universal 152-ФЗ rule from the fact that a bank record concerns an individual. Banking secrecy and PDN
    are overlapping but distinct legal regimes. OVERLAP != APPLICABILITY.

