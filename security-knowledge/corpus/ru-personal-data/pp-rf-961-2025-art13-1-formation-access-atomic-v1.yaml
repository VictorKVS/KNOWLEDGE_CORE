non_requirements:
  - The 30-working-day formation clock belongs to the authorized body, not to the operator.
  - The 10-day clock is calendar days and starts only on a corresponding security-body request.
  - The 15-working-day value is the user's clarification window before refusal, not an access-grant deadline.
  - Immediate blocking has no invented numeric hour or day value.
  - Purpose achievement causes access termination; the decree states no universal dataset retention period.
  - Access to an existing dataset and initiation of an operator requirement are distinct clause 9 branches.
  - Clause 6 does not create a blanket exception for every special-category datum.

