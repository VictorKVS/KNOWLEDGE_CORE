  access_requester: ARTICLE_13_1_ELIGIBLE_USER

formation_applicability:
  system: ARTICLE_13_1_STATE_INFORMATION_SYSTEM
  required_inputs:
    - ANONYMIZED_DATA_RECEIVED_FROM_OPERATOR
    - OPERATOR_RECEIVED_ARTICLE_13_1_PART_2_REQUIREMENT
    - PP538_ENUMERATED_FORMATION_CASE
  fail_closed_rule: >-
    Do not treat Decree No. 961 as a general authority to collect or form datasets.
    The individualized requirement and an enumerated Decree No. 538 case must be proved.

formation_rules:
  - id: PP961-FORM-1
    locator: formation_rules.clause_1
    rule: Limit the formation procedure to grouped anonymized datasets in the article 13.1 state information system.
  - id: PP961-FORM-2
    locator: formation_rules.clause_2
    rule: >-
      Form datasets only from anonymized data supplied by operators that received the
      article 13.1 part 2 requirement, and only for Government-defined formation cases.
  - id: PP961-FORM-3
    locator: formation_rules.clause_3.subclauses_a_v
    rule: Consider all three modeled security threat types when forming a dataset.
  - id: PP961-FORM-4
    locator: formation_rules.clause_4
    actor: Ministry_of_Digital_Development
    rule: Complete dataset formation no later than 30 working days after operator data arrive.
  - id: PP961-FORM-5A
    locator: formation_rules.clause_5.paragraph_1
    actor: Ministry_of_Digital_Development
    rule: >-
      Where necessary for the formation purpose and threat neutralization, exclude or
      correct inaccurate, incomplete, duplicate or incorrectly formatted anonymized data
      and transform their format or structure.
  - id: PP961-FORM-5B
    locator: formation_rules.clause_5.paragraph_2_sentence_1
    actor: Ministry_of_Digital_Development
    rule: Check operator-supplied anonymized data for conformity with the clause 2 requirement route.
  - id: PP961-FORM-5C
    locator: formation_rules.clause_5.paragraph_2_sentence_2
    actor: Ministry_of_Digital_Development
    rule: >-
      Send the check results to the security body no later than 10 calendar days after
      receipt of that body's corresponding request.
  - id: PP961-FORM-6
    locator: formation_rules.clause_6
    rule: >-
      Do not form datasets from article 10 special-category personal data, except data
      covered by article 10 part 2.1, or from article 11 biometric personal data.

formation_threat_types:
  - id: MEMBERSHIP_INFERENCE
    locator: formation_rules.clause_3.a
    description: Isolating information in the dataset corresponding to a specific subject.
  - id: LINKAGE_OR_ENRICHMENT
    locator: formation_rules.clause_3.b
    description: Isolating information relating to one or more specific subjects by linking data.
  - id: VALUE_INFERENCE
    locator: formation_rules.clause_3.v
    description: Determining original anonymized-data values relating to a subject.

access_request_schema:
  channel: USER_CABINET_IN_ARTICLE_13_1_STATE_INFORMATION_SYSTEM
  required_fields:
    - ACCESS_PURPOSE
    - PLANNED_RESULT_OR_ITS_CONTENT
    - DATASET_PROCESSING_PERIOD
    - LEGAL_GROUNDS_FOR_ACCESS
  signature_routes:
    russian_citizen:
      any_of: [ENHANCED_QUALIFIED_SIGNATURE, QUALIFYING_GOV_INFRASTRUCTURE_ENHANCED_UNQUALIFIED_SIGNATURE]
    organization_or_public_body_representative:
      required: ENHANCED_QUALIFIED_SIGNATURE
    legal_entity_proxy:
      additional_evidence: POWER_OF_ATTORNEY_INCLUDING_MACHINE_READABLE_FORM_WHERE_USED

access_rules:
  - id: PP961-ACCESS-1
    locator: access_rules.clause_1
    rule: Limit access to datasets processed in the article 13.1 state information system.
  - id: PP961-ACCESS-2
    locator: access_rules.clause_2
    rule: Require the modeled request fields through the user cabinet.
  - id: PP961-ACCESS-3A
    locator: access_rules.clause_3.paragraph_1
    rule: Apply the modeled citizen signature route.
  - id: PP961-ACCESS-3B
    locator: access_rules.clause_3.paragraph_2
    rule: Apply the enhanced-qualified-signature route to listed organization and public-body requesters.
  - id: PP961-ACCESS-3C
    locator: access_rules.clause_3.paragraph_3
    rule: Require the legal-entity representative's power of attorney with the request.
  - id: PP961-ACCESS-4
    locator: access_rules.clause_4
    actor: Ministry_of_Digital_Development
    rule: Review and check the request against clauses 2 and 3 no later than 5 working days after receipt.
  - id: PP961-ACCESS-5
    locator: access_rules.clause_5
    rule: >-
      If compliant, send a user-cabinet access notice signed with the enhanced qualified
      signature of the official designated by the head of the authorized body.
  - id: PP961-ACCESS-6
    locator: access_rules.clause_6
    rule: >-
      For remediable clause 2 information defects, send a reasoned signed clarification
      request; do not use this remediation branch for the direct-refusal clause 10 case.
  - id: PP961-ACCESS-7
    locator: access_rules.clause_7
    rule: Suspend request consideration until the requested information is received.
  - id: PP961-ACCESS-8
    locator: access_rules.clause_8
    rule: >-
      If the requested information is not supplied within 15 working days from the
      clarification request, send a signed refusal notice through the user cabinet.
  - id: PP961-ACCESS-9
    locator: access_rules.clause_9
    rule: >-
      After information is supplied and clause 2 conformity confirmed, grant access to an
      existing dataset or, if absent, initiate the article 13.1 part 2 operator-requirement route.
  - id: PP961-ACCESS-10
    locator: access_rules.clause_10
    rule: >-
      Refuse directly if the stated purpose is outside article 13.1 part 1 purposes or
      access would violate article 13.1 part 9.
  - id: PP961-ACCESS-11
    locator: access_rules.clause_11
    rule: >-
      Do not provide article 13.1 part 7 item 2 users access to datasets formed under
      Decree No. 538 cases а through г.
  - id: PP961-ACCESS-12
    locator: access_rules.clause_12
    rule: Terminate access when the access purpose is achieved.
  - id: PP961-ACCESS-13
    locator: access_rules.clause_13.subclauses_a_v
    rule: Block access immediately when any modeled blocking ground is established.

access_blocking_grounds:
  - id: USER_NO_LONGER_MEETS_ARTICLE_13_1_PART_7
    locator: access_rules.clause_13.a
  - id: ATTEMPT_TO_RECORD_EXTRACT_OR_TRANSFER_DATASET_FROM_SYSTEM
    locator: access_rules.clause_13.b
  - id: ACTUAL_OR_POTENTIAL_LEGALLY_PROTECTED_HARM_FROM_USE_OR_RESULTS
    locator: access_rules.clause_13.v

