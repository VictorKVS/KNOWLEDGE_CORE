schema_version: "1.0"
id: RU-FL152-ARTICLE23-AUTHORIZED-BODY-POWERS-ATOMIC-V1
title: Federal Law No. 152-FZ Article 23 authorized personal-data authority powers and duties
scope: >-
  Current Article 23 status, powers, duties and evidence routes of the authorized personal-data
  authority: complaints, information requests, operator-notification verification, remediation,
  access restriction, court/licensing/criminal/administrative routes, confidentiality, register
  duties, foreign cooperation, non-delegation, judicial appeal, annual reporting, incident
  registry and information exchange, and general anonymization rulemaking. Article 23.1 control
  procedure, Articles 20-22 operator clocks, licensing/criminal/court procedure and implementing
  anonymization or incident-exchange acts remain separate dependencies.

