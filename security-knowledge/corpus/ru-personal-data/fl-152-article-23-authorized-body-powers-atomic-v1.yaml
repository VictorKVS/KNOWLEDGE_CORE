atomic_rules:
  - {id: FL152-A23-R001, locator: article_23.part_1.identity, class: AUTHORIZED_BODY_IDENTITY, rule: "The authorized personal-data authority is the federal executive body exercising the statutory personal-data oversight function."}
  - {id: FL152-A23-R002, locator: article_23.part_1.function, class: INDEPENDENT_CONTROL_SUPERVISION_FUNCTION, rule: "The authority independently controls and supervises whether personal-data processing complies with Russian personal-data law."}
  - {id: FL152-A23-R003, locator: article_23.part_2.trigger, class: SUBJECT_APPEAL_REVIEW, rule: "Review a data subject's appeal about processing-purpose compliance."}
  - {id: FL152-A23-R004, locator: article_23.part_2.content, class: CONTENT_PURPOSE_ALIGNMENT_REVIEW, rule: "Assess whether the content of the subject's personal data corresponds to the processing purposes."}
  - {id: FL152-A23-R005, locator: article_23.part_2.methods, class: METHODS_PURPOSE_ALIGNMENT_REVIEW, rule: "Assess whether the processing methods correspond to the processing purposes."}
  - {id: FL152-A23-R006, locator: article_23.part_2.decision, class: SUBJECT_APPEAL_DECISION, rule: "Adopt the corresponding decision after reviewing the subject appeal."}
  - {id: FL152-A23-R007, locator: article_23.part_3.point_1.request, class: INFORMATION_REQUEST_POWER, rule: "Request from natural or legal persons information necessary to exercise the authority's powers."}
  - {id: FL152-A23-R008, locator: article_23.part_3.point_1.receipt, class: FREE_INFORMATION_RECEIPT, rule: "Receive the requested necessary information free of charge."}
  - {id: FL152-A23-R009, locator: article_23.part_3.point_2.branch_1, class: OPERATOR_NOTIFICATION_VERIFICATION, rule: "Verify information contained in an operator's processing notification."}
  - {id: FL152-A23-R010, locator: article_23.part_3.point_2.branch_2, class: OTHER_STATE_BODY_INVOLVEMENT, rule: "Involve other state bodies in notification verification only within their powers."}
  - {id: FL152-A23-R011, locator: article_23.part_3.point_3.branch_1, class: REQUIRE_CLARIFICATION, rule: "Require the operator to clarify inaccurate or unlawfully obtained personal data."}
  - {id: FL152-A23-R012, locator: article_23.part_3.point_3.branch_2, class: REQUIRE_BLOCKING, rule: "Require the operator to block inaccurate or unlawfully obtained personal data."}
  - {id: FL152-A23-R013, locator: article_23.part_3.point_3.branch_3, class: REQUIRE_DESTRUCTION, rule: "Require the operator to destroy inaccurate or unlawfully obtained personal data."}
  - {id: FL152-A23-R014, locator: article_23.part_3.point_3.condition, class: REMEDIATION_DATA_CONDITION, rule: "Use the point 3 remediation power only for inaccurate data or data obtained unlawfully."}
  - {id: FL152-A23-R015, locator: article_23.part_3.point_3_1, class: ACCESS_RESTRICTION_POWER, rule: "Restrict access to information processed in violation of Russian personal-data law under the procedure established by law."}
  - {id: FL152-A23-R016, locator: article_23.part_3.point_4.branch_1, class: SUSPEND_UNLAWFUL_PROCESSING_MEASURES, rule: "Take legally established measures to suspend personal-data processing that violates 152-FZ."}
  - {id: FL152-A23-R017, locator: article_23.part_3.point_4.branch_2, class: TERMINATE_UNLAWFUL_PROCESSING_MEASURES, rule: "Take legally established measures to terminate personal-data processing that violates 152-FZ."}
  - {id: FL152-A23-R018, locator: article_23.part_3.point_5.branch_1, class: COURT_CLAIM_POWER, rule: "Bring court claims to protect personal-data subject rights."}
  - {id: FL152-A23-R019, locator: article_23.part_3.point_5.branch_2, class: INDEFINITE_PERSONS_CLAIM, rule: "The court-claim power includes protection of an indefinite group of persons."}
  - {id: FL152-A23-R020, locator: article_23.part_3.point_5.branch_3, class: COURT_REPRESENTATION, rule: "Represent the interests of personal-data subjects in court."}
  - {id: FL152-A23-R021, locator: article_23.part_3.point_5_1.branch_1, class: ARTICLE22_SECURITY_INFO_TO_FSB, rule: "Send Article 22 part 3 point 7 information to the federal security authority as relevant to its sphere."}
  - {id: FL152-A23-R022, locator: article_23.part_3.point_5_1.branch_2, class: ARTICLE22_SECURITY_INFO_TO_FSTEC, rule: "Send Article 22 part 3 point 7 information to the technical-intelligence-countermeasures and technical-protection authority as relevant to its sphere."}
  - {id: FL152-A23-R023, locator: article_23.part_3.point_6.condition, class: LICENCE_TRANSFER_PROHIBITION_CONDITION, rule: "Use the licensing referral route only when the operator's licence condition prohibits third-party personal-data transfer without the subject's written consent."}
  - {id: FL152-A23-R024, locator: article_23.part_3.point_6.action, class: LICENSING_APPLICATION_POWER, rule: "Send an application to the licensing body for it to consider licence suspension or revocation under the legally established procedure."}
  - {id: FL152-A23-R025, locator: article_23.part_3.point_7.action, class: CRIMINAL_MATERIAL_REFERRAL, rule: "Send materials to prosecution or other law-enforcement bodies for consideration of criminal-case initiation."}
  - {id: FL152-A23-R026, locator: article_23.part_3.point_7.condition, class: CRIME_SIGNS_AND_JURISDICTION, rule: "Use the criminal referral route where there are signs of crimes involving subject-rights violations and route materials according to jurisdiction."}
  - {id: FL152-A23-R027, locator: article_23.part_3.point_8.branch_1, class: RIGHTS_REGULATION_PROPOSALS, rule: "Submit to the Government proposals to improve normative regulation of personal-data subject-rights protection."}
  - {id: FL152-A23-R028, locator: article_23.part_3.point_8.branch_2, class: PROCESSING_REGULATION_PROPOSALS, rule: "Submit to the Government proposals to improve normative regulation of personal-data processing activity."}
  - {id: FL152-A23-R029, locator: article_23.part_3.point_9, class: ADMINISTRATIVE_LIABILITY_POWER, rule: "Hold persons liable administratively for violations of 152-FZ within the applicable legal procedure."}
  - {id: FL152-A23-R030, locator: article_23.part_4, class: AUTHORITY_CONFIDENTIALITY_DUTY, rule: "Ensure confidentiality of personal data learned during the authority's activities."}
  - {id: FL152-A23-R031, locator: article_23.part_5.point_1, class: ORGANIZE_SUBJECT_RIGHTS_PROTECTION, rule: "Organize protection of personal-data subject rights in accordance with 152-FZ and other federal laws."}
  - {id: FL152-A23-R032, locator: article_23.part_5.point_2.branch_1, class: COMPLAINTS_APPEALS_REVIEW, rule: "Review complaints and appeals of citizens or legal persons concerning personal-data processing."}
  - {id: FL152-A23-R033, locator: article_23.part_5.point_2.branch_2, class: COMPLAINT_DECISION_WITHIN_POWERS, rule: "Adopt decisions on those complaints and appeals only within the authority's powers."}
  - {id: FL152-A23-R034, locator: article_23.part_5.point_3, class: OPERATOR_REGISTER_DUTY, rule: "Maintain the operator register."}
  - {id: FL152-A23-R035, locator: article_23.part_5.point_4, class: RIGHTS_PROTECTION_IMPROVEMENT_MEASURES, rule: "Take measures aimed at improving protection of personal-data subject rights."}
  - {id: FL152-A23-R036, locator: article_23.part_5.point_5.trigger, class: SECURITY_BODY_SUBMISSION_TRIGGER, rule: "On a submission from FSB, FSO or FSTEC, use the legally established processing-control route."}
  - {id: FL152-A23-R037, locator: article_23.part_5.point_5.branch_1, class: SUBMISSION_BASED_SUSPENSION, rule: "On a qualifying submission, take legally established measures to suspend personal-data processing."}
  - {id: FL152-A23-R038, locator: article_23.part_5.point_5.branch_2, class: SUBMISSION_BASED_TERMINATION, rule: "On a qualifying submission, take legally established measures to terminate personal-data processing."}
  - {id: FL152-A23-R039, locator: article_23.part_5.point_6.branch_1, class: INFORM_STATE_BODIES, rule: "Inform state bodies about the state of personal-data subject-rights protection."}
  - {id: FL152-A23-R040, locator: article_23.part_5.point_6.branch_2, class: INFORM_SUBJECTS_ON_REQUEST, rule: "Inform personal-data subjects on their appeals or requests about the state of subject-rights protection."}
  - {id: FL152-A23-R041, locator: article_23.part_5.point_7, class: OTHER_STATUTORY_DUTIES, rule: "Perform other duties expressly provided by Russian law."}
  - {id: FL152-A23-R042, locator: article_23.part_5_1.branch_1, class: FOREIGN_AUTHORITY_COOPERATION, rule: "Cooperate with foreign personal-data protection authorities."}
  - {id: FL152-A23-R043, locator: article_23.part_5_1.branch_2, class: INTERNATIONAL_INFORMATION_EXCHANGE, rule: "Conduct international exchange of personal-data rights-protection information."}
  - {id: FL152-A23-R044, locator: article_23.part_5_1.branch_3, class: ADEQUATE_COUNTRIES_LIST, rule: "Approve the list of foreign states providing adequate protection of personal-data subject rights."}
  - {id: FL152-A23-R045, locator: article_23.part_5_2.direct, class: DIRECT_EXERCISE_OF_PARTS3_4, rule: "Exercise the Article 23 parts 3 and 4 rights and duties directly."}
  - {id: FL152-A23-R046, locator: article_23.part_5_2.no_delegation, class: NON_DELEGATION_TO_OTHER_STATE_BODIES, rule: "Do not transfer the parts 3 and 4 rights and duties to other state bodies."}
  - {id: FL152-A23-R047, locator: article_23.part_6, class: JUDICIAL_APPEAL_OF_AUTHORITY_DECISIONS, rule: "Decisions of the authorized personal-data authority may be appealed judicially."}
  - {id: FL152-A23-R048, locator: article_23.part_7.sentence_1, class: ANNUAL_ACTIVITY_REPORT, rule: "Send an annual activity report to the President, the Government and the Federal Assembly."}
  - {id: FL152-A23-R049, locator: article_23.part_7.sentence_2, class: REPORT_MEDIA_PUBLICATION, rule: "Publish the annual report in mass media."}
  - {id: FL152-A23-R050, locator: article_23.part_8, class: FEDERAL_BUDGET_FINANCING, rule: "Finance the authorized authority from the federal budget."}
  - {id: FL152-A23-R051, locator: article_23.part_9.sentence_1, class: PUBLIC_ADVISORY_COUNCIL, rule: "Create a consultative council at the authority on a voluntary public basis."}
  - {id: FL152-A23-R052, locator: article_23.part_9.sentence_2, class: COUNCIL_RULEMAKING, rule: "The authority determines the council's formation and operating procedures."}
  - {id: FL152-A23-R053, locator: article_23.part_10.branch_1, class: INCIDENT_REGISTER, rule: "Maintain a register recording the incidents covered by Article 21 part 3.1."}
  - {id: FL152-A23-R054, locator: article_23.part_10.branch_2, class: INCIDENT_REGISTER_INTERACTION_PROCEDURE, rule: "Define the procedure for interaction with operators in maintaining the incident register."}
  - {id: FL152-A23-R055, locator: article_23.part_10.branch_3, class: INCIDENT_REGISTER_INTERACTION_CONDITIONS, rule: "Define the conditions for interaction with operators in maintaining the incident register."}
  - {id: FL152-A23-R056, locator: article_23.part_11.action, class: INCIDENT_INFORMATION_TO_FSB, rule: "Transfer covered computer-incident information to the federal security authority."}
  - {id: FL152-A23-R057, locator: article_23.part_11.procedure, class: JOINT_INCIDENT_TRANSFER_PROCEDURE, rule: "Use the procedure jointly established by the federal security authority and the authorized personal-data authority."}
  - {id: FL152-A23-R058, locator: article_23.part_11.scope, class: INCIDENT_TRANSFER_SCOPE, rule: "The transfer route covers computer incidents causing unlawful or accidental personal-data transfer, provision, dissemination or access."}
  - {id: FL152-A23-R059, locator: article_23.part_12.branch_1, class: GENERAL_ANONYMIZATION_REQUIREMENTS, rule: "Establish general personal-data anonymization requirements."}
  - {id: FL152-A23-R060, locator: article_23.part_12.branch_2, class: GENERAL_ANONYMIZATION_METHODS, rule: "Establish general personal-data anonymization methods."}
  - {id: FL152-A23-R061, locator: article_23.part_12.exception, class: ARTICLE6_POINT9_1_EXCEPTION, rule: "Exclude Article 6 part 1 point 9.1 cases from the general part 12 anonymization rulemaking route."}

