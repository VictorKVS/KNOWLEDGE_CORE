  - {id: FL152-A23-E002, locator: article_23.part_5.point_2, trigger: CITIZEN_OR_LEGAL_PERSON_COMPLAINT_OR_APPEAL_RECEIVED, due: REVIEW_AND_DECIDE_WITHIN_POWERS, note: "No numeric period is stated in Article 23."}
