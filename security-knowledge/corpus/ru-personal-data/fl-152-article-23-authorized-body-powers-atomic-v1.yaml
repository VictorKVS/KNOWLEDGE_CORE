conflict_and_definition_checks:
  - {id: FL152-A23-C001, type: AUTHORITY_NOT_OPERATOR, resolution: "Article 23 primarily defines regulator status, rights and duties; do not rewrite every regulator power as a new operator obligation."}
  - {id: FL152-A23-C002, type: ARTICLE23_NO_NUMERIC_PERIODS, resolution: "Article 23 states annual recurrence but no numeric complaint, request, referral, decision or report due date."}
  - {id: FL152-A23-C003, type: PART1_1_REPEALED, resolution: "Do not restore or execute the repealed part 1.1 after 1 July 2021."}
  - {id: FL152-A23-C004, type: PART2_SPECIFIC_SUBJECT_APPEAL, resolution: "Part 2 concerns a subject appeal on content/method correspondence to purposes; it is not every possible complaint type."}
  - {id: FL152-A23-C005, type: NECESSARY_INFORMATION_SCOPE, resolution: "Point 1 request power is limited to information necessary to exercise statutory powers."}
  - {id: FL152-A23-C006, type: FREE_RECEIPT_NOT_OPERATOR_SERVICE_FEE, resolution: "The requested necessary information is received free of charge; no regulator fee is invented."}
  - {id: FL152-A23-C007, type: OTHER_STATE_BODY_WITHIN_POWERS, resolution: "A state body involved in notification verification remains limited to its own powers."}
  - {id: FL152-A23-C008, type: REMEDIATION_CONDITION_CLOSED, resolution: "Point 3 expressly concerns inaccurate or unlawfully obtained data; other remediation triggers require their own legal basis."}
  - {id: FL152-A23-C009, type: THREE_REMEDIATION_ACTIONS, resolution: "Clarification, blocking and destruction are distinct possible demands and must not be collapsed."}
  - {id: FL152-A23-C010, type: ACCESS_RESTRICTION_PROCEDURE_DEPENDENCY, resolution: "Article 23 grants the power but delegates the restriction procedure to legislation."}
  - {id: FL152-A23-C011, type: SUSPENSION_TERMINATION_NOT_AUTOMATIC, resolution: "The authority takes measures under an established procedure; a violation finding is not modeled as instant technical shutdown."}
  - {id: FL152-A23-C012, type: COURT_POWER_INCLUDES_INDEFINITE_PERSONS, resolution: "The claim route expressly includes an indefinite group and subject representation."}
  - {id: FL152-A23-C013, type: ARTICLE22_POINT7_ONLY, resolution: "Point 5.1 forwards the Article 22 part 3 point 7 security-measures information, not every operator-register field."}
  - {id: FL152-A23-C014, type: LICENCE_CONDITION_REQUIRED, resolution: "The licensing application route depends on the stated licence prohibition and written-consent condition."}
  - {id: FL152-A23-C015, type: LICENSING_BODY_DECIDES, resolution: "The authority applies for consideration; it does not itself suspend or revoke the licence under point 6."}
  - {id: FL152-A23-C016, type: CRIME_SIGNS_AND_JURISDICTION, resolution: "The regulator refers materials where crime signs exist; the competent law-enforcement body decides case initiation."}
  - {id: FL152-A23-C017, type: ADMINISTRATIVE_POWER_SEPARATE, resolution: "Administrative-liability power is distinct from criminal referral and civil court representation."}
  - {id: FL152-A23-C018, type: AUTHORITY_CONFIDENTIALITY, resolution: "Personal data learned by the regulator remains confidential; regulator possession is not unrestricted publication authority."}
  - {id: FL152-A23-C019, type: COMPLAINT_DECISION_WITHIN_POWERS, resolution: "Complaint decisions cannot exceed the authority's statutory competence."}
  - {id: FL152-A23-C020, type: SECURITY_BODY_SUBMISSION_CLOSED_ACTORS, resolution: "Part 5 point 5 names FSB, FSO and FSTEC; do not add other submitters by analogy."}
  - {id: FL152-A23-C021, type: OTHER_DUTIES_REQUIRE_LEGAL_BASIS, resolution: "Point 7 is not an unlimited self-created power; another duty must be provided by legislation."}
  - {id: FL152-A23-C022, type: FOREIGN_COOPERATION_NOT_CROSS_BORDER_PERMISSION, resolution: "Regulator cooperation and information exchange do not by themselves authorize an operator's cross-border transfer."}
  - {id: FL152-A23-C023, type: PARTS3_4_NON_DELEGABLE, resolution: "The non-delegation rule expressly covers rights and duties in parts 3 and 4, not every administrative support function."}
  - {id: FL152-A23-C024, type: JUDICIAL_APPEAL_NOT_AUTOMATIC_STAY, resolution: "Article 23 permits judicial appeal but does not state an automatic suspension of the challenged decision."}
  - {id: FL152-A23-C025, type: ANNUAL_NOT_FIXED_DATE, resolution: "Annual reporting is required, but Article 23 states no exact day or month."}
  - {id: FL152-A23-C026, type: ADVISORY_COUNCIL_PUBLIC_BASIS, resolution: "The council is created on a voluntary public basis; it is not modeled as a paid regulator or enforcement body."}
  - {id: FL152-A23-C027, type: INCIDENT_REGISTER_ARTICLE21_SCOPE, resolution: "Part 10 records Article 21 part 3.1 incidents and does not replace operator notification content or clocks."}
  - {id: FL152-A23-C028, type: JOINT_INCIDENT_TRANSFER_PROCEDURE, resolution: "Part 11 transfer uses a jointly established procedure; Article 23 does not state its format or numeric period."}
  - {id: FL152-A23-C029, type: ANONYMIZATION_GENERAL_VS_ARTICLE13_1, resolution: "Part 12 excludes Article 6 part 1 point 9.1; the separate Article 13.1 special regime must not be collapsed into RKN Order 140."}
  - {id: FL152-A23-C030, type: PART12_EFFECTIVE_2025_09_01, resolution: "General anonymization rulemaking under part 12 is routed from 1 September 2025; earlier dates require the then-current legal regime."}

