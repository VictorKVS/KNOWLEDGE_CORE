pdn_overlap:
  status: DIRECT_TEXTUAL_AND_OPERATIONAL_OVERLAP
  direct_anchors:
    - "пункт 5: федеральный оператор обеспечивает исполнение законодательства в области персональных данных"
    - "пункт 9: информация системы защищается в соответствии с законодательством в области персональных данных"
    - "пункты 11-12 и приложение: определен подробный состав person-level сведений о несовершеннолетних и законных представителях"
    - "пункты 28-30, 37, 40-54: доступ, идентификация, аутентификация, авторизация, ролевое управление, средства доступа и блокирование"
    - "пункты 25-27: специальные правила хранения, резервного копирования и целостности"
  lawful_basis_statement: "Само ПП № 411 не превращается в универсальное основание любой обработки ПДн поставщика; применимость определяется ролью участника, конкретной записью, полномочием по 120-ФЗ/иным первичным актам и установленным потоком данных."

person_level_examples:
  - "ФИО несовершеннолетнего и прежняя фамилия при рождении"
  - "пол, дата и место рождения, гражданство"
  - "реквизиты паспорта/иного документа и свидетельства о рождении"
  - "адрес места жительства/пребывания/фактического проживания"
  - "СНИЛС"
  - "контактный телефон и e-mail"
  - "номер записи единого федерального регистра сведений о населении"
  - "ФИО и иные предусмотренные Положением сведения о родителях/законных представителях"
  - "сведения профилактического, социального, образовательного и в предусмотренных записях медицинского контекста"

retention_nodes:
  - locator: "пункт 25"
    rule: "не менее 5 лет со дня представления поставщиком для основной массы сведений системы с оговорками Положения и более длительными сроками, если они установлены законодательством"
    guard: "FIVE_YEAR_GIS_RETENTION_NOT_GENERAL_PDN_RETENTION"
  - locator: "пункт 26"
    rule: "ежедневное копирование на резервный материальный носитель; резервная информация хранится не менее 10 лет, если законодательством не установлен более длительный срок"
    guard: "TEN_YEAR_BACKUP_RETENTION_NOT_GENERAL_PDN_OR_ACTIVE_RECORD_RETENTION"

protected_information_boundaries:
  - regime: "врачебная тайна"
    evidence: "пункт 9 прямо включает врачебную тайну в перечень охраняемых режимов"
    classification_guard: "Конкретная запись относится к врачебной тайне только при доказанном медицинском происхождении/содержании и применимом режиме 323-ФЗ; наличие health-context в системе недостаточно."
  - regime: "тайна усыновления"
    evidence: "пункт 9 прямо включает тайну усыновления в перечень охраняемых режимов"
    classification_guard: "Ссылка на режим не означает, что каждая запись ребенка является тайной усыновления; требуется record-level факт усыновления и применимость соответствующей нормы."
  - regime: "государственная, коммерческая и иная охраняемая законом тайна"
    evidence: "пункт 9 содержит общий прямой режимный reference"
    classification_guard: "REFERENCE_NOT_AUTOMATIC_CLASSIFICATION"

