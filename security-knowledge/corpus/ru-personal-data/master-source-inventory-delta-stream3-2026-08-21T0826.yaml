    title: "176-ФЗ «О почтовой связи»"
    sector: communications
    lifecycle_state: PRIMARY_ACT_PROTECTED_LOCATOR_VERIFIED_AGENCY_ARTIFACT_CAPTURED_VERSION_CHAIN_PARTIAL
    protected_information_regime:
      type: POSTAL_COMMUNICATIONS_SECRECY
      locator: "статья 15"
      state: CURRENT_PROTECTED_LOCATOR_IDENTIFIED
    pdn_relation:
      state: CANDIDATE_PENDING_FIELD_AND_SCENARIO_REVIEW
      type: POSSIBLE_PERSONAL_DATA_WITHIN_BROADER_COMMUNICATIONS_SECRECY_OBJECT
      evidence: >-
        Article 15 protects address data and information linked to users' postal items, postal money transfers and other
        communications. Such information can contain personal data in concrete scenarios, but the statutory object
        "тайна связи" is broader and is not automatically equivalent to the 152-ФЗ regime.
      guard: >-
        No operator-wide or processing-wide 152-ФЗ applicability is inferred from the fact that the protected object may
        contain address or user-linked information.
    artifact_capture:
      source_url: "https://17.rosguard.gov.ru/uploads/2026/06/federalnyjj_zakon_ot_17071999_n_176fz_red_ot_10062026.pdf"
