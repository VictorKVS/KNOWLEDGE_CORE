  - "ARTICLE_6_PART_2_CONSENT_TO_DISCLOSE != AUTOMATIC_152_FZ_PROCESSING_CONSENT"
  - "ROUTING_TO_COMPETENT_AUTHORITY_IS_NOT_DISCLOSURE_UNDER_59_FZ != AUTOMATIC_PDN_LEGAL_BASIS"
  - "59-FZ does not collapse medical, banking, insurance, commercial, tax or other protected-information regimes."
  - "DUAL_REGIME requires scenario-level proof."
  - "No applicability promotion from taxonomy, public-sector status or presence of person-level fields alone."

