source:
  source_id: SEC-SRC-RU-FZ-59-2006
  title: "Федеральный закон от 02.05.2006 № 59-ФЗ «О порядке рассмотрения обращений граждан Российской Федерации»"
  sector: citizen_appeals_public_sector
  pdn_source_status: EXTERNAL_PROTECTED_INFORMATION_REGIME_WITH_DIRECT_PERSON_LEVEL_DATASET_OVERLAP

relationship_candidates:
  - relationship_id: PDN-REL-59FZ-152FZ-001
    from: SEC-SRC-RU-FZ-59-2006
    to: RU-152-FZ
    type: DIRECT_PERSON_LEVEL_DATASET_AND_CONFIDENTIALITY_OVERLAP
    status: CANDIDATE_APPLICABILITY_REVIEW_REQUIRED
    rationale: "59-ФЗ требует или предусматривает ФИО, почтовый адрес, e-mail либо уникальный идентификатор личного кабинета, документы/материалы, данные документа, удостоверяющего личность при личном приеме, и содержание обращения. Это создает прямой person-level data context, но применимость конкретных требований 152-ФЗ требует отдельного доказательства субъекта, записи, операции, цели, роли и правового основания."
  - relationship_id: PDN-REL-59FZ-SECRETS-001
    from: SEC-SRC-RU-FZ-59-2006:articles_5_10_11
    to: RU_PROTECTED_INFORMATION_SECTORAL_REGIMES
    type: PARALLEL_SPECIAL_SECRET_REGIMES_PRESERVED
    status: CANDIDATE_RELATION_VERIFIED_TEXT_APPLICABILITY_NOT_PROMOTED
    rationale: "59-ФЗ прямо сохраняет особый порядок для государственной и иной охраняемой федеральным законом тайны. Содержание обращения может одновременно подпадать под врачебную, банковскую, страховую, коммерческую, налоговую или иную специальную тайну; такие режимы не заменяются общим режимом обращений."

scope_guards:
