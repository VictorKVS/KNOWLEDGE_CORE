  primary_locators:
    - "статья 7 части 3 и 6 Федерального закона от 20.07.2020 № 211-ФЗ"
    - "статья 8 часть 7 Федерального закона от 20.07.2020 № 211-ФЗ"
    - "статья 12 Федерального закона от 20.07.2020 № 211-ФЗ"
    - "статья 17 часть 4 Федерального закона от 20.07.2020 № 211-ФЗ"
  current_text_finding: >-
    Закон регулирует передачу и доступ к информации о финансовых сделках, использование регистратором набора идентифицирующих сведений физического лица для доступа к информации, получение оператором платформы сведений из ЕСИА с согласием лица, отраслевые требования по защите информации и операционной надежности, а также конфиденциальность документов и информации, предоставленных оператором Банку России. Это сильное пересечение с PDN, но не единый режим.
  evidence_quality:
    official_initial_publication_id: "0001202007200033"
    official_initial_publication_url: "https://publication.pravo.gov.ru/Document/View/0001202007200033"
    official_current_locator: "https://pravo.gov.ru/proxy/ips/?docbody=&intelsearch=&link_id=0&nd=102792227"
    current_consolidated_revision_crosscheck: "2025-10-27"
    protected_locator_amendments:
      - "45-ФЗ от 11.03.2024; publication locator 0001202403110010; changes article 7, article 8(7), article 12(1) in broader reform"
      - "402-ФЗ от 27.10.2025; official publication 0001202510270029; latest source-level amendment, effective 2025-10-27"
    exact_current_authoritative_binary: PENDING
  applicability_guard: >-
    Не выводить применимость конкретного требования 152-ФЗ только из факта работы через финансовую платформу, хранения сведений о сделке, идентификации или наличия контактных данных. Для каждого требования определить субъект данных, точное поле, операцию, цель, роль оператора финансовой платформы / регистратора финансовых транзакций / финансовой организации / Банка России, основание и согласие при необходимости, а также точный locator 211-ФЗ и применимого нормативного акта Банка России. FINANCIAL_PLATFORM_INFORMATION != PERSONAL_DATA; OVERLAP != APPLICABILITY.

