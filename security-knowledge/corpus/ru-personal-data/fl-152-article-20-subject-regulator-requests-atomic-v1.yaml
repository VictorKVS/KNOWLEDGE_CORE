atomic_rules:
  - {id: FL152-A20-R001, locator: article_20.part_1.sentence_1, class: DATA_PRESENCE_INFORMATION, rule: "Inform the subject or representative, in the Article 14 procedure, whether the operator holds personal data relating to that subject."}
  - {id: FL152-A20-R002, locator: article_20.part_1.sentence_1, class: ACCESS_ON_APPEAL, rule: "Provide an opportunity to inspect the subject's personal data when the subject or representative appeals to the operator."}
  - {id: FL152-A20-R003, locator: article_20.part_1.sentence_1, class: ACCESS_ON_REQUEST, rule: "For a subject or representative request, provide the information and inspection opportunity within ten working days from receipt."}
  - {id: FL152-A20-R004, locator: article_20.part_1.sentence_2, class: SUBJECT_RESPONSE_EXTENSION, rule: "Extend the part 1 request period by no more than five working days only after sending the subject a reasoned notice stating the reasons for extension."}
  - {id: FL152-A20-R005, locator: article_20.part_2.sentence_1, class: REFUSAL_FORM_AND_REASONING, rule: "When refusing information or access, give the subject or representative a written reasoned response."}
  - {id: FL152-A20-R006, locator: article_20.part_2.sentence_1, class: REFUSAL_LEGAL_LOCATOR, rule: "The refusal response must cite Article 14 part 8 or another federal-law provision constituting the refusal basis."}
  - {id: FL152-A20-R007, locator: article_20.part_2.sentence_1, class: REFUSAL_DEADLINE, rule: "Give the written reasoned refusal within no more than ten working days from the appeal or request receipt, as applicable."}
  - {id: FL152-A20-R008, locator: article_20.part_2.sentence_2, class: REFUSAL_EXTENSION, rule: "Extend the refusal-response period by no more than five working days only after a reasoned notice to the subject stating the extension reasons."}
  - {id: FL152-A20-R009, locator: article_20.part_3.sentence_1, class: FREE_INSPECTION, rule: "Provide the subject or representative the opportunity to inspect the subject's personal data free of charge."}
  - {id: FL152-A20-R010, locator: article_20.part_3.sentence_2, class: CORRECTION, rule: "Within no more than seven working days from provision of evidence that data are incomplete, inaccurate or outdated, make the necessary changes."}
  - {id: FL152-A20-R011, locator: article_20.part_3.sentence_3, class: DESTRUCTION, rule: "Within no more than seven working days from provision of evidence that data were unlawfully obtained or are unnecessary for the declared purpose, destroy those data."}
  - {id: FL152-A20-R012, locator: article_20.part_3.sentence_4, class: SUBJECT_RESULT_NOTICE, rule: "Notify the subject or representative of the changes made and measures taken."}
  - {id: FL152-A20-R013, locator: article_20.part_3.sentence_4, class: THIRD_PARTY_RESULT_NOTICE, rule: "Take reasonable measures to notify third parties to whom the subject's personal data were transferred."}
  - {id: FL152-A20-R014, locator: article_20.part_4.sentence_1, class: REGULATOR_RESPONSE, rule: "Provide the regulator the necessary information within ten working days from receipt of its request."}
  - {id: FL152-A20-R015, locator: article_20.part_4.sentence_2, class: REGULATOR_RESPONSE_EXTENSION, rule: "Extend the regulator-response period by no more than five working days only after sending the regulator a reasoned notice stating the extension reasons."}

