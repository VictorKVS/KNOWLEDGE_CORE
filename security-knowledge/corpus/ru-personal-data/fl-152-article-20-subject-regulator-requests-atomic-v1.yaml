id: RU-FL152-ARTICLE20-SUBJECT-REGULATOR-REQUESTS-ATOMIC-V1
title: Federal Law No. 152-FZ Article 20 subject and regulator request duties
scope: >-
  Current Article 20 duties for subject/representative appeals and requests, reasoned
  refusal, correction, destruction, notifications and regulator requests. Article 14
  content and access restrictions are dependencies and are not silently re-created here.

