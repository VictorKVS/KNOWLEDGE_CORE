conflict_and_definition_checks:
  - {id: FL152-A20-C001, type: APPEAL_VS_REQUEST, resolution: "Part 1 links the direct appeal route to action at appeal and assigns the ten-working-day clock to request receipt; do not invent one universal clock origin."}
  - {id: FL152-A20-C002, type: THREE_DISTINCT_10_PLUS_5_ROUTES, resolution: "Subject information/access, subject refusal and regulator response have separate 10+5 working-day clocks and separate evidence."}
  - {id: FL152-A20-C003, type: EXTENSION_PRECONDITION, resolution: "Each extension requires a reasoned notice stating reasons; workload alone is not automatically a valid recorded notice."}
  - {id: FL152-A20-C004, type: REFUSAL_SOURCE_BOUNDARY, resolution: "Article 20 does not create free-form refusal grounds; the response must cite Article 14 part 8 or another federal-law provision that is the basis."}
  - {id: FL152-A20-C005, type: CORRECTION_VS_DESTRUCTION, resolution: "Incomplete, inaccurate or outdated data trigger correction; unlawfully obtained or purpose-unnecessary data trigger destruction."}
  - {id: FL152-A20-C006, type: SEVEN_DAY_ORIGINS, resolution: "Both seven-working-day clocks start from provision of supporting information, not from the operator's later internal confirmation."}
  - {id: FL152-A20-C007, type: FREE_ACCESS, resolution: "The inspection opportunity is free of charge; Article 20 does not authorize a processing fee."}
  - {id: FL152-A20-C008, type: THIRD_PARTY_NOTICE_STANDARD, resolution: "The source requires reasonable measures, not proof that every third party actually acknowledged the notice."}
  - {id: FL152-A20-C009, type: RESULT_NOTICE_CLOCK, resolution: "Part 3 gives no separate numeric period for result notices; none is invented."}
  - {id: FL152-A20-C010, type: ARTICLE14_DEPENDENCY, resolution: "Article 14 governs request content, response form, information fields, repeat requests and access restrictions; this Article 20 model does not claim complete Article 14 coverage."}

