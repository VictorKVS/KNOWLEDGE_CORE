id: RU-RKN-ORDER-140-2025-ANONYMIZATION-ATOMIC-V1
title: Clause-level requirements and methods under Roskomnadzor Order No. 140 of 19 June 2025
scope: >-
  Anonymization of personal data except the cases specified in Federal Law No. 152-FZ,
  article 6 part 1 clause 9.1. Applicability outside this boundary must not be inferred.

