applicability:
  trigger: RECEIPT_OF_MINDIGITAL_REQUIREMENT_UNDER_152FZ_ART13_1_PART2_OR_AUTHORIZED_MOSCOW_BODY
  fail_closed_rule: >-
    Do not apply this decree merely because personal data are anonymized or because
    Roskomnadzor Order No. 140 also became effective on 2025-09-01.

requirements:
  - id: PP1154-REQ-2A
    locator: requirements.clause_2.subclause_a
    obligation: >-
      Apply the approved rules and methods while taking the individualized Ministry of
      Digital Development requirement into account.
    evidence_examples: [received_requirement, method_selection_record]
  - id: PP1154-REQ-2B
    locator: requirements.clause_2.subclause_b
    obligation: Store personal data separately from the personal data produced by anonymization.
    evidence_examples: [storage_separation_architecture, access_matrix]
  - id: PP1154-REQ-2C
    locator: requirements.clause_2.subclause_c
    obligation: Apply personal-data security measures required by Federal Law No. 152-FZ to the anonymized data.
    evidence_examples: [security_control_mapping, control_operation_records]
  - id: PP1154-REQ-2D
    locator: requirements.clause_2.subclause_d
    obligation: Exclude information whose access is restricted by federal law from the data to be provided.
    evidence_examples: [restricted_information_filter, exclusion_test]
  - id: PP1154-REQ-2E
    locator: requirements.clause_2.subclause_e
    obligation: >-
      Ensure that the selected algorithms and software permit delivery to the Ministry's
      information system without loss or alteration of the anonymized data.
    evidence_examples: [delivery_integrity_test, transformation_reconciliation]
  - id: PP1154-REQ-2F
    locator: requirements.clause_2.subclause_f
    obligation: >-
      Support modification, supplementation, maintenance of relevance and repeated
      anonymization while preventing restoration of identifiable source data and preserving
      integrity and conformity with the individualized requirement.
    evidence_examples: [update_procedure, reanonymization_test, non_restoration_test]

method_catalog:
  methods:
    - id: IDENTIFIER_INTRODUCTION
      locator: methods.clause_2.subclause_a
      semantics: Replace part of the data with identifiers and maintain a correspondence table.
    - id: COMPOSITION_OR_SEMANTICS_CHANGE
      locator: methods.clause_2.subclause_b
      semantics: Replace data with statistical results or delete data elements.
    - id: DECOMPOSITION
      locator: methods.clause_2.subclause_c
      semantics: Divide the array into parts and store those parts separately.
    - id: SHUFFLING
      locator: methods.clause_2.subclause_d
      semantics: Permute individual records or groups of records within the array.
    - id: TRANSFORMATION
      locator: methods.clause_2.subclause_e
      semantics: >-
        Aggregate or generalize data elements, including setting a number of distinct values,
        while preserving the distribution of the original values.

workflow_rules:
  - id: PP1154-RULE-1
    locator: rules.clause_1
    rule: Apply these rules only to the article 13.1 part 2 demand route or the named Moscow route.
  - id: PP1154-RULE-2
    locator: rules.clause_2
    actor: Ministry_of_Digital_Development
    rule: Prepare the individualized requirement, including its purpose, on the basis of research materials.
  - id: PP1154-RULE-3
    locator: rules.clause_3
    actor: Ministry_of_Digital_Development
    rule: >-
      Research materials must substantiate methods and parameters, element contents and formats,
      sampling criteria considering threat types under Government Decree No. 961, and a quantitative
      re-identification assessment under Ministry recommendations coordinated with the FSB.
  - id: PP1154-RULE-4
    locator: rules.clause_4
    actor: Ministry_of_Digital_Development
    rule: >-
      Send research materials to the FSB and, for the listed financial entities, the Bank of Russia
      before the draft requirement is sent for approval.
    deadline_ref: PRE_APPROVAL_RESEARCH_LEAD_TIME
  - id: PP1154-RULE-5
    locator: rules.clause_5
    actors: [FSB, Roskomnadzor, Bank_of_Russia_when_applicable]
    rule: Agree the individualized requirement within the stated coordination period after receipt.
    deadline_ref: REGULATOR_AGREEMENT_CLOCK
  - id: PP1154-RULE-6
    locator: rules.clause_6
    actor: Operator_or_authorized_Moscow_body
    rule: >-
      Apply the methods, parameters and data-provision deadline stated in the individualized
      requirement, prepared with the relevant recommendations and Decree No. 961 threat types.
    deadline_ref: OPERATOR_DELIVERY_CLOCK
  - id: PP1154-RULE-7
    locator: rules.clause_7
    actor: Operator_or_authorized_Moscow_body
    condition: METHODS_A_THROUGH_D
    rule: >-
      Use free Ministry software or other software implementing methods (a)-(d), only after
      conformity with Ministry requirements coordinated with the FSB has been confirmed.
  - id: PP1154-RULE-8
    locator: rules.clause_8
    actor: Operator_or_authorized_Moscow_body
    condition: METHODS_A_THROUGH_D
    rule: Provide the resulting anonymized data to the Ministry information system under article 13.1.
  - id: PP1154-RULE-9
    locator: rules.clause_9
    actor: Operator_or_authorized_Moscow_body
    condition: METHOD_E_TRANSFORMATION
    routes:
      - id: OWN_SOFTWARE_OR_HARDWARE
        obligations:
          - Make the anonymized data available for automated provision through the unified data-access service or SMEV under Decree No. 966.
          - Send the method parameters to the Ministry of Digital Development.
      - id: FREE_MINDIGITAL_SOFTWARE
        obligations:
          - Use the free software referenced in clause 7.
          - Provide the anonymized data to the Ministry information system.

