non_requirements:
  - No general applicability exists absent the article 13.1 part 2 demand trigger or the named Moscow route.
  - The 30-calendar-day clock is not an operator delivery deadline.
  - The 15-calendar-day clock is not an operator delivery deadline.
  - The operator deadline comes from the individualized Ministry requirement, not a universal value in Decree No. 1154.
  - Roskomnadzor Order No. 140 requirements must not be imported into this regime solely because the effective date is the same.
  - The method-(e) delivery routes differ from the methods-(a)-(d) route.
  - No fixed retention period is stated by this decree.

