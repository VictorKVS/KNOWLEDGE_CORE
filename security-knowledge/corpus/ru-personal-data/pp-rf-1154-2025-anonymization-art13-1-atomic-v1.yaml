schema_version: "1.0"
id: RU-PP-1154-2025-ANONYMIZATION-ART13-1-ATOMIC-V1
title: Clause-level requirements, methods and rules under Government Decree No. 1154 of 1 August 2025
scope: >-
  Anonymization performed after an operator receives a Ministry of Digital Development
  requirement under Federal Law No. 152-FZ article 13.1 part 2, including the separately
  named authorized Moscow executive body. The model must fail closed outside this trigger.

