atomic_rules:
  - {id: RKN179-R001, locator: order.preamble, class: SCOPE, rule: "Use these requirements to confirm destruction performed under part 7 of article 21 of Federal Law No. 152-FZ."}
  - {id: RKN179-R002, locator: requirements.clause_1, class: NON_AUTOMATED_EVIDENCE_ROUTE, rule: "For processing without automation, use a personal-data destruction act as the confirming document."}
  - {id: RKN179-R003, locator: requirements.clause_2, class: AUTOMATED_EVIDENCE_ROUTE, rule: "For processing using automation, use both a destruction act compliant with clauses 3 and 4 and an extract from the event log of the personal-data information system."}
  - {id: RKN179-R004, locator: requirements.clause_3.a, class: ACT_FIELD, rule: "Record the operator legal entity name, or operator individual's surname, name and patronymic if any, and address."}
  - {id: RKN179-R005, locator: requirements.clause_3.b, class: ACT_FIELD_CONDITIONAL, rule: "Where processing was entrusted, record each processor's legal entity name or individual's surname, name and patronymic if any, and address."}
  - {id: RKN179-R006, locator: requirements.clause_3.v, class: ACT_FIELD, rule: "Record each subject's surname, name and patronymic if any, or other information relating to the identified individual whose personal data were destroyed."}
  - {id: RKN179-R007, locator: requirements.clause_3.g, class: ACT_FIELD, rule: "Record the surname, name and patronymic if any, position and signature of each person who destroyed the personal data."}
  - {id: RKN179-R008, locator: requirements.clause_3.d, class: ACT_FIELD, rule: "Record the list of categories of destroyed personal data."}
  - {id: RKN179-R009, locator: requirements.clause_3.e, class: ACT_FIELD_CONDITIONAL, rule: "For processing without automation, identify each destroyed physical medium and the number of sheets for each medium."}
  - {id: RKN179-R010, locator: requirements.clause_3.zh, class: ACT_FIELD_CONDITIONAL, rule: "For processing using automation, identify each personal-data information system from which the personal data were destroyed."}
  - {id: RKN179-R011, locator: requirements.clause_3.z, class: ACT_FIELD, rule: "Record the method of personal-data destruction."}
  - {id: RKN179-R012, locator: requirements.clause_3.i, class: ACT_FIELD, rule: "Record the reason for personal-data destruction."}
  - {id: RKN179-R013, locator: requirements.clause_3.k, class: ACT_FIELD, rule: "Record the date of personal-data destruction."}
  - {id: RKN179-R014, locator: requirements.clause_4, class: ELECTRONIC_ACT, rule: "Treat an electronic act signed in accordance with Russian legislation on electronic signatures as equivalent to the paper act signed by the persons named under clause 3(g)."}
  - {id: RKN179-R015, locator: requirements.clause_5.a, class: LOG_EXTRACT_FIELD, rule: "Record each subject's surname, name and patronymic if any, or other information relating to the identified individual whose personal data were destroyed."}
  - {id: RKN179-R016, locator: requirements.clause_5.b, class: LOG_EXTRACT_FIELD, rule: "Record the list of categories of destroyed personal data."}
  - {id: RKN179-R017, locator: requirements.clause_5.v, class: LOG_EXTRACT_FIELD, rule: "Record the personal-data information system from which the personal data were destroyed."}
  - {id: RKN179-R018, locator: requirements.clause_5.g, class: LOG_EXTRACT_FIELD, rule: "Record the reason for personal-data destruction."}
  - {id: RKN179-R019, locator: requirements.clause_5.d, class: LOG_EXTRACT_FIELD, rule: "Record the date of personal-data destruction."}
  - {id: RKN179-R020, locator: requirements.clause_6, class: LOG_FIELD_FALLBACK, rule: "If the log extract cannot contain an item required by clause 5, place that missing item in the destruction act."}
  - {id: RKN179-R021, locator: requirements.clause_7, class: MIXED_EVIDENCE_ROUTE, rule: "For simultaneous automated and non-automated processing, use both a compliant destruction act and a compliant log extract."}
  - {id: RKN179-R022, locator: requirements.clause_8, class: RETENTION, rule: "Retain the destruction act and log extract for three years from the personal-data destruction date."}

