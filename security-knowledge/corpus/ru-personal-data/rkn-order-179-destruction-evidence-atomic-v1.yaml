schema_version: "1.0"
id: RU-RKN179-DESTRUCTION-EVIDENCE-ATOMIC-V1
title: Roskomnadzor Order No. 179 personal-data destruction confirmation requirements
scope: >-
  Requirements approved by Roskomnadzor Order No. 179 of 28 October 2022 for
  confirming destruction of personal data under part 7 of article 21 of Federal
  Law No. 152-FZ. The model covers evidence form and content, processing-mode
  branches, missing log fields and evidence retention; it does not invent a new
  destruction trigger, deadline or destruction technology.

