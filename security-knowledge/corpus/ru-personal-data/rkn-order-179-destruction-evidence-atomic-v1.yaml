conflict_and_definition_checks:
  - id: RKN179-C001
    type: CONFIRMATION_NOT_DESTRUCTION_DUTY
    resolution: >-
      The order specifies proof after destruction under article 21 part 7. It does not
      create a new destruction trigger or replace the article 21 deadlines and exceptions.
  - id: RKN179-C002
    type: MODE_SPECIFIC_DOCUMENT_SET
    resolution: >-
      An act alone is sufficient only for the non-automated route. Automated and mixed
      routes require both the act and the event-log extract.
  - id: RKN179-C003
    type: LOG_GAP_IS_RELOCATED_NOT_WAIVED
    resolution: >-
      A field the log cannot contain is moved to the act under clause 6; it is not omitted
      from the evidence package and the inability must not be generalized to every field.
  - id: RKN179-C004
    type: CONDITIONAL_ACT_FIELDS
    resolution: >-
      Processor identity applies when processing was entrusted; physical-medium details
      apply to non-automated processing; ISPDN names apply to automated processing.
  - id: RKN179-C005
    type: EVIDENCE_RETENTION_NOT_DATA_RETENTION
    resolution: >-
      The three-year clock applies to the destruction act and log extract from the
      destruction date. It does not authorize retaining the destroyed personal data.
  - id: RKN179-C006
    type: METHOD_RECORDED_NOT_PRESCRIBED
    resolution: >-
      The act records the destruction method. The order does not prescribe shredding,
      wiping, cryptographic erasure or another universal destruction technology.
  - id: RKN179-C007
    type: TEMPORAL_SCOPE
    resolution: >-
      The requirements apply from 1 March 2023 and only through 28 February 2029;
      post-sunset use requires a successor or extension check.

red_team_boundaries:
  - "Do not accept an act alone for an automated or mixed route."
  - "Do not accept a log extract alone for any route."
  - "Do not waive a mandatory log field merely because the information system cannot export it; relocate it to the act."
  - "Do not require processor identity when processing was not entrusted or omit it when it was."
  - "Do not confuse the three-year evidence-retention period with a right to retain destroyed personal data."
  - "Do not invent a destruction deadline or technique from this order."
  - "Do not reuse the order on or after 1 March 2029 without a current-status check."

