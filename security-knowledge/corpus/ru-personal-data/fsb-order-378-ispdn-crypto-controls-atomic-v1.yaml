schema_version: "1.0"
id: RU-FSB378-ISPDN-CRYPTO-CONTROLS-ATOMIC-V1
title: FSB Order No. 378 ISPDN cryptographic protection applicability, measures and class routing
scope: >-
  Original and current public text of FSB Order No. 378 of 10 July 2014. The model applies
  only to operators using cryptographic information-protection means (SKZI) to secure
  personal data in an ISPDN. It covers clauses 1-26, cumulative organizational measures
  for protection levels 4-1, attacker-capability profiles KS1/KS2/KS3/KV/KA, the exact
  protection-level/threat-type class routes, and the half-year and monthly control floors.
  The decision to use cryptography, PP 1119 level calculation, product-certificate status,
  key lifetimes and licensed external cryptographic work remain separate decisions.

