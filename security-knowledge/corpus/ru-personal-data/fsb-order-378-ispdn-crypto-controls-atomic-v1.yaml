conflict_and_definition_checks:
  - {id: FSB378-C001, type: SKZI_USE_TRIGGER, resolution: "The order applies to operators using SKZI; do not infer universal cryptography from the existence of an ISPDN."}
  - {id: FSB378-C002, type: PP1119_FIRST, resolution: "PP 1119 determines the protection level and relevant threat type; Order 378 maps those results after the SKZI-use trigger."}
  - {id: FSB378-C003, type: ORIGINAL_CURRENT_EDITION, resolution: "The current public card lists the original 10 July 2014 edition; no amendment is invented."}
  - {id: FSB378-C004, type: CUMULATIVE_ORGANIZATIONAL_LAYERS, resolution: "Higher protection levels inherit lower-level organizational measures, while class clauses expressly replace prior class routes."}
  - {id: FSB378-C005, type: INVALID_LEVEL_THREAT_COMBINATIONS, resolution: "Do not invent class mappings for four level/type combinations that cannot result from PP 1119."}
  - {id: FSB378-C006, type: THRESHOLD_NOT_EXACT_PRODUCT_CLASS, resolution: "KS1 or higher and KV or higher are minimum thresholds, not requirements to use exactly the named class."}
  - {id: FSB378-C007, type: KS2_KS3_NOT_DIRECT_MATRIX_ROWS, resolution: "KS2 and KS3 capability profiles exist and can exceed KS1, but the level/type matrix does not name them as separate minimum rows."}
  - {id: FSB378-C008, type: ENCRYPTED_MEDIA_EXCEPTION_NARROW, resolution: "Storage outside a safe applies only when the removable medium contains only SKZI-encrypted personal data; itemized accounting still applies."}
  - {id: FSB378-C009, type: CONFORMITY_CONDITIONAL, resolution: "Clause 5(d) keeps the current-threat necessity condition; do not claim unconditional certification of every component."}
  - {id: FSB378-C010, type: OPERATION_DOCS_ADDITIVE, resolution: "SKZI documentation and other applicable NPA add to, rather than replace, Order 378."}
  - {id: FSB378-C011, type: CLASS_SELECTION_NEEDS_APPROVAL, resolution: "Class selection requires source data and operator-head-approved attacker capability assumptions, not only a protection-level number."}
  - {id: FSB378-C012, type: CLASS_NOT_THREAT_TYPE, resolution: "Do not reverse-infer the PP 1119 threat type only from a desired or deployed SKZI class."}
  - {id: FSB378-C013, type: SIX_MONTH_MAXIMUM_INTERVAL, resolution: "At least once every six months is a maximum interval between clause 20 functionality checks."}
  - {id: FSB378-C014, type: MONTHLY_MAXIMUM_INTERVAL, resolution: "At least once a month is a maximum interval between clause 23(c) reviews."}
  - {id: FSB378-C015, type: NO_LOG_RETENTION_PERIOD, resolution: "The order defines journal content, access and check intervals but no universal journal-retention period."}
  - {id: FSB378-C016, type: NO_KEY_LIFETIME, resolution: "The order does not state a universal cryptographic-key lifetime or replacement interval."}
  - {id: FSB378-C017, type: TWO_JOURNALS, resolution: "The level-2 electronic message journal and level-1 security journal have distinct content and controls."}
  - {id: FSB378-C018, type: RESPONSIBLE_PERSON_AND_UNIT_DISTINCT, resolution: "The skilled responsible person at level 3 and the security-unit function at level 1 are separate requirements."}
  - {id: FSB378-C019, type: CRYPTO_LICENSE_SEPARATE, resolution: "Use of SKZI does not by itself prove an operator needs a PP 313 cryptographic-activity licence; classify actual regulated work or service."}
  - {id: FSB378-C020, type: PRODUCT_STATUS_SEPARATE, resolution: "A class threshold does not prove that a particular product version currently has the required FSB certificate/list status."}
  - {id: FSB378-C021, type: ATTACK_PROFILE_NOT_EVENT, resolution: "Capability assumptions support design and class selection; they do not prove an attack occurred."}
  - {id: FSB378-C022, type: UNLISTED_CAPABILITY_RULE, resolution: "Clause 15 prevents unlisted capabilities from changing this order's class procedure; it does not authorize ignoring them in the broader threat model."}
  - {id: FSB378-C023, type: PHYSICAL_MEASURES_LEVEL_ROUTE, resolution: "Clause 25 strengthens level-1 room protection and does not erase the clause 6 baseline."}
  - {id: FSB378-C024, type: ARTICLE19_AND_ORDER21_BOUNDARY, resolution: "Article 19, PP 1119, FSTEC Order 21 and FSB Order 378 are linked but remain separately evidenced normative layers."}

