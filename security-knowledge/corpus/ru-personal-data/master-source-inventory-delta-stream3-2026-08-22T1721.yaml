    guard: >-
      Не выводить применимость 152-ФЗ только из наличия налоговой тайны. Для конкретного ребра требуется установить
      субъект данных, тип налогоплательщика, состав сведений, операцию, цель, правовое основание, роль органа/получателя
      и специальный режим доступа/передачи.
