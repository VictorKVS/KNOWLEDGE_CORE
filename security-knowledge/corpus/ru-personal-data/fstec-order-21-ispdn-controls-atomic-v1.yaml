conflict_and_definition_checks:
  - {id: FSTEC21-C001, type: LEVEL_SOURCE, resolution: "PP 1119 determines the protection level; Order 21 maps and selects measures after that result."}
  - {id: FSTEC21-C002, type: PLUS_NOT_FINAL_SET, resolution: "The plus table is only the base set; adaptation, threat-based refinement and other-NPA supplementation still follow."}
  - {id: FSTEC21-C003, type: NO_PLUS_NOT_PROHIBITED, resolution: "A blank appendix cell does not prohibit use of the control."}
  - {id: FSTEC21-C004, type: EXCLUSION_NOT_CONVENIENCE, resolution: "Adaptation exclusion needs absent technology or absent structural-functional characteristic; preference alone is insufficient."}
  - {id: FSTEC21-C005, type: ECONOMIC_FEASIBILITY_COMPENSATION, resolution: "Economic feasibility can support a compensating route but does not permit an uncovered current threat."}
  - {id: FSTEC21-C006, type: COMPENSATION_NEEDS_JUSTIFICATION, resolution: "Compensating measures require documented design justification."}
  - {id: FSTEC21-C007, type: TYPE1_TYPE2_MAY, resolution: "Clause 11 says the three measures may be additionally applied; do not convert may to shall."}
  - {id: FSTEC21-C008, type: CERTIFIED_TOOL_CONDITIONAL, resolution: "The class/trust table is conditional on use of certified tools; Order 21 does not state that every security component must always be certified."}
  - {id: FSTEC21-C009, type: CERTIFICATE_NOT_FUNCTIONAL_FIT, resolution: "Certification does not replace proof that tool functions implement selected measures."}
  - {id: FSTEC21-C010, type: CURRENT_EDITION_TRUST_LEVELS, resolution: "Use the post-1-January-2021 trust-level wording introduced by Order 68, not the superseded clause 12 text."}
  - {id: FSTEC21-C011, type: GIS_ROUTE, resolution: "A state ISPDN is routed to FSTEC GIS requirements; Order 21 is not used as a standalone substitute for that layer."}
  - {id: FSTEC21-C012, type: CRYPTO_SEPARATE, resolution: "FSB cryptographic requirements remain separate and are not inferred from Order 21."}
  - {id: FSTEC21-C013, type: STATE_SECRET_SEPARATE, resolution: "State-secret personal data is outside this order's scope."}
  - {id: FSTEC21-C014, type: CONTRACTOR_LICENSE_CONDITION, resolution: "The licence rule applies to the contracted party performing the regulated work; it is not a universal licence obligation for every operator employee."}
  - {id: FSTEC21-C015, type: THREE_YEARS_MAX_INTERVAL, resolution: "At least once every three years is a maximum interval, not a mandatory exactly-three-year cadence."}
  - {id: FSTEC21-C016, type: INCIDENT_CLOCK_SEPARATE, resolution: "The INC family contains operational incident controls but does not replace Article 21's 24/72-hour regulator-notification route."}
  - {id: FSTEC21-C017, type: LOG_RETENTION_NOT_FIXED, resolution: "RSB.1 requires the operator to define retention; Order 21 states no universal numeric log-retention period."}
  - {id: FSTEC21-C018, type: BACKUP_INTERVAL_NOT_FIXED, resolution: "ODT.4 requires periodic backup but Order 21 states no universal numeric backup frequency."}
  - {id: FSTEC21-C019, type: RECOVERY_INTERVAL_NOT_FIXED, resolution: "ODT.5 requires recovery within an established interval but Order 21 does not prescribe one universal numeric value."}
  - {id: FSTEC21-C020, type: ORDER58_SUPERSEDED, resolution: "Do not route current ISPDN controls through repealed Order 58."}

