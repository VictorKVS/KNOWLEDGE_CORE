schema_version: "1.0"
id: RU-FSTEC21-ISPDN-CONTROLS-ATOMIC-V1
title: FSTEC Order No. 21 current ISPDN measure-selection and control-catalog model
scope: >-
  Current public text of FSTEC Order No. 21 of 18 February 2013 as amended by Orders
  No. 49 of 23 March 2017 and No. 68 of 14 May 2020. The model covers scope, actors,
  the four-stage measure-selection pipeline, compensating measures, certified-tool
  conditionals, the three-year effectiveness-assessment floor, fifteen measure families
  and all 109 appendix control identifiers with their base protection-level inclusion.
  Cryptographic measures, state-secret data, PP 1119 level determination, FSB Order 378,
  immutable current consolidated bytes and expert implementation profiles remain separate.

