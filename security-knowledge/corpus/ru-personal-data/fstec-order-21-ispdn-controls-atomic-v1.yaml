numeric_deadlines:
  - id: FSTEC21-D001
    locator: clause_6
    action: ASSESS_EFFECTIVENESS_OF_IMPLEMENTED_MEASURES
    maximum_interval: 3
    unit: YEARS
    clock: BETWEEN_EFFECTIVENESS_ASSESSMENTS
    actor: OPERATOR
    contractor_route: LICENSED_TZKI_LEGAL_ENTITY_OR_INDIVIDUAL_ENTREPRENEUR

atomic_rules:
  - {id: FSTEC21-R001, locator: clause_1.scope, class: ISPDN_LEVEL_MEASURE_SCOPE, rule: "Apply the order to organizational and technical personal-data security measures for each PP 1119 protection level in an ISPDN."}
  - {id: FSTEC21-R002, locator: clause_1.objective, class: PROTECTED_EVENTS, rule: "Protect personal data against unlawful or accidental access, destruction, modification, blocking, copying, provision, dissemination and other unlawful actions."}
  - {id: FSTEC21-R003, locator: clause_1.exclusion_1, class: STATE_SECRET_EXCLUSION, rule: "Do not use this order as the measure set for personal data classified as state secrets."}
  - {id: FSTEC21-R004, locator: clause_1.exclusion_2, class: CRYPTOGRAPHY_EXCLUSION, rule: "Do not use this order as the source of cryptographic-protection measures; route that question separately."}
  - {id: FSTEC21-R005, locator: clause_2.actor, class: OPERATOR_OR_PROCESSOR_SECURITY, rule: "ISPDN personal-data security is ensured by the operator or a person processing on the operator's instructions under Russian law."}
  - {id: FSTEC21-R006, locator: clause_2.contractor, class: LICENSED_TZKI_CONTRACTOR, rule: "A contracted legal entity or individual entrepreneur performing ISPDN security work must hold the relevant technical-protection-of-confidential-information licence."}
  - {id: FSTEC21-R007, locator: clause_3, class: PROTECTION_SYSTEM_AND_CURRENT_THREATS, rule: "Implement measures within the PP 1119 personal-data protection system and direct them at neutralizing current threats."}
  - {id: FSTEC21-R008, locator: clause_4, class: CONFORMITY_ASSESSED_TOOLS_WHEN_NECESSARY, rule: "Use conformity-assessed security tools when such tools are necessary to neutralize current threats."}
  - {id: FSTEC21-R009, locator: clause_6.actor, class: EFFECTIVENESS_ASSESSMENT_ACTOR, rule: "The operator assesses effectiveness itself or contracts an appropriately licensed legal entity or individual entrepreneur."}
  - {id: FSTEC21-R010, locator: clause_6.frequency, class: THREE_YEAR_FLOOR, rule: "Assess effectiveness at least once every three years."}
  - {id: FSTEC21-R011, locator: clause_7, class: GIS_SPECIAL_ROUTE, rule: "For personal data processed in a state information system, route security measures through the FSTEC requirements for state information systems."}
  - {id: FSTEC21-R012, locator: clause_8, class: FIFTEEN_MEASURE_FAMILIES, rule: "Use the fifteen enumerated measure families with current threats and technologies taken into account."}
  - {id: FSTEC21-R013, locator: clause_9.step_1, class: BASE_SET_BY_LEVEL, rule: "Start with the appendix base set for the PP 1119 protection level already established for the ISPDN."}
  - {id: FSTEC21-R014, locator: clause_9.step_2, class: ADAPT_BASE_SET, rule: "Adapt the base set to structural and functional characteristics, technologies and operating features."}
  - {id: FSTEC21-R015, locator: clause_9.step_2.exclusion, class: EXCLUDE_ONLY_INAPPLICABLE_TECH_OR_CHARACTERISTIC, rule: "An appendix base measure may be excluded during adaptation when it directly depends on technology not used or a structural-functional characteristic absent from the ISPDN."}
  - {id: FSTEC21-R016, locator: clause_9.step_3, class: REFINE_FOR_ALL_CURRENT_THREATS, rule: "Refine the adapted set with previously unselected appendix measures so that all current threats for the specific ISPDN are neutralized."}
  - {id: FSTEC21-R017, locator: clause_9.step_4, class: SUPPLEMENT_OTHER_NPA, rule: "Supplement the refined set with measures required by other applicable information-security and personal-data-security normative acts."}
  - {id: FSTEC21-R018, locator: clause_10.trigger, class: COMPENSATING_MEASURE_TRIGGER, rule: "During adaptation or refinement, compensating measures may be designed when a selected measure cannot be technically implemented or when economic feasibility is taken into account."}
  - {id: FSTEC21-R019, locator: clause_10.objective, class: COMPENSATING_MEASURE_OBJECTIVE, rule: "A compensating measure must neutralize current personal-data security threats."}
  - {id: FSTEC21-R020, locator: clause_10.justification, class: COMPENSATING_MEASURE_JUSTIFICATION, rule: "Document justification for compensating measures while designing the personal-data protection system."}
  - {id: FSTEC21-R021, locator: clause_11.condition, class: TYPE1_TYPE2_OPTIONAL_ADDITIONS, rule: "For PP 1119 threat types 1 or 2, the three clause 11 measures may be additionally applied; the word may is not converted into an unconditional obligation."}
  - {id: FSTEC21-R022, locator: clause_11.branch_1, class: UNDECLARED_CAPABILITY_REVIEW, rule: "One optional clause 11 route is system or application software and code review for undeclared capabilities."}
  - {id: FSTEC21-R023, locator: clause_11.branch_2, class: PENETRATION_TESTING, rule: "One optional clause 11 route is penetration testing of the information system."}
  - {id: FSTEC21-R024, locator: clause_11.branch_3, class: SECURE_DEVELOPMENT_SOFTWARE, rule: "One optional clause 11 route is use of system or application software developed using secure-programming methods."}
  - {id: FSTEC21-R025, locator: clause_12.technical, class: SECURITY_TOOL_FUNCTIONS, rule: "Implement technical measures through software or software-hardware security tools having the necessary security functions."}
  - {id: FSTEC21-R026, locator: clause_12.certification_condition, class: CERTIFIED_TOOL_CONDITIONAL, rule: "Apply the clause 12 class and trust thresholds when security tools certified to information-security requirements are used; do not rewrite this conditional as universal certification of every tool."}
  - {id: FSTEC21-R027, locator: clause_12.level_1, class: LEVEL1_CERTIFIED_THRESHOLDS, rule: "For protection level 1, certified security tools are at least class 4 and trust level 4, and computing equipment at least class 5."}
  - {id: FSTEC21-R028, locator: clause_12.level_2, class: LEVEL2_CERTIFIED_THRESHOLDS, rule: "For protection level 2, certified security tools are at least class 5 and trust level 5, and computing equipment at least class 5."}
  - {id: FSTEC21-R029, locator: clause_12.level_3, class: LEVEL3_CERTIFIED_THRESHOLDS, rule: "For protection level 3, certified security tools are class 6 and trust level 6, and computing equipment at least class 5."}
  - {id: FSTEC21-R030, locator: clause_12.level_4, class: LEVEL4_CERTIFIED_THRESHOLDS, rule: "For protection level 4, certified security tools are class 6 and trust level 6, and computing equipment at least class 6."}
  - {id: FSTEC21-R031, locator: clause_12.class_source, class: SECURITY_CLASS_EXTERNAL_SOURCE, rule: "Determine protection classes under the separate FSTEC normative acts issued under its statutory authority."}
  - {id: FSTEC21-R032, locator: clause_12.trust_source, class: TRUST_LEVEL_ORDER131, rule: "Determine trust levels under FSTEC Order No. 131."}
  - {id: FSTEC21-R033, locator: clause_12.certificate_scope, class: CERTIFICATE_REQUIREMENT_SCOPE, rule: "A certified tool must be certified against applicable mandatory security requirements or requirements in its technical conditions or security target."}
  - {id: FSTEC21-R034, locator: clause_12.function_fit, class: FUNCTIONAL_FIT, rule: "Security-tool functions must implement the measures selected under this order."}
  - {id: FSTEC21-R035, locator: clause_13, class: NEW_TECH_NEW_THREAT_COMPENSATION, rule: "For new technologies and additional threats lacking defined measures, develop compensating measures under clause 10."}
  - {id: FSTEC21-R036, locator: appendix.note_1, class: PLUS_MEANS_BASE_SET, rule: "A plus sign includes the measure in the base set for the corresponding protection level."}
  - {id: FSTEC21-R037, locator: appendix.note_2, class: NO_PLUS_NOT_PROHIBITED, rule: "Absence of a plus does not prohibit the measure; it may enter during adaptation/refinement or compensating-measure design."}
  - {id: FSTEC21-R038, locator: order.clause_2, class: ORDER58_REPEALED, rule: "Order No. 21 repealed FSTEC Order No. 58 of 5 February 2010; do not use Order No. 58 as the current ISPDN measure source."}

selection_pipeline:
  - {order: 1, step: DETERMINE_BASE_SET, input: PP1119_PROTECTION_LEVEL, output: APPENDIX_PLUS_MEASURES}
  - {order: 2, step: ADAPT, input: [STRUCTURAL_FUNCTIONAL_CHARACTERISTICS, TECHNOLOGIES, OPERATING_FEATURES], output: ADAPTED_SET}
  - {order: 3, step: REFINE, input: [CURRENT_THREATS, UNSELECTED_APPENDIX_MEASURES], output: ALL_CURRENT_THREATS_NEUTRALIZED_SET}
  - {order: 4, step: SUPPLEMENT, input: OTHER_APPLICABLE_NPA, output: FINAL_REQUIRED_SET}

