atomic_facts:
  - fact_id: RU_152FZ_A22_P1_F001
    source_id: RU_FZ_152_2006_CURRENT
    locator: "Article 22, part 1"
    source_quote: "Оператор до начала обработки персональных данных обязан уведомить уполномоченный орган"
    statement: "Before beginning personal-data processing, an operator must notify the competent authority of its intention to process personal data, unless an exception in Article 22 part 2 applies."
    verification_status: VERIFIED
    requirement_type: statutory_duty
    decision_materiality: D3
    actor: personal_data_operator
    trigger: "intention to begin personal-data processing"
    action: "notify the competent authority for protection of personal-data subjects' rights"
    deadline: "before processing begins"
    applicability:
      applies_when:
        - "the entity is a personal-data operator"
        - "the operator intends to begin processing personal data"
        - "no exception in Article 22 part 2 applies"
      excluded_when:
        - "an exception expressly listed in Article 22 part 2 applies"
      unresolved_detail: "Part 2 exceptions require separate atomization before a production decision can assert that notification is not required."
    evidence_expectation:
      - "copy or electronic record of the submitted notification"
      - "submission timestamp/date demonstrating submission before processing began"
      - "operator decision record identifying whether any Article 22 part 2 exception was considered"
    form_mapping:
      source_id: RU_RKN_ORDER_180_2022
      form: annex_1_notification_of_intention_to_process_personal_data
      relation: IMPLEMENTS_FORM_FOR_REQUIREMENT
red_team_notes:
  - "Do not treat registration in the operator register as the trigger; the statutory trigger is before processing begins."
  - "Do not infer that every operator must notify without first checking Article 22 part 2."
  - "Do not infer an exact calendar-day count for the initial notification; Article 22 part 1 states the boundary as before processing begins."
  - "Order 180 supplies the form but does not create this duty or its trigger."
