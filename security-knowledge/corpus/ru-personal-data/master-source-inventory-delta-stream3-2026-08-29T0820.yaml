scope_boundaries:
  - "Согласие не требуется только для перечисленных в пункте 4 целей; это не отменяет прочие требования 152-ФЗ."
  - "3-дневные сроки подтверждения subscriber data и 60-дневный срок обновления сведений — отраслевые workflow deadlines, не incident/data-subject deadlines 152-ФЗ."
  - "Трехлетний retention относится к фиксируемым действиям после идентификации, а не ко всем ПДн абонента."
  - "Использование ЕБС является нормативным способом идентификации в определенном сценарии, но не универсальной обязанностью собирать биометрию."
