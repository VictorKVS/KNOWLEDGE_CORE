conflict_and_definition_checks:
  - id: FL152-A15-C001
    type: MARKETING_LIMB_QUALIFIERS
    resolution: >-
      Promotion of goods, works or services enters this limb only where direct contacts
      with a potential consumer use means of communication; other marketing may remain
      regulated elsewhere.
  - id: FL152-A15-C002
    type: POLITICAL_AGITATION_INDEPENDENT_LIMB
    resolution: >-
      Do not require the marketing limb's direct-contact or communications qualifiers to
      establish the separately stated political-agitation route.
  - id: FL152-A15-C003
    type: PRIOR_NOT_RETROSPECTIVE
    resolution: "Consent obtained after processing starts does not satisfy the word prior."
  - id: FL152-A15-C004
    type: OPERATOR_BURDEN
    resolution: >-
      The subject does not bear the burden of disproving consent; inability of the
      operator to prove prior consent triggers the statutory no-consent presumption.
  - id: FL152-A15-C005
    type: CONSENT_FORM_NOT_INVENTED
    resolution: >-
      Article 15 does not itself state a universal written-form requirement; consent form
      and validity are resolved through Article 9 and any applicable special law.
  - id: FL152-A15-C006
    type: CONTRACT_NOT_SUBSTITUTE
    resolution: >-
      A customer relationship or contract is not encoded as a substitute for the express
      Article 15 prior-consent condition.
  - id: FL152-A15-C007
    type: IMMEDIATE_IS_EVENT_NOT_NUMBER
    resolution: >-
      Immediately is protected as an event deadline at demand receipt; no zero-day,
      twenty-four-hour or other numeric period is invented.
  - id: FL152-A15-C008
    type: CESSATION_NOT_DESTRUCTION
    resolution: >-
      Part 2 requires cessation of specified processing; it does not itself state a data-
      destruction deadline.
  - id: FL152-A15-C009
    type: SCOPED_CESSATION
    resolution: >-
      The demand stops part 1 processing and does not automatically invalidate unrelated
      processing with a separately established purpose and legal basis.
  - id: FL152-A15-C010
    type: ADVERTISING_AND_ELECTION_LAW_SEPARATION
    resolution: >-
      Article 15 compliance does not replace independent advertising, communications,
      election or referendum requirements and prohibitions.

