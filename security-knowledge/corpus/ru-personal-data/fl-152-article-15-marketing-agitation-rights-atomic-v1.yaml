schema_version: "1.0"
id: RU-FL152-ARTICLE15-MARKETING-AGITATION-RIGHTS-ATOMIC-V1
title: Federal Law No. 152-FZ Article 15 direct-marketing and political-agitation subject rights
scope: >-
  Current Article 15 prior-consent, operator-proof and immediate-cessation duties for
  personal-data processing used for direct market promotion through communications and
  for political agitation. Advertising, election and general consent regimes remain
  separate dependencies and are not silently absorbed into this model.

