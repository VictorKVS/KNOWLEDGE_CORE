atomic_rules:
  - id: FL152-A15-R001
    locator: article_15.part_1.marketing_limb
    class: DIRECT_MARKETING_SCOPE
    rule: >-
      Apply the Article 15 marketing limb when personal data are processed to promote
      goods, works or services through direct contacts with a potential consumer using
      means of communication.
  - id: FL152-A15-R002
    locator: article_15.part_1.marketing_limb
    class: MARKETING_PRIOR_CONSENT
    rule: >-
      Permit processing in the direct-marketing route only after prior consent of the
      personal-data subject has been obtained.
  - id: FL152-A15-R003
    locator: article_15.part_1.agitation_limb
    class: POLITICAL_AGITATION_SCOPE
    rule: >-
      Treat processing for political agitation as an independent Article 15 route; the
      direct-contact-by-communications qualifiers belong to the marketing limb.
  - id: FL152-A15-R004
    locator: article_15.part_1.agitation_limb
    class: AGITATION_PRIOR_CONSENT
    rule: >-
      Permit processing for political agitation only after prior consent of the subject
      has been obtained.
  - id: FL152-A15-R005
    locator: article_15.part_1.sentence_2
    class: OPERATOR_PROOF_BURDEN
    rule: >-
      Require the operator to prove that prior consent was obtained; absent that proof,
      treat the processing as performed without prior consent.
  - id: FL152-A15-R006
    locator: article_15.part_2
    class: IMMEDIATE_CESSATION_ON_DEMAND
    rule: >-
      Immediately cease the Article 15 part 1 processing when the subject demands
      cessation.
  - id: FL152-A15-R007
    locator: article_15.part_2.scope
    class: CESSATION_SCOPE
    rule: >-
      Scope the immediate cessation duty to processing specified in part 1; do not infer
      automatic cessation or destruction of unrelated processing supported by another
      lawful purpose and basis.

