id: RU-PP687-NON-AUTOMATED-PROCESSING-ATOMIC-V1
title: Government Decree No. 687 non-automated personal-data processing requirements
scope: >-
  Current 18 January 2025 edition of Government Decree No. 687 of 15 September 2008,
  including the regulation's mode boundary, carrier and form rules, correction and
  destruction routes, storage controls, access lists and the 1 September 2030 sunset.

