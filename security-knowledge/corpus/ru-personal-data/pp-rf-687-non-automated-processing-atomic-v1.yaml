red_team_boundaries:
  - "The decree governs the processing mode; it does not itself create a legal basis for processing under Federal Law No. 152-FZ."
  - "Presence in or extraction from an information system does not alone make the processing automated."
  - "Clause 7(b) does not require written consent in every case; it controls the form only where written consent is otherwise required."
  - "No universal retention, correction, destruction, access-review or incident-response duration is stated."
  - "Clause 15 leaves the concrete storage measures to the operator; no universal cabinet, lock or room specification is invented."
  - "The validity end is 1 September 2030; post-sunset applicability requires a then-current successor or extension check."

