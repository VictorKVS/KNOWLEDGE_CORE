atomic_rules:
  - {id: PP687-R001, locator: regulation.clause_1, class: MODE_BOUNDARY, rule: "Treat processing as non-automated when use, correction, dissemination or destruction for each subject is performed with direct human participation."}
  - {id: PP687-R002, locator: regulation.clause_2, class: MODE_BOUNDARY, rule: "Do not classify processing as automated solely because the personal data are stored in, or extracted from, a personal-data information system."}
  - {id: PP687-R003, locator: regulation.clause_3, class: GOVERNANCE, rule: "Apply federal, regional and local non-automated processing rules subject to this regulation."}
  - {id: PP687-R004, locator: regulation.clause_4, class: SEPARATION, rule: "Separate non-automated personal data from other information, including through separate carriers, sections or form fields."}
  - {id: PP687-R005, locator: regulation.clause_5.sentence_1, class: PURPOSE_SEPARATION, rule: "Do not place personal data processed for knowingly incompatible purposes on one carrier."}
  - {id: PP687-R006, locator: regulation.clause_5.sentence_2, class: CATEGORY_SEPARATION, rule: "Use a separate carrier for each category of personal data processed non-automatically."}
  - {id: PP687-R007, locator: regulation.clause_6, class: PERSONNEL_AWARENESS, rule: "Inform employees and contracted processors about the fact and categories of processing and the applicable non-automated processing rules."}
  - id: PP687-R008
    locator: regulation.clause_7.a
    class: TEMPLATE_CONTENT
    rule: >-
      A standard form or related instruction, card, register or journal must identify the
      purpose, operator name and address, subject identity and address, source, processing
      period, actions and a general description of processing methods.
  - {id: PP687-R009, locator: regulation.clause_7.b, class: TEMPLATE_CONSENT, rule: "Provide a subject consent-mark field only where written consent is otherwise required."}
  - {id: PP687-R010, locator: regulation.clause_7.c, class: SUBJECT_ACCESS, rule: "Design the form so a subject can review their own data without infringing other subjects' rights."}
  - {id: PP687-R011, locator: regulation.clause_7.d, class: PURPOSE_SEPARATION, rule: "Do not combine form fields intended for personal data processed for knowingly incompatible purposes."}
  - id: PP687-R012
    locator: regulation.clause_8.a
    class: VISITOR_LOG_GOVERNANCE
    rule: >-
      A visitor or analogous one-time access log must be required by an operator act that
      records purpose, fixation method and fields, access and responsible persons, processing
      period, and the pass route without confirming authenticity of subject-provided data.
  - {id: PP687-R013, locator: regulation.clause_8.b, class: VISITOR_LOG_COPYING, rule: "Do not copy information contained in the covered visitor log, register or book."}
  - {id: PP687-R014, locator: regulation.clause_8.c, class: VISITOR_LOG_FREQUENCY, rule: "Record a subject no more than once for each instance of access to the operator's territory."}
  - {id: PP687-R015, locator: regulation.clause_9.a, class: SELECTIVE_USE_OR_DISCLOSURE, rule: "Where only selected data on a shared carrier are used or disclosed, make a copy that excludes data not subject to that action and use or disclose only the copy."}
  - {id: PP687-R016, locator: regulation.clause_9.b, class: SELECTIVE_BLOCK_OR_DESTRUCTION, rule: "Where only part of a shared carrier must be blocked or destroyed, first copy the data that must remain without copying the affected data, then block or destroy the carrier."}
  - {id: PP687-R017, locator: regulation.clause_10, class: PARTIAL_DESTRUCTION_OR_ANONYMIZATION, rule: "If the carrier permits it, destroy or anonymize selected data by a method preventing further processing while preserving the remaining data."}
  - {id: PP687-R018, locator: regulation.clause_11, class: MIXED_INFORMATION_SEPARATION, rule: "Apply the clause 9 and 10 separation routes when personal data share a carrier with non-personal information."}
  - {id: PP687-R019, locator: regulation.clause_12, class: CORRECTION, rule: "Correct data by updating the carrier, recording the change on it, or creating a new corrected carrier when the carrier's technical properties prevent direct update."}
  - {id: PP687-R020, locator: regulation.clause_13.part_1, class: STORAGE_MAPPING, rule: "For each personal-data category, identify the storage locations of the relevant carriers."}
  - {id: PP687-R021, locator: regulation.clause_13.part_2, class: ACCESS_MAPPING, rule: "For each category, establish the persons who process or can access the personal data."}
  - {id: PP687-R022, locator: regulation.clause_14, class: PURPOSE_STORAGE_SEPARATION, rule: "Store separately carriers containing personal data processed for different purposes."}
  - {id: PP687-R023, locator: regulation.clause_15.sentence_1, class: CARRIER_SECURITY, rule: "Maintain carrier storage conditions that preserve the data and prevent unauthorized access."}
  - {id: PP687-R024, locator: regulation.clause_15.sentence_2, class: SECURITY_GOVERNANCE, rule: "The operator establishes the necessary measures, their adoption procedure and the persons responsible for implementation."}

