schema_version: "1.0"
id: RU-FL152-ARTICLE14-SUBJECT-ACCESS-RIGHTS-ATOMIC-V1
title: Federal Law No. 152-FZ Article 14 subject access rights and request controls
scope: >-
  Current Article 14 access rights, request identity and form, response contents,
  repeat-request controls and federal-law access restrictions. Article 20 execution and
  remediation deadlines remain linked but are not duplicated beyond Article 14's own clocks.

source:
  authority: Federal Legislature of the Russian Federation
  law_number: "152-FZ"
  current_edition_checked: "2026-07-26"
  current_text: https://www.consultant.ru/document/cons_doc_LAW_61801/34585db685164ddd73440bf08348903bff6715aa/
  reform_law:
    number: "266-FZ"
