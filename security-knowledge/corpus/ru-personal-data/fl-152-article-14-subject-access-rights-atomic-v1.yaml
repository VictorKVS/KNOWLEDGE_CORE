conflict_and_definition_checks:
  - {id: FL152-A14-C001, type: ACCESS_RIGHT_NOT_ABSOLUTE, resolution: "The part 1 right is subject to part 8 and other federal-law limitations; limitations require legal routing rather than a generic secrecy label."}
  - {id: FL152-A14-C002, type: PART8_NON_EXHAUSTIVE, resolution: "The phrase including means the five listed cases are not an exhaustive universe of federal-law limitations."}
  - {id: FL152-A14-C003, type: LOCAL_POLICY_NOT_LIMITATION_SOURCE, resolution: "An operator policy or contract alone is not a part 8 access-limitation source unless federal law supplies the basis."}
  - {id: FL152-A14-C004, type: OTHER_SUBJECT_DATA, resolution: "Responses exclude other subjects' data unless lawful disclosure grounds exist; a blanket unredacted export is not compliant."}
  - {id: FL152-A14-C005, type: REQUEST_ALTERNATIVE_PROOF, resolution: "Relationship evidence is illustrative; the request may instead contain information otherwise proving the operator's processing."}
  - {id: FL152-A14-C006, type: ELECTRONIC_REQUEST_SIGNATURE, resolution: "Electronic form is permitted with an electronic signature compliant with Russian law; ordinary unsigned email is not automatically a conforming electronic request."}
  - {id: FL152-A14-C007, type: RESPONSE_FORM_DEFAULT, resolution: "The default response form follows the appeal/request form, but the requester may specify another form."}
  - {id: FL152-A14-C008, type: THIRTY_DAYS_NOT_WORKING_DAYS, resolution: "Part 4 states thirty days, not thirty working days."}
  - {id: FL152-A14-C009, type: EARLY_REPEAT_EXCEPTION, resolution: "An incomplete first disclosure permits an early repeat request only with part 3 information plus justification."}
  - {id: FL152-A14-C010, type: REFUSAL_BURDEN, resolution: "The operator bears proof of repeat-request refusal justification; the subject need not disprove it."}
  - {id: FL152-A14-C011, type: PART7_FIELD_9_CONDITIONAL, resolution: "Processor identity/address is included when processing is or will be commissioned; absence of a processor does not invent one."}
  - {id: FL152-A14-C012, type: ARTICLE14_VS_ARTICLE20, resolution: "Article 14 defines access content and request controls; Article 20 supplies linked execution, refusal, correction, destruction and regulator-response duties."}

