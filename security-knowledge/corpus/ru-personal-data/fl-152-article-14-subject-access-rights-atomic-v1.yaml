atomic_rules:
  - {id: FL152-A14-R001, locator: article_14.part_1.sentence_1, class: ACCESS_INFORMATION_RIGHT, rule: "Provide the subject the Article 14 part 7 processing information unless access is limited under part 8 or another applicable federal law."}
  - {id: FL152-A14-R002, locator: article_14.part_1.sentence_2, class: REMEDIATION_DEMAND_RIGHT, rule: "Recognize the subject's right to demand clarification, blocking or destruction where data are incomplete, outdated, inaccurate, unlawfully obtained or unnecessary for the declared processing purpose."}
  - {id: FL152-A14-R003, locator: article_14.part_2, class: ACCESSIBLE_FORM, rule: "Provide part 7 information in a form accessible to the subject."}
  - {id: FL152-A14-R004, locator: article_14.part_2, class: OTHER_SUBJECT_DATA_EXCLUSION, rule: "Do not include personal data relating to other subjects in the response."}
  - {id: FL152-A14-R005, locator: article_14.part_2.exception, class: OTHER_SUBJECT_DISCLOSURE_EXCEPTION, rule: "Other-subject data may be included only where lawful grounds for that disclosure exist."}
  - {id: FL152-A14-R006, locator: article_14.part_3.sentence_1, class: RESPONSE_DEADLINE, rule: "Provide part 7 information to the subject or representative within ten working days from appeal or request receipt."}
  - {id: FL152-A14-R007, locator: article_14.part_3.sentence_2, class: RESPONSE_EXTENSION, rule: "Extend the response period by no more than five working days only after a reasoned notice to the subject stating the extension reasons."}
  - {id: FL152-A14-R008, locator: article_14.part_3.sentence_3, class: REQUEST_ID_DOCUMENT_NUMBER, rule: "Require the request to contain the number of the principal identity document of the subject or representative."}
  - {id: FL152-A14-R009, locator: article_14.part_3.sentence_3, class: REQUEST_ID_DOCUMENT_ISSUANCE, rule: "Require the identity-document issue date and issuing authority."}
  - {id: FL152-A14-R010, locator: article_14.part_3.sentence_3, class: REQUEST_RELATIONSHIP_OR_PROCESSING_PROOF, rule: "Require information proving the subject's relationship with the operator or otherwise proving that the operator processes the subject's data."}
  - {id: FL152-A14-R011, locator: article_14.part_3.sentence_3, class: REQUEST_SIGNATURE, rule: "Require the subject's or representative's signature."}
  - {id: FL152-A14-R012, locator: article_14.part_3.sentence_4, class: ELECTRONIC_REQUEST, rule: "Accept a request as an electronic document when signed with an electronic signature in accordance with Russian law."}
  - {id: FL152-A14-R013, locator: article_14.part_3.sentence_5, class: RESPONSE_FORM, rule: "Respond in the form used for the appeal or request unless that appeal or request specifies another form."}
  - {id: FL152-A14-R014, locator: article_14.part_4, class: REPEAT_REQUEST_FLOOR, rule: "After complete disclosure, permit the next repeat appeal/request no earlier than thirty days after the initial appeal/request."}
  - {id: FL152-A14-R015, locator: article_14.part_4.exception, class: REPEAT_REQUEST_SHORTER_PERIOD, rule: "Apply a shorter repeat-request period where set by federal law, an implementing normative act or a qualifying contract involving the subject."}
  - {id: FL152-A14-R016, locator: article_14.part_5.sentence_1, class: EARLY_REPEAT_REQUEST, rule: "Permit a repeat appeal/request before thirty days when the first response did not disclose the information or processed data in full."}
  - {id: FL152-A14-R017, locator: article_14.part_5.sentence_2, class: EARLY_REPEAT_JUSTIFICATION, rule: "Require an early repeat request to contain both the part 3 request information and justification for the repeat request."}
  - {id: FL152-A14-R018, locator: article_14.part_6.sentence_1, class: NONCONFORMING_REPEAT_REFUSAL, rule: "The operator may refuse a repeat request that does not meet parts 4 and 5."}
  - {id: FL152-A14-R019, locator: article_14.part_6.sentence_2, class: REPEAT_REFUSAL_REASONING, rule: "A repeat-request refusal must be reasoned."}
  - {id: FL152-A14-R020, locator: article_14.part_6.sentence_3, class: REFUSAL_BURDEN_OF_PROOF, rule: "The operator bears the burden of proving that refusal of a repeat request is justified."}
  - {id: FL152-A14-R021, locator: article_14.part_7.item_1, class: RESPONSE_FIELD, field: PROCESSING_CONFIRMATION, rule: "Include confirmation of the operator's processing."}
  - {id: FL152-A14-R022, locator: article_14.part_7.item_2, class: RESPONSE_FIELD, field: LEGAL_BASES_AND_PURPOSES, rule: "Include the legal bases and purposes of processing."}
  - {id: FL152-A14-R023, locator: article_14.part_7.item_3, class: RESPONSE_FIELD, field: PURPOSES_AND_METHODS, rule: "Include processing purposes and methods used by the operator."}
  - {id: FL152-A14-R024, locator: article_14.part_7.item_4, class: RESPONSE_FIELD, field: OPERATOR_AND_ACCESS_RECIPIENTS, rule: "Include operator name/location and non-employee persons with access or potential contract/statutory disclosure."}
  - {id: FL152-A14-R025, locator: article_14.part_7.item_5, class: RESPONSE_FIELD, field: SUBJECT_DATA_AND_SOURCE, rule: "Include the processed data relating to the subject and their source unless federal law provides another presentation procedure."}
  - {id: FL152-A14-R026, locator: article_14.part_7.item_6, class: RESPONSE_FIELD, field: PROCESSING_AND_STORAGE_PERIODS, rule: "Include processing periods, including storage periods."}
  - {id: FL152-A14-R027, locator: article_14.part_7.item_7, class: RESPONSE_FIELD, field: RIGHTS_EXERCISE_PROCEDURE, rule: "Include the procedure for exercising rights under 152-FZ."}
  - {id: FL152-A14-R028, locator: article_14.part_7.item_8, class: RESPONSE_FIELD, field: CROSS_BORDER_TRANSFER, rule: "Include information on completed or intended cross-border transfer."}
  - {id: FL152-A14-R029, locator: article_14.part_7.item_9, class: RESPONSE_FIELD, field: PROCESSOR_IDENTITY_AND_ADDRESS, rule: "If processing is or will be commissioned, include the processor's name or full name and address."}
  - {id: FL152-A14-R030, locator: article_14.part_7.item_9_1, class: RESPONSE_FIELD, field: ARTICLE18_1_COMPLIANCE_METHODS, rule: "Include information on how the operator performs Article 18.1 duties."}
  - {id: FL152-A14-R031, locator: article_14.part_7.item_10, class: RESPONSE_FIELD, field: OTHER_STATUTORY_INFORMATION, rule: "Include other information required by 152-FZ or other federal laws."}
  - {id: FL152-A14-R032, locator: article_14.part_8.chapeau, class: FEDERAL_LAW_ACCESS_LIMITATION, rule: "Limit access only in accordance with federal laws; the listed part 8 cases are non-exhaustive examples."}
  - {id: FL152-A14-R033, locator: article_14.part_8.item_1, class: ACCESS_LIMITATION, field: DEFENCE_SECURITY_LAW_ENFORCEMENT, rule: "Route a federal-law limitation where processing serves national defence, state security or law-enforcement purposes, including the specified operational, counterintelligence and intelligence data."}
  - {id: FL152-A14-R034, locator: article_14.part_8.item_2, class: ACCESS_LIMITATION, field: CRIMINAL_PROCEEDINGS, rule: "Route the specified detention, accusation or pre-charge preventive-measure limitation, preserving criminal-procedure exceptions allowing inspection."}
  - {id: FL152-A14-R035, locator: article_14.part_8.item_3, class: ACCESS_LIMITATION, field: AML_CFT, rule: "Route a limitation where processing occurs under AML/CFT legislation."}
  - {id: FL152-A14-R036, locator: article_14.part_8.item_4, class: ACCESS_LIMITATION, field: THIRD_PARTY_RIGHTS, rule: "Limit access where it would violate third parties' rights and legitimate interests."}
  - {id: FL152-A14-R037, locator: article_14.part_8.item_5, class: ACCESS_LIMITATION, field: TRANSPORT_SECURITY, rule: "Route the specified transport-security limitation for resilient and safe transport functioning and protection against unlawful interference."}

