  primary_locator: "статья 8 Федерального закона от 16.04.2001 № 44-ФЗ «О государственном банке данных о детях, оставшихся без попечения родителей»"
  current_text_finding: >-
    Часть 1 статьи 8 относит анкеты детей и перечисленных категорий граждан к конфиденциальной информации и отсылает порядок доступа к статье 11. Часть 2 допускает специальное создание и распространение производной информации о детях, запрещает ее коммерческое использование и требует исключить идентификацию ребенка, его родителей и других родственников. В перечне допустимой производной информации прямо присутствуют сведения о состоянии здоровья и фотографии.
  evidence_quality:
    official_current_locator: "https://pravo.gov.ru/proxy/ips/?docbody=&nd=102038925"
    current_consolidated_revision: "2023-08-04"
    provisions_effective_through: "2026-01-01"
    article8_amendments:
      - "319-ФЗ от 02.08.2019; official publication 0001201908030001; effective 2020-01-01"
      - "488-ФЗ от 04.08.2023; official publication 0001202308040091; Article 8 part 2 change effective 2024-07-01"
    exact_current_authoritative_binary: PENDING
  applicability_guard: >-
    Не выводить применимость 152-ФЗ только из факта нахождения сведений в государственном банке данных либо наличия здоровья/фотографии. Для конкретного требования определить идентифицируемого субъекта, точное поле, наличие специальной категории, операцию обработки, цель, роль органа опеки/регионального или федерального оператора/получателя, правовое основание и точные statutory gates статей 8 и 11. CHILD_DATABANK_CONFIDENTIALITY != PERSONAL_DATA; OVERLAP != APPLICABILITY.

