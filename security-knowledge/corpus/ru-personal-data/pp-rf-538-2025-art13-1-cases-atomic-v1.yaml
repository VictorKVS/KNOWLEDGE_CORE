  effective_from:
    date: "2025-09-01"
    basis: DECREE_CLAUSE_2_EXPLICIT
  legal_basis: FEDERAL_LAW_152_FZ_ARTICLE_13_1

verification_boundary:
  identity_publication_date_and_page_count: VERIFIED_PRIMARY
  clause_text: CROSS_CHECKED_AUTHORITATIVE_AND_CURRENT_FULL_TEXT_RENDERINGS
  immutable_official_pdf_bytes: PENDING
  status_search_as_of: "2026-08-19"
  amendment_or_repeal_located: false
  status_caution: >-
    The official portal establishes identity, publication date and page count. The
    seven operative cases were cross-checked across current full-text renderings. A
    bounded search found no amendment or repeal, which is not proof of absence.

applicability:
  actor: Ministry_of_Digital_Development
  action: FORM_GROUPED_ANONYMIZED_PERSONAL_DATA_DATASET
  required_conditions:
    - ONE_ENUMERATED_CASE_IS_PROVED
    - SUBSEQUENT_PROCESSING_CANNOT_IDENTIFY_A_SPECIFIC_DATA_SUBJECT
    - CASE_SPECIFIC_PURPOSE_AND_DECISION_BASIS_ARE_PROVED
  fail_closed_rule: >-
    Reject formation outside the seven cases or without the case-specific purpose,
    need and decision basis. Route any operator requirement and transmission through
    article 13.1 and the implementing interaction acts; this decree alone supplies
    neither a universal operator duty nor a transmission deadline.

common_dataset_fields:
  subject_population: MOBILE_RADIOTELEPHONE_SUBSCRIBERS
  fields:
    - ANONYMIZED_SUBSCRIBER_IDENTIFIER
    - YEAR_OF_BIRTH_WITH_SELECTABLE_TIME_INTERVAL
    - SEX
    - CITIZENSHIP
    - SUBSCRIBER_LOCATION
    - LOCATION_CHANGE_WITH_SPECIFIED_PERIODICITY
    - LOCATION_IN_METRO_WHERE_APPLICABLE
    - COUNTRY_OF_INTERNATIONAL_ROAMING_SUBSCRIBER_IN_RUSSIA
  boundary: >-
    The listed attributes are tied to the described case and need; they are not an
    open-ended permission to enrich the dataset with unrelated attributes.

