schema_version: "1.0"
id: RU-PP-538-2025-ART13-1-CASES-ATOMIC-V1
title: Case taxonomy for forming anonymized personal-data datasets under Government Decree No. 538 of 24 April 2025
scope: >-
  The seven cases in which the Ministry of Digital Development may form grouped
  anonymized personal-data datasets under Federal Law No. 152-FZ article 13.1.
  This is a closed case taxonomy, not a standalone power to request arbitrary data.

