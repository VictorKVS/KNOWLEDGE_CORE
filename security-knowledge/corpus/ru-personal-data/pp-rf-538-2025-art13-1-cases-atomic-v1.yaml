    frequency_group_under_pp966: A_THROUGH_G
    trigger: THREAT_OR_OCCURRENCE_OF_NATURAL_OR_TECHNOGENIC_EMERGENCY_IN_A_DEFINED_AREA
    purpose: ORGANIZE_POPULATION_PROTECTION_AND_PUBLIC_ORDER_DURING_CONSEQUENCE_RESPONSE
    need: DETERMINE_SUBSCRIBER_COUNT_AND_DEMOGRAPHIC_OR_OTHER_CHARACTERISTICS_IN_THE_AREA
    decision_basis:
      any_of:
        - INSTRUCTION_OF_PRESIDENT_PM_OR_DEPUTY_PM
