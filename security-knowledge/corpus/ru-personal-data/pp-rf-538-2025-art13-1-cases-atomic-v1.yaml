non_requirements:
  - The decree does not itself impose a standing duty on every operator to transfer data.
  - The decree does not permit formation for a purpose outside the seven enumerated cases.
  - The decree does not state operator response, correction or transmission deadlines.
  - The decree does not state a dataset retention period.
  - The decree does not itself grant platform access to a prospective user.
  - The listed common attributes do not authorize unrelated data enrichment.

