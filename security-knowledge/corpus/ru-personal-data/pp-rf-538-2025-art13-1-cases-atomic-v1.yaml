pp966_frequency_crosswalk:
  - group: A_THROUGH_G
    cases: [PP538-CASE-A, PP538-CASE-B, PP538-CASE-V, PP538-CASE-G]
    maximum_requirements_per_case: 1
    period: DAY
    source_of_limit: GOVERNMENT_DECREE_966_RULES_CLAUSE_3
  - group: D_THROUGH_ZH
    cases: [PP538-CASE-D, PP538-CASE-E, PP538-CASE-ZH]
    maximum_requirements_per_case: 1
    period: MONTH
    source_of_limit: GOVERNMENT_DECREE_966_RULES_CLAUSE_3

evidence_model:
  - id: EVIDENCE_CASE_SELECTION
    proves: [enumerated_case, case_letter]
  - id: EVIDENCE_TRIGGER_EVENT_OR_RESEARCH_MANDATE
    proves: [case_trigger]
  - id: EVIDENCE_PURPOSE_AND_NEED
    proves: [case_purpose, data_necessity]
  - id: EVIDENCE_AUTHORIZED_INSTRUCTION_OR_DECISION
    proves: [decision_basis, decision_authority, decision_date]
  - id: EVIDENCE_DATASET_SCHEMA
    proves: [allowed_fields, grouping_rule, non_identifiability_condition]
  - id: EVIDENCE_REQUIREMENT_HISTORY
    proves: [pp966_frequency_group, per_case_frequency_compliance]

