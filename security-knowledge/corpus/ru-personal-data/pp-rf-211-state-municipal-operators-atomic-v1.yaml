atomic_rules:
  - {id: PP211-R001, locator: list.clause_1.chapeau, class: SCOPE, rule: "Apply this list only to an operator that is a state or municipal body."}
  - id: PP211-R002
    locator: list.clause_1.a
    class: RESPONSIBLE_PERSON
    rule: >-
      Appoint the person responsible for organizing personal-data processing from the
      body's state or municipal servants and/or its non-civil-service employees working
      under an employment contract.
  - {id: PP211-R003, locator: list.clause_1.b.paragraph_2, class: LOCAL_ACT, rule: "Approve by an act of the body head processing rules covering prevention and detection of violations and, for each purpose, data content, subject categories, processing and storage periods, and destruction routes."}
  - {id: PP211-R004, locator: list.clause_1.b.paragraph_3, class: LOCAL_ACT, rule: "Approve rules for considering requests from personal-data subjects or their representatives."}
  - {id: PP211-R005, locator: list.clause_1.b.paragraph_4, class: LOCAL_ACT, rule: "Approve rules for internal control of compliance with Federal Law No. 152-FZ, subordinate acts and the operator's local acts."}
  - {id: PP211-R006, locator: list.clause_1.b.paragraph_5, class: CONDITIONAL_LOCAL_ACT, rule: "Approve rules for working with anonymized data when the operator anonymizes personal data."}
  - {id: PP211-R007, locator: list.clause_1.b.paragraph_6, class: INVENTORY, rule: "Approve a list of personal-data information systems."}
  - {id: PP211-R008, locator: list.clause_1.b.paragraph_7, class: INVENTORY, rule: "Approve lists of personal data processed for service or employment relations, public or municipal services, and public or municipal functions."}
  - {id: PP211-R009, locator: list.clause_1.b.paragraph_8, class: CONDITIONAL_ROLE_LIST, rule: "When anonymization is performed, approve a list of positions responsible for anonymization measures."}
  - {id: PP211-R010, locator: list.clause_1.b.paragraph_9, class: ACCESS_ROLE_LIST, rule: "Approve a list of positions whose substitution entails processing personal data or access to personal data."}
  - {id: PP211-R011, locator: list.clause_1.b.paragraph_10, class: ROLE_DOCUMENT, rule: "Approve the official regulations, duties or job description of the person responsible for organizing personal-data processing."}
  - {id: PP211-R012, locator: list.clause_1.b.paragraph_11, class: TERMINATION_CONTROL, rule: "Approve a standard obligation requiring a direct processor, after termination of service or employment, to cease processing personal data learned through official duties."}
  - {id: PP211-R013, locator: list.clause_1.b.paragraph_12.part_1, class: STANDARD_FORM, rule: "Approve a standard consent form for servants and other personal-data subjects; the form itself does not create a universal consent requirement."}
  - {id: PP211-R014, locator: list.clause_1.b.paragraph_12.part_2, class: STANDARD_FORM, rule: "Approve a standard explanation of the legal consequences of a subject's refusal to provide personal data."}
  - {id: PP211-R015, locator: list.clause_1.b.paragraph_13, class: PHYSICAL_ACCESS, rule: "Approve the procedure for servant access to premises in which personal-data processing is performed."}
  - id: PP211-R016
    locator: list.clause_1.c
    class: ISPDN_SECURITY
    rule: >-
      When the body operates an ISPDN as its operator, implement the legal,
      organizational and technical security measures prescribed by the applicable acts
      to satisfy the Government-established protection-level requirements.
  - {id: PP211-R017, locator: list.clause_1.g, class: NON_AUTOMATED_PROCESSING, rule: "For non-automated processing, comply with Government Decree No. 687; do not treat this cross-reference as an alternative processing regime."}
  - {id: PP211-R018, locator: list.clause_1.d.sentence_1, class: INTERNAL_CONTROL, rule: "Organize periodic inspections of personal-data processing conditions for internal compliance control."}
  - {id: PP211-R019, locator: list.clause_1.d.sentence_2, class: INTERNAL_CONTROL_ROLE, rule: "Have inspections performed by the processing-responsible person or by a commission established by the body head."}
  - {id: PP211-R020, locator: list.clause_1.d.sentence_3, class: INTERNAL_CONTROL_REPORTING, rule: "Have the responsible person or commission chair report inspection results and required remediation measures to the body head."}
  - {id: PP211-R021, locator: list.clause_1.e, class: PERSONNEL_AWARENESS, rule: "Familiarize direct processors with personal-data law, security requirements and local acts and/or organize their training."}
  - {id: PP211-R022, locator: list.clause_1.zh, class: REGULATOR_NOTIFICATION, rule: "Notify the authorized data-subject-rights authority about processing or intended processing unless an exception in Federal Law No. 152-FZ applies."}
  - {id: PP211-R023, locator: list.clause_1.z, class: CONDITIONAL_ANONYMIZATION, rule: "In cases established by Russian normative acts, anonymize ISPDN data using the requirements and methods established by the authorized data-subject-rights authority."}
  - {id: PP211-R024, locator: list.clause_2, class: WEBSITE_PUBLICATION, rule: "Publish documents defining the personal-data processing policy on the body's official website within 10 days after their approval."}

