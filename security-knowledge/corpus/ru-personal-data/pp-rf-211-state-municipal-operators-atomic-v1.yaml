conflict_and_definition_checks:
  - id: PP211-C001
    type: SCOPE_SPECIALIZATION_NOT_CONFLICT
    resolution: >-
      The state-or-municipal-body operator is a specialization of the 152-FZ operator;
      the decree's document set and ten-day website clock are not universal operator rules.
  - id: PP211-C002
    type: ROLE_NON_EQUIVALENCE
    resolution: >-
      The person responsible for organizing processing, the ISPDN security roles and an
      inspection commission are not silently collapsed into one role. Each assignment
      requires its own legal and organizational evidence.
  - id: PP211-C003
    type: EXCEPTION_DELEGATION
    resolution: >-
      Clause 1(zh) delegates notification exceptions to Federal Law No. 152-FZ; PP 211
      is not modeled as an exception-free universal notification duty.
  - id: PP211-C004
    type: CROSS_REGIME_COMPLEMENT
    resolution: >-
      Clause 1(c) invokes applicable ISPDN protection acts and levels; it does not replace
      Government Decree No. 1119, FSTEC Order No. 21 or applicable FSB cryptographic rules.
  - id: PP211-C005
    type: CROSS_REGIME_COMPLEMENT
    resolution: >-
      Clause 1(g) invokes PP 687 for non-automated processing and does not change PP 687's
      mode boundary or create a separate legal basis for processing.
  - id: PP211-C006
    type: DEADLINE_SCOPE_DIVERGENCE
    resolution: >-
      The ten-day clock is tied to approval and official-site publication of policy
      documents by the covered public body. No numeric periodic-inspection interval is stated.

red_team_boundaries:
  - "Do not apply the decree to a private operator merely because it processes data for a public body."
  - "Do not restrict the responsible-person pool to civil or municipal servants after 25 April 2019."
  - "Do not infer that one person must combine processing governance, ISPDN security and inspection roles."
  - "Do not treat the standard consent form as proof that consent is required for every processing purpose."
  - "Do not turn 'periodic inspections' into an invented monthly, quarterly or annual interval."
  - "Do not apply the ten-day policy-publication clock to every operator or to every local act."
  - "Do not treat PP 211 as replacing PP 687, PP 1119, FSTEC 21, FSB 378 or the notification exceptions in 152-FZ."

