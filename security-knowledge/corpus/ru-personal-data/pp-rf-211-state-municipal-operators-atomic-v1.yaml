schema_version: "1.0"
id: RU-PP211-STATE-MUNICIPAL-OPERATORS-ATOMIC-V1
title: Government Decree No. 211 measures for state and municipal personal-data operators
scope: >-
  Current 15 April 2019 edition of Government Decree No. 211 of 21 March 2012.
  The model applies only where the personal-data operator is a state or municipal body;
  it does not universalize the decree's public-sector roles, document set or ten-day
  website-publication clock to other operators.

