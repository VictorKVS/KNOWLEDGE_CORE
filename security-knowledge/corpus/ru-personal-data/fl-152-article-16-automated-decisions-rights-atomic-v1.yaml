atomic_rules:
  - {id: FL152-A16-R001, locator: article_16.part_1.scope, class: SOLELY_AUTOMATED_SCOPE, rule: "Apply Article 16 where the decision is based solely on automated processing of the subject's personal data."}
  - {id: FL152-A16-R002, locator: article_16.part_1.effect_1, class: LEGAL_CONSEQUENCE_DECISION_PROHIBITION, rule: "Prohibit a solely automated decision that produces legal consequences for the subject unless a part 2 exception is established."}
  - {id: FL152-A16-R003, locator: article_16.part_1.effect_2, class: RIGHTS_INTERESTS_DECISION_PROHIBITION, rule: "Prohibit a solely automated decision that otherwise affects the subject's rights or legitimate interests unless a part 2 exception is established."}
  - {id: FL152-A16-R004, locator: article_16.part_2.exception_1, class: WRITTEN_CONSENT_EXCEPTION, rule: "Permit the decision under the consent exception only where the subject has consented in written form."}
  - {id: FL152-A16-R005, locator: article_16.part_2.exception_2, class: FEDERAL_LAW_EXCEPTION, rule: "Permit the decision under a federal-law exception only where that federal law provides for the decision."}
  - {id: FL152-A16-R006, locator: article_16.part_2.exception_2_safeguards, class: FEDERAL_LAW_SAFEGUARDS, rule: "Require the same federal-law route also to establish measures ensuring observance of the subject's rights and legitimate interests."}
  - {id: FL152-A16-R007, locator: article_16.part_3.duty_1, class: DECISION_PROCEDURE_EXPLANATION, rule: "Explain to the subject the procedure used to make the solely automated decision."}
  - {id: FL152-A16-R008, locator: article_16.part_3.duty_2, class: LEGAL_CONSEQUENCES_EXPLANATION, rule: "Explain the possible legal consequences of that decision."}
  - {id: FL152-A16-R009, locator: article_16.part_3.duty_3, class: OBJECTION_OPPORTUNITY, rule: "Provide the subject an opportunity to object to the decision."}
  - {id: FL152-A16-R010, locator: article_16.part_3.duty_4, class: RIGHTS_PROTECTION_PROCEDURE, rule: "Explain how the subject may protect their rights and legitimate interests."}
  - {id: FL152-A16-R011, locator: article_16.part_4.duty_1, class: OBJECTION_REVIEW_DEADLINE, rule: "Consider the part 3 objection within thirty days from receipt."}
  - {id: FL152-A16-R012, locator: article_16.part_4.duty_2, class: OBJECTION_RESULT_NOTICE, rule: "Notify the subject of the result of considering the objection."}

