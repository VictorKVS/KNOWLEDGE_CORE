conflict_and_definition_checks:
  - {id: FL152-A16-C001, type: SOLELY_AUTOMATED_REQUIRED, resolution: "Article 16 does not govern every decision supported by automation; the decision must be based solely on automated personal-data processing."}
  - {id: FL152-A16-C002, type: HUMAN_INVOLVEMENT_THRESHOLD_NOT_DEFINED, resolution: "Article 16 does not define the quality threshold for human involvement; do not treat a nominal approval click as conclusive without documented analysis."}
  - {id: FL152-A16-C003, type: EFFECT_THRESHOLD, resolution: "The prohibition requires legal consequences or another effect on rights or legitimate interests; routine automation without that effect is not automatically routed here."}
  - {id: FL152-A16-C004, type: TWO_EXCEPTIONS_ONLY, resolution: "Part 2 supplies written consent or a qualifying federal-law route; internal policy, contract or generic legitimate interest is not encoded as an Article 16 exception."}
  - {id: FL152-A16-C005, type: WRITTEN_CONSENT_SPECIFICITY, resolution: "The consent exception expressly requires written form; do not downgrade it to merely provable or implied consent."}
  - {id: FL152-A16-C006, type: FEDERAL_LAW_PLUS_SAFEGUARDS, resolution: "A federal-law locator is insufficient unless the route also establishes measures protecting the subject's rights and legitimate interests."}
  - {id: FL152-A16-C007, type: EXCEPTION_NOT_PROCESSING_BASIS, resolution: "A part 2 exception removes the Article 16 prohibition but does not replace the separate legal basis and principles required for personal-data processing."}
  - {id: FL152-A16-C008, type: FOUR_DISTINCT_PART3_DUTIES, resolution: "Procedure explanation, possible-consequence explanation, objection opportunity and rights-protection procedure are independent duties and cannot be collapsed into a generic notice."}
  - {id: FL152-A16-C009, type: THIRTY_DAYS_NOT_WORKING_DAYS, resolution: "Part 4 states thirty days, not thirty working days."}
  - {id: FL152-A16-C010, type: RESULT_NOTICE_NO_SEPARATE_NUMBER, resolution: "Part 4 requires result notice but states no separate numeric period after the result; do not invent one."}
  - {id: FL152-A16-C011, type: OBJECTION_NOT_AUTOMATIC_REVERSAL, resolution: "Article 16 requires consideration and result notice; it does not state that every objection automatically reverses the decision."}
  - {id: FL152-A16-C012, type: TECHNOLOGY_NEUTRAL_NOT_GENERAL_AI_LAW, resolution: "Route by solely automated personal-data decision and protected effect, not by an AI label alone."}

