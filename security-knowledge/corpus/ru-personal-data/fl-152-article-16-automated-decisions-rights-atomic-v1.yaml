schema_version: "1.0"
id: RU-FL152-ARTICLE16-AUTOMATED-DECISIONS-RIGHTS-ATOMIC-V1
title: Federal Law No. 152-FZ Article 16 solely automated decisions and subject safeguards
scope: >-
  Current Article 16 prohibition, exceptions, explanation, objection and review duties
  for decisions based solely on automated personal-data processing that produce legal
  consequences or otherwise affect a subject's rights and legitimate interests. This is
  a technology-neutral personal-data rule, not a universal artificial-intelligence regime.

