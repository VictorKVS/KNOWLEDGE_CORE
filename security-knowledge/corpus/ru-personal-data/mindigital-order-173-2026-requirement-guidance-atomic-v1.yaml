  - id: EVIDENCE_THREAT_AND_ATTACK_REVIEW
    proves: [pp961_threat_types, attack_algorithms, reidentification_estimates]
  - id: EVIDENCE_REVIEW_TRANSMITTAL
    proves: [thirty_calendar_day_internal_lead_time_or_instruction_exception]
  - id: EVIDENCE_CONCURRENCE_AND_COMMENT_RESOLUTION
    proves: [fsb_rkn_and_conditional_cbr_review, comment_disposition]
  - id: EVIDENCE_SIGNED_INDIVIDUALIZED_REQUIREMENT
