non_requirements:
  - The recommendations are not a standing data-transfer requirement addressed to every operator.
  - The 30-calendar-day lead time is a Ministry project-preparation stage, not an operator delivery deadline.
  - The operator delivery deadline is supplied by the signed individualized requirement; no universal number is stated here.
  - The example values 5 and k in the appendix are not universal anonymization thresholds.
  - H3 levels 5 through 8 are an optional research subject, not a mandated representation method.
  - Four or more mobile operators is a contextual factor in clause 13, not a universal minimum for every dataset.
  - No sanction, universal retention period or operator correction deadline is created by this guidance.
  - The bounded search did not establish an official-publication or Minjust-registration identifier.

