schema_version: "1.0"
id: RU-MINDIGITAL-173-2026-REQUIREMENT-GUIDANCE-ATOMIC-V1
title: Methodological recommendations for preparing an article 13.1 anonymized-data requirement
scope: >-
  Ministry of Digital Development preparation and research workflow for an individualized
  requirement under Federal Law No. 152-FZ article 13.1 part 2.

source:
  authority: Ministry_of_Digital_Development_Communications_and_Mass_Media
  document_type: ORDER_APPROVING_METHODOLOGICAL_RECOMMENDATIONS
  document_number: "173"
  signed_date: "2026-03-03"
  full_title: >-
    Об утверждении методических рекомендаций по подготовке требования о предоставлении
    персональных данных, полученных в результате обезличивания персональных данных,
    направляемого в соответствии с частью 2 статьи 13.1 Федерального закона
    "О персональных данных"
  basis:
    - RU_GOV_PP_1154_2025_RULES_CLAUSE_3
    - RU_GOV_PP_1154_2025_RULES_CLAUSE_6
  current_text_interfaces:
    consultant: https://www.consultant.ru/document/cons_doc_LAW_528407/
    ppt_legal_base: https://pravo.ppt.ru/prikaz/mincifry-rossii/n-173-329221
    baza_npa: https://bazanpa.ru/mintsifry-rossii-prikaz-n173-ot03032026-h7041705/

verification_boundary:
  identity_and_signature: CROSS_CHECKED_CURRENT_TEXT_INTERFACES
  clauses_1_through_16_and_appendix: CROSS_CHECKED_FULL_TEXT_RENDERING
  official_publication_identity: NOT_LOCATED_IN_BOUNDED_SEARCH
  minjust_registration: NOT_LOCATED_IN_BOUNDED_SEARCH
  immutable_official_bytes: PENDING
  entry_into_force_clause: NOT_STATED_IN_REVIEWED_TEXT
  status_search_as_of: "2026-08-19"
  amendment_or_repeal_located: false
  caution: >-
    Absence of a located publication or registration identifier is not proof that none exists.
    The admitted interfaces support the identity and clause model, but not an immutable official
    artifact claim.

authority_boundary:
  instrument_effect: METHODOLOGICAL_RECOMMENDATIONS
  primary_audience:
    - Ministry_of_Digital_Development
    - Ministry_subordinate_research_institution
  operator_effect: >-
    The recommendations do not by themselves create a standing duty for every operator.
    An operator-facing duty, data list and delivery deadline require the article 13.1 part 2
    individualized requirement and the applicable Government rules.
  statutory_content_embedded_in_clause_6:
    source: FEDERAL_LAW_152_FZ_ARTICLE_13_1_PART_2
    required_in_individualized_requirement:
      - LIST_OF_ANONYMIZED_DATA
      - DELIVERY_DEADLINES
  no_numeric_threshold_rule: >-
    The appendix's values 5 and k are examples for quality-check scenarios, not universal
    anonymization or aggregation thresholds.

roles:
  preparer_and_signer: Ministry_of_Digital_Development
  research_performer: Ministry_subordinate_institution_or_lawfully_engaged_organization
  security_reviewer: Federal_Security_Service
  sector_reviewer_when_financial_route_applies: Bank_of_Russia
  requirement_concurrence_body: Roskomnadzor
  addressee: Operator_named_in_individualized_requirement

guidance_rules:
  - id: MD173-01
    locator: recommendations.clause_1
    modality: SCOPE
    rule: Apply this guidance to preparation of the article 13.1 part 2 requirement under Decree No. 1154 rules 3 and 6.
  - id: MD173-02
    locator: recommendations.clause_2
    modality: PURPOSE
    rule: Use the recommendations to support a common approach to requirement preparation and related research.
  - id: MD173-03
    locator: recommendations.clause_3
    modality: PROCESS_BOUNDARY
    rule: Prepare requirements only for formation cases listed in Government Decree No. 538.
  - id: MD173-04
    locator: recommendations.clause_4
    modality: MAY
    rule: >-
      The Ministry may request information from dataset users identified in the relevant
      instruction, use its subordinate institution and lawfully engage another organization.
  - id: MD173-05
    locator: recommendations.clause_5
    modality: RECOMMENDED_WORKFLOW
    rule: >-
      Sequence representation-method selection, research assignment, research, security and
      sector review, draft concurrence and authorized signature.
  - id: MD173-06
    locator: recommendations.clause_6
    modality: MIXED_STATUTORY_AND_RECOMMENDED_CONTENT
    rule: >-
      Preserve the statutory list-and-deadline minimum, describe attributes, format and selection
      criteria, and consider the recommended addressee, legal basis, purpose, representation,
      method and parameter fields.
  - id: MD173-07
    locator: recommendations.clause_7
    modality: PROCESS
    rule: Base the draft on research materials and route it for concurrence to the listed bodies.
  - id: MD173-08
    locator: recommendations.clause_8
    modality: PROCESS
    rule: >-
      Resolve review comments or convene a reconciliation meeting where comments indicate the
      formation purpose may not be achieved; preserve utility and non-identifiability.
  - id: MD173-09
    locator: recommendations.clause_9
    modality: PROCESS
    rule: After concurrence, obtain authorized Ministry signature and send the requirement under Decree No. 966.
  - id: MD173-10
    locator: recommendations.clause_10
    modality: RESEARCH_SCOPE
    rule: Conduct research for each personal-data array under an assignment containing functional requirements.
  - id: MD173-11
    locator: recommendations.clause_11
    modality: RECOMMENDED_INPUT
    rule: Provide the appendix information with the research assignment.
  - id: MD173-12
    locator: recommendations.clause_12
    modality: RECOMMENDED_RESEARCH_WORK
    rule: >-
      Assess methods and parameters, model Decree No. 961 threat types and attacks, select
      countervailing parameters, and develop verification criteria and tests.
  - id: MD173-13
    locator: recommendations.clause_13
    modality: MAY_CONSIDER
    rule: >-
      For mobile-network data, consider listed data-quality and contextual factors and, when
      information is available, combination of data from four or more operators.
  - id: MD173-14
    locator: recommendations.clause_14
    modality: RECOMMENDED_SELECTION_FACTORS
    rule: >-
      Select methods in view of purpose, Ministry representation method, data volume, platform
      security measures and Decree No. 1154 rule 7.
  - id: MD173-15
    locator: recommendations.clause_15
    modality: RECOMMENDED_RESEARCH_MATERIALS
    rule: >-
      Include method and parameter justification, threat-aware selection criteria, per-dataset
      reidentification estimates and a report section containing anonymization requirements.
  - id: MD173-16
    locator: recommendations.clause_16
    modality: RECOMMENDED_DELIVERY_FORMAT
    rule: >-
      Present research materials electronically on machine-readable media; use OpenDocument v1.0
      for text documents and an authorized person's enhanced qualified electronic signature.

