schema_version: 1
purpose: Define all dimensions that must be populated and cross-validated before organization-level expert runs are considered trustworthy.
dimensions:
  authority_and_law:
    includes: [constitution_context, federal_laws, presidential_decrees, government_decrees, regulator_orders, sector_rules, international_jurisdiction]
  standards:
    includes: [GOST, GOST_R_ISO_IEC, ISO_IEC, NIST, CIS, industry_standards]
  terminology_and_ontology:
    includes: [definitions, synonyms, regulator_specific_terms, object_types, role_types, evidence_types]
  applicability:
    includes: [organization, sector, jurisdiction, system, asset, data, process, technology, incident, lifecycle_stage]
  classification_and_categorization:
    includes: [ISPDn, GIS, CII, ASU_TP, information_categories, protection_levels, security_classes]
  inventory_and_boundaries:
    includes: [assets, systems, software, hardware, users, roles, premises, network_zones, integrations, data_flows, suppliers]
  threat_modeling:
    includes: [FSTEK_methodology, BDU, threat_sources, violator_model, attack_scenarios, applicability, threat_reassessment]
  vulnerability_knowledge:
    includes: [BDU, CVE, CWE, NVD, KEV, EPSS, vendor_advisories, configuration_weaknesses]
  risk_management:
    includes: [risk_methods, likelihood, impact, assets, threats, vulnerabilities, controls, inherent_risk, residual_risk, acceptance, transfer, avoidance, treatment]
  controls:
    includes: [organizational, technical, physical, cryptographic, preventive, detective, corrective, compensating]
  documents_and_records:
    includes: [policies, regulations, orders, instructions, models, passports, journals, acts, protocols, plans, registers, reports]
  governance_and_roles:
    includes: [management, CISO, responsible_persons, administrators, users, commissions, owners, contractors, deputies, segregation_of_duties]
  processes:
    includes: [access, change, vulnerability, incident, backup, logging, monitoring, development, procurement, HR, media, keys, continuity, audit]
  certification_and_licensing:
    includes: [FSTEK_certificates, FSB_certificates, licenses, product_versions, validity, suspension, restoration, replacement, vendor_support]
  attestation_and_assurance:
    includes: [assessment, attestation, conformity, testing, protocols, scope, reassessment_triggers]
  evidence:
    includes: [documentary, configuration, logs, screenshots, exports, measurements, test_results, tickets, approvals, forensic_artifacts]
  audit_and_inspection:
    includes: [internal_audit, external_audit, regulator_checklists, inspection_practice, findings, remediation, retest]
  incidents_and_notifications:
    includes: [classification, escalation, regulator_matrix, deadlines, channels, content, preservation, investigation, lessons_learned]
  continuity_and_resilience:
    includes: [BIA, critical_processes, RTO, RPO, backup, restore_test, DR, crisis_management, exercises]
  third_parties:
    includes: [due_diligence, contracts, data_processing, access, cloud, SLA, incidents, termination, evidence, concentration_risk]
  lifecycle:
    includes: [design, procurement, implementation, commissioning, operation, change, modernization, decommissioning, disposal]
  security_architecture:
    includes: [trust_boundaries, segmentation, identity, privilege, cryptography, logging, resilience, remote_access, external_connections]
  secure_development:
    includes: [requirements, architecture, threat_modeling, code_review, SAST, DAST, SCA, secrets, CI_CD, release, SBOM]
  physical_and_environmental:
    includes: [premises, access, CCTV_relationship, power, climate, fire_related_dependencies, equipment_protection, visitors]
  personnel_security:
    includes: [hiring, NDA, training, awareness, access_changes, dismissal, privileged_staff, substitution]
  metrics_and_maturity:
    includes: [coverage, effectiveness, evidence_strength, freshness, maturity, residual_risk, expert_confidence, trend]
  economics_and_planning:
    includes: [cost, TCO, migration_cost, implementation_time, staffing, priorities, roadmap, security_debt]
  practice_validation:
    includes: [real_cases, audit_findings, incidents, implementation_failures, negative_cases, regression_cases]
completion_rule: No dimension may be silently omitted. If not applicable, the graph must contain an explicit NOT_APPLICABLE decision with reason and evidence.
