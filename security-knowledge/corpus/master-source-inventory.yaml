completion_policy:
  - P0 source families must reach EXPERT_REVIEWED before Russian paper-security core may be called EXPERT_READY.
  - Every P0 family must have a source completeness audit, version/supersession audit and cross-link audit.
  - Missing authoritative text blocks atomization; secondary summaries may only create research leads.
  - No family may be marked COMPLETE merely because a registry or document card exists.
