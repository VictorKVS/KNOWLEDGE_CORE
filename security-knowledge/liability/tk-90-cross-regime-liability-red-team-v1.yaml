  "scope_boundary": "Модель проверяет границы между дисциплинарной, материальной, гражданско-правовой, административной и уголовной ответственностью при обработке ПДн работников. Она не устанавливает нарушение, виновное лицо, размер ущерба, санкцию, допустимость конкретного доказательства или исход дела.",
  "article_90_role": {
    "regimes": [
      "disciplinary",
      "material",
      "civil",
      "administrative",
      "criminal"
    ],
    "function": "ROUTING_NOT_SELF_EXECUTING_OFFENCE",
    "guilt_language": "persons guilty in a violation remain subject to the separate rules and procedures of the referenced regime",
    "boundary": "Enumeration of regimes does not merge their subjects, elements, standards, clocks, authorities, remedies or outcomes."
  },
  "subject_separation": {
    "roles": [
      "employer",
      "personal_data_operator",
      "worker",
      "official",
      "natural_person",
      "third_party",
      "data_subject"
    ],
    "rule": "A legal entity or operator route and an individual worker or other natural-person route must not be inferred from one another.",
    "attribution": "Account, role, device or access capability is contextual evidence, not conclusive identification of the actor."
  },
  "regime_routes": {
    "disciplinary": {
      "gates": [
        "specific employment duty",
        "misconduct and actor",
        "fault",
        "Article 193 procedure and clocks",
        "proportionality",
        "one sanction per misconduct"
      ],
      "outcome": "independent employer order subject to challenge"
    },
    "material": {
      "gates": [
        "direct actual damage",
        "culpable unlawful act or omission",
        "causal link",
        "amount",
        "Article 239 exclusions",
        "cap or exact full-liability ground",
        "Article 247 investigation",
        "Article 248 route"
      ],
      "outcome": "voluntary, employer-order or judicial recovery within the applicable boundary",
      "independence_boundary": "Article 248 allows recovery independently of disciplinary, administrative or criminal responsibility; it does not establish or require those other outcomes."
    },
    "civil": {
      "gates": [
        "claimant and defendant",
        "protected right or interest",
        "specific act and unlawfulness",
        "fault rule where relevant",
        "harm or loss",
        "causal link",
        "remedy and limitation"
      ],
      "boundary": "Personal data is not automatically identical to private-life information; moral and property heads remain separate."
    },
    "administrative": {
      "gates": [
        "exact Article 13.11 part",
        "qualifying subject",
        "applicable version",
        "objective and subjective elements",
        "repetition or threshold if relevant",
        "procedure and limitation",
        "final decision"
      ],
      "boundary": "An operator incident, employee discipline or regulator notification is not itself an administrative offence or guilt finding."
    },
    "criminal": {
      "gates": [
        "natural person",
        "exact Article 137 or 272.1 act",
        "protected information or unlawful origin",
        "intent and other subjective elements",
        "qualifying circumstances",
        "criminal-procedure evidence and final outcome"
      ],
      "boundary": "A leak, access or Article 90 reference does not automatically constitute a crime."
    }
  },
  "evidence_reuse": {
    "reusable_context": [
      "immutable source bytes",
      "time-synchronised raw logs",
      "document provenance",
      "incident chronology"
    ],
    "not_conclusive_across_regimes": [
      "internal investigation conclusion",
      "disciplinary order",
      "administrative protocol",
      "expert conclusion",
      "criminal case opening",
      "civil pleading"
    ],
    "rule": "Reuse requires provenance and relevance review; legal effect and standard of proof are determined in the receiving proceeding."
  },
  "temporal_routing": {
    "independent_clocks": [
      "Article 193 disciplinary clock",
      "Article 248 employer-order clock",
      "Article 392 labour-dispute clocks",
      "KoAP limitation and procedure",
      "civil claim-specific limitation",
      "criminal procedure and criminal limitation"
    ],
    "boundary": "Do not use one incident, discovery, investigation-completion or notification timestamp as a universal start event."
  },
  "linked_models": [
    "RU-TK-WORKER-PDN-DISCIPLINARY-MATERIAL-LIABILITY-ROUTING-V1",
    "RU-GK-PRIVACY-DAMAGES-MORAL-HARM-ROUTING-V1",
    "RU-KOAP-13-11-PDN-LIABILITY-ROUTING-V1",
    "RU-KOAP-13-11-PROCEDURE-LIMITATION-ROUTING-V1",
    "RU-KOAP-13-11-UK-272-1-QUALIFICATION-BOUNDARY-V1",
    "RU-UK-272-1-CRIMINAL-PROCEDURE-EVIDENCE-ROUTING-V1"
  ],
  "stages": [
    "freeze applicable versions and separate the incident from any legally established violation",
    "map every employer, operator, worker, official, natural person, third party and data subject role",
    "reconstruct data, act, actor, purpose, recipients, system conditions and person-to-action attribution",
    "run the disciplinary route with duty, misconduct, fault, Article 193 procedure, time and proportionality",
    "run the material route with direct actual damage, causation, exclusions, cap and Articles 247 to 248 procedure",
    "run civil claims separately by claimant, defendant, right, harm, causation, remedy and limitation",
    "run administrative and criminal routes separately by exact subject, elements, version, authority and evidence",
    "reconcile clocks, reused evidence, conflicting findings, recovery offsets and final enforceable outcomes"
  ],
  "red_team_attacks": [
    {
      "id": "RT01",
      "attack": "turn one personal-data incident into all five Article 90 liability outcomes",
      "blocked_by": "require a separate actor, elements, procedure, evidence and decision for every regime",
      "blocked": true
    },
    {
      "id": "RT02",
      "attack": "treat Article 90 TK as an independent offence, sanction or damages tariff",
      "blocked_by": "treat Article 90 only as a routing norm to regimes established by the TK and other federal laws",
      "blocked": true
    },
    {
      "id": "RT03",
      "attack": "merge the employer or operator with the worker or other natural person as one liability subject",
      "blocked_by": "preserve a role-specific subject map and attribute every act and omission independently",
      "blocked": true
    },
    {
      "id": "RT04",
      "attack": "treat account ownership, login or administrator privilege as proof that the worker performed the action",
      "blocked_by": "require person-to-action attribution and preserve alternative actor and system-condition hypotheses",
      "blocked": true
    },
    {
      "id": "RT05",
      "attack": "convert breach of an internal policy automatically into an administrative offence or crime",
      "blocked_by": "require the exact statutory elements in addition to any employment-duty evidence",
      "blocked": true
    },
    {
      "id": "RT06",
      "attack": "use a disciplinary finding as conclusive proof of civil, administrative or criminal liability",
      "blocked_by": "preserve proceeding-specific standards, objections and independent evaluation of evidence",
      "blocked": true
    },
    {
      "id": "RT07",
      "attack": "treat a regulator notice, protocol or incident notification as a final finding of guilt",
      "blocked_by": "separate duty fulfilment, commencement materials and final enforceable decision",
      "blocked": true
    },
    {
      "id": "RT08",
      "attack": "use a criminal report, case opening or expert opinion as automatic proof of material damage recovery",
      "blocked_by": "require direct actual damage, causation, fault, exclusions, amount and the Article 247 to 248 route",
      "blocked": true
    },
    {
      "id": "RT09",
      "attack": "apply the Article 193 one-month clock, the Article 248 month or one universal incident date to every regime",
      "blocked_by": "maintain separate clocks, start events, exclusions and limitation rules for each proceeding and claim",
      "blocked": true
    },
    {
      "id": "RT10",
      "attack": "treat an internal confidentiality label as a secret protected by law or as an automatic full-liability or criminal ground",
      "blocked_by": "require the exact protected-information status and statutory basis for each proposed consequence",
      "blocked": true
    },
    {
      "id": "RT11",
      "attack": "read independence of material recovery under Article 248 as mandatory or automatic stacking of sanctions",
      "blocked_by": "independence permits separate consideration but does not establish elements or compel any outcome",
      "blocked": true
    },
    {
      "id": "RT12",
      "attack": "double count the same loss or rely on incompatible factual findings without reconciliation",
      "blocked_by": "maintain a cross-proceeding outcome ledger, offsets, issue map and conflict review",
      "blocked": true
    }
  ],
