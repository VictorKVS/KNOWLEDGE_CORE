  "duty_routes": [
    {
      "id": "INTENT_TO_PROCESS",
      "legal_basis": "152-ФЗ статья 22 часть 1",
      "trigger": "намерение оператора начать обработку персональных данных",
      "deadline": "до начала обработки персональных данных",
      "recipient": "уполномоченный орган по защите прав субъектов персональных данных",
      "exceptions": [
        "персональные данные включены в государственные информационные системы персональных данных, созданные в целях защиты безопасности государства и общественного порядка",
        "оператор осуществляет обработку персональных данных исключительно без использования средств автоматизации",
        "персональные данные обрабатываются в предусмотренных законодательством о транспортной безопасности случаях и целях части 2 статьи 22"
      ],
      "koap_candidate": "статья 13.11 часть 10",
      "qualification_boundary": "отсутствие или просрочка уведомления образует только кандидатный маршрут; применимая редакция, статус оператора, отсутствие исключения, событие и вина доказываются отдельно"
    },
    {
      "id": "INCIDENT_INITIAL_24H",
      "legal_basis": "152-ФЗ статья 21 часть 3.1 пункт 1",
      "trigger_elements": [
        "установлен факт передачи, предоставления, распространения или доступа",
        "передача, предоставление, распространение или доступ были неправомерными или случайными",
        "событие повлекло нарушение прав субъектов персональных данных"
      ],
      "clock_start": "момент выявления инцидента оператором, уполномоченным органом или иным заинтересованным лицом",
      "deadline_hours": 24,
      "required_payload": [
        "сведения о произошедшем инциденте",
        "предполагаемые причины нарушения прав субъектов",
        "предполагаемый вред правам субъектов",
        "меры по устранению последствий",
        "сведения об уполномоченном оператором лице для взаимодействия с органом"
      ],
      "koap_candidate": "статья 13.11 часть 11",
      "qualification_boundary": "техническое событие или alert без установленных элементов не подменяет триггер части 3.1"
    },
    {
      "id": "INCIDENT_INVESTIGATION_72H",
      "legal_basis": "152-ФЗ статья 21 часть 3.1 пункт 2",
      "clock_start": "тот же момент выявления инцидента, что и для 24-часового уведомления",
      "deadline_hours": 72,
      "required_payload": [
        "результаты внутреннего расследования",
        "сведения о лицах, действия которых стали причиной инцидента, при наличии"
      ],
      "koap_candidate": "статья 13.11 часть 11",
      "qualification_boundary": "72-часовое сообщение является отдельной обязанностью и не продлевает срок первого уведомления; отсутствие установленных виновных лиц не разрешает выдумывать их"
    }
  ],
  "article_22_maintenance_clocks": [
    {
      "event": "изменение сведений ранее поданного уведомления",
      "deadline": "не позднее 15-го числа месяца, следующего за месяцем изменения",
      "basis": "статья 22 часть 7"
    },
    {
      "event": "прекращение обработки персональных данных",
      "deadline": "в течение 10 рабочих дней с даты прекращения",
      "basis": "статья 22 часть 7"
    }
  ],
  "decision_sequence": [
    "зафиксировать дату события и применимую редакцию",
    "идентифицировать оператора и фактическое действие или бездействие",
    "выбрать предварительный или инцидентный маршрут без их слияния",
    "для статьи 22 проверить все три действующих исключения",
    "для статьи 21.3.1 доказать каждый элемент триггера",
    "зафиксировать источник и точное время выявления",
    "раздельно проверить 24-часовой и 72-часовой пакеты",
    "сопоставить фактически отправленный payload и подтверждение доставки",
    "только затем открыть кандидатную часть 10 или 11 статьи 13.11",
    "отдельно проверить субъект, вину, процедуру и доказательства",
    "не смешивать нарушение обязанности с составом утечки частей 12-18",
    "сохранить UNKNOWN или EVIDENCE_PENDING при недостаточности данных"
  ],
  "boundaries": {
    "no_merging_intent_and_incident_notifications": true,
    "no_72h_extension_of_24h_notice": true,
    "no_incident_trigger_without_rights_violation": true,
    "no_alert_equals_established_incident": true,
    "no_exception_without_fact_and_version_evidence": true,
    "no_culprit_invention_when_absent": true,
    "no_delivery_receipt_equals_complete_payload": true,
    "no_automatic_liability_from_missed_operational_sla": true,
    "no_automatic_parts_12_18_from_notification_breach": true,
    "no_double_counting_single_omission": true,
    "no_future_or_expired_revision_mixing": true,
    "no_legal_advice_or_case_outcome_prediction": true
  },
  "red_team_attacks": [
    "merge the initial processing notice and incident notice",
    "start the incident clock at a convenient internal escalation time",
    "treat any security alert as an established article 21.3.1 incident",
    "omit the data-subject-rights violation element",
    "treat 72 hours as an extension of the first 24-hour deadline",
    "require a named culprit even when none is established",
    "treat a delivery receipt as proof of complete statutory payload",
    "claim an article 22 exception without facts and applicable-version analysis",
    "infer administrative guilt from an internal SLA breach",
    "double-count one omission as several offences without procedural basis",
    "apply a later or expired revision to the event",
    "equate notification breach with disclosure offence or criminal qualification"
  ],
  "evidence_artifacts": [
    "event timestamp and applicable-version record",
