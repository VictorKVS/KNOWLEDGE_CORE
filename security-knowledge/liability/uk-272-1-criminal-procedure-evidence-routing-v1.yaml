  "scope_boundary": "Модель маршрутизирует проверку сообщения, форму расследования, подследственность, цифровые доказательства, экспертизу и сроки. Она не устанавливает событие преступления, лицо, умысел, допустимость конкретного доказательства, виновность, меру пресечения или судебный исход.",
  "offence_part_working_categories": [
    {
      "parts": [
        1,
        2,
        6
      ],
      "max_imprisonment_years": [
        4,
        5,
        5
      ],
      "working_category": "medium_gravity_if_intentional_classification_conditions_hold",
      "procedure": "preliminary_investigation_by_default; inquiry only by written prosecutor direction under UPK 150(3)(2)"
    },
    {
      "parts": [
        3,
        4,
        5
      ],
      "max_imprisonment_years": [
        6,
        8,
        10
      ],
      "working_category": "grave",
      "procedure": "preliminary_investigation"
    }
  ],
  "report_check": {
    "occasions": [
      "crime report",
      "surrender or confession statement",
      "message from other sources",
      "prosecutor decision forwarding materials"
    ],
    "basis": "sufficient data indicating signs of a crime",
    "base_decision_days": 3,
    "motivated_extension_days": 10,
    "maximum_extension_days": 30,
    "maximum_extension_gate": "document checks, audits, forensic examination, research or operational-search actions with concrete factual grounds",
    "decisions": [
      "initiate criminal case",
      "refuse initiation",
      "transfer by investigative jurisdiction"
    ],
    "boundary": "an occasion, alert, operator notice or report is not by itself sufficient basis, evidence of guilt or an Article 272.1 qualification"
  },
  "investigative_jurisdiction": {
    "primary": "investigators of internal-affairs bodies for Articles 272 through 274",
    "alternative": "for Articles 272 through 274.1 preliminary investigation may also be conducted by investigators of the body that detected the crime",
    "joined_cases": "prosecutor determines jurisdiction subject to Article 151",
    "dispute": "prosecutor resolves",
    "boundary": "none of these routing rules proves an offence or authorises an automatic transfer without a recorded decision"
  },
  "digital_evidence": {
    "types": "Article 74 enumerated sources, including expert and specialist materials, physical evidence, procedural protocols and other documents",
    "admissibility": "material obtained in violation of the UPK is inadmissible and has no legal force",
    "evaluation": "each item for relevance, admissibility and reliability; the aggregate for sufficiency",
    "electronic_media": "Article 164.1 restrictions and specialist/copying/protocol requirements apply only where their statutory conditions are met",
    "integrity_boundary": "the UPK provisions cited do not impose one universal hash algorithm, imaging tool, retention period or self-authenticating status for logs and screenshots"
  },
  "expertise": {
    "appointment_record": [
      "grounds",
      "expert or institution",
      "questions",
      "materials provided"
    ],
    "rights": "record familiarisation and Article 198 rights of relevant participants",
    "additional": "lack of clarity or completeness, or new questions concerning previously examined circumstances",
    "repeat": "doubts about validity or contradictions; another expert",
    "boundary": "an expert addresses special-knowledge questions and does not substitute aggregate proof of attribution, intent or all offence elements"
  },
  "preliminary_investigation_clock": {
    "base_months": 2,
    "extension_to_months": 3,
    "special_complexity_to_months": 12,
    "beyond_12": "exceptional cases only, by the officials named in Article 162",
    "request_lead_days": 5,
    "notice": "written notice to accused and defence, victim and representative",
    "boundary": "extensions require the statutory authority, grounds and decision; they are not automatic"
  },
  "stages": [
    "freeze applicable UK/UPK versions and alleged Article 272.1 part",
    "separate statutory occasion from sufficient data indicating crime signs",
    "conduct and time the Article 144 report check with participant rights",
    "record one Article 145 decision and preserve traces on transfer",
    "select investigation form with the Article 150 written-direction gate",
    "select investigative jurisdiction and record prosecutor resolution if needed",
    "acquire, examine and evaluate digital evidence and expertise lawfully",
    "track Article 162 term, authorised extensions, notices and procedural outcome"
  ],
  "red_team_attacks": [
    {
      "id": "RT01",
      "attack": "treat a leak or security alert as automatic grounds to initiate a criminal case",
      "blocked_by": "separate statutory occasion from sufficient crime-sign data",
      "blocked": true
    },
    {
      "id": "RT02",
      "attack": "treat a registered report as proof of guilt",
      "blocked_by": "report-to-evidence boundary and presumption-safe routing",
      "blocked": true
    },
    {
      "id": "RT03",
      "attack": "extend the initial three-day check to thirty days automatically",
      "blocked_by": "motivated ten-day and action-specific thirty-day extension gates",
      "blocked": true
    },
    {
      "id": "RT04",
      "attack": "reuse pre-investigation material as evidence without admissibility review",
      "blocked_by": "Articles 75, 88 and 144 admissibility gate",
      "blocked": true
    },
    {
      "id": "RT05",
      "attack": "send every Article 272.1 part to inquiry",
      "blocked_by": "written-prosecutor-direction gate limited to eligible medium-gravity routes",
      "blocked": true
    },
    {
      "id": "RT06",
      "attack": "deny the possible inquiry route for parts 1, 2 and 6",
      "blocked_by": "Article 150 part 3 point 2 conditional route",
      "blocked": true
    },
    {
      "id": "RT07",
      "attack": "declare internal-affairs jurisdiction exclusive in every case",
      "blocked_by": "detecting-body alternative and prosecutor dispute resolution",
      "blocked": true
    },
    {
      "id": "RT08",
      "attack": "treat a log, export or screenshot as self-authenticating",
      "blocked_by": "source, acquisition, integrity, attribution and Article 88 gates",
      "blocked": true
    },
    {
      "id": "RT09",
      "attack": "declare evidence inadmissible solely because no hash was recorded",
      "blocked_by": "no invented universal statutory hash requirement",
      "blocked": true
    },
    {
      "id": "RT10",
      "attack": "let an expert conclusion substitute proof of actor, intent or the whole offence",
      "blocked_by": "expert-scope and aggregate-evidence boundary",
      "blocked": true
    },
    {
      "id": "RT11",
      "attack": "treat unrecorded media copying or seizure as a complete chain",
      "blocked_by": "applicable procedural-action and protocol gates; Article 164.1 only when applicable",
      "blocked": true
    },
    {
      "id": "RT12",
      "attack": "treat the two-month investigation term as absolute or extend it automatically",
      "blocked_by": "Article 162 authority, grounds, decision and notice gates",
      "blocked": true
    }
  ],
