  "authoritative_rules": [
    {
      "id": "A01",
      "authority": "GK_152_2",
      "rule": "without consent, private-life information collection, storage, distribution and use are prohibited unless law or an exact exception applies"
    },
    {
      "id": "A02",
      "authority": "GK_152_2",
      "rule": "public-interest, prior-publicity and citizen-disclosure exceptions are distinct facts to prove"
    },
    {
      "id": "A03",
      "authority": "GK_152_2",
      "rule": "removal and suppression are information-and-carrier specific; destruction is conditional on impossibility of removal otherwise"
    },
    {
      "id": "A04",
      "authority": "PPVS_33_P1_11",
      "rule": "moral-harm claims from personal nonproperty rights and intangible benefits are outside limitation unless law provides otherwise"
    },
    {
      "id": "A05",
      "authority": "PPVS_33_P1_11",
      "rule": "moral-harm claims from property or other time-limited rights inherit the underlying limitation or filing period"
    },
    {
      "id": "A06",
      "authority": "PPVS_33_P12_23",
      "rule": "general elements are suffering, wrongfulness, causation and fault; plaintiff proves violation and the proper liable person"
    },
    {
      "id": "A07",
      "authority": "PPVS_33_P12_23",
      "rule": "fault is presumed under the general tort rule and may be rebutted unless an exact no-fault rule applies"
    },
    {
      "id": "A08",
      "authority": "PPVS_33_P12_23",
      "rule": "lawful conduct is not compensable under the general moral-harm route"
    },
    {
      "id": "A09",
      "authority": "PPVS_33_P12_23",
      "rule": "absence of diagnosed illness or health damage does not itself defeat evidence of moral suffering"
    },
    {
      "id": "A10",
      "authority": "PPVS_33_P12_23",
      "rule": "employer liability requires proof that the employee acted in performance of labor, service or official duties"
    },
    {
      "id": "A11",
      "authority": "PPVS_33_P24_36",
      "rule": "amount is individualized by the court; fixed per-record or incident tariffs are not supplied"
    },
    {
      "id": "A12",
      "authority": "PPVS_43",
      "rule": "for time-limited claims the subjective start requires knowledge of violation and proper defendant"
    },
    {
      "id": "A13",
      "authority": "PPVS_43",
      "rule": "the ten-year cap does not apply to claims on which limitation does not run under Article 208"
    },
    {
      "id": "A14",
      "authority": "KS_49_P",
      "rule": "the holding concerns prosecutor anti-corruption asset-recovery claims and is not a general privacy-claim exception"
    }
  ],
