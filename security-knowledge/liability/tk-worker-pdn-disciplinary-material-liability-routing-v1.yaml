  "scope_boundary": "Модель маршрутизирует обязанности работодателя и возможные дисциплинарные, материальные и судебные пути. Она не устанавливает проступок, автора события, вину, размер ущерба, основание увольнения, законность взыскания или судебный исход.",
  "worker_personal_data": {
    "article_85": "REPEALED_NOT_CURRENT_AUTHORITY",
    "article_86_requirements": 10,
    "processing_purposes": [
      "legal compliance",
      "employment assistance",
      "education and promotion",
      "personal safety",
      "work quantity and quality control",
      "property preservation"
    ],
    "third_party_collection": "advance notice plus written consent and disclosure of purpose, sources, means, data nature and refusal consequences unless another lawful route applies",
    "restricted_categories": "special-category data and association or trade-union membership only in cases allowed by the TK or another federal law",
    "automated_decision_boundary": "a decision affecting the worker may not rely exclusively on data obtained solely through automated processing or electronic receipt",
    "employer_funded_protection": true,
    "local_procedure": "storage and use procedure is employer-set but subordinate to the TK and other federal laws",
    "article_88_transfer_gates": [
      "third-party written consent or exact life-health or statutory exception",
      "separate commercial-purpose written consent",
      "recipient purpose and confidentiality warning",
      "authorised need-to-know internal access",
      "health data limited to fitness for work",
      "representative transfer limited by applicable rules"
    ],
    "article_89_rights": [
      "complete information",
      "free access and copies",
      "representative access",
      "medical records through chosen medical professional",
      "correction or supplementation",
      "notice to prior recipients of corrections",
      "judicial challenge"
    ],
    "boundary": "Neither employment nor a local policy is blanket consent to every collection, access, monitoring or transfer."
  },
  "disciplinary_route": {
    "article_192_sanctions": [
      "remark",
      "reprimand",
      "dismissal_on_applicable_grounds"
    ],
    "other_sanctions": "only when a federal law, charter or regulation on discipline provides them",
    "proportionality": [
      "severity",
      "circumstances"
    ],
    "explanation_days_working": 2,
    "from_discovery_months": 1,
    "from_misconduct_months": 6,
    "audit_financial_check_years": 2,
    "anti_corruption_years": 3,
    "excluded_from_one_month": [
      "worker illness",
      "worker leave",
      "time required for worker-representative opinion"
    ],
    "criminal_proceeding_excluded_from_outer_clocks": true,
    "disciplinary_sanctions_per_misconduct": 1,
    "order_acknowledgement_days_working": 3,
    "boundary": "A violation finding does not itself choose dismissal or any sanction; duty, fault, procedure, time and proportionality remain separate."
  },
  "material_liability": {
    "general_elements": [
      "damage",
      "culpable unlawful act or omission",
      "causal link",
      "amount proof"
    ],
    "employee_damage": "direct actual damage only; lost profit is excluded",
    "default_limit": "average monthly earnings unless the TK or another federal law provides otherwise",
    "full_liability": "only in exact TK or federal-law cases; Article 243 contains eight routes",
    "protected_secret_route": "disclosure of a secret protected by law only in cases provided by the TK or another federal law",
    "article_239_exclusions": [
      "force majeure",
      "normal economic risk",
      "extreme necessity",
      "necessary defence",
      "employer failure to ensure proper entrusted-property storage conditions"
    ],
    "damage_amount": "actual losses from local market prices on the damage date, not below accounting value after depreciation, subject to special federal-law rules",
    "mandatory_investigation": true,
    "mandatory_written_explanation": true,
    "worker_material_access_and_appeal": true,
    "employer_order_limit": "not above average monthly earnings and no later than one month after final determination of amount",
    "court_route": "required when the order route is unavailable, including missed order period or non-voluntary recovery above average monthly earnings",
    "other_liability_independent": "damage recovery does not itself exclude disciplinary, administrative or criminal proceedings",
    "boundary": "Independence permits separate proceedings; it does not prove or automatically stack their outcomes."
  },
  "employer_liability_and_disputes": {
    "moral_harm": "money by party agreement; on dispute, fact and amount are determined by court independently of property damage",
    "worker_general_claim_months": 3,
    "dismissal_claim_months": 1,
    "unpaid_amount_claim_years": 1,
    "moral_harm_after_restoration_decision_months": 3,
    "employer_damage_suit_years_from_discovery": 1,
    "restoration": "missed Article 392 periods may be restored by court for valid reasons",
    "boundary": "Each demand needs its own clock and start event; an incident date is not a universal start date."
  },
  "stages": [
    "freeze the current TK version and exclude repealed or future provisions",
    "identify employment parties, data category, purpose, source, act and local procedure",
    "test Article 86 collection and Article 88 transfer conditions plus worker rights",
    "identify the exact employment duty and prove the alleged actor and misconduct event",
    "run Article 193 explanation, time, proportionality and one-sanction controls",
    "separate disciplinary outcome from direct actual damage and material-liability elements",
    "test cap, full-liability ground, exclusions, investigation and order or court route",
    "preserve worker challenges, limitation clocks, cross-regime boundaries and final outcome"
  ],
  "red_team_attacks": [
    {
      "id": "RT01",
      "attack": "cite repealed Article 85 as a current definition or operative duty",
      "blocked_by": "explicit repealed-state gate and current Articles 86 through 90 route",
      "blocked": true
    },
    {
      "id": "RT02",
      "attack": "treat a local personal-data policy as an independent legal basis overriding federal law",
      "blocked_by": "Article 87 compliance hierarchy and Article 86 purpose and source gates",
      "blocked": true
    },
    {
      "id": "RT03",
      "attack": "treat any disclosure as automatically unlawful without testing consent or statutory exceptions",
      "blocked_by": "act, recipient, purpose, consent and exception-specific review",
      "blocked": true
    },
    {
      "id": "RT04",
      "attack": "treat a security alert or account use as conclusive proof of the employee actor",
      "blocked_by": "person-to-action attribution and system-condition evidence gate",
      "blocked": true
    },
    {
      "id": "RT05",
      "attack": "impose a fine or another unlisted measure as an Article 192 disciplinary sanction",
      "blocked_by": "closed sanction route subject to federal-law or discipline-statute exceptions",
      "blocked": true
    },
    {
      "id": "RT06",
      "attack": "discipline without requesting a written explanation or waiting two working days",
      "blocked_by": "Article 193 explanation request, clock and refusal-act gate",
      "blocked": true
    },
    {
      "id": "RT07",
      "attack": "move the one-month discovery clock to the end of an internal investigation automatically",
      "blocked_by": "separate discovery, act, excluded-period and decision timestamps",
      "blocked": true
    },
    {
      "id": "RT08",
      "attack": "apply multiple disciplinary sanctions for the same misconduct",
      "blocked_by": "one-disciplinary-sanction-per-misconduct control while preserving separate liability regimes",
      "blocked": true
    },
    {
      "id": "RT09",
      "attack": "recover lost profit from an employee as material damage",
      "blocked_by": "Article 238 direct-actual-damage boundary",
      "blocked": true
    },
    {
      "id": "RT10",
      "attack": "assume full material liability from access to data, job title or an internal confidentiality label",
      "blocked_by": "Article 241 default cap and exact Articles 242 and 243 statutory-ground gate",
      "blocked": true
    },
    {
      "id": "RT11",
      "attack": "issue a payroll recovery order without Article 247 verification or after the Article 248 month",
      "blocked_by": "mandatory investigation, explanation, amount and recovery-route gates",
      "blocked": true
    },
    {
      "id": "RT12",
      "attack": "treat Article 90 as automatic simultaneous disciplinary, material, civil, administrative and criminal liability",
      "blocked_by": "independent elements, procedures, authorities, evidence and outcomes for every regime",
      "blocked": true
    }
  ],
