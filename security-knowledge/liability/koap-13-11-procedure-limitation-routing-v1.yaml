  "scope_boundary": "Маршрутизация доказательств и сроков; модель не устанавливает событие, состав, вину, длящийся характер, наказание или исход суда.",
  "limitation": {
    "personal_data_legislation_period": {
      "value": 1,
      "unit": "year",
      "start_for_completed_offence": "day_of_commission",
      "basis": "article_4_5_parts_1_and_1_1"
    },
    "continuing_offence": {
      "start": "day_of_discovery",
      "basis": "article_4_5_part_2",
      "gate": "CONTINUING_CLASSIFICATION_MUST_BE_SEPARATELY_JUSTIFIED"
    },
    "criminal_refusal_or_termination": {
      "start_completed": "day_of_commission",
      "start_continuing": "day_of_discovery",
      "basis": "article_4_5_part_4"
    },
    "place_of_residence_motion": {
      "effect": "suspension_between_grant_and_receipt_by_competent_destination",
      "basis": "article_4_5_part_5"
    },
    "prohibitions": [
      "NO_UNIVERSAL_THREE_YEAR_PERIOD",
      "NO_DISCOVERY_DATE_FOR_COMPLETED_OFFENCE",
      "NO_AUTOMATIC_CONTINUING_CLASSIFICATION",
      "NO_RESET_BY_NEW_EVIDENCE"
    ]
  },
  "initiation": {
    "general_gate": "at_least_one_statutory_ground_and_sufficient_data_indicating_event",
    "control_supervision_gate": "article_28_1_part_3_1_applies_unless_a_statutory_exception_is evidenced",
    "self_report_exception": {
      "basis": "article_28_1_part_3_5_point_1",
      "parts": [
        "1",
        "2",
        "2.1",
        "4",
        "10",
        "11",
        "12",
        "13",
        "14",
        "15",
        "16",
        "17",
        "18"
      ],
      "condition": "data from the natural or legal person that committed the alleged offence confirm an event",
      "boundary": "not a confession, guilt finding, or exclusive initiation ground"
    }
  },
  "competence": {
    "protocol": "officials of the communications, information technology and mass communications supervisory body; article 28.3 part 2 point 58",
    "hearing": "judge; article 23.1 part 1",
    "boundary": "authority to draw a protocol is not authority to adjudicate guilt or impose the judicial sanction"
  },
  "protocol_and_transfer": {
    "immediate": "immediately after detection unless statutory exception",
    "clarification": "within two days after detection when additional clarification is required",
    "investigation": "after completion of administrative investigation within article 28.7 timing",
    "investigation_scope": "article 13.11 parts 1-2.1 and 12-18 only when expert or other time-consuming procedural actions are required",
    "investigation_base_period": "one month from initiation; extensions require the competent statutory route",
    "transfer": "within three days after drawing the protocol or prosecutor ruling"
  },
  "hearing": {
    "judge_base_period": "two months from judicial receipt of the protocol and other materials",
    "general_extension": "up to one month on participant motion or need for additional clarification; reasoned ruling required",
    "parts_15_18_special_extension": "up to three months on motion of the person proceeded against; reasoned judicial ruling required",
    "boundary": "hearing-period extension does not by itself extend or reset limitation"
  },
  "stages": [
    "freeze applicable version and alleged part",
    "prove commission and discovery dates",
    "classify completed versus continuing without presumption",
    "calculate limitation and documented suspension",
    "record initiation ground and sufficient data",
    "verify protocol officer and investigation competence",
    "record protocol and transfer timestamps",
    "verify judicial receipt, hearing period, extension and outcome"
  ],
  "red_team_attacks": [
    {
      "id": "RT01",
      "attack": "apply three years to every personal-data offence",
      "blocked_by": "one-year statutory class"
    },
    {
      "id": "RT02",
      "attack": "start a completed offence at discovery",
      "blocked_by": "commission-date clock"
    },
    {
      "id": "RT03",
      "attack": "treat every omission as continuing",
      "blocked_by": "separate classification evidence"
    },
    {
      "id": "RT04",
      "attack": "reset limitation when new evidence arrives",
      "blocked_by": "statutory clock only"
    },
    {
      "id": "RT05",
      "attack": "treat a self-report as confession or guilt",
      "blocked_by": "event-data-only boundary"
    },
    {
      "id": "RT06",
      "attack": "ignore the control-supervision gate",
      "blocked_by": "article 28.1 part 3.1 or evidenced exception"
    },
    {
      "id": "RT07",
      "attack": "let any officer draw the protocol",
      "blocked_by": "article 28.3 competence"
    },
    {
      "id": "RT08",
      "attack": "treat protocol as adjudication",
      "blocked_by": "judge-only hearing route"
    },
    {
      "id": "RT09",
      "attack": "use administrative investigation for every part",
      "blocked_by": "parts 1-2.1 and 12-18 plus time-consuming actions"
    },
    {
      "id": "RT10",
      "attack": "ignore protocol and transfer timestamps",
      "blocked_by": "article 28.5 and 28.8 clocks"
    },
    {
      "id": "RT11",
      "attack": "apply three-month hearing extension automatically to all parts",
      "blocked_by": "parts 15/18 motion and reasoned ruling"
    },
    {
      "id": "RT12",
      "attack": "treat hearing extension as limitation extension",
      "blocked_by": "separate clocks"
    }
  ],
