  "selected_cases": [
    {
      "id": "CASE_2026_OPERATOR_CONTRACTOR",
      "docket": "5-АД25-119-К2",
      "decision_date": "2026-01-21",
      "jurisdiction": "administrative_offence",
      "part": "KOAP_13_11_PART_1_APPLICABLE_AT_2023_EVENT",
      "event_date": "2023-11-27",
      "facts_frozen": [
        "Ministry was the personal-data operator",
        "open access led to Internet dissemination of employee and relative data",
        "unauthorized access was through contractor infrastructure",
        "case file contained no proof of all dependent compliance and security measures"
      ],
      "issue": "whether contractor infrastructure and alleged contractor failure excluded the operator ministry culpability",
      "holding": [
        "contractor route did not make the innocence argument sufficient on the established record",
        "operator duties and evidence of measures remained material",
        "court expressly used the article edition applicable at the event",
        "culpability and legally significant circumstances were found from the case evidence"
      ],
      "outcome": "LOWER_ACTS_UPHELD_COMPLAINT_DISMISSED",
      "route": "ADMIN_OPERATOR_CONTRACTOR_NOT_AUTOMATIC_EXONERATION",
      "limits": [
        "not strict liability",
        "not automatic liability for every contractor incident",
        "not a route to parts 12-18 or current sanctions",
        "not proof that every listed measure was absent outside this record"
      ],
      "sources": [
        "SC_5_AD25_119_K2_PDF",
        "SC_5_AD25_119_K2_CARD"
      ]
    },
    {
      "id": "CASE_2017_DESTRUCTION_CLOCK",
      "docket": "91-АД17-2",
      "decision_date": "2017-03-21",
      "jurisdiction": "administrative_offence",
      "part": "OLD_SINGLE_ARTICLE_13_11",
      "event_period": "underlying acts adjudicated in 2015",
      "facts_frozen": [
        "question concerned failure to destroy borrower questionnaires after processing purpose ended",
        "then-applicable Article 21 provided a thirty-day period from purpose achievement",
        "the date of purpose achievement was not established"
      ],
      "issue": "whether that fixed-deadline omission was continuing and whether limitation was proven",
      "holding": [
        "the fixed-deadline destruction omission was not continuing",
        "clock began on the day after the thirty-day period expired",
        "without the purpose-achievement date the timely-liability conclusion was not proven",
        "unavoidable doubts were resolved for the person charged"
      ],
      "outcome": "FINDINGS_ON_ARTICLES_5_7_AND_21_4_EXCLUDED_OTHER_PARTS_UNCHANGED",
      "route": "ADMIN_FIXED_DEADLINE_NOT_CONTINUING_REQUIRE_TRIGGER_DATE",
      "limits": [
        "old article structure frozen",
        "not every storage or destruction breach classified",
        "current deadlines must be checked independently",
        "remaining findings were not erased"
      ],
      "sources": [
        "SC_91_AD17_2_TEXT",
        "SC_91_AD17_2_OFFICIAL_LEGACY"
      ]
    },
    {
      "id": "CASE_2018_PRIVATE_LIFE_CALLS",
      "docket": "5-КГ17-256",
      "decision_date": "2018-02-27",
      "jurisdiction": "civil",
      "facts_frozen": [
        "calls and SMS demanded a nonexistent debt from a non-borrower",
        "the phone number was removed only after litigation began",
        "lower courts denied relief and refused evidence assistance"
      ],
      "issue": "whether mistake or another person assignment automatically defeated a moral-harm claim and whether the claim was only about PDn processing",
      "holding": [
        "excessive unjustified debt calls and messages may invade dignity and private life",
        "mistake or another person assignment does not itself release the direct harm-causer",
        "the pleaded moral-harm route was primarily private-life interference rather than only PDn-processing rules",
        "courts had to examine material facts and assist with hard-to-obtain communications evidence"
      ],
      "outcome": "APPEAL_RULING_QUASHED_REMANDED_NO_FINAL_COMPENSATION_AMOUNT",
      "route": "CIVIL_DIRECT_TORTFEASOR_PRIVATE_LIFE_REMAND",
      "limits": [
        "no final merits award",
        "no fixed compensation tariff",
        "no finding that any phone contact is unlawful",
        "no automatic equation of PDn with private-life information"
      ],
      "sources": [
        "SC_5_KG17_256_TEXT"
      ]
    }
  ],
  "cross_case_rules": [
    {
      "id": "R01",
      "rule": "freeze the statutory edition at the event before using a later judgment"
    },
    {
      "id": "R02",
      "rule": "record tribunal, procedural posture, relief and exact outcome"
    },
    {
      "id": "R03",
      "rule": "separate a holding from facts, dicta, party arguments and later commentary"
    },
    {
      "id": "R04",
      "rule": "a contractor does not automatically exonerate the operator on the 2026 case record"
    },
    {
      "id": "R05",
      "rule": "the 2026 case does not create strict liability or universal contractor liability"
    },
    {
      "id": "R06",
      "rule": "the 2026 case applied the part 1 edition effective at the 2023 event"
    },
    {
      "id": "R07",
      "rule": "a duty with a fixed performance deadline is not continuing merely because consequences persist"
    },
    {
      "id": "R08",
      "rule": "the destruction clock needs the legally relevant trigger date and exact then-applicable period"
    },
    {
      "id": "R09",
      "rule": "the 2017 decision altered only specified findings and preserved the remainder"
    },
    {
      "id": "R10",
      "rule": "unjustified repeated communications may implicate private life independently of a pure PDn claim"
    },
    {
      "id": "R11",
      "rule": "mistake or another person assignment is not by itself a complete civil defence"
    },
    {
      "id": "R12",
      "rule": "a remand is not a final damages award or final finding on every pleaded element"
    },
    {
      "id": "R13",
      "rule": "administrative and civil judgments do not prove each other automatically"
    },
    {
      "id": "R14",
      "rule": "three selected Supreme Court acts do not establish exhaustive judicial coverage"
    }
