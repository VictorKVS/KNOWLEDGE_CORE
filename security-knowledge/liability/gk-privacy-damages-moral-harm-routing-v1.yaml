  "scope_boundary": "Модель маршрутизирует возможные способы гражданско-правовой защиты. Она не устанавливает нарушение, ответчика, вину, причинную связь, размер убытков или компенсации, исковую давность по конкретному требованию и судебный исход.",
  "protected_interests": {
    "article_150": [
      "privacy",
      "personal_and_family_secret",
      "personal_inviolability",
      "dignity",
      "honour_and_good_name",
      "business_reputation"
    ],
    "boundary": "Персональные данные и информация о частной жизни пересекаются, но не являются автоматически тождественными категориями."
  },
  "article_152_2_routes": {
    "regulated_acts": [
      "collection",
      "storage",
      "distribution",
      "use"
    ],
    "default_gate": "consent_or_direct_statutory_basis_required",
    "exceptions_to_test": [
      "state_public_or_other_public_interest",
      "previously_publicly_available",
      "disclosed_by_citizen_or_at_citizen_will"
    ],
    "obligation_confidentiality": "Parties may not disclose private-life information learned in forming or performing an obligation unless the agreement permits disclosure.",
    "relief": [
      "removal",
      "suppression_or_prohibition_of_further_distribution",
      "limited seizure_and_destruction_when_removal_otherwise_impossible"
    ],
    "boundary": "An exception, consent or disclosure must be proved for the act and scope at issue; none is presumed from account ownership or an earlier unrelated consent."
  },
  "monetary_heads": {
    "article_15_losses": {
      "components": [
        "actual_loss",
        "lost_profit"
      ],
      "gate": "violation, amount and causal link are required; full compensation is not an automatic incident tariff"
    },
    "article_1064_harm": {
      "default": "full compensation by the tortfeasor",
      "fault": "tortfeasor is released if lack of fault is proved unless a law establishes no-fault liability",
      "boundary": "lawful harm is compensable only when law so provides"
    },
    "moral_harm": {
      "articles": [
        "GK 151",
        "GK 1099",
        "GK 1100",
        "GK 1101",
        "152-FZ 24(2)"
      ],
      "separate_from": [
        "property_harm",
        "losses"
      ],
      "form": "money",
      "amount": "determined by court from suffering, fault where relevant, actual and individual circumstances, reasonableness and fairness",
      "no_fault": "only an enumerated Article 1100 case or another exact statutory rule"
    }
  },
  "preventive_relief": {
    "article_1065": "future danger may support prohibition; continuing harmful or threatening productive activity may support suspension or termination in addition to compensation",
    "public_interest_boundary": "the court may refuse suspension or termination if contrary to public interest, without removing the right to compensation",
    "boundary": "a generic cybersecurity risk without concrete future-harm evidence is not treated as an automatic injunction"
  },
  "limitation_routing": {
    "general_years": 3,
    "subjective_start": "when the person knew or should have known both of the violation and the proper defendant",
    "objective_cap_years": 10,
    "article_208": "claims protecting personal non-property rights and other intangible benefits are generally outside limitation unless law provides otherwise",
    "constitutional_court_caveat": "Article 208 must be applied with the Constitutional Court decision of 31 October 2024 No. 49-P where relevant",
    "boundary": "Do not transfer the no-limitation rule or the general three-year rule automatically to every monetary and non-monetary remedy; classify each demand."
  },
  "stages": [
    "freeze applicable GK and 152-FZ versions and incident chronology",
    "identify claimant, candidate defendant, protected right and requested remedy",
    "classify the information and the exact collection, storage, distribution or use act",
    "test consent, direct statutory basis and Article 152.2 exceptions without presumption",
    "separate unlawful conduct, fault regime, harm and causal link for each defendant",
    "separate actual loss, lost profit, moral harm and preventive or removal relief",
    "classify limitation separately for every pleaded remedy and preserve counterarguments",
    "preserve evidence, overlap controls, judicial findings and enforceable outcome"
  ],
  "red_team_attacks": [
    {
      "id": "RT01",
      "attack": "treat every personal-data incident as an Article 152.2 private-life violation",
      "blocked_by": "separate personal-data status, private-life content and the specific collection, storage, distribution or use act",
      "blocked": true
    },
    {
      "id": "RT02",
      "attack": "treat any technical alert as proven unlawful conduct and harm",
      "blocked_by": "incident, act, unlawfulness, harm and causation are separate evidence gates",
      "blocked": true
    },
    {
      "id": "RT03",
      "attack": "treat general processing consent as consent to every disclosure or later use",
      "blocked_by": "purpose, scope, recipients, term and act-specific consent review",
      "blocked": true
    },
    {
      "id": "RT04",
      "attack": "ignore the statutory and public-interest exceptions in Article 152.2",
      "blocked_by": "record exception applicability without presuming it",
      "blocked": true
    },
    {
      "id": "RT05",
      "attack": "treat operator status as automatic civil liability for every consequence",
      "blocked_by": "identify actor, defendant basis, fault regime and causal link",
      "blocked": true
    },
    {
      "id": "RT06",
      "attack": "treat an administrative or criminal record as automatic civil judgment",
      "blocked_by": "preserve proceeding-specific elements and court evaluation",
      "blocked": true
    },
    {
      "id": "RT07",
      "attack": "merge actual loss, lost profit and moral harm into one undifferentiated amount",
      "blocked_by": "three separate heads, methods and evidence chains",
      "blocked": true
    },
    {
      "id": "RT08",
      "attack": "award moral harm by a fixed per-record, per-subject or incident-severity tariff",
      "blocked_by": "Article 1101 court assessment, individual circumstances, reasonableness and fairness",
      "blocked": true
    },
    {
      "id": "RT09",
      "attack": "apply no-fault compensation to a data incident merely by citing Article 1100",
      "blocked_by": "exact enumerated or other statutory no-fault basis required",
      "blocked": true
    },
    {
      "id": "RT10",
      "attack": "apply either three years or no limitation to every remedy",
      "blocked_by": "remedy-specific Articles 196, 200 and 208 classification, including the Constitutional Court caveat",
      "blocked": true
    },
    {
      "id": "RT11",
      "attack": "convert removal relief into deletion of all lawfully held source data",
      "blocked_by": "limit relief to the information, material and propagation route established by the claim",
      "blocked": true
    },
    {
      "id": "RT12",
      "attack": "double count the same consequence across damages, property harm and moral harm",
      "blocked_by": "independent-head and overlap controls before any amount or outcome",
      "blocked": true
    }
  ],
