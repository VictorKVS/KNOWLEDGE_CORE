  "red_team_attacks": [
    "declare every personal-data leak a crime under article 272.1",
    "use the KOAP subject or identifier band as an element of the crime",
    "exclude criminal screening because fewer than one thousand subjects are affected",
    "treat the operator legal entity as the automatic criminal offender",
    "infer illegal acquisition merely from later possession of data",
    "attribute the same action to every person involved in the incident",
    "replace criminal qualifiers with prior administrative punishment",
    "treat any Internet path or foreign IP address as cross-border transfer",
    "treat any vulnerable website as a knowingly criminal resource",
    "apply article 272.1 to conduct completed before 11 December 2024",
    "ignore the personal-and-family-needs statutory exclusion",
    "present an internal screening result as a judgment of guilt"
  ],
