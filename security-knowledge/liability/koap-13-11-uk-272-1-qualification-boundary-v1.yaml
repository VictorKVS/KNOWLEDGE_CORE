  "uk_272_1_routes": [
    {
      "part": 1,
      "protected_information": "компьютерная информация, содержащая персональные данные, кроме категорий части 2",
      "required_origin": "получена путем неправомерного доступа к средствам обработки или хранения, иного вмешательства в их функционирование либо иным незаконным путем",
      "prohibited_actions": [
        "незаконное использование",
        "незаконная передача, включая распространение, предоставление или доступ",
        "незаконный сбор",
        "незаконное хранение"
      ],
      "maximums": {
        "fine_rub": 300000,
        "income_period_years": 1,
        "forced_labor_years": 4,
        "imprisonment_years": 4
      }
    },
    {
      "part": 2,
      "base": "те же деяния и то же требование незаконного происхождения, что в части 1",
      "protected_categories": [
        "персональные данные несовершеннолетних лиц",
        "специальные категории персональных данных",
        "биометрические персональные данные"
      ],
      "connector": "and/or",
      "maximums": {
        "fine_rub": 700000,
        "income_period_years": 2,
        "disqualification_years_optional": 2,
        "forced_labor_years": 5,
        "imprisonment_years": 5
      }
    },
    {
      "part": 3,
      "base": "деяния части 1 или 2",
      "qualifiers": [
        "корыстная заинтересованность",
        "причинение крупного ущерба",
        "группа лиц по предварительному сговору",
        "использование служебного положения"
      ],
      "large_damage_rule": "ущерб, сумма которого превышает 1 000 000 рублей, по примечанию 2 к статье 272 для главы 28",
      "maximums": {
        "fine_rub": 1000000,
        "income_period_years": 3,
        "disqualification_years_optional": 3,
        "forced_labor_years": 5,
        "imprisonment_years": 6
      }
    },
    {
      "part": 4,
      "base": "деяния части 1, 2 или 3",
      "qualifiers": [
        "трансграничная передача компьютерной информации, содержащей персональные данные",
        "трансграничное перемещение носителей такой информации"
      ],
      "maximums": {
        "imprisonment_years": 8,
        "additional_fine_rub": 2000000,
        "additional_income_period_years": 3,
        "disqualification_years_optional": 4
      }
    },
    {
      "part": 5,
      "base": "деяния части 1, 2, 3 или 4",
      "qualifiers": [
        "тяжкие последствия",
        "совершение организованной группой"
      ],
      "maximums": {
        "imprisonment_years": 10,
        "additional_fine_rub": 3000000,
        "additional_income_period_years": 4,
        "disqualification_years_optional": 5
      }
    },
    {
      "part": 6,
      "action": "создание и (или) обеспечение функционирования информационного ресурса",
      "resource_scope": [
        "сайт или страница сайта",
        "информационная система",
        "программа для ЭВМ"
      ],
      "knowledge_element": "ресурс заведомо предназначен для незаконных хранения или передачи компьютерной информации, содержащей персональные данные, полученной незаконным путем",
      "maximums": {
        "fine_rub": 700000,
        "income_period_years": 2,
        "disqualification_years_optional": 2,
        "forced_labor_years": 5,
        "imprisonment_years": 5
      }
    }
  ],
  "statutory_notes": [
    {
      "n": 1,
      "rule": "статья 272.1 не распространяется на обработку персональных данных физическими лицами исключительно для личных и семейных нужд"
    },
    {
      "n": 2,
      "rule": "трансграничное перемещение носителей означает ввоз в Российскую Федерацию и (или) вывоз машиночитаемого носителя, на который записана и на котором хранится такая информация"
    }
  ],
  "koap_to_uk_boundary": [
    {
      "gate": "ACTOR",
      "koap_question": "какое действие или бездействие оператора образует кандидатный состав статьи 13.11",
      "uk_question": "какое конкретное физическое лицо совершило уголовно запрещенное действие и выполнены ли общие условия уголовной ответственности",
      "rule": "оператор, потерпевшая организация и предполагаемый исполнитель не сливаются в одного субъекта"
    },
    {
      "gate": "INFORMATION",
      "koap_question": "какие персональные данные и сколько субъектов или идентификаторов затронуто",
      "uk_question": "являются ли сведения компьютерной информацией, содержащей персональные данные",
      "rule": "масштаб административного порога не заменяет предмет уголовного состава"
    },
    {
      "gate": "ORIGIN",
      "koap_question": "какие действия или бездействие оператора повлекли неправомерную передачу или доступ",
      "uk_question": "получена ли информация неправомерным доступом, вмешательством либо иным незаконным путем",
      "rule": "сам факт нахождения данных у третьего лица не доказывает способ их получения"
    },
    {
      "gate": "ACTION",
      "koap_question": "доказана ли причинная связь действия или бездействия оператора с передачей или доступом",
      "uk_question": "доказано ли незаконное использование, передача, сбор или хранение конкретным лицом",
      "rule": "утечка как событие не заменяет действие каждого участника"
    },
    {
      "gate": "CATEGORY",
      "koap_question": "применимы ли части 12-14, 16 или 17 статьи 13.11",
      "uk_question": "применима ли часть 1 либо категория части 2 статьи 272.1",
      "rule": "данные несовершеннолетних являются самостоятельной категорией части 2; категории не выводятся из масштаба"
    },
    {
      "gate": "CRIMINAL_EXCLUSION",
      "koap_question": "для частей 12-14 отсутствуют ли признаки уголовно наказуемого деяния, как прямо требует диспозиция",
      "uk_question": "доказаны ли все обязательные признаки части 1, 2 или 6 и применимые квалификаторы",
      "rule": "проверка уголовных признаков обязательна, но ее результат не предрешается моделью"
    },
    {
      "gate": "SCALE",
      "koap_question": "какой диапазон субъектов и (или) идентификаторов применим",
      "uk_question": "какие элементы состава доказаны независимо от количества записей",
      "rule": "статья 272.1 не устанавливает минимального числа субъектов или идентификаторов"
    },
    {
      "gate": "QUALIFIERS",
      "koap_question": "имеется ли предусмотренная статьей административная повторность",
      "uk_question": "доказаны ли корысть, крупный ущерб, сговор, служебное положение, трансграничность, тяжкие последствия или организованная группа",
      "rule": "административная повторность и уголовные квалифицирующие признаки не взаимозаменяемы"
    },
    {
      "gate": "RESOURCE",
      "koap_question": "является ли ресурс частью инфраструктуры оператора и какие обязанности нарушены",
      "uk_question": "создан или поддерживается ли ресурс, заведомо предназначенный для незаконных хранения или передачи незаконно полученных данных",
      "rule": "обычный сервис, ошибочная публикация или уязвимый сайт не считаются ресурсом части 6 без доказательства предназначения и заведомости"
    },
    {
      "gate": "TIME",
      "koap_question": "какая редакция и санкция действовали на дату административного события",
      "uk_question": "совершено ли деяние после вступления статьи 272.1 в силу 11 декабря 2024 года",
      "rule": "обратная сила и переходные вопросы не решаются по дате обнаружения без даты деяния"
    },
    {
      "gate": "PUBLIC_DANGER",
      "koap_question": "доказаны ли событие, состав и вина административного правонарушения",
      "uk_question": "является ли деяние виновным и общественно опасным; учтена ли статья 14 УК РФ",
      "rule": "формальное совпадение слов не является готовым выводом о преступлении"
    },
    {
      "gate": "PROCEDURE",
      "koap_question": "какое решение принято компетентным органом в административном производстве",
      "uk_question": "какие доказательства получены и оценены в уголовно-процессуальном порядке",
      "rule": "внутренний аудит не подменяет процессуальную квалификацию и судебное решение"
    }
  ],
