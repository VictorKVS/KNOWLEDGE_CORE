    {"id":"P02","case":"66-АД26-2-К8","holding_use":"positive fact-bound example","facts":"persistent fire-safety violations and failure to take possible measures","outcome":"acts left unchanged; continuing classification accepted","non_transfer":"does not make every security weakness or unremediated finding continuing"},
