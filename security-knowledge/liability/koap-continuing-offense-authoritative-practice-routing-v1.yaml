  "authoritative_rules":[
    {"id":"A01","authority":"KOAP_4_5","rule":"the limitation period is selected from the current statutory class before calculating an anchor"},
    {"id":"A02","authority":"PPVS_5_P14","rule":"a continuing offence is an act or omission expressed in prolonged uninterrupted failure or improper performance of a duty imposed by law"},
    {"id":"A03","authority":"PPVS_5_P14","rule":"the duty may also arise from another normative act or a non-normative act such as a prosecutor submission or supervisory order"},
    {"id":"A04","authority":"PPVS_5_P14","rule":"failure to perform such a duty by a fixed deadline means the offence is not continuing"},
    {"id":"A05","authority":"PPVS_5_P14","rule":"for deadline-bound omission the clock runs from expiry of the prescribed period under the stated calculation rule"},
    {"id":"A06","authority":"PPVS_5_P14","rule":"discovery of a continuing offence is the date an official authorized to draw the protocol identified the fact"},
    {"id":"A07","authority":"PPVS_5_P14","rule":"the limitation period has no interruption route under KoAP"},
    {"id":"A08","authority":"PPVS_5_P14","rule":"the residence-transfer suspension is the express statutory route and must be documented exactly"},
    {"id":"A09","authority":"VS_117_AD23_1_K4","rule":"a court must establish the exact duty, its deadline, the responsible subject and the proved conduct; an arbitrary event date is insufficient"},
    {"id":"A10","authority":"VS_66_AD26_2_K8","rule":"persistent violation of an ongoing safety duty may be continuing on proved facts, but that outcome is tied to the offence and evidence examined"},
    {"id":"A11","authority":"PPVS_45_P17","rule":"missing each fixed wage-payment deadline is non-continuing and starts its own statutory calculation"},
    {"id":"A12","authority":"KOAP_1_5","rule":"the prosecuted person does not bear the burden of proving innocence and irremovable doubt is resolved in that person's favor"}
  ],
  "classification_routes":[
    {"id":"C01","route":"FIXED_DEADLINE_OMISSION","result":"COMPLETED_NOT_CONTINUING","required":["DUTY","FIXED_DEADLINE","NONPERFORMANCE"],"anchor":"day following the last day provided for performance under PPVS 5 paragraph 14"},
    {"id":"C02","route":"ONGOING_DUTY_CONTINUOUS_BREACH","result":"POTENTIALLY_CONTINUING","required":["ONGOING_DUTY","UNINTERRUPTED_BREACH","ACTOR","FAULT","OFFENCE_ELEMENTS"],"anchor":"authorized-official discovery only after all gates are proved"},
    {"id":"C03","route":"ONE_TIME_ACTION","result":"COMPLETED","required":["ACTION_TIMESTAMP","OFFENCE_ELEMENTS"],"anchor":"commission route"},
    {"id":"C04","route":"REPEATED_EPISODES","result":"SEPARATE_OR_AGGREGATED_ONLY_BY_EXPRESS_RULE","required":["EPISODE_TIMELINE","OBJECTIVE_SIDE_ANALYSIS"],"boundary":"repetition does not itself create one continuing offence"},
    {"id":"C05","route":"NON_NORMATIVE_ORDER_FIXED_DEADLINE","result":"COMPLETED_NOT_CONTINUING","required":["VALID_ORDER","ADDRESSEE","DEADLINE","NONPERFORMANCE"],"anchor":"fixed-deadline route"},
    {"id":"C06","route":"ONGOING_UNSAFE_OR_UNLAWFUL_STATE","result":"PENDING_UNTIL_DUTY_AND_CONTINUITY_PROVED","required":["STATE_EVIDENCE","ONGOING_DUTY","ABILITY_TO_COMPLY","CONTINUOUS_BREACH"],"boundary":"a condition label alone proves neither offence nor continuity"},
    {"id":"C07","route":"LATE_NOTIFICATION_OR_REPORT","result":"PRESUMPTIVELY_FIXED_DEADLINE_ROUTE","required":["REPORTING_DUTY","EXACT_DEADLINE","SUBMISSION_TIMESTAMP"],"boundary":"must still be tested against the exact offence wording and current law"},
    {"id":"C08","route":"ONGOING_PROCESSING_OR_PUBLICATION","result":"NO_AUTOMATIC_CONTINUING_CLASSIFICATION","required":["EACH_ACT_OR_STATE","LEGAL_BASIS","DUTY","TIME_RANGE","OFFENCE_PART"],"boundary":"ongoing business activity does not decide KoAP classification"},
    {"id":"C09","route":"POST_DISCOVERY_REMEDIATION_FAILURE","result":"SEPARATE_DUTY_ANALYSIS","required":["ORIGINAL_OFFENCE","REMEDIATION_DUTY","DEADLINE_OR_ONGOING_NATURE"],"boundary":"later non-remediation does not retroactively convert the original completed offence"},
    {"id":"C10","route":"UNKNOWN_DUTY_OR_DEADLINE","result":"PENDING_NO_CLOCK_CALCULATION","required":["LEGAL_RESEARCH","FACT_COMPLETION"],"boundary":"do not choose discovery merely because commission date is inconvenient or unknown"}
  ],
  "selected_case_nodes":[
