  "pdn_application_guards":[
    {"id":"PAG01","rule":"select the exact article 13.11 part or other KoAP provision before classifying time"},
    {"id":"PAG02","rule":"a 152-FZ duty with an exact deadline is not converted to continuing merely because compliance remains absent"},
    {"id":"PAG03","rule":"an ongoing processing operation is not automatically one continuing administrative offence"},
    {"id":"PAG04","rule":"SOC, DLP, internal audit, subject complaint and Roskomnadzor discovery timestamps are different evidence events"},
    {"id":"PAG05","rule":"only discovery by an official authorized to draw the relevant protocol satisfies the PPVS 5 discovery node"},
    {"id":"PAG06","rule":"notification, remediation and security-control duties are analyzed separately; one missed duty does not define all others"},
    {"id":"PAG07","rule":"case law from another offence illustrates a test but never proves the PDn classification"},
    {"id":"PAG08","rule":"PDn-specific authoritative-practice exhaustiveness is not asserted"}
  ],
  "decision_gates":[
    {"order":1,"gate":"freeze the offence provision, duty source and article 4.5 text applicable to the alleged act"},
    {"order":2,"gate":"identify the exact duty, addressee, action or omission and all offence elements"},
    {"order":3,"gate":"determine whether the duty is continuous or had a fixed performance deadline"},
    {"order":4,"gate":"build commission, deadline, breach-period, internal-detection, authorized-discovery and protocol timestamps"},
    {"order":5,"gate":"prove uninterrupted breach and continuing ability/duty before selecting the continuing route"},
    {"order":6,"gate":"identify the official's protocol competence before using that person's detection date"},
    {"order":7,"gate":"calculate the statutory period and documented suspension without interruption or evidence-reset inventions"},
    {"order":8,"gate":"preserve contrary facts, uncertainty and the non-transfer limits of selected cases"}
  ],
