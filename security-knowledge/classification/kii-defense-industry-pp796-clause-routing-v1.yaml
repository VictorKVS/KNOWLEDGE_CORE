  "clauses":[
    {"id":"P1","section":"I","normalized_rule":"scope covers defense-industry IS, telecom networks and automated control systems"},
    {"id":"P2","section":"I","normalized_rule":"defines category matching and sector-specific indicator calculation purpose"},
    {"id":"P3","section":"I","normalized_rule":"requires cumulative application of FZ187 article 7, PP127 and PP796"},
    {"id":"P4","section":"I","normalized_rule":"head creates a standing categorization commission under PP127 points 11-13"},
    {"id":"P5","section":"II","normalized_rule":"identify categorization objects and processes whose disruption can disrupt those objects"},
    {"id":"P6","section":"II","normalized_rule":"after category assignment send the Minpromtorg-designated organization copies of commission minutes and categorization acts"},
    {"id":"P7","section":"II","normalized_rule":"routes PP127 positions 1-4 and 6-13.1; position 5 is not included"},
    {"id":"P8","section":"II","normalized_rule":"dependent object receives the highest category from its own PP127 result or the object on which it depends"},
    {"id":"P9","section":"II","normalized_rule":"minimum reconsideration cadence is annual for no-category, two years for category III, three years for category II and five years for category I"},
    {"id":"P10","section":"III","normalized_rule":"sector signs are defense-order use, military-representative acceptance or support of a declared hazardous production facility"},
    {"id":"P11","section":"III","normalized_rule":"for each object evaluate sector-sign match, incident likelihood and consequence scale"},
    {"id":"P12","section":"IV","normalized_rule":"position 1 uses inspections, personnel and safety documentation, consequence modeling, incident data, hazardous factors, protected zones and exposed-person and consumer estimates"},
    {"id":"P13","section":"IV","normalized_rule":"position 2 uses the worst life-support disruption scenario and territorial and population subpositions"},
    {"id":"P14","section":"IV","normalized_rule":"position 3 calculation is delegated to transport sector features"},
    {"id":"P15","section":"IV","normalized_rule":"position 4 calculation is delegated to communications sector features"},
    {"id":"P16","section":"IV","normalized_rule":"position 6 uses contract evidence and state-body or federal-law-organization function support"},
    {"id":"P17","section":"IV","normalized_rule":"position 7 uses contract evidence and the level of the affected international treaty process"},
    {"id":"P18","section":"IV","normalized_rule":"position 8 is subject damage as a percentage of average five-year annual income"},
    {"id":"P19","section":"IV","normalized_rule":"computer-incident damage is the sum of object costs, victim compensation and documented prior-incident damage"},
    {"id":"P20","section":"IV","normalized_rule":"average annual income uses the printed five-year summation expression"},
    {"id":"P21","section":"IV","normalized_rule":"calculated position 8 value is compared against PP127 and yields category or no-category conclusion"},
    {"id":"P22","section":"IV","normalized_rule":"object cost is object value plus commissioning work plus other object expenditure"},
    {"id":"P23","section":"IV","normalized_rule":"victim compensation uses four printed per-person sums and victim counts from industrial-safety declaration or maximum-consequence expertise"},
    {"id":"P24","section":"IV","normalized_rule":"position 9 is federal-budget loss as a percentage of average forecast annual federal-budget revenue"},
    {"id":"P25","section":"IV","normalized_rule":"average forecast federal-budget revenue uses the exact printed summation and divisor; its index and divisor semantics are not silently repaired"},
    {"id":"P26","section":"IV","normalized_rule":"reduction of federal-budget payments equals position 8 incident damage multiplied by the payment coefficient"},
    {"id":"P27","section":"IV","normalized_rule":"payment coefficient is average federal-budget tax payments divided by average subject income for the previous three years"},
    {"id":"P28","section":"IV","normalized_rule":"average subject income uses the printed three-year summation divided by three"},
    {"id":"P29","section":"IV","normalized_rule":"calculated position 9 value is compared against PP127 and yields category or no-category conclusion"},
    {"id":"P30","section":"IV","normalized_rule":"positions 10-10.7 calculations are delegated to banking and financial-market sector features"},
    {"id":"P31","section":"IV","normalized_rule":"position 11 uses the worst environmental-impact scenario by affected territories"},
    {"id":"P32","section":"IV","normalized_rule":"position 11 category uses territory boundaries and population subpositions"},
    {"id":"P33","section":"IV","normalized_rule":"position 12 uses contract evidence and the level of the affected command post or situation center"},
    {"id":"P34","section":"IV","normalized_rule":"position 13(a) uses the printed defense-order output-reduction formula"},
    {"id":"P35","section":"IV","normalized_rule":"if the printed inner result is not positive, further point-34 calculation stops"},
    {"id":"P36","section":"IV","normalized_rule":"maximum defense-order output equals maximum production rate times contract execution time"},
    {"id":"P37","section":"IV","normalized_rule":"incident-period output equals documented incident-remediation time times maximum production rate"},
    {"id":"P38","section":"IV","normalized_rule":"position 13(b) uses the printed ratio of normal to abnormal unit-production time"},
    {"id":"P39","section":"IV","normalized_rule":"abnormal time is the sum of section-level abnormal-operation times; full-stop with no alternative blocks point-37 and point-38 calculations"},
    {"id":"P40","section":"IV","normalized_rule":"position 13.1 uses contract evidence and exact status in the lead contractor cooperation chain"}
  ],
