  "formula_status": {
    "point16_position8": {
      "state": "VERIFIED_VISUAL_TRANSCRIPTION_PRESERVED_PDF_PRIMARY_HASH_PENDING",
      "normalized_formula": "P8 = abs((D_actual - D_average) / D_average) * 100",
      "denominator_guard": "D_average must be non-zero; PP402 does not supply a divide-by-zero substitution",
      "verified_variables": [
        "assessed-period income including taxes/excises/mandatory payments",
        "five-year average annual income"
      ]
    },
    "point18_position9": {
      "state": "VERIFIED_VISUAL_TRANSCRIPTION_PRESERVED_PDF_PRIMARY_HASH_PENDING",
      "normalized_formula": "P9 = delta_budget_payments / B_average * 100",
      "denominator_guard": "B_average must be non-zero; PP402 does not supply a divide-by-zero substitution",
      "verified_variables": [
        "reduced payments to budget system",
        "planned three-year average annual federal-budget income"
      ]
    },
    "transcription_basis": "visual inspection of pages 8 and 10 of the preserved ten-page PDF linked from the PP402 source page",
    "official_pdf_transport": "PENDING_TIMEOUT_NO_IMMUTABLE_PRIMARY_HASH",
    "guard": "do not remove the absolute-value bars from P8, swap denominators, infer divide-by-zero handling or treat the preserved-copy URL as an official immutable hash"
  },
