  "clauses": [
    {
      "id": "P1",
      "section": "I",
      "normalized_rule": "purpose, sector significance feature and sector calculation route"
    },
    {
      "id": "P2",
      "section": "I",
      "normalized_rule": "subjects: state bodies, state institutions and Russian legal entities with lawful control of systems/networks/ASU in communications, plus Russian legal entities enabling their interaction"
    },
    {
      "id": "P3",
      "section": "I",
      "normalized_rule": "cumulative legal route through FZ187 article 7, PP127 Rules/indicators and RP360 typical objects"
    },
    {
      "id": "P4",
      "section": "I",
      "normalized_rule": "sector significance feature: subscriber count including legal-entity service users served through the assessed object"
    },
    {
      "id": "P5",
      "section": "II",
      "normalized_rule": "permanent commission and conditional MinTsifry/Roskomnadzor representation routes"
    },
    {
      "id": "P6",
      "section": "II",
      "normalized_rule": "commission models harm from a computer incident caused by a computer attack using point-10 inputs and sequential process/harm analysis"
    },
    {
      "id": "P7",
      "section": "II",
      "normalized_rule": "commission records applicability or impossibility of applying each relevant indicator and its values"
    },
    {
      "id": "P8",
      "section": "II",
      "normalized_rule": "conditional indicator applicability matrix for position 4a, 4b, 6, 8 and 9"
    },
    {
      "id": "P9",
      "section": "II",
      "normalized_rule": "other PP127 indicators considered only in the case referenced by PP127 Rules point 14(2)"
    },
    {
      "id": "P10",
      "section": "II",
      "normalized_rule": "additional inputs: available technical/project documentation and attack/incident/consequence evidence"
    },
    {
      "id": "P11",
      "section": "III",
      "normalized_rule": "two methods: worst-case quantitative/qualitative calculation and scenario modelling"
    },
    {
      "id": "P12",
      "section": "III",
      "normalized_rule": "category assigned by highest indicator result across the permitted methods"
    },
    {
      "id": "P13",
      "section": "III",
      "normalized_rule": "position 4a subscriber calculation per communications service and aggregate category decision across service-specific results"
    },
    {
      "id": "P14",
      "section": "III",
      "normalized_rule": "position 4b based on level and count of affected state bodies or listed organizations"
    },
    {
      "id": "P15",
      "section": "III",
      "normalized_rule": "position 6 evaluates probability of failure/interruption of assigned public function due to unavailable supported process"
    },
    {
      "id": "P16",
      "section": "III",
      "normalized_rule": "position 8 percentage: absolute deviation of assessed-period income from five-year average annual income, divided by that five-year average annual income, multiplied by 100"
    },
    {
      "id": "P17",
      "section": "III",
      "normalized_rule": "position 8 sources include five-year average federal taxes, five-year average annual income, permitted downtime and recovery time; 10-day fallback only if documents and five-year statistics are absent"
    },
    {
      "id": "P18",
      "section": "III",
      "normalized_rule": "position 9 percentage: reduced payments to the budget system divided by planned three-year average annual federal-budget income, multiplied by 100"
    },
    {
      "id": "P19",
      "section": "III",
      "normalized_rule": "position 9 inputs and cost components include budget law, tax data, incident response, labor/fixed costs, overtime, penalties, maximum service interruption and profit reduction"
    }
  ],
