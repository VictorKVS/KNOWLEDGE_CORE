        "CATEGORY_2",
        "CATEGORY_3",
        "NO_CATEGORY"
      ],
      "rules": [
        "category 1 is highest and category 3 is lowest",
        "calculate applicable indicator values using PP127 and sector features",
        "assign the highest category produced by the indicators",
        "if one indicator produces category 1 other indicators need not be calculated",
        "if no indicator and value is met, no significance category is assigned",
        "review at least once every five years unless sector features set another period and on specified changes"
      ],
      "security_requirements_bridge": "FSTEC239 applies to significant KII objects according to assigned category; it does not create a GIS or ISPDn classification"
