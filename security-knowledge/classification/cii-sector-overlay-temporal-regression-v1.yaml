schema_version: "1.1"
id: CII-SECTOR-OVERLAY-TEMPORAL-REGRESSION-V1
checked_at: "2026-08-14"
source_registry: security-knowledge/classification/cii-sector-overlay-effective-dates-2026-verified.yaml
purpose: >-
  Verify boundary behavior so a 2026 sector overlay is never routed before its effective date and is routed on/after it when sector applicability is confirmed.

fixtures:
