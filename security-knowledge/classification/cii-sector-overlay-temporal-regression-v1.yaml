    facts: {sector: ATOMIC_ENERGY, event_date: "2026-01-23"}
    expected: {status: BASE_ONLY_WITH_HISTORICAL_REVIEW, sources: [PP_RF_127_2018]}
  - id: CII-TIME-002
    facts: {sector: ATOMIC_ENERGY, event_date: "2026-01-24"}
    expected: {status: ROUTE, sources: [PP_RF_127_2018, PP_RF_4_2026]}
