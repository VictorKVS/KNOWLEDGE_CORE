overlay_id: FSTEC-ORDERS-254-247-2025-KII-AMENDMENT-OVERLAY-V1
status: VERIFIED_PRIMARY_IMMUTABLE
as_of: "2026-08-18"
effective_from: "2025-09-01"
source_manifest: "security-knowledge/evidence/primary-artifacts-fstec-254-247-2025.json"
scope_guard: >-
  This is an amendment delta backed by the preserved official scans. Apply it only
  together with the current consolidated versions of FSTEC Orders 227/2017 and
  236/2017; it is not a standalone consolidated procedure or form.

order_254_2025:
  amends: "FSTEC Order 227/2017, procedure for the register of significant KII objects"
  exact_changes:
    - clause: "subparagraph a of paragraph 5"
      requirement: >-
        Register data about a significant KII object include its name, domain name,
        and network address.
    - clause: "paragraph 6"
      requirement: "Each registered significant KII object receives a registration number in the form XXXXXX/X/XX/X."
      segments:
        first: "000001-999999 sequential object number"
        second:
          meaning: "federal district where the object is located"
          codes:
            "1": "Central"
            "2": "Northwestern"
            "3": "Southern"
            "4": "North Caucasian"
            "5": "Volga"
            "6": "Ural"
            "7": "Siberian"
            "8": "Far Eastern"
        third:
          meaning: "two-digit sector/activity code"
          codes:
            "01": "healthcare"
            "02": "science"
            "03": "transport"
            "04": "communications"
            "05": "banking and other financial-market spheres"
            "06": "energy"
            "07": "nuclear energy"
            "08": "defence industry"
            "09": "rocket and space industry"
            "10": "mining industry"
            "11": "metallurgical industry"
            "12": "chemical industry"
            "13": "fuel and energy complex excluding energy"
            "14": "state registration of rights to immovable property and transactions with it"
        fourth:
          meaning: "significant KII object type"
          codes:
            "А": "information system"
            "Б": "automated control system for technological/industrial processes"
            "В": "information and telecommunication network"
      multi_sector_or_district_rule: >-
        Use the primary sector or federal district in the registration number and
        place the other sectors/districts in the register column for additional data.
    - clause: "second paragraph of paragraph 12"
      requirement: >-
        Information previously worded as information that may be supplied by
        subjects is changed to information that is supplied; frequency is changed
        from quarterly to monthly.

order_247_2025:
  amends: "FSTEC Order 236/2017, form for sending KII categorization results"
  exact_changes:
    - form_item: "1.3"
      requirement: "Sector/activity in which the subject performs functions or activities involving the object."
    - form_item: "1.7"
      requirement: >-
        Name of the typical sectoral KII object included in the list of typical
        sectoral KII objects under article 6 part 7.2 of Federal Law 187-FZ, if applicable.
    - form_item: "1.8"
      requirement: >-
        Domain name and external network address of information resources owned by
        or used by the organization/person.
    - form_item: "4.3"
      requirement: >-
        Element/component where the object is operated: workstation/client data
        application, server equipment, technological/industrial equipment including
        actuators, or another element/component.
    - form_item: "5.1"
      requirement: >-
        Names of software and hardware, including model and manufacturer details for
        user computers, servers, telecommunication equipment, wireless-access devices,
        other equipment and their quantity.
    - form_item: "5.4"
      requirement: >-
        Information-security tools used, including those embedded in general-purpose
        application software, with model/manufacturer and certificate details or
        information that conformity-assessment documents or security tools are absent.

validation_guards:
  - "Do not infer that every KII object has a significance category; the form also covers absence of a need to assign one."
  - "Do not treat the new form fields as automatic category-assignment criteria."
  - "Do not use a secondary summary where the preserved primary scan is available."
  - "Do not backdate the amendment: both orders operate from 2025-09-01."
