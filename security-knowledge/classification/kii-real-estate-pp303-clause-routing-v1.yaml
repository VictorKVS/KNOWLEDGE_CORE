  "pp127_indicator_routes": [
    {"indicator":"1","pp127_position":"5(a)","basis":"maximum permissible loss of access to a public service, measured through restoration procedures after a computer incident","unit":"hours"},
    {"indicator":"2","pp127_position":"5(b)","basis":"printed ratio using statutory service-delivery time and restoration-related outage; PP303 then accepts this value equal to indicator 1","unit":"percent, with equality rule preserved"},
