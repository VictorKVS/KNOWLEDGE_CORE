  "clauses": [
    {"id":"P1","section":"I","normalized_rule":"defines sector categorization, significance matching and sector-specific calculation scope"},
    {"id":"P2","section":"I","normalized_rule":"requires cumulative application of FZ187 article 7, PP127 rules and indicators, and PP303"},
    {"id":"P3","section":"I","normalized_rule":"subjects are Rosreestr and the public-law company Roskadastr"},
    {"id":"P4","section":"I","normalized_rule":"objects are the federal state information system for maintaining EGRN and the technical and software means ensuring its operation"},
    {"id":"P5","section":"I","normalized_rule":"each subject categorizes objects it lawfully controls by ownership, lease or another lawful basis"},
    {"id":"P6","section":"II","normalized_rule":"routes PP127 positions 5(a), 5(b), 6 and 9 to indicators 1 through 4 respectively"},
    {"id":"P7","section":"II","normalized_rule":"consequences are assessed with the sector sign: EGRN operation for registration, cadastral accounting, register maintenance and provision of EGRN information"},
    {"id":"P8","section":"II","normalized_rule":"subject calculates applicable indicators and assigns a category using PP127, PP303 and applicable typical-sector-object lists"},
    {"id":"P9","section":"II","normalized_rule":"no category is assigned only when the object meets none of the applicable PP127 indicator values"},
    {"id":"P10","section":"III","normalized_rule":"indicator 1 is the maximum permissible service-access outage measured by time to restore normal object operation and information access after a computer incident, in hours"},
    {"id":"P11","section":"III","normalized_rule":"indicator 2 uses the printed Tpu and Tprostoya formula and its value is accepted equal to indicator 1"},
    {"id":"P12","section":"III","normalized_rule":"for indicator 3, second significance category applies when object disruption can cause the subject's assigned public function or power to cease or be disrupted"},
    {"id":"P13","section":"III","normalized_rule":"indicator 4 concerns federal-budget damage from reduced payments for public services; the amount is determined by expert analysis of maximum possible economic damage"},
    {"id":"P14","section":"III","normalized_rule":"indicator 4 and reduced-budget-receipts amount use the two printed formulas and their defined three-year averages and maximum disruption time"}
  ],
