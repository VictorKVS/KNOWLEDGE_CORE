    {"indicator":"4","pp127_position":"9","basis":"federal-budget damage from reduced receipts for the subject's public services","unit":"percent of averaged projected annual federal-budget revenue over the planned three-year period"}
  ],
  "formulas": [
    {"id":"F1","point":11,"printed":"Показатель 2 = ((Тпу − Тпростоя) / Тпу) × 100%","variables":{"Тпу":"statutory service-delivery time in hours","Тпростоя":"time during which the service cannot be delivered because normal object operation and information access are being restored after a computer incident, in hours"},"mandatory_post_rule":"THIS_VALUE_IS_ACCEPTED_EQUAL_TO_INDICATOR_1"},
    {"id":"F2","point":14,"printed":"Показатель 4 = (ΔДБ / Бср) × 100%","variables":{"ΔДБ":"reduced federal-budget receipts if the object ceases or is disrupted, rubles","Бср":"total projected annual federal-budget revenue averaged over the planned three-year period, rubles"}},
    {"id":"F3","point":14,"printed":"ΔДБ = (ГУ / 365 суток) × Т","variables":{"ГУ":"projected annual receipts from the subject's public services associated with the object, averaged over the planned three-year period, rubles","Т":"maximum permissible object cessation or disruption time, days"}}
