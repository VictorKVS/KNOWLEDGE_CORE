order_254_2025:
  amends: "FSTEC Order 227/2017"
  verified_changes:
    - id: F254-C1
      target: "Order 227 point 5 subpoint a"
      current_semantics: "Registry information about a significant CII object includes its name, domain name and network address."
      effective_from: "2025-09-01"
    - id: F254-C2
      target: "Order 227 point 6"
      current_semantics: "Registration number structure is changed; current format is groups separated by slashes: XXXXXX/X/XX/X."
      effective_from: "2025-09-01"
    - id: F254-C3
      target: "Order 227 point 12"
      current_semantics: "Registry information is sent to GosSOPKA at least monthly; specified state bodies/Russian legal entities receive relevant-sector registry information monthly or on request."
      effective_from: "2025-09-01"
  guardrails:
    - "Do not use pre-2025 registry field semantics for records effective on/after 2025-09-01."
    - "Do not infer that every registry recipient receives the entire registry; sector/competence limitation applies where specified."

order_247_2025:
  amends: "FSTEC Order 236/2017 categorization-result form"
  verified_changes:
    - id: F247-C1
      target: "Form item 1.3"
      current_semantics: "Record the sphere/field of activity in which the subject performs functions/powers or operates under Article 2(8) of 187-FZ."
    - id: F247-C2
      target: "New form item 1.7"
      current_semantics: "Record the name of the typical sectoral CII object from the lists under Article 6(2)(4) of 187-FZ to which the object corresponds."
    - id: F247-C3
      target: "New form item 1.8"
      current_semantics: "Record domain name and external network address of information resources belonging to or used by the body/organization."
    - id: F247-C4
      target: "Form item 4.3"
      current_semantics: "Record the object element/component operated by a person, including whole object, data center, server equipment, technological/production equipment or other component."
    - id: F247-C5
      target: "Form item 5.1"
      current_semantics: "Record names, models/manufacturers and quantity of relevant hardware/software-hardware means including user computers, servers, telecom equipment, wireless access means and others."
    - id: F247-C6
      target: "Form item 5.4"
      current_semantics: "Record applied information-security means, including embedded means, with model/manufacturer and conformity-assessment certificate/document details, or information that assessment was not performed, or that security means are absent."
  effective_from: "2025-09-01"
  guardrails:
    - "Typical-sector-object matching is a required reporting datum where applicable; it is not by itself proof of significance/category."
    - "Absence/non-assessment of a security means is reportable data in the current form and must not be silently normalized to a certified-control state."

