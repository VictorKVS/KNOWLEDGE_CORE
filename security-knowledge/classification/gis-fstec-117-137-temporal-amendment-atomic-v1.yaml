schema_version: "1.0"
id: RU-FSTEC117-137-GIS-TEMPORAL-AMENDMENT-ATOMIC-V1
title: FSTEC Orders 117/2025 and 137/2026 GIS temporal amendment router
checked_at: "2026-09-05"
scope: >-
  Current and future-effective non-cryptographic protection requirements for state information
  systems and the other public-sector information systems named in FSTEC Order No. 117. Order
  No. 17 is preserved only for decisions before 1 March 2026. Order No. 137 general amendments
  are current from 1 September 2026, while amendment item 7 remains future-effective until
  1 March 2027.

