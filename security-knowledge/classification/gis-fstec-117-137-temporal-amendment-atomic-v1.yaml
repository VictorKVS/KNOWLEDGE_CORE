point_32_temporal_semantics:
  before_2027_03_01:
    protected_indicator_interval: {indicator: KZI, maximum_interval_months: 6}
    maturity_indicator_interval: {indicator: PZI, maximum_interval_years: 2}
    nonconformity_head_notice: {indicators: [KZI, PZI], maximum_days: 3, unit: CALENDAR_DAYS}
    fstec_results_submission: {indicators: [KZI, PZI], maximum_days: 5, unit: WORKING_DAYS}
  from_2027_03_01:
    protected_indicator_interval: {actor: OPERATOR_OR_INFORMATION_HOLDER, indicator: KZI, maximum_interval_months: 6}
    contractor_maturity_assessment:
      actor: CONTRACTOR
      indicator: UZI
      initial_trigger: BEFORE_ACCESS_TO_SYSTEM_OR_INFORMATION_OR_INFORMATION_TRANSFER
      recurring_maximum_interval_years: 2
    nonconformity_head_notice: {indicator: KZI, maximum_days: 3, unit: CALENDAR_DAYS}
    fstec_results_submission: {indicator: KZI, maximum_days: 5, unit: WORKING_DAYS}

