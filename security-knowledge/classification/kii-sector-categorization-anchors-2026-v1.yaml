status: VERIFIED_WEB_IDENTITY
as_of: "2026-08-17"
purpose: >
  Register confirmed 2026 Russian Government acts establishing sector-specific categorization features for KII.
  This record intentionally captures only identity, publication metadata and sector scope proven by authoritative
  official publication listings. It does not infer internal thresholds, criteria, deadlines or applicability details
  that require exact document text/bytes.

routing_rule:
  statement: >
    When an organization/object belongs to a sector for which a sector-specific KII categorization act exists,
    the categorization engine must route to that sector act as a domain-specific input in addition to the generic
    KII framework. The presence of an act alone does not prove that a particular system is a KII object or that a
    significance category applies.
  fail_closed: true
  forbidden_shortcut: "sector membership -> automatic KII significance/category"

