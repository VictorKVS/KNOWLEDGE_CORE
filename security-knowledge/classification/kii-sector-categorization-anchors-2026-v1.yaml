knowledge_effects:
  - "Sector classification must be modeled as an explicit routing dimension, not inferred only from generic KII criteria."
  - "A future organization digital twin should re-evaluate categorization paths when sector or supported process changes."
  - "Exact internal sector criteria remain NOT_PROVEN in this record until primary document text/bytes are preserved and atomized."

not_proven:
  - "effective-date details not visible in authoritative listing metadata"
  - "internal thresholds and sector indicators"
  - "specific object-type lists"
  - "deadlines or procedural deviations from the generic categorization framework"
  - "automatic applicability to any named organization or system"

