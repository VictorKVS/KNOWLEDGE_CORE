verified_cii_invariant:
  id: CII-CAT-INVARIANT-001
  statement: >-
    A match to a current typical-sector-object type routes an object into categorization but does not,
    by itself, assign significance category 1, 2 or 3; significance criteria/indicator values and all
    applicable sector-specific categorization features must be evaluated.
  artifact: security-knowledge/classification/cii-187fz-58fz-current-transition-and-decision-semantics-2026-verified.yaml
red_team_blocks:
  - PP 127 must be audited against all current amendments and 2025-2026 sector-specific categorization acts before current decision logic is claimed complete.
  - No classification result may be derived without storing input facts and provenance.
  - Reassessment triggers and effective dates must be versioned.
  - A typical-sector-object match must never be represented as an automatic significance-category assignment.
