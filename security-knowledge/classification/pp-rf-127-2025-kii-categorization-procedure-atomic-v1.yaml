    - {id: "10е", data: INFORMATION_SECURITY_THREATS_AND_AVAILABLE_HISTORICAL_INCIDENT_DATA_FOR_SAME_OBJECT_TYPE}
    - {id: "10ж", data: TYPICAL_SECTORAL_KII_OBJECT_LISTS}
    - {id: "10з", data: OTHER_DATA_DEFINED_BY_SECTORAL_CATEGORIZATION_FEATURES}
