verified_rules:
  - id: CII-58FZ-001
    statement: Federal Law No. 58-FZ entered into force on 2025-09-01.
    legal_locator: FZ 58-FZ, article 2 part 1
    evidence: FZ_58_2025
    verification_status: VERIFIED

  - id: CII-58FZ-002
    statement: >-
      Until the lists of typical sectoral CII objects and sector-specific categorization features
      contemplated by article 6 part 2 paragraphs 4 and 5 of Federal Law No. 187-FZ are established,
      categorization continues under the Government-established categorization procedure.
    legal_locator: FZ 58-FZ, article 2 part 2
    evidence: FZ_58_2025
    verification_status: VERIFIED

  - id: CII-187FZ-006-004
    statement: The Government establishes lists of typical sectoral CII objects.
    legal_locator: FZ 187-FZ, article 6 part 2 paragraph 4
    evidence: FZ_187_2017_CURRENT
    verification_status: VERIFIED

  - id: CII-187FZ-006-005
    statement: >-
      The Government establishes sector-specific categorization features that define how conformity
      to significance criteria/indicators is established and how indicator values are calculated with
      sector-specific operating characteristics taken into account.
    legal_locator: FZ 187-FZ, article 6 part 2 paragraph 5
    evidence: FZ_187_2017_CURRENT
    verification_status: VERIFIED

  - id: CII-PP127-003-CURRENT
    statement: >-
      Under current PP RF No. 127, categorization applies to CII objects corresponding to types of
      information systems, information-telecommunication networks and automated control systems
      included in the lists of typical sectoral CII objects.
    legal_locator: PP RF 127, Rules, paragraph 3, as amended by PP RF 1762 of 2025
    evidence: [PP_RF_1762_2025, PP_RF_127_2018_CURRENT]
    verification_status: VERIFIED

  - id: CII-PP127-CATEGORY-NOT-AUTOMATIC
    statement: >-
      A match to a type in the typical-sector-object list is a routing condition into categorization;
      it is not sufficient by itself to assign significance category 1, 2 or 3. Assignment or non-assignment
      of a category follows evaluation against significance criteria/indicator values under PP RF No. 127
      and applicable sector-specific categorization features.
    legal_locators:
      - PP RF 127, Rules, paragraphs 3-6 and 6(1), current text
      - FZ 187-FZ, article 6 part 2 paragraphs 4-5
    evidence: [PP_RF_127_2018_CURRENT, PP_RF_1762_2025, FZ_187_2017_CURRENT]
    verification_status: VERIFIED_DERIVED_FROM_EXPLICIT_RULE_SEQUENCE

machine_decision_invariant:
  id: CII-CAT-INVARIANT-001
  rule: >-
    typical_sector_object_match=true MUST NOT directly emit SIGNIFICANCE_CATEGORY_1,
    SIGNIFICANCE_CATEGORY_2 or SIGNIFICANCE_CATEGORY_3.
  required_next_stage: SIGNIFICANCE_CRITERIA_AND_SECTOR_FEATURE_EVALUATION
  allowed_intermediate_state: CATEGORIZATION_REQUIRED
  fail_closed_states:
    - NEEDS_CURRENT_LIST_VERSION
    - NEEDS_SECTOR_OVERLAY
    - NEEDS_SIGNIFICANCE_INPUT_FACTS
    - NOT_PROVEN

regression_expectations:
  - id: CII-CAT-SEM-001
    facts:
      cii_subject_confirmed: true
      typical_sector_object_match: true
      significance_input_facts_complete: false
    expected:
      status: NEEDS_SIGNIFICANCE_INPUT_FACTS
      category: null

  - id: CII-CAT-SEM-002
    facts:
      cii_subject_confirmed: true
      typical_sector_object_match: false
    expected:
      status: NOT_ROUTED_TO_CATEGORIZATION_BY_CURRENT_PP127_PARAGRAPH_3
      category: null

  - id: CII-CAT-SEM-003
    facts:
      cii_subject_confirmed: true
      typical_sector_object_match: true
      significance_input_facts_complete: true
      significance_threshold_met: false
    expected:
      status: NO_SIGNIFICANCE_CATEGORY
      category: null

red_team_guardrails:
  - Do not equate inclusion in a typical-sector-object list with automatic legal status as a significant CII object.
  - Do not use a stale version of Government Order No. 360-r or a sector overlay without decision-date routing.
  - Do not apply a sector-specific formula unless the sector applicability and effective date are proven.
  - Current amendment dependencies of Federal Law No. 58-FZ must be checked independently of the original 2025 publication.
  - The primary official publication identity for Federal Law No. 265-FZ remains to be pinned in this artifact before PRIMARY_OFFICIAL verification is claimed.

