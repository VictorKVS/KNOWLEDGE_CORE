status: VERIFIED_BOUNDED_CURRENT_LEGAL_SEMANTICS
purpose: >-
  Pin the statutory transition introduced by Federal Law No. 58-FZ and prevent
  a categorization engine from equating a match to the Government list of typical
  sectoral CII objects with automatic assignment of a significance category.

