    {
      "id": "P41",
      "section": "III",
      "normalized_rule": "position 9 percentage formula with Pavg, Smax, U and D; exact image operators pending"
    },
    {
      "id": "P42",
      "section": "III",
      "normalized_rule": "Pavg formula uses up to three years; shorter available periods are progressively completed to three years"
    },
    {
      "id": "P43",
      "section": "III",
      "normalized_rule": "annual Si is the maximum among the specified internal limit, regulatory threshold and actual twelve-month downtime/degradation measure"
    },
    {
      "id": "P44",
      "section": "III",
      "normalized_rule": "Smax is the maximum annual budget-system contribution over three years"
    },
