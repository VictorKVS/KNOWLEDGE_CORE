  industry_significance:
    clause: 7
    semantics:
      - "Operation of FGIS EGRN for state registration of rights and transactions."
      - "State cadastral registration of real estate."
      - "Maintenance of EGRN."
      - "Provision of information contained in EGRN."
  assignment_rule:
    clause: 8
    rule: "Calculate applicable indicators and assign category using criteria, values, sector feature, PP 127 and statutory typical-sector-object lists."
  no_category:
    clause: 9
    rule: "If the object matches no significance indicator and value, no significance category is assigned."
calculation_semantics:
  indicator_1:
    clause: 10
    value: "Restoration and processed-information access recovery time after a computer incident, in hours."
  indicator_2:
    clause: 11
    source_notation: "Показатель 2 = (Тпу − Тпростоя) / Тпу × 100%"
    formula: "((T_service - T_downtime) / T_service) * 100"
    absolute_value_operator: absent
    unit: percent
    variables:
      T_service: "Statutory state-service delivery time under the Federal Law on State Registration of Real Estate, hours."
      T_downtime: "State-service downtime caused by restoration and information-access recovery, hours; equals indicator 1."
    validation:
      - "T_service must be greater than zero."
      - "A zero or missing T_service denominator is not defined by the act and must fail closed."
      - "Inputs and result must not be silently clamped; anomalous values require review."
  indicator_3:
    clause: 12
    rule: "Category II is assigned when cessation or disruption of the object may cause the subject to cease or disrupt performance of its assigned function/power."
  indicator_4:
    clauses: [13, 14]
    method: "Expert assessment of maximum possible economic harm from cessation or disruption after a computer incident."
    source_notation: "Показатель 4 = ΔДБ / Бср × 100%"
    formula: "(delta_budget_revenue / average_federal_budget_revenue) * 100"
    absolute_value_operator: absent
    delta_source_notation: "ΔДБ = ГУ / (365 суток) × T"
    delta_formula: "(annual_state_service_revenue / 365) * max_disruption_days"
    unit: percent
    variables:
      delta_budget_revenue: "Reduction of Russian Federation budget collections, rubles."
      average_federal_budget_revenue: "Forecast annual federal-budget revenue averaged over the planned three-year period, rubles."
      annual_state_service_revenue: "Forecast annual receipts from related state services averaged over the planned three-year period, rubles."
      max_disruption_days: "Maximum permissible cessation/disruption time, days."
    validation:
      - "average_federal_budget_revenue must be greater than zero."
      - "A zero or missing average_federal_budget_revenue denominator is not defined by the act and must fail closed."
      - "annual_state_service_revenue and max_disruption_days must be non-negative."
      - "The planned three-year periods are calculation periods, not evidence-retention terms."
