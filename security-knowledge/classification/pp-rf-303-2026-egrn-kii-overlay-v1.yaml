    clause: 12
    rule: "Category II is assigned when cessation or disruption of the object may cause the subject to cease or disrupt performance of its assigned function/power."
  indicator_4:
    clauses: [13, 14]
    method: "Expert assessment of maximum possible economic harm from cessation or disruption after a computer incident."
    inputs:
      - "Reduction of federal-budget collections."
      - "Average forecast annual federal-budget revenue over the planned three-year period."
      - "Average forecast annual receipts from the subject's state services related to the object over the planned three-year period."
      - "Maximum permissible cessation/disruption time in days."
