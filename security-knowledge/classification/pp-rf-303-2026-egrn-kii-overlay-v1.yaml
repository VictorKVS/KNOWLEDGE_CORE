  indicator_2:
    clause: 11
    inputs:
      - "Statutory service-delivery time under the Federal Law on State Registration of Real Estate, in hours."
      - "Service downtime caused by restoration and information-access recovery after a computer incident, in hours."
    binding: "Downtime input is equal to indicator 1."
