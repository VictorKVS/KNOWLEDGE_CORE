scope_note: >-
  This model covers the original Order 117 text effective on 2026-08-20: clause 34,
  clauses 38, 53, 55, 57 and 62-73, plus classification dependencies already modeled
  from the appendix. It is not a claim that all clauses 1-73 have been atomized.

