applicability_gate:
  - Establish CII-subject applicability from current law and organization facts.
  - Determine applicable sector or sectors before running categorization logic.
  - Apply PP 127 as the base layer plus every applicable current sector overlay.
  - If sector applicability or current overlay inventory is unresolved, return NEEDS_SECTOR_REVIEW.
  - Store legal version and effective date for every applied source.
  - Do not infer that the five verified anchors are exhaustive for all sectors or for the whole of 2026.
red_team_status:
  complete_sector_inventory: false
  proven_anchor_count: 5
  reason: Five 2026 Government overlay anchors are proven from the official publication portal with sector and publication metadata, but an exhaustive 2025-2026 inventory and clause-level extraction have not yet been proven.
  blocker: Exhaustive overlay inventory, effective-date analysis and clause-level extraction are required before family-wide promotion.
provenance_notes:
  - Official publication metadata is sufficient to prove act identity and publication date, not the full operative decision logic.
  - Clause-level VERIFIED rules require exact source locators and quotes from the act text.
