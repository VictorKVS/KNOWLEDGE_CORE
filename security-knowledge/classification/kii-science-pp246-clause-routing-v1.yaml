  "clauses": [
    {
      "id": "P1",
      "section": "I",
      "normalized_rule": "scope, category assignment and sector calculation purpose"
    },
    {
      "id": "P2",
      "section": "I",
      "normalized_rule": "science-sector subjects are state bodies and state institutions with lawful control of science IS, telecom networks or control systems, plus state bodies and state institutions enabling their interaction"
    },
    {
      "id": "P3",
      "section": "I",
      "normalized_rule": "sector specificity and applicable typical-sector-object lists must be considered"
    },
    {
      "id": "P4",
      "section": "I",
      "normalized_rule": "cumulative application of FZ187 article 7, PP127 rules and this act"
    },
    {
      "id": "P5",
      "section": "I",
      "normalized_rule": "computer incident and computer attack retain the meanings established by FZ187"
    },
    {
      "id": "P6",
      "section": "II",
      "normalized_rule": "three-stage process: identify systems matching typical objects, assess possible incident consequences against PP127 indicators, then assign a category or document no-category"
    },
    {
      "id": "P7",
      "section": "II",
      "normalized_rule": "modernization may result in subject-decided division into several separate KII objects; division is not automatic or mandatory"
    },
    {
      "id": "P8",
      "section": "II",
      "normalized_rule": "a non-typical object whose possible incident consequences meet PP127 thresholds is assigned the most suitable category and reported with a proposal to supplement typical-object lists"
    },
    {
      "id": "P9",
      "section": "II",
      "normalized_rule": "five conditional PP127 indicator routes: positions 1, 7, 9, 11 and 13.1"
    },
    {
      "id": "P10",
      "section": "II",
      "normalized_rule": "assessment uses worst-case targeted attacks without implemented safeguards, process dependencies, inter-object dependencies, threat feasibility and historical incident data"
    },
    {
      "id": "P11",
      "section": "II",
      "normalized_rule": "categorization is based on attack and incident possibility for R&D or results at technology readiness level not below seven under the PP327 level framework and depends on point-9 indicators"
    },
    {
      "id": "P12",
      "section": "III",
      "normalized_rule": "indicator applicability must be determined before values are calculated"
    },
    {
      "id": "P13",
      "section": "III",
      "normalized_rule": "if an indicator is inapplicable to the object, its value is not calculated"
    },
    {
      "id": "P14",
      "section": "III",
      "normalized_rule": "calculation inputs are separately defined for the five point-9 routes"
    },
    {
      "id": "P15",
      "section": "III",
      "normalized_rule": "consequence scale is determined from identified threats, attack types, object purpose and automated process"
    },
    {
      "id": "P16",
      "section": "III",
      "normalized_rule": "consequences are assessed only through the indicators routed by point 9"
    },
    {
      "id": "P17",
      "section": "III",
      "normalized_rule": "position 1 includes technogenic catastrophes and adverse consequences for research, production-process studies and experimental developments"
    },
    {
      "id": "P18",
      "section": "III",
      "normalized_rule": "position 7 considers incidents affecting an object on which work under a Russian international treaty depends"
    },
    {
      "id": "P19",
      "section": "III",
      "normalized_rule": "position 9 considers possible reduction of the subject's tax payments to Russian budget-system budgets"
    },
    {
      "id": "P20",
      "section": "III",
      "normalized_rule": "position 11 considers possible releases, discharges or spills of harmful and polluting substances to air, water or soil"
    },
    {
      "id": "P21",
      "section": "III",
      "normalized_rule": "position 13.1 considers production or service volume reduction and increased unit-production time under state defense-order work"
    }
  ],
  "pp127_indicator_routes": [
    {
      "position": "1",
      "condition": "R&D uses harmful substances, including hazardous chemicals",
      "calculation_basis": [
        "people supporting object operation during tests, research or experimental development",
        "staff who may be in the affected zone"
      ],
      "consequence_route": "technogenic catastrophe and adverse R&D or experimental-development consequences"
    },
    {
      "position": "7",
      "condition": "subject performs R&D under an international treaty of the Russian Federation",
      "calculation_basis": [
        "decrease in completed tests, experiments or measurements",
        "reduced correctness or precision of measurements",
        "integrity or availability of R&D information"
      ],
      "consequence_route": "incident can negatively affect the dependent object and treaty performance"
    },
    {
      "position": "9",
      "condition": "subject performs R&D",
      "calculation_basis": [
        "possible reduction in tax payments or contributions to Russian budget-system budgets"
      ],
      "consequence_route": "subject-specific tax-payment reduction only"
    },
    {
      "position": "11",
      "condition": "R&D uses harmful substances, including hazardous chemicals",
      "calculation_basis": [
        "people supporting object operation",
        "staff in the affected zone",
        "territory exposed to harmful environmental impact with substance, terrain and wind evidence"
      ],
      "consequence_route": "release, discharge or spill to air, water or soil"
    },
    {
      "position": "13.1",
      "condition": "subject performs R&D under a state defense order",
      "calculation_basis": [
        "possible production, work or service volume reduction in the specified period",
        "possible increase in unit-production time",
        "subject status in the head-executor cooperation chain"
      ],
      "consequence_route": "state-defense-order cooperation evidence required"
    }
  ],
