schema_version: "1.0"
id: CII-SECTOR-OVERLAYS-402-796-2026-AUTHORITATIVE-SLICE
checked_at: "2026-08-14"
status: AUTHORITATIVE_VERIFIED
scope: >-
  Add two 2026 sector-specific CII categorization overlays that were missing from the previously verified five-overlay slice.
  This is not an exhaustive national sector inventory.

guardrails:
  - Do not treat publication as entry into force.
  - Do not treat a sector overlay as universally applicable outside its sector and subject facts.
  - Clause semantics below are authoritative-secondary until exact official PDF bytes are hash-pinned in repository.
  - PP_RF_402_2026 is published but not yet effective as of 2026-08-14.

sources:
  - source_id: PP_RF_402_2026
    act: "Постановление Правительства Российской Федерации от 13.04.2026 № 402"
    title: "Об утверждении отраслевых особенностей категорирования объектов критической информационной инфраструктуры Российской Федерации в сфере связи"
    official_publication_number: "0001202604130022"
    official_publication_date: "2026-04-13"
    effective_from: "2026-09-01"
    effective_until: "2032-09-01"
    current_status_at_check: PUBLISHED_NOT_YET_EFFECTIVE
    source_tier: AUTHORITATIVE_LEGAL_SYSTEM_WITH_OFFICIAL_PUBLICATION_ANCHOR
    verified_rules:
      - id: CII-402-R01
        clause: "п. 2 постановления"
        rule: "The act enters into force on 2026-09-01 and operates until 2032-09-01."
      - id: CII-402-R02
        clause: "п. 4 отраслевых особенностей"
        rule: "Sector significance feature is the number of subscribers, including legal-entity users of communications services, served using the CII object."
      - id: CII-402-R03
        clause: "п. 5 отраслевых особенностей"
        rule: "A permanent categorization commission is created by decision of the CII subject head; sector-specific representation rules apply to certain organizations."
      - id: CII-402-R04
        clause: "п. 6-7 отраслевых особенностей"
        rule: "The commission assesses possible incident consequences and, for each applicable significance indicator, determines applicability and consequence/value outcome."
      - id: CII-402-R05
        clause: "п. 8-9 отраслевых особенностей"
        rule: "The overlay defines a sector-specific set of directly applicable significance indicators; indicators outside that set are considered only in the case provided by the base Rules."
  - source_id: PP_RF_796_2026
    act: "Постановление Правительства Российской Федерации от 27.06.2026 № 796"
    title: "Об утверждении отраслевых особенностей категорирования объектов критической информационной инфраструктуры Российской Федерации в области оборонной промышленности"
    official_publication_number: "0001202606290031"
    official_publication_date: "2026-06-29"
    effective_from: "2026-07-07"
    current_status_at_check: EFFECTIVE
    source_tier: AUTHORITATIVE_LEGAL_SYSTEM_WITH_OFFICIAL_PUBLICATION_ANCHOR
    verified_rules:
      - id: CII-796-R01
        clause: "п. 4"
        rule: "A permanent categorization commission is created by decision of the head of the CII subject in accordance with the base categorization Rules."
      - id: CII-796-R02
        clause: "п. 6"
        rule: "After category assignment, the CII subject sends copies of commission protocols and categorization acts to the organization determined by the Ministry of Industry and Trade under the base Rules."
      - id: CII-796-R03
        clause: "п. 8"
        rule: "Where dependency of one CII object on another is identified, the dependent object receives the higher significance category determined by the base list or the categorization result of the object on which it depends."
      - id: CII-796-R04
        clause: "п. 9"
        rule: "Minimum review cadence differs by result: no-category at least yearly; category III every 2 years; category II every 3 years; category I every 5 years."
      - id: CII-796-R05
        clause: "п. 10"
        rule: "Sector significance features include use of the CII object in state defense-order performance and specified defense-industry/industrial-safety contexts."
      - id: CII-796-R06
        clause: "п. 11"
        rule: "For each CII object the commission evaluates sector-significance correspondence, probability of disruption/termination from an incident, and scale of consequences."

open_questions:
  - "National sector-overlay inventory is still not proven exhaustive."
  - "Exact official PDF bytes for PP_RF_402_2026 and PP_RF_796_2026 are not yet stored/hash-pinned in repository."
  - "Detailed formulas and all indicator mappings must be atomized before the overlays can be treated as executable categorization engines."
