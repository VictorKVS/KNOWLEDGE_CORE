verified_version_rules:
  - id: CII-VERSION-001
    statement: A 2026 PP 127 analysis must identify the legal version effective on the decision date.
    evidence: PP_RF_1762_2025
    verification_status: VERIFIED
  - id: CII-VERSION-002
    statement: The typical-sector-object list is a separate versioned source and must be pinned to the decision date.
    evidence: GOV_ORDER_360R_2026
    verification_status: VERIFIED
  - id: CII-VERSION-003
    statement: The list approved by No. 360-r changed on 2026-05-27 through No. 1237-r.
    evidence: GOV_ORDER_1237R_2026
    verification_status: VERIFIED
  - id: CII-VERSION-004
    statement: Historical list content must not be presented as current without transition/date analysis.
    evidence: GOV_ORDER_1237R_2026
    verification_status: VERIFIED

red_team_guardrails:
  - PP RF No. 127 is not treated as a timeless standalone decision source.
  - The five previously verified 2026 sector acts remain an incomplete slice and are not represented as an exhaustive inventory.
  - Publication metadata proves identity/date; full operational requirements require clause-level locators in separate artifacts.
  - The official publication endpoint for No. 1237-r was identified from authoritative metadata but was not successfully fetched during this run, so it is not labelled PRIMARY_FETCH_VERIFIED.

