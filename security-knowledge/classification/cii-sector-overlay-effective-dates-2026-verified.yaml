schema_version: "1.1"
id: CII-SECTOR-OVERLAY-EFFECTIVE-DATES-2026-VERIFIED
checked_at: "2026-08-14"
status: AUTHORITATIVE_VERIFIED_WITH_PRIMARY_PUBLICATION_ANCHORS
purpose: >-
  Preserve exact effective dates for the currently verified 2026 CII sector categorization overlays and
  prevent present-day overlay routing from being applied to historical events before each act entered into force.

scope_guardrails:
  - This file is a verified slice, not a claim that seven overlays exhaust all Russian CII sectors.
  - Official publication metadata is anchored to publication.pravo.gov.ru where an official publication number has been identified.
  - Effective dates are cross-checked against authoritative legal-system publication metadata; exact official PDF bytes are not yet hash-pinned in-repository.
  - Applicability requires both sector match and event/configuration date on or after effective_from.
  - A future-effective overlay must not be treated as current before its effective_from date.
  - A sector without a verified overlay in this slice must remain NEEDS_SECTOR_REVIEW; no overlay may be invented.

