routing_semantics:
  current_state_rule: "base PP_RF_127_2018 + every verified applicable sector overlay effective on decision_date"
  historical_state_rule: "select overlay set by event_or_configuration_date, never by audit_date alone"
  future_effective_rule: "published does not mean effective; do not route before effective_from"
  before_effective_date: BASE_ONLY_WITH_HISTORICAL_REVIEW
  unknown_date: NEEDS_TEMPORAL_REVIEW
  unknown_sector_overlay: NEEDS_SECTOR_REVIEW
