schema_version: "1.0"
id: GIS-FSTEC-117-TRANSITION-CLASSIFICATION-VERIFIED
checked_at: "2026-08-13"
status: VERIFIED_AUTHORITATIVE_CONSOLIDATED_WITH_OFFICIAL_IDENTITY
purpose: >-
  Replace obsolete reliance on FSTEC Order No. 17 for current GIS/non-crypto protection decisions
  and capture the current transition, governance and classification rules of FSTEC Order No. 117.

source:
  authority: "ФСТЭК России"
  act: "Приказ ФСТЭК России от 11.04.2025 № 117"
  title: "Об утверждении Требований о защите информации, содержащейся в государственных информационных системах, иных информационных системах государственных органов, государственных унитарных предприятий, государственных учреждений"
  minjust_registration: "16.06.2025 № 82619"
  official_publication_number: "0001202506170011"
  official_publication_date: "2025-06-17"
  official_publication_url: "https://publication.pravo.gov.ru/document/0001202506170011"
  authoritative_consolidated_url: "https://www.consultant.ru/document/cons_doc_LAW_507869/"
  effective_from: "2026-03-01"
  verification_note: >-
    Official publication portal proves act identity, registration/publication metadata and existence.
    Clause text below is verified against the current authoritative consolidated legal text in ConsultantPlus.
    The April 2026 amendment found in public sources is only a draft and is NOT applied here unless an adopted
    official act is separately proven.

records:
  - id: FSTEC117-TR-01
    status: VERIFIED
    source_locator: "приказ, п. 4"
    rule: "Приказ № 117 вступил в силу 1 марта 2026 года."
    source_quote: "Настоящий приказ вступает в силу с 1 марта 2026 г."
    decision_effect: "For decisions on or after 2026-03-01, use Order 117 as the current GIS protection baseline, subject to applicability."

  - id: FSTEC117-TR-02
    status: VERIFIED
    source_locator: "приказ, п. 2"
    rule: "Приказ ФСТЭК России № 17 утратил силу при вступлении в силу приказа № 117."
    source_quote: "Признать утратившими силу: приказ ФСТЭК России от 11 февраля 2013 г. N 17"
    decision_effect: "Do not present Order 17 as the current GIS requirements source after 2026-03-01. Preserve it only for historical/versioned decisions."

  - id: FSTEC117-TR-03
    status: VERIFIED
    source_locator: "приказ, п. 3"
    rule: "Аттестаты соответствия на ГИС и иные информационные системы, выданные до вступления приказа №117 в силу, считаются действительными."
    source_quote: "аттестаты соответствия ... выданные до дня вступления в силу настоящего приказа, считаются действительными"
    decision_effect: "Do not automatically invalidate pre-2026-03-01 attestations merely because Order 117 replaced Order 17."

  - id: FSTEC117-GOV-01
    status: VERIFIED
    source_locator: "Требования, п. 17"
    rule: "Защиту информации организует руководитель оператора (обладателя информации) либо по его решению ответственное лицо."
    source_quote: "Защиту информации должен организовывать руководитель оператора (обладателя информации) или по его решению ответственное лицо."
    role_owner: "руководитель оператора/обладателя информации или назначенное ответственное лицо"

  - id: FSTEC117-GOV-02
    status: VERIFIED
    source_locator: "Требования, п. 18"
    rule: "Обязанности и полномочия ответственного лица по организации, управлению и контролю защиты информации включаются в его должностные обязанности (трудовые функции)."
    source_quote: "должны быть включены в должностные обязанности (трудовые функции) ответственного лица"
    evidence_examples:
      - "должностная инструкция/трудовая функция"
      - "распорядительный документ о назначении"

  - id: FSTEC117-GOV-03
    status: VERIFIED
    source_locator: "Требования, п. 19"
    rule: "Руководитель/ответственное лицо должны создать (определить) подразделение либо назначить специалистов по защите информации."
    source_quote: "должны создать (определить) структурное подразделение или назначает отдельных специалистов, на которых возлагаются обязанности (функции) по защите информации"
    red_team_note: "The source text contains grammatical wording as published/consolidated; do not normalize it into a different legal obligation."

  - id: FSTEC117-GOV-04
    status: VERIFIED
    source_locator: "Требования, п. 20"
    rule: "Не менее 30 процентов работников подразделения по защите информации должны иметь профильное образование в области ИБ либо профпереподготовку в области ИБ."
    source_quote: "Не менее 30 процентов работников структурного подразделения по защите информации должны иметь профессиональное образование ... или пройти обучение по программе профессиональной переподготовки"
    metric:
      type: "minimum_staff_share"
      value_percent: 30

  - id: FSTEC117-MON-01
    status: VERIFIED
    source_locator: "Требования, п. 32, абз. 1"
    rule: "Расчет и оценка показателя защищенности Кзи проводятся не реже одного раза в шесть месяцев."
    source_quote: "Расчет и оценка показателя защищенности Кзи должны проводиться ... не реже одного раза в шесть месяцев."
    deadline:
      type: recurring
      maximum_interval_months: 6

  - id: FSTEC117-MON-02
    status: VERIFIED
    source_locator: "Требования, п. 32, абз. 1"
    rule: "Расчет и оценка показателя уровня зрелости Пзи проводятся не реже одного раза в два года."
    source_quote: "Расчет и оценка показателя уровня зрелости Пзи должны проводиться ... не реже одного раза в два года."
    deadline:
      type: recurring
      maximum_interval_years: 2

  - id: FSTEC117-MON-03
    status: VERIFIED
    source_locator: "Требования, п. 32, абз. 2"
    rule: "При несоответствии Кзи/Пзи нормированным значениям руководитель информируется в течение 3 календарных дней со дня завершения оценки."
    source_quote: "в течение 3 календарных дней со дня завершения такой оценки информируется руководитель оператора"
    deadline:
      value: 3
      unit: calendar_days
      trigger: "completion of assessment where indicator is below normalized value"

  - id: FSTEC117-MON-04
    status: VERIFIED
    source_locator: "Требования, п. 32, абз. 3"
    rule: "Результаты оценки Кзи и Пзи направляются в ФСТЭК России не позднее 5 рабочих дней после дня их расчета."
    source_quote: "в срок не позднее 5 рабочих дней после дня их расчета должны направляться ... в ФСТЭК России"
    deadline:
      value: 5
      unit: working_days
      trigger: "indicator calculation"

  - id: FSTEC117-CLASS-01
    status: VERIFIED
    source_locator: "Приложение, п. 1"
    rule: "Устанавливаются три класса защищенности: К1, К2, К3; К1 — самый высокий, К3 — самый низкий."
    source_quote: "устанавливаются три класса защищенности ... Самый низкий класс - третий, самый высокий - первый"

  - id: FSTEC117-CLASS-02
    status: VERIFIED
    source_locator: "Приложение, п. 1"
    rule: "Класс защищенности определяется в зависимости от уровня значимости информации и масштаба информационной системы."
    source_quote: "определяется в зависимости от уровня значимости информации ... и масштаба информационной системы"

  - id: FSTEC117-CLASS-03
    status: VERIFIED
    source_locator: "Приложение, п. 7, таблица 2"
    rule: "Матрица класса: УЗ1 -> К1 для любого масштаба; УЗ2 -> К1 федеральный, К2 региональный/объектовый; УЗ3 -> К2 федеральный, К3 региональный/объектовый."
    decision_table:
      UZ1: {federal: K1, regional: K1, object: K1}
      UZ2: {federal: K1, regional: K2, object: K2}
      UZ3: {federal: K2, regional: K3, object: K3}
    source_quote: "УЗ 1 | К1 | К1 | К1; УЗ 2 | К1 | К2 | К2; УЗ 3 | К2 | К3 | К3"

  - id: FSTEC117-CLASS-04
    status: VERIFIED
    source_locator: "Приложение, п. 10"
    rule: "Результаты классификации оформляются актом, утверждаемым оператором (обладателем информации)."
    source_quote: "Результаты классификации оформляются актом, который утверждается оператором (обладателем информации)."
    evidence_examples:
      - "акт классификации"

  - id: FSTEC117-CLASS-05
    status: VERIFIED
    source_locator: "Приложение, п. 11"
    rule: "Класс защищенности подлежит пересмотру при изменении масштаба системы или значимости содержащейся в ней информации."
    source_quote: "подлежит пересмотру при изменении масштаба ... или значимости содержащейся в ней информации"
    trigger:
      - "scope/scale change"
      - "information significance change"

red_team_guardrails:
  - "Order 17 is historical after 2026-03-01 and must not be cited as the current GIS baseline."
  - "A pre-2026-03-01 attestation is not invalid merely because Order 117 became effective."
  - "The April 2026 amendment located during research is a draft; draft clauses, dates and changed indicator rules must not be treated as current law without adopted official publication."
  - "Order 117 covers non-cryptographic protection within its scope; do not use it as a substitute for applicable cryptographic/FSB requirements."
  - "Classification requires actual information-significance and system-scale facts; the engine must not infer a class from organization type alone."

proof_sources:
  - type: PRIMARY_OFFICIAL_PUBLICATION_METADATA
    url: "https://publication.pravo.gov.ru/document/0001202506170011"
    proves:
      - act_identity
      - official_publication_number
      - official_publication_date
      - Minjust registration metadata
  - type: AUTHORITATIVE_CONSOLIDATED_LEGAL_TEXT
    url: "https://www.consultant.ru/document/cons_doc_LAW_507869/"
    proves:
      - transition provisions
      - governance clauses
      - monitoring deadlines
      - classification appendix

family_promotion:
  promoted: false
  reason: >-
    This is a strong current GIS slice, but classification/categorization family still includes CII sector overlays,
    ISPDn and other system types; family-wide proof-floor is not yet complete.
