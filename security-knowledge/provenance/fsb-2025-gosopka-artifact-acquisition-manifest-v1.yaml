acquisition_acceptance_checks:
  - downloaded artifact must originate from the official publication resource or an official redirect it controls
  - publication_id must exactly match manifest
  - page_count should match observed metadata; mismatch requires manual provenance review
  - file size mismatch is a change signal, not automatic corruption, and requires re-observation
  - sha256 must be computed over preserved exact bytes after acquisition
  - extracted clause evidence must reference the artifact_id and sha256

red_team_note: >-
