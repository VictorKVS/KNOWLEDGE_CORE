retry_and_review_policy:
  - preserve exact publication IDs for FSB artifacts between attempts
  - retry only against official publication resources or official redirects before considering archival fallback
  - if official bytes are later obtained, compute SHA-256 before clause binding
  - if observed page count or size differs from pinned metadata, open provenance review instead of silently accepting or rejecting
  - for NKTsKI, resolve the official downloadable target before deriving any field-level reporting schema
  - never convert a transient HTTP timeout into a legal-currentness conclusion

red_team_effect: >-
  This run improves evidence acquisition traceability and blocks false closure. It does not reduce the High gap count because
  no exact official bytes were preserved and no immutable-primary record was created.
