provenance_rules:
  - id: PROV-NKTSKI-001
    rule: >-
      A web page or document index confirming that a downloadable artifact exists is not equivalent
      to preserving the artifact bytes.
  - id: PROV-NKTSKI-002
    rule: >-
      IMMUTABLE_PRIMARY requires exact bytes, retrieval timestamp and SHA-256; all three are mandatory.
  - id: PROV-NKTSKI-003
    rule: >-
      Field-level reporting-schema claims must remain PENDING until the relevant artifact is preserved
      and the fields are extracted from that preserved version.
  - id: PROV-NKTSKI-004
    rule: >-
      Dynamic web-form observations must carry observation time and must not be treated as a permanent
      substitute for the normative source defining reporting formats.
  - id: PROV-NKTSKI-005
    rule: >-
      Search-engine excerpts and third-party mirrors may support discovery but cannot satisfy the
      immutable-primary evidence floor.
  - id: PROV-NKTSKI-006
    rule: >-
      Presence of an official "Download" action is stronger discovery evidence than a search snippet,
      but still does not establish the downloaded filename, bytes, MIME type or hash until the target is resolved and acquired.
  - id: PROV-NKTSKI-007
    rule: >-
      A PDF emitted by a document-viewer or normalization proxy is a derivative transport object unless
      byte identity with the official origin is independently proven. Its hash cannot satisfy
      IMMUTABLE_PRIMARY even when its content and page count match the official document.

