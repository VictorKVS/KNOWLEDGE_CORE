provenance_rules:
  - id: PP-PROV-001
    rule: IMMUTABLE_PRIMARY requires official-origin bytes, retrieval time and SHA-256.
  - id: PP-PROV-002
    rule: A current consolidated text is not an immutable official version-chain artifact.
  - id: PP-PROV-003
    rule: A Collection of Legislation citation does not prove an electronic publication number.
  - id: PP-PROV-004
    rule: A transport timeout does not prove absence, non-publication or repeal.
  - id: PP-PROV-005
    rule: Electronic publication identifiers must be returned by an exact official query and never inferred from adjacent numbers.
  - id: PP-PROV-006
    rule: Proxy or document-viewer bytes cannot satisfy the official-origin byte identity floor without equality proof.

