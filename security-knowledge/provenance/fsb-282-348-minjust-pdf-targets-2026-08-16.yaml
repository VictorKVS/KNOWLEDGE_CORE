rules:
  - id: PROV-FSB-HIST-001
    rule: "Exact PDF target resolution is not equivalent to byte acquisition."
  - id: PROV-FSB-HIST-002
    rule: "Do not assign IMMUTABLE_PRIMARY unless exact bytes are preserved together with retrieved_at and SHA-256."
  - id: PROV-FSB-HIST-003
    rule: "Minjust registration identity and official publication identity must both match the intended act before hash binding."
  - id: PROV-FSB-HIST-004
    rule: "Observed page count or display size is a transport sanity signal only; it is not a cryptographic identity."
  - id: PROV-FSB-HIST-005
    rule: "Failure of the runtime to download an otherwise resolved target is a transport failure, not evidence that the act or PDF is absent."

