rules:
  - id: RU-FZ152-A22-C1-APP-01
    verification: VERIFIED
    source_locator: Article 22 part 1
    source_quote: "до начала обработки"
    decision: NOTIFICATION_REQUIRED_BEFORE_PROCESSING
    applies_when: operator intends to process personal data and no Article 22 part 2 exception applies
  - id: RU-FZ152-A22-C2-P7-APP-01
    verification: VERIFIED
    source_locator: Article 22 part 2 item 7
    source_quote: "созданные в целях защиты безопасности государства"
    decision: NOTIFICATION_EXCEPTION
    applies_when: personal data are included in state personal-data information systems created for state security and public-order protection
  - id: RU-FZ152-A22-C2-P8-APP-01
    verification: VERIFIED
    source_locator: Article 22 part 2 item 8
    source_quote: "исключительно без использования средств автоматизации"
    decision: NOTIFICATION_EXCEPTION
    applies_when: operator processes personal data exclusively without automation
  - id: RU-FZ152-A22-C2-HIST-01
    verification: VERIFIED
    source_locator: Article 22 part 2 items 1-6
    source_quote: "утратили силу с 1 сентября 2022 года"
    decision: HISTORICAL_EXCEPTION_REMOVED
    effective_from: 2022-09-01
    consequence: legacy assumptions based on former items 1-6 must not be used for current applicability
expert_rules:
  - Default to notification-required unless a currently effective exception is positively proven.
  - Do not infer an exception from employment, contract, public availability, or other pre-2022 legacy grounds.
  - Record the factual basis and evidence for any claimed exception.
