schema_version: "1.0"
id: tk-material-damage-recovery-and-251n-applicability-verified
status: VERIFIED_SLICE
verified_at: "2026-08-13"
scope:
  - "ТК РФ ст. 239, 244, 246-248"
  - "Приказ Минтруда России от 16.04.2025 № 251н"
source_quality:
  code_text: "AUTHORITATIVE_CONSOLIDATED_LEGAL_TEXT"
  ministerial_order: "PRIMARY_OFFICIAL_PUBLICATION + AUTHORITATIVE_CONSOLIDATED_TEXT"

records:
  - id: TK-239-EXCLUSIONS
    source: "ТК РФ, ст. 239"
    status: VERIFIED
    source_locator: "ст. 239"
    source_quote: "Материальная ответственность работника исключается ... вследствие непреодолимой силы, нормального хозяйственного риска, крайней необходимости или необходимой обороны либо неисполнения работодателем обязанности по обеспечению надлежащих условий для хранения имущества"
    rule: "До взыскания ущерба необходимо проверить наличие обстоятельств, исключающих материальную ответственность работника."
    guardrail: "Факт ИБ-инцидента, утечки или штрафа организации сам по себе не устраняет возможные исключающие обстоятельства."
    source_url: "https://www.consultant.ru/document/cons_doc_LAW_34683/2993be3d3d6b9e1c9b1a13aac243df22a2b8439b/"

  - id: TK-246-DAMAGE-AMOUNT
    source: "ТК РФ, ст. 246"
    status: VERIFIED
    source_locator: "ст. 246 ч. 1"
    source_quote: "Размер ущерба ... определяется по фактическим потерям, исчисляемым исходя из рыночных цен ... но не ниже стоимости имущества по данным бухгалтерского учета с учетом степени износа"
    rule: "Для утраты или порчи имущества размер ущерба рассчитывается по фактическим потерям с установленным законом ценовым и бухгалтерским floor."
    guardrail: "Штраф регулятора, репутационный ущерб и иные выплаты нельзя автоматически приравнивать к размеру ущерба работника без отдельного правового основания и причинной связи."
    source_url: "https://www.consultant.ru/document/cons_doc_LAW_34683/13d52585f6a57ab8b6adb401f65bd691e1ca6ef3/"

  - id: TK-247-MANDATORY-CHECK
    source: "ТК РФ, ст. 247"
    status: VERIFIED
    source_locator: "ст. 247 ч. 1"
    source_quote: "До принятия решения о возмещении ущерба конкретными работниками работодатель обязан провести проверку для установления размера причиненного ущерба и причин его возникновения"
    rule: "До решения о взыскании работодатель обязан установить размер ущерба и причины его возникновения."
    evidence:
      - "акт/материалы проверки"
      - "расчет размера ущерба"
      - "материалы установления причинной связи"
    source_url: "https://www.consultant.ru/document/cons_doc_LAW_34683/906dbf32bb7674d9ada3f509b09fcee1b77d3a6d/"

  - id: TK-247-EXPLANATION
    source: "ТК РФ, ст. 247"
    status: VERIFIED
    source_locator: "ст. 247 ч. 2"
    source_quote: "Истребование от работника письменного объяснения для установления причины возникновения ущерба является обязательным"
    rule: "В рамках материальной ответственности письменное объяснение работника должно быть затребовано; отказ или уклонение оформляются актом."
    guardrail: "Это отдельная процедура от двух рабочих дней по дисциплинарному взысканию ст. 193; ст. 247 сама не устанавливает такой двухдневный срок."
    source_url: "https://www.consultant.ru/document/cons_doc_LAW_34683/906dbf32bb7674d9ada3f509b09fcee1b77d3a6d/"

  - id: TK-247-ACCESS-TO-MATERIALS
    source: "ТК РФ, ст. 247"
    status: VERIFIED
    source_locator: "ст. 247 ч. 3"
    source_quote: "Работник и (или) его представитель имеют право знакомиться со всеми материалами проверки и обжаловать их"
    rule: "Работнику или его представителю должен быть обеспечен доступ к материалам проверки в пределах установленного законом права."
    source_url: "https://www.consultant.ru/document/cons_doc_LAW_34683/906dbf32bb7674d9ada3f509b09fcee1b77d3a6d/"

  - id: TK-248-ORDER-LIMIT
    source: "ТК РФ, ст. 248"
    status: VERIFIED
    source_locator: "ст. 248 ч. 1"
    source_quote: "Взыскание ... суммы причиненного ущерба, не превышающей среднего месячного заработка, производится по распоряжению работодателя"
    rule: "Внесудебное взыскание по распоряжению работодателя ограничено суммой не выше среднего месячного заработка."
    source_url: "https://www.consultant.ru/document/cons_doc_LAW_34683/5187208d14c5473391f5ccba9be4b0ce893d6179/"

  - id: TK-248-ONE-MONTH
    source: "ТК РФ, ст. 248"
    status: VERIFIED
    source_locator: "ст. 248 ч. 1"
    source_quote: "Распоряжение может быть сделано не позднее одного месяца со дня окончательного установления работодателем размера причиненного работником ущерба"
    rule: "Распоряжение работодателя о внесудебном взыскании должно быть сделано не позднее одного месяца после окончательного установления размера ущерба."
    deadline: "1 month from final determination of damage amount"
    source_url: "https://www.consultant.ru/document/cons_doc_LAW_34683/5187208d14c5473391f5ccba9be4b0ce893d6179/"

  - id: TK-248-COURT-GATE
    source: "ТК РФ, ст. 248"
    status: VERIFIED
    source_locator: "ст. 248 ч. 2"
    source_quote: "Если месячный срок истек ... а сумма ... превышает его средний месячный заработок, то взыскание может осуществляться только судом"
    rule: "При пропуске месячного срока или при отсутствии добровольного согласия на возмещение суммы сверх среднего месячного заработка требуется судебное взыскание."
    guardrail: "Работодатель не вправе обходить судебный gate внутренним приказом."
    source_url: "https://www.consultant.ru/document/cons_doc_LAW_34683/5187208d14c5473391f5ccba9be4b0ce893d6179/"

  - id: TK-248-VOLUNTARY
    source: "ТК РФ, ст. 248"
    status: VERIFIED
    source_locator: "ст. 248 ч. 4"
    source_quote: "Работник ... может добровольно возместить его полностью или частично ... допускается возмещение ущерба с рассрочкой платежа"
    rule: "Добровольное полное/частичное возмещение и рассрочка допустимы; при рассрочке требуется письменное обязательство с конкретными сроками платежей."
    evidence:
      - "письменное обязательство при рассрочке"
      - "конкретные сроки платежей"
    source_url: "https://www.consultant.ru/document/cons_doc_LAW_34683/5187208d14c5473391f5ccba9be4b0ce893d6179/"

  - id: TK-248-INDEPENDENT-LIABILITY-TRACKS
    source: "ТК РФ, ст. 248"
    status: VERIFIED
    source_locator: "ст. 248 последняя часть"
    source_quote: "Возмещение ущерба производится независимо от привлечения работника к дисциплинарной, административной или уголовной ответственности"
    rule: "Материальная, дисциплинарная, административная и уголовная ответственность являются отдельными правовыми треками; один не заменяет другой."
    guardrail: "Наличие административного или уголовного дела не доказывает автоматически размер материального ущерба работодателя."
    source_url: "https://www.consultant.ru/document/cons_doc_LAW_34683/5187208d14c5473391f5ccba9be4b0ce893d6179/"

  - id: TK-244-CONTRACT-GATE
    source: "ТК РФ, ст. 244"
    status: VERIFIED
    source_locator: "ст. 244 ч. 1"
    source_quote: "Письменные договоры о полной индивидуальной или коллективной ... материальной ответственности ... могут заключаться с работниками, достигшими возраста восемнадцати лет и непосредственно обслуживающими или использующими денежные, товарные ценности или иное имущество"
    rule: "Договор полной материальной ответственности по основанию недостачи вверенного имущества допустим только при выполнении законных условий ст. 244 и попадании должности/работы в утвержденный перечень."
    guardrail: "Название должности 'системный администратор', 'специалист ИБ' или иной IT/ИБ роли само по себе не создает право заключить такой договор. Нужно проверять фактические работы/функции и перечень №251н."
    source_url: "https://www.consultant.ru/document/cons_doc_LAW_34683/f687b8b4be93969ff07879c3d1b032619addf2f8/"

  - id: MINTRUD-251N-VALIDITY
    source: "Приказ Минтруда России от 16.04.2025 № 251н"
    status: VERIFIED
    source_locator: "п. 3"
    source_quote: "настоящий приказ вступает в силу с 1 сентября 2025 г. и действует до 1 сентября 2031 г."
    rule: "Для договоров полной материальной ответственности после 01.09.2025 применяется перечень и типовые формы приказа №251н; срок действия акта ограничен 01.09.2031."
    effective_from: "2025-09-01"
    effective_until: "2031-09-01"
    primary_source_url: "https://publication.pravo.gov.ru/document/0001202505160017"
    source_url: "https://www.consultant.ru/document/cons_doc_LAW_505438/2ff7a8c72de3994f30496a0ccbb1ddafdaddf518/"

  - id: MINTRUD-251N-SCOPE
    source: "Приказ Минтруда России от 16.04.2025 № 251н"
    status: VERIFIED
    source_locator: "п. 1, приложения №1-4"
    source_quote: "утвердить ... перечень должностей и работ ... перечень работ ... типовую форму договора о полной индивидуальной ... и коллективной материальной ответственности"
    rule: "Applicability определяется не общим желанием работодателя, а попаданием в нормативный перечень должностей/работ и использованием соответствующей типовой формы."
    guardrail: "Не считать перечень универсальным основанием полной материальной ответственности для всех работников, имеющих доступ к данным, системам или оборудованию."
    primary_source_url: "https://publication.pravo.gov.ru/document/0001202505160017"
    source_url: "https://www.consultant.ru/document/cons_doc_LAW_505438/"

red_team_decision_logic:
  employee_damage_recovery:
    - "1. Установить прямой действительный ущерб, а не только факт инцидента/штрафа."
    - "2. Проверить исключающие обстоятельства ст.239."
    - "3. Установить причины, вину/противоправность и причинную связь в рамках проверки ст.247."
    - "4. Рассчитать размер ущерба по применимым правилам ст.246."
    - "5. Определить предел ответственности: default ст.241 либо специальное основание полной ответственности."
    - "6. Если основание — договор о полной материальной ответственности за недостачу, проверить ст.244 + приказ №251н."
    - "7. Применить порядок взыскания ст.248: сумма, срок 1 месяц, добровольность либо судебный gate."

