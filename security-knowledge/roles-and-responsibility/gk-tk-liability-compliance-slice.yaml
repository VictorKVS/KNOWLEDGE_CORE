schema_version: "1.0"
id: gk-tk-liability-compliance-slice
status: VERIFIED_SLICE
verified_at: "2026-08-13"
records:
  - id: GK-15
    source: "ГК РФ, ст. 15"
    status: VERIFIED
    rule: "При нарушении права допускается требование полного возмещения убытков, если закон или договор не устанавливают меньший размер."
    guardrail: "Размер убытков и причинная связь должны доказываться отдельно."
  - id: GK-151
    source: "ГК РФ, ст. 151"
    status: VERIFIED
    rule: "При нарушении личных неимущественных прав или посягательстве на нематериальные блага суд может присудить денежную компенсацию морального вреда."
  - id: GK-152-2
    source: "ГК РФ, ст. 152.2"
    status: VERIFIED
    rule: "По общему правилу не допускаются без согласия сбор, хранение, распространение и использование информации о частной жизни гражданина, если иное прямо не предусмотрено законом."
    guardrail: "Информация о частной жизни и персональные данные пересекаются, но не тождественны."
  - id: GK-1064
    source: "ГК РФ, ст. 1064"
    status: VERIFIED
    rule: "Вред личности или имуществу по общему правилу подлежит возмещению причинителем вреда в полном объеме с учетом применимых условий ответственности."
  - id: GK-1068
    source: "ГК РФ, ст. 1068"
    status: VERIFIED
    rule: "Юридическое лицо или гражданин возмещает вред, причиненный работником при исполнении трудовых, служебных или должностных обязанностей."
    guardrail: "Внешняя ответственность работодателя не означает автоматически такую же внутреннюю сумму взыскания с работника."
  - id: TK-192
    source: "ТК РФ, ст. 192"
    status: VERIFIED
    rule: "Дисциплинарное взыскание возможно за виновное неисполнение или ненадлежащее исполнение возложенных трудовых обязанностей."
  - id: TK-193-EXPLANATION
    source: "ТК РФ, ст. 193"
    status: VERIFIED
    rule: "До взыскания требуется письменное объяснение; при его непредоставлении по истечении двух рабочих дней составляется акт."
    deadline: "2 working days"
  - id: TK-193-DETECTION
    source: "ТК РФ, ст. 193"
    status: VERIFIED
    rule: "Дисциплинарное взыскание применяется не позднее одного месяца со дня обнаружения проступка с предусмотренными законом исключениями из срока."
    deadline: "1 month from detection"
  - id: TK-193-LONGSTOP
    source: "ТК РФ, ст. 193"
    status: VERIFIED
    rule: "Общий предельный срок — шесть месяцев со дня проступка; по результатам ревизии, проверки финансово-хозяйственной деятельности или аудиторской проверки — два года; для антикоррупционных нарушений — три года."
  - id: TK-193-ORDER
    source: "ТК РФ, ст. 193"
    status: VERIFIED
    rule: "Приказ о взыскании объявляется работнику под роспись в течение трех рабочих дней со дня издания, не считая времени отсутствия."
    deadline: "3 working days"
  - id: TK-238
    source: "ТК РФ, ст. 238"
    status: VERIFIED
    rule: "Работник отвечает перед работодателем за прямой действительный ущерб; упущенная выгода с работника не взыскивается."
  - id: TK-241
    source: "ТК РФ, ст. 241"
    status: VERIFIED
    rule: "По общему правилу материальная ответственность работника ограничена средним месячным заработком, если закон не предусматривает иное."
  - id: TK-242
    source: "ТК РФ, ст. 242"
    status: VERIFIED
    rule: "Полная материальная ответственность допускается только в случаях, предусмотренных ТК РФ или иными федеральными законами."
  - id: TK-243
    source: "ТК РФ, ст. 243"
    status: VERIFIED
    rule: "Полная материальная ответственность требует одного из специальных оснований, перечисленных законом."
    guardrail: "Одного факта нарушения внутренней политики ИБ недостаточно для вывода о полной материальной ответственности."
pending:
  - "ТК РФ ст. 239, 246-248: исключения, определение размера ущерба и порядок взыскания"
  - "Приказ Минтруда России от 16.04.2025 №251н: применимость договоров о полной материальной ответственности"
  - "ГК РФ ст. 1065 и 1081: предупреждение вреда и регресс"
  - "Судебные кейсы по утечкам персональных данных"
