records:
  - id: GK-1065-1-FUTURE-HARM
    source: "ГК РФ, ст.1065 п.1"
    status: VERIFIED
    source_locator: "ст.1065 п.1"
    source_quote: "Опасность причинения вреда в будущем может явиться основанием к иску о запрещении деятельности"
    rule: "Доказанная опасность причинения вреда в будущем может быть самостоятельным основанием для иска о запрете деятельности, создающей такую опасность."
    security_use: "Не ждать фактического ущерба, если конкретная продолжающаяся деятельность создает доказуемую угрозу вреда."
    guardrail: "Сам по себе технический риск или абстрактная уязвимость не равны автоматически юридически доказанной опасности по ст.1065."

  - id: GK-1065-2-CONTINUING-HARM
    source: "ГК РФ, ст.1065 п.2"
    status: VERIFIED
    source_locator: "ст.1065 п.2 абз.1"
    source_quote: "суд вправе обязать ответчика, помимо возмещения вреда, приостановить или прекратить соответствующую деятельность"
    rule: "Если производственная или иная деятельность продолжает причинять вред либо угрожает новым вредом, суд может дополнительно к возмещению вреда приостановить или прекратить такую деятельность."
    guardrail: "Мера применяется судом и не превращает внутреннее решение ИБ-службы в самостоятельное право закрыть деятельность организации."

  - id: GK-1065-2-PUBLIC-INTEREST
    source: "ГК РФ, ст.1065 п.2"
    status: VERIFIED
    source_locator: "ст.1065 п.2 абз.2"
    source_quote: "Суд может отказать в иске ... если ее приостановление либо прекращение противоречит общественным интересам"
    rule: "Общественный интерес может быть основанием отказать в приостановлении/прекращении деятельности, но такой отказ не лишает потерпевших права на возмещение вреда."
    guardrail: "Общественный интерес не отменяет автоматически обязанность возместить уже причиненный вред."

  - id: GK-1081-1-GENERAL-REGRESS
    source: "ГК РФ, ст.1081 п.1"
    status: VERIFIED
    source_locator: "ст.1081 п.1"
    source_quote: "Лицо, возместившее вред, причиненный другим лицом ... имеет право обратного требования"
    rule: "Лицо, возместившее вред, причиненный другим лицом, в том числе работником при исполнении обязанностей, в общем случае получает право регресса к причинителю."
    guardrail: "Статья прямо допускает иной размер регресса, если он установлен законом; для работника необходимо применять специальные ограничения трудового законодательства."

  - id: GK-1081-2-JOINT-TORTFEASORS
    source: "ГК РФ, ст.1081 п.2"
    status: VERIFIED
    source_locator: "ст.1081 п.2"
    source_quote: "долю выплаченного потерпевшему возмещения в размере, соответствующем степени вины"
    rule: "При совместном причинении вреда причинитель, возместивший вред, может требовать от других причинителей доли соразмерно их вине; если степень вины определить невозможно, доли признаются равными."
    guardrail: "Для распределения между несколькими участниками нельзя автоматически делить сумму поровну, если степень вины может быть установлена."

  - id: GK-1081-4-NO-REGRESS-SPECIAL
    source: "ГК РФ, ст.1081 п.4"
    status: VERIFIED
    source_locator: "ст.1081 п.4"
    source_quote: "не имеют права регресса к лицу, причинившему вред"
    rule: "В специальных случаях, перечисленных в ст.1073-1076 ГК РФ, лица, возместившие вред, не имеют права регресса к непосредственному причинителю."
    guardrail: "Право регресса не является универсальным для всех конструкций чужой ответственности."

  - id: VS-14-KG14-12-WORKER-CAP
    source: "Верховный Суд РФ, Определение от 29.09.2014 N 14-КГ14-12"
    status: VERIFIED
    source_locator: "правовая позиция Судебной коллегии по гражданским делам"
    source_quote: "ограниченной материальной ответственности работника в пределах его среднего месячного заработка"
    rule: "Регресс работодателя к работнику за вред, возмещенный третьим лицам, ограничивается пределами материальной ответственности работника по ТК РФ, если законом не установлена более высокая/полная ответственность."
    guardrail: "Внешне выплаченная работодателем сумма не переносится автоматически на работника в полном размере."

  - id: VS-PLENUM-52-TK-ROUTING
    source: "Постановление Пленума ВС РФ N 52, п.1"
    status: VERIFIED
    source_locator: "п.1"
    source_quote: "Такие дела подлежат разрешению в соответствии с положениями раздела XI"
    rule: "Споры работодателя с работником о материальной ответственности за ущерб, причиненный в период трудовых отношений, разрешаются по правилам раздела XI ТК РФ, в том числе после прекращения трудового договора."
    guardrail: "Нельзя обходить трудовые ограничения простой квалификацией требования как гражданского регресса."

  - id: VS-PLENUM-52-PROOF-ELEMENTS
    source: "Постановление Пленума ВС РФ N 52"
    status: VERIFIED
    source_locator: "разъяснения об обстоятельствах, подлежащих доказыванию работодателем"
    source_quote: "противоправность поведения ... вина работника ... причинная связь ... наличие прямого действительного ущерба"
    rule: "Для взыскания с работника работодатель должен доказать юридически значимый набор элементов: отсутствие исключающих обстоятельств, противоправность, вину, причинную связь, прямой действительный ущерб, его размер и, когда требуется, соблюдение правил полной материальной ответственности."
    guardrail: "Факт инцидента, штраф регулятора или наличие должностной инструкции сами по себе не закрывают весь proof set."

routing_matrix:
  - scenario: "Работник при исполнении обязанностей причинил вред третьему лицу; работодатель возместил вред"
    external_rule: "ГК РФ ст.1068 + ст.1081"
    internal_rule: "ТК РФ раздел XI"
    decision: "Регресс возможен, но размер и основания проверяются по ТК РФ; по умолчанию действует предел среднего месячного заработка, если отсутствует законное основание полной ответственности."
    evidence_required:
      - "факт и размер выплаты третьему лицу"
      - "связь выплаты с действиями конкретного работника"
      - "противоправность"
      - "вина"
      - "причинная связь"
      - "прямой действительный ущерб работодателя"
      - "отсутствие обстоятельств ст.239 ТК РФ"
      - "основание полной ответственности, если заявляется сумма сверх общего предела"

  - scenario: "Организация получила административный штраф из-за ИБ/ПДн события"
    decision: "Не считать штраф автоматически взыскиваемым с работника. Сначала доказать, что конкретная сумма образует прямой действительный ущерб в смысле ТК РФ и выполнен полный набор условий материальной ответственности."
    status: VERIFIED_INTERPRETATION
    basis:
      - "ТК РФ ст.238, 241-243, 247-248"
      - "Пленум ВС РФ N 52"
      - "Определение ВС РФ N 14-КГ14-12"
    guardrail: "Нельзя строить правило 'штраф организации = долг сотрудника'."

  - scenario: "Есть только выявленная высокая вероятность будущего вреда"
    decision: "Ст.1065 допускает превентивный иск, но необходима доказуемая опасность; внутренний risk score сам по себе не заменяет юридические доказательства."
    status: VERIFIED_INTERPRETATION

red_team_guardrails:
  - "ГК 1081 не отменяет специальные пределы ТК РФ для работника."
  - "ГК 1065 — судебная превентивная конструкция, а не универсальное полномочие ИБ-службы останавливать бизнес."
  - "Штраф/компенсация/выплата третьему лицу и внутренний ущерб работника — разные юридические уровни."
  - "Для суммы сверх среднего месячного заработка требуется отдельное законное основание полной материальной ответственности."
  - "При нескольких причинителях сначала устанавливается степень вины; равные доли — fallback, а не default."

