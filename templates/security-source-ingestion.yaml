schema_version: "1.0"
id: SEC-INGEST-XXXX
kind: security-source-ingestion
status: CAPTURED

source_ref: SEC-SRC-XXXX

capture:
  retrieved_from: ""
  retrieved_at: ""
  transport_or_method: browser|api|manual|archive
  media_type: text/html|application/pdf|text/plain|other
  raw_artifact_ref: ""
  normalized_artifact_ref: ""
  fingerprint:
    algorithm: sha256
    value: ""

verification:
  official_origin_confirmed: false
  title_confirmed: false
  issuer_confirmed: false
  document_number_confirmed: false
  revision_confirmed: false
  effective_status_confirmed: false
  verification_notes: []

normalization:
  text_extraction_method: ""
  structure_preserved: false
  page_or_section_boundaries_preserved: false
  normalization_notes: []

extraction:
  candidate_requirement_refs: []
  definitions_refs: []
  applicability_refs: []
  interpretation_notes_refs: []

quality:
  missing_pages_or_sections: []
  unreadable_fragments: []
  ambiguity_notes: []
  ready_for_requirement_extraction: false

agent_rule: >-
  Preserve the raw captured artifact and its fingerprint. Normalization is a derived representation and must
  never silently rewrite the legal or normative meaning of the source.
