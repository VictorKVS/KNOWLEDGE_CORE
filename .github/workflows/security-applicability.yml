name: Security Applicability Gate

on:
  push:
    paths:
      - 'security-applicability/**'
      - 'templates/security-applicability-context.yaml'
      - 'templates/security-applicability-rule.yaml'
      - '.ai/security-applicability-policy.yaml'
      - 'tools/security_applicability.py'
  pull_request:
    paths:
      - 'security-applicability/**'
      - 'templates/security-applicability-context.yaml'
      - 'templates/security-applicability-rule.yaml'
      - '.ai/security-applicability-policy.yaml'
      - 'tools/security_applicability.py'

jobs:
  applicability-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyyaml
      - name: Validate rule files
        shell: bash
        run: |
          shopt -s nullglob globstar
          rules=(security-applicability/rules/**/*.yaml security-applicability/rules/**/*.yml)
          if ((${#rules[@]})); then
            python - <<'PY'
          from pathlib import Path
          from tools.security_applicability import load, validate_rule
          import sys
          failed = False
          files = list(Path('security-applicability/rules').rglob('*.yaml')) + list(Path('security-applicability/rules').rglob('*.yml'))
          for path in files:
              errors = validate_rule(load(path))
              if errors:
                  failed = True
                  print('FAIL', path)
                  for e in errors:
                      print('  -', e)
              else:
                  print('OK  ', path)
          raise SystemExit(1 if failed else 0)
          PY
          else
            echo "No applicability rules yet."
          fi
