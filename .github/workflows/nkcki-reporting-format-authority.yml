name: NKTsKI Reporting Format Authority Gate

on:
  push:
    paths:
      - 'security-knowledge/evidence/nkcki-reporting-format-authority-chain-2025-2026-v1.yaml'
      - 'security-knowledge/evidence/nkcki-reporting-format-authority-regression-v1.json'
      - 'security-knowledge/validators/validate_nkcki_reporting_format_authority.py'
      - '.github/workflows/nkcki-reporting-format-authority.yml'
  pull_request:
    paths:
      - 'security-knowledge/evidence/nkcki-reporting-format-authority-chain-2025-2026-v1.yaml'
      - 'security-knowledge/evidence/nkcki-reporting-format-authority-regression-v1.json'
      - 'security-knowledge/validators/validate_nkcki_reporting_format_authority.py'
      - '.github/workflows/nkcki-reporting-format-authority.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate NKTsKI authority chain
        run: python security-knowledge/validators/validate_nkcki_reporting_format_authority.py
