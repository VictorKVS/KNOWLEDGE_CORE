name: Access Source Reconciliation Gate

on:
  push:
    paths:
      - 'security-knowledge/evidence/access-source-reconciliation-model-v1.yaml'
      - 'security-knowledge/regression/access-source-reconciliation-regression-v1.json'
      - 'security-knowledge/validators/validate_access_source_reconciliation.py'
      - '.github/workflows/access-source-reconciliation.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python security-knowledge/validators/validate_access_source_reconciliation.py
