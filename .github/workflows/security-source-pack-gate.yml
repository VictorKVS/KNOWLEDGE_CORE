name: Security Source Pack Gate

on:
  push:
    paths:
      - 'security-knowledge/corpus/**/*source-pack*.yaml'
      - 'security-knowledge/corpus/**/*source-pack*.yml'
      - 'tools/validate_security_source_packs.py'
      - 'tools/test_validate_security_source_packs.py'
      - '.github/workflows/security-source-pack-gate.yml'
  pull_request:
    paths:
      - 'security-knowledge/corpus/**/*source-pack*.yaml'
      - 'security-knowledge/corpus/**/*source-pack*.yml'
      - 'tools/validate_security_source_packs.py'
      - 'tools/test_validate_security_source_packs.py'
      - '.github/workflows/security-source-pack-gate.yml'

permissions:
  contents: read

jobs:
  validate-security-source-packs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyyaml
      - name: Run source-pack validator regression tests
        working-directory: tools
        run: python -m unittest -v test_validate_security_source_packs.py
      - name: Validate Security Knowledge source packs
        shell: bash
        run: |
          shopt -s nullglob globstar
          files=(security-knowledge/corpus/**/*source-pack*.yaml security-knowledge/corpus/**/*source-pack*.yml)
          if ((${#files[@]})); then
            python tools/validate_security_source_packs.py "${files[@]}"
          else
            echo "No Security Knowledge source packs yet."
          fi
