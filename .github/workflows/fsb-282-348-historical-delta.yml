name: FSB 282 348 Historical Delta Gate

on:
  push:
    paths:
      - 'security-knowledge/legislation/fsb-282-348-historical-delta-verified-2026-08-16.yaml'
      - 'security-knowledge/regression/fsb-282-348-historical-delta-regression-v1.json'
      - 'security-knowledge/validators/validate_fsb_282_348_historical_delta.py'
      - '.github/workflows/fsb-282-348-historical-delta.yml'
  pull_request:
    paths:
      - 'security-knowledge/legislation/fsb-282-348-historical-delta-verified-2026-08-16.yaml'
      - 'security-knowledge/regression/fsb-282-348-historical-delta-regression-v1.json'
      - 'security-knowledge/validators/validate_fsb_282_348_historical_delta.py'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate FSB 282/348 historical delta
        run: python security-knowledge/validators/validate_fsb_282_348_historical_delta.py
