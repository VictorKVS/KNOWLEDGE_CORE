name: FSB Incident Historical Routing Gate

on:
  push:
    paths:
      - 'security-knowledge/legislation/fsb-incident-reporting-historical-routing-2019-2026-v1.yaml'
      - 'security-knowledge/legislation/fsb-incident-reporting-historical-routing-regression-v1.json'
      - 'security-knowledge/validators/validate_fsb_incident_historical_routing.py'
      - '.github/workflows/fsb-incident-historical-routing.yml'
  pull_request:
    paths:
      - 'security-knowledge/legislation/fsb-incident-reporting-historical-routing-2019-2026-v1.yaml'
      - 'security-knowledge/legislation/fsb-incident-reporting-historical-routing-regression-v1.json'
      - 'security-knowledge/validators/validate_fsb_incident_historical_routing.py'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate historical FSB incident routing
        run: python security-knowledge/validators/validate_fsb_incident_historical_routing.py
