name: PP 303 2026 EGRN KII routing

on:
  push:
    paths:
      - 'security-knowledge/classification/pp-rf-303-2026-egrn-kii-overlay-v1.yaml'
      - 'security-knowledge/classification/pp-rf-303-2026-egrn-kii-routing-regression-v1.json'
      - 'security-knowledge/validators/validate_pp_rf_303_2026_egrn_kii_routing.py'
      - '.github/workflows/pp-rf-303-2026-egrn-kii-routing.yml'
  pull_request:
    paths:
      - 'security-knowledge/classification/pp-rf-303-2026-egrn-kii-overlay-v1.yaml'
      - 'security-knowledge/classification/pp-rf-303-2026-egrn-kii-routing-regression-v1.json'
      - 'security-knowledge/validators/validate_pp_rf_303_2026_egrn_kii_routing.py'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate PP 303 EGRN KII routing boundaries
        run: python security-knowledge/validators/validate_pp_rf_303_2026_egrn_kii_routing.py
