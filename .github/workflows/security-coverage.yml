name: Security Coverage

on:
  push:
    paths:
      - 'security-core/**'
      - '.ai/security-coverage-policy.yaml'
      - 'tools/security_coverage.py'
      - '.github/workflows/security-coverage.yml'
  pull_request:
    paths:
      - 'security-core/**'
      - '.ai/security-coverage-policy.yaml'
      - 'tools/security_coverage.py'
      - '.github/workflows/security-coverage.yml'

jobs:
  coverage-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyyaml
      - run: python tools/security_coverage.py --root security-core --output generated/security-coverage.json
      - uses: actions/upload-artifact@v4
        with:
          name: security-coverage-report
          path: generated/security-coverage.json
