name: Security Roadmap

on:
  push:
    paths:
      - 'security-roadmap/**'
      - 'templates/security-roadmap-item.yaml'
      - '.ai/security-roadmap-policy.yaml'
      - 'tools/security_roadmap.py'
  pull_request:
    paths:
      - 'security-roadmap/**'
      - 'templates/security-roadmap-item.yaml'
      - '.ai/security-roadmap-policy.yaml'
      - 'tools/security_roadmap.py'

jobs:
  roadmap-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyyaml
      - name: Validate and summarize roadmap
        shell: bash
        run: |
          shopt -s nullglob globstar
          files=(security-roadmap/**/*.yaml security-roadmap/**/*.yml)
          if ((${#files[@]})); then
            python tools/security_roadmap.py "${files[@]}"
            python tools/security_roadmap.py --json "${files[@]}" > generated-security-roadmap.json
          else
            echo '{"items":[],"by_horizon":{}}' > generated-security-roadmap.json
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: security-roadmap
          path: generated-security-roadmap.json
