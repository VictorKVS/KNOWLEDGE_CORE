name: RKN Order 140 Anonymization Gate

on:
  push:
    paths:
      - 'security-knowledge/corpus/ru-personal-data/rkn-order-140-2025-anonymization-atomic-v1.yaml'
      - 'security-knowledge/corpus/ru-personal-data/rkn-order-140-2025-anonymization-regression-v1.json'
      - 'security-knowledge/validators/validate_rkn_order_140_anonymization.py'
      - '.github/workflows/rkn-order-140-anonymization.yml'
  pull_request:
    paths:
      - 'security-knowledge/corpus/ru-personal-data/rkn-order-140-2025-anonymization-atomic-v1.yaml'
      - 'security-knowledge/corpus/ru-personal-data/rkn-order-140-2025-anonymization-regression-v1.json'
      - 'security-knowledge/validators/validate_rkn_order_140_anonymization.py'
      - '.github/workflows/rkn-order-140-anonymization.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - run: python security-knowledge/validators/validate_rkn_order_140_anonymization.py

