name: Security Source Registry

on:
  push:
    paths:
      - 'security-sources/**'
      - 'security-ingestion/**'
      - 'templates/security-source-registry.yaml'
      - 'templates/security-source-ingestion.yaml'
      - '.ai/security-source-registry-policy.yaml'
      - 'tools/validate_security_sources.py'
  pull_request:
    paths:
      - 'security-sources/**'
      - 'security-ingestion/**'
      - 'templates/security-source-registry.yaml'
      - 'templates/security-source-ingestion.yaml'
      - '.ai/security-source-registry-policy.yaml'
      - 'tools/validate_security_sources.py'

jobs:
  source-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyyaml
      - name: Validate source and ingestion records
        shell: bash
        run: |
          shopt -s nullglob globstar
          files=(security-sources/**/*.yaml security-sources/**/*.yml security-ingestion/**/*.yaml security-ingestion/**/*.yml)
          if ((${#files[@]})); then
            python tools/validate_security_sources.py "${files[@]}"
          else
            echo "No security source records yet."
          fi
