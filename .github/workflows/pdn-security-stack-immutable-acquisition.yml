name: PDN Security Stack Immutable Acquisition

on:
  workflow_dispatch:
  schedule:
    - cron: "27 */3 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/pdn-security-stack-immutable-acquisition.yml"
      - "TOOLS/pdn_security_stack_acquire.py"
      - "TOOLS/pdn_security_stack_capture_gate.py"
      - "TOOLS/pdn_security_stack_reconcile_telemetry.py"
      - "TOOLS/pdn_security_stack_reconcile_master.py"
      - "security-corpora/RU/152-FZ/security-stack/**"

permissions:
  contents: write

concurrency:
  group: pdn-security-stack-immutable-acquisition
  cancel-in-progress: true

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Reuse immutable captures and acquire technical/crypto deltas
        shell: bash
        run: python TOOLS/pdn_security_stack_acquire.py

      - name: Fail closed on generic or wrong legal-text portal captures
        shell: bash
        run: python TOOLS/pdn_security_stack_capture_gate.py

      - name: Reconcile Stream-2 telemetry from accepted run record
        shell: bash
        run: python TOOLS/pdn_security_stack_reconcile_telemetry.py

      - name: Commit Stream-2 evidence, then reconcile shared master after rebase
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The shared master is reconciled only after rebasing on the latest main.
          # This prevents concurrent PDN-core runs from overwriting Stream-2 counters
          # with similarly named core counters.
          git restore security-corpora/RU/152-FZ/PDN_MASTER_SOURCE_INVENTORY.yaml || true
          git add security-corpora/RU/152-FZ/security-stack
          if ! git diff --cached --quiet; then
            git commit -m "security-kb: sync PDN security-stack immutable capture [skip ci]"
          fi

          git pull --rebase origin main
          python TOOLS/pdn_security_stack_reconcile_master.py
          git add security-corpora/RU/152-FZ/PDN_MASTER_SOURCE_INVENTORY.yaml
          if ! git diff --cached --quiet; then
            git commit -m "security-kb: reconcile Stream-2 master counters [skip ci]"
          fi
          git push

      - name: Surface stream telemetry
        shell: bash
        run: cat security-corpora/RU/152-FZ/security-stack/PDN_SECURITY_STACK_ACQUISITION_RUN.json
