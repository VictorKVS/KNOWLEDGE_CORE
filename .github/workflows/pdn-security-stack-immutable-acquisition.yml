name: PDN Security Stack Immutable Acquisition

on:
  workflow_dispatch:
  schedule:
    - cron: "27 */3 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/pdn-security-stack-immutable-acquisition.yml"
      - "TOOLS/pdn_security_stack_register_sources.py"
      - "TOOLS/pdn_security_stack_acquire.py"
      - "TOOLS/pdn_security_stack_acquire_fast.py"
      - "TOOLS/pdn_security_stack_curl_pending.py"
      - "TOOLS/pdn_security_stack_rg_archive_retry.py"
      - "TOOLS/pdn_security_stack_resolve_fstec_maturity_attachment.py"
      - "TOOLS/pdn_security_stack_resolve_fstec_unrouted_attachments.py"
      - "TOOLS/pdn_security_stack_capture_gate.py"
      - "TOOLS/pdn_security_stack_reconcile_telemetry.py"
      - "TOOLS/pdn_security_stack_reconcile_master.py"
      - "security-corpora/RU/152-FZ/security-stack/**"

permissions:
  contents: write

concurrency:
  # Stream 1 and Stream 2 both write PDN_MASTER_SOURCE_INVENTORY.yaml.
  # Share Stream-1's repository-wide writer lock so Stream 2 queues behind an
  # active core acquisition instead of racing its final generated-file commit.
  group: pdn-core-immutable-acquisition
  cancel-in-progress: false

jobs:
  acquire:
    runs-on: ubuntu-latest
    # A scheduled run performs the guarded curl sweep first and then the reuse-first
    # acquisition/reconciliation pass. The former alone can consume ~14 minutes on
    # issuer timeouts, so the old 22-minute job budget could kill the run before the
    # capture gate, telemetry reconciliation and master-inventory commit.
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Register explicitly declared Stream-2 source cards
        shell: bash
        run: python TOOLS/pdn_security_stack_register_sources.py

      - name: Resolve exact official FSTEC maturity PDF route fail-closed
        shell: bash
        run: python TOOLS/pdn_security_stack_resolve_fstec_maturity_attachment.py

      - name: Resolve remaining exact official FSTEC attachment routes fail-closed
        shell: bash
        run: python TOOLS/pdn_security_stack_resolve_fstec_unrouted_attachments.py

      - name: Full guarded curl sweep for scheduled or manual maintenance
        if: github.event_name != 'push'
        shell: bash
        run: python TOOLS/pdn_security_stack_curl_pending.py

      - name: Browser-compatible guarded retry for official RG FSB378 archive
        shell: bash
        run: python TOOLS/pdn_security_stack_rg_archive_retry.py

      - name: Fast bounded acquisition for change-triggered runs
        if: github.event_name == 'push'
        shell: bash
        run: python TOOLS/pdn_security_stack_acquire_fast.py

      - name: Full reuse-first acquisition for scheduled or manual maintenance
        if: github.event_name != 'push'
        shell: bash
        run: python TOOLS/pdn_security_stack_acquire.py

      - name: Fail closed on generic or wrong legal-text portal captures
        shell: bash
        run: python TOOLS/pdn_security_stack_capture_gate.py

      - name: Reconcile Stream-2 telemetry from accepted run record
        shell: bash
        run: python TOOLS/pdn_security_stack_reconcile_telemetry.py

      - name: Commit Stream-2 evidence, then reconcile shared master after rebase
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The shared master is reconciled only after rebasing on the latest main.
          # This prevents concurrent PDN-core runs from overwriting Stream-2 counters
          # with similarly named core counters.
          git restore security-corpora/RU/152-FZ/PDN_MASTER_SOURCE_INVENTORY.yaml || true
          git add security-corpora/RU/152-FZ/security-stack
          if ! git diff --cached --quiet; then
            git commit -m "security-kb: sync PDN security-stack immutable capture [skip ci]"
          fi

          git pull --rebase origin main
          python TOOLS/pdn_security_stack_reconcile_master.py
          git add security-corpora/RU/152-FZ/PDN_MASTER_SOURCE_INVENTORY.yaml
          if ! git diff --cached --quiet; then
            git commit -m "security-kb: reconcile Stream-2 master counters [skip ci]"
          fi
          git push

      - name: Surface stream telemetry
        shell: bash
        run: |
          if [ -f security-corpora/RU/152-FZ/security-stack/PDN_FSTEC_MATURITY_ATTACHMENT_RESOLUTION.json ]; then
            cat security-corpora/RU/152-FZ/security-stack/PDN_FSTEC_MATURITY_ATTACHMENT_RESOLUTION.json
          fi
          if [ -f security-corpora/RU/152-FZ/security-stack/PDN_FSTEC_UNROUTED_ATTACHMENT_RESOLUTION.json ]; then
            cat security-corpora/RU/152-FZ/security-stack/PDN_FSTEC_UNROUTED_ATTACHMENT_RESOLUTION.json
          fi
          if [ -f security-corpora/RU/152-FZ/security-stack/PDN_SECURITY_STACK_CURL_ATTEMPT.json ]; then
            cat security-corpora/RU/152-FZ/security-stack/PDN_SECURITY_STACK_CURL_ATTEMPT.json
          fi
          cat security-corpora/RU/152-FZ/security-stack/PDN_SECURITY_STACK_ACQUISITION_RUN.json
