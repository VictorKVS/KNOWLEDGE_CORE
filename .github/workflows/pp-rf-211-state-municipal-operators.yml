name: PP RF 211 State and Municipal Operators Gate

on:
  push:
    paths:
      - "security-knowledge/corpus/ru-personal-data/pp-rf-211-state-municipal-operators-atomic-v1.yaml"
      - "security-knowledge/corpus/ru-personal-data/pp-rf-211-state-municipal-operators-regression-v1.json"
      - "security-knowledge/pdn/pdn-master-source-library-v1.yaml"
      - "security-knowledge/pdn/pdn-direction-coverage-matrix-v1.yaml"
      - "security-knowledge/validators/validate_pp_rf_211_state_municipal_operators.py"
      - ".github/workflows/pp-rf-211-state-municipal-operators.yml"
  pull_request:
    paths:
      - "security-knowledge/corpus/ru-personal-data/pp-rf-211-state-municipal-operators-atomic-v1.yaml"
      - "security-knowledge/corpus/ru-personal-data/pp-rf-211-state-municipal-operators-regression-v1.json"
      - "security-knowledge/pdn/pdn-master-source-library-v1.yaml"
      - "security-knowledge/pdn/pdn-direction-coverage-matrix-v1.yaml"
      - "security-knowledge/validators/validate_pp_rf_211_state_municipal_operators.py"
      - ".github/workflows/pp-rf-211-state-municipal-operators.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python security-knowledge/validators/validate_pp_rf_211_state_municipal_operators.py
