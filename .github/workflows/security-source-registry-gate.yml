name: Security Source Registry Gate

on:
  push:
    paths:
      - 'security-knowledge/**/*source-registry*.yaml'
      - 'security-knowledge/**/*source-registry*.yml'
      - 'security-knowledge/corpus/master-source-inventory.yaml'
      - 'tools/validate_security_source_registries.py'
      - 'tools/test_validate_security_source_registries.py'
      - '.github/workflows/security-source-registry-gate.yml'
  pull_request:
    paths:
      - 'security-knowledge/**/*source-registry*.yaml'
      - 'security-knowledge/**/*source-registry*.yml'
      - 'security-knowledge/corpus/master-source-inventory.yaml'
      - 'tools/validate_security_source_registries.py'
      - 'tools/test_validate_security_source_registries.py'
      - '.github/workflows/security-source-registry-gate.yml'

permissions:
  contents: read

jobs:
  validate-security-source-registries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyyaml
      - name: Run source-registry validator regression tests
        working-directory: tools
        run: python -m unittest -v test_validate_security_source_registries.py
      - name: Validate Security Knowledge source registries
        shell: bash
        run: |
          shopt -s nullglob globstar
          files=(security-knowledge/**/*source-registry*.yaml security-knowledge/**/*source-registry*.yml)
          if ((${#files[@]})); then
            python tools/validate_security_source_registries.py \
              --inventory security-knowledge/corpus/master-source-inventory.yaml \
              "${files[@]}"
          else
            echo "No Security Knowledge source registries yet."
          fi
