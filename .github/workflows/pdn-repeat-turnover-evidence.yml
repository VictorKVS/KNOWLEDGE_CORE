name: PDn Repeat Offense Turnover Evidence Gate

on:
  push:
    paths:
      - 'security-knowledge/evidence/pdn-repeat-offense-turnover-evidence-model-v1.yaml'
      - 'security-knowledge/evidence/pdn-repeat-offense-turnover-regression-v1.json'
      - 'security-knowledge/validators/validate_pdn_repeat_turnover_evidence.py'
      - '.github/workflows/pdn-repeat-turnover-evidence.yml'
  pull_request:
    paths:
      - 'security-knowledge/evidence/pdn-repeat-offense-turnover-evidence-model-v1.yaml'
      - 'security-knowledge/evidence/pdn-repeat-offense-turnover-regression-v1.json'
      - 'security-knowledge/validators/validate_pdn_repeat_turnover_evidence.py'
      - '.github/workflows/pdn-repeat-turnover-evidence.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run deterministic evidence regression
        run: python security-knowledge/validators/validate_pdn_repeat_turnover_evidence.py
