name: PP RF 246 science CII overlay

on:
  push:
    paths:
      - 'security-knowledge/classification/pp-rf-246-2026-science-kii-overlay-v1.json'
      - 'security-knowledge/classification/pp-rf-246-2026-science-kii-overlay-regression-v1.json'
      - 'security-knowledge/evidence/primary-artifact-pp-rf-246-2026.json'
      - 'security-knowledge/evidence/primary-artifacts/2026/pp-rf-246-2026-0001202603070013.pdf'
      - 'security-knowledge/validators/validate_pp_rf_246_science_kii_overlay.py'
      - '.github/workflows/pp-rf-246-science-kii-overlay.yml'
  pull_request:
    paths:
      - 'security-knowledge/classification/pp-rf-246-2026-science-kii-overlay-v1.json'
      - 'security-knowledge/classification/pp-rf-246-2026-science-kii-overlay-regression-v1.json'
      - 'security-knowledge/evidence/primary-artifact-pp-rf-246-2026.json'
      - 'security-knowledge/evidence/primary-artifacts/2026/pp-rf-246-2026-0001202603070013.pdf'
      - 'security-knowledge/validators/validate_pp_rf_246_science_kii_overlay.py'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate PP RF 246 science CII overlay and source bytes
        run: python security-knowledge/validators/validate_pp_rf_246_science_kii_overlay.py
