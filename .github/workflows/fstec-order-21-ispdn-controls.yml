name: FSTEC Order 21 ISPDN Controls Gate

on:
  push:
    paths:
      - "security-knowledge/corpus/ru-personal-data/fstec-order-21-ispdn-controls-atomic-v1.yaml"
      - "security-knowledge/corpus/ru-personal-data/fstec-order-21-ispdn-controls-regression-v1.json"
      - "security-knowledge/classification/ispdn-protection-level-decision-table-pp1119-verified.yaml"
      - "security-knowledge/corpus/ru-personal-data/fl-152-article-19-security-measures-atomic-v1.yaml"
      - "security-knowledge/pdn/pdn-master-source-library-v1.yaml"
      - "security-knowledge/pdn/pdn-direction-coverage-matrix-v1.yaml"
      - "security-knowledge/validators/validate_fstec_order_21_ispdn_controls.py"
      - ".github/workflows/fstec-order-21-ispdn-controls.yml"
  pull_request:
    paths:
      - "security-knowledge/corpus/ru-personal-data/fstec-order-21-ispdn-controls-atomic-v1.yaml"
      - "security-knowledge/corpus/ru-personal-data/fstec-order-21-ispdn-controls-regression-v1.json"
      - "security-knowledge/classification/ispdn-protection-level-decision-table-pp1119-verified.yaml"
      - "security-knowledge/corpus/ru-personal-data/fl-152-article-19-security-measures-atomic-v1.yaml"
      - "security-knowledge/pdn/pdn-master-source-library-v1.yaml"
      - "security-knowledge/pdn/pdn-direction-coverage-matrix-v1.yaml"
      - "security-knowledge/validators/validate_fstec_order_21_ispdn_controls.py"
      - ".github/workflows/fstec-order-21-ispdn-controls.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python security-knowledge/validators/validate_fstec_order_21_ispdn_controls.py
