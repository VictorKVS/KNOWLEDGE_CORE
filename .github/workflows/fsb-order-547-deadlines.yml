name: FSB Order 547 deadline matrix

on:
  push:
    paths:
      - 'security-knowledge/roles/fsb-order-547-2025-deadline-*.json'
      - 'security-knowledge/validators/validate_fsb_order_547_deadlines.py'
      - '.github/workflows/fsb-order-547-deadlines.yml'
  pull_request:
    paths:
      - 'security-knowledge/roles/fsb-order-547-2025-deadline-*.json'
      - 'security-knowledge/validators/validate_fsb_order_547_deadlines.py'
      - '.github/workflows/fsb-order-547-deadlines.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Order 547 actor/action/deadline matrix
        run: python security-knowledge/validators/validate_fsb_order_547_deadlines.py
