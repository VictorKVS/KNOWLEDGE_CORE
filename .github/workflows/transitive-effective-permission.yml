name: Transitive Effective Permission Gate

on:
  push:
    paths:
      - 'security-knowledge/evidence/transitive-effective-permission-model-v1.yaml'
      - 'security-knowledge/regression/transitive-effective-permission-regression-v1.json'
      - 'security-knowledge/validators/validate_transitive_effective_permission.py'
      - '.github/workflows/transitive-effective-permission.yml'
  pull_request:
    paths:
      - 'security-knowledge/evidence/transitive-effective-permission-model-v1.yaml'
      - 'security-knowledge/regression/transitive-effective-permission-regression-v1.json'
      - 'security-knowledge/validators/validate_transitive_effective_permission.py'
      - '.github/workflows/transitive-effective-permission.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate transitive effective permissions
        run: python security-knowledge/validators/validate_transitive_effective_permission.py
