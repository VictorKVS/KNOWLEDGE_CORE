name: Security Risk Engine

on:
  push:
    paths:
      - 'security-core/**'
      - 'templates/security-risk.yaml'
      - '.ai/security-risk-policy.yaml'
      - 'tools/security_risk.py'
      - '.github/workflows/security-risk.yml'
  pull_request:
    paths:
      - 'security-core/**'
      - 'templates/security-risk.yaml'
      - '.ai/security-risk-policy.yaml'
      - 'tools/security_risk.py'
      - '.github/workflows/security-risk.yml'

jobs:
  risk-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyyaml
      - name: Analyze security risk records
        shell: bash
        run: |
          shopt -s nullglob globstar
          files=(security-core/risks/**/*.yaml security-core/risks/**/*.yml)
          if ((${#files[@]})); then
            python tools/security_risk.py "${files[@]}"
            python tools/security_risk.py --json "${files[@]}" > security-risk-report.json
          else
            echo '[]' > security-risk-report.json
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: security-risk-report
          path: security-risk-report.json
