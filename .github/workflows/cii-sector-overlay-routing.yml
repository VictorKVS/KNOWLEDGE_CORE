name: CII Sector Overlay Routing Gate

on:
  push:
    paths:
      - 'security-knowledge/classification/cii-sector-overlay-routing-regression-v1.yaml'
      - 'security-knowledge/validators/validate_cii_sector_overlay_routing.py'
      - '.github/workflows/cii-sector-overlay-routing.yml'
  pull_request:
    paths:
      - 'security-knowledge/classification/cii-sector-overlay-routing-regression-v1.yaml'
      - 'security-knowledge/validators/validate_cii_sector_overlay_routing.py'
      - '.github/workflows/cii-sector-overlay-routing.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pyyaml
      - run: python security-knowledge/validators/validate_cii_sector_overlay_routing.py
