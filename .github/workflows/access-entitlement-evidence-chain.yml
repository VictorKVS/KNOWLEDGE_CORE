name: Access Entitlement Evidence Chain Gate

on:
  push:
    paths:
      - 'security-knowledge/evidence/access-entitlement-evidence-chain-v1.yaml'
      - 'security-knowledge/regression/access-entitlement-evidence-chain-regression-v1.json'
      - 'security-knowledge/validators/validate_access_entitlement_evidence_chain.py'
      - '.github/workflows/access-entitlement-evidence-chain.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate access entitlement evidence chain
        run: python security-knowledge/validators/validate_access_entitlement_evidence_chain.py
