name: Learning Executable CI

on:
  push:
    paths:
      - 'learning-core/executable/**'
      - '.github/workflows/learning-executable-ci.yml'
  pull_request:
    paths:
      - 'learning-core/executable/**'
      - '.github/workflows/learning-executable-ci.yml'

jobs:
  python-validation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: learning-core/executable/validation/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: pytest -q

  go-validation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: learning-core/executable/validation/go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - run: go test ./...

  cpp-validation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: learning-core/executable/validation/cpp
    steps:
      - uses: actions/checkout@v4
      - run: g++ -std=c++20 -Wall -Wextra -Wpedantic -Werror test_validation.cpp -o test_validation
      - run: ./test_validation
