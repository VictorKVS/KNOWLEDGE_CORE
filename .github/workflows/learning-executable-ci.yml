name: Learning Executable CI

on:
  push:
    paths:
      - 'learning-core/executable/**'
      - '.github/workflows/learning-executable-ci.yml'
  pull_request:
    paths:
      - 'learning-core/executable/**'
      - '.github/workflows/learning-executable-ci.yml'

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        object: [validation, errors, state, retry, cache, queue, transaction]
    defaults:
      run:
        working-directory: learning-core/executable/${{ matrix.object }}/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: pytest -q

  go:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        object: [validation, errors, state, retry, cache, queue, transaction]
    defaults:
      run:
        working-directory: learning-core/executable/${{ matrix.object }}/go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - run: go test ./...

  cpp:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - object: validation
            test: test_validation.cpp
          - object: errors
            test: test_errors.cpp
          - object: state
            test: test_state.cpp
          - object: retry
            test: test_retry.cpp
          - object: cache
            test: test_cache.cpp
          - object: queue
            test: test_queue.cpp
          - object: transaction
            test: test_transaction.cpp
    defaults:
      run:
        working-directory: learning-core/executable/${{ matrix.object }}/cpp
    steps:
      - uses: actions/checkout@v4
      - run: g++ -std=c++20 -Wall -Wextra -Wpedantic -Werror ${{ matrix.test }} -o learning_test
      - run: ./learning_test
