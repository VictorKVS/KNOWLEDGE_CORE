name: FL152 Article 21 Remediation and Destruction Gate

on:
  push:
    paths:
      - "security-knowledge/corpus/ru-personal-data/fl-152-article-21-remediation-destruction-atomic-v1.yaml"
      - "security-knowledge/corpus/ru-personal-data/fl-152-article-21-remediation-destruction-regression-v1.json"
      - "security-knowledge/corpus/ru-personal-data/rkn-order-179-destruction-evidence-atomic-v1.yaml"
      - "security-knowledge/pdn/pdn-master-source-library-v1.yaml"
      - "security-knowledge/pdn/pdn-direction-coverage-matrix-v1.yaml"
      - "security-knowledge/validators/validate_fl152_article_21_remediation_destruction.py"
      - ".github/workflows/fl152-article-21-remediation-destruction.yml"
  pull_request:
    paths:
      - "security-knowledge/corpus/ru-personal-data/fl-152-article-21-remediation-destruction-atomic-v1.yaml"
      - "security-knowledge/corpus/ru-personal-data/fl-152-article-21-remediation-destruction-regression-v1.json"
      - "security-knowledge/corpus/ru-personal-data/rkn-order-179-destruction-evidence-atomic-v1.yaml"
      - "security-knowledge/pdn/pdn-master-source-library-v1.yaml"
      - "security-knowledge/pdn/pdn-direction-coverage-matrix-v1.yaml"
      - "security-knowledge/validators/validate_fl152_article_21_remediation_destruction.py"
      - ".github/workflows/fl152-article-21-remediation-destruction.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python security-knowledge/validators/validate_fl152_article_21_remediation_destruction.py
