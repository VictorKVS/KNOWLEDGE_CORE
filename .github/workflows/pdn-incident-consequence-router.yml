name: PDn Incident Consequence Router Gate

on:
  push:
    paths:
      - 'security-knowledge/legal-consequences/pdn-incident-consequence-router-v1.yaml'
      - 'security-knowledge/legal-consequences/pdn-incident-consequence-router-regression-v1.json'
      - 'security-knowledge/validators/validate_pdn_incident_consequence_router.py'
      - '.github/workflows/pdn-incident-consequence-router.yml'
  pull_request:
    paths:
      - 'security-knowledge/legal-consequences/pdn-incident-consequence-router-v1.yaml'
      - 'security-knowledge/legal-consequences/pdn-incident-consequence-router-regression-v1.json'
      - 'security-knowledge/validators/validate_pdn_incident_consequence_router.py'
      - '.github/workflows/pdn-incident-consequence-router.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate PDn incident consequence routing
        run: python security-knowledge/validators/validate_pdn_incident_consequence_router.py
