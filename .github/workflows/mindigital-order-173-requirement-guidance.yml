name: MinDigital Order 173 requirement guidance

on:
  pull_request:
    paths:
      - 'security-knowledge/corpus/ru-personal-data/mindigital-order-173-2026-requirement-guidance-atomic-v1.yaml'
      - 'security-knowledge/corpus/ru-personal-data/mindigital-order-173-2026-requirement-guidance-regression-v1.json'
      - 'security-knowledge/pdn/pdn-master-source-library-v1.yaml'
      - 'security-knowledge/validators/validate_mindigital_order_173_requirement_guidance.py'
      - '.github/workflows/mindigital-order-173-requirement-guidance.yml'
  push:
    paths:
      - 'security-knowledge/corpus/ru-personal-data/mindigital-order-173-2026-requirement-guidance-atomic-v1.yaml'
      - 'security-knowledge/corpus/ru-personal-data/mindigital-order-173-2026-requirement-guidance-regression-v1.json'
      - 'security-knowledge/pdn/pdn-master-source-library-v1.yaml'
      - 'security-knowledge/validators/validate_mindigital_order_173_requirement_guidance.py'
      - '.github/workflows/mindigital-order-173-requirement-guidance.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - run: python security-knowledge/validators/validate_mindigital_order_173_requirement_guidance.py

