name: Credential Token Session Lifecycle Gate

on:
  push:
    paths:
      - 'security-knowledge/evidence/credential-token-session-lifecycle-model-v1.yaml'
      - 'security-knowledge/regression/credential-token-session-lifecycle-regression-v1.json'
      - 'security-knowledge/validators/validate_credential_token_session_lifecycle.py'
      - '.github/workflows/credential-token-session-lifecycle.yml'
  pull_request:
    paths:
      - 'security-knowledge/evidence/credential-token-session-lifecycle-model-v1.yaml'
      - 'security-knowledge/regression/credential-token-session-lifecycle-regression-v1.json'
      - 'security-knowledge/validators/validate_credential_token_session_lifecycle.py'
      - '.github/workflows/credential-token-session-lifecycle.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate credential lifecycle regression
        run: >-
          python security-knowledge/validators/validate_credential_token_session_lifecycle.py
          security-knowledge/regression/credential-token-session-lifecycle-regression-v1.json
