name: PDN Core Immutable Acquisition

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/pdn-core-immutable-acquisition.yml"
      - "TOOLS/pdn_core_acquire.py"
      - "TOOLS/pdn_core_pending_acquire.py"
      - "TOOLS/pdn_current_root_acquire.py"
      - "TOOLS/pdn_current_root_curl_acquire.py"
      - "TOOLS/pdn_pp687_acquire.py"
      - "TOOLS/pdn_pravo_www_alias_acquire.py"
      - "TOOLS/pdn_core_sync_capture.py"
      - "TOOLS/pdn_security_stack_reconcile_master.py"
      - "security-corpora/RU/152-FZ/source/**"

permissions:
  contents: write

concurrency:
  group: pdn-core-immutable-acquisition
  cancel-in-progress: true

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Reuse immutable artifacts and acquire easy publication deltas first
        id: acquire
        shell: bash
        run: |
          set +e
          python TOOLS/pdn_core_pending_acquire.py
          rc=$?
          echo "acquirer_exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Sync fast immutable delta to source records and master inventory
        shell: bash
        run: python TOOLS/pdn_core_sync_capture.py

      - name: Restore authoritative Stream-2 counters after fast core sync
        shell: bash
        run: python TOOLS/pdn_security_stack_reconcile_master.py

      - name: Commit fast immutable deltas before slow dedicated routes
        shell: bash
        run: |
          # Fast-stage telemetry/master rewrites alone are intentionally deferred to the
          # final commit. Persist early only when this pass actually captured new immutable
          # bytes. This avoids a telemetry-only commit racing another stream on the shared
          # master inventory and blocking the slow dedicated routes before they run.
          new_immutable="$(python - <<'PY'
          import json
          from pathlib import Path
          p = Path('security-corpora/RU/152-FZ/PDN_ACQUISITION_RUN.json')
          try:
              d = json.loads(p.read_text(encoding='utf-8'))
              print(int(d.get('new_immutable_captured') or 0))
          except Exception:
              print(0)
          PY
          )"
          if [ "$new_immutable" -le 0 ]; then
            echo "No new fast immutable bytes; defer telemetry-only delta to final commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add security-corpora/RU/152-FZ/raw \
                  security-corpora/RU/152-FZ/manifests \
                  security-corpora/RU/152-FZ/source \
                  security-corpora/RU/152-FZ/PDN_ACQUISITION_RUN.json \
                  security-corpora/RU/152-FZ/PDN_MASTER_SOURCE_INVENTORY.yaml
          if git diff --cached --quiet; then
            echo "No fast acquisition delta"
          else
            git commit -m "security-kb: sync fast PDN immutable delta [skip ci]"
            if ! git push; then
              echo "main advanced during fast acquisition; rebasing generated delta"
              git pull --rebase origin main
              git push
            fi
          fi

      - name: Try PP687 through guarded curl transport
        id: pp687
        shell: bash
        run: |
          set +e
          python TOOLS/pdn_pp687_acquire.py 2>&1 | tee /tmp/pdn-pp687-result.log
          rc=${PIPESTATUS[0]}
          echo "pp687_exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Try current 152-FZ through guarded curl transport
        id: current_root_curl
        shell: bash
        run: |
          set +e
          python TOOLS/pdn_current_root_curl_acquire.py 2>&1 | tee /tmp/pdn-current-root-curl-result.log
          rc=${PIPESTATUS[0]}
          echo "current_root_curl_exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Fallback current consolidated 152-FZ through urllib transport
        id: current_root
        if: steps.current_root_curl.outputs.current_root_curl_exit_code != '0'
        shell: bash
        run: |
          set +e
          python TOOLS/pdn_current_root_acquire.py 2>&1 | tee /tmp/pdn-current-root-urllib-result.log
          rc=${PIPESTATUS[0]}
          echo "current_root_exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Try www.pravo.gov.ru transport alias for remaining official IPS gaps
        id: pravo_www_alias
        shell: bash
        run: |
          set +e
          python TOOLS/pdn_pravo_www_alias_acquire.py 2>&1 | tee /tmp/pdn-pravo-www-alias-result.log
          rc=${PIPESTATUS[0]}
          echo "pravo_www_alias_exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Persist dedicated-route attempt telemetry
        shell: bash
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import re
          from pathlib import Path

          run_path = Path("security-corpora/RU/152-FZ/PDN_ACQUISITION_RUN.json")
          try:
              run = json.loads(run_path.read_text(encoding="utf-8"))
          except Exception:
              run = {"kind": "pdn-core-acquisition-run"}

          def classify_result(obj):
              if not isinstance(obj, dict):
                  return obj

              nested_classes = []
              nested_proof_ok = True
              nested = obj.get("results")
              if isinstance(nested, list):
                  classified_nested = []
                  for item in nested:
                      classified = classify_result(item)
                      classified_nested.append(classified)
                      if isinstance(classified, dict):
                          for label in classified.get("failure_classes") or []:
                              if label not in nested_classes:
                                  nested_classes.append(label)
                          if classified.get("proof_floor_held") is False:
                              nested_proof_ok = False
                  obj["results"] = classified_nested

              err = str(obj.get("error") or "")
              classes = []
              checks = (
                  ("TRANSPORT_TIMEOUT", r"Timeout was reached|timed out|curl exit=28"),
                  ("HTTP_FORBIDDEN", r"\b403\b|curl exit=22.*403"),
                  ("EMPTY_RESPONSE", r"empty (?:official|official-route) response"),
                  ("IDENTITY_MARKER_MISS", r"lacks required .*identity markers|lacks required PP687.*identity"),
                  ("CURRENT_REVISION_MARKER_MISS", r"current-revision|current revision|265-FZ\) markers"),
                  ("ALL_REGISTERED_ROUTES_FAILED", r"all registered .* transports failed"),
              )
              for label, pattern in checks:
                  if re.search(pattern, err, flags=re.I | re.S):
                      classes.append(label)
              for label in nested_classes:
                  if label not in classes:
                      classes.append(label)

              obj["failure_classes"] = classes
              obj["proof_floor_held"] = (
                  obj.get("status") != "IMMUTABLE_CAPTURED_RAW_ONLY" and nested_proof_ok
              )
              return obj

          def read_result(path: str):
              p = Path(path)
              if not p.exists():
                  return {"status": "NOT_RUN", "failure_classes": ["NOT_RUN"], "proof_floor_held": True}
              lines = [line.strip() for line in p.read_text(encoding="utf-8", errors="replace").splitlines() if line.strip()]
              for line in reversed(lines):
                  try:
                      obj = json.loads(line)
                  except Exception:
                      continue
                  if isinstance(obj, dict):
                      return classify_result(obj)
              return {
                  "status": "UNPARSEABLE_OUTPUT",
                  "output_tail": "\n".join(lines[-8:])[-4000:],
                  "failure_classes": ["UNPARSEABLE_OUTPUT"],
                  "proof_floor_held": True,
              }

          observed = dt.datetime.now(dt.timezone.utc).isoformat().replace("+00:00", "Z")
          run["dedicated_route_attempt_telemetry"] = {
              "observed_at": observed,
              "pp687": read_result("/tmp/pdn-pp687-result.log"),
              "current_root_curl": read_result("/tmp/pdn-current-root-curl-result.log"),
              "current_root_urllib": read_result("/tmp/pdn-current-root-urllib-result.log"),
              "www_pravo_alias": read_result("/tmp/pdn-pravo-www-alias-result.log"),
              "failure_taxonomy_version": "1.3",
              "failure_taxonomy": [
                  "TRANSPORT_TIMEOUT",
                  "HTTP_FORBIDDEN",
                  "EMPTY_RESPONSE",
                  "IDENTITY_MARKER_MISS",
                  "CURRENT_REVISION_MARKER_MISS",
                  "ALL_REGISTERED_ROUTES_FAILED",
                  "NOT_RUN",
                  "UNPARSEABLE_OUTPUT",
              ],
              "proof_rule": "Attempt telemetry records transport outcomes only and never promotes semantic or extraction status. Current PP687 capture additionally requires its PP12 validity-through-01.09.2030 fingerprint. The www.pravo.gov.ru attempt is transport-only and remains bound to a pre-registered pravo.gov.ru source identity. Nested transport results are classified individually and aggregated at the route level."
          }
          run_path.write_text(json.dumps(run, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Sync dedicated-route immutable evidence to source records and master inventory
        shell: bash
        run: python TOOLS/pdn_core_sync_capture.py

      - name: Restore authoritative Stream-2 counters after final core sync
        shell: bash
        run: python TOOLS/pdn_security_stack_reconcile_master.py

      - name: Commit dedicated-route immutable artifacts and registry telemetry
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add security-corpora/RU/152-FZ/raw \
                  security-corpora/RU/152-FZ/manifests \
                  security-corpora/RU/152-FZ/source \
                  security-corpora/RU/152-FZ/PDN_ACQUISITION_RUN.json \
                  security-corpora/RU/152-FZ/PDN_MASTER_SOURCE_INVENTORY.yaml
          if git diff --cached --quiet; then
            echo "No dedicated-route acquisition delta"
            exit 0
          fi
          git commit -m "security-kb: sync PDN dedicated-route capture evidence [skip ci]"
          if ! git push; then
            echo "main advanced during dedicated-route acquisition; rebasing generated evidence"
            git pull --rebase origin main
            git push
          fi

      - name: Surface acquisition result
        shell: bash
        run: |
          if [ -f security-corpora/RU/152-FZ/PDN_ACQUISITION_RUN.json ]; then
            cat security-corpora/RU/152-FZ/PDN_ACQUISITION_RUN.json
          fi
          if [ "${{ steps.pp687.outputs.pp687_exit_code }}" != "0" ]; then
            echo "PP687 guarded registered routes remain pending unless the www.pravo transport alias produced an accepted manifest; semantic status was not promoted." >&2
          fi
          if [ "${{ steps.current_root_curl.outputs.current_root_curl_exit_code }}" != "0" ] && \
             [ "${{ steps.current_root.outputs.current_root_exit_code }}" != "0" ]; then
            echo "Current consolidated 152-FZ remains pending unless the www.pravo transport alias produced an accepted manifest; semantic status was not promoted." >&2
          fi
