name: PDN Core Immutable Acquisition

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/pdn-core-immutable-acquisition.yml"
      - "TOOLS/pdn_core_acquire.py"
      - "TOOLS/pdn_current_root_acquire.py"
      - "TOOLS/pdn_core_sync_capture.py"
      - "security-corpora/RU/152-FZ/source/**"

permissions:
  contents: write

concurrency:
  group: pdn-core-immutable-acquisition
  cancel-in-progress: false

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Capture byte-exact official PDFs and manifests
        id: acquire
        shell: bash
        run: |
          set +e
          python TOOLS/pdn_core_acquire.py
          rc=$?
          echo "acquirer_exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Capture current consolidated 152-FZ root
        id: current_root
        shell: bash
        run: |
          set +e
          python TOOLS/pdn_current_root_acquire.py
          rc=$?
          echo "current_root_exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Sync immutable evidence to source records and master inventory
        shell: bash
        run: python TOOLS/pdn_core_sync_capture.py

      - name: Commit immutable artifacts, manifests and registry telemetry
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add security-corpora/RU/152-FZ/raw \
                  security-corpora/RU/152-FZ/manifests \
                  security-corpora/RU/152-FZ/source \
                  security-corpora/RU/152-FZ/PDN_ACQUISITION_RUN.json \
                  security-corpora/RU/152-FZ/PDN_MASTER_SOURCE_INVENTORY.yaml
          if git diff --cached --quiet; then
            echo "No acquisition delta"
            exit 0
          fi
          git commit -m "security-kb: sync PDN immutable capture evidence [skip ci]"
          git push

      - name: Surface acquisition result
        shell: bash
        run: |
          if [ -f security-corpora/RU/152-FZ/PDN_ACQUISITION_RUN.json ]; then
            cat security-corpora/RU/152-FZ/PDN_ACQUISITION_RUN.json
          fi
          if [ "${{ steps.current_root.outputs.current_root_exit_code }}" != "0" ]; then
            echo "Current consolidated 152-FZ capture remains pending; semantic status was not promoted." >&2
          fi
          if [ "${{ steps.acquire.outputs.acquirer_exit_code }}" != "0" ]; then
            echo "General acquisition completed with zero successful raw captures; inspect run telemetry." >&2
            exit 1
          fi
