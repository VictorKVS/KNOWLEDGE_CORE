name: GIS FSTEC Orders 117 and 137 Temporal Amendment Gate

on:
  push:
    paths:
      - "security-knowledge/classification/gis-fstec-117-137-temporal-amendment-atomic-v1.yaml"
      - "security-knowledge/classification/gis-fstec-117-137-temporal-amendment-regression-v1.json"
      - "security-knowledge/classification/gis-fstec-117-transition-and-classification-verified.yaml"
      - "security-knowledge/legislation/RU/regulators/FSTEK/117-2025/document.yaml"
      - "security-knowledge/legislation/RU/regulators/FSB/117-2025/document.yaml"
      - "security-knowledge/legislation/RU/regulators/FSTEK/change-graph.yaml"
      - "security-knowledge/validators/validate_gis_fstec_117_137_temporal_amendment.py"
      - ".github/workflows/gis-fstec-117-137-temporal-amendment.yml"
  pull_request:
    paths:
      - "security-knowledge/classification/gis-fstec-117-137-temporal-amendment-atomic-v1.yaml"
      - "security-knowledge/classification/gis-fstec-117-137-temporal-amendment-regression-v1.json"
      - "security-knowledge/classification/gis-fstec-117-transition-and-classification-verified.yaml"
      - "security-knowledge/legislation/RU/regulators/FSTEK/117-2025/document.yaml"
      - "security-knowledge/legislation/RU/regulators/FSB/117-2025/document.yaml"
      - "security-knowledge/legislation/RU/regulators/FSTEK/change-graph.yaml"
      - "security-knowledge/validators/validate_gis_fstec_117_137_temporal_amendment.py"
      - ".github/workflows/gis-fstec-117-137-temporal-amendment.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python security-knowledge/validators/validate_gis_fstec_117_137_temporal_amendment.py
