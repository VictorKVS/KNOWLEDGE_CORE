name: Incident Standards FSB547 Crosswalk Gate

on:
  push:
    paths:
      - 'security-knowledge/standards/incident-management-fsb547-crosswalk-v1.yaml'
      - 'security-knowledge/standards/incident-management-fsb547-crosswalk-regression-v1.json'
      - 'security-knowledge/validators/validate_incident_standards_fsb547_crosswalk.py'
      - '.github/workflows/incident-standards-fsb547-crosswalk.yml'
  pull_request:
    paths:
      - 'security-knowledge/standards/incident-management-fsb547-crosswalk-v1.yaml'
      - 'security-knowledge/standards/incident-management-fsb547-crosswalk-regression-v1.json'
      - 'security-knowledge/validators/validate_incident_standards_fsb547_crosswalk.py'
      - '.github/workflows/incident-standards-fsb547-crosswalk.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python security-knowledge/validators/validate_incident_standards_fsb547_crosswalk.py
