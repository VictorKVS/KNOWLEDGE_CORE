name: CII Sector Overlay Temporal Gate

on:
  push:
    paths:
      - 'security-knowledge/classification/cii-sector-overlay-effective-dates-2026-verified.yaml'
      - 'security-knowledge/classification/cii-sector-overlay-temporal-regression-v1.yaml'
      - 'security-knowledge/validators/validate_cii_sector_overlay_temporal.py'
      - '.github/workflows/cii-sector-overlay-temporal.yml'
  pull_request:
    paths:
      - 'security-knowledge/classification/cii-sector-overlay-effective-dates-2026-verified.yaml'
      - 'security-knowledge/classification/cii-sector-overlay-temporal-regression-v1.yaml'
      - 'security-knowledge/validators/validate_cii_sector_overlay_temporal.py'
      - '.github/workflows/cii-sector-overlay-temporal.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pyyaml
      - run: python security-knowledge/validators/validate_cii_sector_overlay_temporal.py
