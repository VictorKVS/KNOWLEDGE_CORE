name: Knowledge Graph Index

on:
  push:
    paths:
      - '**/*.yaml'
      - '**/*.yml'
      - 'tools/build_knowledge_index.py'
      - 'tools/query_knowledge.py'
      - '.ai/knowledge-index-policy.yaml'
  pull_request:
    paths:
      - '**/*.yaml'
      - '**/*.yml'
      - 'tools/build_knowledge_index.py'
      - 'tools/query_knowledge.py'
      - '.ai/knowledge-index-policy.yaml'

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyyaml
      - run: python tools/build_knowledge_index.py --output generated/knowledge-index.json
      - name: Smoke query
        run: python tools/query_knowledge.py --index generated/knowledge-index.json --limit 5
      - uses: actions/upload-artifact@v4
        with:
          name: knowledge-index
          path: generated/knowledge-index.json
