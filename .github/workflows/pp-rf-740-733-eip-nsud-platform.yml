name: PP RF 740 and 733 EIP NSUD Platform Gate

on:
  push:
    paths:
      - "security-knowledge/corpus/ru-personal-data/pp-rf-740-733-eip-nsud-platform-atomic-v1.yaml"
      - "security-knowledge/corpus/ru-personal-data/pp-rf-740-733-eip-nsud-platform-regression-v1.json"
      - "security-knowledge/corpus/ru-personal-data/2025-anonymization-source-pack.yaml"
      - "security-knowledge/pdn/pdn-master-source-library-v1.yaml"
      - "security-knowledge/validators/validate_pp_rf_740_733_eip_nsud_platform.py"
      - ".github/workflows/pp-rf-740-733-eip-nsud-platform.yml"
  pull_request:
    paths:
      - "security-knowledge/corpus/ru-personal-data/pp-rf-740-733-eip-nsud-platform-atomic-v1.yaml"
      - "security-knowledge/corpus/ru-personal-data/pp-rf-740-733-eip-nsud-platform-regression-v1.json"
      - "security-knowledge/corpus/ru-personal-data/2025-anonymization-source-pack.yaml"
      - "security-knowledge/pdn/pdn-master-source-library-v1.yaml"
      - "security-knowledge/validators/validate_pp_rf_740_733_eip_nsud_platform.py"
      - ".github/workflows/pp-rf-740-733-eip-nsud-platform.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python security-knowledge/validators/validate_pp_rf_740_733_eip_nsud_platform.py
