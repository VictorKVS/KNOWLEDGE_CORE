name: Risk Criteria Gate

on:
  push:
    paths:
      - 'security-knowledge/risk-methods/risk-criteria-schema-v1.yaml'
      - 'security-knowledge/risk-methods/risk-criteria-regression-v1.yaml'
      - 'security-knowledge/validators/validate_risk_criteria.py'
      - '.github/workflows/risk-criteria.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - run: python security-knowledge/validators/validate_risk_criteria.py
