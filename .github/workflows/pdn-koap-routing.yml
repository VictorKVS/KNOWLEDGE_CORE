name: PDn KoAP Routing Gate

on:
  push:
    paths:
      - 'security-knowledge/legal-consequences/pdn-koap-13-11-routing-regression-v1.json'
      - 'security-knowledge/validators/validate_pdn_koap_13_11_routing.py'
      - '.github/workflows/pdn-koap-routing.yml'
  pull_request:
    paths:
      - 'security-knowledge/legal-consequences/pdn-koap-13-11-routing-regression-v1.json'
      - 'security-knowledge/validators/validate_pdn_koap_13_11_routing.py'
      - '.github/workflows/pdn-koap-routing.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python security-knowledge/validators/validate_pdn_koap_13_11_routing.py
