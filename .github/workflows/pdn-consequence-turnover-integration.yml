name: PDn Consequence Turnover Integration Gate

on:
  push:
    paths:
      - 'security-knowledge/legal-consequences/pdn-incident-consequence-router-v2.yaml'
      - 'security-knowledge/legal-consequences/pdn-incident-consequence-router-v2-regression-v1.json'
      - 'security-knowledge/validators/validate_pdn_incident_consequence_turnover_integration.py'
      - '.github/workflows/pdn-consequence-turnover-integration.yml'
  pull_request:
    paths:
      - 'security-knowledge/legal-consequences/pdn-incident-consequence-router-v2.yaml'
      - 'security-knowledge/legal-consequences/pdn-incident-consequence-router-v2-regression-v1.json'
      - 'security-knowledge/validators/validate_pdn_incident_consequence_turnover_integration.py'
      - '.github/workflows/pdn-consequence-turnover-integration.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate PDn consequence turnover integration
        run: python security-knowledge/validators/validate_pdn_incident_consequence_turnover_integration.py
