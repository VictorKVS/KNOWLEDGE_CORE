name: Knowledge Promotion Gate

on:
  push:
    paths:
      - 'promotions/**'
      - 'templates/promotion-record.yaml'
      - '.ai/knowledge-promotion-policy.yaml'
      - 'tools/validate_promotion.py'
      - '.github/workflows/knowledge-promotion-gate.yml'
  pull_request:
    paths:
      - 'promotions/**'
      - 'templates/promotion-record.yaml'
      - '.ai/knowledge-promotion-policy.yaml'
      - 'tools/validate_promotion.py'
      - '.github/workflows/knowledge-promotion-gate.yml'

jobs:
  promotion-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyyaml
      - name: Validate promotion records
        shell: bash
        run: |
          shopt -s nullglob globstar
          files=(promotions/**/*.yaml promotions/**/*.yml)
          if ((${#files[@]})); then
            python tools/validate_promotion.py "${files[@]}"
          else
            echo "No promotion records yet."
          fi
