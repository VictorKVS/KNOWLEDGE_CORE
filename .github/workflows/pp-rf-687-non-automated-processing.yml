name: PP RF 687 Non-Automated Processing Gate

on:
  push:
    paths:
      - "security-knowledge/corpus/ru-personal-data/pp-rf-687-non-automated-processing-atomic-v1.yaml"
      - "security-knowledge/corpus/ru-personal-data/pp-rf-687-non-automated-processing-regression-v1.json"
      - "security-knowledge/pdn/pdn-master-source-library-v1.yaml"
      - "security-knowledge/pdn/pdn-direction-coverage-matrix-v1.yaml"
      - "security-knowledge/validators/validate_pp_rf_687_non_automated_processing.py"
      - ".github/workflows/pp-rf-687-non-automated-processing.yml"
  pull_request:
    paths:
      - "security-knowledge/corpus/ru-personal-data/pp-rf-687-non-automated-processing-atomic-v1.yaml"
      - "security-knowledge/corpus/ru-personal-data/pp-rf-687-non-automated-processing-regression-v1.json"
      - "security-knowledge/pdn/pdn-master-source-library-v1.yaml"
      - "security-knowledge/pdn/pdn-direction-coverage-matrix-v1.yaml"
      - "security-knowledge/validators/validate_pp_rf_687_non_automated_processing.py"
      - ".github/workflows/pp-rf-687-non-automated-processing.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python security-knowledge/validators/validate_pp_rf_687_non_automated_processing.py

