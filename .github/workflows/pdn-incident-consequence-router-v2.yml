name: PDn Incident Consequence Router V2 Gate

on:
  push:
    paths:
      - 'security-knowledge/legal-consequences/pdn-incident-consequence-router-regression-v2.json'
      - 'security-knowledge/validators/validate_pdn_incident_consequence_router_v2.py'
      - '.github/workflows/pdn-incident-consequence-router-v2.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python security-knowledge/validators/validate_pdn_incident_consequence_router_v2.py
