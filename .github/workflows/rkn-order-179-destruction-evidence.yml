name: RKN Order 179 Destruction Evidence Gate

on:
  push:
    paths:
      - "security-knowledge/corpus/ru-personal-data/rkn-order-179-destruction-evidence-atomic-v1.yaml"
      - "security-knowledge/corpus/ru-personal-data/rkn-order-179-destruction-evidence-regression-v1.json"
      - "security-knowledge/corpus/ru-personal-data/fl-152-article-21-remediation-destruction-atomic-v1.yaml"
      - "security-knowledge/pdn/pdn-master-source-library-v1.yaml"
      - "security-knowledge/pdn/pdn-direction-coverage-matrix-v1.yaml"
      - "security-knowledge/validators/validate_rkn_order_179_destruction_evidence.py"
      - ".github/workflows/rkn-order-179-destruction-evidence.yml"
  pull_request:
    paths:
      - "security-knowledge/corpus/ru-personal-data/rkn-order-179-destruction-evidence-atomic-v1.yaml"
      - "security-knowledge/corpus/ru-personal-data/rkn-order-179-destruction-evidence-regression-v1.json"
      - "security-knowledge/corpus/ru-personal-data/fl-152-article-21-remediation-destruction-atomic-v1.yaml"
      - "security-knowledge/pdn/pdn-master-source-library-v1.yaml"
      - "security-knowledge/pdn/pdn-direction-coverage-matrix-v1.yaml"
      - "security-knowledge/validators/validate_rkn_order_179_destruction_evidence.py"
      - ".github/workflows/rkn-order-179-destruction-evidence.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python security-knowledge/validators/validate_rkn_order_179_destruction_evidence.py
