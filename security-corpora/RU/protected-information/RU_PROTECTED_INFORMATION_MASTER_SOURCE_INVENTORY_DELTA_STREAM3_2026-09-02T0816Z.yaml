archive_regime_findings:
  - "Order 38/2025 creates a special procedure for classifying/declassifying Archive Fund documents held in state and municipal archives as containing non-secret service information of limited distribution; it is not a universal secrecy classifier."
  - "The restricted List used by Order 38 is itself DLU and is not publicly reconstructed; official Rosarchive statements are used only within their published scope."
  - "A concrete access restriction under Order 38 depends on the Rosarchive commission/decision workflow and accounting update; sensitive-looking content alone is not promoted to DLU."
  - "Order 77/2023 point 31 requires nonrecoverable destruction of documents containing PDN, marked DLU, or containing restricted-access information after the lawful disposal procedure; this is not a deletion trigger."
  - "Order 77 point 33 prohibits reducing normatively established document retention periods."
  - "125-FZ remains the cross-sector archive framework; Article 25 access restrictions and Article 22.1 personnel-document terms are separate from universal PDN retention."

advertising_regime_findings:
  - "38-FZ current consolidation is revalidated to 04.08.2026; source-level amender 283-FZ took effect 01.09.2026."
  - "No change from 283-FZ to selected Articles 12, 18 or 18.1 was identified in this sweep; Article 18.1(13) still requires regulator-side storage of the statutory internet-ad data for at least three years from receipt."
  - "Advertising consent remains distinct from personal-data processing consent; advertising retention remains object/actor specific."

