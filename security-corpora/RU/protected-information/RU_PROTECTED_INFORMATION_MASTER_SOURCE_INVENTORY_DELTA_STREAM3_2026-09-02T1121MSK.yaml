dlu_regime_findings:
  - "PP RF 1233 is current in revision dated 04.03.2026; the latest amendment is PP RF 226/2026, effective 13.03.2026."
  - "The regime concerns non-secret service information of limited distribution. It is explicitly separated from state-secret documents."
  - "The 2024 amendment 1350 added a special archival layer for non-secret Archive Fund information whose dissemination may create a potential threat to Russian Federation interests."
  - "The 2026 amendment 226 explicitly brought electronic DLU documents into the handling model, added information-security requirements for electronic processing/storage/exchange, and modernized copying, forwarding, destruction and demarking rules."
  - "The recommendation added by PP 226 for a wider public/publicly significant actor set is stored as a recommendation and is not promoted to a universal mandatory duty."

retention_and_destruction_findings:
  - "PP 1233 does not set one numeric retention period for DLU documents."
  - "Point 2.6 ties destruction to the lawful records/archival lifecycle and then requires a method that prevents recovery."
  - "For electronic documents, destruction of the medium or residual-data removal must make reading/recovery impossible."
  - "Secure destruction method is not a retention period and is not an independent trigger for deletion of personal data."

