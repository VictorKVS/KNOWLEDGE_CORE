public_sector_pdn_findings:
  - "Article 42 is a direct special personal-data regime for state civil servants and their personal files; it does not govern every public-sector employee or every government-held personal-data system."
  - "Article 42 part 1 links civil-service HR processing to Russian personal-data legislation and imposes specific restrictions on sources, sensitive/private-life data, automated decisions, protection and third-party transfer."
  - "Article 42 parts 3-4 define the personal-file object and delegate the implementing personal-data/personal-file regulation to the President; Decree 609 is the existing canonical implementation node."
  - "Article 43 part 2 adds a registry/GIS protection requirement for information from the personal file, but does not itself define a retention duration."

biometric_genomic_overlap_findings:
  - "The current amendment 52-FZ, effective 07.06.2026, changes Article 15 part 5 so civil servants are subject to state fingerprint and state genomic registration only in cases and according to procedures established by federal laws."
  - "This creates discovery edges to Federal Law 128-FZ on state fingerprint registration and Federal Law 242-FZ on state genomic registration; neither edge is promoted to universal applicability until those primary acts and triggering conditions are separately verified."
  - "Fingerprint registration is not automatically treated as the Unified Biometric System regime, and genomic registration is not automatically classified as biometric personal data under 152-FZ without separate legal proof."

retention_findings:
  - "No universal numeric retention period for all civil-servant personal data was derived from 79-FZ Articles 42-43."
  - "The previously registered 10-year post-dismissal HR custody stage belongs to Decree 609 point 23 and remains a specific personal-file lifecycle rule, followed by archive transfer rather than deletion."

