protected_information:
  scope_actor: "оператор автоматизированной информационной системы страхования"
  protected_locators:
    - locator: "пункт 1"
      concept: OPERATIONAL_AUDIT_PERIODICITY
      findings:
        - "Оператор АИС страхования обязан проводить операционный аудит не реже одного раза в два года."
        - "Аудит проводится как оценка соответствия систем, процедур и мер федеральным законам, иным НПА РФ и нормативным актам Банка России, регулирующим деятельность оператора."
      guard: "TWO_YEAR_AUDIT_PERIODICITY != PERSONAL_DATA_RETENTION_PERIOD"
    - locator: "пункт 1, абзац о защите информации"
      concept: PROTECTED_INFORMATION_SECURITY_ASSURANCE
      findings:
        - "Предмет аудита включает меры защиты информации, содержащейся в АИС страхования, требования к которым установлены Банком России на основании статьи 33.10 Закона РФ № 4015-I."
      guard: "AUDIT_SCOPE != AUTOMATIC_APPLICABILITY_TO_EVERY_INSURANCE_INFORMATION_SYSTEM"
    - locator: "пункт 1, абзац о защите персональных данных"
      concept: DIRECT_PDN_SECURITY_AUDIT_REFERENCE
      findings:
        - "Предмет аудита прямо включает меры защиты персональных данных при их обработке в АИС страхования в соответствии со статьей 19 152-ФЗ."
        - "Оценка охватывает угрозы безопасности ПДн, определенные Банком России на основании части 5 статьи 19 152-ФЗ и подпункта 6 пункта 7 статьи 33.10 Закона РФ № 4015-I."
      guard: "DIRECT_ARTICLE_19_REFERENCE != CLASSIFICATION_OF_ALL_AIS_INSURANCE_INFORMATION_AS_PERSONAL_DATA"
    - locator: "пункт 2"
      concept: AUDIT_PLAN_AND_REGULATORY_TRACEABILITY
      findings:
        - "До аудита оператор формирует план с перечнем проверяемых систем, процедур и мер, применимых законов и нормативных актов, сроком аудита, порядком утверждения отчета и его направления в Банк России."
    - locator: "пункт 2"
      concept: REGULATOR_REPORTING_DEADLINE
      findings:
        - "Отчет об операционном аудите направляется в Банк России через личный кабинет в течение пяти рабочих дней со дня его утверждения."
      guard: "FIVE_WORKING_DAY_AUDIT_REPORT_DEADLINE != PDN_INCIDENT_NOTIFICATION_OR_DATA_SUBJECT_RESPONSE_PERIOD"
    - locator: "пункты 3-5"
      concept: AUDIT_EXECUTION_AND_EVIDENCE
      findings:
        - "Оператор определяет внутреннее уполномоченное лицо/подразделение либо привлекает юридическое лицо-аудитора."
        - "План передается аудитору не позднее чем за 10 календарных дней, исключая нерабочие праздничные дни, до начала срока аудита."
        - "Отчет фиксирует проверенные системы, процедуры и меры, применимые нормативные источники, результаты, недостатки и рекомендации."

