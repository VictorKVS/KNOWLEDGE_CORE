applicability:
  state: CANDIDATE_APPLICABILITY_REVIEW_REQUIRED
  guards:
    - "6863-У адресовано оператору АИС страхования; не переносить его требования автоматически на всех страховщиков и все их ИС."
    - "Прямая ссылка на статью 19 152-ФЗ относится к мерам защиты ПДн при фактической обработке ПДн в АИС страхования."
    - "Периодичность аудита не является сроком хранения ПДн."
    - "Пятидневный срок направления отчета Банку России не является сроком уведомления об инциденте или ответа субъекту ПДн."
  executable_rule_status: NOT_PROMOTED

