status: NEW_PRIMARY_ACT_IDENTIFIED_OFFICIAL_REGULATOR_ARTICLE3_DUTY_CONFIRMED_CURRENT_CONSOLIDATION_CROSSCHECKED_EXACT_CURRENT_ARTIFACT_PENDING_VERSION_CHAIN_PARTIAL
