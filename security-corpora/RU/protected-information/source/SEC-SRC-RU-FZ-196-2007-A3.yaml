proof_floor:
  - "Профессиональная тайна ломбарда является самостоятельным специальным режимом и не равна персональным данным."
  - "Статья 3 применяется к специальному набору сведений, полученных ломбардом от заемщика или поклажедателя в связи с договором займа или хранения; это не означает автоматическую применимость каждого требования 152-ФЗ."
  - "Исключение из состава профессиональной тайны для отдельных характеристик невостребованной вещи не является разрешением раскрывать сведения о клиенте."
  - "Exact current authoritative bytes не получены; retrieved_at, MIME, byte length и SHA-256 не синтезируются."

