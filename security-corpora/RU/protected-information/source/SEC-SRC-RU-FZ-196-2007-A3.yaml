protected_locators:
  - locator: "статья 3, часть 1"
    concept: PAWNSHOP_PROFESSIONAL_SECRET_SCOPE
    state: CURRENT_CONSOLIDATED_TEXT_CROSSCHECKED_OFFICIAL_REGULATOR_REFERENCES_PART1
    finding: >-
      В состав профессиональной тайны входят сведения, полученные ломбардом от заемщика или поклажедателя в связи с заключением договора займа
      либо договора хранения, за исключением прямо указанной законом информации о наименовании и описании технических, технологических и
      качественных характеристик невостребованной вещи, на которую обращено взыскание в порядке статьи 12.
    guard: "Проверять конкретное поле и договорный контекст; не считать все сведения о деятельности ломбарда профессиональной тайной."
  - locator: "статья 3, часть 2"
    concept: PAWNSHOP_CONFIDENTIALITY_DUTY
    state: OFFICIAL_REGULATOR_CURRENT_DUTY_CONFIRMED
    finding: >-
      Ломбард и его работники обязаны соблюдать конфиденциальность информации, составляющей профессиональную тайну, и несут установленную законом
      ответственность за ее разглашение.
  - locator: "статья 1 / статья 2 / статья 7 / статья 9"
    concept: NATURAL_PERSON_BORROWER_DEPOSITOR_CONTEXT
    state: CURRENT_CONSOLIDATED_CONTEXT_CROSSCHECKED
    finding: >-
      Основные операции ломбарда связаны с краткосрочными займами гражданам (физическим лицам) и хранением вещей; это создает сильный кандидат
      пересечения с персональными данными, но не заменяет проверку состава данных и конкретной операции.

pdn_relation:
  target: "152-ФЗ"
  state: POSSIBLE_DUAL_REGIME_ON_SCENARIO_PROOF_ONLY
  evidence_dimensions:
    - "заемщик по статье 7 — гражданин (физическое лицо)"
    - "часть 1 статьи 3 охватывает сведения, полученные от заемщика или поклажедателя в договорном контексте"
    - "профессиональная тайна определяется специальным законом и имеет собственное исключение по характеристикам невостребованной вещи"
  guard: >-
    Для конкретного требования определить идентифицируемое физическое лицо, состав сведений, операцию обработки, цель, роль ломбарда и работника,
    договорный контекст, основание обработки и получателя. PAWNSHOP_SECRET != PERSONAL_DATA; OVERLAP != APPLICABILITY.

cross_regime_relations:
