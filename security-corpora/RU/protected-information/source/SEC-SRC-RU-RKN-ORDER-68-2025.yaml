protected_information:
  sector: advertising_marketing
  regime: internet_advertising_identifier_traceability
  legal_basis: "38-ФЗ статья 18.1"
  protected_locators:
    - locator: "Требования, общие положения"
      concept: AD_IDENTIFIER_TRACEABILITY_TOKEN
      finding: "Идентификатор является уникальным цифровым обозначением, используемым для прослеживаемости и учета интернет-рекламы и социальной рекламы."
    - locator: "Требования, присвоение идентификатора"
      concept: PRE_DISTRIBUTION_IDENTIFIER_ASSIGNMENT
      finding: "Оператор рекламных данных присваивает идентификатор непосредственно до распространения рекламы после передачи рекламы в программное обеспечение ОРД."
    - locator: "Требования, взаимодействие с Роскомнадзором"
      concept: IDENTIFIER_TO_RKN_TRANSPORT
      finding: "Идентификатор передается в информационную систему Роскомнадзора в рамках установленного протокола взаимодействия."
    - locator: "Требования, пункт 14"
      concept: AD_IDENTIFIER_RETENTION_ONE_YEAR
      finding: "Оператор рекламных данных хранит присвоенные идентификаторы в течение одного года со дня их присвоения."
    - locator: "Требования, пункт 15"
      concept: CODED_LINK_DECODING_DATA
      finding: "При использовании кодированной технической ссылки оператор рекламной системы или ОРД предоставляет в информационную систему коды декодирования для хранения идентификаторов."
  applicability_status: CANDIDATE_APPLICABILITY_REVIEW_REQUIRED
  applicability_guard: "Идентификатор рекламы является отраслевым traceability-токеном. Его наличие само по себе не доказывает обработку ПДн; связь с физлицом должна быть установлена по конкретным данным и операции."

