proof_floor:
  - "Аудиторская тайна является самостоятельным специальным режимом конфиденциальной информации и не равна персональным данным."
  - "Попадание персональных данных в материалы аудита создает только возможное пересечение режимов; применимость конкретных требований 152-ФЗ устанавливается отдельно по субъекту, данным, операции, цели, роли и правовому основанию."
  - "Законные исключения из запрета передачи по статье 9 не являются универсальным разрешением раскрытия любых сведений."
  - "Текущий официальный byte-exact артефакт не получен; MIME, byte length, SHA-256 и retrieved_at не синтезируются."

