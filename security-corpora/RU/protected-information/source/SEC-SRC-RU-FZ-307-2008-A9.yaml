title: "Федеральный закон от 30.12.2008 № 307-ФЗ «Об аудиторской деятельности» — статья 9 «Аудиторская тайна»"
status: NEW_PRIMARY_ACT_IDENTIFIED_CURRENT_LOCATOR_CROSSCHECKED_LATEST_LOCATOR_AMENDMENT_PUBLICATION_VERIFIED_EXACT_CURRENT_ARTIFACT_PENDING_VERSION_CHAIN_PARTIAL
