protected_locators:
  - locator: "статья 9, часть 1"
    concept: AUDIT_SECRET_SCOPE
    state: CURRENT_CONSOLIDATED_TEXT_CROSSCHECKED_AUTHORITY_HOSTED_HISTORICAL_TEXT_SUPPORTS_CORE_RULE
    finding: >-
      Аудиторскую тайну составляют сведения и документы, полученные и (или) составленные аудиторской организацией,
      ее работниками, индивидуальным аудитором и его работниками при оказании предусмотренных законом услуг,
      за исключением прямо перечисленных законом сведений.
  - locator: "статья 9, часть 2"
    concept: AUDIT_CONFIDENTIALITY_DUTY
    state: CURRENT_OBLIGATION_LOCATOR_CONFIRMED_BY_2026_REGULATORY_LIST
    finding: >-
      Аудиторская организация, ее работники, индивидуальный аудитор и его работники обязаны обеспечивать конфиденциальность
      информации, составляющей аудиторскую тайну.
  - locator: "статья 9, часть 3"
    concept: AUDIT_NON_DISCLOSURE_AND_TRANSFER_RESTRICTION
    state: CURRENT_OBLIGATION_LOCATOR_CONFIRMED_BY_2026_REGULATORY_LIST
    finding: >-
      Передача третьим лицам и разглашение сведений/документов, составляющих аудиторскую тайну, без предварительного письменного
      согласия лица, которому оказывались услуги, запрещены, кроме предусмотренных федеральными законами случаев.
  - locator: "статья 9, часть 3.1"
    concept: BANK_OF_RUSSIA_AUDIT_SECRET_SPECIAL_TRANSFER_RULE
    state: CURRENT_CONSOLIDATED_TEXT_CROSSCHECKED_LATEST_LOCATOR_AMENDMENT_PUBLICATION_VERIFIED
    finding: >-
      Для сведений и документов, полученных в специальном контексте статьи 14.1, действует отдельный режим предварительного письменного
      согласия Банка России и лица, которому оказывались аудиторские услуги, с предусмотренными законом исключениями.
  - locator: "статья 9, часть 4"
    concept: STATUTORY_LAWFUL_DISCLOSURE_EXCEPTION
    state: CURRENT_CONSOLIDATED_TEXT_CROSSCHECKED
    finding: >-
      Передача аудиторской тайны в случаях и порядке, прямо предусмотренных федеральными законами, не считается нарушением аудиторской тайны.
    guard: "Каждый получатель, основание, состав сведений и процедура передачи проверяются отдельно."
  - locator: "статья 9, части 5-6"
    concept: DOWNSTREAM_CONFIDENTIALITY_AND_DAMAGE_REMEDY
    state: CURRENT_CONSOLIDATED_TEXT_CROSSCHECKED_LATEST_LOCATOR_AMENDMENT_PUBLICATION_VERIFIED
    finding: >-
      Закон распространяет обязанность конфиденциальности на уполномоченные органы, Банк России, СРО аудиторов и иных законных получателей;
      разглашение создает предусмотренную законом возможность требовать возмещения причиненных убытков.

pdn_relation:
  target: "152-ФЗ"
  state: POSSIBLE_DUAL_REGIME_ON_SCENARIO_PROOF_ONLY
  evidence_dimensions:
    - "аудиторские материалы могут содержать сведения об идентифицируемых физических лицах"
    - "состав аудиторской тайны существенно шире персональных данных и охватывает документы/сведения аудируемого лица"
    - "основания и каналы раскрытия в статье 9 должны анализироваться независимо от оснований обработки ПДн"
  guard: >-
    Для конкретного требования установить субъекта данных, операцию, цель аудита/иной услуги, роль аудиторской организации и получателя,
    состав сведений, согласие либо специальное законное основание. OVERLAP != APPLICABILITY.

cross_regime_relations:
  - target: "SEC-SRC-RU-LAW-395-1"
    type: BANKING_SECRECY_AUDIT_MATERIAL_OVERLAP_CANDIDATE
    state: RELATION_CANDIDATE_NOT_REGIME_EQUIVALENCE
    guard: "При аудите кредитной организации одни сведения могут одновременно попадать в банковскую и аудиторскую тайну; состав и правовое основание должны доказываться по конкретному материалу."
  - target: "98-ФЗ от 29.07.2004"
    type: COMMERCIAL_SECRET_AUDIT_MATERIAL_OVERLAP_CANDIDATE
    state: DISCOVERY_RELATION_ONLY
    guard: "Аудиторская тайна не заменяет режим коммерческой тайны; наличие второго режима определяется его самостоятельными юридическими предпосылками."

