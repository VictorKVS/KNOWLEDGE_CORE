  protected_locators:
    - locator: "Приложение № 1"
      concept: ACTOR_SCOPED_AVAILABLE_AD_INFORMATION
      finding: "Определяет состав имеющейся у Роскомнадзора информации об интернет-рекламе и социальной рекламе, доступной предусмотренным законом участникам рекламного рынка."
