      concept: PARTICIPANT_ACCESS_TO_RKN_AD_INFORMATION_SYSTEM
      finding: "Роскомнадзор обеспечивает участникам, перечисленным приказом и 38-ФЗ, доступ к относящейся к ним информации, включая сведения об идентификаторе рекламы, через информационную систему радиочастотной службы."
    - locator: "Приложение № 2"
      concept: ACTOR_AND_RIGHTS_SCOPED_ACCESS
      finding: "Доступ ограничен нормативно определенным составом информации и ролью участника; приказ не устанавливает неограниченное раскрытие всего массива интернет-рекламы."
  applicability_status: CANDIDATE_APPLICABILITY_REVIEW_REQUIRED
  applicability_guard: "Наличие доступа к регуляторному рекламному массиву не доказывает, что весь массив является ПДн. Проверять конкретный состав доступных полей и идентифицируемость физлица."

