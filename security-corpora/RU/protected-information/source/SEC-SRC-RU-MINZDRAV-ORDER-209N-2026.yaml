      evidence_status: PUBLISHED_TEXT_CROSSCHECK_EXACT_PRIMARY_BINARY_PENDING
    - locator: "procedure_point_4"
      type: local_governance_and_access
      rule: "Локальный акт организации определяет перечень электронных документов и используемых информационных систем, порядок доступа работников и иных уполномоченных лиц, лиц с правом подписи и порядок предоставления документации для контроля ОМС."
      evidence_status: PUBLISHED_TEXT_CROSSCHECK_EXACT_PRIMARY_BINARY_PENDING
    - locator: "electronic_signature_layer"
      type: qualified_electronic_signature
      rule: "Новый Порядок сохраняет юридически значимый слой электронной подписи; при совместном формировании документа каждый участвующий медицинский/фармацевтический работник подписывает документ своей усиленной квалифицированной электронной подписью."
      evidence_status: PUBLISHED_TEXT_CROSSCHECK_EXACT_PRIMARY_BINARY_PENDING
    - locator: "procedure_point_29"
      type: person_level_medical_document_fields
