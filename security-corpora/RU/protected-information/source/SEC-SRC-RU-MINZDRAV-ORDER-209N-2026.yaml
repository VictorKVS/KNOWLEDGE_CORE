protected_regime:
  name: electronic_medical_documentation
  anchors:
    - locator: "procedure_point_1"
      type: actor_scope
      rule: "Порядок охватывает медицинских и фармацевтических работников, территориальные фонды ОМС, страховые медицинские организации, операторов используемых информационных систем, пациентов, законно допущенные органы/организации, а также медицинские и фармацевтические организации при ведении электронной медицинской документации."
      evidence_status: CURRENT_PUBLISHED_TEXT_CROSSCHECK_EXACT_PRIMARY_BINARY_PENDING
    - locator: "procedure_point_2"
      type: paper_opt_out_context
      rule: "Электронное ведение без бумажного дублирования допускается при отсутствии письменного заявления пациента (законного представителя) о ведении документации на бумажном носителе и при выполнении требований Порядка."
      evidence_status: CURRENT_PUBLISHED_TEXT_CROSSCHECK_EXACT_PRIMARY_BINARY_PENDING
    - locator: "procedure_point_3"
      type: electronic_medical_document_lifecycle
      rule: "Электронное ведение включает формирование, подписание и хранение документов, регистрацию в ЕГИСЗ и предоставление предусмотренного законом доступа."
      evidence_status: CURRENT_PUBLISHED_TEXT_CROSSCHECK_EXACT_PRIMARY_BINARY_PENDING
    - locator: "procedure_point_4"
      type: local_governance_and_access
      rule: "Локальный акт организации определяет перечень электронных документов и используемых информационных систем, порядок доступа работников и иных уполномоченных лиц, лиц с правом подписи и порядок предоставления документации для контроля ОМС."
      evidence_status: CURRENT_PUBLISHED_TEXT_CROSSCHECK_EXACT_PRIMARY_BINARY_PENDING
    - locator: "procedure_points_9_13"
      type: electronic_signature_layer
      rule: "Порядок устанавливает юридически значимый слой электронной подписи для электронных медицинских документов с предусмотренными исключениями и специальными случаями."
      evidence_status: CURRENT_PUBLISHED_TEXT_CROSSCHECK_EXACT_PRIMARY_BINARY_PENDING
    - locator: "procedure_point_10"
      type: patient_record_aggregation
      rule: "Медицинские карты, включая документацию несовершеннолетнего, формируются как совокупность электронных медицинских документов и сведений о состоянии здоровья конкретного пациента."
      evidence_status: CURRENT_PUBLISHED_TEXT_CROSSCHECK_EXACT_PRIMARY_BINARY_PENDING
    - locator: "procedure_point_21"
      type: retention_object_link
      rule: "Электронные медицинские документы хранятся в используемой для их формирования информационной системе не менее срока хранения соответствующих медицинских документов на бумажном носителе."
      evidence_status: CURRENT_PUBLISHED_TEXT_CROSSCHECK_EXACT_PRIMARY_BINARY_PENDING
    - locator: "procedure_point_22"
      type: version_retention
      rule: "При исправлениях информационная система обеспечивает хранение всех версий электронного медицинского документа и их подписей в составе метаданных на протяжении всего срока хранения электронного медицинского документа."
      evidence_status: CURRENT_PUBLISHED_TEXT_CROSSCHECK_EXACT_PRIMARY_BINARY_PENDING

