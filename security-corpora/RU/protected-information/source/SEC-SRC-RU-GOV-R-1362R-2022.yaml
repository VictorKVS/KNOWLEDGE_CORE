protected_information:
  sector: advertising_marketing
  regime: internet_advertising_regulatory_dataset_composition
  legal_basis: "38-ФЗ статья 18.1 часть 1"
  protected_locators:
    - locator: "Состав информации, пункт 1"
      concept: INTERNET_AD_REGULATORY_DATASET_SCOPE
      finding: "В состав учитываемой, хранимой и обрабатываемой Роскомнадзором информации входят сведения о рекламодателях, рекламораспространителях и операторах рекламных систем, которыми могут быть российские и иностранные юридические лица, физические лица и индивидуальные предприниматели, а также сведения о рекламе и социальной рекламе."
    - locator: "Состав информации, сведения о физическом лице/ИП"
      concept: PERSON_LEVEL_IDENTIFICATION_FIELDS
      finding: "Набор предусматривает идентифицирующие сведения о физических лицах и ИП, включая ФИО и иные реквизиты, предусмотренные составом для соответствующей категории участника."
    - locator: "Состав информации, контактные и адресные реквизиты"
      concept: PERSON_LEVEL_CONTACT_AND_ADDRESS_FIELDS
      finding: "Для отдельных категорий физических лиц состав предусматривает контактные/адресные реквизиты; конкретный PDN-статус должен оцениваться по фактически передаваемому набору."
    - locator: "Состав информации, представители/посредники"
      concept: REPRESENTATIVE_AND_INTERMEDIARY_PERSON_DATA
      finding: "Состав включает сведения о лицах, действующих от имени участников рекламного рынка или участвующих в договорной цепочке, когда это предусмотрено соответствующим полем набора."
  applicability_status: CANDIDATE_APPLICABILITY_REVIEW_REQUIRED
  applicability_guard: "Наличие нормативно заданных person-level полей создает сильное пересечение с 152-ФЗ, но применимость конкретных обязанностей определяется только после доказательства роли, конкретной записи, операции, цели и правового основания. Записи исключительно о юридических лицах не становятся ПДн автоматически."

