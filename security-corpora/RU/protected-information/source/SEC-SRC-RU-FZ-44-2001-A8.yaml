status: NEW_PRIMARY_ACT_IDENTIFIED_OFFICIAL_CURRENT_LOCATOR_IDENTIFIED_ARTICLE8_CURRENT_TEXT_CROSSCHECKED_LOCATOR_AMENDMENTS_RECONCILED_EXACT_CURRENT_ARTIFACT_PENDING_VERSION_CHAIN_PARTIAL
