protected_locators:
  - locator: "статья 8, часть 1"
    concept: CHILD_DATABANK_CONFIDENTIAL_QUESTIONNAIRES
    state: CURRENT_TEXT_CROSSCHECKED_LOCATOR_AMENDMENT_OFFICIAL_PUBLICATION_VERIFIED
    finding: >-
      Анкеты ребенка, кандидата принять ребенка в семью, граждан, лишенных или ограниченных в родительских правах, отстраненных опекунов и бывших усыновителей в предусмотренном законом случае относятся к конфиденциальной информации; порядок доступа задается статьей 11 этого закона.
  - locator: "статья 8, часть 2, абзац 1"
    concept: DERIVATIVE_CHILD_INFORMATION_SPECIAL_PURPOSE
    state: CURRENT_TEXT_CROSSCHECKED_488FZ_EFFECTIVE_2024_07_01
    finding: >-
      Орган опеки и попечительства, региональные и федеральный операторы могут использовать конфиденциальную информацию о детях для создания и распространения производной информации в целях информирования населения о детях, подлежащих устройству в семьи; коммерческое использование производной информации не допускается.
  - locator: "статья 8, часть 2, абзац 2"
    concept: CHILD_AND_FAMILY_DEIDENTIFICATION_GATE
    state: CURRENT_TEXT_CROSSCHECKED
    finding: >-
      При создании и распространении производной информации должна быть исключена возможность идентификации ребенка, его родителей и других родственников.
  - locator: "статья 8, часть 2, абзац 3"
    concept: DERIVATIVE_INFORMATION_SENSITIVE_FIELDS
    state: CURRENT_TEXT_CROSSCHECKED
    finding: >-
      Закон допускает в составе производной информации, среди прочего, имя, пол, возраст, состояние здоровья, сведения о физическом и умственном развитии, причины отсутствия родительского попечения, сведения о здоровье родителей, братьев и сестер, родственниках, возможных формах устройства и фотографии.
  - locator: "статья 11"
    concept: CONFIDENTIAL_ACCESS_PROCEDURE_CROSS_REFERENCE
    state: STATUTORY_CROSS_REFERENCE_REQUIRES_SEPARATE_LOCATOR_REVIEW
    finding: "Статья 8 часть 1 прямо отсылает порядок доступа к конфиденциальной информации к статье 11."

pdn_relation:
  target: "152-ФЗ"
  state: CANDIDATE_DUAL_REGIME_ON_DATA_FIELD_OPERATION_AND_ROLE_PROOF_ONLY
  evidence_dimensions:
    - "анкеты и банк данных относятся к конкретным детям и гражданам"
    - "статья 8 прямо регулирует идентификацию/деидентификацию ребенка, родителей и родственников"
    - "в состав производной информации могут входить сведения о состоянии здоровья и фотографии"
    - "488-ФЗ ввел прямой PDN-context для отдельных передач из государственного банка данных в статью 10; это подтверждает необходимость отдельной проверки операций"
  guard: >-
    Для конкретного требования определить субъект данных, конкретное поле, специальную категорию при наличии, операцию, цель, роль органа/оператора/получателя, основание обработки и раскрытия, режим статьи 8, порядок доступа статьи 11 и другие прямые statutory gates. OVERLAP != APPLICABILITY.

