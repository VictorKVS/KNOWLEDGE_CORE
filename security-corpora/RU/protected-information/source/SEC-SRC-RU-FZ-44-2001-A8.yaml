proof_floor:
  - "Режим конфиденциальности государственного банка данных о детях является самостоятельным специальным режимом; CHILD_DATABANK_CONFIDENTIALITY != PERSONAL_DATA."
  - "Статья 8 прямо охватывает анкеты детей и нескольких категорий граждан и относит их к конфиденциальной информации; наличие идентифицируемых лиц создает пересечение с 152-ФЗ, но не доказывает применимость каждого требования 152-ФЗ."
  - "Производная информация по статье 8 части 2 допускается только в специальной цели информирования о детях, подлежащих устройству в семьи; при создании и распространении должна быть исключена возможность идентификации ребенка, родителей и других родственников."
  - "Состояние здоровья ребенка и родственников может входить в производную информацию, но это не отменяет отдельную проверку режима специальных категорий ПДн, цели, ролей, основания и конкретной операции обработки."
  - "Exact current authoritative bytes не получены; retrieved_at, MIME, byte length и SHA-256 не синтезируются."

