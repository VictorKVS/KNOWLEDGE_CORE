    - locator: "статья 3"
      concepts: [BIOMETRIC_PERSONAL_DATA, UNIFIED_BIOMETRIC_SYSTEM, VOLUNTARY_BIOMETRIC_PROVISION, SERVICE_NON_CONDITIONING, CROSS_BORDER_BIOMETRIC_TRANSFER_RESTRICTION]
      finding: >-
        The law establishes the special EBS identification/authentication regime; Article 3 contains dedicated rules on
        biometric data, voluntariness/non-conditioning and a cross-border biometric-transfer restriction with statutory exceptions.
    - locator: "статья 15"
      concepts: [BIOMETRIC_PROCESSING_OUTSIDE_EBS, COLLECTION_AND_STORAGE_RESTRICTIONS, AUTHENTICATION_VIA_BIOMETRIC_VECTORS]
      finding: >-
        Article 15 establishes a separate rule set for processing biometric personal data outside the unified biometric
        system, including restrictions on collection/storage in identification/authentication scenarios.
    - locator: "статья 17"
      concepts: [AUTHENTICATION_ORGANIZATION_ACCREDITATION, MANDATORY_REQUIREMENTS]
      finding: "Accreditation requirements exist for organizations performing authentication on the basis of biometric personal data."

pdn_relation:
  target: "152-ФЗ"
  state: DIRECT_EXPLICIT_STATUTORY_RELATION_APPLICATION_SCOPE_REVIEW_REQUIRED
  evidence:
    - "572-ФЗ expressly refers to consent requirements under 152-ФЗ in identification/authentication provisions."
    - "572-ФЗ expressly links blocking/deletion/destruction actions to personal-data legislation."
    - "Article 3 distinguishes treatment of EBS vectors from biometric personal data under Articles 11 and 19 of 152-ФЗ."
  guard: >-
    Explicit statutory cross-reference proves a legal relationship between the regimes, but not that every organization,
    system or biometric-like feature falls within every provision of 572-ФЗ.

