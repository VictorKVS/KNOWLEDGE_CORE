protected_regime:
  name: commercial_secret
  anchors:
    - locator: "article_1"
      type: scope
      rule: "Режим относится к информации с действительной или потенциальной коммерческой ценностью вследствие неизвестности третьим лицам; государственная тайна регулируется отдельно."
    - locator: "article_3"
      type: definitions
      rule: "Коммерческая тайна — режим конфиденциальности; информация, составляющая коммерческую тайну, требует отсутствия свободного законного доступа и введенного обладателем режима."
    - locator: "article_5"
      type: exclusions
      rule: "Перечень сведений, в отношении которых режим коммерческой тайны не может быть установлен."
    - locator: "article_6"
      type: lawful_provision_to_authorities
      rule: "Предоставление государственным органам по мотивированному требованию и межведомственное предоставление в случаях, установленных законом, с сохранением ограничений режима."
    - locator: "article_10"
      type: confidentiality_controls
      rule: "Для установления режима требуются перечень сведений, ограничение и контроль доступа, учет лиц, договорное регулирование и маркировка; возможны технические меры защиты."
    - locator: "article_11"
      type: employment_confidentiality
      rule: "Устанавливает обязанности работодателя и работника при доступе к коммерческой тайне в трудовых отношениях."
    - locator: "article_13"
      type: government_recipient_confidentiality
      rule: "Государственные и муниципальные органы обязаны создавать условия для охраны конфиденциальности полученной коммерческой тайны."

pdn_relationship:
  status: CANDIDATE_APPLICABILITY_REVIEW_REQUIRED
  relationship_type: POSSIBLE_DUAL_REGIME_ON_RECORD_AND_OPERATION_PROOF_ONLY
  proof_guards:
    - "COMMERCIAL_SECRET != PERSONAL_DATA"
    - "Сведения могут одновременно подпадать под 98-ФЗ и 152-ФЗ только при отдельном доказательстве условий каждого режима."
    - "Сведения, исключенные статьей 5 из коммерческой тайны, не становятся автоматически общедоступными и не перестают быть персональными данными."
    - "Коммерческая тайна может защищать сведения о юридических лицах и бизнес-процессах, которые персональными данными не являются."
  overlap_candidates:
    - target: "152-ФЗ"
      relation: POSSIBLE_DUAL_REGIME_ON_RECORD_AND_OPERATION_PROOF_ONLY
    - target: "ТК РФ глава 14"
      relation: REGIME_BOUNDARY_EMPLOYMENT_DATA_EXCLUSION_FROM_COMMERCIAL_SECRET_NOT_PDN_EXCLUSION
      note: "Статья 5 содержит специальные исключения по сведениям о работниках/оплате/условиях труда; это не отменяет самостоятельную защиту ПДн работников."

