proof_floor:
  - "Конфиденциальность источника СМИ и ограничения на раскрытие сведений о несовершеннолетних являются самостоятельными специальными режимами Закона о СМИ и не равны персональным данным."
  - "Наличие имени, изображения, голоса, места жительства/учебы/работы или иной идентифицирующей информации создает сильное пересечение с 152-ФЗ, но применимость конкретного требования 152-ФЗ устанавливается только по субъекту, данным, операции, цели, роли и правовому основанию."
  - "Исключение по требованию суда относится к раскрытию источника в конкретном процессуальном контексте и не является общим разрешением разглашать конфиденциальную информацию."
  - "Специальные исключения статьи 41 по защите прав несовершеннолетнего применяются только при выполнении условий самой нормы; их нельзя расширять на иные публикации."
  - "Exact current authoritative bytes не получены; retrieved_at, MIME, byte length и SHA-256 не синтезируются."

