title: "Закон Российской Федерации от 27.12.1991 № 2124-I «О средствах массовой информации» — статья 41 «Обеспечение конфиденциальности информации»"
status: NEW_PRIMARY_ACT_IDENTIFIED_CURRENT_OFFICIAL_LOCATOR_IDENTIFIED_ARTICLE41_CURRENT_TEXT_CROSSCHECKED_LAST_LOCATOR_AMENDMENT_OFFICIAL_PUBLICATION_VERIFIED_EXACT_CURRENT_ARTIFACT_PENDING_VERSION_CHAIN_PARTIAL
