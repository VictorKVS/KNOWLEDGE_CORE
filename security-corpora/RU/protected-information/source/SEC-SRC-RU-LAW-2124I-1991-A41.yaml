protected_locators:
  - locator: "статья 41, часть 1"
    concept: CONFIDENTIAL_CITIZEN_SUBMISSION_NON_DISCLOSURE
    state: CURRENT_TEXT_CROSSCHECKED
    finding: >-
      Редакция не вправе разглашать в распространяемых сообщениях и материалах сведения, предоставленные гражданином с условием сохранения их в тайне.
    guard: "Проверять факт условия о сохранении сведений в тайне и конкретный канал распространения."
  - locator: "статья 41, часть 2"
    concept: JOURNALISTIC_SOURCE_CONFIDENTIALITY
    state: CURRENT_TEXT_CROSSCHECKED
    finding: >-
      Редакция обязана сохранять в тайне источник информации и не вправе называть лицо, предоставившее сведения с условием неразглашения имени,
      кроме случая требования суда в связи с находящимся в его производстве делом.
    guard: "COURT_EXCEPTION != GENERAL_DISCLOSURE_PERMISSION. Проверять процессуальное основание и предел требования суда."
  - locator: "статья 41, часть 3"
    concept: MINOR_OFFENDER_SUSPECT_IDENTITY_NON_DISCLOSURE
    state: CURRENT_TEXT_CROSSCHECKED
    finding: >-
      Запрещено раскрывать сведения, прямо или косвенно указывающие на личность несовершеннолетнего, совершившего преступление, подозреваемого,
      совершившего административное правонарушение или антиобщественное действие, без согласия самого несовершеннолетнего и его законного представителя.
    guard: "Проверять возраст, процессуальный/правонарушительный контекст и наличие требуемых согласий."
  - locator: "статья 41, часть 4 + статья 4, часть 6"
    concept: MINOR_VICTIM_IDENTITY_SPECIAL_DISCLOSURE_GATE
    state: CURRENT_TEXT_CROSSCHECKED_LAST_LOCATOR_AMENDMENT_OFFICIAL_PUBLICATION_VERIFIED
    finding: >-
      Для информации о несовершеннолетнем, пострадавшем от противоправных действий, закон устанавливает отдельный запрет идентифицирующего раскрытия
      и закрытый набор условий, при которых распространение допускается в целях защиты его прав и законных интересов.
    guard: "Не переносить специальные согласия/исключения части 4 на иные категории несовершеннолетних или иные цели публикации."
  - locator: "статья 41, часть 5"
    concept: MINOR_SEXUAL_OFFENCE_VICTIM_ADDITIONAL_RESTRICTION
    state: CURRENT_TEXT_CROSSCHECKED_LAST_LOCATOR_AMENDMENT_OFFICIAL_PUBLICATION_VERIFIED
    finding: >-
      Для несовершеннолетнего потерпевшего от преступления против половой неприкосновенности и половой свободы распространение дополнительно ограничено
      целями расследования, установления причастных лиц или розыска пропавшего несовершеннолетнего и должно учитывать требования статей 161 и 241 УПК РФ.
    guard: "Это дополнительный узкий процессуальный фильтр, а не самостоятельное общее основание раскрытия."

pdn_relation:
  target: "152-ФЗ"
  state: CANDIDATE_DUAL_REGIME_ON_DATA_AND_OPERATION_PROOF_ONLY
  evidence_dimensions:
    - "статья 41 оперирует сведениями о гражданине и лице-источнике"
    - "часть 3 использует критерий прямой или косвенной идентификации несовершеннолетнего"
    - "части 4-5 связаны с идентифицирующей информацией несовершеннолетнего потерпевшего; статья 4 часть 6 перечисляет, в частности, ФИО, изображения, голос, дату рождения, место жительства/пребывания, учебы/работы и иную идентифицирующую информацию"
  guard: >-
    Для конкретного требования определить идентифицируемое физическое лицо, состав сведений, публикационную/редакционную операцию, цель, роль редакции,
    журналиста и получателя, правовое основание, наличие специального условия тайны/согласия/судебного требования и применимый locator Закона о СМИ.
    MEDIA_CONFIDENTIALITY != PERSONAL_DATA; OVERLAP != APPLICABILITY.

cross_regime_relations:
  - target: "УПК РФ статьи 161 и 241"
    type: CRIMINAL_PROCEDURE_DISCLOSURE_LIMIT_FOR_MINOR_VICTIM
    state: STATUTORY_CROSS_REFERENCE_CONTEXT_NOT_REGIME_MERGE
    guard: "Проверять конкретное уголовное дело, процессуальный статус и ограничения разглашения отдельно."
  - target: "специальные режимы защиты сведений о несовершеннолетних"
    type: CHILD_IDENTITY_PROTECTION_OVERLAP
    state: RELATION_CANDIDATE_NOT_AUTOMATIC_APPLICABILITY
    guard: "Не объединять ограничения Закона о СМИ с иными детскими/семейными режимами без прямого нормативного основания."

