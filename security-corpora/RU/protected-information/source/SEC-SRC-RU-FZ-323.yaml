protected_information:
  sector: healthcare
  regime: medical_secrecy
  protected_locators:
    - locator: "статья 13 часть 1"
      concept: MEDICAL_SECRECY_SCOPE
      findings:
        - "К врачебной тайне относятся сведения о факте обращения за медицинской помощью, состоянии здоровья, диагнозе и иные сведения, полученные при медицинском обследовании и лечении."
    - locator: "статья 13 часть 2"
      concept: NON_DISCLOSURE_DUTY
      findings:
        - "Разглашение сведений, составляющих врачебную тайну, не допускается лицами, которым они стали известны при обучении, исполнении трудовых, должностных, служебных и иных обязанностей, кроме предусмотренных законом случаев."
    - locator: "статья 13 части 3 и 3.1"
      concept: CONSENT_AND_POST_MORTEM_DISCLOSURE_CONTEXT
      findings:
        - "Разглашение в предусмотренных законом целях допускается при наличии соответствующего согласия; после смерти гражданина действует специальный режим раскрытия супругу, близким родственникам и иным указанным лицам при отсутствии запрета гражданина/представителя."
    - locator: "статья 13 часть 4"
      concept: DISCLOSURE_WITHOUT_CONSENT_ENUMERATED_EXCEPTIONS
      findings:
        - "Передача без согласия допускается только в перечисленных законом контекстах; конкретный пункт и его действующая редакция должны устанавливаться отдельно."
    - locator: "статья 13 часть 4 пункт 8"
      concept: MEDICAL_INFORMATION_EXCHANGE_DIRECT_PDN_CONTEXT
      findings:
        - "Обмен информацией медицинскими организациями для оказания медицинской помощи прямо поставлен в контекст соблюдения требований законодательства Российской Федерации о персональных данных."
  applicability_status: CANDIDATE_APPLICABILITY_REVIEW_REQUIRED
  applicability_guard: >-
    Наличие врачебной тайны, медицинских данных или прямого упоминания законодательства о персональных данных не доказывает применимость каждого требования 152-ФЗ к любой организации и операции. Для каждого требования установить actor/role, субъект данных, конкретные поля, операцию обработки, цель, правовое основание, канал передачи и действующий locator.

