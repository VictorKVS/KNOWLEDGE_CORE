protected_information:
  sector: professional_secrecy_advocacy
  regime: advocacy_registry_person_level_information
  legal_basis: "63-ФЗ статьи 14 и 15; Приказ Минюста России № 296"
  protected_locators:
    - locator: "Приложение № 1, пункты 1-4"
      concept: UNIFIED_STATE_REGISTER_OF_ADVOCATES
      finding: "Минюст ведет Единый государственный реестр адвокатов в бумажной и электронной формах; он включает раздел реестра адвокатов и журнал лиц, не сдавших квалификационный экзамен."
    - locator: "Приложение № 1, пункт 5"
      concept: CORE_ADVOCATE_REGISTER_FIELDS
      finding: "Основной реестровый состав включает регистрационный номер, субъект РФ, ФИО и реквизиты решений/распоряжений о статусе и его изменениях."
    - locator: "Приложение № 1, пункты 24-33, в том числе пункт 26"
      concept: REGISTRY_ACTION_WORKFLOW_PERSON_LEVEL_INPUTS
      finding: "Для реестровых действий в уведомлениях/заявлениях и приложениях обрабатываются дополнительные person-level сведения: адрес места жительства, контактный телефон, адрес электронной почты, копия документа, удостоверяющего личность, анкета с биографическими сведениями, документы об образовании и стаже. Эти сведения являются входами/материалами реестрового процесса и не помечаются автоматически как поля основной реестровой таблицы пункта 5."
    - locator: "Приложение № 1, пункт 34 и приложение № 2 к Порядку ведения реестра"
      concept: FAILED_QUALIFICATION_EXAM_APPLICANT_FIELDS
      finding: "Журнал лиц, не сдавших квалификационный экзамен, включает ФИО, дату экзамена, дату рождения и место рождения претендента."
  publicness_boundary:
    source: "63-ФЗ статья 14 пункт 7"
    rule: "Сведения об адвокатах, содержащиеся в Едином государственном реестре адвокатов, являются открытыми и общедоступными лишь при условии отнесения их к таковым федеральным органом юстиции."
    guard: "Нельзя автоматически считать общедоступными ни все поля реестра, ни документы/уведомления реестрового дела и входные данные реестровых процедур."
  applicability_status: CANDIDATE_APPLICABILITY_REVIEW_REQUIRED
  applicability_guard: >-
    Приказ № 296 доказывает обработку значимого набора сведений о физических лицах в реестровом контуре. Конкретные обязанности по 152-ФЗ должны привязываться к доказанным ролям, операциям, целям, составу данных и правовым основаниям. Не смешивать core register fields, journal fields и workflow/case-file inputs.

