protected_information:
  sector: professional_secrecy_advocacy
  regime: advocacy_registry_person_level_information
  legal_basis: "63-ФЗ статьи 14 и 15; Приказ Минюста России № 296"
  protected_locators:
    - locator: "Приложение № 1, пункты 1-4"
      concept: UNIFIED_STATE_REGISTER_OF_ADVOCATES
      finding: "Минюст ведет Единый государственный реестр адвокатов в бумажной и электронной формах; в него включаются сведения об адвокатах и предусмотренных порядком заявителях."
    - locator: "Приложение № 1, пункт 5"
      concept: ADVOCATE_PERSON_LEVEL_REGISTRY_FIELDS
      finding: "Состав сведений реестра включает регистрационный номер, ФИО, субъект РФ, реквизиты решений о статусе, а также адрес места жительства, контактный телефон и адрес электронной почты при их наличии."
    - locator: "Приложение № 1, документы и сведения, представляемые для реестровых действий"
      concept: IDENTITY_BIOGRAPHICAL_EDUCATION_DOCUMENT_SET
      finding: "Реестровые процедуры предусматривают представление идентификационных, биографических и образовательных документов/сведений, что формирует отдельный person-level data context."
    - locator: "Приложение № 1, пункт 34"
      concept: FAILED_QUALIFICATION_EXAM_APPLICANT_FIELDS
      finding: "В журнале лиц, не сдавших квалификационный экзамен, учитываются ФИО, дата рождения, место рождения и дата экзамена."
  publicness_boundary:
    source: "63-ФЗ статья 14 пункт 7"
    rule: "Сведения Единого государственного реестра адвокатов являются открытыми и общедоступными только в той части, в которой они отнесены к таковым федеральным органом юстиции."
    guard: "Наличие адресных, контактных, биографических и иных person-level полей в реестровом контуре не означает, что все они являются общедоступными."
  applicability_status: CANDIDATE_APPLICABILITY_REVIEW_REQUIRED
  applicability_guard: >-
    Наличие person-level полей создает прямое пересечение с предметом регулирования персональных данных, но конкретные обязанности по 152-ФЗ должны привязываться к доказанным ролям, операциям, целям, составу данных и правовым основаниям. Публичность отдельных реестровых сведений не переносится автоматически на весь массив.

