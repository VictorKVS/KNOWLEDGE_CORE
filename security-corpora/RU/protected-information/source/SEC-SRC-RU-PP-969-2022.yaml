  protected_locators:
    - locator: "Правила, пункт 1"
      concept: AUTHORIZED_AUTHORITY_ACCESS_SCOPE
      finding: "Определяет доступ антимонопольного и налогового органов к имеющейся у Роскомнадзора информации об интернет-рекламе и социальной рекламе."
    - locator: "Правила, пункты 2-3"
      concept: REGULATORY_INFORMATION_EXCHANGE
      finding: "Устанавливает электронное взаимодействие через информационную систему Роскомнадзора и сценарии запросов/автоматизированного предоставления информации."
    - locator: "Правила, пункты 4-6"
      concept: AUTHENTICATED_REGULATORY_ACCESS
      finding: "Доступ организуется через автоматизированные рабочие места сотрудников; запрос на доступ может оформляться электронно с усиленной квалифицированной электронной подписью."
  applicability_status: CANDIDATE_APPLICABILITY_REVIEW_REQUIRED
  applicability_guard: "Это специальный режим доступа государственных получателей к массиву интернет-рекламы; он не доказывает наличие ПДн в каждом объекте и не создает универсальный канал раскрытия ПДн."

