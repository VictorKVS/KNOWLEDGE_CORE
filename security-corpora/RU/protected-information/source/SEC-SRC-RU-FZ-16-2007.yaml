protected_information:
  sector: transport
  regime: transport_security_egis_otb_passenger_and_crew_personal_data
  legal_basis: "16-ФЗ статья 11"
  protected_locators:
    - locator: "статья 11 части 1-2"
      concept: EGIS_OTB_AND_ACBPD
      finding: "ЕГИС ОТБ является государственной информационной системой; в ее составе формируются автоматизированные централизованные базы персональных данных пассажиров и персонала (экипажа) транспортных средств."
    - locator: "статья 11 часть 3 и часть 3.1"
      concept: DATA_SUPPLIERS_AND_AUTHORIZED_TICKETING_AGENTS
      finding: "Источниками данных выступают субъекты транспортной инфраструктуры, перевозчики, федеральные органы, иностранные государства/организации и уполномоченные билетные/бронирующие лица; для уполномоченных лиц установлен отдельный набор идентификационных и контактных сведений."
    - locator: "статья 11 часть 4"
      concept: RESTRICTED_ACCESS_INFORMATION_RESOURCE
      finding: "Информационные ресурсы ЕГИС ОТБ отнесены законом к информации ограниченного доступа."
    - locator: "статья 11 части 5, 5.1, 5.1-1, 5.3"
      concept: PASSENGER_CREW_PERSON_LEVEL_DATASET
      finding: "Закон задает базовый person-level набор: ФИО, дата рождения, документ, маршрут/пункты, дата поездки, пол, гражданство; для экипажа дополнительно должность; для отдельных воздушных перевозок предусмотрены записи регистрации пассажиров."
    - locator: "статья 11 часть 6"
      concept: DELEGATED_FORMATION_RETENTION_DISCLOSURE_RULES
      finding: "Порядок формирования, ведения, срок хранения и предоставление данных делегированы Минтрансу; действующий подзаконный слой — Приказ Минтранса № 162 от 02.05.2024."
    - locator: "статья 11 часть 7"
      concept: DIRECT_152FZ_CROSS_REFERENCE_FOR_INTERNATIONAL_CARRIERS
      finding: "Для иностранного субъекта транспортной инфраструктуры/перевозчика в соответствующем международном перевозочном сценарии передача данных прямо поставлена в соответствие 152-ФЗ и 16-ФЗ, если международным договором не установлено иное."
  applicability_status: CANDIDATE_APPLICABILITY_REVIEW_REQUIRED
  applicability_guard: >-
    16-ФЗ доказывает отраслевой режим ЕГИС ОТБ/АЦБПДП и прямые PDN-контексты. Нельзя переносить требования ЕГИС ОТБ на любую транспортную организацию или любую ее обработку ПДн без доказательства роли, вида перевозки, операции и нормативного основания.

