normative_anchors:
  - locator: "пункт 1.2"
    finding: "Регламент прямо увязан с 67-ФЗ, 20-ФЗ, 152-ФЗ, 168-ФЗ и Инструкцией ЦИК № 49/463-4, что подтверждает нормативный маршрут обработки ПДн внутри ГАС «Выборы»."
    guard: "REFERENCE_SET_NOT_AUTOMATIC_APPLICABILITY_TO_EVERY_FIELD_OR_OPERATION"
  - locator: "пункт 1.12"
    finding: "Хранение архивных и резервных копий ПДн участников избирательного процесса и уничтожение машиночитаемых носителей после истечения установленного срока хранения отнесены к федеральному законодательству и нормативным актам ЦИК России."
    guard: "NO_NUMERIC_RETENTION_PERIOD_INFERRED_FROM_EXTERNAL_REFERENCE"
  - locator: "пункты 2.2.1 и 4.2"
    finding: "Источники Регистра включают сведения МВД о паспортах и регистрации, сведения ЕРН и сведения ЕГР ЗАГС о смерти; обмен с федеральными источниками осуществляется в установленных маршрутах, включая СМЭВ."
    guard: "INTERAGENCY_SOURCE_ROUTE_NOT_GENERIC_RIGHT_TO_REUSE_DATA"
  - locator: "пункт 2.4"
    finding: "Передача сведений от глав местных администраций допускается на бумаге и/или машиночитаемых носителях с фиксацией вида носителя, источника, периода, количества субъектов и даты передачи."
    guard: "TRANSFER_LOGGING_REQUIREMENT_NOT_RETENTION_PERIOD"
  - locator: "пункты 2.5-2.6"
    finding: "Регламент задает операционные сроки ввода сведений и обработку событий о гражданах, включая смерть, недееспособность/восстановление дееспособности, военную службу, лишение свободы и паспортные события."
    guard: "OPERATIONAL_INPUT_SLA_NOT_PDN_SUBJECT_RESPONSE_SLA_AND_NOT_RETENTION"
  - locator: "пункт 2.15"
    finding: "Подсистема используется для проверки достоверности ПДн кандидатов, представителей, избирателей, сборщиков подписей и граждан, совершающих добровольные пожертвования."
    guard: "ELECTION_OR_DONATION_CONTEXT_NOT_AUTOMATIC_SPECIAL_CATEGORY_PDN_OR_POLITICAL_BELIEF"
  - locator: "пункт 4.5"
    finding: "Не реже одного раза в неделю выполняется автоматизированный контроль базы данных на повторяющиеся записи."
    guard: "DATA_QUALITY_CONTROL_NOT_INDEPENDENT_PROCESSING_PURPOSE"
  - locator: "пункты 4.8-4.11"
    finding: "Подсистема взаимодействует с другими компонентами ГАС «Выборы» для сервисов сайта ЦИК; конкретный порядок межподсистемного взаимодействия определяется в установленном ведомственном контуре."
    guard: "WEB_SERVICE_FLOW_NOT_PUBLICATION_OF_UNDERLYING_PERSONAL_DATA"

