protected_information:
  sector: professional_secrecy_advocacy
  regime: advocate_secrecy
  protected_locators:
    - locator: "статья 6 пункт 4 подпункт 5"
      concept: CLIENT_INFORMATION_NON_DISCLOSURE
      finding: "Адвокат не вправе разглашать сведения, сообщенные ему доверителем в связи с оказанием юридической помощи, без согласия доверителя."
    - locator: "статья 8 часть 1"
      concept: ADVOCATE_SECRET_SCOPE
      finding: "Адвокатской тайной являются любые сведения, связанные с оказанием адвокатом юридической помощи своему доверителю."
    - locator: "статья 8 часть 2"
      concept: WITNESS_TESTIMONY_PROTECTION
      finding: "Адвокат не может быть вызван и допрошен как свидетель об обстоятельствах, ставших ему известными в связи с обращением за юридической помощью или ее оказанием."
    - locator: "статья 8 часть 3"
      concept: JUDICIAL_AUTHORIZATION_FOR_INVESTIGATIVE_ACTIONS
      finding: "Оперативно-розыскные мероприятия и следственные действия в отношении адвоката допускаются только на основании судебного решения."
    - locator: "статья 17 пункт 2 подпункт 2.1"
      concept: UNLAWFUL_USE_OR_DISCLOSURE_PROFESSIONAL_CONSEQUENCE
      finding: "Незаконное использование или разглашение информации, связанной с оказанием квалифицированной юридической помощи доверителю, является специальным основанием дисциплинарно-статусного реагирования."
      amendment: "160-ФЗ от 02.06.2016"
    - locator: "статья 27 пункт 3; статья 28 пункт 3"
      concept: ASSISTANT_AND_TRAINEE_SECRECY_DUTY
      finding: "Помощник адвоката и стажер адвоката обязаны хранить адвокатскую тайну."
    - locator: "статья 39.5 части 1-2"
      concept: KIS_AR_CONFIDENTIALITY_AND_PDN_INFORMATION_PROTECTION
      finding: "Для сведений КИС АР установлен запрет раскрытия/распространения вне законных случаев, а защита сведений осуществляется по законодательству о персональных данных и об информации, информационных технологиях и защите информации."
      amendment: "83-ФЗ от 22.04.2024"
  applicability_status: CANDIDATE_APPLICABILITY_REVIEW_REQUIRED
  pdn_edge_status: DIRECT_STATUTORY_PDN_PROTECTION_CONTEXT_FOR_KIS_AR_ONLY
  guard_rule: >-
    Адвокатская тайна не тождественна персональным данным. Статья 39.5 прямо связывает защиту сведений КИС АР с законодательством о ПДн, но это не распространяет автоматически все требования 152-ФЗ на любые сведения адвокатского производства. Для иных сценариев двойной режим моделируется только при независимом доказательстве субъекта данных, набора данных, операции, роли, цели и правового основания.

