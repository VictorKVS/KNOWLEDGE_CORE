proof_floor:
  - "Налоговая тайна является самостоятельным специальным режимом; наличие сведений о физическом лице не доказывает применимость конкретного требования 152-ФЗ."
  - "Статья 102 охватывает сведения о налогоплательщиках/плательщиках страховых взносов, включая случаи, не связанные с персональными данными физического лица; OVERLAP != APPLICABILITY."
  - "Перечень исключений из налоговой тайны и законные каналы передачи нельзя преобразовывать в универсальное разрешение раскрытия."
  - "Текущая применимость конкретного пункта определяется его датой вступления в силу; будущие пункты 15.1 и 15.2 не являются текущими требованиями на 2026-08-22."
  - "MIME, byte length, SHA-256 и retrieved_at не фиксируются без byte-exact официального артефакта."

