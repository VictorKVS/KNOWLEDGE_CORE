protected_locators:
  - locator: "статья 102, пункт 1"
    concept: TAX_SECRET_SCOPE_AND_STATUTORY_EXCLUSIONS
    state: CURRENT_CONSOLIDATED_TEXT_CROSSCHECKED_PRIMARY_EXACT_CAPTURE_PENDING
    finding: >-
      Налоговую тайну образуют полученные уполномоченными государственными органами сведения о налогоплательщике
      и плательщике страховых взносов, кроме прямо перечисленных законом исключений.
    guard: "Исключения должны оцениваться по конкретному подпункту и контексту; не выводить общее public/disclosure permission."
  - locator: "статья 102, пункт 2"
    concept: TAX_SECRET_NON_DISCLOSURE
    state: CURRENT_CONSOLIDATED_TEXT_CROSSCHECKED_PRIMARY_EXACT_CAPTURE_PENDING
    finding: >-
      Налоговая тайна не подлежит разглашению указанными законом органами, должностными лицами и привлеченными
      специалистами/экспертами, кроме случаев, предусмотренных федеральным законом.
  - locator: "статья 102, пункт 3"
    concept: TAX_SECRET_SPECIAL_STORAGE_AND_ACCESS
    state: CURRENT_CONSOLIDATED_TEXT_CROSSCHECKED_PRIMARY_EXACT_CAPTURE_PENDING
    finding: >-
      Сведения, составляющие налоговую тайну, имеют специальный режим хранения и доступа в соответствии с законом.
  - locator: "статья 102, пункт 4"
    concept: TAX_SECRET_LOSS_OR_DISCLOSURE_LIABILITY
    state: CURRENT_CONSOLIDATED_TEXT_CROSSCHECKED_PRIMARY_EXACT_CAPTURE_PENDING
    finding: >-
      Утрата документов с налоговой тайной либо разглашение таких сведений влечет ответственность, установленную федеральными законами.
  - locator: "статья 102, пункт 16"
    concept: TAX_SECRET_EPGU_PERSONAL_CABINET_DISCLOSURE_PROTECTION
    state: CURRENT_EFFECTIVE_FROM_2026-08-01_LOCATOR_SPECIFIC_AMENDMENT_CROSSCHECKED
    finding: >-
      Запрет на разглашение и ответственность за разглашение распространены на документы/сведения, размещенные в
      личном кабинете на ЕПГУ и передаваемые налоговым органом в этот кабинет.
    semantic_guard: "Пункт 16 не переносит автоматически весь режим хранения/доступа статьи 102 на любой документ ЕПГУ; применять только заявленный объем нормы."

pdn_relation:
  target: "152-ФЗ"
  state: OVERLAP_CANDIDATE_APPLICABILITY_REVIEW_REQUIRED
  evidence_dimensions:
    - "налоговая тайна может включать сведения об идентифицируемом физическом лице/ИП"
    - "часть режима также относится к организациям и иной налоговой информации, поэтому налоговая тайна шире персональных данных"
    - "каналы межведомственной передачи и личный кабинет ЕПГУ создают отдельные роли получателей и контексты доступа"
  guard: >-
    Для конкретного ребра необходимо отдельно установить субъект данных, состав сведений, операцию, цель, правовое основание,
    статус налогоплательщика, роль органа/получателя и специальное основание доступа или передачи.

