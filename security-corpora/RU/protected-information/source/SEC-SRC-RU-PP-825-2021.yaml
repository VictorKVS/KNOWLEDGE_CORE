normative_scope:
  applies_to: "формирование и ведение ФИС ФРДО, внесение, обработка, хранение, использование, предоставление и защита сведений о документах об образовании/квалификации/обучении, отдельных сертификатах и результатах школьного языкового тестирования иностранных граждан и лиц без гражданства"
  operator: "Федеральная служба по надзору в сфере образования и науки"
  explicit_personal_data_layer: true
  explicit_information_security_layer: true
  explicit_child_data_layer: true
  explicit_retention_layer: true
  independent_general_pdn_lawful_basis_inferred: false
  independent_secret_category_inferred: false

normative_anchors:
  - locator: "пункт 2"
    finding: "Ведение ФИС осуществляется с обеспечением конфиденциальности и безопасности содержащихся в ней персональных данных при взаимодействии с иными государственными информационными системами и инфраструктурами электронных госуслуг."
    guard: "FIS_CONFIDENTIALITY_DUTY_NOT_NEW_SECRET_CATEGORY"
  - locator: "пункт 7 подпункт в"
    finding: "Оператор обеспечивает безопасное хранение и использование сведений, включая автоматизированный сбор, хранение, обработку, обобщение и анализ."
    guard: "OPERATOR_SYSTEM_DUTY_NOT_GENERAL_EDUCATION_SECTOR_PROCESSING_BASIS"
  - locator: "пункт 9"
    finding: "Формирование и ведение системы, обработка, хранение, использование, доступ и защита сведений осуществляются с соблюдением законодательства об информации и законодательства в области персональных данных."
    guard: "DIRECT_PDN_REGIME_REFERENCE_NOT_BLANKET_APPLICABILITY_TO_UNRELATED_EDUCATION_DATA"
  - locator: "приложение № 1 пункты 6-10(1), 14, 16(1)-19"
    finding: "Реестр содержит person-level идентификационные и образовательные сведения: ФИО, дату рождения, пол, СНИЛС для граждан РФ при наличии, гражданство, в отдельных сертификатных сценариях реквизиты документа, а также программу/квалификацию, годы обучения, целевой договор, формы образования/обучения и источник финансирования."
    guard: "EDUCATION_RECORD_DATASET_NOT_SPECIAL_CATEGORY_PDN_OR_CHILD_DATA_AUTOMATICALLY"
  - locator: "приложение № 2, введенное ПП РФ № 1423/2025"
    finding: "Для результатов тестирования иностранных граждан/лиц без гражданства на знание русского языка в школьном контексте вносятся результаты и баллы, ФИО ребенка и законного представителя, даты рождения, пол, СНИЛС ребенка при наличии, гражданство и реквизиты удостоверяющих личность документов."
    guard: "CHILD_AND_MIGRATION_CONTEXT_NOT_SPECIAL_CATEGORY_OR_SECRET_AUTOMATICALLY"
  - locator: "пункт 8"
    finding: "Физлицо получает сведения в части выданных ему документов; иным лицам предоставляется подтверждение наличия сведений; отдельные межведомственные потоки предусмотрены для федеральных органов и СФР, а также МВД/Минобрнауки/Рособрнадзора в определенных целях."
    guard: "REGISTER_ACCESS_ROUTE_NOT_UNLIMITED_DISCLOSURE_OR_SECONDARY_USE"
  - locator: "пункт 10"
    finding: "Размещение сведений производится с применением усиленной квалифицированной электронной подписи; после ПП № 960/2026 для совместных образовательных организаций действует отдельный канал с усиленной неквалифицированной подписью, проверкой полномочий и целостности пакета."
    guard: "E_SIGNATURE_AND_AUTHORIZATION_CONTROLS_NOT_GENERAL_PDN_CONSENT"
  - locator: "пункт 12"
    finding: "Основной срок хранения сведений ФИС составляет 50 лет; для сведений о сертификатах о владении русским языком, знании истории России и основ законодательства РФ установлен срок 5 лет; для результатов школьного языкового тестирования иностранных граждан/лиц без гражданства — 3 года; после истечения срока сведения исключаются из системы."
    guard: "50_5_3_YEAR_FIS_FRDO_RETENTION_NOT_GENERAL_PDN_OR_EDUCATION_DOCUMENT_RETENTION"
  - locator: "ПП РФ № 960/2026, изменения к пунктам 6, 6(1)-6(5), 10-11"
    finding: "Для совместных российско-иностранных образовательных организаций установлены сроки передачи 5 рабочих дней или 60 календарных дней в зависимости от программы, защищенный канал, проверка электронной подписи и полномочий, неизменность и целостность пакета."
    guard: "DATA_SUBMISSION_AND_SIGNATURE_VERIFICATION_SLA_NOT_DATA_SUBJECT_OR_BREACH_NOTIFICATION_SLA"

