protected_information:
  sector: social_services
  regime: social_service_recipient_confidentiality
  protected_locators:
    - locator: "статья 6 части 1-3"
      concept: RECIPIENT_INFORMATION_CONFIDENTIALITY
      findings:
        - "Запрещается разглашение конфиденциальной или служебной информации о получателях социальных услуг лицами, которым она стала известна при исполнении профессиональных, служебных и иных обязанностей."
        - "Письменное согласие получателя социальных услуг или его законного представителя является специальным основанием передачи информации другим лицам в интересах получателя/представителя."
        - "Без согласия допускаются только перечисленные законом каналы, включая межведомственное информационное взаимодействие и отдельный государственно-сервисный контекст обработки персональных данных."
    - locator: "статья 12 часть 1 пункт 5"
      concept: PROVIDER_PDN_PROTECTION_DUTY_CONTEXT
      findings:
        - "Поставщик социальных услуг обязан использовать информацию о получателях социальных услуг в соответствии с требованиями законодательства Российской Федерации о персональных данных о защите персональных данных."
    - locator: "статья 26 части 1-3"
      concept: SOCIAL_SERVICE_RECIPIENT_REGISTER
      findings:
        - "Регистр получателей социальных услуг содержит идентификационные, контактные, документные, страховые и сервисные сведения о получателе."
        - "Информация о получателях и предоставленных социальных услугах размещается в государственной информационной системе социальной сферы в предусмотренном законом порядке."
  applicability_status: CANDIDATE_APPLICABILITY_REVIEW_REQUIRED
  applicability_guard: >-
    Сам факт участия в социальном обслуживании не доказывает применимость каждого требования 152-ФЗ ко всем субъектам, данным и операциям. Для конкретного требования необходимо доказать роль субъекта/оператора, точный состав данных, операцию, цель и правовое основание. При этом статья 12 часть 1 пункт 5 является прямой отраслевой ссылкой на требования законодательства о персональных данных при использовании поставщиком информации о получателях социальных услуг.

