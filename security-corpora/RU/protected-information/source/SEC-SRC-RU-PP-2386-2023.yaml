normative_anchors:
  - locator: "раздел I / общие положения и функции"
    finding: "Создание и функционирование платформы прямо увязано с законодательством об информации и персональных данных; функции охватывают социальную защиту, пенсионное обеспечение, медико-социальную экспертизу, сведения об инвалидах и детях-инвалидах, реабилитацию и индивидуальный персонифицированный учет."
    guard: "SYSTEM_FUNCTION_AND_PDN_REFERENCE_NOT_UNIVERSAL_BASIS_FOR_UNRELATED_PROCESSING"
  - locator: "состав информации / инвалидность и медико-социальные сведения"
    finding: "Платформа содержит идентификационные сведения граждан, сведения об инвалидности и законных представителях; предусмотрен обмен сведениями о медицинской помощи и санаторно-курортном лечении через установленные государственные медицинские информационные маршруты."
    guard: "HEALTH_OR_MEDICAL_SOURCE_MATCH_REQUIRED_FOR_SPECIAL_CATEGORY_AND_MEDICAL_SECRECY_CLASSIFICATION"
  - locator: "образовательные и детские сведения"
    finding: "Предусмотрены сведения об обучающихся и отдельных детских/семейных статусах, используемые в установленных процессах социальной защиты."
    guard: "CHILD_OR_SOCIAL_STATUS_NOT_SPECIAL_CATEGORY_OR_PROTECTED_SECRET_AUTOMATICALLY"
  - locator: "доступ органов и организаций, не являющихся пользователями платформы"
    finding: "Для предоставления сведений требуется нормативное правовое обоснование полномочий, функций и обязательств, требуемый перечень сведений и соглашение об информационном взаимодействии."
    guard: "INTERAGENCY_ACCESS_NOT_UNLIMITED_SECONDARY_USE"
  - locator: "пункт 50 / целевой доступ"
    finding: "Получение данных органами и организациями вне состава пользователей допускается для выполнения установленных нормативными актами полномочий, функций и обязательств."
    guard: "PURPOSE_ROLE_AUTHORITY_AND_DATASET_MATCH_REQUIRED"
  - locator: "раздел XII / пункты 109-112"
    finding: "Установлены требования защиты информации и персональных данных, организационные и технические меры, предотвращение и выявление несанкционированного доступа/воздействия, восстановление информации и контроль уровня защищенности."
    guard: "SECURITY_CONTROLS_NOT_NEW_SECRET_CATEGORY"
  - locator: "пункт 113"
    finding: "Обработка и хранение сведений осуществляются с учетом законодательства о персональных данных и о банках и банковской деятельности и направлены на обеспечение прав граждан в сфере социальной защиты."
    guard: "BANKING_LAW_REFERENCE_NOT_BANK_SECRECY_FOR_EVERY_PLATFORM_RECORD"

