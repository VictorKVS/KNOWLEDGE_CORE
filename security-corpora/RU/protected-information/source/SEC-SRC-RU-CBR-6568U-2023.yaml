protected_information:
  scope_actor: "страховщики, представляющие предусмотренную законом информацию в АИС страхования"
  protected_locators:
    - locator: "пункт 1 и приложения 1-4"
      concept: STATUTORY_INSURANCE_AIS_DATASET_AND_SUBMISSION_FLOW
      findings:
        - "Страховщики представляют в АИС страхования имеющуюся у них информацию из статьи 33.11 Закона № 4015-I в составе, установленном приложениями."
      guard: "DATASET_SUBMISSION_RULE != AUTOMATIC_CLASSIFICATION_OF_EVERY_FIELD_AS_PDN_OR_INSURANCE_SECRET"
    - locator: "приложение 1, пункт 1.1"
      concept: PERSON_LEVEL_OSAGO_DATASET
      findings:
        - "Для физлица предусмотрены СНИЛС, номер мобильной связи, e-mail, реквизиты документа, удостоверяющего личность, ФИО, дата и место рождения, регистрация по месту жительства/пребывания, сведения о водительском удостоверении."
      guard: "PERSON_LEVEL_FIELDS_REQUIRE_FIELD_AND_PURPOSE_LEVEL_PDN_ANALYSIS; do not infer a universal insurer dataset."
    - locator: "приложение 1, пункты 10.20-10.21"
      concept: ACCIDENT_HEALTH_AND_WITNESS_DATA
      findings:
        - "В отдельных страховых событиях передаются ФИО потерпевшего, характер и степень повреждения здоровья, расходы на лечение, утраченный заработок, а также ФИО/адрес свидетеля."
      guard: "HEALTH_RELATED_INSURANCE_EVENT_DATA != AUTOMATIC_MEDICAL_SECRECY; врачебная тайна требует отдельного источника/контекста получения сведений."
    - locator: "7283-У, пункт 1.2 и приложение 5"
      concept: FOREIGNER_DMS_PERSON_LEVEL_DATASET_AND_48H_FLOW
      findings:
        - "С 15.05.2026 для ДМС иностранных граждан/лиц без гражданства добавлен отдельный массив и передача не позднее 48 часов для предусмотренных событий."
        - "Приложение 5 включает ФИО на кириллице/латинице, дату рождения, реквизиты документа, пол, гражданство, мобильный номер, e-mail и договорные сведения."
      guard: "48_HOUR_INSURANCE_AIS_SUBMISSION != PDN_INCIDENT_NOTIFICATION_PERIOD"
    - locator: "7283-У, пункт 1.5"
      concept: REJECTED_MESSAGE_CORRECTION_FLOW
      findings:
        - "Для информации приложения 5 исправленное сообщение после отказа оператора должно быть передано не позднее 36 часов с момента отказа."
      guard: "36_HOUR_CORRECTION_FLOW != DATA_SUBJECT_CORRECTION_DEADLINE_UNDER_152FZ"
    - locator: "7283-У, пункт 3"
      concept: TRANSITIONAL_BACKFILL_DMS_FOREIGNERS
      findings:
        - "По действующим на дату вступления в силу договорам соответствующая информация приложения 5 должна была быть представлена до 30.06.2026 включительно."
      guard: "TRANSITIONAL_BACKFILL_DEADLINE != RETENTION_PERIOD"

