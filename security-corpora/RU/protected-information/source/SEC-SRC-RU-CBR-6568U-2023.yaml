applicability:
  state: CANDIDATE_APPLICABILITY_REVIEW_REQUIRED
  guards:
    - "6568-У регулирует конкретный поток страховщик -> АИС страхования; не переносить его состав полей на все системы страховщика."
    - "Наличие health-related полей в страховом событии не доказывает врачебную тайну без происхождения из медицинского профессионального контекста."
    - "Сроки 48/36 часов и переходный срок до 30.06.2026 не являются сроками хранения ПДн."
    - "Мобильный номер в наборе не означает автоматическую применимость тайны связи ко всему страховому набору."
  executable_rule_status: NOT_PROMOTED

