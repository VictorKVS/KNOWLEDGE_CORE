protected_information:
  sector: transport
  regime: egis_otb_system_governance_and_information_protection
  legal_basis: "16-ФЗ статья 11 часть 1.1; ПП РФ № 1251"
  protected_locators:
    - locator: "Положение, пункт 1"
      concept: EGIS_OTB_SYSTEM_SCOPE_AND_PROTECTION_REQUIREMENTS
      finding: "Положение определяет цели, структуру, информационные ресурсы/подсистемы, участников информационного взаимодействия и общие требования к защите информации ЕГИС ОТБ."
    - locator: "Положение, структура информационных ресурсов"
      concept: MULTI_REGIME_RESTRICTED_TRANSPORT_DATASETS
      finding: "В ЕГИС ОТБ входят АЦБПДП пассажиров/экипажа и иные специализированные транспортные ресурсы, включая сведения о состоянии здоровья отдельных авиационных работников, результаты оценки уязвимости, планы безопасности, уведомления об опасных грузах и отраслевые реестры."
    - locator: "Положение, оператор/участники информационного взаимодействия"
      concept: EGIS_OTB_OPERATOR_AND_INFORMATION_EXCHANGE_ROLES
      finding: "Минтранс выступает государственным заказчиком и оператором ЕГИС ОТБ; Положение распределяет полномочия участников информационного взаимодействия."
  applicability_status: CANDIDATE_APPLICABILITY_REVIEW_REQUIRED
  applicability_guard: >-
    ПП № 1251 описывает конкретную государственную систему и набор ее ресурсов. Нельзя распространять системные требования ЕГИС ОТБ на любую информационную систему транспортной организации без доказанного включения в соответствующий контур/обмен.

