      - "документы Архивного фонда Российской Федерации"
      - "документы постоянного хранения"
      - "документы временного хранения свыше 10 лет"
      - "документы по личному составу"
      - "иные архивные документы в установленном Правилами scope"
  protected_locators:
    - locator: "пункт 31"
      concept: SECURE_DESTRUCTION_AFTER_ARCHIVAL_DISPOSAL_DECISION
      findings:
        - "Уничтожение/передача на уничтожение производится после установленной процедуры выделения документов, не подлежащих хранению, и утверждения соответствующего акта."
        - "Документы, содержащие персональные данные, имеющие пометку «Для служебного пользования», а также содержащие информацию ограниченного доступа, уничтожаются внутри государственного органа, органа местного самоуправления или организации механическим измельчением либо иным способом, исключающим восстановление содержания."
        - "Документ, подтверждающий факт утилизации, прикладывается к акту о выделении к уничтожению."
      guards:
        - "Пункт 31 задает способ/доказательство уничтожения после законного окончания документного lifecycle, а не самостоятельный срок удаления ПДн."
        - "Наличие ПДн не означает, что документ можно уничтожить раньше нормативного срока хранения."
    - locator: "пункт 32"
      concept: RETENTION_PERIOD_CHANGE_GOVERNANCE
      finding: "Изменение нормативных сроков хранения проводится через предусмотренные Правилами экспертные и нормативные процедуры; локальное усмотрение не подменяет изменение перечня."
    - locator: "пункт 33"
      concept: NO_SHORTENING_OF_NORMATIVE_RETENTION
      finding: "Снижение нормативно установленных сроков хранения документов запрещается."
      guard: "Запрет сокращения не означает бессрочное хранение после истечения применимого срока и прохождения законной процедуры уничтожения."
    - locator: "пункт 34"
      concept: ARCHIVE_ACQUISITION_SCOPE
      finding: "Архив органа/организации комплектуется документами Архивного фонда РФ и документами временных сроков хранения свыше 10 лет, включая документы по личному составу, в установленном Правилами порядке."

pdn_boundary:
  relationship_to_152fz: ARCHIVAL_DOCUMENT_LIFECYCLE_OVERLAP
  findings:
    - "Правила содержат прямой технический guard для уничтожения документов с ПДн, но не устанавливают универсальный срок хранения ПДн."
    - "Архивная стадия и отношения, подпадающие под законодательство об архивном деле, должны отделяться от предархивной обработки ПДн и иных операций."
  guards:
