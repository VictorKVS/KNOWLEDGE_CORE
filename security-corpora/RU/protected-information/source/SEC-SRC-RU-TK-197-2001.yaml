protected_information:
  sector: employment_hr
  regime: employee_personal_data
  protected_locators:
    - locator: "глава 14 статьи 86-90"
      concept: EMPLOYEE_PERSONAL_DATA_PROTECTION_REGIME
      finding: "Трудовой кодекс устанавливает отдельный отраслевой режим обработки и защиты персональных данных работника у работодателя."
    - locator: "статья 86 пункт 1"
      concept: EMPLOYEE_PDN_PURPOSE_LIMITATION
      finding: "Обработка персональных данных работника ограничена трудовыми и прямо указанными в статье целями."
      current_amendment_marker: "185-ФЗ от 02.07.2013"
    - locator: "статья 86 пункт 3"
      concept: EMPLOYEE_DATA_SOURCE_AND_THIRD_PARTY_CONSENT
      finding: "По общему правилу данные следует получать у работника; получение у третьей стороны связано с предварительным уведомлением и письменным согласием в описанном статьей сценарии."
    - locator: "статья 86 пункт 4"
      concept: SPECIAL_CATEGORY_RESTRICTION
      finding: "Работодатель не вправе получать и обрабатывать специальные категории персональных данных работника, кроме случаев, предусмотренных ТК РФ и другими федеральными законами."
      current_amendment_marker: "99-ФЗ от 07.05.2013"
    - locator: "статья 86 пункты 7-10"
      concept: EMPLOYEE_PDN_PROTECTION_GUARANTEES
      finding: "Кодекс устанавливает требования к защите данных, ознакомлению работников с документами о порядке обработки и совместной выработке мер защиты."
    - locator: "статья 87"
      concept: EMPLOYEE_PDN_STORAGE_AND_USE_POLICY
      finding: "Порядок хранения и использования персональных данных работников устанавливается работодателем с соблюдением ТК РФ и иных федеральных законов."
      current_amendment_marker: "90-ФЗ от 30.06.2006"
    - locator: "статья 88"
      concept: EMPLOYEE_PDN_TRANSFER_RULES
      finding: "Установлены специальные требования к передаче персональных данных работника, включая ограничения передачи третьим лицам и коммерческого использования."
      current_amendment_marker: "90-ФЗ от 30.06.2006"
    - locator: "статья 89"
      concept: EMPLOYEE_DATA_SUBJECT_RIGHTS
      finding: "Работнику предоставлены права на информацию, доступ, копии, исправление/дополнение и судебное обжалование обработки его персональных данных работодателем."
      current_amendment_marker: "90-ФЗ от 30.06.2006"
    - locator: "статья 90"
      concept: EMPLOYEE_PDN_LIABILITY
      finding: "Нарушение законодательства о персональных данных при обработке данных работника влечет предусмотренные законом виды ответственности."
      current_amendment_markers: ["90-ФЗ от 30.06.2006", "99-ФЗ от 07.05.2013"]
  applicability_status: CANDIDATE_APPLICABILITY_REVIEW_REQUIRED
  pdn_edge_status: DIRECT_STATUTORY_EMPLOYMENT_PDN_CONTEXT
  guard_rule: >-
    Глава 14 ТК РФ является прямым специальным трудовым слоем для персональных данных работника, но не заменяет 152-ФЗ и не позволяет автоматически переносить каждую норму главы на кандидатов, подрядчиков, клиентов или иные категории субъектов. Конкретная применимость требует доказать трудовую роль, набор данных, операцию и правовое основание.

