primary_locators:
  - locator: "статья 4 пункт 6"
    concept: RECORD_RETENTION_PERIOD
    status: CURRENT_PRIMARY_TEXT_LOCATOR_IDENTIFIED
    normalized_rule: >-
      The expeditor must retain in the Russian Federation specified information about transport-expedition contracts,
      parties, persons involved, cargo characteristics, handling events, routes, transport and other information in
      expedition-service information systems for three years from completion of the contracts.
    duration: "3 years from completion of the contract"
  - locator: "статья 4 пункт 10"
    concept: DATA_INFRASTRUCTURE_LOCALIZATION
    status: CURRENT_PRIMARY_TEXT_LOCATOR_IDENTIFIED
    normalized_rule: >-
      Receipt, transmission and preservation of information about expedition services must use databases and technical
      means located in the Russian Federation.
  - locator: "статья 4 пункт 11"
    concept: CROSS_BORDER_PERSONAL_DATA_TRANSFER_RESTRICTION
    status: CURRENT_PRIMARY_TEXT_LOCATOR_IDENTIFIED
    explicit_reference: "152-ФЗ от 27.07.2006 «О персональных данных»"
    normalized_rule: >-
      Transfer outside the Russian Federation of information containing clients' personal data is prohibited, except
      for the stated international-carriage scenario where such transfer is permitted by Russian international treaties
      and 152-ФЗ.
  - locator: "статья 24 часть 3 пункт 3"
    concept: INDIVIDUAL_ENTREPRENEUR_REGISTER_PERSONAL_DATA
    status: CURRENT_PRIMARY_TEXT_LOCATOR_IDENTIFIED
    normalized_fields:
      - "фамилия, имя, отчество (при наличии)"
      - "адрес регистрации по месту жительства (месту пребывания)"
      - "ОГРНИП"
      - "ИНН"
      - "абонентский телефонный номер"
      - "адрес электронной почты"

