protected_information:
  protected_locators:
    - locator: "Правила, пункт 134"
      concept: ELECTRONIC_ARCHIVE_INFORMATION_AND_PDN_PROTECTION
      finding: "Государственные органы, органы местного самоуправления и организации обязаны обеспечивать защиту информации и персональных данных, содержащихся в системе хранения электронных документов (СХЭД), в соответствии с законодательством Российской Федерации."
      normative_links: ["149-ФЗ статья 16", "152-ФЗ статья 7"]
      guard: "RULE_77_REFERENCE_TO_152FZ_CONFIDENTIALITY_IN_SHED != AUTOMATIC_APPLICATION_OF_ALL_152FZ_RULES_TO_EVERY_ARCHIVAL_RELATION"
    - locator: "Правила, пункты 135-137"
      concept: ELECTRONIC_ARCHIVE_SYSTEM_CONTROLS
      finding: "СХЭД должна быть совместима с СЭД/иными ИС и обеспечивать прием, хранение, учет, резервное копирование, восстановление, техническую проверку, конвертацию/миграцию и удаление электронных архивных документов по нормативному workflow."
      guard: "SYSTEM_FUNCTION_REQUIREMENT != INDEPENDENT_RETENTION_PERIOD"
    - locator: "Правила, предмет регулирования"
      concept: LONG_TERM_AND_PERSONNEL_ARCHIVE_SCOPE
      finding: "Правила охватывают документы Архивного фонда, документы постоянного и временного свыше 10 лет хранения, включая документы по личному составу, в установленных ими организационных границах."
      guard: "RULES_SCOPE != CLAIM_THAT_EVERY_ORGANIZATIONAL_DOCUMENT_MUST_BE_STORED_OVER_10_YEARS"

