normative_anchors:
  - locator: "пункт 5 подпункт а"
    finding: "Федеральный оператор обязан обеспечивать исполнение законодательства об информации, информационных технологиях и защите информации и законодательства в области персональных данных."
    guard: "SYSTEM_OPERATOR_DUTY_NOT_GENERAL_SECTOR_APPLICABILITY"
  - locator: "пункт 6 подпункты в-д"
    finding: "Поставщики обеспечивают полноту, достоверность и актуальность данных, соблюдают требования безопасности информации и незамедлительно информируют федерального оператора о сбоях и нарушениях требований безопасности информации."
    guard: "IMMEDIATE_OPERATOR_SECURITY_NOTICE_NOT_ROSKOMNADZOR_PDN_BREACH_SLA"
  - locator: "пункт 9"
    finding: "Информация в системе защищается по законодательству об информации и защите информации, персональных данных, государственной, коммерческой и иной охраняемой законом тайне, включая тайну усыновления и врачебную тайну."
    guard: "PROTECTED_SECRET_REFERENCE_NOT_AUTOMATIC_MULTI_CLASSIFICATION_OF_EVERY_RECORD"
  - locator: "пункты 11-12 и приложение"
    finding: "Система содержит детализированные сведения о несовершеннолетних и законных представителях, включая ФИО, пол, дату и место рождения, гражданство, реквизиты документов, адрес, СНИЛС, телефон, e-mail и номер записи федерального регистра сведений о населении, а также сведения профилактического контекста."
    guard: "PERSON_LEVEL_CHILD_DATASET_NOT_SPECIAL_CATEGORY_OR_MEDICAL_SECRET_AUTOMATICALLY"
  - locator: "пункт 11 абзацы 2-3"
    finding: "Статистическая информация формируется и обрабатывается в деперсонифицированном виде; действует принцип однократности размещения и многократности использования данных через межведомственное взаимодействие."
    guard: "DEPERSONALIZED_STATISTICS_NOT_WHOLE_SYSTEM_ANONYMIZATION_AND_REUSE_NOT_UNLIMITED_SECONDARY_USE"
  - locator: "пункт 25"
    finding: "Для основной массы сведений системы установлен срок хранения федеральным оператором не менее 5 лет со дня представления поставщиком при предусмотренных оговорках и возможности более длительных сроков по законодательству."
    guard: "FIVE_YEAR_GIS_RETENTION_NOT_GENERAL_PDN_OR_DOCUMENT_RETENTION"
  - locator: "пункт 26"
    finding: "Информация системы ежедневно копируется на резервный материальный носитель; информация на резервном носителе хранится не менее 10 лет, если более длительный срок не установлен законодательством."
    guard: "TEN_YEAR_BACKUP_RETENTION_NOT_GENERAL_LIVE_DATA_OR_PDN_RETENTION"
  - locator: "пункт 27"
    finding: "Федеральный оператор обязан обеспечивать целостность информации при хранении."
    guard: "INTEGRITY_DUTY_SYSTEM_SCOPE_ONLY"
  - locator: "пункты 28-30"
    finding: "Доступ предоставляется после регистрации, идентификации, аутентификации и авторизации; автоматизированное предоставление доступа осуществляется в течение 3 рабочих дней после заявки пользователя."
    guard: "THREE_WORKING_DAY_ACCESS_PROVISIONING_NOT_DATA_SUBJECT_RESPONSE_SLA"
  - locator: "пункты 32-36"
    finding: "Межсистемный обмен осуществляется через СМЭВ/инфраструктуру госфункций; допускаются запросы в единый федеральный регистр сведений о населении для оценки достоверности, полноты и актуальности информации."
    guard: "SMEV_AND_POPULATION_REGISTER_FLOW_NOT_UNLIMITED_SECONDARY_USE"
  - locator: "пункты 37, 40-54"
    finding: "Положение устанавливает соглашения об информационном взаимодействии, сертифицированные средства доступа, защиту от НСД, ролевые перечни уполномоченных лиц, реестр средств доступа, перерегистрацию и блокирование доступа."
    guard: "SUPPLIER_OR_USER_STATUS_NOT_UNLIMITED_ACCESS_AUTHORITY"

