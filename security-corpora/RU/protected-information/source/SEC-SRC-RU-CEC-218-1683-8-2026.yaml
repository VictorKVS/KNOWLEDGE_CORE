normative_anchors:
  - locator: "пункты 1.1-1.4"
    finding: "Система представляет собой комплекс мер по сбору, систематизации и использованию сведений об избирателях/участниках референдума; Регистр определен как база данных, содержащая совокупность их персональных данных. Использование данных для задач вне выборов допускается только в соответствии с федеральным законодательством."
    guard: "NON_ELECTION_USE_REQUIRES_SEPARATE_FEDERAL_LEGAL_BASIS"
  - locator: "пункты 2.1-2.4"
    finding: "Учет охватывает граждан по месту жительства, военнослужащих и членов семей, граждан в Байконуре, а также проживающих за пределами РФ или находящихся в длительных загранкомандировках; это создает несколько специальных маршрутов источников и ответственных лиц."
    guard: "REGISTRATION_CONTEXT_NOT_GENERIC_RIGHT_TO_PROCESS_UNRELATED_DATA"
  - locator: "пункты 2.8-2.12 и 3.2"
    finding: "Для формирования и актуализации Регистра используются сведения МВД/регистрационного учета и выдачи паспортов, ЕРН и ЕГР ЗАГС; предусмотрены установленные межведомственные маршруты, включая СМЭВ."
    guard: "INTERAGENCY_SOURCE_ROUTE_NOT_GENERIC_SECONDARY_USE_BASIS"
  - locator: "пункты 3.5-3.6"
    finding: "События изменения записи включают регистрацию, выдачу паспорта несовершеннолетнему, изменение ПДн, смену места жительства, призыв на военную службу, лишение свободы, смерть, признание недееспособным и восстановление дееспособности."
    guard: "EVENT_CONTEXT_NOT_AUTOMATIC_SPECIAL_CATEGORY_PDN"
  - locator: "пункт 3.10"
    finding: "После истечения трех месяцев со дня официального опубликования результатов выборов при соблюдении условий допускается использование списков избирателей для уточнения базы данных; при судебном обжаловании маршрут сдвигается до вступления решения суда в силу."
    guard: "THREE_MONTH_REUSE_GATE_NOT_RETENTION_PERIOD_AND_NOT_GENERIC_SECONDARY_USE"
  - locator: "пункт 6.1"
    finding: "ФЦИ при ЦИК обеспечивает техническую защиту базы данных от НСД, в том числе по каналам связи, и от воздействия, направленного на уничтожение, искажение либо блокирование доступа к сведениям."
    guard: "SECURITY_REQUIREMENT_NOT_NEW_CONFIDENTIALITY_CATEGORY"
  - locator: "пункт 6.2"
    finding: "База данных ГАС «Выборы» не может содержать сведения, составляющие государственную тайну."
    guard: "STATE_SECRET_PROHIBITION_NOT_PROOF_THAT_ALL_OTHER_DATA_ARE_PUBLIC"
  - locator: "пункт 6.3"
    finding: "Гражданин вправе беспрепятственно получить документированную информацию (персональные данные) о себе в порядке, установленном нормативными актами ЦИК России."
    guard: "SELF_ACCESS_RIGHT_NOT_PUBLIC_ACCESS_TO_REGISTER"

