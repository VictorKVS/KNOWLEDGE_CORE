protected_information:
  scope_actor: "операторы связи, абоненты и пользователи услуг телефонной связи"
  protected_locators:
    - locator: "Правила, пункт 4"
      concept: TELEPHONE_CONVERSATION_SECRECY_AND_SUBSCRIBER_INFORMATION
      findings:
        - "Оператор обязан обеспечивать тайну телефонных переговоров; ограничение допускается только в случаях, предусмотренных федеральными законами."
        - "Сведения об абоненте-физическом лице, ставшие известными оператору из исполнения договора, для справочных/иных информационных услуг или передачи третьим лицам требуют согласия, кроме федерально-законных случаев."
      guard: "TELEPHONE_SECRECY_AND_SUBSCRIBER_INFORMATION_ARE_RELATED_BUT_NOT_IDENTICAL_DATA_CLASSIFICATIONS"
    - locator: "Правила, пункт 4"
      concept: PURPOSE_BOUND_PDN_NO_CONSENT_RULES
      findings:
        - "Согласие на обработку ПДн не требуется для прямо перечисленных целей: расчеты за услуги связи; передача информации о плательщике; передача оператору ПДн организациями, подтверждающими сведения об абоненте; уведомление о задолженности; взаимодействие с ЕСИА; рассмотрение претензий."
      guard: "PURPOSE_SPECIFIC_STATUTORY_NO_CONSENT_RULE != UNIVERSAL_WAIVER_OF_152FZ_REQUIREMENTS"
    - locator: "Правила, пункт 18"
      concept: SUBSCRIBER_IDENTIFICATION_ESIA_EBS
      findings:
        - "Физлицо идентифицируется по документу, через ЕСИА либо посредством идентификации/аутентификации с ЕСИА и ЕБС по статье 9 572-ФЗ в предусмотренном сценарии."
      guard: "EBS_IS_AN_AVAILABLE_NORMATIVE_IDENTIFICATION_ROUTE_IN_DEFINED_SCENARIOS; NOT_EVERY_TELECOM_CONTRACT_REQUIRES_BIOMETRICS"
    - locator: "Правила, пункты 22, 24, 26"
      concept: SUBSCRIBER_PERSON_LEVEL_DATA_AND_VERIFICATION_WORKFLOW
      findings:
        - "Договор физлица включает ФИО, место жительства, дату рождения и реквизиты удостоверяющего личность документа."
        - "При нормативном запросе оператор в течение 3 календарных дней требует подтвердить соответствие ПДн фактического пользователя сведениям договора и повторно уведомляет не позднее чем за 3 дня до прекращения услуг."
        - "Абонент сообщает оператору об изменениях ряда идентификационных сведений в срок не более 60 календарных дней."
      guard: "TELECOM_VERIFICATION_DEADLINES != 152FZ_DATA_SUBJECT_REQUEST_OR_INCIDENT_DEADLINES"
    - locator: "Правила, пункт 28"
      concept: IDENTIFIED_SUBSCRIBER_ACTION_AUDIT_RETENTION
      findings:
        - "Оператор фиксирует электронно действия после идентификации и хранит сведения об изменении условий договора не менее 3 лет со дня расторжения договора; сведения об остальных предусмотренных действиях — не менее 3 лет со дня действия."
      guard: "THREE_YEAR_ACTION_LOG_RETENTION != GENERAL_RETENTION_PERIOD_FOR_ALL_SUBSCRIBER_PDN"
      evidence_note: "Текст пункта подтвержден индексированным официальным PDF Правительства; byte-exact локальный capture пока не получен."
    - locator: "1137, пункты 222-226 Правил"
      concept: MASS_AUTOMATED_CALL_OPT_OUT_WORKFLOW
      findings:
        - "Абонент может отказаться от массовых/автоматических вызовов; оператор прекращает их со следующего календарного дня; предусмотрена отмена отказа."
      guard: "MASS_AUTOMATED_CALL_REGIME_UNDER_126FZ != AUTOMATIC_CLASSIFICATION_AS_ADVERTISING_UNDER_38FZ"

