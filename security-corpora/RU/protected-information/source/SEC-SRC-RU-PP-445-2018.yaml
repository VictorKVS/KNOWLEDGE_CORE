protected_information:
  sectors:
    - communications
    - personal_data_overlap
    - operational_search_infrastructure
    - retention
  regimes:
    - communications_content_retention
    - communications_secrecy_overlap
    - communications_storage_security
  legal_basis:
    - "126-ФЗ, статья 64 часть 1"
    - "126-ФЗ, статья 63"
  protected_locators:
    - locator: "пункт 2"
      rule: >-
        Communications operators store user text messages, voice information, images, sounds, video and other
        communications messages in the Russian Federation in operator-owned technical information storage facilities;
        specifically listed mandatory public TV/radio and registered audiovisual-service traffic is stored at zero volume.
      semantic_guard: "Zero-volume exceptions are exclusions from this storage rule, not universal deletion mandates."
    - locator: "пункт 5"
      rule: >-
        Operators providing the enumerated telephone, mobile, satellite, personal-radio-call and data-transmission
        services store voice information and text messages in full for 6 months from the end of receipt,
        transmission, delivery and/or processing.
      semantic_guard: "The 6-month content-storage rule is service/object scoped and is not a universal PDN retention period."
    - locator: "пункт 6"
      rule: >-
        Telematic and/or data-transmission operators size technical storage capacity against the volume of messages
        sent and received during the 30 days preceding commissioning; capacity then increases annually by 15 percent
        for 5 years from commissioning.
      semantic_guard: "30 days is a capacity-sizing baseline and 15%-for-5-years is capacity growth; neither is a message-retention period."
    - locator: "пункт 7"
      rule: "The operator protects technical storage facilities and stored information against unauthorized access in accordance with MinTsifry requirements."
    - locator: "пункт 8"
      rule: >-
        Communications messages are deleted automatically according to software algorithms and storage-equipment
        requirements based on a maximum permissible storage period of 6 months from the end of receipt,
        transmission, delivery and/or processing.
      semantic_guard: "Do not transfer this content-deletion rule to the separate 126-FZ Article 64 communications-facts/metadata retention rule."
  applicability_status: "DIRECT_ONLY_FOR_COMMUNICATIONS_OPERATORS_SERVICES_AND_STORAGE_OBJECTS_DEFINED_BY_PP_445_AND_126_FZ"
  guards:
    - "COMMUNICATIONS_CONTENT_RETENTION_IS_NOT_UNIVERSAL_PDN_RETENTION"
    - "MESSAGE_OR_VOICE_OR_IMAGE_OBJECT_IS_NOT_AUTOMATICALLY_PERSONAL_DATA_WITHOUT_IDENTIFIABILITY_AND_PROCESSING_CONTEXT"
    - "COMMUNICATIONS_SECRECY_CLASSIFICATION_DERIVES_FROM_126_FZ_ARTICLE_63_AND_OTHER_PRIMARY_LAW_NOT_MERELY_FROM_FIELD_TYPE"
    - "PP_445_STORAGE_OBLIGATION_DOES_NOT_CREATE_UNRESTRICTED_DISCLOSURE_AUTHORITY"
    - "30_DAY_CAPACITY_BASELINE_IS_NOT_RETENTION"
    - "15_PERCENT_ANNUAL_CAPACITY_GROWTH_FOR_5_YEARS_IS_NOT_RETENTION"
    - "6_MONTH_CONTENT_RETENTION_MUST_NOT_REPLACE_126_FZ_ARTICLE_64_SEPARATE_3_YEAR_COMMUNICATIONS_FACTS_RETENTION"
    - "ZERO_VOLUME_EXCLUSIONS_ARE_NOT_GENERAL_DELETION_RULES"
    - "NO_APPLICABILITY_PROMOTION_FROM_TAXONOMY_OR_SECTOR_CONTEXT"

