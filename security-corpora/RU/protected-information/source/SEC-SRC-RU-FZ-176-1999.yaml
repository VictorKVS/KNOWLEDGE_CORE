  findings:
    - "Все операторы почтовой связи обязаны обеспечивать соблюдение тайны связи."
    - "Адресные данные пользователей, сведения о почтовых отправлениях, почтовых переводах денежных средств, телеграфных и иных сообщениях в сфере деятельности операторов почтовой связи относятся законом к тайне связи."
    - "Ограничение тайны связи допускается только на основании судебного решения."
  semantic_guard: >-
    Address data may intersect with personal data, but Article 15 protects a broader statutory communications-secrecy
    object. Do not collapse postal communications secrecy into the 152-ФЗ regime.

