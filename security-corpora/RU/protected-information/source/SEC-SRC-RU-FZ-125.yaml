      findings:
        - "Access to archival documents containing personal/family secrets, private-life information or information threatening citizen safety is restricted for 75 years from document creation."
        - "Earlier lifting of this restriction is possible with written permission under the statutory conditions."
      semantic_guard: "The 75-year access restriction must not be merged with Article 22.1 retention rules."

pdn_relation:
  target: "152-ФЗ"
  state: DIRECT_STATUTORY_SCOPE_BOUNDARY
  primary_locator: "152-ФЗ статья 1 часть 2 пункт 2"
  finding: >-
    152-ФЗ expressly excludes from its scope relations arising from organization of storage, acquisition, accounting and
    use of documents of the Archival Fund of the Russian Federation and other archival documents containing personal data
    when those relations are governed by Russian archival legislation.
  significance: >-
    This is not merely an overlap candidate: it is a statutory boundary between the generic personal-data regime and the
    special archival regime. The boundary must still be applied to the concrete relationship and document lifecycle;
    it does not mean every operation performed by an organization before or outside archival-law processing is excluded
    from 152-ФЗ.
  applicability_guard: "Determine whether the concrete relationship is archival storage/acquisition/accounting/use under archival legislation before applying the exclusion."

