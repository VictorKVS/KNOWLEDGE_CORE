protected_information:
  sector: advertising_marketing
  regime: internet_advertising_reporting_actor_scope
  legal_basis: "38-ФЗ статья 18.1 часть 3"
  protected_locators:
    - locator: "Критерии, пункт 1"
      concept: INTERNET_AD_REPORTING_ACTOR_SCOPE
      finding: "Определяет категории рекламодателей, рекламораспространителей и операторов рекламных систем, обязанных предоставлять или обеспечивать предоставление сведений об интернет-рекламе в Роскомнадзор."
    - locator: "Критерии, рекламодатель"
      concept: ADVERTISER_REPORTING_ROLE_BOUNDARY
      finding: "Критерии охватывают юридических лиц, физических лиц и индивидуальных предпринимателей при выполнении условий акта; договорная модель может переносить обязанность предоставления сведений на рекламораспространителя или оператора рекламной системы."
    - locator: "Критерии, рекламораспространитель/оператор рекламной системы"
      concept: DISTRIBUTOR_PLATFORM_ROLE_BOUNDARY
      finding: "Выделяет специальные категории участников интернет-распространения рекламы, включая владельцев отдельных интернет-сервисов и информационных ресурсов."
  applicability_status: CANDIDATE_APPLICABILITY_REVIEW_REQUIRED
  applicability_guard: "Постановление № 948 определяет actor scope рекламной отчетности. Само попадание в actor scope не доказывает наличие персональных данных и не создает универсальную применимость 152-ФЗ."

