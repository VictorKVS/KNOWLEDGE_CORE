protected_information:
  sector: advertising_marketing
  regime: internet_advertising_regulatory_data_exchange
  legal_basis: "38-ФЗ статья 18.1"
  protected_locators:
    - locator: "Правила, пункт 1"
      concept: INTERNET_AD_DATA_INTERACTION_SCOPE
      finding: "Определяет порядок, формат и сроки передачи через операторов рекламных данных информации об интернет-рекламе и социальной рекламе в Роскомнадзор."
    - locator: "Правила, пункты 2-3"
      concept: ORD_TO_RKN_DATA_TRANSPORT
      finding: "Регулирует электронное взаимодействие оператора рекламных данных с информационной системой уполномоченного органа."
    - locator: "Правила, пункт 10"
      concept: INTERNET_AD_REPORTING_DEADLINE
      finding: "Для лиц статьи 18.1 установлен специальный срок предоставления информации оператору рекламных данных; текущая редакция содержит базовый месячный цикл и отдельный договорный сценарий."
    - locator: "Правила, пункт 19"
      concept: ORD_DISCLOSURE_LIMITATION
      finding: "Оператор рекламных данных не вправе передавать полученную рекламную информацию иным лицам, кроме предусмотренного правилами уполномоченного органа; возврат исходному поставщику возможен по его запросу."
    - locator: "Правила, пункт 20"
      concept: RKN_REQUEST_RESPONSE_DEADLINE
      finding: "По запросу уполномоченного органа оператор рекламных данных предоставляет имеющуюся информацию и рекламу в специальный короткий срок."
  applicability_status: CANDIDATE_APPLICABILITY_REVIEW_REQUIRED
  applicability_guard: "PP 974 исполняется только при доказанной роли участника режима статьи 18.1 38-ФЗ; наличие рекламных данных не означает автоматически наличие персональных данных."

