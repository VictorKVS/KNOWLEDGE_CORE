normative_anchors:
  - locator: "статья 16"
    finding: "GAS Vybory information resources include personal data about voters, referendum participants, nominated and registered candidates, elected candidates, trusted persons, authorized representatives and election/referendum commission members; exact data lists are established by federal laws."
    guard: "ARTICLE_16_PERSON_CATEGORIES_DO_NOT_DEFINE_UNLIMITED_FIELD_SET"
  - locator: "статья 17 пункт 2"
    finding: "Information resources containing personal data are federal information resources and are formed, stored and used under confidentiality according to the law, other federal laws and CEC normative acts."
    guard: "CONFIDENTIALITY_REQUIREMENT_NOT_NEW_INDEPENDENT_STATUTORY_SECRET_CATEGORY"
  - locator: "статья 17 пункты 3-7"
    finding: "Formation, transfer, copying, replication, storage, access and use of GAS information resources are governed by the applicable resource level and CEC/election-commission rules; integrity loss or distortion triggers restoration measures."
    guard: "RESOURCE_LEVEL_RULES_REQUIRE_MATCHING_CEC_OR_ELECTION_COMMISSION_ACT"
  - locator: "статья 18 пункт 1"
    finding: "Access to GAS resources containing personal data is restricted to specified commission/CEC-support workers when necessary for duties, citizens requesting their own personal data, and public officials whose access is provided by federal law."
    guard: "AUTHORIZED_ACCESS_NOT_UNLIMITED_SECONDARY_USE_OR_GENERAL_INTERAGENCY_ACCESS"
  - locator: "статья 18 пункты 2-3"
    finding: "Access to non-personal-data resources and detailed access procedures are separately regulated, including CEC and relevant election-commission normative acts."
    guard: "NON_PDN_RESOURCE_ACCESS_RULES_NOT_TRANSFERABLE_TO_PDN_RESOURCES"
  - locator: "статья 20"
    finding: "Use of GAS Vybory for tasks unrelated to elections/referenda is permitted only under federal laws and CEC normative acts and must preserve information accuracy, system integrity and election-function priority."
    guard: "NON_ELECTION_USE_REQUIRES_SEPARATE_LEGAL_ROUTE_NOT_OPEN_REPURPOSING"
  - locator: "статья 21"
    finding: "Security is based on organizational and technical measures and control, including certification, certified/properly licensed software and technical means, prevention of unauthorized access, authenticity/integrity, protection during transmission, readiness checks, approved operational documentation, preservation/workability, trained personnel and responsibility."
    guard: "GAS_VYBORY_SECURITY_BASELINE_NOT_AUTOMATICALLY_GENERALIZED_TO_ALL_GIS"
  - locator: "статья 22"
    finding: "Information exchange may use public, departmental and other communications networks under federal law; operators are responsible for service quality under federal law."
    guard: "USE_OF_COMMUNICATIONS_NETWORKS_NOT_AUTOMATIC_TELECOM_SECRET_CLASSIFICATION_OF_EACH_DATA_ELEMENT"
  - locator: "статья 24"
    finding: "Persons with access to GAS resources, including personal data, are liable under federal law for violations of protection, processing and use regimes; unlawful interference and rights violations are separately actionable."
    guard: "LIABILITY_PROVISION_NOT_A_SEPARATE_PROCESSING_PURPOSE"

retention_review:
  numeric_general_retention_period_located_in_20_fz: false
  finding: "Article 17 regulates storage governance but does not establish one universal numeric retention period for all GAS Vybory personal-data resources."
  related_67_fz_rule: "67-FZ article 70 provides an election-document retention floor for voter lists/signature sheets/ballots, but that rule is not generalized to every GAS Vybory resource."
  guards:
    - "VOTER_LIST_RETENTION_FROM_67_FZ_NOT_GENERAL_GAS_RESOURCE_RETENTION"
    - "CEC_RESOURCE_STORAGE_RULES_REQUIRE_SEPARATE_PRIMARY_ACT_CAPTURE"
    - "NO_GENERAL_PDN_RETENTION_INFERRED_FROM_SYSTEM_EXISTENCE"

