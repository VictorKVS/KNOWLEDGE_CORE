retention:
  universal_personal_data_retention: false
  rules:
    - locator: "пункт 2.10"
      scope: "BKI protected information + access-registration data under 2.7 + information-security incident data"
      period: "5 years from formation by / receipt in the BKI, unless Russian legislation regulating BKI establishes another period"
      semantic_guard: "This five-year rule is not a universal PDN retention period and does not erase more specific object-specific periods in 218-FZ."
    - locator: "пункт 3.2"
      scope: "credit rating agency protected information"
      period: "archive-law periods, but at least 5 years; electronic backups at least once every 7 days"
      semantic_guard: "This is a separate credit-rating-agency lifecycle, not BKI credit-history retention."
  reconciliation_with_218_fz:
    - "For credit-history records and other objects for which 218-FZ establishes another period, apply the specific statutory object lifecycle rather than replacing it with an undifferentiated five-year rule."
  guards:
    - "FIVE_YEAR_808_P_RULE_NOT_UNIVERSAL_PDN_RETENTION"
