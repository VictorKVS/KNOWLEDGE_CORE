  protected_locators:
    - locator: "пункт 2.1"
      rule: "БКИ защищают информацию статьи 4 218-ФЗ в автоматизированных системах при обработке, хранении и передаче сертифицированными средствами защиты; если защищаемая информация содержит персональные данные, применяются меры безопасности по статье 19 152-ФЗ."
      semantic_guard: "The Article 19 bridge is conditional on the protected information actually containing personal data; do not classify every Article 4 item as PDN without object/subject analysis."
    - locator: "пункт 2.7"
      rule: "БКИ регистрируют результаты идентификации, аутентификации и авторизации, приема/передачи электронных сообщений, доступа работников и действий субъектов взаимодействия с защищаемой информацией."
    - locator: "пункты 2.8-2.9"
      rule: "БКИ регистрируют инциденты защиты информации, организуют реагирование и предусмотренное Положением информирование Банка России."
    - locator: "пункт 2.10"
      rule: "БКИ хранят защищаемую информацию, данные регистрации пункта 2.7 и сведения об инцидентах; целостность и доступность обеспечиваются пять лет от формирования/поступления, если специальным законодательством о БКИ не установлен иной срок."
    - locator: "пункты 3.1-3.2"
      rule: "Для кредитного рейтингового агентства установлен отдельный режим сохранности и защиты информации, включая информацию ограниченного доступа по 149-ФЗ и/или договору."
    - locator: "пункт 4.1"
      rule: "Если используемые БКИ объекты информационной инфраструктуры являются объектами КИИ, дополнительно применяются требования по 187-ФЗ."
  guards:
