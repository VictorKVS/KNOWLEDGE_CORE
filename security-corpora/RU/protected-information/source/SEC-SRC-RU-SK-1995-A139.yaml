title: "Семейный кодекс Российской Федерации — статья 139 «Тайна усыновления ребенка»"
status: NEW_PRIMARY_AUTHORITY_TEXT_VERIFIED_EXACT_OFFICIAL_ARTIFACT_PENDING_VERSION_CHAIN_PARTIAL
checked_at: "2026-08-22T14:26:27+03:00"

proof_floor:
  - "Тайна усыновления является самостоятельным специальным режимом; наличие идентифицирующих сведений не доказывает применимость конкретного требования 152-ФЗ."
  - "Статья 139 устанавливает обязанность сохранять тайну усыновления для судей, должностных лиц государственной регистрации и иных осведомленных лиц; это не универсальный запрет на любой законный доступ."
  - "Конституционно-правовой смысл статьи 139 раскрыт Постановлением Конституционного Суда РФ от 16.06.2015 № 15-П; это толкование нельзя сводить к автоматическому разрешению раскрытия сведений."
  - "Общая актуальность Семейного кодекса и locator-specific актуальность статьи 139 проверяются раздельно."
  - "MIME, byte length, SHA-256 и retrieved_at для текущего официального артефакта не фиксируются без byte-exact захвата."

