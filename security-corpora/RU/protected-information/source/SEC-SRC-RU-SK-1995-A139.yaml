protected_locators:
  - locator: "статья 139, пункт 1"
    concept: ADOPTION_SECRET_PROTECTED_BY_LAW
    state: CURRENT_PRIMARY_AUTHORITY_TEXT_CROSSCHECKED
    finding: >-
      Тайна усыновления ребенка охраняется законом. Судьи, вынесшие решение об усыновлении, должностные лица,
      осуществившие государственную регистрацию усыновления, а также лица, иным образом осведомленные об усыновлении,
      обязаны сохранять тайну усыновления ребенка.
  - locator: "статья 139, пункт 2"
    concept: ADOPTION_SECRET_DISCLOSURE_LIABILITY
    state: CURRENT_PRIMARY_AUTHORITY_TEXT_CROSSCHECKED
    finding: >-
      Лица, указанные в пункте 1, разгласившие тайну усыновления против воли усыновителей, привлекаются к ответственности
      в установленном законом порядке.
  - locator: "статья 135, пункт 1"
    concept: ADOPTION_SECRET_SUPPORTING_RECORD_CHANGES
    state: PRIMARY_AUTHORITY_TEXT_CROSSCHECKED
    finding: >-
      Для обеспечения тайны усыновления по просьбе усыновителя допускается изменение даты рождения в установленных
      пределах и места рождения усыновленного ребенка.
    semantic_guard: "Это специальный механизм обеспечения тайны усыновления, а не общее разрешение на изменение идентификационных данных."

pdn_relation:
  target: "152-ФЗ"
  state: OVERLAP_CANDIDATE_APPLICABILITY_REVIEW_REQUIRED
  evidence_dimensions:
    - "сведения об усыновленном ребенке, усыновителях, происхождении, имени, дате и месте рождения могут содержать персональные данные"
    - "режим статьи 139 защищает специальный объект — тайну факта и обстоятельств усыновления"
  guard: >-
    OVERLAP != APPLICABILITY. Для конкретной операции необходимо отдельно установить субъект данных, состав полей,
    цель и правовое основание обработки, роль участника, получателя и специальное основание доступа/раскрытия.

cross_regime_relations:
  - target: "143-ФЗ, статья 47"
    type: ADOPTION_CIVIL_STATUS_RECORD_SECRECY
    state: DIRECT_STATUTORY_REGIME_OVERLAP_CONSTITUTIONAL_INTERPRETATION_EXISTS
    evidence: >-
      Постановление КС РФ № 15-П прямо рассматривает в единой правовой связке статью 139 СК РФ и статью 47 Закона
      об актах гражданского состояния, включая запрет работникам ЗАГС сообщать сведения об усыновлении и выдавать
      документы, раскрывающие отсутствие биологического родства, без согласия усыновителей.
    guard: "Не объединять семейно-правовой режим и режим записей актов гражданского состояния в один источник/объект."

