protected_information:
  sector: advertising_marketing
  regime: advertising_data_operator_software_security_and_retention
  legal_basis: "38-ФЗ статья 18.1 часть 6"
  protected_locators:
    - locator: "Требования, пункт 1"
      concept: DIRECT_PDN_AND_INFORMATION_SECURITY_COMPLIANCE
      finding: "ПО операторов рекламных данных должно соответствовать законодательству РФ об информации, информационных технологиях и защите информации, а также законодательству РФ в области персональных данных."
      pdn_guard: "Прямая ссылка относится к программам операторов рекламных данных в установленном законом контексте; не переносить автоматически на любого рекламодателя."
    - locator: "Требования, пункт 6 подпункты а-в"
      concept: AD_DATA_RECEIVE_STORE_PROCESS_TRANSMIT_IMMUTABILITY
      finding: "ПО должно обеспечивать получение, хранение и обработку рекламной информации и самой рекламы, передачу в информационную систему Роскомнадзора и неизменность передаваемой информации."
    - locator: "Требования, пункт 6 подпункт г"
      concept: ORD_AD_DATA_RETENTION
      finding: "Информация об интернет-рекламе хранится не менее одного года со дня предоставления в информационную систему; непосредственно реклама — в течение года с даты предоставления информации оператору рекламных данных."
      pdn_guard: "Это специальный срок режима ОРД, а не универсальный срок хранения ПДн."
    - locator: "Требования, пункт 6 подпункт з"
      concept: AD_DISTRIBUTION_AND_AUDIENCE_TELEMETRY
      finding: "Фиксируются технические идентификаторы ресурсов и рекламных систем, показы, факты доступа, даты и сведения о целевой аудитории, включая пол, возраст, иные социально-демографические параметры и территорию проживания/нахождения при наличии такой информации."
      pdn_guard: "Параметры аудитории могут быть агрегированными либо относиться к идентифицируемым лицам; статус ПДн доказывается по конкретному payload."
    - locator: "Требования, пункт 6 подпункт м"
      concept: INFORMATION_PRESERVATION_AND_PROTECTION
      finding: "ПО должно обеспечивать сохранность получаемой и передаваемой информации и защиту от преднамеренных и непреднамеренных информационных воздействий."
    - locator: "Требования, пункт 8"
      concept: SOFTWARE_HEALTH_MONITORING
      finding: "Требуется встроенная система оценки работоспособности, автоматического информирования о сбоях/ошибках и передачи таких данных в информационную систему."
  applicability_status: CANDIDATE_APPLICABILITY_REVIEW_REQUIRED
  applicability_guard: "Прямой PDN-context доказан только для ПО оператора рекламных данных, подпадающего под часть 6 статьи 18.1 38-ФЗ. Для иной роли требуется отдельное основание."

