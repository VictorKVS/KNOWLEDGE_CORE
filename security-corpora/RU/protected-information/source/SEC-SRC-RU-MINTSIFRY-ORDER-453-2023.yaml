protected_information:
  sectors:
    - biometrics
    - personal_data
    - identity_authentication
    - public_digital_infrastructure
    - finance_overlap
  regimes:
    - biometric_personal_data
    - unified_biometric_system
    - authentication_biometric_vectors
  legal_basis:
    - "572-ФЗ, статья 6 часть 2 пункт 1"
    - "152-ФЗ, статья 19"
  protected_locators:
    - locator: "Приложение № 1, пункт 20"
      rule: >-
        Биометрические персональные данные, размещенные в ЕБС, хранятся не менее 50 лет со дня размещения;
        исключение для данных, размещенных по подпункту 3 пункта 1 Порядка размещения и обновления — не менее 5 лет.
      security: "security measures under Article 19 of 152-FZ plus cryptographic protection against 572-FZ threat model"
    - locator: "Приложение № 1, пункт 21"
      rule: >-
        Биометрические персональные данные, размещенные по специальному маршруту подпункта 4 пункта 1,
        хранятся отдельно от данных, размещенных иными способами.
    - locator: "Приложение № 3, пункт 3"
      rule: >-
        В информационных системах аккредитованных государственных органов, Банка России при аккредитации
        и организаций аутентификации хранение использованных для аутентификации биометрических данных запрещено,
        кроме рассмотрения обращений/оспаривания; такое исключительное хранение допускается не более 10 суток
        с момента предоставления данных для аутентификации.
    - locator: "Приложение № 3, пункт 4"
      rule: "requires organizational and technical personal-data security measures established under Article 19 of 152-FZ"
  applicability_status: "DIRECT_FOR_572_FZ_EBS_AND_SPECIFIED_ACCREDITED_AUTHENTICATION_SYSTEMS_ONLY"
  guards:
    - "50_YEAR_AND_5_YEAR_RULES_ARE_ROUTE_SPECIFIC_EBS_RETENTION_NOT_UNIVERSAL_BIOMETRIC_PDN_RETENTION"
    - "10_DAY_RULE_IS_AUTHENTICATION_COPY_EXCEPTION_NOT_EBS_MASTER_RECORD_RETENTION"
    - "ORDER_EXPIRY_2029_AND_PARTIAL_SUNSET_2027_ARE_NOT_PDN_RETENTION"
    - "BANK_OR_CBR_PARTICIPATION_DOES_NOT_BY_ITSELF_CREATE_BANKING_SECRECY_CLASSIFICATION"
    - "VOICE_BIOMETRIC_PROCESSING_DOES_NOT_BY_ITSELF_CREATE_TELECOMMUNICATIONS_SECRECY_CLASSIFICATION"
