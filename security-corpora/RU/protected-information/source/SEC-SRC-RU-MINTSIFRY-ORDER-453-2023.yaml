  number: "453"
  adopted_date: "2023-05-12"
  full_title: >-
    О порядке обработки биометрических персональных данных и векторов единой биометрической системы
    в единой биометрической системе и в информационных системах аккредитованных государственных органов,
    Центрального банка Российской Федерации в случае прохождения им аккредитации, организаций,
    осуществляющих аутентификацию на основе биометрических персональных данных физических лиц
