protected_information:
  sectors:
    - archives
    - public_sector
    - restricted_information
    - service_information_limited_distribution
    - personal_data_overlap
  regimes:
    - archival_access_restriction
    - service_information_limited_distribution
    - dlu_marking_and_handling
  protected_locators:
    - locator: "пункт 1"
      concept: ARCHIVAL_SERVICE_INFORMATION_LIMITED_DISTRIBUTION_DEFINITION
      finding: "В данном Порядке к служебной информации ограниченного распространения в документах Архивного фонда РФ, хранящихся в государственных и муниципальных архивах, относится несекретная информация, распространение которой может создать потенциальную угрозу интересам Российской Федерации."
      guard: "Это специальное определение для доказанного архивного режима; оно не позволяет объявлять любую внутреннюю информацию организации ДСП."
    - locator: "пункты 2-6"
      concept: RESTRICTED_LIST_GOVERNANCE
      findings:
        - "Перечень такой информации разрабатывается Росархивом по установленному кругу предложений и утверждается приказом Росархива."
        - "Сам утвержденный Перечень является документом, содержащим служебную информацию ограниченного распространения, и имеет пометку «Для служебного пользования»."
        - "Перечень должен поддерживаться Росархивом в актуальном состоянии."
      guard: "Непубличный Перечень не реконструируется по догадкам или вторичным таксономиям."
    - locator: "пункты 7-19"
      concept: CLASSIFICATION_AND_DECLASSIFICATION_PROCEDURE
      finding: "Вопросы отнесения конкретных архивных документов к служебной информации ограниченного распространения и снятия ограничения проходят через Комиссию Росархива; итоговое решение оформляется приказом руководителя Росархива."
      guard: "Наличие потенциально чувствительных сведений в архивном деле само по себе не доказывает, что конкретный документ уже отнесен к ДСП по этому Порядку."
    - locator: "пункты 25-26"
      concept: ACCESS_RESTRICTION_EFFECTIVE_EVENT
      findings:
        - "Ограничение доступа начинает действовать со дня внесения архивом необходимых изменений в учетные документы на основании приказа Росархива."
        - "Снятие ограничения действует со дня внесения архивом соответствующих изменений в учетные документы на основании приказа Росархива."
      guard: "Это lifecycle доступа, а не срок хранения документа и не срок обработки ПДн."
    - locator: "пункт 27"
      concept: PROCEDURAL_RECORDS_ARE_DLU
      finding: "Приказы Росархива, изданные по пункту 19, и протоколы заседаний Комиссии являются документами, содержащими служебную информацию ограниченного распространения, с пометкой «Для служебного пользования»."
    - locator: "пункт 28"
      concept: DLU_HANDLING_REFERENCE
      finding: "Переписка по вопросам отнесения/снятия ограничения осуществляется по режиму обращения со служебной информацией ограниченного распространения, установленному постановлением Правительства РФ от 03.11.1994 № 1233."

nonpublic_primary_dependency:
  object: "Перечень служебной информации ограниченного распространения, содержащейся в документах Архивного фонда РФ"
  public_status: NOT_PUBLIC_BY_DESIGN
  official_rosarchive_statement: "Росархив официально сообщил 01.10.2025, что Перечень зарегистрирован Минюстом, но не опубликован, поскольку сам содержит служебную информацию ограниченного распространения, в том числе в области обороны и обеспечения государственной безопасности."
  rule: "Не перечислять содержимое непубличного Перечня по неофициальным утечкам/пересказам; допускаются только публично подтвержденные Росархивом сведения и выводы в пределах их формулировки."

pdn_boundary:
  relationship_to_152fz: CONDITIONAL_ARCHIVAL_ACCESS_OVERLAP
  findings:
    - "Порядок № 38 регулирует специальное ограничение доступа к архивным документам и не является общим основанием обработки ПДн."
    - "Если конкретный архивный документ содержит ПДн, применимость 152-ФЗ и архивного исключения проверяется по фактической стадии/операции и законодательству об архивном деле."
