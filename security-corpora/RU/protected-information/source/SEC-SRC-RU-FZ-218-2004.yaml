protected_information:
  sectors:
    - finance
    - credit_histories
    - banking_overlap
    - insurance_overlap
    - personal_data_overlap
    - retention
  regimes:
    - credit_history_information_limited_access
    - credit_history_processing_and_disclosure
    - credit_history_retention_and_archiving
    - credit_history_subject_rights
  protected_locators:
    - locator: "статья 7 часть 4"
      rule: "Совокупность информации статьи 4, полученная бюро кредитных историй в порядке статьи 5, является информацией ограниченного доступа."
      semantic_guard: "This is an express limited-access regime for the statutory credit-history dataset; do not rename it as banking secrecy, commercial secrecy or personal data merely by analogy."
    - locator: "статья 7 часть 2"
      rule: "Бюро кредитных историй обеспечивает защиту информации статьи 4 при обработке, хранении и передаче сертифицированными средствами защиты и по требованиям Банка России, согласованным с уполномоченными органами безопасности и ТЗИ."
    - locator: "статья 7 часть 5"
      rule: "Предоставление информации в порядке, предусмотренном 218-ФЗ, не является нарушением служебной, банковской, налоговой или коммерческой тайны."
      semantic_guard: "The statutory disclosure safe-harbor does not convert all credit-history information into each named secrecy category and does not authorize disclosure outside the routes established by 218-FZ."
    - locator: "статья 5 часть 3.1"
      rule: "Перечисленные источники формирования кредитной истории обязаны передавать предусмотренную статьей 4 информацию хотя бы в одно БКИ без получения согласия на ее представление, кроме прямо установленных законом ограничений."
      semantic_guard: "Absence of consent for this statutory transfer route is not a general waiver of consent/legal-basis requirements for unrelated processing or disclosure."
    - locator: "статья 6"
      rule: "Кредитные отчеты и их части предоставляются только установленным законом получателям, в предусмотренном составе, по запросам/согласиям/полномочиям, указанным в статье 6."
    - locator: "статья 8"
      rule: "Субъект кредитной истории имеет право получить сведения о БКИ, получить свой кредитный отчет и оспаривать содержащуюся в кредитной истории информацию."
  applicability_status: DIRECT_FOR_CREDIT_HISTORY_ACTORS_AND_DATASETS_DEFINED_BY_218_FZ
  guards:
    - "CREDIT_HISTORY_INFORMATION_LIMITED_ACCESS_IS_AN_EXPRESS_218_FZ_REGIME"
    - "CREDIT_HISTORY_NOT_AUTOMATICALLY_BANKING_SECRECY"
    - "CREDIT_HISTORY_NOT_AUTOMATICALLY_INSURANCE_SECRECY"
    - "LAWFUL_218_FZ_DISCLOSURE_SAFE_HARBOR_NOT_GENERAL_DISCLOSURE_AUTHORITY"
    - "STATUTORY_TRANSFER_WITHOUT_CONSENT_NOT_GENERAL_NO_CONSENT_RULE"
    - "PDN_OVERLAP_REQUIRES_NATURAL_PERSON_IDENTIFIABILITY_AND_CONCRETE_PROCESSING_CONTEXT"
    - "NO_APPLICABILITY_PROMOTION_FROM_TAXONOMY_OR_SECTOR_LABEL"

retention:
  universal_personal_data_retention: false
  rules:
    - locator: "статья 7 часть 1"
      scope: "individual credit-history record"
      period: "7 years from the last change to information contained in that record"
      lifecycle_after_period: "record/data are excluded from credit reports and moved to the BKI credit-history archive"
    - locator: "статья 7 часть 1"
      scope: "archived record/data after annulment/exclusion from credit reports"
      period: "3 years in the BKI credit-history archive"
      semantic_guard: "Do not collapse 7-year active record storage plus 3-year archive storage into an undifferentiated '10-year credit-history retention' rule."
    - locator: "статья 7 часть 1.2"
      scope: "credit histories transferred to the Central Catalogue in the Article 12(8) case"
      period: "until transfer to a BKI, but no more than 5 years from transfer to the Central Catalogue"
    - locator: "статья 7 часть 1.3"
      scope: "information on an active credit/loan self-ban"
      period: "permanent while the statutory state requires it, or 7 years from removal of the ban as specified by the provision"
    - locator: "статья 7 часть 1.3"
      scope: "information on removal of the self-ban"
      period: "7 years from inclusion of the removal information in the subject's credit history"
  guards:
    - "7_YEAR_RECORD_PERIOD_NOT_UNIVERSAL_PDN_RETENTION"
    - "3_YEAR_ARCHIVE_PERIOD_IS_A_SEPARATE_LIFECYCLE_STAGE"
    - "5_YEAR_CENTRAL_CATALOGUE_TRANSFER_CASE_NOT_GENERAL_BKI_RETENTION"
    - "SELF_BAN_RETENTION_RULES_ARE_OBJECT_SPECIFIC"

