normative_anchors:
  - locator: "статья 16 пункт 5"
    finding: "Authorities responsible for residence registration and identity documents periodically transmit named personal data including full name, date and place of birth, sex, citizenship, residence address, identity-document type, series/number, issuing authority/code and issue date for voter-registration purposes."
    guard: "STATUTORY_ELECTORAL_REGISTER_DATASET_NOT_GENERAL_INTERAGENCY_DATASET"
  - locator: "статья 16 пункты 6-9"
    finding: "The voter register is updated from civil-status death data, military-accounting data, penitentiary-status data and incapacity/capacity court decisions through defined public-authority routes."
    guard: "SOURCE_SPECIFIC_TRANSFER_ROUTE_REQUIRED_NO_UNLIMITED_SECONDARY_USE"
  - locator: "статья 16 пункт 10"
    finding: "Voter registration and registered-voter counts are performed twice yearly using GAS Vybory."
    guard: "GAS_VYBORY_SYSTEM_ROUTE_NOT_GENERAL_PDN_REGISTRY"
  - locator: "статья 16 пункт 12"
    finding: "A voter/referendum participant has direct access and correction rights regarding documented personal data about them and may know who used the information, for what purposes, by whom and to whom it was provided."
    guard: "SECTOR_SPECIFIC_ACCESS_RIGHTS_DO_NOT_REPLACE_ALL_152_FZ_SUBJECT_RIGHTS"
  - locator: "статья 17 пункты 1, 6-7"
    finding: "Voter lists are built from the state voter-registration system; information is supplied by designated officials and lists can be compiled using GAS Vybory."
    guard: "LIST_CREATION_PURPOSE_AND_AUTHORITY_MUST_MATCH_ELECTORAL_LAW"
  - locator: "статья 17 пункт 11"
    finding: "The voter list contains full name, year of birth (and for age 18 day/month), residence address, and provides fields for the voter signature and identity-document series and number when a ballot is issued."
    guard: "VOTER_LIST_DATASET_NOT_PUBLIC_DIRECTORY_AND_NOT_GENERIC_IDENTITY_DATASET"
  - locator: "статья 17 пункт 15.2"
    finding: "Voter lists may be created, updated and used electronically under CEC-defined rules; a legally equivalent copy is created after voting and stored under election-document retention rules."
    guard: "ELECTRONIC_COPY_RETENTION_FOLLOWS_ELECTORAL_DOCUMENTATION_RULES_NOT_GENERAL_PDN_RETENTION"
  - locator: "статья 17 пункт 16"
    finding: "Correction/exclusion is controlled by formal documents and changes are also reflected in the GAS Vybory database with exclusion date and reason."
    guard: "CORRECTION_WORKFLOW_NOT_GENERAL_ERASURE_ON_REQUEST"
  - locator: "статья 17 пункт 19"
    finding: "After official publication of results, voter-list information may be used to clarify the voter register."
    guard: "POST_ELECTION_REUSE_IS_STATUTORILY_SCOPED_NOT_OPEN_SECONDARY_USE"
  - locator: "статья 70 пункты 10-11"
    finding: "Election documentation including voter lists must be retained for statutory periods; minimum retention for voter lists, ballots and signature sheets is at least one year after publication of voting/election results, with extension where relevant litigation or criminal proceedings continue; detailed storage/archive/destruction rules are set by CEC/regional election commissions with archive authorities."
    guard: "ONE_YEAR_IS_MINIMUM_ELECTORAL_DOCUMENT_RETENTION_NOT_GENERAL_PDN_RETENTION"
  - locator: "статья 74"
    finding: "GAS Vybory is used in election and referendum preparation/conduct and for commission powers under the statutory system regime."
    guard: "SYSTEM_USAGE_DOES_NOT_CREATE_UNLIMITED_CROSS_SECTOR_ACCESS"

retention_review:
  statutory_floor:
    locator: "статья 70 пункт 10"
    voter_lists_signature_sheets_ballots: "not less than 1 year from publication of voting and election/referendum results"
    litigation_or_criminal_case_extension: "until court decision enters into force or relevant case is terminated under law"
  exact_record_series_periods: "may be longer and require the election-specific law/CEC or regional archival order"
  guards:
    - "ONE_YEAR_MINIMUM_NOT_FIXED_UNIVERSAL_DELETION_DATE"
    - "VOTER_LIST_RETENTION_NOT_GENERAL_VOTER_REGISTER_RETENTION"
    - "ELECTION_DOCUMENT_RETENTION_NOT_GENERAL_PDN_RETENTION"

