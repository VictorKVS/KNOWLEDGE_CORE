  protected_locators:
    - locator: "статья 13 часть 1"
      rule: "Сведения о факте обращения гражданина за медицинской помощью, состоянии здоровья и диагнозе, а также иные сведения, полученные при медицинском обследовании и лечении, составляют врачебную тайну."
    - locator: "статья 13 часть 2"
      rule: "Разглашение сведений, составляющих врачебную тайну, не допускается, в том числе после смерти человека, кроме случаев, предусмотренных частями 3, 3.1 и 4 статьи 13."
    - locator: "статья 13 части 3 и 3.1"
      rule: "Передача сведений и посмертное раскрытие имеют специальные основания и условия; письменное согласие или предусмотренный законом запрос не заменяются общей презумпцией разрешения."
    - locator: "статья 13 часть 4"
      rule: "Закон содержит закрытые по предмету случаи предоставления сведений без согласия гражданина или его законного представителя; каждый маршрут требует отдельного совпадения с нормативным основанием."
    - locator: "статья 13 часть 4 пункт 8"
      rule: "Обмен информацией между медицинскими организациями, в том числе размещенной в медицинских информационных системах, для оказания медицинской помощи осуществляется с учетом требований законодательства Российской Федерации о персональных данных."
    - locator: "статья 92 части 1 и 4"
      rule: "Персонифицированный учет в сфере здравоохранения включает обработку персональных данных определенных законом категорий лиц; конфиденциальность и безопасность этих данных обеспечиваются с соблюдением законодательства о персональных данных."
