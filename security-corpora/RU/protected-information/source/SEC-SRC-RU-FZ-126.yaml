protected_locators:
  - locator: "статья 53, часть 1"
    concept: SUBSCRIBER_INFORMATION_RESTRICTED_ACCESS
    state: CURRENT_OFFICIAL_TEXT_CROSSCHECKED
    finding: >-
      Сведения об абонентах и оказываемых им услугах связи, ставшие известными оператору в силу исполнения договора,
      являются информацией ограниченного доступа и подлежат защите по законодательству РФ.
  - locator: "статья 53, часть 1"
    concept: SUBSCRIBER_CITIZEN_DISCLOSURE_CONSENT_AND_STATUTORY_EXCEPTIONS
    state: CURRENT_OFFICIAL_TEXT_CROSSCHECKED
    finding: >-
      Передача третьим лицам сведений об абонентах-гражданах допускается с согласия, кроме случаев, предусмотренных
      федеральными законами; статья также содержит специальный контекст передачи оператору персональных данных
      пользователей услугами связи абонента-юридического лица или ИП.
  - locator: "статья 53, часть 2"
    concept: PUBLIC_SUBSCRIBER_DATABASE_CONSENT_AND_REMOVAL
    state: CURRENT_OFFICIAL_TEXT_CROSSCHECKED
    finding: >-
      Данные абонента-гражданина включаются в общедоступную базу только с письменного согласия, а по требованию
      абонента исключаются из нее.
  - locator: "статья 63"
    concept: COMMUNICATIONS_SECRECY
    actor: "оператор связи"
    state: CURRENT_OFFICIAL_TEXT_CROSSCHECKED
    finding: >-
      Гарантируется тайна переписки, телефонных переговоров, почтовых, телеграфных и иных сообщений; ограничение
      допускается только в случаях, установленных федеральными законами; операторы обязаны обеспечивать тайну связи.
  - locator: "статья 64, часть 1"
    concept: COMMUNICATIONS_METADATA_AND_CONTENT_RETENTION
    actor: "оператор связи"
    state: CURRENT_OFFICIAL_TEXT_CROSSCHECKED
    current_rule_summary:
      communications_facts_retention: "3 года с момента окончания приема/передачи/доставки/обработки"
      message_content_retention: "до 6 месяцев в объеме и порядке, устанавливаемых Правительством РФ"
    semantic_guard: "Специальный отраслевой retention не смешивать с общими правилами хранения ПДн и с тайной связи."
  - locator: "статья 64, часть 2"
    concept: AUTHORIZED_STATE_ACCESS_AND_NETWORK_REQUIREMENTS
    state: CURRENT_OFFICIAL_TEXT_CROSSCHECKED
    semantic_guard: >-
      Условия доступа уполномоченных органов и технические обязанности оператора являются специальным законным
      контекстом; они не превращаются в универсальное разрешение на раскрытие информации третьим лицам.

pdn_relation:
  target: "152-ФЗ"
  state: OVERLAP_CANDIDATE_EXPLICIT_PERSONAL_DATA_CONTEXT_APPLICABILITY_REVIEW_REQUIRED
  evidence_dimensions:
    - "статья 53 прямо использует термин персональные данные в специальном контексте пользователей услугами связи"
    - "идентификаторы и сведения об абоненте-гражданине могут пересекаться с персональными данными"
    - "статья 53 одновременно охраняет более широкий отраслевой объект — сведения об абонентах и услугах связи"
  guard: >-
    OVERLAP != APPLICABILITY. Для конкретного PDN-ребра требуется установить субъект данных, операцию обработки,
    цель, правовое основание, роль оператора/абонента, получателя и конкретное поле данных.

