protected_regime:
  name: citizen_appeal_confidentiality
  anchors:
    - locator: "article_6_part_2"
      type: confidentiality_non_disclosure
      rule: "При рассмотрении обращения не допускается разглашение содержащихся в нем сведений и сведений о частной жизни гражданина без его согласия; направление обращения компетентному органу или должностному лицу само по себе разглашением не считается."
    - locator: "article_6_part_3"
      type: special_secure_electronic_channel
      rule: "Для обращений в органы, осуществляющие ОРД или обеспечение безопасности РФ, ведомственными НПА может устанавливаться особый порядок электронного направления обращений, ответов и уведомлений."
    - locator: "article_7_parts_1_3"
      type: person_level_dataset
      rule: "Обращение предусматривает ФИО и адрес для ответа; электронное обращение — ФИО и e-mail либо уникальный идентификатор личного кабинета в ЕПГУ/иной идентифицирующей информационной системе; могут прилагаться документы и материалы."
    - locator: "article_8_parts_3_4"
      type: competent_authority_routing
      rule: "Обращения и их копии могут направляться по компетенции другим органам/должностным лицам с уведомлением гражданина; это отдельный data-flow, который не отменяет специальные режимы защищаемой информации."
    - locator: "article_10_part_2"
      type: protected_secret_boundary
      rule: "Межведомственное предоставление материалов для рассмотрения обращения исключает документы и материалы с государственной или иной охраняемой федеральным законом тайной, если для них установлен особый порядок предоставления."
    - locator: "article_10_part_4"
      type: response_channel_and_publication_guard
      rule: "Ответ направляется на предусмотренный канал; размещение ответа по обращениям неопределенного круга лиц на официальном сайте допускается с соблюдением части 2 статьи 6."
    - locator: "article_11_part_6"
      type: protected_secret_non_disclosure_boundary
      rule: "Если ответ по существу невозможен без разглашения государственной или иной охраняемой федеральным законом тайны, заявителю сообщается о невозможности дать такой ответ."
    - locator: "article_13_parts_2_3"
      type: personal_reception_data
      rule: "При личном приеме предъявляется документ, удостоверяющий личность; содержание устного обращения заносится в карточку личного приема."

pdn_relationship:
  status: CANDIDATE_APPLICABILITY_REVIEW_REQUIRED
  relationship_type: DIRECT_PERSON_LEVEL_DATASET_AND_CONFIDENTIALITY_OVERLAP
  proof_guards:
    - "CITIZEN_APPEAL_CONFIDENTIALITY != PERSONAL_DATA_APPLICABILITY"
    - "Согласие на разглашение по статье 6 части 2 не следует автоматически считать согласием на обработку персональных данных по 152-ФЗ."
    - "Квалификация направления обращения компетентному органу как 'не разглашение' по 59-ФЗ не отменяет самостоятельную проверку правового основания обработки/передачи ПДн."
    - "Обращение может содержать врачебную, банковскую, страховую, коммерческую, налоговую или иную охраняемую законом тайну; 59-ФЗ не заменяет специальные режимы."
    - "No applicability without record/operation/actor/purpose/legal-basis proof."
  overlap_candidates:
    - target: "RU-152-FZ"
      relation: DIRECT_PERSON_LEVEL_DATASET_AND_CONFIDENTIALITY_OVERLAP
    - target: "RU_PROTECTED_INFORMATION_SECTORAL_REGIMES"
      relation: PARALLEL_SPECIAL_SECRET_REGIMES_PRESERVED_BY_ARTICLES_5_10_11

