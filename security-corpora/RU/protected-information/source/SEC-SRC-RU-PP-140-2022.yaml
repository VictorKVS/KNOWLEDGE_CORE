protected_regime:
  name: egisz_health_data_and_information_security
  anchors:
    - locator: "regulation_point_30"
      type: information_security_subsystem
      rule: "Подсистема защиты информации предназначена для защиты информации ЕГИСЗ от утечки по техническим каналам, несанкционированного доступа и иных неправомерных воздействий; реализует идентификацию и аутентификацию, управление доступом, регистрацию событий безопасности, антивирусную защиту, обнаружение/предотвращение вторжений, контроль защищенности, защиту технических средств, виртуализации и криптографическую защиту."
    - locator: "regulation_point_30_cia"
      type: confidentiality_integrity_availability
      rule: "Подсистема защиты информации обеспечивает конфиденциальность, целостность и доступность информации ЕГИСЗ."
    - locator: "regulation_point_63"
      type: direct_pdn_and_information_security_reference
      rule: "Информация ЕГИСЗ подлежит защите по законодательству об информации, информационных технологиях и защите информации, а также по законодательству Российской Федерации о персональных данных."
    - locator: "regulation_point_64"
      type: operator_security_obligation
      rule: "Оператор ЕГИСЗ обеспечивает защиту организационными и техническими мерами и контролем эксплуатации системы."
    - locator: "regulation_point_65"
      type: security_lifecycle_controls
      rule: "Для защиты информации предусматриваются требования к защите, функционирование/модернизация подсистемы защиты, применение сертифицированных ФСБ и/или ФСТЭК средств защиты, аттестация системы по требованиям защиты информации и защита при передаче по сетям."
    - locator: "appendix_1_section_I_point_1"
      type: medical_worker_person_level_dataset
      rule: "Федеральный регистр медицинских и фармацевтических работников содержит ФИО, пол, дату и место рождения, гражданство, данные удостоверяющего личность документа, место жительства/регистрации и СНИЛС и иные предусмотренные сведения."
    - locator: "appendix_1_federal_electronic_medical_documents_registry"
      type: patient_medical_document_data_flow
      rule: "В ЕГИСЗ размещаются сведения о медицинской документации пациента и медицинской организации; это отдельный медицинский data-flow, требующий сценарной проверки врачебной тайны и ПДн."
    - locator: "regulation_point_56"
      type: intersystem_exchange_graph
      rule: "ЕГИСЗ взаимодействует с иными государственными и отраслевыми информационными системами; редакция № 2164/2025 добавила взаимодействие с единым федеральным регистром населения."

