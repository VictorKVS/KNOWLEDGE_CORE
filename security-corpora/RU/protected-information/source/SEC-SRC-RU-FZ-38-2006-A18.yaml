protected_information:
  sector: advertising_marketing
  regimes:
    - advertising_material_retention
    - telecom_advertising_consent_and_suppression
    - internet_advertising_traceability_and_data_reporting
  protected_locators:
    - locator: "статья 12"
      concept: ADVERTISING_MATERIAL_AND_CONTRACT_RETENTION
      findings:
        - "Рекламные материалы или их копии, включая изменения, а также договоры на производство, размещение и распространение рекламы хранятся один год."
        - "Триггер срока: последнее распространение рекламы либо окончание срока действия соответствующего договора; для документов с иным сроком действует специальное законодательство."
      pdn_guard: "Это срок хранения рекламных материалов/договоров по 38-ФЗ, а не общий срок хранения или удаления персональных данных по 152-ФЗ."
    - locator: "статья 18 часть 1"
      concept: PRIOR_ADVERTISING_CONSENT_AND_PROOF_BURDEN
      findings:
        - "Распространение рекламы по сетям электросвязи допускается только при предварительном согласии абонента или адресата."
        - "Бремя доказать получение согласия лежит на рекламораспространителе."
        - "По требованию лица реклама в его адрес прекращается немедленно."
    - locator: "статья 18 часть 2"
      concept: AUTOMATED_DIALING_AND_AUTOMATED_MAILING_PROHIBITION
      findings:
        - "Не допускается реклама с автоматическим выбором/набором абонентского номера без участия человека, включая автоматическое дозванивание и автоматическую рассылку."
    - locator: "статья 18 части 3-4"
      concept: TELECOM_ADVERTISING_SERVICE_RULES
      findings:
        - "При справочном телефонном обслуживании реклама предоставляется после запрашиваемой справки."
        - "При повременной оплате телефонных соединений время распространения рекламы не включается в стоимость услуги связи."
    - locator: "статья 18 часть 5"
      concept: REPEALED_POSTAL_ADVERTISING_RULE
      findings:
        - "Часть 5 утратила силу по 179-ФЗ от 27.10.2008; не использовать как действующее требование."
    - locator: "статья 18.1 часть 1"
      concept: INTERNET_AD_REGULATORY_ACCOUNTING_STORAGE_PROCESSING
      findings:
        - "Уполномоченный федеральный орган осуществляет учет, хранение и обработку информации о распространенной в Интернете рекламе и социальной рекламе, включая сведения о рекламодателях, рекламораспространителях и операторах рекламных систем."
        - "Состав подлежащей учету, хранению и обработке информации определяется Правительством РФ."
      pdn_guard: "Сведения о рекламодателе/участнике рекламного рынка не являются автоматически ПДн; идентифицируемость физического лица и фактические поля данных проверяются отдельно."
    - locator: "статья 18.1 части 3, 5 и 8"
      concept: INTERNET_AD_REPORTING_THROUGH_AD_DATA_OPERATOR
      findings:
        - "Установленные законом участники обязаны предоставлять или обеспечивать предоставление информации об интернет-рекламе уполномоченному органу."
        - "Предоставление осуществляется через операторов рекламных данных; оператор рекламных данных передает полученную информацию уполномоченному органу."
    - locator: "статья 18.1 часть 11"
      concept: INTERNET_AD_DATA_QUALITY_RESPONSIBILITY
      findings:
        - "Участники и операторы рекламных данных отвечают за полноту, достоверность, актуальность и своевременность предоставления информации."
    - locator: "статья 18.1 часть 13"
      concept: INTERNET_AD_REGULATORY_RETENTION_MINIMUM
      findings:
        - "Информация об интернет-рекламе, предоставленная уполномоченному органу, хранится им не менее трех лет со дня получения."
      pdn_guard: "Трехлетний срок относится к установленному законом массиву сведений об интернет-рекламе у уполномоченного органа; не переносить его автоматически на все ПДн рекламодателя или рекламораспространителя."
    - locator: "статья 18.1 части 14-15"
      concept: INTERNET_AD_REGULATORY_DATA_ACCESS
      findings:
        - "Участники получают доступ к непосредственно касающейся их прав и обязанностей информации в установленном составе и порядке."
        - "Закон предусматривает доступ антимонопольного, налогового и иных определенных Правительством органов/лиц к имеющейся у уполномоченного органа информации."
    - locator: "статья 18.1 часть 17"
      concept: INTERNET_AD_IDENTIFIER_TRACEABILITY
      findings:
        - "Распространение интернет-рекламы допускается при присвоении оператором рекламных данных уникального идентификатора, обеспечивающего прослеживаемость и учет."
  applicability_status: CANDIDATE_APPLICABILITY_REVIEW_REQUIRED
  applicability_guard: >-
    38-ФЗ задает самостоятельные рекламные обязанности. Согласие на рекламу не равно согласию на обработку ПДн; сроки статьи 12 и части 13 статьи 18.1 не являются универсальными PDN-retention сроками. Пересечение с 152-ФЗ определяется отдельно по идентифицируемому субъекту, конкретным полям, операции, цели, роли и правовому основанию.

