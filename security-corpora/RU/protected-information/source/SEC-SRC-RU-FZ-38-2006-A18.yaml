agent_rule: >-
  Treat Article 18 as a telecom-advertising regime. Separate advertising consent from PDN-processing consent and from telecom mailing consent under 126-ФЗ. A stop request is a statutory advertising-suppression duty, not proof of a general PDN erasure rule. Do not infer applicability from a phone/email field alone. Do not use repealed Article 18(5). Current executable semantics remain blocked until exact authoritative capture/version proof is complete.