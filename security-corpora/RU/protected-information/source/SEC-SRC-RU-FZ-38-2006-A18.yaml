agent_rule: >-
  Treat Articles 12, 18 and 18.1 as separate advertising obligations inside one deduplicated 38-ФЗ source. Article 12 one-year retention and Article 18.1(13) three-year regulatory retention are not general PDN retention limits. Advertising consent is not PDN-processing consent. Internet-ad reporting/identifier records may overlap PDN only after identifiable-natural-person data and the concrete processing scenario are proven. Do not execute repealed Article 18(5). Current executable semantics remain blocked until exact authoritative capture/version proof is complete.