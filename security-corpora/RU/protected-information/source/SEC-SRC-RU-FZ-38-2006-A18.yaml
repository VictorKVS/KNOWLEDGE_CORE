protected_information:
  sector: advertising_marketing
  regime: telecom_advertising_consent_and_suppression
  protected_locators:
    - locator: "статья 18 часть 1"
      concept: PRIOR_ADVERTISING_CONSENT_AND_PROOF_BURDEN
      findings:
        - "Распространение рекламы по сетям электросвязи допускается только при предварительном согласии абонента или адресата на получение рекламы."
        - "Если рекламораспространитель не докажет получение такого согласия, реклама признается распространенной без предварительного согласия."
        - "Рекламораспространитель обязан немедленно прекратить рекламу в адрес лица, потребовавшего прекращения."
    - locator: "статья 18 часть 2"
      concept: AUTOMATED_DIALING_AND_AUTOMATED_MAILING_PROHIBITION
      findings:
        - "Не допускается использование сетей электросвязи для рекламы с применением средств выбора и (или) набора абонентского номера без участия человека, включая автоматическое дозванивание и автоматическую рассылку."
    - locator: "статья 18 часть 3"
      concept: DIRECTORY_SERVICE_ADVERTISING_SEQUENCE
      findings:
        - "При справочном телефонном обслуживании реклама может предоставляться только после сообщения запрашиваемой справки."
    - locator: "статья 18 часть 4"
      concept: TIME_BASED_TELEPHONY_ADVERTISING_CHARGE_EXCLUSION
      findings:
        - "При повременной оплате телефонных соединений время распространения рекламы не учитывается в стоимости услуги связи."
    - locator: "статья 18 часть 5"
      concept: REPEALED_POSTAL_ADVERTISING_RULE
      findings:
        - "Часть 5 утратила силу по 179-ФЗ от 27.10.2008; не использовать как действующее требование."
  applicability_status: CANDIDATE_APPLICABILITY_REVIEW_REQUIRED
  applicability_guard: >-
    Согласие на получение рекламы по статье 18 38-ФЗ не тождественно согласию на обработку персональных данных по 152-ФЗ. Наличие телефона, адреса электронной почты или иного контактного идентификатора может создавать пересечение с ПДн, но применимость конкретных требований 152-ФЗ устанавливается отдельно по субъекту, идентифицируемости, полям данных, операции, цели, роли и правовому основанию.

