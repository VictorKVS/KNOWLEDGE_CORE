normative_anchors:
  - locator: "статья 2"
    finding: "Одним из принципов деятельности системы профилактики является индивидуальный подход к несовершеннолетним с соблюдением конфиденциальности полученной информации."
    guard: "PREVENTION_CONFIDENTIALITY_NOT_NEW_SECRET_CATEGORY"
  - locator: "статья 7"
    finding: "Закон определяет сроки осуществления индивидуальной профилактической работы через правовые и фактические события, включая достижение совершеннолетия и устранение оснований для работы."
    guard: "PREVENTIVE_WORK_DURATION_NOT_PDN_OR_DOCUMENT_RETENTION_PERIOD"
  - locator: "статья 9 пункты 2-3"
    finding: "Закон устанавливает обязательные информационные сообщения между органами и учреждениями системы профилактики; соответствующая информация должна храниться и использоваться в порядке, обеспечивающем ее конфиденциальность."
    guard: "MANDATORY_INTERAGENCY_FLOW_NOT_UNLIMITED_SECONDARY_USE"
  - locator: "статья 14"
    finding: "Органы управления образованием и образовательные организации являются участниками системы профилактики и выполняют установленные законом функции в отношении несовершеннолетних."
    guard: "EDUCATION_PARTICIPATION_NOT_GENERAL_EDUCATION_PDN_RULE"
  - locator: "статья 25.2 часть 1"
    finding: "Специальная система профилактики является федеральной государственной информационной системой."
    guard: "SPECIAL_FGIS_SCOPE_ONLY"
  - locator: "статья 25.2 часть 2 пункты 1-2"
    finding: "Создание и функционирование системы основаны на конфиденциальности персональных данных, обеспечении их защиты и соблюдении законодательства об охране личной, семейной, коммерческой и иной охраняемой законом тайны."
    guard: "REFERENCE_TO_MULTIPLE_SECRET_REGIMES_NOT_CLASSIFICATION_OF_EVERY_RECORD"
  - locator: "статья 25.2 части 3-4"
    finding: "Система обрабатывает сведения о несовершеннолетних и законных представителях, включая идентификационные данные, документы, адрес, СНИЛС, а также сведения о социально опасных обстоятельствах и профилактических мерах."
    guard: "HIGH_SENSITIVITY_CHILD_RECORD_NOT_SPECIAL_CATEGORY_OR_MEDICAL_SECRET_AUTOMATICALLY"
  - locator: "статья 25.3"
    finding: "Закон определяет участников информационного взаимодействия, оператора, поставщиков и пользователей системы; конкретный порядок доступа и обмена устанавливается положением о системе."
    guard: "PARTICIPANT_STATUS_NOT_UNLIMITED_ACCESS_AUTHORITY"

