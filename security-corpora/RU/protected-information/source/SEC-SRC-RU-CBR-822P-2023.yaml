protected_information:
  scope_actor: "оператор автоматизированной информационной системы страхования"
  protected_locators:
    - locator: "пункт 1"
      concept: PROTECTED_INFORMATION_LIFECYCLE_AND_CONDITIONAL_PDN_SECURITY
      findings:
        - "Защита охватывает получение, подготовку, обработку, хранение и предоставление защищаемой информации АИС страхования."
        - "Если защищаемая информация содержит персональные данные, применяются меры безопасности по статье 19 152-ФЗ и приказу ФСТЭК России № 21."
      guard: "PROTECTED_INFORMATION != PERSONAL_DATA_BY_DEFINITION; условие о ПДн должно быть доказано для конкретного набора."
    - locator: "пункты 2-4"
      concept: ORGANIZATIONAL_TECHNICAL_AND_CRYPTO_PROTECTION
      findings:
        - "Установлены процессы управления доступом, сетевой защиты, контроля целостности, мониторинга, антивирусной защиты, предотвращения утечек, реагирования на инциденты, защиты виртуализации и удаленного доступа."
        - "При криптографической защите ПДн применяются ПП РФ № 1119 и приказ ФСБ России № 378."
      guard: "CRYPTO_REFERENCE != REQUIREMENT_TO_USE_CRYPTO_IN_EVERY_SCENARIO; применять по условиям конкретной обработки и модели угроз."
    - locator: "пункты 3, 10.1"
      concept: BIOMETRIC_AND_EBS_SECURITY_CONTEXT
      findings:
        - "Положение содержит специальный контекст биометрических персональных данных и взаимодействия с единой биометрической системой по 572-ФЗ."
      guard: "BIOMETRIC_CONTEXT_IS_SCENARIO_SPECIFIC; наличие страхового процесса не означает автоматическую обработку биометрии."
    - locator: "пункты 11-13"
      concept: SECURITY_EVENT_LOGGING_INCIDENT_RESPONSE_AND_CBR_NOTIFICATION
      findings:
        - "Предусмотрена регистрация событий и сведений, необходимых для расследования инцидентов защиты информации."
        - "Оператор информирует Банк России о выявленных инцидентах, причинах и мерах реагирования."
      guard: "SECTOR_INCIDENT_FLOW != AUTOMATIC_SUBSTITUTE_FOR_OTHER_STATUTORY_INCIDENT_NOTIFICATION_DUTIES."
    - locator: "пункт 14"
      concept: SECTOR_RETENTION
      findings:
        - "Защищаемая информация хранится в течение срока, установленного подпунктом 1 пункта 7 статьи 33.10 Закона РФ № 4015-I."
        - "Информация об инцидентах и определенные audit-данные хранятся не менее пяти лет."
      guard: "FIVE_YEAR_INCIDENT_AUDIT_RETENTION != GENERAL_PERSONAL_DATA_RETENTION_PERIOD."
    - locator: "пункт 15"
      concept: KII_CONDITIONAL_OVERLAY
      findings:
        - "Требования по КИИ применяются к тем объектам инфраструктуры оператора АИС страхования, которые фактически являются объектами КИИ."
      guard: "INSURANCE_AIS != KII_BY_DEFINITION; статус конкретного объекта должен быть доказан отдельно."

