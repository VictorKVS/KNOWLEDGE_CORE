protected_locators:
  - locator: "статья 5, часть 2"
    concept: NOTARIAL_NON_DISCLOSURE
    state: CURRENT_CONSOLIDATED_TEXT_CROSSCHECKED_PRIMARY_AUTHORITY_TEXT_SUPPORTS_CORE_RULE
    finding: >-
      Нотариусу, временно замещающему его лицу и лицам, работающим в нотариальной конторе, запрещено разглашать сведения
      и оглашать документы, ставшие известными в связи с совершением нотариальных действий, включая период после прекращения полномочий/увольнения,
      кроме предусмотренных Основами случаев.
  - locator: "статья 5, часть 3"
    concept: NOTARIAL_ACTION_INFORMATION_RECIPIENT_LIMIT
    state: CURRENT_CONSOLIDATED_TEXT_CROSSCHECKED
    finding: >-
      Сведения и документы о совершенных нотариальных действиях выдаются заявителям, если иное не установлено Основами.
  - locator: "статья 5, часть 4"
    concept: NOTARIAL_LAWFUL_DISCLOSURE_CHANNELS
    state: CURRENT_LOCATOR_CROSSCHECKED_LATEST_PRIMARY_AMENDMENT_522FZ_VERIFIED
    finding: >-
      Закон устанавливает специальные запросные/межведомственные каналы выдачи сведений; актуальная часть 4 также содержит AML/терроризм/экстремистская деятельность контексты.
    guard: "Каждый получатель, основание запроса и объем сведений требуют отдельной проверки."
  - locator: "статья 5, часть 5"
    concept: NOTARIAL_PDN_CONSENT_SPECIAL_RULE
    state: CURRENT_CONSOLIDATED_TEXT_CROSSCHECKED_EXPLICIT_PDN_REFERENCE
    finding: >-
      При совершении нотариальных действий согласие субъекта персональных данных на обработку его персональных данных для совершения нотариальных действий не требуется.
    semantic_guard: "Это специальное основание в заявленном нотариальном контексте; оно не отменяет остальные требования законодательства о персональных данных."
  - locator: "статья 5.1"
    concept: MACHINE_READABLE_NOTARIAL_DOCUMENT_CHECK_NOT_DISCLOSURE
    state: RELATED_PROTECTED_LOCATOR_CURRENT_TEXT_CROSSCHECKED
    finding: >-
      Проверка информации о нотариальном документе через ЕИС нотариата с использованием машиночитаемой маркировки прямо не признается разглашением сведений о нотариальном действии.

pdn_relation:
  target: "152-ФЗ"
  state: EXPLICIT_STATUTORY_PDN_CONTEXT_APPLICABILITY_REVIEW_REQUIRED
  evidence_dimensions:
    - "часть 5 статьи 5 прямо регулирует согласие субъекта персональных данных при обработке для совершения нотариального действия"
    - "нотариальные действия и ЕИС нотариата могут содержать идентифицирующие сведения физических лиц"
    - "специальный режим нотариальной тайны и общий режим ПДн пересекаются, но не совпадают"
  guard: >-
    Для конкретного требования установить субъект данных, операцию, цель, роль нотариуса/палаты/получателя,
    специальное основание нотариального действия, состав сведений и допустимый канал передачи. OVERLAP != APPLICABILITY.

