proof_floor:
  - "Нотариальная тайна является самостоятельным специальным режимом; наличие персональных данных в нотариальном деле не делает этот режим эквивалентным 152-ФЗ."
  - "Часть пятая статьи 5 содержит специальное законное правило о согласии субъекта ПДн только для обработки, необходимой для совершения нотариального действия; его нельзя расширять на любые операции нотариуса или третьих лиц."
  - "Перечень законных получателей сведений о нотариальных действиях в части четвертой статьи 5 является контекстным каналом раскрытия, а не универсальным разрешением передачи."
  - "Официальная страница Минюста является первичным authority-hosted источником, но размещенная там консолидация заканчивает список поправок 2020 годом; она не считается доказательством полной актуальной редакции на 2026-08-23."
  - "MIME, byte length, SHA-256 и retrieved_at не фиксируются без byte-exact текущего официального артефакта."

