status: NEW_PRIMARY_AUTHORITY_SOURCE_IDENTIFIED_CURRENT_ARTICLE_CROSSCHECKED_LATEST_LOCATOR_AMENDMENT_PRIMARY_VERIFIED_EXACT_CURRENT_ARTIFACT_PENDING_VERSION_CHAIN_PARTIAL
