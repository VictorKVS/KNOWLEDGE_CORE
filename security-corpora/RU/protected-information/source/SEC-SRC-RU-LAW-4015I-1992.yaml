protected_information:
  scope_actor: "оператор АИС страхования, страховщики и иные пользователи в пределах прямо установленных законом ролей"
  protected_locators:
    - locator: "статья 33.10 пункт 2"
      concept: STATE_SECRET_EXCLUSION_FROM_AIS
      findings:
        - "Сведения, составляющие государственную тайну, не подлежат представлению в АИС страхования."
      guard: "EXCLUSION_FROM_AIS != DECLASSIFICATION_OR_CHANGE_OF_STATE_SECRET_REGIME"
    - locator: "статья 33.10 пункты 5(3), 6"
      concept: CONFIDENTIALITY_AND_DIRECT_PDN_PROCESSING_CONTEXT
      findings:
        - "Оператор обеспечивает защиту и конфиденциальность информации, обрабатываемой в АИС страхования."
        - "Оператор вправе обрабатывать информацию, включая персональные данные, в соответствии со страховым законодательством, законодательством об информации и законодательством о персональных данных."
      guard: "INFORMATION_IN_AIS != PERSONAL_DATA_BY_DEFINITION; классифицировать конкретные поля и операции отдельно."
    - locator: "статья 33.10 пункт 7 подпункт 1"
      concept: SECTOR_AIS_RETENTION
      findings:
        - "Представленная в АИС страхования информация хранится в электронной форме 10 лет со дня прекращения действия договора страхования, если более длительный срок не установлен страховым законодательством."
      guard: "TEN_YEAR_AIS_INSURANCE_RETENTION != GENERAL_PERSONAL_DATA_RETENTION_PERIOD_OUTSIDE_THIS_STATUTORY_AIS_SCOPE"
    - locator: "статья 33.10 пункт 7 подпункты 3-6"
      concept: LOCAL_INFRASTRUCTURE_RESILIENCE_INFORMATION_AND_PDN_SECURITY
      findings:
        - "Основной и резервный комплексы программно-аппаратных средств должны находиться на территории Российской Федерации."
        - "Оператор обеспечивает сохранность информации, резервное копирование и соблюдает требования Банка России к защите информации."
        - "Оператор обеспечивает защиту ПДн от угроз безопасности при обработке в АИС страхования."
      guard: "AIS_OPERATOR_REQUIREMENTS != AUTOMATIC_REQUIREMENTS_FOR_EVERY_INSURER_INFORMATION_SYSTEM"
    - locator: "статья 33.10 пункт 7 подпункт 11"
      concept: ACCESS_REQUEST_AUDIT
      findings:
        - "Оператор ведет учет запросов о предоставлении содержащейся в АИС страхования информации."
    - locator: "статья 33.10 пункт 9"
      concept: BIOMETRIC_IDENTIFICATION_OPTION
      findings:
        - "Для идентификации физического лица при предоставлении ему информации допускается использование ЕСИА либо ЕСИА и государственной системы идентификации и аутентификации с использованием биометрических ПДн."
      guard: "BIOMETRIC_OPTION != PROOF_OF_BIOMETRIC_PROCESSING_IN_EVERY_INSURANCE_SCENARIO"
    - locator: "статья 33.11 пункты 1, 4"
      concept: INSURANCE_AIS_DATASET_AND_QUALITY
      findings:
        - "В АИС содержится информация о страхователе, застрахованном лице, выгодоприобретателе, лице, ответственность которого застрахована, а также сведения о договоре, риске, страховом случае, выплате и другие предусмотренные законом сведения."
        - "Страховщик обязан обеспечивать достоверность, полноту и актуальность представляемой информации."
      guard: "PERSON_LEVEL_INSURANCE_RECORDS_REQUIRE_FIELD_LEVEL_PDN_AND_SECRET_CLASSIFICATION"
    - locator: "статья 33.11 пункт 6"
      concept: STATUTORY_TRANSFER_SECRET_BOUNDARY
      findings:
        - "Представление предусмотренной законом информации в АИС страхования не является нарушением тайны страхования, служебной, налоговой или коммерческой тайны."
      guard: "STATUTORY_TRANSFER_CARVEOUT != REMOVAL_OF_THE_UNDERLYING_SECRET_REGIME_FOR_OTHER_OPERATIONS"
    - locator: "статья 33.12 пункт 3"
      concept: NARROW_NO_SEPARATE_PDN_CONSENT_RULE
      findings:
        - "Отдельное согласие субъекта ПДн не требуется для получения и использования страховщиком информации об осуществлении страхования только в прямо указанных договорных сценариях."
      guard: "NO_SEPARATE_CONSENT_IN_ARTICLE_33_12_3 != BLANKET_NO_CONSENT_RULE_FOR_INSURANCE_PDN_PROCESSING"
    - locator: "статья 33.12 пункты 4-6"
      concept: SUBJECT_ACCESS_ACCESS_TRACE_AND_NON_PDN_ANALYTICS
      findings:
        - "Лицо вправе получать относящуюся к нему информацию из АИС и сведения о лицах, получавших информацию о нем, с установленными законом исключениями."
        - "Определенные сведения о страховой сумме и премии предоставляются страховщикам только как аналитическая информация, не содержащая ПДн физических лиц."

