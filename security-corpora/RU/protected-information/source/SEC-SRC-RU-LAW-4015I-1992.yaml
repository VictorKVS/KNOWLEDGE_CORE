applicability:
  state: CANDIDATE_APPLICABILITY_REVIEW_REQUIRED
  guards:
    - "Глава IV.2 регулирует конкретную АИС страхования и роли ее участников; не переносить требования автоматически на все страховые ИС."
    - "Десятилетний срок относится к информации, представленной в АИС страхования, а не ко всем ПДн страховщика."
    - "Пункт 3 статьи 33.12 содержит узкое специальное правило об отсутствии отдельного согласия только для прямо описанного получения/использования информации страховщиком."
    - "Статья 33.11(6) разрешает предусмотренное законом представление информации в АИС без нарушения перечисленных тайн, но не отменяет эти режимы для иных операций."
    - "Биометрический контур применяется только при фактическом использовании предусмотренного законом механизма идентификации."
  executable_rule_status: NOT_PROMOTED

