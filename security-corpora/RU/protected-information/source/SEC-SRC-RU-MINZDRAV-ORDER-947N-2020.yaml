protected_regime:
  name: electronic_medical_documentation
  anchors:
    - locator: "order_scope_and_effect"
      type: electronic_medical_document_lifecycle
      rule: "Порядок регулирует формирование, подписание, хранение электронных медицинских документов, обмен ими, передачу/регистрацию в ЕГИСЗ и предоставление доступа к электронной медицинской документации."
      evidence_status: OFFICIAL_MINZDRAV_EXPLANATION_PLUS_PRIMARY_PUBLICATION_METADATA
    - locator: "procedure_point_9"
      type: qualified_electronic_signature
      rule: "Электронный медицинский документ подписывается усиленной квалифицированной электронной подписью медицинского работника, сформировавшего документ, кроме предусмотренных Порядком исключений."
      evidence_status: PRIMARY_TEXT_CROSSCHECK_EXACT_BINARY_PENDING
    - locator: "procedure_point_20"
      type: sector_document_retention
      rule: "Электронные медицинские документы хранятся в используемой для их формирования информационной системе не менее срока хранения соответствующих медицинских документов на бумажном носителе."
      evidence_status: PRIMARY_TEXT_CROSSCHECK_EXACT_BINARY_PENDING
    - locator: "procedure_point_21"
      type: version_history_retention
      rule: "При исправлении электронного медицинского документа должны сохраняться все его версии и подписи в составе метаданных на протяжении всего срока хранения документа."
      evidence_status: PRIMARY_TEXT_CROSSCHECK_EXACT_BINARY_PENDING
    - locator: "patient_paper_copy_choice"
      type: patient_access_and_format_choice
      rule: "Официальное разъяснение Минздрава подтверждает право пациента/законного представителя потребовать дублирование медицинской документации на бумажном носителе."
      evidence_status: OFFICIAL_MINZDRAV_EXPLANATION

