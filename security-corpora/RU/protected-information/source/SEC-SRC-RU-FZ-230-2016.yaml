protected_information:
  sector: debt_collection
  regime: debtor_personal_data_and_confidentiality
  primary_anchor: "статья 6 — конфиденциальность сведений о должнике и ограничения передачи персональных данных"
  findings:
    - "часть 3 ограничивает раскрытие третьим лицам сведений о должнике, просроченной задолженности/ее взыскании и иных персональных данных при отсутствии предусмотренного законом основания"
    - "часть 7 предусматривает отзыв согласия должником и запрет дальнейшей передачи после получения уведомления, если иное не предусмотрено федеральным законом"
    - "часть 8 запрещает раскрытие таких сведений и персональных данных неограниченному кругу лиц, включая размещение в сети Интернет и по месту работы или учебы"
    - "статья 19.3 требует от уполномоченного органа сохранять коммерческую, служебную и иную охраняемую законом тайну"
