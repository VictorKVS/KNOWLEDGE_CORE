protected_information:
  scope_actor: "государственные органы, органы местного самоуправления, организации, архивы, владельцы и пользователи архивных документов"
  protected_locators:
    - locator: "статья 25 часть 2"
      concept: ARCHIVAL_PROTECTED_SECRETS_ACCESS_RESTRICTION
      finding: "Доступ ограничивается к архивным документам, содержащим государственную и иную охраняемую законодательством Российской Федерации тайну; снятие ограничения производится по соответствующему законодательству."
      guard: "ARCHIVAL_DOCUMENT_CONTAINING_PROTECTED_SECRET != ONE_UNIVERSAL_SECRET_REGIME"
    - locator: "статья 25 часть 3"
      concept: PERSONAL_FAMILY_PRIVATE_LIFE_ARCHIVAL_ACCESS_RESTRICTION
      finding: "Для архивных документов со сведениями о личной и семейной тайне гражданина, его частной жизни или сведениями, создающими угрозу его безопасности, ограничение доступа установлено на 75 лет со дня создания документа; возможно досрочное снятие с письменного разрешения гражданина, а после его смерти — наследников."
      guard: "SEVENTY_FIVE_YEAR_ACCESS_RESTRICTION != GENERAL_PDN_RETENTION_PERIOD"
    - locator: "статья 22.1 части 1-2"
      concept: PERSONNEL_DOCUMENT_RETENTION
      finding: "Документы по личному составу, законченные делопроизводством до 01.01.2003, хранятся 75 лет; после 01.01.2003 — 50 лет, если специальным перечнем не установлен иной срок."
      guard: "PERSONNEL_DOCUMENT_RETENTION != UNIVERSAL_RETENTION_FOR_ALL_EMPLOYEE_PDN"
    - locator: "статья 17 часть 1"
      concept: ARCHIVAL_PRESERVATION_DUTY
      finding: "Органы, организации и ИП обеспечивают сохранность архивных документов в течение сроков, установленных федеральными законами, иными НПА и нормативными перечнями."
      guard: "ARCHIVAL_RETENTION_REQUIRES_DOCUMENT_CLASS_AND_APPLICABLE_LIST; DO_NOT_INFER_PERIOD_FROM_DATA_CATEGORY_ALONE"

pdn_boundary:
  relationship_to_152fz: EXPLICIT_SCOPE_EXCLUSION_FOR_ARCHIVAL_RELATIONS
  152fz_locator: "статья 1 часть 2 пункт 2"
  finding: "152-ФЗ прямо исключает отношения по организации хранения, комплектования, учета и использования содержащих ПДн документов Архивного фонда РФ и других архивных документов, когда эти отношения осуществляются в соответствии с законодательством об архивном деле."
  guard: "ARCHIVE_SCOPE_EXCLUSION_IS_ACTIVITY_AND_LEGAL_REGIME_BOUND; IT_DOES_NOT_RECLASSIFY_NON_ARCHIVAL_PROCESSING_OR_EVERY_DATABASE_AS_ARCHIVAL"
  applicability_promoted: false

