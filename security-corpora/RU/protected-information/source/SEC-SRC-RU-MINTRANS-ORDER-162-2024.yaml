protected_information:
  sector: transport
  regime: egis_otb_acbpd_passenger_crew_personal_data
  legal_basis: "16-ФЗ статья 11 часть 6; Приказ Минтранса № 162"
  protected_locators:
    - locator: "Порядок, пункты 1-4"
      concept: ACBPD_SCOPE_AND_DATA_SUPPLIERS
      finding: "АЦБПДП входят в ЕГИС ОТБ; оператор формирует/ведет базы и предоставляет содержащиеся персональные данные. Источники включают перевозчиков, субъектов транспортной инфраструктуры, органы власти, иностранных участников и уполномоченных билетных агентов."
    - locator: "Порядок, пункты 7-11"
      concept: BASE_PASSENGER_AND_CREW_FIELDS
      finding: "Базовый набор включает ФИО, дату рождения, вид/номер удостоверяющего документа, пункт отправления/назначения и вид маршрута, дату поездки, пол, гражданство; для экипажа дополнительно должность/категорию."
    - locator: "Порядок, пункт 13"
      concept: SEVEN_YEAR_PERSONAL_DATA_RETENTION
      finding: "Персональные данные хранятся оператором ЕГИС ОТБ в АЦБПДП 7 лет со дня получения оператором."
    - locator: "Порядок, пункт 14 и сноска 8"
      concept: AUTHORIZED_INFORMATION_CONSUMERS
      finding: "МВД, ФСБ и Ространснадзор указаны среди потребителей информации; использование полученных данных привязано к законодательству РФ, включая ссылку на статью 7 152-ФЗ."
    - locator: "Порядок, пункт 15"
      concept: DIRECT_152FZ_INTERNATIONAL_TRANSFER_CONTEXT
      finding: "Для иностранного субъекта транспортной инфраструктуры/перевозчика соответствующая передача данных в АЦБПДП прямо осуществляется в соответствии с 152-ФЗ и 16-ФЗ, если международным договором не установлено иное."
    - locator: "Порядок, пункт 18 подпункты 1-7"
      concept: OPERATOR_PROCESSING_SECURITY_AND_CRYPTO_CHANNELS
      finding: "Оператор осуществляет сбор, обработку, хранение и предоставление ПДн, обеспечивает информационную безопасность, доступ и информационное взаимодействие; для каналов предусмотрено применение СКЗИ и обеспечение безопасности передаваемых ПДн от угроз, определенных в соответствии со статьей 19 152-ФЗ, либо использование СМЭВ."
    - locator: "Порядок, пункты 20-23"
      concept: CONTROLLED_ACCESS_ATTESTATION_AND_INFORMATION_PROTECTION
      finding: "Предоставление данных потребителям идет через информационное взаимодействие/АРМ/ПО; для соответствующих средств предусмотрена аттестация в области ИБ; защита информации в АЦБПДП осуществляется по законодательству РФ."
    - locator: "Порядок, пункты 27-30"
      concept: OPERATIONAL_TRANSFER_TIMING
      finding: "Установлены технологические сроки передачи сведений: в общем случае 15 минут для воздушных/железнодорожных операций, 30 минут для автомобильных/морских/внутренних водных, а сведения об экипаже передаются не позднее чем за 24 часа до отправления с актуализацией при изменениях."
      guard: "Эти сроки являются SLA информационного обмена в АЦБПДП, а не сроками ответа субъекту ПДн или уведомления об инциденте."
    - locator: "Порядок, пункты 42, 46, 50 и 56"
      concept: EXTENDED_MULTI_MODAL_DIGITAL_TRANSACTION_FIELDS
      finding: "Для воздушных, автомобильных, железнодорожных, морских и внутренних водных перевозок при фактической фиксации поставщиком передаются телефон, e-mail, данные учетной записи (логины и хеши паролей), IP-адрес и порт, а также сведения об электронном средстве платежа, включая наименование финансовой организации/поставщика и последние четыре цифры счета/вклада."
      guard: "Наличие этих полей не создает автоматически режим тайны связи, банковской тайны или отдельной категории защищаемой информации для всего массива."
  retention_boundary:
    rule: "7-летний срок относится к персональным данным в АЦБПДП у оператора ЕГИС ОТБ по пункту 13."
    guard: "Не переносить этот срок автоматически на исходные билетные/CRM/перевозочные системы поставщиков или на другие цели обработки ПДн."
  applicability_status: CANDIDATE_APPLICABILITY_REVIEW_REQUIRED
  applicability_guard: >-
    Приказ № 162 содержит прямые обязанности и технические контексты для конкретного контура АЦБПДП. Для конкретной организации и конкретной операции необходимо доказать роль в информационном взаимодействии, вид перевозки, набор данных и нормативное основание; сам факт работы в транспортной отрасли недостаточен.

