    - id: education_restricted_information
      primary_anchor: "статья 59 часть 11"
      rule: "Информация, содержащаяся в контрольных измерительных материалах ГИА, относится к информации ограниченного доступа."
      current_state_at_check: CURRENT_UNTIL_2026_09_01_CHANGE_EVENT
    - id: education_elearning_pdn_context
      primary_anchor: "статья 16 часть 3.1"
      rule: >-
        Для основных общеобразовательных программ и программ СПО при электронном обучении/ДОТ,
        предусматривающих обработку персональных данных обучающихся, закон устанавливает специальный
        сценарий использования государственных информационных систем и многофункционального сервиса обмена информацией.
      applicability_state: CANDIDATE_SCENARIO_PROOF_REQUIRED
    - id: education_elearning_protected_secret
      primary_anchor: "статья 16 часть 5"
      rule: >-
        При электронном обучении/ДОТ образовательная организация обеспечивает защиту сведений,
        составляющих государственную или иную охраняемую законом тайну.
      applicability_state: CANDIDATE_SCENARIO_PROOF_REQUIRED
    - id: education_gis_pdn_security
      primary_anchor: "статья 98 часть 1"
      rule: >-
        Ведение государственных информационных систем в системе образования осуществляется с обеспечением
        конфиденциальности и безопасности содержащихся в них персональных данных и с соблюдением требований
        законодательства о государственной или иной охраняемой законом тайне.
      applicability_state: CANDIDATE_SYSTEM_ROLE_PROOF_REQUIRED
    - id: preschool_regional_is_pdn
      primary_anchor: "статья 98 части 20-22"
      rule: >-
        Региональные информационные системы дошкольного образования содержат прямо перечисленные персональные данные
        ребенка и родителей/законных представителей; при персонифицированном учете обеспечиваются конфиденциальность
        и безопасность ПДн с соблюдением законодательства о персональных данных; за нарушения предусмотрена ответственность.
      applicability_state: CANDIDATE_SYSTEM_ROLE_AND_OPERATION_PROOF_REQUIRED

