normative_anchors:
  - locator: "Приложение № 1, пункт 1"
    finding: "К персональным данным с ограниченным доступом отнесены ФИО, дата и место рождения, адрес места жительства/временного пребывания, реквизиты документа, удостоверяющего личность, и иные сведения в пределах федерального закона."
    guard: "LIST_SCOPE_NOT_UNLIMITED_PDN_COLLECTION_AUTHORITY"
  - locator: "Приложение № 1, пункты 2.4-2.6"
    finding: "К иной конфиденциальной информации отнесены сведения о паролях и криптографических ключах, рубежах защиты, таблицах разграничения доступа, функционировании и порядке обеспечения безопасности средств защиты информации."
    guard: "CEC_CONFIDENTIAL_INFORMATION_LABEL_NOT_AUTOMATIC_NEW_FEDERAL_SECRET_CATEGORY"
  - locator: "Приложение № 2, пункты 1.3-1.5"
    finding: "Инструкция закрепляет систему обеспечения безопасности информации, назначение ответственных и персональную организационную ответственность участников эксплуатации."
    guard: "ORGANIZATIONAL_RESPONSIBILITY_NOT_GENERAL_PDN_OPERATOR_ROLE_OUTSIDE_GAS_VYBORY"
  - locator: "Приложение № 2, пункты 2.1-2.5"
    finding: "Доступ предоставляется по утвержденным спискам и матрице доступа; администратор проверяет права и выдает персональный идентификатор под расписку; передача сведений допускается только адресатам, имеющим право по Инструкции и федеральному избирательному законодательству."
    guard: "ROLE_OR_MATRIX_ACCESS_NOT_INDEPENDENT_LAWFUL_BASIS_FOR_NEW_COLLECTION_OR_REPURPOSING"
  - locator: "Приложение № 2, пункт 3.2"
    finding: "Допущенные лица обязаны не раскрывать конфиденциальную информацию лицам без права доступа, не допускать действий, способных повлечь утечку, и соблюдать требования защиты."
    guard: "USER_DUTY_NOT_SEPARATE_SECRET_CLASSIFICATION_RULE"
  - locator: "Приложение № 2, раздел 4"
    finding: "Доступ должностного лица государственного органа к ресурсам с ПДн требует письменного запроса с указанием федерально-законного основания, субъекта, объема и цели, связанной с исполнением установленных законом обязанностей."
    guard: "OFFICIAL_REQUEST_REQUIRES_SPECIFIC_FEDERAL_LAW_AUTHORITY_NOT_GENERIC_INTERAGENCY_ACCESS"
  - locator: "Приложение № 2, пункты 4.8-4.9"
    finding: "Установлены 20- и 30-дневные сроки для отдельных маршрутов исполнения запросов должностных лиц."
    guard: "OFFICIAL_ACCESS_REQUEST_SLA_NOT_PDN_SUBJECT_RIGHTS_RESPONSE_PERIOD_AND_NOT_RETENTION"

