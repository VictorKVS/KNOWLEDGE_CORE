  finding: >-
    Banking secrecy is a special statutory confidentiality regime covering operations, accounts, deposits and other
    protected banking information. It can concern natural persons and legal entities. The presence of natural-person
    information does not by itself prove that any particular 152-ФЗ requirement applies to a concrete banking operation.
  applicability_guard: >-
