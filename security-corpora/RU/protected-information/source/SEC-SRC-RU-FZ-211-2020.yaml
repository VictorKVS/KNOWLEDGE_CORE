protected_locators:
  - locator: "статья 7, части 1, 3, 5–8"
    concept: FINANCIAL_TRANSACTION_INFORMATION_TRANSFER_ACCESS_AND_DISCLOSURE
    state: CURRENT_TEXT_CROSSCHECKED_LOCATOR_SPECIFIC_45FZ_CHANGE_RECONCILED
    finding: >-
      Оператор передает регистратору финансовых транзакций сведения о финансовых сделках и операциях; закон определяет круг получателей и режим доступа. После 45-ФЗ часть 3 допускает предоставление иным лицам с согласия получателя финансовых услуг в части информации о его финансовых сделках; регистратор отвечает, в частности, за неправомерное раскрытие или предоставление информации.
  - locator: "статья 7, часть 6"
    concept: RFT_IDENTITY_DATA_FOR_ACCESS
    state: CURRENT_TEXT_CROSSCHECKED_45FZ_CONTEXT
    finding: >-
      Для предоставления физическому лицу доступа к информации регистратор использует ЕСИА/СМЭВ и получает набор идентифицирующих сведений, включая ФИО, реквизиты документа, СНИЛС, ИНН, абонентский номер и адрес электронной почты в предусмотренном законом контексте.
  - locator: "статья 8, часть 7"
    concept: OFP_ESIA_IDENTITY_DATA_WITH_CONSENT
    state: CURRENT_TEXT_CROSSCHECKED_45FZ_CONTEXT
    finding: >-
      Оператор финансовой платформы вправе получать из ЕСИА предусмотренные законом сведения о получателе финансовых услуг и его представителе, включая идентификационные и контактные сведения, с согласия соответствующего лица для предусмотренных законом целей и обновления сведений.
  - locator: "статья 12, части 1–5"
    concept: FINANCIAL_PLATFORM_INFORMATION_SECURITY_AND_OPERATIONAL_RELIABILITY
    state: CURRENT_TEXT_CROSSCHECKED_PART1_45FZ_CHANGE_RECONCILED
    finding: >-
      Оператор обязан выполнять установленные Банком России требования по защите информации и операционной надежности, в том числе при взаимодействии, идентификации и аутентификации; также действует специальный механизм выявления операций без волеизъявления и обмена соответствующей информацией с Банком России.
  - locator: "статья 17, часть 4"
    concept: BANK_OF_RUSSIA_RECEIVED_INFORMATION_CONFIDENTIALITY
    state: CURRENT_TEXT_CROSSCHECKED
    finding: >-
      Банк России вправе запрашивать у операторов документы и информацию, связанную с деятельностью оператора, и обязан обеспечивать их конфиденциальность, кроме раскрытия (представления) в соответствии с федеральными законами и принятыми на их основании нормативными правовыми актами.

pdn_relation:
  target: "152-ФЗ"
  state: CANDIDATE_DUAL_REGIME_ON_DATA_FIELD_OPERATION_ROLE_PURPOSE_AND_LEGAL_BASIS_PROOF_ONLY
  evidence_dimensions:
    - "статья 7 часть 6 содержит набор идентифицирующих сведений физического лица"
    - "статья 8 часть 7 регулирует получение идентификационных и контактных сведений из ЕСИА с согласием лица"
    - "Банк России прямо указывает, что финансовые платформы обязаны соблюдать требования по защите информации, включая персональные данные участников"
    - "статья 12 вводит отдельный отраслевой режим защиты информации и операционной надежности"
  guard: >-
    Для конкретного требования определить субъект данных, точное поле, операцию, цель, роль оператора/регистратора/финансовой организации/Банка России, правовое основание, согласие при необходимости, конкретный locator 211-ФЗ и применимый нормативный акт Банка России. Наличие финансовой платформы или сведений о сделке само по себе не доказывает применимость всех требований 152-ФЗ. OVERLAP != APPLICABILITY.

cross_regime_relations:
  - target: "115-ФЗ"
    type: AML_IDENTIFICATION_AND_INFORMATION_SECURITY_CONTEXT
    state: DIRECT_STATUTORY_CONTEXT_NOT_REGIME_MERGE
    guard: "Статья 12 прямо связывает защиту информации с идентификационными процедурами по 115-ФЗ; импортировать требования только по точным операциям и ролям."
  - target: "572-ФЗ / ЕБС"
    type: BIOMETRIC_IDENTIFICATION_CONTEXT_CANDIDATE
    state: RELATION_CANDIDATE_REQUIRES_EXACT_OPERATION_AND_LOCATOR_REVIEW
    guard: "Биометрический режим не распространять на все процессы платформы без факта использования биометрии."
  - target: "63-ФЗ"
    type: ELECTRONIC_SIGNATURE_AND_PLATFORM_AUTHENTICATION_CONTEXT
    state: STATUTORY_CONTEXT_ONLY
    guard: "Требования электронной подписи связывать только с конкретным способом подписания и инфраструктурой."
  - target: "финансовые отраслевые тайны (банковская, страховая, кредитные истории)"
    type: TRANSACTION_DATA_OVERLAP
    state: RELATION_CANDIDATE_NOT_REGIME_MERGE
    guard: "Сделка на финансовой платформе может одновременно попадать в иной отраслевой режим, но это определяется видом продукта, данными, сторонами и операцией."

