proof_floor:
  - "211-ФЗ формирует специальный режим обращения информации о финансовых сделках и требования к защите информации финансовой платформы; FINANCIAL_PLATFORM_INFORMATION != PERSONAL_DATA."
  - "Статья 7 регулирует передачу и доступ к информации о финансовых сделках; отдельные сведения относятся к конкретным физическим лицам, но применимость 152-ФЗ определяется по данным, операции, цели, роли и основанию, а не по факту использования платформы."
  - "Статья 12 устанавливает специальную обязанность оператора выполнять требования Банка России по защите информации и операционной надежности; это самостоятельный отраслевой security-layer, не заменяющий требования 152-ФЗ."
  - "Статья 17 часть 4 возлагает на Банк России обязанность обеспечивать конфиденциальность документов и информации, полученных от операторов, кроме законных случаев раскрытия; это не общая «тайна клиента» финансовой платформы."
  - "Exact current authoritative bytes не получены; retrieved_at, MIME, byte length и SHA-256 не синтезируются."

