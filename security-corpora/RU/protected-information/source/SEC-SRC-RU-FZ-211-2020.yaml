title: "Федеральный закон от 20.07.2020 № 211-ФЗ «О совершении финансовых сделок с использованием финансовой платформы»"
status: NEW_PRIMARY_ACT_IDENTIFIED_OFFICIAL_PUBLICATION_VERIFIED_OFFICIAL_CURRENT_LOCATOR_IDENTIFIED_CURRENT_TEXT_CROSSCHECKED_PROTECTED_LOCATORS_RECONCILED_EXACT_CURRENT_ARTIFACT_PENDING_VERSION_CHAIN_PARTIAL
