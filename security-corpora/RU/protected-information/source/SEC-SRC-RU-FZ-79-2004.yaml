    - conditional_genomic_registration
  protected_locators:
    - locator: "статья 42 часть 1"
      concept: CIVIL_SERVANT_PDN_PROCESSING_RULES
      findings:
        - "Кадровая служба государственного органа обрабатывает персональные данные гражданского служащего в специальном actor/object scope гражданской службы и с учетом законодательства Российской Федерации о персональных данных."
        - "Статья 42 содержит ограничения на получение данных у третьих лиц, обработку отдельных сведений о частной жизни/убеждениях, исключительно автоматизированные решения, неправомерное использование/утрату и передачу третьим лицам."
      guards:
        - "ARTICLE42_SPECIAL_RULES_DO_NOT_REPLACE_152FZ"
        - "CONSENT_OR_STATUTORY_EXCEPTION_NOT_GENERAL_INTERAGENCY_DISCLOSURE_BASIS"
    - locator: "статья 42 части 3-4"
      concept: PERSONAL_FILE_AND_PRESIDENTIAL_IMPLEMENTATION
      findings:
        - "В личное дело включаются персональные данные и иные сведения, связанные с поступлением, прохождением и увольнением с гражданской службы и необходимые для деятельности государственного органа."
        - "Положение о персональных данных гражданского служащего и ведении его личного дела утверждается Президентом Российской Федерации; этим прямым подзаконным узлом является Указ № 609."
      guard: "PERSONAL_FILE_SCOPE_NOT_ALL_PUBLIC_SECTOR_RECORDS"
    - locator: "статья 43 часть 2"
      concept: CIVIL_SERVANT_REGISTRY_SECURITY
      findings:
        - "Сведения из личного дела включаются в реестр гражданских служащих и хранятся в базах данных предусмотренных законом государственных информационных систем с защитой от несанкционированного доступа и копирования."
      guard: "SECURITY_REQUIREMENT_NOT_RETENTION_PERIOD"
    - locator: "статья 15 часть 5, редакция Федерального закона № 52-ФЗ"
      concept: CONDITIONAL_FINGERPRINT_AND_GENOMIC_REGISTRATION
      findings:
        - "С 07.06.2026 гражданские служащие подлежат обязательной государственной дактилоскопической и обязательной государственной геномной регистрации только в случаях и порядке, установленных федеральными законами."
      guards:
        - "NO_UNIVERSAL_REGISTRATION_INFERRED_WITHOUT_TRIGGERING_FEDERAL_LAW"
        - "DACTYLOSCOPIC_REGISTRATION_NOT_AUTOMATIC_EBS_REGIME"
        - "GENOMIC_REGISTRATION_NOT_AUTOMATICALLY_CLASSIFIED_AS_152FZ_BIOMETRIC_PDN_WITHOUT_SEPARATE_PROOF"

pdn_boundary:
  relationship_to_152fz: DIRECT_SPECIAL_SECTOR_OVERLAY
  canonical_152fz_source: "security-corpora/RU/152-FZ/source/SEC-SRC-RU-152FZ-2026-07-26.yaml"
  findings:
    - "Статья 42 прямо строит специальный режим обработки персональных данных гражданских служащих поверх общего законодательства о персональных данных."
    - "Статья 42 часть 4 является прямым нормативным родителем Указа Президента РФ № 609; ранее незакрытая ссылка на 79-ФЗ теперь имеет отдельный canonical source."
    - "Ни статья 42, ни статья 43 не устанавливают универсальный числовой срок хранения всех персональных данных гражданских служащих."
  guards:
    - "SPECIAL_CIVIL_SERVICE_SCOPE_NOT_ALL_PUBLIC_SECTOR_PDN"
    - "NO_UNIVERSAL_PDN_RETENTION_INFERRED"
    - "REGISTRY_STORAGE_NOT_ARCHIVE_RETENTION_RULE"

