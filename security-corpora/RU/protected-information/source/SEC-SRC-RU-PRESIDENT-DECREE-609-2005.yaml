  protected_locators:
    - locator: "пункты 1-2"
      concept: CIVIL_SERVANT_PDN_SCOPE_AND_DEFINITION
      findings:
        - "Положение регулирует обработку персональных данных государственного гражданского служащего и ведение его личного дела в связи со статьей 42 Федерального закона № 79-ФЗ."
        - "Персональные данные служащего определены как сведения о фактах, событиях и обстоятельствах его жизни, позволяющие идентифицировать личность и содержащиеся либо подлежащие включению в личное дело."
      guard: "Специальный actor/object scope не распространять на всех работников госсектора и все государственные информационные ресурсы."
    - locator: "пункты 3-5"
      concept: EMPLOYER_PROTECTION_AND_PROCESSING_RULES
      findings:
        - "Представитель нанимателя обеспечивает защиту персональных данных в личных делах от неправомерного использования или утраты и определяет уполномоченных лиц."
        - "Пункт 5 закрепляет специальную целевую связанность кадровой обработки, получение данных у служащего как базовый маршрут, правила работы с данными от третьих лиц, ограничения на чувствительные сведения и передачу третьим лицам."
      guards:
        - "POINT5_CONSENT_OR_EXCEPTION_RULE_NOT_GENERAL_GOVERNMENT_SHARING_BASIS"
        - "SPECIAL_HR_RULES_DO_NOT_REPLACE_152FZ_GENERAL_REQUIREMENTS"
    - locator: "пункты 8-10"
      concept: ELECTRONIC_PERSONNEL_REGISTERS_AND_PERSONAL_FILE
      findings:
        - "На основе персональных данных формируются реестры гражданских служащих, в том числе на электронных носителях."
        - "В личное дело включаются персональные данные и иные сведения, необходимые для поступления, прохождения и прекращения гражданской службы."
    - locator: "пункт 11"
      concept: CONFIDENTIALITY_CLASSIFICATION
      finding: "Персональные данные и иные сведения личного дела относятся к сведениям конфиденциального характера, кроме прямо допускаемых законом к опубликованию; государственная тайна возникает только в случаях, установленных федеральными законами и иными НПА."
      guards:
        - "PERSONAL_FILE_CONFIDENTIALITY_NOT_EQUAL_STATE_SECRET"
        - "CONFIDENTIALITY_STATUS_NOT_AUTOMATIC_RETENTION_RULE"
    - locator: "пункты 18-20"
      concept: PERSONNEL_RECORD_SECURITY_AND_RESPONSIBILITY
      findings:
        - "Учетные данные на электронных носителях хранятся кадровой службой с защитой от несанкционированного доступа и копирования."
        - "Кадровая служба обеспечивает сохранность и конфиденциальность личных дел; за разглашение конфиденциальных сведений и иные нарушения предусмотрена ответственность по законодательству."
    - locator: "пункт 23"
      concept: POST_EMPLOYMENT_PERSONAL_FILE_RETENTION_AND_ARCHIVE_TRANSFER
      findings:
        - "Личные дела уволенных гражданских служащих, кроме специального случая пункта 22, хранятся кадровой службой соответствующего государственного органа 10 лет со дня увольнения, после чего передаются в архив."
        - "Если гражданин вновь поступает на гражданскую службу до архивной передачи, личное дело передается новому государственному органу."
        - "Личные дела со сведениями, составляющими государственную тайну, хранятся по законодательству о государственной тайне."
      guards:
        - "TEN_YEARS_IS_HR_CUSTODIAL_STAGE_NOT_TOTAL_INFORMATION_LIFECYCLE"
        - "ARCHIVE_TRANSFER_NOT_DELETION"
        - "TEN_YEARS_NOT_UNIVERSAL_PDN_RETENTION"

current_revision_transition_2026:
  effective_date: "2026-01-01"
  findings:
    - "Пункты 12, 13, 14 и 15 Положения утратили силу с 01.01.2026 по Указу № 1009."
    - "Отдельные подпункты пункта 19 также утратили силу; иные действующие кадровые, конфиденциальностные, защитные и retention-положения должны читаться по текущей редакции."
  guard: "Не использовать отмененные пункты 12-15 как действующие обязанности после 01.01.2026."

pdn_boundary:
  relationship_to_152fz: DIRECT_SPECIAL_SECTOR_OVERLAY
  canonical_152fz_source: "security-corpora/RU/152-FZ/source/SEC-SRC-RU-152FZ-2026-07-26.yaml"
  findings:
    - "Указ № 609 является специальным кадровым режимом для персональных данных гражданских служащих и действует вместе с общим режимом 152-ФЗ в применимом объеме."
    - "Конфиденциальность личного дела не создает самостоятельного основания для обработки, передачи или публикации персональных данных за пределами установленных законом маршрутов."
    - "Пункт 23 устанавливает жизненный цикл конкретного объекта — личного дела после увольнения — и не задает срок хранения всех копий/выгрузок/производных наборов ПДн."
  guards:
    - "SPECIAL_REGIME_NOT_ALL_PUBLIC_SECTOR_PDN"
    - "CONFIDENTIALITY_NOT_PROCESSING_BASIS"
    - "TEN_YEAR_PERSONAL_FILE_RULE_NOT_UNIVERSAL_PDN_RETENTION"

