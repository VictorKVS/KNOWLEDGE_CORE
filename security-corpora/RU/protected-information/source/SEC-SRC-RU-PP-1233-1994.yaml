agent_rule: >-
  Treat PP RF 1233 as a special DLU handling regime with actor/object scope, not as a universal secrecy law. Keep DLU, PDN, state secret, archival restriction and retention as separate dimensions. A DLU destruction requirement governs lawful disposal method and does not create a universal retention/deletion deadline. Do not upgrade the 2026 recommendation to an unconditional duty without a separate applicability basis.