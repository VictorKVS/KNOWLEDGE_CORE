protected_information:
  sectors:
    - public_sector
    - archives
    - restricted_information
    - service_information_limited_distribution
    - information_security
    - personal_data_overlap
  regimes:
    - dlu_marking_and_handling
    - electronic_dlu_document_security
    - restricted_document_destruction
    - archival_access_overlap
  protected_locators:
    - locator: "пункт 1.1"
      concept: DLU_ACTOR_AND_OBJECT_SCOPE
      finding: "Положение задает общий порядок обращения с документами, включая электронные документы и материальные носители, содержащими служебную информацию ограниченного распространения, для установленных федеральных организаций и подведомственных им организаций."
      guard: "Не распространять обязательность механически на любую частную организацию; рекомендации, добавленные № 226, отделять от прямой обязательности."
    - locator: "пункт 1.2"
      concept: NONSECRET_RESTRICTED_INFORMATION_DEFINITION
      findings:
        - "Режим охватывает несекретную служебную информацию, ограничение распространения которой обусловлено служебной необходимостью, а также поступившую несекретную информацию, доступ к которой ограничен федеральными законами."
        - "С 2024 года отдельно включена несекретная информация в документах Архивного фонда РФ, распространение которой может создать потенциальную угрозу интересам РФ, в доказанном архивном scope."
      guards:
        - "DLU != STATE_SECRET"
        - "DLU != AUTOMATIC_PDN_CATEGORY"
    - locator: "пункт 1.3"
      concept: NON_DLU_EXCLUSIONS
      finding: "Положение содержит категории сведений, которые не могут быть отнесены к служебной информации ограниченного распространения, включая нормативные акты о правах и обязанностях, общественно необходимую безопасностную информацию и ряд открытых/архивных материалов с установленными исключениями."
      guard: "Пометка ДСП не должна использоваться для обхода прямо установленных ограничений на классификацию."
    - locator: "пункты 1.4-1.8"
      concept: DLU_GOVERNANCE_AND_MARKING
      findings:
        - "Документы, проекты и приложения с соответствующей информацией маркируются «Для служебного пользования»; допускается маркировка отдельных частей/приложений."
        - "Руководитель определяет уполномоченных лиц, порядок копирования/передачи, снятия пометки, обращения и уничтожения, а также организацию защиты."
        - "За разглашение и нарушение порядка обращения, включая уничтожение, предусмотрена ответственность по законодательству."
    - locator: "пункт 2.3"
      concept: ELECTRONIC_DLU_SECURITY
      findings:
        - "Электронные документы ДСП создаются, обрабатываются, хранятся и обмениваются через СЭД или иные решения, отвечающие требованиям информационной безопасности и части 5 статьи 16 149-ФЗ."
        - "Для бумажных и иных материальных носителей установлены отдельный учет, контролируемое тиражирование, защищенное хранение и контролируемая пересылка."
      guard: "Наличие персональных данных в документе не заменяет самостоятельную проверку требований 152-ФЗ; режимы могут пересекаться."
    - locator: "пункт 2.6"
      concept: DLU_DESTRUCTION_AFTER_LAWFUL_DISPOSAL
      findings:
        - "Уничтожение дел/документов ДСП допускается после прохождения установленного документного/архивного lifecycle и оформляется соответствующим основанием."
        - "Способ уничтожения должен исключать восстановление содержания; для электронных документов предусмотрены уничтожение носителя либо удаление остаточной информации без возможности восстановления."
      guards:
        - "SECURE_DESTRUCTION_METHOD != RETENTION_PERIOD"
        - "SECURE_DESTRUCTION_METHOD != AUTOMATIC_PDN_DELETION_TRIGGER"
    - locator: "пункты 2.7-2.11"
      concept: CONTROLLED_TRANSFER_AUDIT_AND_DEMARKING
      finding: "Передача, копирование, печать и направление ДСП-документов требуют установленного разрешения; наличие материальных носителей периодически проверяется, утрата/разглашение расследуются, снятие пометки оформляется решением уполномоченного лица с отражением в учетных формах."

scope_after_2026_amendment:
  direct_mandatory_scope: "ФОИВ, Росатом, Роскосмос и подведомственные им организации в пределах Положения."
  recommended_scope_added_by_pp_226: "Органы субъектов РФ, иные государственные органы, органы МСУ, государственные/муниципальные учреждения и предприятия, ряд организаций с публичными функциями или государственным участием и иные юридические лица — в формулировке рекомендации руководствоваться Положением."
  guard: "Рекомендация пункта 3, добавленного № 226, не повышается до безусловной федеральной обязанности для каждого перечисленного юридического лица без отдельного основания."

pdn_boundary:
  relationship_to_152fz: CONDITIONAL_DOCUMENT_LEVEL_OVERLAP
  findings:
    - "Документ ДСП может содержать персональные данные, но статус ДСП и статус персональных данных являются независимыми правовыми измерениями."
    - "Если ДСП-документ содержит ПДн, требования к обработке/защите ПДн определяются 152-ФЗ и применимыми подзаконными актами, а требования № 1233 добавляются в своем actor/object scope."
    - "Пункт 2.6 регулирует способ и процедуру уничтожения ДСП-документа; он не задает универсальный срок хранения ПДн."
  guards:
    - "DLU_NOT_EQUAL_PDN"
    - "DLU_MARKING_NOT_PDN_LEGAL_BASIS"
    - "DLU_DESTRUCTION_NOT_UNIVERSAL_PDN_RETENTION"

