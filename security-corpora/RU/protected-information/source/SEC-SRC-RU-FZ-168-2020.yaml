normative_anchors:
  - locator: "статья 1"
    finding: "Закон прямо регулирует сбор, обработку, хранение, получение, использование и защиту сведений регистра."
    guard: "REGISTER_SCOPE_ONLY_NOT_GENERAL_PUBLIC_SECTOR_PDN_RULE"
  - locator: "статья 3 пункт 1"
    finding: "Принцип функционирования регистра включает применение организационных и технических мер по обеспечению безопасности содержащихся в нем персональных данных."
    guard: "DIRECT_PDN_SECURITY_REFERENCE_NOT_AUTOMATIC_APPLICABILITY_TO_OTHER_GIS"
  - locator: "статья 7"
    finding: "Регистр содержит идентификационные и статусные сведения о физическом лице и идентификаторы; 512-ФЗ добавил, в частности, сведения о родительских правах, опекунах/попечителях, ограничении дееспособности и эмансипации."
    guard: "SENSITIVE_IDENTITY_OR_FAMILY_STATUS_NOT_SPECIAL_CATEGORY_PDN_AUTOMATICALLY"
  - locator: "статья 8 часть 2"
    finding: "Использование сведений, составляющих государственную тайну, по общему правилу не допускается, кроме специально предусмотренных законом случаев обособленного учета."
    guard: "REGISTER_CONTENT_NOT_STATE_SECRET_AUTOMATICALLY"
  - locator: "статья 8 часть 11"
    finding: "Записи регистра и иные содержащиеся в нем в соответствии с законом сведения подлежат постоянному хранению; их изъятие, кроме предусмотренных законом случаев, и уничтожение не допускаются."
    guard: "PERMANENT_EFIR_RECORD_RETENTION_NOT_GENERAL_PDN_RETENTION"
  - locator: "статья 8 часть 13"
    finding: "Уполномоченный орган обязан защищать запись регистра от несанкционированного доступа, случайного или несанкционированного изменения, уничтожения или утраты."
    guard: "EFIR_OPERATOR_SECURITY_DUTY_NOT_GENERAL_SECURITY_STANDARD_FOR_ALL_GIS"
  - locator: "статья 9 части 1 и 5"
    finding: "Формирование и ведение регистра выполняются в государственной информационной системе по законодательству об информации и персональных данных; оператор обеспечивает защиту с учетом законодательства о ПДн, информации, государственной и иной охраняемой законом тайне."
    guard: "REFERENCE_TO_PROTECTED_SECRETS_NOT_CLASSIFICATION_OF_ALL_REGISTER_DATA_AS_SECRET"
  - locator: "статья 10 часть 5"
    finding: "В регистр поступают сведения о документах об образовании/квалификации и обучении из федерального реестра документов об образовании, а также связанные сведения."
    guard: "EDUCATION_DATA_FLOW_NOT_EDUCATION_SECRECY_REGIME"
  - locator: "статья 11 часть 5"
    finding: "Доступ физлица к сведениям о себе осуществляется после идентификации/аутентификации; сведения о несовершеннолетнем не предоставляются родителю, лишенному родительских прав."
    guard: "CHILD_ACCESS_RESTRICTION_NOT_GENERAL_CHILD_PDN_CONSENT_RULE"
  - locator: "статья 11 часть 10"
    finding: "Получающие сведения органы, организации и лица обязаны защищать их по законодательству о персональных данных и об информации при обработке в своих информационных системах."
    guard: "DOWNSTREAM_SECURITY_DUTY_DOES_NOT_CREATE_UNLIMITED_REUSE_AUTHORITY"

