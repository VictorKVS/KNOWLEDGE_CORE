normative_anchors:
  - locator: "Положение о ФГИС «Моя школа», функции оператора и требования информационной защиты"
    finding: "Функционирование системы включает разграничение прав доступа и обеспечение конфиденциальности, целостности и доступности информации; защита должна соответствовать требованиям законодательства Российской Федерации об информации и персональных данных."
    guard: "SYSTEM_SECURITY_DUTY_NOT_NEW_SECRET_CATEGORY_OR_GENERAL_PROCESSING_BASIS"
  - locator: "пункт 5(4), введенный ПП РФ № 1545/2023"
    finding: "При взаимодействии с информационно-коммуникационной образовательной платформой защита информации в системе и взаимодействующих системах должна обеспечиваться с соблюдением законодательства об информации и персональных данных."
    guard: "DIRECT_SECURITY_OVERLAP_NOT_BLANKET_APPLICABILITY_TO_UNRELATED_EDUCATION_DATA"
  - locator: "ПП РФ № 962/2026, приложение № 2"
    finding: "Для общего образования перечень включает идентификаторы учетных записей и государственных/региональных систем, СНИЛС, хэш-идентификаторы, ФИО, дату рождения, пол, e-mail, мобильный номер, сведения об образовании, оценивании, посещаемости, домашних заданиях, достижениях и отдельных статусах, а также данные родителей/законных представителей и работников."
    guard: "EDUCATION_AND_CHILD_DATASET_NOT_SPECIAL_CATEGORY_OR_PROTECTED_SECRET_AUTOMATICALLY"
  - locator: "ПП РФ № 962/2026, приложение № 3"
    finding: "Для среднего профессионального образования установлен отдельный перечень персональных данных участников образовательных отношений; он применяется с общей датой вступления изменений № 962."
    guard: "SPO_DATASET_SCOPE_MUST_MATCH_ACTUAL_ROLE_AND_RECORD_TYPE"
  - locator: "ПП РФ № 962/2026, ЕСИА и согласия в информационно-коммуникационном контуре"
    finding: "Предусмотрены получение через ЕСИА установленных идентификационных и контактных сведений с согласия пользователя и маршрут согласия родителя/законного представителя для регистрации в ЕСИА пользователя образовательного сервиса младше 14 лет."
    guard: "ESIA_ROUTE_SPECIFIC_CONSENT_NOT_BLANKET_CONSENT_FOR_ALL_EDUCATION_PDN_PROCESSING"
  - locator: "ПП РФ № 962/2026, защитные меры для региональных ГИС образования"
    finding: "Добавлены функции по разработке типовых комплектов средств защиты и типовых документов для аттестации/подтверждения соответствия защищаемых региональных компонентов, используемых в установленном контуре взаимодействия."
    guard: "SECURITY_CONTROL_OVERLAY_REQUIRES_SYSTEM_AND_AGREEMENT_SCOPE_MATCH"
  - locator: "ПП РФ № 962/2026, пункт 5 о вступлении в силу"
    finding: "Большинство изменений действует с 17.08.2026, но положения, касающиеся приложений № 1 и № 4 и прямо названных абзацев подпункта «к», вступают в силу только 01.09.2026."
    guard: "FUTURE_RULES_MUST_NOT_BE_PROMOTED_BEFORE_EFFECTIVE_DATE"

