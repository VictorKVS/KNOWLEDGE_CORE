scope_findings:
  - "Article 7(4): the statutory Article 4 dataset received by a BKI under Article 5 is expressly information of restricted access."
  - "Article 7(2): BKI must protect Article 4 information during processing, storage and transmission using certified protection means and Bank of Russia requirements agreed with competent security/TZI authorities."
  - "Article 7(5): disclosure performed under 218-FZ is not a violation of official, banking, tax or commercial secrecy; this is a statutory safe harbor, not unrestricted disclosure authority."
  - "Article 5(3.1): enumerated statutory sources transfer the required Article 4 information to at least one BKI without obtaining consent for that submission route, subject to statutory limits."
  - "Articles 6 and 8 establish scoped access/report routes and subject access/correction rights."

retention_findings:
  - "Article 7(1): individual credit-history record — 7 years from the last change to information in that record."
  - "After annulment/exclusion from credit reports the record/data move to the BKI credit-history archive for a separate 3-year storage stage."
  - "Article 7(1.2): Central Catalogue transfer case — until transfer to a BKI, but no more than 5 years from transfer to the Central Catalogue."
  - "Article 7(1.3): self-ban and removal information have separate object-specific lifecycle rules."

