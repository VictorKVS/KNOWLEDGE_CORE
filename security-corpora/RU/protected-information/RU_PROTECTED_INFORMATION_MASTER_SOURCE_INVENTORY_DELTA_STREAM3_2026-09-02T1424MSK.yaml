public_sector_pdn_findings:
  - "Decree 609 establishes a special personal-data and personal-file regime for Russian Federation state civil servants; it is not a general rule for all public-sector employees or all government-held personal data."
  - "Points 1-5 define the special actor/object scope, protection responsibility, purposes and handling constraints for civil-servant personal data."
  - "Point 11 classifies personal data and other information in civil-servant personal files as confidential information, except information lawfully publishable; state-secret status requires a separate statutory/regulatory basis."
  - "Points 18-20 establish personnel-record protection, confidentiality and responsibility controls for the personal-file lifecycle."
  - "The current revision must reflect Decree 1009/2025: points 12-15 ceased to have effect on 01.01.2026 and must not be modeled as current duties."

retention_findings:
  - "Point 23 requires the HR service to retain the personal file of a dismissed civil servant for 10 years from dismissal, except the special transfer case in point 22, and then transfer the file to an archive."
  - "The 10-year period is a custodial stage for the personal-file object, not a universal retention period for every PDN copy, extract, registry or derivative dataset."
  - "Archive transfer is not deletion and does not terminate the information lifecycle."
  - "Personal files containing state-secret information follow the separate state-secret legal regime."

