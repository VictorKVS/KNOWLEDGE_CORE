pipeline_fixes:
  - id: PDN-ACQ-GUARD-2026-08-23-001
    component: TOOLS/pdn_current_root_acquire.py
    finding: >-
      Document-identity markers alone could accept an older 152-ФЗ consolidated response as the
      current 26.07.2026 root if that response still contained 152-ФЗ/personal-data text.
    fix: >-
      Require the № 265-ФЗ amendment marker in returned official bytes in addition to 152-ФЗ and
      personal-data identity markers; record current_revision_trigger and effective_from in manifest proof.
    semantic_promotion: false
  - id: PDN-ACQ-SYNC-2026-08-23-001
    component: TOOLS/pdn_core_sync_capture.py
    finding: >-
      A successful guarded PP687 registered-route manifest used capture_kind
      official_registered_route_snapshot, but the synchronizer only accepted publication PDFs and generic
      canonical snapshots and also required a publication-ID scope flag that is not applicable to this route.
      Therefore a valid PP687 exact capture could be written but never synchronized into the source card/master inventory.
    fix: >-
      Add an explicit proof path for PP687 registered official routes requiring registered_route_used,
      canonical_content_identity_markers_ok, byte-exact capture, SHA-256, and semantic_status_unchanged.
      Keep publication-ID identity gates for publication-ID acquisitions. Also require current-revision proof
      for the current 152-ФЗ canonical manifest.
    semantic_promotion: false

