schema_version: "1.0"
id: SEC-REQ-RU-152FZ-A19-P2-I8
kind: security-requirement
status: PROPOSED

source:
  source_ref: SEC-SRC-RU-152FZ-2025-09-01
  locator:
    article: "19"
    part: "2"
    item: "8"

classification:
  obligation_type: statutory_security_measure
  subject: personal_data_operator
  domain:
    - access_control
    - audit_logging
    - accountability

atomic_requirement:
  statement: >-
    Для персональных данных, обрабатываемых в информационной системе, должны быть установлены правила доступа,
    а действия с персональными данными должны регистрироваться и учитываться.
  normative_strength: direct_article_19_measure

applicability:
  applies_when:
    - personal_data_is_processed_in_information_system

interpretation:
  status: NOT_YET_VERIFIED
  notes:
    - >-
        The statutory clause establishes access-rule and action-accounting duties. Concrete authentication,
        authorization, audit-event, retention and log-protection requirements must be derived from the
        applicable subordinate acts and system context rather than inferred here.

links:
  controls: []
  checks: []
  external_mappings: []

review:
  source_text_checked: true
  independent_normative_review: false
  verified_for_use: false

provenance:
