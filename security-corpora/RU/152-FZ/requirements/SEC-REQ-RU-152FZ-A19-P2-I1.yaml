schema_version: "1.0"
id: SEC-REQ-RU-152FZ-A19-P2-I1
kind: security-requirement
status: PROPOSED

source:
  source_ref: SEC-SRC-RU-152FZ-2025-09-01
  locator:
    article: "19"
    part: "2"
    item: "1"

classification:
  obligation_type: statutory_security_measure
  subject: personal_data_operator
  domain:
    - threat_modeling
    - personal_data_security

atomic_requirement:
  statement: >-
    В рамках обеспечения безопасности персональных данных оператор должен определять угрозы безопасности
    персональных данных при их обработке в информационных системах персональных данных.
  normative_strength: direct_article_19_measure

applicability:
  applies_when:
    - personal_data_is_processed_in_information_system
  context_required:
    - data_content
    - processing_character
    - processing_methods
    - sector_specific_threat_acts_when_applicable

interpretation:
  status: NOT_YET_VERIFIED
  notes:
    - >-
        This requirement establishes threat identification as a security measure. Methodology, threat catalog,
        sector-specific acts and detailed threat-model content must be sourced separately and must not be
        invented from this clause.

links:
  threats: []
  controls: []
  checks: []
  external_mappings: []

review:
  source_text_checked: true
  independent_normative_review: false
  verified_for_use: false

provenance:
  created_at: "2026-08-12"

agent_rule: >-
  Treat threat identification as required, but obtain the method and detailed threat set from the applicable
  subordinate and methodological sources before producing a verified threat model.
