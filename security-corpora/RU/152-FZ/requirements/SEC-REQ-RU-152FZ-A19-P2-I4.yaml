  source_ref: SEC-SRC-RU-152FZ-2025-09-01
  locator:
    article: "19"
    part: "2"
    item: "4"

classification:
  obligation_type: statutory_security_measure
  subject: personal_data_operator
  domain:
    - security_assurance
    - preproduction_assessment

atomic_requirement:
  statement: >-
    До ввода информационной системы персональных данных в эксплуатацию должна быть оценена эффективность
    принимаемых мер по обеспечению безопасности персональных данных.
  normative_strength: direct_article_19_measure

applicability:
  applies_when:
    - personal_data_information_system_is_prepared_for_operation
  timing:
    - before_commissioning

interpretation:
  status: NOT_YET_VERIFIED
  notes:
    - >-
        The clause requires effectiveness assessment before commissioning. The exact assessment method,
        evidence set and relationship to certification/attestation or other assurance procedures must be
        determined from applicable subordinate requirements and system context.

