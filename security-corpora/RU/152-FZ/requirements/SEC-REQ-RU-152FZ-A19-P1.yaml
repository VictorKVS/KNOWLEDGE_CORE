schema_version: "1.0"
id: SEC-REQ-RU-152FZ-A19-P1
kind: security-requirement
status: PROPOSED

source:
  source_ref: SEC-SRC-RU-152FZ-2025-09-01
  locator:
    article: "19"
    part: "1"

classification:
  obligation_type: mandatory
  subject: personal_data_operator
  domain:
    - personal_data_security
    - legal_measures
    - organizational_measures
    - technical_measures

atomic_requirement:
  statement: >-
    При обработке персональных данных оператор должен принимать необходимые правовые, организационные и
    технические меры либо обеспечивать их принятие для защиты персональных данных от неправомерного или
    случайного доступа и иных неправомерных действий.
  normative_strength: direct_statutory_duty

protected_against:
  - unauthorized_or_accidental_access
  - destruction
  - modification
  - blocking
  - copying
  - provision
  - dissemination
  - other_unlawful_actions

applicability:
  applies_when:
    - entity_is_operator_under_152FZ
    - personal_data_is_processed
  exclusions_and_special_cases:
    - must_be_resolved_from_applicable_law_and_context

interpretation:
  status: NOT_YET_VERIFIED
  notes:
    - >-
        This record captures the duty at statutory level only. It does not itself define a concrete technical
        control set; lower-level requirements and applicable subordinate acts must be evaluated separately.

links:
  controls: []
  checks: []
  threats: []
  assets: []

review:
  source_text_checked: true
  independent_normative_review: false
  verified_for_use: false

provenance:
  created_at: "2026-08-12"

agent_rule: >-
  Do not infer a particular product, technology or control from this high-level statutory obligation alone.
