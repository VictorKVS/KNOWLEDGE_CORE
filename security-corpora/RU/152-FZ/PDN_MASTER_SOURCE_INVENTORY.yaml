conflict_candidates:
  - conflict_id: PDN-CONFLICT-CANDIDATE-2026-001
    type: NORMATIVE_ALIGNMENT_REVIEW
    status: REVIEW_REQUIRED
    source_a: SEC-SRC-RU-FZ265-2026
    locator_a: "Article 1 -> 152-FZ Article 12"
    source_b: SEC-SRC-RU-RKN128-2022
    issue: >-
      No. 265-FZ changed the statutory criteria for adequate-protection countries, while Order No. 128 is
      structured around the earlier Convention-party/non-party distinction. This is a review candidate,
      not a finding that Order No. 128 is invalid or repealed.
    current_status_check:
      checked_at: "2026-08-21"
      finding: >-
        Current-law indexes checked on 2026-08-21 still present RKN Order No. 128 as the operative list.
        The Roskomnadzor replacement text prepared 31.07.2026 remains a draft in the evidence found in this pass.
        It must not replace the current node until an enacted official publication identity is found.
      classification: CURRENT_RULE_WITH_REPLACEMENT_DRAFT_WATCH
      semantic_promotion: false
    resolution_gate:
      - compare the operative list and grouping logic against Article 12 effective 26.07.2026
      - monitor the replacement draft but do not treat it as law before official publication
      - search for amending/replacement regulator acts after 26.07.2026
      - classify as compatible, context-dependent, superseded, or genuine conflict with evidence

