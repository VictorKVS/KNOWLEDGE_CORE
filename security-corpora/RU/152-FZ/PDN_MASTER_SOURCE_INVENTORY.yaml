policy:
  proof_floor: >-
    A source may be METADATA_VERIFIED from an official publication identity, but it must not be promoted
    to VERIFIED_FOR_EXTRACTION until an immutable official raw artifact is captured, its exact byte length
    and SHA-256 are recorded, and the source/version locator is independently reviewed.
  reuse_first: true
  immutable_source_required: true
  byte_length_required_for_immutable: true
  sha256_required_for_immutable: true
  current_version_routing_required: true
  delta_reuse_required_after_amendment: true
  acquisition_identity_scope: "document.official_publication_id only for publication-ID captures; registered-route binding for canonical consolidated snapshots"
  current_root_canonical_snapshot_identity_markers_required: true

freshness_alerts:
  - alert_id: PDN-FRESH-2026-001
    status: OPEN_DELTA_REVIEW
    detected_at: "2026-08-20"
    subject: SEC-SRC-RU-152FZ-2026-07-26
    finding: >-
      Federal Law No. 265-FZ of 26.07.2026 amended Article 12 of 152-FZ and entered into force on 26.07.2026,
      except Article 2 of No. 265-FZ, which takes effect on 01.09.2027.
    action: >-
      Route current-date queries to the 26.07.2026 version identity; preserve the 01.09.2025 node only as
      historical evidence and perform structural delta review before reusing Article 12-derived nodes.
  - alert_id: PDN-FUTURE-2027-001
    status: FUTURE_EFFECTIVE_AMENDMENT_REGISTERED
    detected_at: "2026-08-22"
    subject: SEC-SRC-RU-FZ200-2025
    finding: >-
      Federal Law No. 200-FZ of 07.07.2025 amends point 7 of part 2 of Article 10 of 152-FZ by adding
      road-safety legislation to the listed processing grounds. This 152-FZ amendment takes effect on 01.03.2027.
    action: >-
      Preserve the current 26.07.2026 routing until 28.02.2027; pre-register the future delta and do not apply
      it to current-date decisions before 01.03.2027.

