acquisition_blockers:
  - >-
      Byte-exact acquisition via the official publication portal remains operational for source records carrying
      document-level publication IDs, but no new accepted immutable manifest was present in main when this inventory
      revision was written. Existing eight immutable artifacts remain valid.
  - >-
      The current consolidated 152-FZ source card still lacks an approved byte-exact canonical artifact route;
      version identity alone is insufficient for immutable promotion.
  - >-
      PP RF No. 733 must not be treated as current merely from its original 2021 PDF. Current semantics require
      compilation of the amendment chain through No. 2052; exact publication identities/source records for Nos. 2563
      and 806 remain to be registered.

