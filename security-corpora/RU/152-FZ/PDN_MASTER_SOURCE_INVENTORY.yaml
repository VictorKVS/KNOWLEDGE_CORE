conflict_candidates:
  - conflict_id: PDN-CONFLICT-CANDIDATE-2026-001
    type: NORMATIVE_ALIGNMENT_REVIEW
    status: REVIEW_REQUIRED
    source_a: SEC-SRC-RU-FZ265-2026
    locator_a: "Article 1 -> 152-FZ Article 12"
    source_b: SEC-SRC-RU-RKN128-2022
    issue: >-
      No. 265-FZ changed the statutory criteria for adequate-protection countries, while the currently
      registered RKN Order No. 128 is structured around the earlier Convention-party/non-party distinction.
      This is a review candidate, not a finding that Order No. 128 is invalid or repealed.
    current_status_check:
      checked_at: "2026-08-20"
      finding: >-
        Current-law references still identify RKN Order No. 128 as the operative list, while August 2026
        monitoring reports a Roskomnadzor draft replacement list (project ID 169785) prepared after No. 265-FZ.
        A draft is not an enacted primary source and must not replace the current node until official publication.
      classification: CURRENT_RULE_WITH_REPLACEMENT_DRAFT_WATCH
      semantic_promotion: false
    resolution_gate:
      - verify current status/version chain of RKN Order No. 128
      - compare the order's operative list and grouping logic against Article 12 effective 26.07.2026
      - monitor draft project 169785 but do not treat it as law before official publication
      - search for amending/replacement regulator acts after 26.07.2026
      - classify as compatible, context-dependent, superseded, or genuine conflict with evidence

regulatory_watch:
