    finding: >-
      Previously registered current root SEC-SRC-RU-152FZ-2025-09-01 is no longer current. Federal Law
      No. 265-FZ of 26.07.2026 amended Article 12 of 152-FZ and entered into force on 26.07.2026 except
      Article 2 of No. 265-FZ, which takes effect on 01.09.2027.
    action: >-
      Route current-date queries to the 26.07.2026 version identity; preserve the 01.09.2025 node only as
      historical evidence and perform structural delta review before reusing derived nodes.

