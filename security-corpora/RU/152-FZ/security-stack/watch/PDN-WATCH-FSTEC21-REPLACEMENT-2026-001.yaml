project:
  identifier: "169583"
  full_identifier: "01/02/07-26/00169583"
  prepared_date: "2026-07-24"
  developer: "ФСТЭК России"
  public_discussion_ended: "2026-08-08"
  proposed_effective_from: "2026-09-01"
  proposed_repeals:
    - SEC-SRC-RU-FSTEC21-2013
    - SEC-SRC-RU-FSTEC68-2020
    - "point 1 of amendment appendix SEC-SRC-RU-FSTEC49-2017"
current_routing:
  active_source: SEC-SRC-RU-FSTEC21-2013
  active_revision_date: "2020-05-14"
  reason: >-
    Повторная проверка 01.09.2026 после наступления предложенной проектом даты не установила первичного
    доказательства издания окончательного заменяющего приказа, его государственной регистрации в Минюсте России
    и официального опубликования. Официальная карточка приказа №21 продолжает индексироваться ФСТЭК. Актуальный
    проектный трекинг по 01/02/07-26/00169583 по-прежнему описывает объект как проект со статусом завершенного
    обсуждения, тогда как отдельные вторичные публикации формулируют замену как наступившую с 01.09.2026. Этот
    вторичный конфликт формулировок является сигналом для срочной первичной проверки, но не юридическим основанием
    для смены baseline. До прохождения primary-enactment gate активным остается приказ №21 в редакции от 14.05.2020
    с version-chain №49/2017 -> №68/2020.
