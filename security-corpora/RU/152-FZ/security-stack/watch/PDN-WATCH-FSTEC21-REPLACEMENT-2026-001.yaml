schema_version: "1.4"
id: PDN-WATCH-FSTEC21-REPLACEMENT-2026-001
kind: regulatory-watch
status: DRAFT_NOT_ENACTED_IN_VERIFIED_EVIDENCE
jurisdiction: RU
domain: personal_data_security
checked_at: "2026-09-01"
subject: "Проект замены приказа ФСТЭК России № 21"
project:
  identifier: "169583"
  prepared_date: "2026-07-24"
  developer: "ФСТЭК России"
  public_discussion_ended: "2026-08-08"
  proposed_effective_from: "2026-09-01"
  proposed_repeals:
    - SEC-SRC-RU-FSTEC21-2013
    - SEC-SRC-RU-FSTEC68-2020
    - "point 1 of amendment appendix SEC-SRC-RU-FSTEC49-2017"
current_routing:
  active_source: SEC-SRC-RU-FSTEC21-2013
  active_revision_date: "2020-05-14"
  reason: >-
    Повторная проверка 01.09.2026, уже после наступления предложенной проектом даты, не выявила первичного
    доказательства издания окончательного заменяющего приказа, его государственной регистрации в Минюсте России
    и официального опубликования. Индексируемые материалы конца августа по-прежнему ссылаются на проект 169583;
    часть вторичных публикаций пишет о замене как о свершившемся событии, но не приводит номер финального приказа,
    регистрационные данные Минюста и official-publication identity. Поэтому proposed effective date сама по себе
    не закрывает primary-enactment gate. До появления первичного доказательства активным остается приказ №21
    в редакции от 14.05.2020 с version-chain №49/2017 -> №68/2020.
evidence:
  - url: "https://regulation.gov.ru/projects/169583/"
    class: PRIMARY_PROJECT_ROUTE
    observed_at: "2026-09-01"
    note: "Маршрут проекта сохраняется как future-change evidence; сам проект не является доказательством принятого акта."
  - url: "https://cisoclub.ru/prikaz-fstek-21/"
    class: CURRENT_PROJECT_MONITORING_ONLY
    observed_at: "2026-09-01"
    note: >-
      Индексируемый материал августа 2026 продолжает идентифицировать 169583 как проект ФСТЭК и описывает
      предлагаемую отмену №21. Используется только для monitoring/discovery, не как первичное enactment evidence.
  - url: "https://www.credos.ru/news/fstek-proekt-prikaza-pdn-2026/"
    class: CURRENT_PROJECT_MONITORING_ONLY
    observed_at: "2026-09-01"
    note: >-
      Свежий индексируемый материал прямо указывает, что документ находится на стадии проекта и что новые
      требования применимы только после подписания и государственной регистрации. Используется только как
      secondary monitoring signal.
  - url: "https://www.buro152.ru/knowledge/blog/novyj-prikaz-fstek-2026-otmena-21/"
    class: SECONDARY_CONFLICT_SIGNAL_ONLY
    observed_at: "2026-09-01"
    note: >-
      Публикация формулирует отмену №21 как наступающее/свершившееся изменение, но не приводит проверяемую
      идентичность финального акта, Минюст и official-publication identity; не проходит primary-enactment gate.
  - url: "https://publication.pravo.gov.ru/"
    class: PRIMARY_PUBLICATION_SEARCH_ROUTE
    observed_at: "2026-09-01"
    note: >-
      Выполнен поиск первичной официальной публикации заменяющего приказа. В проверенном результате не установлены
      номер и дата финального приказа, регистрация Минюста и official-publication identity, достаточные для замены active node.
proof_gate:
  primary_enactment_required: true
  required_before_activation:
    - final_order_number_and_date
    - minjust_registration_if_required
    - official_publication_identity_or_official_regulator_publication
  semantic_promotion: false
  rule: >-
    Не переносить требования проекта в действующий PDN baseline и не помечать приказ №21 как утратившим силу
    до прохождения primary-enactment gate. Вторичные формулировки «отменяет» или «вступает с 1 сентября» не
    заменяют первичное доказательство принятия, регистрации и официального опубликования.
relations:
  - type: POTENTIAL_FUTURE_REPLACEMENT_OF
    target: SEC-SRC-RU-FSTEC21-2013
    normative_relation: false
