schema_version: "1.3"
id: PDN-WATCH-FSTEC21-REPLACEMENT-2026-001
kind: regulatory-watch
status: DRAFT_NOT_ENACTED_IN_VERIFIED_EVIDENCE
jurisdiction: RU
domain: personal_data_security
checked_at: "2026-08-30"
subject: "Проект замены приказа ФСТЭК России № 21"
project:
  identifier: "169583"
  prepared_date: "2026-07-24"
  developer: "ФСТЭК России"
  public_discussion_ended: "2026-08-08"
  proposed_effective_from: "2026-09-01"
  proposed_repeals:
    - SEC-SRC-RU-FSTEC21-2013
    - SEC-SRC-RU-FSTEC68-2020
    - "point 1 of amendment appendix SEC-SRC-RU-FSTEC49-2017"
current_routing:
  active_source: SEC-SRC-RU-FSTEC21-2013
  active_revision_date: "2020-05-14"
  reason: >-
    На проверке 30.08.2026 поиск по первичным маршрутам не выявил доказательства издания окончательного
    заменяющего приказа, его государственной регистрации в Минюсте России и официального опубликования.
    Индексируемые августовские материалы продолжают ссылаться на документ 169583 как на проект. Одновременно
    выявлен вторичный материал от 25.08.2026 с формулировкой об «отмене приказа №21», однако в собственном
    тексте он ссылается на опубликованный 24.07.2026 проект и не предоставляет идентичность финального акта.
    Такой конфликт вторичных формулировок не проходит primary-enactment gate. Приказ №21 поэтому не помечается
    утратившим силу, а предложенная проектом дата 01.09.2026 не используется как доказанная дата вступления
    финального заменяющего акта в силу.
evidence:
  - url: "https://regulation.gov.ru/projects/169583/"
    class: PRIMARY_PROJECT_ROUTE
    observed_at: "2026-08-30"
    note: "Маршрут проекта сохраняется как future-change evidence; сам проект не является доказательством принятого акта."
  - url: "https://habr.com/ru/articles/933908/"
    class: CURRENT_PROJECT_MONITORING_ONLY
    observed_at: "2026-08-30"
    note: >-
      Августовский материал идентифицирует документ как проект, опубликованный 24.07.2026 под ID 169583,
      с завершением общественного обсуждения 08.08.2026. Используется только для discovery/monitoring.
  - url: "https://www.buro152.ru/knowledge/blog/novyj-prikaz-fstek-2026-otmena-21/"
    class: SECONDARY_CONFLICT_SIGNAL_ONLY
    observed_at: "2026-08-30"
    note: >-
      Заголовок/подача формулируют отмену приказа №21 как свершившееся изменение, но сам материал указывает,
      что ФСТЭК 24.07.2026 опубликовала проект новых требований. Финальный номер, Минюст и official-publication
      identity не приводятся; материал не повышается до доказательства enactment.
  - url: "https://safe.cnews.ru/news/line/2026-08-10_infrastruktura_astra_cloud_proshla"
    class: CURRENT_PRACTICE_CORROBORATION_ONLY
    observed_at: "2026-08-29"
    note: >-
      Материал от 10.08.2026 сообщает об аттестации ИСПДн по приказу №21; это не заменяет нормативный status-gate,
      но подтверждает, что в августовской практике приказ продолжает использоваться.
proof_gate:
  primary_enactment_required: true
  required_before_activation:
    - final_order_number_and_date
    - minjust_registration_if_required
    - official_publication_identity_or_official_regulator_publication
  semantic_promotion: false
  rule: >-
    Не переносить требования проекта в действующий PDN baseline и не помечать приказ №21 как утратившим силу
    до прохождения primary-enactment gate. Вторичные формулировки «отменяет» или «вступает с 1 сентября» не
    заменяют первичное доказательство принятия, регистрации и официального опубликования.
relations:
