  reason: >-
    На проверке 25.08.2026 свежие материалы по-прежнему идентифицируют документ № 169583 как проект. Первичное
    доказательство издания окончательного приказа, его регистрации в Минюсте России и официального опубликования
    в этом проходе не найдено. Поэтому приказ № 21 не помечается утратившим силу, а предложенная проектом дата
    01.09.2026 не используется как доказанная дата вступления финального акта в силу.
