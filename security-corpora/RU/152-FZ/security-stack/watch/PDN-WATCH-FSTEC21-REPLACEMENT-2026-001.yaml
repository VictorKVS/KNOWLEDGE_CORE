current_routing:
  active_source: SEC-SRC-RU-FSTEC21-2013
  active_revision_date: "2020-05-14"
  reason: >-
    Проверка 02.09.2026 в 05:07Z не установила первичного доказательства издания окончательного заменяющего
    приказа, его государственной регистрации в Минюсте России и официального опубликования. Актуально
    индексируемый трекинг проекта 01/02/07-26/00169583 продолжает описывать его как «Проект ведомственного акта»
    со статусом «Обсуждение завершено» и датой завершения 08.08.2026; отраслевой обзор июля 2026 отдельно
    указывает, что документ является проектом и не устанавливает действующие обязательные требования.
    Одновременно существуют вторичные публикации, трактующие 01.09.2026 как дату отмены. Этот конфликт остается
    сигналом для поиска первичного финального НПА, но не закрывает primary-enactment gate. Формулировка
    «не установлено первичное доказательство» не является доказательством отсутствия финального акта.
