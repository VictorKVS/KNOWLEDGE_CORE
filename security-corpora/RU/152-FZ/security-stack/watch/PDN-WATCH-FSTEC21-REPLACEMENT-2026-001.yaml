      «Обсуждение завершено», публикация 24.07.2026, завершение обсуждения 08.08.2026 и ссылается на regulation.gov.ru.
      Используется только как discovery/monitoring signal, не как enactment evidence.
  - url: "https://delret.ru/reviews/cyber-news/iyul-2026-goda-vypusk-7"
    class: CURRENT_PROJECT_MONITORING_ONLY
    observed_at: "2026-09-02"
    note: "Обзор прямо отмечает, что 169583 является проектом и не устанавливает действующие обязательные требования."
  - url: "https://habr.com/ru/news/1066888/"
    class: SECONDARY_PROJECT_TEXT_SUMMARY
    observed_at: "2026-09-02"
    note: "Подтверждает proposed date 01.09.2026 в тексте проекта; не используется как доказательство enactment."
  - url: "https://publication.pravo.gov.ru/"
    class: PRIMARY_PUBLICATION_SEARCH_ROUTE
    observed_at: "2026-09-02"
    note: >-
      В текущем ограниченном поиске не установлены номер/дата финального заменяющего приказа, регистрация
      Минюста и official-publication identity, достаточные для замены active node. Отсутствие найденного
      результата не является доказательством отсутствия акта и поэтому watch остается активным.
proof_gate:
  primary_enactment_required: true
  required_before_activation:
    - final_order_number_and_date
    - minjust_registration_if_required
    - official_publication_identity_or_official_regulator_publication
  semantic_promotion: false
  secondary_claim_conflict_signal: true
  confirmed_primary_conflict: false
  rule: >-
    Не переносить требования проекта в действующий PDN baseline и не помечать приказ №21 как утратившим силу
    до прохождения primary-enactment gate. Вторичные формулировки «отменяет» или «вступает с 1 сентября» не
    заменяют первичное доказательство принятия, регистрации и официального опубликования.
