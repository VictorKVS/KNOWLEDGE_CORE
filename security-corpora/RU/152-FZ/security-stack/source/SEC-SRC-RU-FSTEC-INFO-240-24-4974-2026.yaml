  temporal_status: CURRENT_CERTIFICATION_TRANSITION_EVIDENCE
  status_note: >-
    Сообщение уточняет переход к Методике выявления уязвимостей и недекларированных возможностей в ПО,
    утвержденной ФСТЭК России 12.05.2026. Сертификация средств защиты информации по решениям ФСТЭК России,
    выданным после 01.08.2026, а также сертификационные испытания, связанные с внесением изменений в средства
    защиты информации, с 01.08.2026 должны проводиться по новой Методике.
  grandfathering_note: >-
    Работы по сертификации и испытаниям при внесении изменений допускается завершить по Методике от 25.12.2020,
    если решения и (или) договоры (иные документы), на основании которых проводятся испытания, приняты или заключены
    до 01.08.2026. Это переходное правило сертификационного контура, а не универсальная дата изменения мер ИСПДн.
