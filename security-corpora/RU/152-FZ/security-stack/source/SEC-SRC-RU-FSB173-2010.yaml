  version_chain_note: >-
    Официальный перечень нормативных правовых актов ФСБ России повторно найден 01.09.2026:
    приказ ФСБ №173 указан с регистрацией Минюстом №17350, публикацией в БНА ФОИВ №24
    от 14.06.2010 и вступлением в силу 25.06.2010. Консолидированная редакция учитывает
    приказы ФСБ России от 30.08.2012 №440, 28.12.2012 №683, 10.01.2013 №7 и 25.03.2013 №157.
