  number: "б/н"
  adopted_date: "2022-10-28"
  current_revision_date: "2022-10-28"
  checked_at: "2026-08-23"
  status_note: >-
    Методика определяет порядок и содержание тестирования обновлений безопасности программных и
    программно-аппаратных средств. Ее актуальное использование подтверждается ссылкой из действующей
    Методики оценки критичности уязвимостей ФСТЭК от 30.06.2025 (п. 23) и из Руководства по управлению
    уязвимостями от 17.05.2023. Отдельного акта о прекращении применения этой Методики не выявлено.
  scope_note: >-
    Документ является методическим источником для процесса тестирования обновлений в тех режимах,
    где соответствующий процесс управления уязвимостями/защиты информации применим. Сам по себе он
    не создает универсальную обязанность для любой частной ИСПДн.
