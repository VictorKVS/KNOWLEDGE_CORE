  version_chain_note: >-
    Приказ №547 с 30.01.2026 установил новый порядок информирования ФСБ России о компьютерных атаках
    и компьютерных инцидентах для субъектов КИИ и органов/организаций, охваченных частью 4 статьи 9
    187-ФЗ. Пунктом 2 приказа признаны утратившими силу приказ ФСБ России от 19.06.2019 №282 и
    изменяющий его приказ ФСБ России от 07.07.2022 №348. Для PDN-ветки этот version-chain учитывается
    только при одновременной доказанной применимости соответствующего режима ГосСОПКА/КИИ.
