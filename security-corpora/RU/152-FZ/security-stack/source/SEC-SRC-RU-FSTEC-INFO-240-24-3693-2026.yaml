  Информационное сообщение ФСТЭК России от 28.05.2026 № 240/24/3693
  «Об утверждении Методики выявления уязвимостей и недекларированных возможностей в программном обеспечении»
jurisdiction: RU
issuer: "ФСТЭК России"
document:
  type: information_notice
  number: "240/24/3693"
  adopted_date: "2026-05-28"
  checked_at: "2026-08-27"
  temporal_status: CURRENT_APPROVAL_AND_VERSION_TRANSITION_EVIDENCE
  status_note: >-
    Сообщение фиксирует утверждение ФСТЭК России 12.05.2026 Методики выявления уязвимостей и
    недекларированных возможностей в программном обеспечении. Методика ориентирована на исследования,
    выполняемые испытательными лабораториями и разработчиками в рамках сертификационных испытаний средств
    защиты информации и при внесении изменений в ранее сертифицированные средства. Сообщение также прямо
    фиксирует, что положения одноименного методического документа, утвержденного ФСТЭК России 25.12.2020,
    в связи с утверждением новой Методики не применяются.
  secure_software_note: >-
    Разработчикам программного обеспечения средств защиты информации рекомендуется использовать положения
    Методики для внутренних процессов жизненного цикла ПО в соответствии с ГОСТ Р 56939-2024. Рекомендация
    разработчикам не превращается в универсальную обязанность любого оператора ИСПДн.
