  pdn_link: >-
    Учитывать только если организация независимо осуществляет лицензируемую деятельность по разработке и производству
    средств защиты конфиденциальной информации в пределах компетенции ФСТЭК. Эксплуатация ИСПДн, использование СЗИ
    или наличие обязанности защищать ПДн сами по себе не доказывают применимость приказа № 164.
  no_requirement_propagation: >-
    Не переносить процедуры лицензионного контроля разработчиков/производителей СЗИ в общий baseline оператора ПДн
    ПП № 1119 / приказа ФСТЭК № 21. Не смешивать эту ветку с лицензированием ТЗКИ по приказу № 163 или с СКЗИ/ФСБ.
