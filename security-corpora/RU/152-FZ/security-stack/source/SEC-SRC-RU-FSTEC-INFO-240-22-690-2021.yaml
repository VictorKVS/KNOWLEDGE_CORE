  status_note: >-
    Сообщение фиксирует утверждение ФСТЭК России 05.02.2021 Методики оценки угроз безопасности информации,
    ее применение к системам и сетям, включая ИСПДн в соответствующей области, сохранение ранее утвержденных
    моделей угроз до развития/модернизации системы и прекращение применения методики ПДн 2008 года для оценки
    угроз. Это переходное/разъяснительное первичное сообщение, а не самостоятельный источник криптографических
    требований.
