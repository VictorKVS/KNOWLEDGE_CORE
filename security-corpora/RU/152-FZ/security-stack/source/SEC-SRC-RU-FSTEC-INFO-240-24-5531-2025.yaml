  status_note: >-
    Официальное сообщение подтверждает, что приказом ФСТЭК России от 11.06.2025 № 205,
    зарегистрированным Минюстом России 10.09.2025 № 83505, изменены Требования доверия,
    утвержденные приказом ФСТЭК России № 76. Изменение исключило ряд требований о наличии
    аппаратных платформ и компонентов в едином реестре радиоэлектронной продукции.
