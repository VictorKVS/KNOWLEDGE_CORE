  current_revision_note: >-
    Действующая проверенная базовая редакция по состоянию на 30.08.2026 остается редакцией от 14.05.2020;
    amendment chain содержит приказы ФСТЭК России №49/2017 и №68/2020. Проект замены, подготовленный
    24.07.2026 (идентификатор проекта 169583), предлагает отменить приказ №21, пункт 1 приложения к №49/2017
    и приказ №68/2020 с 01.09.2026, однако свежая проверка 30.08.2026 не выявила первичного доказательства
    издания, государственной регистрации в Минюсте и официального опубликования заменяющего приказа.
    Противоречивые вторичные формулировки об «отмене №21» зарегистрированы только как monitoring signal:
    материал не проходит primary-enactment gate, если внутри он ссылается лишь на проект 169583.
