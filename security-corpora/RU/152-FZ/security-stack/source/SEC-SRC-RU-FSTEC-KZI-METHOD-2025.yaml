title: "Методический документ ФСТЭК России от 11.11.2025 «Методика оценки показателя состояния технической защиты информации в информационных системах и обеспечения безопасности значимых объектов критической информационной инфраструктуры Российской Федерации»"
jurisdiction: RU
issuer: "ФСТЭК России"
document:
  type: methodical_document
  number: "б/н"
  adopted_date: "2025-11-11"
  current_revision_date: "2025-11-11"
  checked_at: "2026-08-24"
  status_note: >-
    Актуальный методический документ ФСТЭК России, определяющий показатель текущего состояния защищенности КЗИ,
    порядок его расчета и подтверждающие материалы. Текущий текст, сверенный 24.08.2026 по публичным текстовым
    интерфейсам, устанавливает плановую оценку не реже одного раза в шесть месяцев и внеочередные оценки по
    перечисленным событиям. Методика применяется в охватываемых ею органах (организациях) и не является
    универсальным самостоятельным требованием к любой частной ИСПДн.
  version_chain_note: >-
    Пункт 7 прямо устанавливает, что в связи с утверждением Методики от 11.11.2025 для оценки текущего состояния
    не применяется предшествующая Методика ФСТЭК России от 02.05.2024. Это замещение ограничено данным
    методическим маршрутом и не означает отмену иных НПА ФСТЭК.
