  adopted_date: "2026-08-07"
  current_revision_date: "2026-08-07"
  checked_at: "2026-08-26"
  status_note: >-
    Актуальная методика ФСТЭК России, прямо включающая операторов ИСПДн в область применения оценки зрелости
    деятельности по обеспечению безопасности персональных данных. Методика различает текущий и целевой уровни
    зрелости и содержит рекомендуемые целевые уровни для ИСПДн разных уровней защищенности.
  version_chain_note: >-
    Методика использует действующие требования ФСТЭК по соответствующим режимам, включая приказ ФСТЭК России
    № 21 для ИСПДн; значения целевых уровней из пункта 11 сформулированы как рекомендации и не должны
    превращаться в обязательные минимумы без отдельного нормативного основания.
