  status_note: >-
    Методика ФСТЭК России от 07.08.2026 зарегистрирована как текущий PDN-релевантный методический источник,
    прямо включающий операторов ИСПДн в область применения оценки зрелости деятельности по обеспечению
    безопасности персональных данных. Методика различает текущий и целевой уровни зрелости и содержит
    рекомендуемые целевые уровни для ИСПДн разных уровней защищенности. Проверка 02.09.2026 не установила
    отдельной заменяющей редакции. Exact-byte retry 02.09.2026 в 05:07:17Z выполнен уже по точному
    разрешенному официальному PDF-маршруту ФСТЭК, но не дошел до HTTP из-за DNS-resolution failure среды.
  version_chain_note: >-
    Верифицирована редакция от 07.08.2026. Методика использует действующие требования ФСТЭК по соответствующим
    режимам, включая приказ ФСТЭК России №21 для ИСПДн; значения целевых уровней из пункта 11 сформулированы
    как рекомендации и не превращаются в обязательные минимумы без отдельного нормативного основания.
