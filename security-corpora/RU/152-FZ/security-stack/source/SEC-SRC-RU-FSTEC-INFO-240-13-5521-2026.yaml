title: >-
  Информационное сообщение ФСТЭК России от 11.08.2026 № 240/13/5521
  «Об утвержденных новых редакциях перечней оборудования, необходимого для выполнения работ и (или) услуг
  по лицензированию деятельности по технической защите конфиденциальной информации и деятельности по
  разработке и производству средств защиты конфиденциальной информации»
