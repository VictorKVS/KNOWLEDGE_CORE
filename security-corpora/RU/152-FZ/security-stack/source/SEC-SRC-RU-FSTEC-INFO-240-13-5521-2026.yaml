  temporal_status: CURRENT_STATUS_AND_TRANSITION_EVIDENCE
  status_note: >-
    Сообщение фиксирует утверждение новых редакций двух перечней оборудования: перечня 10.08.2026 для лицензирования
    ТЗКИ по ПП РФ № 79 и перечня 11.08.2026 для разработки и производства средств защиты конфиденциальной информации
    по ПП РФ № 171. В PDN Security Stack регистрируется только связь с контуром ПП № 79; соседний контур ПП № 171
    не импортируется в обязанности оператора ПДн без отдельного applicability edge.
  transition_note: >-
    Свежие отраслевые правовые публикации, ссылающиеся на сообщение ФСТЭК, указывают: новые перечни для соискателей
    лицензий вводятся с 01.12.2026, а действующие лицензиаты должны привести оснащение в соответствие до 01.03.2027.
    До immutable capture первичного сообщения эти даты хранятся как cross-verified transition metadata.
