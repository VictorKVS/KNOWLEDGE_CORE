  status_note: >-
    Официальная страница ФСБ России от 21.06.2016 повторно найдена 01.09.2026 и прямо включает
    рекомендации №149/7/2/6-432 в нормативно-методический набор безопасности ПДн вместе с
    приказом №378, ПКЗ-2005 и Инструкцией ФАПСИ №152. Текущий научно-технический индекс ФСБ
    также продолжает публиковать отдельную карточку этих рекомендаций датой 19.05.2015.
    Эти две официальные поверхности подтверждают identity и исторический статус в наборе, но
    сам факт сохранения страницы не заменяет отдельную проверку отсутствия поздней отмены/замены.
    Поэтому source остается review_required и применяется только в bounded SKZI/threat-modeling контуре.
