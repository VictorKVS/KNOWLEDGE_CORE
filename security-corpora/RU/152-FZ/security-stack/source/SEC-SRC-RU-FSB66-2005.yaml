  current_revision_note: >-
    Официальный перечень нормативных правовых актов ФСБ России повторно проверен 30.08.2026:
    приказ ФСБ №66 указан с регистрацией Минюстом №6382, вступлением в силу 30.03.2005
    и изменением приказом ФСБ №173 от 12.04.2010. Официальный нормативно-методический
    материал ФСБ по безопасности персональных данных также относит ПКЗ-2005 к криптографическому
    контуру вместе с приказом №378 и инструкцией ФАПСИ №152. Для доказанной ветки №173
    релевантен только пункт 1 приложения к №173: он изменяет пункт 50 ПКЗ-2005 и сноску к нему.
    Последующие приказы 2012-2013 годов погасили пункты 2-8 приложения №173, но не пункт 1.
