  status_note: >-
    Сообщение ФСТЭК России подтверждает утверждение 25.06.2025 Методики испытаний систем
    защиты информации информационных систем методами тестирования на проникновение. Методика
    применяется в аттестации, контроле защищенности и оценке соответствия; обязательная область,
    прямо описанная в сообщении, относится к государственным и перечисленным публичным системам
    1 и 2 классов защищенности при указанных условиях подключения/взаимодействия. В иных случаях
    решение о применении принимает обладатель информации, заказчик или оператор системы.
