  adopted_date: "2023-05-17"
  current_revision_date: "2023-05-17"
  checked_at: "2026-08-23"
  status_note: >-
    Руководство применяется государственными органами и организациями, включая субъектов КИИ,
    являющихся операторами информационных (автоматизированных) систем, при выполнении требований
    по защите информации, а также в иных случаях, когда его применение следует из НПА или
    методических документов ФСТЭК России. Само по себе Руководство не доказывает универсальную
    обязанность для любой частной ИСПДн.
  version_chain_note: >-
    Руководство 2023 года ссылается на Методику оценки критичности уязвимостей от 28.10.2022.
    Методика ФСТЭК от 30.06.2025 прямо прекратила применение версии 2022 года; поэтому текущая
    реализация шага оценки критичности должна разрешать эту зависимость через актуальный successor,
    а не считать ссылку Руководства фиксацией старой редакции.
