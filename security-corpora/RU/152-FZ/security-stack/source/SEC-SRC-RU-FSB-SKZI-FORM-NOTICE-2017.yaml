title: "Информационное сообщение ФСБ России от 15.06.2017 «О неукоснительном соблюдении операторами персональных данных требований формуляров на СКЗИ»"
jurisdiction: RU
issuer: "ФСБ России"
document:
  type: informational_notice
  adopted_date: "2017-06-15"
  checked_at: "2026-08-25"
  current_status: OFFICIAL_FSB_GUIDANCE_PAGE_STILL_PUBLICLY_INDEXED
  status_note: >-
    Официальная страница ФСБ России, повторно обнаруженная 25.08.2026 на домене fsb.ru,
    обращает внимание операторов персональных данных на обязательность соблюдения требований
    формуляров на СКЗИ. В частности, если формуляр конкретного СКЗИ требует оценки влияния среды
    функционирования, ФСБ связывает выполнение такой оценки и наличие положительного заключения
    ФСБ с условиями действия сертификата на СКЗИ. Это информационное сообщение/разъяснение,
    а не самостоятельный нормативный правовой акт и не универсальное требование применять СКЗИ.
  version_chain_note: >-
    Сообщение применяется только как официальное разъяснение эксплуатационного контекста ПКЗ-2005
    и формуляра конкретного СКЗИ. Оно не заменяет независимую проверку актуальной редакции приказа
    ФСБ №66, сертификата, формуляра конкретного СКЗИ и действующей редакции КоАП РФ.
