findings:
  - type: SCOPE_BOUNDARY
    statement: >-
      For personal data processed in state information systems, the message explains the relationship between
      the state-system protection requirements and PP RF No.1119. This is evidence for a conditional public-system
      overlay and not a basis to import Order No.17 into every private ISPDn.
  - type: EFFECTIVENESS_ASSESSMENT
    statement: >-
      The message explains that the form of effectiveness assessment and resulting documents is not fixed by
      Order No.21 and may be determined by the operator, while assessment may be combined with attestation where
      that separate regime applies.
  - type: METHODICAL_BOUNDARY
    statement: >-
      STR-K and RD AS references are retained only in the contexts described by the message and must not be
      transformed into universal generic PDN requirements.
