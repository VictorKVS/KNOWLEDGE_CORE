  publication_date: "2016-06-21"
  checked_at: "2026-09-01"
  current_status: OFFICIAL_FSB_NOTICE_STILL_PUBLICLY_AVAILABLE
  status_note: >-
    Официальная страница ФСБ России от 21.06.2016 повторно найдена 01.09.2026. Она прямо фиксирует,
    что методические материалы 2008 года, разработанные под утратившее силу постановление Правительства РФ №781,
    утратили актуальность, и перечисляет нормативно-методический набор ФСБ для безопасности персональных данных
    на дату сообщения: приказ ФСБ №378, ПКЗ-2005 (приказ ФСБ №66), Инструкцию ФАПСИ №152 и рекомендации
    8 Центра ФСБ №149/7/2/6-432 от 31.03.2015. Текущий научно-технический индекс ФСБ также продолжает
    публиковать карточку рекомендаций 2015 года. Это первичное историческое свидетельство состава набора на
    21.06.2016 и актуальности самих официальных страниц, но не самостоятельное доказательство отсутствия всех
    последующих изменений/отмен по состоянию на 2026 год.
