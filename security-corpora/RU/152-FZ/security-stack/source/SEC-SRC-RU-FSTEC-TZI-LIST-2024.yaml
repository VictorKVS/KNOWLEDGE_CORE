  status_note: >-
    Перечень от 10.12.2024 продолжает учитываться в лицензионном контуре ТЗКИ: официальный
    текущий перечень нормативных правовых актов ФСТЭК по состоянию на 10.06.2026 сохраняет
    ссылку на этот документ. Это подтверждает актуальность Перечня именно как лицензионного
    контекста, но не превращает перечисленные в нем документы в универсальные обязанности
    любого оператора ИСПДн.
  scope_note: >-
    Применимость ограничена выполнением работ и (или) оказанием услуг, подпадающих под Положение
    о лицензировании ТЗКИ (ПП РФ № 79). Само наличие ИСПДн не доказывает, что оператор выполняет
    лицензируемые работы или услуги.
