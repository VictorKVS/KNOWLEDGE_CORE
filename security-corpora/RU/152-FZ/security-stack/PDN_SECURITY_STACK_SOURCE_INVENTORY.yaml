context_splits:
  - id: PDN-STACK-CONTEXT-2026-001
    status: CONTEXT_DEPENDENT_NOT_CONFLICT
    sources:
      - SEC-SRC-RU-FSTEC117-2025
      - SEC-SRC-RU-FSB117-2025
    finding: >-
      The two Order No. 117 documents regulate complementary non-cryptographic and cryptographic protection
      in a bounded public-sector system scope. They must not be merged into a universal private-ISPDn duty.
  - id: PDN-STACK-CONTEXT-2026-002
    status: CONTEXT_DEPENDENT_NOT_CONFLICT
    sources:
      - SEC-SRC-RU-FSB378-2014
      - SEC-SRC-RU-FSB66-2005
      - SEC-SRC-RU-FAPSI152-2001
    finding: >-
      Order No. 378, PKZ-2005 and FAPSI No. 152 occupy different layers: ISPDn crypto measures, crypto-product
      lifecycle, and crypto handling/operation. They must remain separate applicability paths until compiled
      source locators prove a specific dependency for a case.
  - id: PDN-STACK-CONTEXT-2026-003
    status: CONTEXT_DEPENDENT_NOT_CONFLICT
    sources:
      - SEC-SRC-RU-PP313-2012
      - SEC-SRC-RU-PP79-2012
    finding: >-
      Crypto and TZI licensing rules govern defined licensed works/services. Mere operation of an ISPDn or mere
      use of certified protection tools does not by itself prove that the PDN operator must hold these licences.
  - id: PDN-STACK-CONTEXT-2026-004
    status: CONTEXT_DEPENDENT_NOT_CONFLICT
    sources:
      - SEC-SRC-RU-PP313-2012
      - SEC-SRC-RU-FSB142-2023
      - SEC-SRC-RU-FSB545-2024
    finding: >-
      FSB Orders No. 142/2023 and 545/2024 describe the licensing-control procedure/version chain for activities
      within FSB competence. They do not create a universal licence duty for every PDN operator or every SKZI user.
  - id: PDN-STACK-CONTEXT-2026-005
    status: CONTEXT_DEPENDENT_NOT_CONFLICT
    sources:
      - SEC-SRC-RU-PP79-2012
      - SEC-SRC-RU-FSTEC163-2025
      - SEC-SRC-RU-FSTEC487-2025
    finding: >-
      FSTEC Orders No. 163/2025 and 487/2025 describe the TZI licensing-control procedure/version chain.
      They do not create a universal licence duty for every PDN operator merely because an ISPDn is operated.
  - id: PDN-STACK-CONTEXT-2026-006
    status: CONTEXT_DEPENDENT_NOT_CONFLICT
    sources:
      - SEC-SRC-RU-PP608-1995
      - SEC-SRC-RU-FSTEC55-2018
      - SEC-SRC-RU-FSTEC121-2021
      - SEC-SRC-RU-FSTEC172-2022
      - SEC-SRC-RU-FSTEC9-2026
    finding: >-
      PP No. 608 provides Government certification-framework context, while FSTEC Order No. 55 and its amendments
      define the FSTEC certification-system framework for protection means. These sources must not be transformed
      into a universal standalone requirement for every PDN operator to certify every used tool.
  - id: PDN-STACK-CONTEXT-2026-007
    status: CONTEXT_DEPENDENT_NOT_CONFLICT
    sources:
      - SEC-SRC-RU-FSTEC-MATURITY-METHOD-2026
      - SEC-SRC-RU-PP1119-2012
      - SEC-SRC-RU-FSTEC21-2013
    finding: >-
      The 07.08.2026 maturity method directly includes ISPDn operators, but its point 11 target maturity values are
      recommendations. They must not be transformed into new mandatory protection-level requirements beyond PP1119/FSTEC21.
  - id: PDN-STACK-CONTEXT-2026-008
    status: CONTEXT_DEPENDENT_NOT_CONFLICT
    sources:
      - SEC-SRC-RU-FSTEC-PROTECTION-MEASURES-METHOD-2026
      - SEC-SRC-RU-FSB378-2014
    finding: >-
      The 12.04.2026 FSTEC protection-measures method is guarded to its public/KII scope and expressly leaves
      cryptographic protection/SKZI measures to FSB requirements; the two branches must not be silently merged.

