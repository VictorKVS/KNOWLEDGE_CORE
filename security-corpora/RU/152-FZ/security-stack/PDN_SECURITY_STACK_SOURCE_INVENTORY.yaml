context_splits:
  - id: PDN-STACK-CONTEXT-2026-001
    status: CONTEXT_DEPENDENT_NOT_CONFLICT
    sources:
      - SEC-SRC-RU-FSTEC117-2025
      - SEC-SRC-RU-FSB117-2025
    finding: >-
      The two Order No. 117 documents regulate complementary non-cryptographic and cryptographic protection
      in a bounded public-sector system scope. They must not be merged into a universal private-ISPDn duty.
  - id: PDN-STACK-CONTEXT-2026-002
    status: CONTEXT_DEPENDENT_NOT_CONFLICT
    sources:
      - SEC-SRC-RU-FSB378-2014
      - SEC-SRC-RU-FSB66-2005
      - SEC-SRC-RU-FAPSI152-2001
    finding: >-
      Order No. 378, PKZ-2005 and FAPSI No. 152 occupy different layers: ISPDn crypto measures, crypto-product
      lifecycle, and crypto handling/operation. They must remain separate applicability paths until compiled
      source locators prove a specific dependency for a case.
  - id: PDN-STACK-CONTEXT-2026-003
    status: CONTEXT_DEPENDENT_NOT_CONFLICT
    sources:
      - SEC-SRC-RU-PP313-2012
      - SEC-SRC-RU-PP79-2012
    finding: >-
      Crypto and TZI licensing rules govern defined licensed works/services. Mere operation of an ISPDn or mere
      use of certified protection tools does not by itself prove that the PDN operator must hold these licences.
  - id: PDN-STACK-CONTEXT-2026-004
    status: CONTEXT_DEPENDENT_NOT_CONFLICT
    sources:
      - SEC-SRC-RU-PP313-2012
      - SEC-SRC-RU-FSB142-2023
      - SEC-SRC-RU-FSB545-2024
    finding: >-
      FSB Orders No. 142/2023 and 545/2024 describe the licensing-control procedure/version chain for activities
      within FSB competence. They do not create a universal licence duty for every PDN operator or every SKZI user.

