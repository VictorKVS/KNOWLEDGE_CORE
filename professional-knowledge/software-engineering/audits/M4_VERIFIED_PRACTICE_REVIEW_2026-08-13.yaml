senior_review:
  verdict: ACCEPT_WITH_RESTRICTIONS
  strongest_objection: local boundedness does not prove aggregate resource safety across many dependencies
  viable_alternatives: [keep_single_operation_scope, add_future_aggregate_resource_model, disable_automatic_recovery_when_aggregate_budget_is_unknown]
  improved_option_or_reason_no_better_option_found: keep the present bounded scope and escalate aggregate cases rather than inventing system-level safety
  reversal_conditions: [scope_expands_to_fanout_workflows, observed_duplicate_effect, caller_deadline_changes, attempt_budget_changes]
skeptical_critic:
  verdict: ACCEPT_AFTER_CHALLENGE
  strongest_objection: positive cases could be misread as universal guidance
  viable_alternatives: [no_automatic_action, server_directed_delay_when_safe, bounded_client_action_when_safe, application_level_mechanism_when_transport_semantics_are_insufficient]
  improved_option_or_reason_no_better_option_found: preserve an explicit adversarial out_of_scope case so the bounded logic cannot be generalized silently
  reversal_conditions: [new_authoritative_semantics, reproducibility_failure, observed_harm_under_accepted_path]
cross_domain_review:
  verdict: ACCEPT_WITH_ESCALATION_BOUNDARY
  boundary: aggregate resource safety is outside this bounded slice
preserved_dissent:
  - {position: require_production_statistics_for_any_M4, resolution: rejected_for_deterministic_decision_safety_claim_only}
  - {position: aggregate_case_should_block_all_M4, resolution: restrict_scope_and_escalate_instead}
promotion_verdict:
