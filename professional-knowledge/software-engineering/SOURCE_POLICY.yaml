schema_version: 2
domain_id: SOFTWARE_ENGINEERING
policy_id: SWENG-SOURCE-POLICY-0001
status: ACTIVE_M1
source_registry_ref: professional-knowledge/software-engineering/SOURCE_REGISTRY.yaml
latest_source_review_ref: professional-knowledge/software-engineering/audits/M1_SOURCE_REVIEW_2026-08-13.yaml
source_classes:
  SPECIFICATION: normative_behavior_and_interoperability
  OFFICIAL_PRODUCT_DOCUMENTATION: version_specific_supported_behavior_and_limits
  PROJECT_REQUIREMENT: binding_local_context
  REPRODUCIBLE_MEASUREMENT: empirical_comparison
  OPERATING_EVIDENCE: observed_failure_and_reliability_behavior
  RESEARCH: methods_and_generalized_findings_with_stated_limits
  PROFESSIONAL_REFERENCE: interpretation_and_method_context
  SECONDARY_COMMUNITY: discovery_and_context_until_corroborated
  MODEL_OUTPUT: discovery_candidate_only
  VENDOR_MARKETING: discovery_only
admission_requirements:
  common: [stable_source_identity, source_class, version_or_observed_at_when_material, provenance_locator, known_scope_and_limitations, freshness_and_reassessment_state]
  empirical: [environment, workload, measurement_method, tool_versions, reproducibility_status]
  product_documentation: [product_or_library_version, official_origin]
  research: [bibliographic_identity, method_or_scope_limitations]
claim_support_rules:
  normative_claim: use_applicable_specification_or_binding_requirement
  product_behavior_claim: prefer_official_versioned_documentation_plus_reproducible_check
  performance_claim: requires_context_matched_reproducible_measurement_for_material_decisions
  reliability_claim: documentation_alone_is_not_observed_reliability
  comparative_vendor_claim: vendor_material_is_not_independent_terminal_evidence
  best_practice_claim: rewrite_as_contextual_pattern_with_source_applicability_tradeoffs_and_failure_modes
conflict_resolution: [identify_claim_type, pin_version_and_environment, preserve_contextual_conflict, prefer_context_matched_reproducibility_for_empirical_disputes, escalate_unresolved_material_conflict]
freshness:
  versioned_technical_source: reassess_on_version_change_or_lifecycle_change
  benchmark: reassess_on_workload_environment_or_dependency_change
  incident_history: append_only_timestamped_observation
  project_standard: reassess_on_revision
prohibited_shortcuts:
  - model_output_promoted_directly_to_VERIFIED
  - search_result_used_as_terminal_source
  - benchmark_without_workload_context_generalized_to_all_cases
  - documentation_for_one_version_applied_to_another_without_compatibility_evidence
  - popularity_used_as_substitute_for_requirements_or_measurement
  - source_admission_treated_as_professional_rule_verification
