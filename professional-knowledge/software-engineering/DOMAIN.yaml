purpose: evidence-backed software engineering decisions rather than opinion-based technology selection
scope: [software_architecture_and_design, language_runtime_and_API_contracts, algorithms_data_structures_and_concurrency, persistence_and_data_access, testing_verification_and_measurement, performance_reliability_maintainability, build_packaging_dependency_lifecycle]
non_scope: [adjacent_domain_regulatory_truth, infrastructure_operations, cloud_platform_operations, product_priority_authority, organizational_authority]
ontology:
  primary_entities: [REQUIREMENT, CONSTRAINT, QUALITY_ATTRIBUTE, SOURCE, CLAIM, PATTERN, ALGORITHM, API_CONTRACT, DEPENDENCY, METRIC, BENCHMARK, FAILURE_MODE, OPTION, DECISION_RULE, IMPLEMENTATION, TEST, OUTCOME]
  principal_relations: [requirement_constrains_option, source_supports_claim, pattern_applies_under_context, metric_measures_quality_attribute, benchmark_estimates_option_under_workload, failure_mode_challenges_option, decision_selects_option, test_verifies_implementation_against_decision, outcome_reassesses_prior_decision]
source_taxonomy:
  contractual_behavior: [language_specifications, protocol_standards, official_versioned_documentation, explicit_project_requirements]
  empirical: [reproducible_measurements, production_observations, incident_history]
  methodological: [peer_reviewed_research, maintained_engineering_methods, professional_references]
  discovery_only: [search_snippets, unsourced_blogs, forum_answers, model_generated_explanations, vendor_marketing]
source_precedence:
  rule: precedence_depends_on_claim_type_version_context_and_reproducibility
  conflict_rule: preserve_conflict_then_resolve_or_escalate
freshness_policy:
  version_sensitive_sources: pin_exact_version_when_material
  empirical_evidence: record_environment_workload_date_and_tool_version
  reassessment_triggers: [dependency_or_runtime_version_change, workload_change, architecture_constraint_change, observed_regression, lifecycle_change, SLA_or_cost_change]
conflict_policy: [preserve_material_conflict, separate_normative_from_empirical, prefer_context_matched_reproducibility_for_empirical_disputes, escalate_unresolved_material_conflict]
objectivity_policy: [hard_constraints_before_preferences, technology_preference_is_not_evidence, compare_viable_options_for_material_choices, justify_weights, do_not_generalize_benchmarks, expose_unknowns, preserve_dissent]
decision_evidence_policy:
  D0: local_convention_when_no_higher_property_is_affected
  D1: official_contract_plus_executable_check_and_limitations
  D2: requirements_constraints_alternatives_metrics_cost_resource_risk_and_verification
  D3: apply_stricter_cross_domain_proof_when_triggered
review_policy:
  common_protocol_ref: father/domain-knowledge/PROFESSIONAL_KB_REVIEW_PROTOCOL.yaml
  domain_policy_ref: professional-knowledge/software-engineering/REVIEW_POLICY.yaml
  material_producer_and_final_senior_reviewer_separate: true
  D2_required_roles: [DOMAIN_SPECIALIST, ALTERNATIVES_ANALYST, DECISION_ANALYST, SENIOR_PRACTITIONER_REVIEWER, SKEPTICAL_CRITIC]
  D3_cross_domain_review_required: true
  rule: senior_review_must_attempt_falsification_and_better_alternatives
legacy_material_policy:
  candidate_roots: [algorithms/, architecture/, benchmarks/, build-and-packaging/, concurrency/, data-structures/]
  rule: existing_material_is_candidate_only_until_reclassified_and_provenanced
promotion_plan:
  M1: COMPLETE_BOUNDED
  M2: COMPLETE_BOUNDED
  M3: COMPLETE_BOUNDED_HTTP_RETRY_DECISION_LOGIC
  M4: reproducible_positive_negative_and_adversarial_cases
  M5: independent_bounded_expert_review
