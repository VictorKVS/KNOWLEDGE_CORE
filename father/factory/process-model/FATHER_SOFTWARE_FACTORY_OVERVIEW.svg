<svg xmlns="http://www.w3.org/2000/svg" width="2600" height="860" viewBox="0 0 2600 860">
  <rect width="2600" height="860" fill="#f7fafc"/>
  <style>
    .title{font:700 52px Arial;fill:#0f2b46}.sub{font:28px Arial;fill:#46627b}.stage{rx:18;ry:18;stroke-width:3}.num{font:700 24px Arial;fill:white}.st{font:700 23px Arial;fill:#102f49;text-anchor:middle}.role{font:18px Arial;fill:#34526b;text-anchor:middle}.gate{font:700 16px Arial;fill:#173852;text-anchor:middle}.lbl{font:700 24px Arial;fill:#173852}.ev{font:20px Arial;fill:#284a64}.small{font:16px Arial;fill:#48677d}.arrow{stroke:#294f6b;stroke-width:5;fill:none;marker-end:url(#a)}
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#294f6b"/></marker></defs>
  <text x="1300" y="70" class="title" text-anchor="middle">FATHER Software Factory</text>
  <text x="1300" y="112" class="sub" text-anchor="middle">Этапы проектирования ПО и доказательная аналитика</text>
  <g transform="translate(30,160)">
    <!-- 13 stages -->
    <g id="s1"><rect x="0" y="0" width="180" height="250" class="stage" fill="#dff5e8" stroke="#2a9d55"/><circle cx="30" cy="30" r="24" fill="#2a9d55"/><text x="30" y="38" class="num" text-anchor="middle">01</text><text x="90" y="85" class="st"><tspan x="90">Product</tspan><tspan x="90" dy="28">Discovery</tspan></text><text x="90" y="155" class="role"><tspan x="90">Product Manager</tspan><tspan x="90" dy="24">Business Owner</tspan></text><text x="90" y="225" class="gate">PRODUCT_READY</text></g>
    <g id="s2" transform="translate(195,0)"><rect width="180" height="250" class="stage" fill="#dff5e8" stroke="#2a9d55"/><circle cx="30" cy="30" r="24" fill="#2a9d55"/><text x="30" y="38" class="num" text-anchor="middle">02</text><text x="90" y="85" class="st"><tspan x="90">Security</tspan><tspan x="90" dy="28">Intake</tspan></text><text x="90" y="155" class="role"><tspan x="90">Security Engineer</tspan><tspan x="90" dy="24">Legal / Data</tspan></text><text x="90" y="225" class="gate">SECURITY_INTAKE_READY</text></g>
    <g id="s3" transform="translate(390,0)"><rect width="180" height="250" class="stage" fill="#dff5e8" stroke="#2a9d55"/><circle cx="30" cy="30" r="24" fill="#2a9d55"/><text x="30" y="38" class="num" text-anchor="middle">03</text><text x="90" y="85" class="st"><tspan x="90">System</tspan><tspan x="90" dy="28">Engineering</tspan></text><text x="90" y="155" class="role"><tspan x="90">System Engineer</tspan><tspan x="90" dy="24">+ Security</tspan></text><text x="90" y="225" class="gate">SYSTEM_MODEL_READY</text></g>
    <g id="s4" transform="translate(585,0)"><rect width="180" height="250" class="stage" fill="#dff5e8" stroke="#2a9d55"/><circle cx="30" cy="30" r="24" fill="#2a9d55"/><text x="30" y="38" class="num" text-anchor="middle">04</text><text x="90" y="85" class="st"><tspan x="90">Threat</tspan><tspan x="90" dy="28">Model v0</tspan></text><text x="90" y="155" class="role">Security Engineer</text><text x="90" y="225" class="gate">THREAT_MODEL_V0_READY</text></g>
    <g id="s5" transform="translate(780,0)"><rect width="180" height="250" class="stage" fill="#fff1dc" stroke="#ed7d31"/><circle cx="30" cy="30" r="24" fill="#ed7d31"/><text x="30" y="38" class="num" text-anchor="middle">05</text><text x="90" y="85" class="st"><tspan x="90">Requirements</tspan><tspan x="90" dy="28">Baseline</tspan></text><text x="90" y="155" class="role">Requirements Engineer</text><text x="90" y="225" class="gate">REQUIREMENTS_BASELINE_READY</text></g>
    <g id="s6" transform="translate(975,0)"><rect width="180" height="250" class="stage" fill="#e8eef4" stroke="#7b93a6"/><circle cx="30" cy="30" r="24" fill="#7b93a6"/><text x="30" y="38" class="num" text-anchor="middle">06</text><text x="90" y="85" class="st"><tspan x="90">Architecture</tspan><tspan x="90" dy="28">Options</tspan></text><text x="90" y="155" class="role">Solution Architect</text><text x="90" y="225" class="gate">ARCHITECTURE_OPTIONS_READY</text></g>
    <g id="s7" transform="translate(1170,0)"><rect width="180" height="250" class="stage" fill="#e8eef4" stroke="#7b93a6"/><circle cx="30" cy="30" r="24" fill="#7b93a6"/><text x="30" y="38" class="num" text-anchor="middle">07</text><text x="90" y="85" class="st"><tspan x="90">Architecture</tspan><tspan x="90" dy="28">Decision</tspan></text><text x="90" y="155" class="role"><tspan x="90">Architect + Review</tspan><tspan x="90" dy="24">+ Risk Owner</tspan></text><text x="90" y="225" class="gate">ARCHITECTURE_DECISION_READY</text></g>
    <g id="s8" transform="translate(1365,0)"><rect width="180" height="250" class="stage" fill="#e8eef4" stroke="#7b93a6"/><circle cx="30" cy="30" r="24" fill="#7b93a6"/><text x="30" y="38" class="num" text-anchor="middle">08</text><text x="90" y="85" class="st"><tspan x="90">Detailed</tspan><tspan x="90" dy="28">Design</tspan></text><text x="90" y="155" class="role">Software Architect</text><text x="90" y="225" class="gate">DESIGN_READY</text></g>
    <g id="s9" transform="translate(1560,0)"><rect width="180" height="250" class="stage" fill="#e8eef4" stroke="#7b93a6"/><circle cx="30" cy="30" r="24" fill="#7b93a6"/><text x="30" y="38" class="num" text-anchor="middle">09</text><text x="90" y="100" class="st">Implementation</text><text x="90" y="155" class="role"><tspan x="90">Software Engineer</tspan><tspan x="90" dy="24">DevSecOps</tspan></text><text x="90" y="225" class="gate">IMPLEMENTATION_BASELINE_READY</text></g>
    <g id="s10" transform="translate(1755,0)"><rect width="180" height="250" class="stage" fill="#e8eef4" stroke="#7b93a6"/><circle cx="30" cy="30" r="24" fill="#7b93a6"/><text x="30" y="38" class="num" text-anchor="middle">10</text><text x="90" y="85" class="st"><tspan x="90">Verification</tspan><tspan x="90" dy="28">Validation</tspan></text><text x="90" y="155" class="role">QA + Security</text><text x="90" y="225" class="gate">RELEASE_CANDIDATE_READY</text></g>
    <g id="s11" transform="translate(1950,0)"><rect width="180" height="250" class="stage" fill="#e8eef4" stroke="#7b93a6"/><circle cx="30" cy="30" r="24" fill="#7b93a6"/><text x="30" y="38" class="num" text-anchor="middle">11</text><text x="90" y="85" class="st"><tspan x="90">Release</tspan><tspan x="90" dy="28">Deployment</tspan></text><text x="90" y="155" class="role">Release + Ops</text><text x="90" y="225" class="gate">PRODUCTION_READY</text></g>
    <g id="s12" transform="translate(2145,0)"><rect width="180" height="250" class="stage" fill="#e8eef4" stroke="#7b93a6"/><circle cx="30" cy="30" r="24" fill="#7b93a6"/><text x="30" y="38" class="num" text-anchor="middle">12</text><text x="90" y="85" class="st"><tspan x="90">Operation</tspan><tspan x="90" dy="28">Maintenance</tspan></text><text x="90" y="155" class="role">Service Owner + Ops</text><text x="90" y="225" class="gate">OPERATION_CONTROLLED</text></g>
    <g id="s13" transform="translate(2340,0)"><rect width="180" height="250" class="stage" fill="#e8eef4" stroke="#7b93a6"/><circle cx="30" cy="30" r="24" fill="#7b93a6"/><text x="30" y="38" class="num" text-anchor="middle">13</text><text x="90" y="100" class="st">Retirement</text><text x="90" y="155" class="role">Service + Data Owner</text><text x="90" y="225" class="gate">RETIRED_VERIFIED</text></g>
    <!-- arrows -->
    <path d="M180 125H195" class="arrow"/><path d="M375 125H390" class="arrow"/><path d="M570 125H585" class="arrow"/><path d="M765 125H780" class="arrow"/><path d="M960 125H975" class="arrow"/><path d="M1155 125H1170" class="arrow"/><path d="M1350 125H1365" class="arrow"/><path d="M1545 125H1560" class="arrow"/><path d="M1740 125H1755" class="arrow"/><path d="M1935 125H1950" class="arrow"/><path d="M2130 125H2145" class="arrow"/><path d="M2325 125H2340" class="arrow"/>
  </g>
  <rect x="40" y="470" width="2520" height="280" rx="22" fill="#eef6fd" stroke="#8bbbe6" stroke-width="2"/>
  <text x="80" y="515" class="lbl">Доказательная аналитика каждого этапа</text>
  <g transform="translate(80,555)">
    <text x="0" y="0" class="ev">1. Входные артефакты</text><text x="355" y="0" class="ev">→ 2. Операции и анализ</text><text x="735" y="0" class="ev">→ 3. FACT / CLAIM / UNKNOWN</text><text x="1200" y="0" class="ev">→ 4. Evidence / Source / Conflict</text><text x="1720" y="0" class="ev">→ 5. Review</text><text x="1980" y="0" class="ev">→ 6. Gate Decision</text>
    <text x="0" y="60" class="small">документы • данные • контекст</text><text x="355" y="60" class="small">моделирование • проверки • выявление рисков</text><text x="735" y="60" class="small">классификация утверждений и неопределённости</text><text x="1200" y="60" class="small">происхождение • версия • применимость • противоречия</text><text x="1720" y="60" class="small">профессиональный + независимый</text><text x="1980" y="60" class="small">PASS / CONDITIONAL / BLOCKED / INSUFFICIENT</text>
    <text x="0" y="145" class="lbl">Инварианты:</text><text x="200" y="145" class="ev">Security сразу после Product • FACT ≠ HYPOTHESIS ≠ UNKNOWN • без silent override • residual risk принимает Owner • зрелость только по evidence</text>
  </g>
  <text x="1300" y="820" class="small" text-anchor="middle">FATHER — визуализация является представлением канонических реестров, а не отдельным источником истины</text>
</svg>