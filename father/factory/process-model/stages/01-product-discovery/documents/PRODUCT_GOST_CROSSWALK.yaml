informationItemModel:
  sourceId: GOST-R-58609-2019
  verificationState: SECTION_VERIFIED_SUBCLAUSE_PENDING
  knownSupport:
    - standard defines lifecycle information-item/documentation content model
    - official registry states information items may be combined or divided for project/organizational needs
    - official registry points to sections 7 and 10 for document types/content
  fatherUse: >-
    Product Pack artifacts are canonical information items. They need not be separate Word documents if the same
    required information and traceability are preserved in another approved representation.
  openWork:
    - ingest full standard text
    - bind exact section/subsection numbers for individual information-item types

futureTZInputMapping:
  sourceId: GOST-34-602-2020
  applicability: WHEN_A_FORMAL_TZ_FOR_AUTOMATED_SYSTEM_IS_REQUIRED
  rule: Product provides source information; complete TZ is owned by later Requirements/System/Security collaboration.
  clauseBindings:
    - clauseRef: '4.1'
      contribution: Product information feeds mandatory TZ sections rather than replacing the TZ
    - clauseRef: '4.3'
      contribution: stakeholder/authority/project identifiers and source documents support the future General Information section
    - clauseRef: '4.4,4.4.1,4.4.2'
      contribution: Product Vision and Success Metrics feed goals and purpose
    - clauseRef: '4.5'
      contribution: product/business context contributes to description of the automation object; detailed object/system characterization is refined downstream

qualityRules:
  - exact clause number must have verificationState
  - FATHER internal extension must be labeled FATHER_INTERNAL_CONTROL
  - clause paraphrase must not strengthen the source obligation
  - project applicability must be evaluated before declaring compliance
  - source version/status must be rechecked before material compliance or architecture decision

openWork:
  - ingest full GOST-R-58609-2019 text and replace section-level placeholders with exact subclauses
  - independently review all Product clause mappings
  - add exact source snapshots/hashes to evidence registry
  - propagate mappingIds into individual document sections/fields
