      - ФСТЭК 235
      - ФСТЭК 239
    state: PARTIAL
    note: federal-law and sector overlays remain incomplete

  OTUS_AI_ARCHITECT:
    class: COURSE_METHOD
    priority: P1
    repository: VictorKVS/OTUS-
    lessons: 31
    purpose: method/capability curriculum mapped to FATHER stages
    state: IDENTIFIED

  USER_ARCHITECTURE_LIBRARY:
    class: PROFESSIONAL_BOOK
    priority: P1
    examples:
      - Fundamentals of Software Architecture / Richards & Ford
      - The C4 model for visualising software architecture / Simon Brown
      - Software Architecture: The Hard Parts
      - Building Evolutionary Architectures
      - Documenting Software Architectures
      - Clean Architecture
      - Team Topologies
      - Building Secure & Reliable Systems
    state: PARTIAL
    note: each book must independently pass source verification and idea mapping

  COMPETITOR_UX_REFERENCE:
    class: COMPETITOR_REFERENCE
    priority: P1
    examples:
      - Ardoq
      - IcePanel
      - KNIME
      - Node-RED
      - Camunda/BPMN
      - Structurizr/C4
      - React Flow
    purpose: interaction and visualization patterns only
    state: IDENTIFIED

  SCIENTIFIC_ALGORITHM_EVIDENCE:
    class: SCIENTIFIC_PRIMARY
    priority: P1
    purpose: >-
      Primary or peer-reviewed support for algorithms, metrics, experiments, security evaluation,
      information retrieval, graph analysis, reliability and statistical decision procedures.
    state: DISCOVERED

admissionRules:
  - source identity must be stable enough to cite
  - authority/applicability must be explicit
  - superseded versions must not silently drive current requirements
  - professional/course sources cannot override mandatory applicable requirements
  - translations/summaries do not replace original evidence
  - unsupported claims remain UNKNOWN
  - conflicts are preserved until resolved by correct authority
  - exact clause mapping is required before normative requirements become automated blockers

