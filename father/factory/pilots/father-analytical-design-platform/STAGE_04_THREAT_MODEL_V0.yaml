    - {riskId: RV0-02, scenarioRefs: [TSN-002, TSN-007], assessmentState: REQUIRES_DEPLOYMENT_AND_DATA_POLICY, owner: risk_owner_pending}
    - {riskId: RV0-03, scenarioRefs: [TSN-004, TSN-006], assessmentState: REQUIRES_IAM_AND_ACTION_MODEL, owner: risk_owner_pending}
    - {riskId: RV0-04, scenarioRefs: [TSN-005], assessmentState: REQUIRES_SECRET_HANDLING_DESIGN, owner: risk_owner_pending}
    - {riskId: RV0-05, scenarioRefs: [TSN-008, TSN-010], assessmentState: REQUIRES_RUNTIME_AND_RECOVERY_DESIGN, owner: risk_owner_pending}

