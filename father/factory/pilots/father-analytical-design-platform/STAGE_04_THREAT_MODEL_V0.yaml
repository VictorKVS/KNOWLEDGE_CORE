NEGATIVE_CONSEQUENCE_REGISTER:
  - id: NC-01
    protectedInterestRefs: [PI-01, PI-04, PI-07]
    consequence: material engineering decision is approved, changed or represented as confirmed without accountable authority
    impactState: MATERIAL
  - id: NC-02
    protectedInterestRefs: [PI-02, PI-05, PI-06]
    consequence: sensitive project data, secret or cross-project context is disclosed to an unauthorized party/provider/project
    impactState: MATERIAL
  - id: NC-03
    protectedInterestRefs: [PI-03, PI-07]
    consequence: stale, forged or misattributed evidence drives an incorrect security/compliance/architecture decision
    impactState: MATERIAL
  - id: NC-04
    protectedInterestRefs: [PI-07, PI-08]
    consequence: canonical project knowledge or gate evidence becomes unavailable, corrupted or unrecoverable
    impactState: MATERIAL
  - id: NC-05
    protectedInterestRefs: [PI-01, PI-03, PI-08]
    consequence: candidate/hypothesis/model output is presented as verified truth and becomes a downstream design premise
    impactState: MATERIAL

THREAT_SOURCE_REGISTER:
  - id: TS-01
    sourceClass: UNTRUSTED_EXTERNAL_CONTENT_OR_ACTOR
    assumedCapabilities: [submit_or_influence_project_content]
    evidenceState: CANDIDATE
  - id: TS-02
    sourceClass: AUTHORIZED_USER_OR_INSIDER
    assumedCapabilities: [access_per_role, submit_changes, possible_misuse_or_error]
    evidenceState: CANDIDATE
  - id: TS-03
    sourceClass: COMPROMISED_OR_STALE_EXTERNAL_SOURCE
    assumedCapabilities: [supply_incorrect_or_manipulated_content_or_metadata]
    evidenceState: CANDIDATE
  - id: TS-04
    sourceClass: EXTERNAL_MODEL_OR_CONNECTED_PROVIDER_BOUNDARY
    assumedCapabilities: [receive_data, return_content, become_unavailable_or_misconfigured]
    evidenceState: CONDITIONALLY_RELEVANT
  - id: TS-05
    sourceClass: AGENT_OR_AUTOMATION_OPERATING_BEYOND_AUTHORITY
    assumedCapabilities: [generate_candidate_output, invoke_permitted_workflow_actions]
    evidenceState: OWNER_CONFIRMED_AS_DESIGN_CONCERN
  - id: TS-06
    sourceClass: COMPROMISED_SOFTWARE_OR_SUPPLY_DEPENDENCY
    assumedCapabilities: [affect_runtime_or_processing_if_later_selected]
    evidenceState: DEFER_DETAIL_TO_V1_V2

TRUST_BOUNDARY_REGISTER:
  - id: TB-01
    name: project_or_user_content_to_FATHER
    from: ACT-PROJECT-SOURCE
    to: FN-01
    reason: external/project content becomes system input
  - id: TB-02
    name: FATHER_to_external_model_provider
    from: FN-05
    to: ACT-MODEL
    reason: project context may leave controlled processing boundary
    status: CONDITIONAL
  - id: TB-03
    name: FATHER_to_connected_source_or_repository
    from: FATHER
    to: ACT-CONNECTOR
    reason: external identity/content/action trust boundary
    status: CONDITIONAL
  - id: TB-04
    name: candidate_analysis_to_confirmed_decision
    from: FN-05
    to: FN-06
    reason: model/agent analysis must cross independent review/owner authority before canonical promotion
  - id: TB-05
    name: project_context_to_other_project_or_shared_runtime
    from: project_A
    to: shared_platform_or_project_B
    reason: cross-project/tenant isolation boundary
    status: CONDITIONAL_PENDING_TENANT_MODEL
  - id: TB-06
    name: secret_handling_to_ordinary_context
    from: dedicated_secret_handling
    to: prompt_evidence_artifact_context
    reason: secrets must not cross into ordinary context
    status: PROHIBITED_FLOW_BOUNDARY

