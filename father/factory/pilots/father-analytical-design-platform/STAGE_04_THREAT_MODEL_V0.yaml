SECURITY_DRIVER_REGISTER:
  - {id: SD-01, statement: untrusted content must be distinguishable from trusted system/policy instructions}
  - {id: SD-02, statement: source/content ingestion must preserve provenance and trust state}
  - {id: SD-03, statement: candidate analysis must cross review/authority boundary before canonical promotion}
  - {id: SD-04, statement: data egress to external providers must be policy-controlled by data/project classification}
  - {id: SD-05, statement: provider/model identity and processing boundary must be traceable}
  - {id: SD-06, statement: material source identity version and status must be verifiable}
  - {id: SD-07, statement: stale/superseded source use must be visible and block unsupported current claims}
  - {id: SD-08, statement: agent/tool permissions must enforce role and authority boundaries}
  - {id: SD-09, statement: automation cannot self-approve material decisions or residual risk}
  - {id: SD-10, statement: secrets require dedicated handling and exclusion/redaction from ordinary contexts}
  - {id: SD-11, statement: canonical changes require authorization and traceable version history}
  - {id: SD-12, statement: review state and gate state require tamper-evident auditability}
  - {id: SD-13, statement: project/tenant evidence and retrieval context require isolation}
  - {id: SD-14, statement: canonical evidence/artifact state requires recoverability}
  - {id: SD-15, statement: canonical state integrity must be detectable and reconstructable}
  - {id: SD-16, statement: connected sources require authenticated, bounded and freshness-aware trust handling}
  - {id: SD-17, statement: unavailable/untrusted analysis dependency must produce explicit degraded state, not fabricated certainty}

SECURITY_REQUIREMENTS_DRAFT:
  status: CANDIDATE_FOR_REQUIREMENTS_BASELINE
  requirements:
    - {id: SRD-01, driverRefs: [SD-01], statement: system shall preserve a machine-detectable separation between system/policy instructions and untrusted project/source content}
    - {id: SRD-02, driverRefs: [SD-02], statement: system shall record provenance and trust/evidence state for material ingested sources and content}
    - {id: SRD-03, driverRefs: [SD-03], statement: system shall prevent candidate model/agent output from becoming owner-confirmed canonical state without required review/authority transition}
    - {id: SRD-04, driverRefs: [SD-04], statement: system shall evaluate project/data policy before transmitting project content to an external processing provider}
    - {id: SRD-05, driverRefs: [SD-05], statement: system shall trace provider/model identity for material analytical outputs}
    - {id: SRD-06, driverRefs: [SD-06], statement: system shall preserve source identity version/status and evidence reference for material normative/source claims}
    - {id: SRD-07, driverRefs: [SD-07], statement: system shall expose stale/superseded/unknown source status and shall not silently treat it as current}
    - {id: SRD-08, driverRefs: [SD-08], statement: system shall enforce authorization boundaries for material artifact, gate, review and tool actions}
    - {id: SRD-09, driverRefs: [SD-09], statement: system shall require independent/accountable approval where FATHER governance prohibits self-approval or automated risk acceptance}
    - {id: SRD-10, driverRefs: [SD-10], statement: system shall provide a control path to prevent or remove credentials/secrets from ordinary prompt, trace, evidence and artifact contexts}
    - {id: SRD-11, driverRefs: [SD-11], statement: system shall version and attribute material canonical changes to authenticated actor/process identity}
    - {id: SRD-12, driverRefs: [SD-12], statement: system shall retain review/gate audit evidence sufficient to reconstruct material state transitions}
    - {id: SRD-13, driverRefs: [SD-13], statement: system shall isolate project/tenant evidence, retrieval and canonical state according to the selected tenancy model}
    - {id: SRD-14, driverRefs: [SD-14], statement: system shall support recovery of canonical evidence/artifact state to an approved recoverability objective defined later}
    - {id: SRD-15, driverRefs: [SD-15], statement: system shall detect or surface integrity inconsistencies in canonical state/history}
    - {id: SRD-16, driverRefs: [SD-16], statement: system shall identify connected-source identity/authorization/freshness state for material evidence ingestion}
    - {id: SRD-17, driverRefs: [SD-17], statement: system shall represent unavailable or untrusted analytical dependency state explicitly and shall not fabricate substitute evidence}

SECURITY_RISK_REGISTER:
