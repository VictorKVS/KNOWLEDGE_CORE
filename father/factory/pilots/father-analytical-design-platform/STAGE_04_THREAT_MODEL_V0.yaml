THREAT_MODEL_V0_READY_DECISION:
  decision: CONDITIONAL_PASS
  blockers: []
  openConditions:
    - Requirements Baseline must review and baseline/reject each SRD requirement with verification criteria
    - architecture options must explicitly compare treatment of TSN-001 through TSN-010
    - v1/v2 must refine provider, IAM, tenant, persistence, connector and supply-chain paths after design evidence exists
    - risk owners must be assigned before residual risk can be accepted
    - Legal/Compliance must resolve project-specific applicability before compliance claims
  nextStage: REQUIREMENTS_BASELINE
  ruleRef: father/factory/process-model/stages/04-threat-model-v0/THREAT_MODEL_V0_READY_DECISION_TABLE.yaml
