schemaVersion: 1
pilotId: FATHER-ANALYTICAL-DESIGN-PLATFORM
stage: THREAT_MODEL_V0
status: OWNER_REVIEW
entryDecision: CONDITIONAL_PASS
entryRef: STAGE_03_SYSTEM_ENGINEERING.yaml
threatModelV0ReadyDecision: CONDITIONAL_PASS
threatModelV0ReadyReason: >-
  Material protected interests, logical trust boundaries, early threat sources and ten pre-architecture threat scenarios
  are explicit and traced to the current System Model/Security Intake. The model derives architecture-independent security
  drivers and draft requirements without inventing implementation vulnerabilities or numeric likelihood. Deployment-, IAM-,
  tenant- and provider-specific attack paths remain intentionally deferred to v1/v2 and must be refined after architecture/design evidence exists.

methodology:
  primarySourceRef: FSTEC-METHOD-THREATS-2021
  sourceState: CANDIDATE_REGISTRY_REFERENCE
  rule: source status and project applicability must be rechecked before a material compliance decision
  v0Policy:
    - no_invented_CVE_or_implementation_vulnerability
    - no_numeric_likelihood_without_evidence
    - scenario_must_trace_to_system_path_or_explicit_assumption
    - residual_risk_not_accepted_by_security_engineer

