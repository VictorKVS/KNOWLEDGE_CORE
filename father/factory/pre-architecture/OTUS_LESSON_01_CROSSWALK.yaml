fatherMapping:
  first_client_contact_and_presales:
    roles: [business_owner, product_manager, project_manager, business_analyst, presales_architect_consultant]
    artifacts:
      - CLIENT_REQUEST_INTAKE
      - RFP_INTAKE_REGISTER
      - BUSINESS_NEED
      - STAKEHOLDER_REGISTER
      - DECISION_AUTHORITY_MAP
      - INITIAL_SCOPE_AND_CONSTRAINTS
  vague_idea_to_structured_requirements:
    roles: [product_manager, business_analyst, requirements_engineer]
    artifacts:
      - PRODUCT_VISION
      - PRODUCT_REQUIREMENTS_PRD
      - BUSINESS_REQUIREMENTS
      - REQUIREMENTS_QUESTION_LOG
      - REQUIREMENTS_BASELINE
  hidden_requirements:
    roles: [business_analyst, requirements_engineer, presales_architect_consultant, skeptical_reviewer]
    methods:
      - open_questions
      - business_context_analysis
      - stakeholder_interviews
      - process_analysis
      - contradiction_and_gap_analysis
    artifacts:
      - HIDDEN_REQUIREMENT_CANDIDATES
      - ASSUMPTION_LOG
      - KNOWLEDGE_GAP_REGISTER
      - CONFLICT_REGISTER
  rfp_analysis:
    roles: [business_analyst, presales_architect_consultant, project_manager, finance_procurement]
    artifacts:
      - RFP_ANALYSIS
      - RFP_CLARIFYING_QUESTIONS
      - RFP_RISK_REGISTER
      - DELIVERY_ASSUMPTIONS
      - COMMERCIAL_CONTRACT_CONSTRAINTS
  commercial_model:
    roles: [finance_procurement, project_manager, business_owner, presales_architect_consultant]
    options: [FIXED_PRICE, TIME_AND_MATERIALS, TIME_AND_MATERIALS_WITH_CAP]
    artifacts:
      - CONTRACT_MODEL_DECISION
      - COMMERCIAL_RISK_RATIONALE
      - CHANGE_MANAGEMENT_MODEL
      - UNCERTAINTY_REGISTER
    rule: commercial_model_is_not_selected_by_architect_alone
  architect_presales_role:
    role: presales_architect_consultant
    may:
      - analyze_technical_implications_of_client_request
      - formulate_architecture_relevant_clarifying_questions
      - identify_missing_inputs_and_constraints
      - estimate_uncertainty_and_delivery_risk
      - explain_how_contract_model_changes_required_design_detail_and_change_control
      - support_RFP_response
    cannot:
      - declare_target_architecture_before_FATHER_gates
      - invent_business_legal_security_facts
      - self_approve_material_architecture
    produces:
      - PRESALES_TECHNICAL_QUESTIONS
      - PRESALES_TECHNICAL_RISK_NOTE
      - ARCHITECTURE_INPUT_GAP_REGISTER
      - ESTIMATION_ASSUMPTIONS

