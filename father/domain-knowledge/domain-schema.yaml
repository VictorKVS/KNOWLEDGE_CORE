schema_version: 1
entity: professional_domain
required_layers:
  - sources
  - concepts
  - requirements
  - rules
  - workflows
  - checklists
  - evidence
  - implementations
  - tools
  - risks
  - quality
  - competencies
layers:
  sources:
    includes: [laws, regulations, standards, textbooks, official_documentation, methodologies, research, vendor_guides]
  concepts:
    includes: [definitions, entities, relationships, formulas, assumptions, constraints]
  requirements:
    includes: [mandatory, contractual, standard_based, design, operational]
  rules:
    includes: [decision_rules, applicability, calculations, acceptance_criteria, exceptions]
  workflows:
    includes: [professional_processes, lifecycle, roles, inputs, outputs, approvals]
  checklists:
    includes: [design_review, implementation_review, operations, audit, acceptance, troubleshooting]
  evidence:
    includes: [documents, measurements, logs, calculations, drawings, tests, screenshots, approvals]
  implementations:
    includes: [patterns, reference_architectures, examples, alternatives, anti_patterns]
  tools:
    includes: [software, hardware, instruments, commands, templates]
  risks:
    includes: [hazards, failure_modes, threats, consequences, mitigations]
  quality:
    includes: [verification, validation, testing, peer_review, acceptance, monitoring]
  competencies:
    includes: [knowledge, skills, practical_tasks, learning_paths, assessment]
common_node_pipeline:
  - SOURCE
  - CHUNK
  - ATOMIC_KNOWLEDGE
  - RELATION
  - RULE
  - CHECK
  - EVIDENCE
  - IMPLEMENTATION
  - OUTCOME
traceability:
  rule: Every recommendation produced by Father should be able to trace back to evidence, a professional rule, or an explicitly labeled inference.
