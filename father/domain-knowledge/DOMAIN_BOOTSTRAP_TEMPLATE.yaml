schema_version: 1
template_id: FATHER-PROFESSIONAL-DOMAIN-BOOTSTRAP-1
maturity_model_ref: father/domain-knowledge/PROFESSIONAL_KB_MATURITY_MODEL.yaml
common_doctrine_ref: father/domain-knowledge/PROFESSIONAL_EVIDENCE_DOCTRINE.md
common_decision_contract_ref: father/domain-knowledge/professional-decision-schema.yaml

required_domain_fields:
  - domain_id
  - title
  - logical_knowledge_space_ref
  - canonical_tree
  - maturity
  - scope
  - non_scope
  - ontology
  - source_taxonomy
  - source_precedence
  - freshness_policy
  - conflict_policy
  - objectivity_policy
  - decision_evidence_policy
  - legacy_material_policy
  - promotion_plan

recommended_tree:
  - DOMAIN.yaml
  - SOURCE_POLICY.yaml
  - ROADMAP.yaml
  - sources/
  - claims/
  - requirements/
  - constraints/
  - metrics/
  - patterns/
  - alternatives/
  - decisions/
  - benchmarks/
  - checks/
  - failure-modes/
  - cases/
  - audits/

admission_states:
  - DISCOVERED
  - CANDIDATE
  - ADMITTED
  - REVIEWED
  - VERIFIED
  - SUPERSEDED
  - REJECTED

knowledge_object_separation:
  FACT:
    meaning: observation or source-backed statement
    cannot_imply: recommendation
  INTERPRETATION:
    meaning: bounded professional reading of facts or sources
    requires: assumptions_and_reasoning_summary
  RULE:
    meaning: conditional professional rule with explicit applicability
    requires: provenance_and_limitations
  METRIC:
    meaning: defined measure used for a decision or verification
    requires: definition_unit_purpose_limitations
  PATTERN:
    meaning: reusable solution pattern with context and trade-offs
    requires: applicability_known_forces_failure_modes
  RECOMMENDATION:
    meaning: context-specific candidate disposition
    requires: requirements_constraints_alternatives_evidence
  DECISION:
    meaning: governed selected disposition
    requires: PROFESSIONAL_DECISION_RECORD

quality_rules:
  - do_not_copy_security_semantics_when_domain_evidence_is_different
  - do_not_promote_search_result_blog_or_model_output_directly_to_VERIFIED
  - do_not_use_vendor_marketing_as_independent_comparative_evidence
  - do_not_hide_unknowns_behind_confidence_language
  - do_not_score_options_until_hard_constraints_are_evaluated
  - do_not_use_weighted_scores_without_weight_rationale
  - do_not_claim_objectivity_when_inputs_or_criteria_are materially_unproven
