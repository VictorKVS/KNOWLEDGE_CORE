rules:
  - New domains are added when a Father capability requires a distinct professional evidence base.
  - Cross-domain concepts are linked, not copied as conflicting independent truths.
  - Every domain must expose requirements, constraints, metrics, workflows, checklists, evidence, alternatives, decisions, implementations and competency paths where applicable.
  - Every domain must define its own source taxonomy, source precedence, freshness policy and conflict-handling rules.
  - Material decisions use PROFESSIONAL_DECISION_RECORD and evidence depth proportional to decision materiality D0-D3.
  - Best practice, industry standard, vendor recommendation or model output is not a terminal justification unless its source, applicability and limitations are explicit.
  - Hard legal, contractual, security or safety constraints cannot be overridden by preference scores or business convenience without an explicit governed exception where such exception is legally and organizationally possible.
  - Historical decisions preserve the knowledge/evidence available at decision time; later reassessment supersedes rather than rewrites history.
  - Logical domain identity is stable even if physical repository/path changes later.
  - FATHER consumes domain knowledge through governed routes and cannot silently rewrite VERIFIED domain truth.
