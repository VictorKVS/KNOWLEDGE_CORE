schema_version: 3
purpose: >-
  Registry of professional knowledge bases used by Father. Each domain is built with the same
  evidence-first discipline while retaining domain-specific laws, standards, calculations,
  tools, metrics, constraints and professional practice.
common_doctrine_ref: father/domain-knowledge/PROFESSIONAL_EVIDENCE_DOCTRINE.md
common_decision_contract_ref: father/domain-knowledge/professional-decision-schema.yaml

domains:
