    title: Information and cyber security
    status: IN_PROGRESS
    logical_knowledge_space_ref: KB-SECURITY
    canonical_tree: security-knowledge/
    product_ref: SEC-PROD-0001
    product_roadmap_ref: father/product-roadmap/security-products.yaml
    pipeline: SOURCE -> VERSION -> CHUNK -> ATOMIC CLAIM/REQUIREMENT -> APPLICABILITY -> RELATIONS -> CONTROL -> CHECK -> EVIDENCE -> EXPERT REVIEW
    verified_rule: VERIFIED requires admitted primary source plus exact locator.
    product_value_rule: Retrieval/RAG is a lower layer; authoritative value is the evidence graph and expert-reviewed derivation chain.
    reference_domain_role: first evidence-first implementation pattern for other professional domains
