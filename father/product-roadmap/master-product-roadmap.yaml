schema_version: 1
roadmap_id: ROADMAP-MASTER-0001
title: FATHER / Factory Builder — Master Product Manufacturing Roadmap
status: ACTIVE
canonical_repository: VictorKVS/KNOWLEDGE_CORE

north_star: >-
  Evolve from evidence-grade knowledge and governed digital workers toward a reusable
  factory-of-factories platform that can design, staff, operate, verify and improve
  specialized digital, research and eventually cyber-physical production systems under
  explicit human goals, authority, risk and evidence controls.

operating_principles:
  - Evidence before authority.
  - Reliable before fast at critical boundaries.
  - MVP-first inside a bounded risk envelope.
  - S4 risk is eliminated or technically isolated before the affected maturity path advances.
  - ROLE != AGENT != MODEL != KNOWLEDGE DOMAIN.
  - Factory Builder designs factories; FATHER operates them.
  - Canonical product/domain knowledge lives in KNOWLEDGE_CORE; PX00 consumes it through governed routes.
  - IMPLEMENTED != TESTED != AUDITED != ACCEPTED.
  - Unknown risks are expected and accumulated as institutional memory.
  - Future products may be explored as isolated PoCs but cannot bypass foundational gates.

primary_track:
  track_id: TRACK-SECURITY
  source: OWNER_PRIORITY
  canonical_plan_ref: father/product-roadmap/security-products.yaml
  current_focus: SEC-PROD-0001 / Security Knowledge Base
  hard_rule: >-
    Do not promote downstream security products to authoritative maturity until the
    Security Knowledge foundation reaches the declared expert-ready level for the scope
    that those products depend on.

parallel_tracks:
  - track_id: TRACK-PLATFORM
    name: PX00 / FATHER Runtime and Governance
    source: ARCHITECT_PROPOSED
    repository: VictorKVS/PX00
    purpose: Governed goals, projects, staffing, authority, execution, trace, review, rework and acceptance.
    current_focus:
      - first governed live AI executor
      - first closed FATHER corporate loop
    rule: Platform work must be a direct product dependency, a maturity gate, or critical risk remediation.

  - track_id: TRACK-FACTORY-BUILDER
    name: FATHER Factory Builder
    source: ARCHITECT_PROPOSED
    repository: VictorKVS/PX00
    purpose: Design reusable organizations/factories from capabilities, roles, knowledge, protocols and controls.
    current_focus:
      - governed Agent Factory MVP
      - reusable role/capability/protocol catalog

  - track_id: TRACK-KNOWLEDGE-INFRA
    name: General Knowledge Infrastructure
    source: ARCHITECT_PROPOSED
    repository: VictorKVS/KNOWLEDGE_CORE
    purpose: Reusable provenance, versioning, applicability, evidence and domain knowledge infrastructure.
    rule: Security Knowledge is the first high-rigor proving domain, not a separate incompatible truth system.

  - track_id: TRACK-ASSURANCE
    name: Independent Assurance
    source: ARCHITECT_PROPOSED
    purpose: Socrates, ARGUS, risk gates, architecture tensions and evidence/quality assurance.

future_tracks:
  - track_id: TRACK-SOFTWARE-FACTORY
    name: Software / Service Factory
    entry_gate: stable Agent Factory patterns + closed FATHER work loop
  - track_id: TRACK-RESEARCH-FACTORY
    name: Research Factory
    entry_gate: evidence provenance + reproducibility + independent review
  - track_id: TRACK-CYBER-PHYSICAL
    name: Cyber-Physical / Robotics Factory
    entry_gate: durable digital governance + recovery + physical-safety S4 controls
  - track_id: TRACK-FACTORY-OF-FACTORIES
    name: Generalized Factory Builder
    entry_gate: multiple independently successful factory classes with reusable proven components

execution_order:
  now:
    - Continue factual population of SEC-PROD-0001 in security-knowledge/.
    - Complete FSTEC corpus before broad downstream product promotion.
    - Then complete FSB P0 branch including GosSOPKA/NKCKI/SKZI and revision history.
    - Continue Roskomnadzor, base laws/decrees, sector regulators, GOST, ISO, NIST/CIS/OWASP, vulnerability/threat and vendor-hardening layers in roadmap order.
    - In parallel, finish SUMMIT-FFB-02 first governed live AI executor in PX00; this is not a blocker for Security Knowledge corpus work.
  next:
    - Complete first end-to-end FATHER loop on a security-domain task using governed Security Knowledge.
    - Build a bounded Compliance Engine PoC only on verified Security Knowledge slices.
    - Consolidate repeated requirements into Unified Controls after sufficient corpus accumulation.
  later:
    - Promote Compliance Engine through evidence gates.
    - Build Evidence-Based Security Architect.
    - Build Vulnerability & Risk Expert and lawful Continuous Security Assurance.
    - Build Regulatory Change and Continuous Audit products.
    - Generalize proven patterns into Software and Research factories.
    - Only after digital operational maturity, begin cyber-physical/robotic factory pilots.

portfolio_gates:
  - id: PORTFOLIO-GATE-001
    rule: No foundational dependency bypass.
  - id: PORTFOLIO-GATE-002
    rule: PoC evidence is not MVP or Production evidence.
  - id: PORTFOLIO-GATE-003
    rule: S4 on the active path outranks feature roadmap work.
  - id: PORTFOLIO-GATE-004
    rule: Repeated findings and successful controls become reviewed reusable patterns.
  - id: PORTFOLIO-GATE-005
    rule: Roadmaps never grant FATHER authority to invent human needs or expand its own authority.

review_cadence: AT_EACH_SUMMIT_OR_MATERIAL_NEW_EVIDENCE
